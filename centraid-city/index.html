<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Centraid City</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #070b12;
        --ink: #e8eef6;
        --ink-dim: #93a3b8;
        --ink-faint: #61728a;
        --line: rgba(140, 168, 205, 0.16);
        --line-strong: rgba(140, 168, 205, 0.32);
        --panel: rgba(10, 16, 26, 0.72);
        --panel-solid: #0b1220;
        --accent: #39c5ea;
        --accent-2: #5b7cfa;
        --violet: #8e4ec6;
        --amber: #f5a623;
        --green: #30a46c;
        --red: #e5484d;
        --radius: 14px;
        --mono:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
          Helvetica, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      canvas {
        display: block;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }

      /* ---------- loading ---------- */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(
          120% 90% at 50% 10%,
          #12203a 0%,
          #070b12 60%,
          #04070c 100%
        );
        transition:
          opacity 0.7s ease,
          visibility 0.7s;
      }
      #loading.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .load-mark {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .load-dot {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: var(--accent);
        box-shadow: 0 0 24px var(--accent);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.68);
          opacity: 0.55;
        }
      }
      .load-title {
        font-size: 30px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .load-sub {
        color: var(--ink-dim);
        font-size: 13.5px;
        letter-spacing: 0.01em;
        text-align: center;
        max-width: 36ch;
      }
      #loadMsg {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--accent);
        min-height: 1.3em;
        letter-spacing: 0.02em;
      }
      .load-bar {
        width: min(340px, 64vw);
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      .load-bar i {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 0.35s ease;
      }

      /* ---------- HUD ---------- */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 10px 14px;
        background: linear-gradient(
          180deg,
          rgba(6, 10, 18, 0.92),
          rgba(6, 10, 18, 0.42) 70%,
          transparent
        );
        pointer-events: none;
      }
      #hud > * {
        pointer-events: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
        padding-right: 4px;
      }
      .brand-dot {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        background: var(--accent);
        box-shadow: 0 0 14px var(--accent);
      }
      .brand h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .brand p {
        margin: 1px 0 0;
        font-size: 11px;
        color: var(--ink-faint);
        white-space: nowrap;
      }
      #stats {
        display: flex;
        align-items: stretch;
        gap: 2px;
        flex: 1 1 auto;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        padding: 5px 6px;
        border-radius: 12px;
        background: rgba(9, 14, 24, 0.62);
        border: 1px solid var(--line);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .stat {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 2px 11px;
        flex: 0 0 auto;
        border-right: 1px solid var(--line);
      }
      .stat:last-child {
        border-right: none;
      }
      #stats::-webkit-scrollbar {
        display: none;
      }
      .stat .k {
        font-size: 9.5px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--ink-faint);
        white-space: nowrap;
      }
      .stat .v {
        font-family: var(--mono);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        white-space: nowrap;
      }
      .stat .v u {
        text-decoration: none;
        font-size: 9.5px;
        color: var(--ink-faint);
        margin-left: 2px;
      }
      .stat.hot .v {
        color: var(--amber);
      }
      .stat.bad .v {
        color: var(--red);
      }
      .hud-actions {
        display: flex;
        gap: 6px;
        flex: 0 0 auto;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--line);
        font-size: 12px;
        color: var(--ink-dim);
        white-space: nowrap;
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s,
          transform 0.1s;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--ink);
        border-color: var(--line-strong);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.on {
        background: rgba(57, 197, 234, 0.16);
        border-color: rgba(57, 197, 234, 0.45);
        color: #bfeeff;
      }
      .btn .ic {
        font-size: 13px;
        line-height: 1;
      }

      /* ---------- inspector ---------- */
      #inspector {
        position: fixed;
        top: 64px;
        right: 12px;
        width: 340px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 190px);
        z-index: 22;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: translateX(calc(100% + 20px));
        opacity: 0;
        transition:
          transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.3s;
      }
      #inspector.open {
        transform: none;
        opacity: 1;
      }
      .insp-head {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 14px 14px 10px;
      }
      .insp-swatch {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-top: 5px;
        flex: 0 0 auto;
        background: var(--accent);
      }
      .insp-head h2 {
        margin: 0;
        font-size: 15.5px;
        font-weight: 640;
        letter-spacing: -0.01em;
      }
      .insp-head .sub {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--ink-faint);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .insp-close {
        margin-left: auto;
        color: var(--ink-faint);
        font-size: 16px;
        line-height: 1;
        padding: 2px 4px;
        border-radius: 6px;
      }
      .insp-close:hover {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.07);
      }
      .insp-body {
        padding: 0 14px 14px;
        overflow: auto;
        font-size: 13px;
        line-height: 1.55;
        color: var(--ink-dim);
      }
      .insp-body p {
        margin: 0 0 10px;
      }
      .insp-body p.lede {
        color: var(--ink);
      }
      .insp-sec {
        margin: 14px 0 6px;
        font-size: 9.5px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      .code-ref {
        font-family: var(--mono);
        font-size: 11.5px;
        color: #8fd8ee;
        word-break: break-all;
        background: rgba(57, 197, 234, 0.08);
        border: 1px solid rgba(57, 197, 234, 0.2);
        padding: 7px 9px;
        border-radius: 8px;
        display: block;
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 5px 0;
        border-bottom: 1px dashed var(--line);
      }
      .kv:last-child {
        border-bottom: none;
      }
      .kv b {
        font-weight: 500;
        color: var(--ink-faint);
        font-size: 12px;
      }
      .kv span {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 2px;
      }
      .chip {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 999px;
        color: var(--ink-dim);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--line);
      }
      .chip:hover {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.1);
      }

      /* ---------- tour ---------- */
      /* the chapter card sits on the floor of the viewport: there is no scenario bar under it */
      #tour {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translate(-50%, 24px);
        width: min(460px, calc(100vw - 28px));
        z-index: 23;
        opacity: 0;
        visibility: hidden;
        transition:
          transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.3s,
          visibility 0.3s;
      }
      #tour.open {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
      }
      /* one axis: the dots in the foot are the pages of the chapter you are in. Chapters
   themselves are only ever navigated from the Contents panel. */
      .tour-top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px 0;
      }
      .tour-step {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--accent);
        letter-spacing: 0.06em;
      }
      .tour-top h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 640;
        letter-spacing: -0.01em;
      }
      .tour-top .insp-close {
        margin-left: auto;
      }
      .tour-body {
        padding: 8px 14px 12px;
        font-size: 13.5px;
        line-height: 1.6;
        color: var(--ink-dim);
      }
      .tour-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px 12px;
      }
      .tour-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        flex: 1 1 auto;
      }
      .tour-dots[hidden] {
        display: none;
      }
      .tour-dots button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border-radius: 50%;
      }
      .tour-dots button::before {
        content: "";
        display: block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.16);
        transition:
          background 0.22s ease,
          transform 0.22s ease;
      }
      .tour-dots button:hover::before {
        background: rgba(255, 255, 255, 0.42);
      }
      .tour-dots button[aria-current="true"]::before {
        background: var(--accent);
        box-shadow: 0 0 10px rgba(57, 197, 234, 0.45);
        transform: scale(1.2);
      }

      /* ---------- contents (the table of contents) ---------- */
      #contents {
        position: fixed;
        top: 64px;
        left: 12px;
        width: 312px;
        max-width: calc(100vw - 24px);
        /* floor is the minimap, which the panel sits directly above */
        max-height: max(240px, calc(100vh - 254px));
        z-index: 24;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: translateX(calc(-100% - 20px));
        opacity: 0;
        visibility: hidden;
        transition:
          transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.3s,
          visibility 0.3s;
      }
      #contents.open {
        transform: none;
        opacity: 1;
        visibility: visible;
      }
      .toc-head {
        display: flex;
        align-items: baseline;
        gap: 9px;
        padding: 14px 14px 9px;
      }
      .toc-head h2 {
        margin: 0;
        font-size: 15.5px;
        font-weight: 640;
        letter-spacing: -0.01em;
      }
      .toc-head .count {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-faint);
        letter-spacing: 0.06em;
      }
      .toc-head .insp-close {
        margin-left: auto;
        align-self: flex-start;
      }
      .toc-restart {
        display: flex;
        align-items: center;
        gap: 8px;
        width: calc(100% - 28px);
        margin: 0 14px 10px;
        padding: 8px 10px;
        text-align: left;
      }
      .toc-list {
        list-style: none;
        margin: 0;
        padding: 0 8px 12px;
        overflow-y: auto;
        flex: 1 1 auto;
      }
      .toc-row {
        display: flex;
        gap: 11px;
        width: 100%;
        text-align: left;
        padding: 9px 8px;
        border-radius: 9px;
        border: 1px solid transparent;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .toc-row:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      .toc-num {
        flex: 0 0 auto;
        padding-top: 1px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-faint);
        font-variant-numeric: tabular-nums;
        transition: color 0.15s;
      }
      .toc-text {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .toc-title {
        font-size: 13px;
        line-height: 1.5;
        color: var(--ink-dim);
        transition: color 0.15s;
      }
      .toc-district {
        font-size: 9.5px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      .toc-row:hover .toc-title {
        color: var(--ink);
      }
      .toc-row[aria-current="step"] {
        background: rgba(57, 197, 234, 0.12);
        border-color: rgba(57, 197, 234, 0.38);
      }
      .toc-row[aria-current="step"] .toc-title {
        color: #bfeeff;
      }
      .toc-row[aria-current="step"] .toc-num {
        color: var(--accent);
      }
      /* section headings: a part title in a book — quiet, and never mistaken for a row */
      .toc-sec {
        padding: 14px 8px 5px;
        border-top: 1px solid var(--line);
        margin-top: 6px;
      }
      .toc-sec:first-child {
        padding-top: 2px;
        border-top: none;
        margin-top: 0;
      }
      .toc-sec h3 {
        margin: 0;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      /* ---------- minimap + legal ---------- */
      #minimapWrap {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 21;
        padding: 8px;
        line-height: 0;
      }
      #minimap {
        width: 150px;
        height: 150px;
        border-radius: 8px;
        display: block;
      }
      #legal {
        position: fixed;
        left: 12px;
        bottom: 176px;
        z-index: 19;
        font-size: 10.5px;
        color: var(--ink-faint);
        max-width: 190px;
        line-height: 1.45;
        pointer-events: none;
      }
      #hoverTip {
        position: fixed;
        z-index: 24;
        pointer-events: none;
        padding: 5px 9px;
        border-radius: 8px;
        font-size: 11.5px;
        color: var(--ink);
        background: rgba(8, 13, 22, 0.9);
        border: 1px solid var(--line-strong);
        transform: translate(12px, 12px);
        opacity: 0;
        transition: opacity 0.12s;
        white-space: nowrap;
      }
      #hoverTip.on {
        opacity: 1;
      }
      #hoverTip u {
        display: block;
        text-decoration: none;
        font-size: 10px;
        color: var(--ink-faint);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      #toast {
        position: fixed;
        left: 50%;
        top: 64px;
        transform: translate(-50%, -8px);
        z-index: 25;
        padding: 7px 13px;
        border-radius: 999px;
        font-size: 12px;
        color: var(--ink);
        background: rgba(8, 13, 22, 0.9);
        border: 1px solid var(--line-strong);
        opacity: 0;
        transition:
          opacity 0.25s,
          transform 0.25s;
        pointer-events: none;
        white-space: nowrap;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* narrow: let the stats row drop to its own line instead of being crushed */
      @media (max-width: 1180px) {
        #hud {
          flex-wrap: wrap;
        }
        #stats {
          order: 3;
          flex-basis: 100%;
          width: 100%;
        }
        /* the stats row wraps onto its own line, so everything below it starts lower; the
     tour card also creeps toward the left edge here, so keep the panel shorter */
        #contents {
          top: 108px;
          max-height: max(200px, calc(100vh - 354px));
        }
      }
      @media (max-width: 900px) {
        #inspector {
          top: auto;
          bottom: 80px;
          right: 12px;
          left: 12px;
          width: auto;
          max-height: 46vh;
        }
        #legal {
          display: none;
        }
        #minimapWrap {
          display: none;
        }
        .brand p {
          display: none;
        }
        /* minimap + legal are gone, but the tour card is wide and low here */
        #contents {
          max-height: max(200px, calc(100vh - 324px));
        }
      }
      @media (max-width: 620px) {
        .stat {
          min-width: 64px;
          padding: 2px 8px;
        }
        .btn span.lbl {
          display: none;
        }
        #contents {
          left: 12px;
          right: 12px;
          width: auto;
          max-height: 58vh;
        }
        /* keep the contents label even when the other buttons shed theirs */
        #btnTour span.lbl {
          display: inline;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <div id="hud">
      <div class="brand">
        <div class="brand-dot"></div>
        <div>
          <h1 id="brandTitle">Centraid City</h1>
          <p id="brandSub"></p>
        </div>
      </div>
      <div id="stats"></div>
      <div class="hud-actions">
        <button
          class="btn"
          id="btnTour"
          aria-expanded="false"
          aria-controls="contents"
        >
          <span class="ic">☰</span><span class="lbl">Contents</span>
        </button>
        <button class="btn" id="btnDayNight">
          <span class="ic">☾</span><span class="lbl">Night</span>
        </button>
        <button class="btn" id="btnReset">
          <span class="ic">⌂</span><span class="lbl">Reset view</span>
        </button>
      </div>
    </div>

    <aside id="inspector" class="panel">
      <div class="insp-head">
        <div class="insp-swatch" id="inspSwatch"></div>
        <div>
          <h2 id="inspTitle"></h2>
          <p class="sub" id="inspSub"></p>
        </div>
        <button class="insp-close" id="inspClose" aria-label="Close">✕</button>
      </div>
      <div class="insp-body" id="inspBody"></div>
    </aside>

    <aside id="contents" class="panel" aria-label="Contents">
      <div class="toc-head">
        <h2>Contents</h2>
        <span class="count" id="tocCount"></span>
        <button class="insp-close" id="tocClose" aria-label="Close contents">
          ✕
        </button>
      </div>
      <button class="btn toc-restart" id="tocRestart">
        <span class="ic">▶</span><span>Start from the beginning</span>
      </button>
      <ol class="toc-list" id="contentsList"></ol>
    </aside>

    <section id="tour" class="panel">
      <div class="tour-top">
        <span class="tour-step" id="tourStep"></span>
        <h3 id="tourTitle"></h3>
        <button class="insp-close" id="tourClose" aria-label="Exit tour">
          ✕
        </button>
      </div>
      <div class="tour-body" id="tourBody"></div>
      <div class="tour-foot">
        <button class="btn" id="tourPrev">Prev</button>
        <div
          class="tour-dots"
          id="tourDots"
          role="group"
          aria-label="Pages in this chapter"
          hidden
