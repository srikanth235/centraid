[workspace]
resolver = "3"
# One crate per app, so an edit in an app rebuilds one crate (#1020, Tooling
# coverage). `crates/apps` is a DIRECTORY of crates, so it is excluded below
# (cargo refuses a glob match with no manifest) and each app crate is NAMED
# here: a glob would hide the count, and an explicitly listed member overrides
# the exclusion of its parent.
members = ["crates/*", "crates/apps/kit", "crates/apps/tally"]
exclude = [
  "crates/apps",
  # The v0 byte plane stays where it is as the pinned oracle until wave 6 (#1020).
  "packages/tunnel/data-plane",
  "packages/tunnel/native",
  "apps/web/iroh-wasm",
]

[workspace.package]
version = "1.0.0-alpha.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false
repository = "https://github.com/srikanth235/centraid"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
hex = "0.4"
blake3 = "1.8"
jsonschema = "0.30"
proptest = "1"
# `session` is the log plane's capture mechanism and it requires `bundled`
# (#1020, D-1020-D1-3): the amalgamation is compiled with SQLITE_ENABLE_SESSION
# and the preupdate hook, which a system libsqlite3 almost never carries.
# `hooks` gives the commit/rollback hooks the commit guard needs; `functions`
# the applier's scalar helpers.
rusqlite = { version = "0.40", features = [
  "bundled",
  "session",
  "hooks",
  "functions",
] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is NOT optional here (#1020, D-1020-D1-18). serde_json's
# default float parser is fast and approximate: it can land one ULP away, and
# `crates/vault/tests/properties.rs` found it doing exactly that on a stored
# REAL image (1.2240809751959867e163 came back as …868e163). A log row's images
# are parsed back on every apply, so a drifting REAL is a seat whose latitude,
# or exchange rate, is quietly not the gateway's.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"

# Wave 2 lane C — the schema workspace, the transport-generic protocol, the
# iroh endpoint and the one binary (#1020).
base64 = "0.22"
bytes = "1"
iroh = "1.2"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "io-util",
  "sync",
  "time",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `proptest` is declared above, by lane D3. One entry for the workspace.

# Wave 2 lane R — the byte plane, key custody, backup and recovery (#1020).
# These are the versions `packages/tunnel/data-plane` seals the cross-language
# golden with. The formats are normative (D-1020-R1), so a major bump on any of
# the AEAD/KDF crates is a re-keying event to be proven against
# `contracts/golden/format-golden.json`, never routine housekeeping.
aes-gcm = "0.11"
hkdf = "0.13"
hmac = "0.13"
ryu-js = "1.0.3"
scrypt = "0.12"
subtle = "2"
tempfile = "3"
zstd = "0.13"

# The edit-run loop is the new Hermes (#1020): dependencies optimised once, our crates rebuilt fast.
[profile.dev.package."*"]
opt-level = 2

# THE RELEASE PROFILE (#1020, D-1020-G8). What ships, and what a crash report
# can be read with.
#
# `lto = "thin"` + `codegen-units = 1`: the prebuilt core is one artifact linked
# by three shells, so it is compiled once per triple in CI and never on a
# developer's machine — the cost lands on `releaseBuildSeconds` (the one
# compile-time number a pull request can go red on, so it is measured and not
# assumed) and the benefit lands on every call every shell makes. "thin" rather
# than "fat" because fat LTO's extra few per cent is not worth doubling the one
# number this workspace has a ceiling for.
#
# `panic = "unwind"`, NOT abort, and this is not a size oversight:
# `crates/core-ffi` exports a C ABI, and a panic crossing a C frame with
# `panic = "abort"` takes the host process down — the phone's app, the
# desktop's Electron main, the browser's native host. Unwinding lets the FFI
# boundary catch it and return an error the shell can report. The saving abort
# would buy is a fraction of the artifact; the cost is the shell losing the
# ability to survive a bug in the core.
#
# `debug = "line-tables-only"` + NO `strip` here: a stripped binary with no
# symbol file anywhere is a crash report nobody can read, and #1020 rules a
# symbol file published beside every artifact. Line tables are enough for a
# backtrace with file and line, and they are a fraction of full debuginfo.
# Stripping happens at PACKAGING (`objcopy --only-keep-debug` + `--strip-debug
# --add-gnu-debuglink` in `deploy/docker/Dockerfile` and the `prebuilt-core`
# workflow), so the shipped binary is stripped AND the symbols exist. Setting
# `strip = "debuginfo"` here would throw them away before anything could keep
# them, and `contracts/ledgers/library-size.json` measures the stripped artifact
# either way.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"
strip = false
