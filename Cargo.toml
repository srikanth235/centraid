[workspace]
resolver = "3"
members = ["crates/*"]
# The v0 byte plane stays where it is as the pinned oracle until wave 6 (#1020).
exclude = [
  "packages/tunnel/data-plane",
  "packages/tunnel/native",
  "apps/web/iroh-wasm",
]

[workspace.package]
version = "1.0.0-alpha.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false
repository = "https://github.com/srikanth235/centraid"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"

# The edit-run loop is the new Hermes (#1020): dependencies optimised once, our crates rebuilt fast.
[profile.dev.package."*"]
opt-level = 2
