# DOCUMENTATION ONLY — nothing in this repository runs `buf generate` (#1020,
# D-1020-C5).
#
# The Rust types are generated by `crates/api-proto/build.rs`, which parses the
# tree with `protox` and emits with `prost-build`: there is no `protoc` binary
# on the build machines, and a codegen step that needs one is a step that works
# on one laptop. Keeping the Rust plugin out of this file is deliberate — two
# generators for one language is how the checked-in output and the build output
# drift.
#
# What this file IS for: naming, in one place, what each of the other three
# consumers generates from the same schema, so a lane in wave 3 or 4 does not
# have to rediscover it. When one of those lanes lands, it turns its row below
# into a real plugin entry and a real `buf generate` step in its own build.
#
# | Consumer | Wave / lane | Plugin | Why not here yet |
# | --- | --- | --- | --- |
# | Rust core | wave 2 lane C | prost-build via protox | generated by build.rs, not by buf |
# | Swift (iOS views) | wave 3 lane E | `protoc-gen-swift` (SwiftProtobuf) | the Xcode project lands with the lane |
# | Kotlin (shared module) | wave 3 lane E | `protoc-gen-java` / `protoc-gen-kotlin` | the Gradle build lands with the lane |
# | TypeScript (Electron renderer) | wave 3 lane F | `protoc-gen-es` (protobuf-es) | the renderer lands with the lane |
#
# `version: v2` matches buf.yaml; buf refuses a v1 generate template beside a v2
# workspace, so the version is not decoration.
version: v2
plugins: []
