name: Proposal
description: A fleshed-out change (feature, refactor, or chore) ready for an implementing agent to pick up.
title: "proposal: <short summary>"
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template when a brainstorm has converged on a concrete change. The goal is a handoff an implementing agent (or future you) can act on without re-deriving context.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why now? What problem or observation prompted this? Link prior issues, PRs, or discussions.
      placeholder: |
        Today, users have to do X manually. We noticed this during Y. Related: #123.
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Decision
      description: What did the brainstorming session settle on? Describe the outcome, not the whole transcript.
      placeholder: |
        Add a signed-archive stream to the backup route. Touch:
        - packages/core/src/protocol/routes.ts
        - packages/server/src/routes/backup-routes.ts
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Decides who plans the work and whether an execution plan is expected below. Umbrella issues are worked by a root agent per docs/multi-agent.md — one issue, no child issues, slices are sub-agents and PR waves under it, one receipt.
      options:
        - Single PR — one agent, one focused diff
        - Umbrella — orchestrated across slices and PR waves
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in bounds and out of bounds?
      value: |
        In:
        - 

        Out:
        -
    validations:
      required: true

  - type: textarea
    id: execution-plan
    attributes:
      label: Execution plan
      description: Required for umbrella issues; leave blank for a single PR — the implementing agent plans that itself. Carry what plain dispatch loses — what must not break, which slice owns which files, what has to land before what.
      placeholder: |
        Invariants — must hold at every intermediate commit, not only at the end:
        - Gateway protocol stays wire-compatible with the shipped mobile client.

        Waves — a slice owns files no other in-flight slice touches:
        1. Slice A — packages/core/src/protocol/** — lands the contract. Exit: package typecheck green, no consumers changed yet.
        2. Slice B — packages/server/src/routes/** — consumes the contract. Starts only after A lands.
        3. Slice C — packages/client/** — also depends on A; runs alongside B, no shared files.

        Seams the root re-checks between waves:
        - Contract types in core against their server handlers and client callers.

        Risks:
        - <what could go wrong> → <mitigation, or a deliberate acceptance to record in docs/decisions.md>
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist the implementing agent will ground against. Each item should be independently verifiable at PR review time.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Tests, governance checks, docs, or manual verification that prove completion.
      placeholder: |
        - Unit / integration tests pass
        - Manual check: <what you clicked / ran to confirm>
        - Governance / lint suite green
    validations:
      required: true

  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Unresolved decisions the implementer should flag before coding. Write "None" if settled.
      placeholder: |
        None.
    validations:
      required: true
