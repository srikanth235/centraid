name: Set up the repo toolchain
description: >-
  Node from `.node-version` and Bun from package.json `packageManager` (then `bun install`), and optionally the Rust toolchain `rust-toolchain.toml` pins, with a Cargo cache. Requires actions/checkout to have run first.

inputs:
  bun:
    description: Install Node and Bun and run `bun install --frozen-lockfile`.
    required: false
    default: "true"
  rust:
    description: Install the toolchain `rust-toolchain.toml` pins (channel and components).
    required: false
    default: "false"
  rust-targets:
    description: Extra rustup targets, space-separated.
    required: false
    default: ""
  cargo-cache:
    description: >-
      Cache key for `Swatinem/rust-cache` (registry, git deps, `~/.cargo/bin` and `target/`), or empty for no cache. Restored everywhere, saved only from `main`, so PR branches never fill the 10 GB cache pool (#637).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: bun-version
      if: inputs.bun == 'true'
      shell: bash
      run: |
        set -euo pipefail
        version="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"bun@\([^"]*\)".*/\1/p' package.json | head -1)"
        [ -n "$version" ] || { echo "::error::setup: package.json has no \"packageManager\": \"bun@<version>\" pin"; exit 1; }
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
      with:
        bun-version: ${{ steps.bun-version.outputs.version }}

    - if: inputs.bun == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version

    # No Bun cache: a cold `bun install` is faster than restoring one (#538).
    # Retries ride out transient registry flakes without unpinning the lockfile.
    - if: inputs.bun == 'true'
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          bun install --frozen-lockfile && exit 0
          echo "::warning::bun install failed (attempt ${attempt}); retrying"
          sleep 5
        done
        exit 1

    # `rustup toolchain install` with no argument installs what
    # `rust-toolchain.toml` names, components included, so the channel is
    # stated in exactly one file. Every hosted image ships rustup; putting
    # `~/.cargo/bin` on PATH covers the images that do not (#1075).
    - if: inputs.rust == 'true'
      shell: bash
      env:
        TARGETS: ${{ inputs.rust-targets }}
      run: |
        set -euo pipefail
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup toolchain install
        if [ -n "$TARGETS" ]; then
          # shellcheck disable=SC2086 # a space-separated list, split on purpose
          rustup target add $TARGETS
        fi
        rustc --version

    - if: inputs.cargo-cache != ''
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        shared-key: ${{ inputs.cargo-cache }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
