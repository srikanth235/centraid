# CodeQL path filters for the security.yml jobs (issue #678).
# Product TS/JS/Rust and workflow YAML stay in scope. Tests, scripts, e2e
# harnesses, and the city spike generate most of the dashboard noise
# (incomplete URL sanitization, TOCTOU, command-line construction from CLI args)
# without matching the pairing/relay/vault threat model in SECURITY.md.
name: centraid
paths-ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.js"
  - "**/*.test.mjs"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/tests/**"
  - "**/e2e/**"
  - "**/fixtures/**"
  - "scripts/**"
  - "centraid-city/**"
  - "**/spike-*.mjs"
  - "**/generated/**"
