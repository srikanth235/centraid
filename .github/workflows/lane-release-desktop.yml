name: lane-release-desktop

# A `release.yml` lane, not an independently-triggered workflow (#557) — the
# `lane-` prefix marks that. It used to listen on `v*.*.*` itself, alongside two
# other workflows watching the same tags with no shared notion of whether the
# release as a whole succeeded.
#
# I1–I3, I7, I11 / #501 — package desktop on version tags.
# Signing/notarization is secret-gated. Without enrolled credentials:
#   - jobs still build installers (unsigned scaffolding)
#   - workflow artifacts upload always
#   - GH Release attaches installers only when at least one signing group is present
#     (avoids publishing Gatekeeper/SmartScreen-blocked "official" stable builds)

on:
  workflow_call:
    inputs:
      restamp_rollout_hours:
        description: "I8 re-stamp — set rollout window hours on an existing release (empty = skip)"
        required: false
        default: ""
        type: string
      restamp_tag:
        description: "Tag to restamp (e.g. v0.2.0); required when restamp_rollout_hours is set"
        required: false
        default: ""
        type: string
    # Declared explicitly rather than `secrets: inherit`. Today every workflow in
    # the repo can read every secret; a lane that names what it accepts can only
    # ever receive the signing credentials for its own platform.
    secrets:
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_CODE_SIGNING_ACCOUNT:
        required: false
      AZURE_CERT_PROFILE:
        required: false
      # #842 W6.1/W6.2 — the release signing key, raw 32-byte Ed25519 seed,
      # base64. Distinct from the OS code-signing credentials above: those prove
      # a certificate signed the installer, this proves WHICH RELEASE produced
      # these bytes, and it is the only one the shipped updater checks (the OS
      # check is a no-op on Linux/AppImage). Optional, because no key is
      # enrolled yet; the manifest step guarded-skips loudly without it.
      CENTRAID_RELEASE_SIGNING_KEY:
        required: false

permissions:
  contents: write

jobs:
  package-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run build --filter=@centraid/desktop...
      - name: Package macOS (unsigned when Apple secrets absent)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_API_KEY != '' && 'true' || 'false' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "${APPLE_API_KEY:-}" ]; then
            echo "Apple secrets present — notarization path enabled (I2)"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Apple secrets absent — building unsigned artifacts (scaffolding only)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          bun run dist -- --mac
      - name: Assert shippable mac artifacts
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          mkdir -p release
          ls -la release || true
          # Require at least one dmg and one zip for updater humans path
          test -n "$(find release -maxdepth 1 -name '*.dmg' 2>/dev/null | head -1)" || {
            echo "missing .dmg in release/"
            exit 1
          }
          test -n "$(find release -maxdepth 1 -name '*.zip' 2>/dev/null | head -1)" || {
            echo "missing .zip in release/"
            exit 1
          }
          (cd release && shasum -a 256 * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos
          path: apps/desktop/release/
          retention-days: 14

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run build --filter=@centraid/desktop...
      - name: Package Windows (Azure Trusted Signing when secrets present — I3)
        working-directory: apps/desktop
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        shell: bash
        run: |
          if [ -n "${AZURE_TENANT_ID:-}" ]; then
            echo "Azure Trusted Signing secrets present"
          else
            echo "Azure secrets absent — unsigned NSIS scaffolding"
          fi
          bun run dist -- --win
      - name: Assert shippable Windows artifacts
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ls -la release || true
          test -n "$(find release -maxdepth 1 \( -name '*.exe' -o -name '*.nsis.*' \) 2>/dev/null | head -1)" || {
            echo "missing Windows installer in release/"
            exit 1
          }
          (cd release && sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows
          path: apps/desktop/release/
          retention-days: 14

  package-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run build --filter=@centraid/desktop...
      - name: Package Linux AppImage
        working-directory: apps/desktop
        run: bun run dist -- --linux
      - name: Assert shippable Linux artifacts
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          mkdir -p release
          ls -la release || true
          test -n "$(find release -maxdepth 1 -name '*.AppImage' 2>/dev/null | head -1)" || {
            echo "missing .AppImage in release/"
            exit 1
          }
          (cd release && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux
          path: apps/desktop/release/
          retention-days: 14

  # #842 W6.2 — a release ships a bill of materials, a provenance statement over
  # the real artifact digests, and — once a release key is enrolled — a signed
  # manifest the desktop updater verifies before it will install anything
  # (W6.1). Everything here is a `run:` step calling a repo script, so the job
  # adds no third-party action and no new pin.
  supply-chain:
    needs: [package-macos, package-windows, package-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          path: release-artifacts
          merge-multiple: true
      # Each producing step is re-verified in the same run. A signer whose
      # output nobody checked is how an unverifiable release ships green.
      - name: SBOM + provenance (deterministic — the timestamp is the commit's)
        run: |
          set -euo pipefail
          node scripts/security/supply-chain.mjs sbom --out release-artifacts/sbom.cdx.json
          node scripts/security/supply-chain.mjs verify-sbom --sbom release-artifacts/sbom.cdx.json
          node scripts/security/supply-chain.mjs provenance \
            --artifacts release-artifacts --out release-artifacts/provenance.intoto.json
          node scripts/security/supply-chain.mjs verify-provenance \
            --artifacts release-artifacts --statement release-artifacts/provenance.intoto.json
      - name: Signed release manifest (guarded skip until a release key is enrolled)
        env:
          CENTRAID_RELEASE_SIGNING_KEY: ${{ secrets.CENTRAID_RELEASE_SIGNING_KEY }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node scripts/security/supply-chain.mjs manifest --artifacts release-artifacts --version "$VER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain
          path: |
            release-artifacts/sbom.cdx.json
            release-artifacts/provenance.intoto.json
            release-artifacts/centraid-release-manifest*.json
          retention-days: 90

  github-release:
    needs: [package-macos, package-windows, package-linux, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          # Runs `node scripts/release/changelog-to-github.mjs` only — no
          # node_modules needed, and this job had no install before #557.
          install: "false"
      - name: Detect signing enrollment
        id: sign
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [ -n "${APPLE_API_KEY:-}" ] || [ -n "${AZURE_TENANT_ID:-}" ]; then
            echo "enrolled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enrolled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Changelog body (D3)
        id: body
        run: |
          VER="${GITHUB_REF_NAME#v}"
          VER="${VER%-beta.*}"
          node scripts/release/changelog-to-github.mjs --version "$VER" --out /tmp/release-body.md || \
            echo "Centraid $GITHUB_REF_NAME" > /tmp/release-body.md
          if [ "${{ steps.sign.outputs.enrolled }}" != "true" ]; then
            {
              echo ""
              echo "> **Unsigned scaffolding build** — signing secrets not enrolled."
              echo "> Installers are CI artifacts only until Apple/Azure enrollment completes"
              echo "> (\`docs/enrollment.md\`). Not a Gatekeeper/SmartScreen-trustable release."
            } >> /tmp/release-body.md
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          path: artifacts
      - name: Publish GitHub release (installers only when enrolled)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: /tmp/release-body.md
          prerelease: ${{ contains(github.ref_name, '-beta.') || steps.sign.outputs.enrolled != 'true' }}
          files: ${{ steps.sign.outputs.enrolled == 'true' && 'artifacts/**/*' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  restamp-rollout:
    if: inputs.restamp_rollout_hours != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          # `node scripts/release/restamp-rollout.mjs` + gh only.
          install: "false"
      - name: I8 re-stamp latest*.yml on release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOURS: ${{ inputs.restamp_rollout_hours }}
          TAG: ${{ inputs.restamp_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ] || [ "${TAG}" = "" ]; then
            echo "restamp_tag required when restamping"
            exit 1
          fi
          mkdir -p /tmp/restamp
          # Download updater manifests from the release (stable names only — never beta→latest)
          gh release download "$TAG" -D /tmp/restamp -p 'latest*.yml' || {
            echo "No latest*.yml on release $TAG — nothing to restamp (I8 follow-up after first signed publish)"
            exit 0
          }
          for f in /tmp/restamp/latest*.yml; do
            [ -f "$f" ] || continue
            node scripts/release/restamp-rollout.mjs --hours "$HOURS" --yml "$f"
            gh release upload "$TAG" "$f" --clobber
          done
          echo "Re-stamped rollout window to ${HOURS}h on $TAG (releaseDate adjusted; D5 stable names preserved)"
