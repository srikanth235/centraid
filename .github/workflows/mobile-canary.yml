# governance: allow-toolchain-config issue #890 — the per-merge mobile canary and
# the native-shell prebuild the PR device gate restores from.
name: mobile-canary

# #890 W4 — signal latency matches surface priority. Three tiers, and this is the
# middle one:
#
#   PR gate      ci.yml `mobile-device-gate` — the critical five, ≤12 min warm,
#                blocking. Answers before merge.
#   canary       THIS — the full Android roster on every merge to main.
#                Non-blocking by construction (the merge already happened), so a
#                red canary is a page, not a gate; what it buys is that a
#                regression is attributed to ONE commit instead of a night's
#                worth of them.
#   nightly      e2e.yml — Android depth plus the iOS-only claims.
#
# It also PREBUILDS the caches the PR gate restores from (#890 W1 "build once,
# run many"). A PR that restores a native shell built here pays packaging, not
# compilation; without this job the first PR after every native change would pay
# a ~20-minute cold gradle build inside a 12-minute budget.
#
# Deliberately not a `pull_request` trigger: ci.yml is the only workflow allowed
# to listen on open-PR events (scripts/lint-workflow-pins.mjs rule 5), because a
# path-filtered second PR workflow can never be a required check.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "apps/mobile/**"
      - "packages/client/**"
      - "packages/blueprints/**"
      - "packages/design/**"
      - "packages/core/**"
      - "packages/server/**"
      - "tests/agent-e2e-mobile/**"
      - "tests/agent-e2e-shared/**"
      - ".github/workflows/mobile-canary.yml"
  workflow_dispatch:

# One canary per branch. `cancel-in-progress: false`: a superseded canary still
# banks its native shell, and that cache is what the next PR restores.
concurrency:
  group: mobile-canary-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # A red canary files (and dedupes) a tracking issue the same way the nightly does.
  issues: write

jobs:
  mobile-canary-android:
    runs-on: ubuntu-latest
    # The roster's own budgets (probes / photos / home-apps) are what fail a slow
    # run while evidence can still be written. This backstop must stay above
    # their sum plus a cold release build, because a cancelled job loses every
    # verdict (#557).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      # #892 Phase 0 — `apk_key` folds the embedded Hermes bundle's inputs in on
      # top of the native ones; `hash` stays native-only and keys the gradle
      # build directory. THIS lane is where the apk the PR gate restores is
      # banked, so the two keys must be derived identically here and in ci.yml or
      # the gate can never hit. See the comment on ci.yml's copy for why the
      # native-only key was wrong for a release artifact.
      - name: Fingerprint the Android native build inputs
        id: native_android
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          fp="$(node scripts/native-fingerprint.mjs android)"
          test -n "$fp" || { echo "::error::empty Android fingerprint"; exit 1; }
          js="$(node scripts/js-bundle-fingerprint.mjs)"
          test -n "$js" || { echo "::error::empty JS bundle fingerprint"; exit 1; }
          jdk="$(java -version 2>&1 | head -1 | shasum -a 256 | cut -d' ' -f1)"
          echo "hash=jdk${jdk:0:12}-fp${fp}" >> "$GITHUB_OUTPUT"
          echo "apk_key=jdk${jdk:0:12}-fp${fp}-js${js}" >> "$GITHUB_OUTPUT"
      - name: Install Maestro CLI
        # Same pin as ci.yml and e2e.yml; validate-nightly-wiring.mjs fails when
        # the three disagree.
        env:
          MAESTRO_VERSION: 2.6.1
        run: bash scripts/ci/install-maestro.sh
      - name: Build and start the tokenless mobile test gateway
        run: |
          bun run turbo run build --filter=@centraid/server
          gateway_dir="$RUNNER_TEMP/centraid-mobile-gateway"
          nohup node tests/agent-e2e-mobile/lib/ci-gateway.mjs "$gateway_dir" 18789 > /tmp/centraid-mobile-gateway.log 2>&1 &
          echo "MAESTRO_GATEWAY_URL=http://127.0.0.1:18789" >> "$GITHUB_ENV"
          for attempt in {1..90}; do
            if node tests/agent-e2e-mobile/lib/ci-gateway-ready.mjs http://127.0.0.1:18789; then exit 0; fi
            sleep 2
          done
          cat /tmp/centraid-mobile-gateway.log
          exit 1
      # Restore-then-save (not the one-step action) for the same reason the iOS
      # nightly does it: `actions/cache` declares `post-if: success()`, so on a
      # lane that is currently red the cache never populates and the expensive
      # build is paid on every run — the warm path stays unreachable until the
      # greenness the cache exists to help deliver. The save below runs
      # `if: always()`, which is safe because the key is content-addressed: the
      # artifact is the product of those inputs whether or not a flow passed.
      - name: Restore the built Android app
        id: android_app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/centraid-mobile-e2e-android
          key: android-release-${{ runner.os }}-${{ steps.native_android.outputs.apk_key }}
      - name: Restore the Android gradle build directory
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/mobile/android/app/build
            apps/mobile/android/build
            ~/.gradle/caches
          key: android-gradle-${{ runner.os }}-${{ steps.native_android.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            android-gradle-${{ runner.os }}-${{ steps.native_android.outputs.hash }}-
            android-gradle-${{ runner.os }}-
      - name: AVD cache
        id: avd_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-google_apis-pixel6-r4096-c4-v1
      - name: Create AVD + snapshot (cache miss only)
        if: steps.avd_cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run the full Android roster on the release artifact
        id: emu
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_CACHE_HIT: ${{ steps.android_app.outputs.cache-hit }}
          CENTRAID_MOBILE_BUILD: release
          CENTRAID_MOBILE_LANE: canary-android
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: bash apps/mobile/scripts/android-emulator-roster.sh
      - name: Remove sensitive pairing diagnostics
        if: always()
        run: |
          if [ -d tests/agent-e2e-mobile/runs ]; then
            find tests/agent-e2e-mobile/runs -type d \
              -path '*/maestro-debug/*-configure-gateway' \
              -prune -exec rm -rf {} +
          fi
      # THE POINT OF RUNNING ON MAIN: bank the shell the PR gate restores. Saved
      # `if: always()` so a red canary still leaves the next PR a warm build.
      - name: Save the built Android app
        if: always() && steps.emu.outputs.built == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/centraid-mobile-e2e-android
          key: android-release-${{ runner.os }}-${{ steps.native_android.outputs.apk_key }}
      - name: Save the Android gradle build directory
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/mobile/android/app/build
            apps/mobile/android/build
            ~/.gradle/caches
          key: android-gradle-${{ runner.os }}-${{ steps.native_android.outputs.hash }}-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mobile-canary-runs
          path: tests/agent-e2e-mobile/runs/
          retention-days: 7
          if-no-files-found: ignore
      # A canary is only worth running if somebody learns it went red. Same
      # deduplicating helper the weekly lanes use, so a run of red merges files
      # one issue rather than one per merge.
      #
      # #892 — THIS STEP HAS NEVER FILED AN ISSUE. It passed `--body`, which
      # `scripts/ci/file-tracking-issue.mjs` rejects as an unknown flag, and
      # omitted the required `--search` and `--body-file` entirely, so every red
      # canary since #890 W4 threw on argument parsing inside an `if: failure()`
      # step whose own failure nobody was watching for. Corrected to the
      # documented call shape; the dedupe search string is what makes a run of red
      # merges update one issue instead of opening one per merge.
      - name: File a tracking issue on a red canary
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/mobile-canary.md <<EOF
          The per-merge mobile canary failed on \`${{ github.sha }}\`.

          The regression is attributable to that ONE commit, which is the whole
          reason this lane exists — do not wait for the nightly to re-observe it.
          Evidence: the \`mobile-canary-runs\` artifact on run ${{ github.run_id }}.

          Fix or revert within 24 hours or before the next scheduled run. Prefer
          updating this issue over opening duplicates.
          EOF
          node scripts/ci/file-tracking-issue.mjs \
            --title '[mobile-canary] the Android roster went red on main' \
            --search '[mobile-canary] the Android roster went red' \
            --body-file /tmp/mobile-canary.md \
            --label tech-debt \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
