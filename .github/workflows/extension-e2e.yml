name: Companion e2e

on:
  # Keep the flaky live relay flow off the PR gate; ci.yml covers its static path.
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/extension
      - run: bun run turbo run build --filter=@centraid/server --filter=@centraid/tunnel --filter=@centraid/extension
      - run: xvfb-run --auto-servernum node tests/agent-e2e-pairing/flows/extension-companion.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: companion-e2e-run
          path: tests/agent-e2e-pairing/runs/
          retention-days: 7

  # #557 — the same silent-rot mode #496 E3 closes for nightly e2e and
  # interop-weekly. `companion` is schedule-only (it is deliberately not a PR
  # blocker), so without this a red live-relay lane is visible to nobody:
  # 2026-07-26 09:01Z failed and filed nothing. `cancelled` counts as red.
  companion-failure-issue:
    needs: [companion]
    if: >
      always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && (
        contains(join(needs.*.result, ','), 'failure') ||
        contains(join(needs.*.result, ','), 'cancelled')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or update companion tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.companion.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > /tmp/body.md <<EOF
          Scheduled Companion e2e (live n0-relay) failed.

          - Run: ${RUN_URL}
          - Workflow: extension-e2e / companion
          - Result: \`${RESULT}\`
          - Evidence: run → Artifacts → \`companion-e2e-run\` (7-day retention)

          This lane is environmentally flaky by design and is **not** a PR gate,
          so triage is: confirm it is the relay and not a regression, then either
          fix or note it here. Repeated flake without a note is how the lane rots.

          _Auto-filed by extension-e2e.yml. Prefer updating this issue over opening duplicates._
          EOF
          node scripts/ci/file-tracking-issue.mjs \
            --title '[companion-e2e] live relay lane red — tracking' \
            --search '[companion-e2e] live relay lane red' \
            --body-file /tmp/body.md \
            --label tech-debt \
            --run-url "$RUN_URL"
