name: Companion e2e

on:
  # Live n0-relay companion flow is environmentally flaky and blocks unrelated
  # merges when used as a PR required gate. Keep it on schedule + manual only;
  # PR coverage is the pure-local companion-static job below plus unit tests.
  pull_request:
    paths:
      - 'apps/extension/**'
      - 'apps/web/iroh-wasm/**'
      - 'apps/web/src/generated/**'
      - 'packages/app-engine/**'
      - 'packages/blueprints/apps/locker/**'
      - 'packages/gateway/**'
      - 'packages/tunnel/**'
      - 'packages/vault/**'
      - 'tests/agent-e2e-pairing/**'
      - '.github/workflows/extension-e2e.yml'
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # Pure-local PR gate: extension unit suite + locker companion query handlers.
      # Avoid full blueprints app-boot (jsdom teardown noise unrelated to Companion).
      - run: bunx turbo run build test --filter=@centraid/extension
      - run: bun run --filter @centraid/blueprints test -- src/query-handlers.test.ts

  companion:
    # Live relay path — not a PR merge blocker.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/extension
      - run: bunx turbo run build --filter=@centraid/gateway --filter=@centraid/tunnel --filter=@centraid/extension
      - run: xvfb-run --auto-servernum node tests/agent-e2e-pairing/flows/extension-companion.mjs
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: failure()
        with:
          name: companion-e2e-run
          path: tests/agent-e2e-pairing/runs/
          retention-days: 7

  # #557 — the same silent-rot mode #496 E3 closes for nightly e2e and
  # interop-weekly. `companion` is schedule-only (it is deliberately not a PR
  # blocker), so without this a red live-relay lane is visible to nobody:
  # 2026-07-26 09:01Z failed and filed nothing. `cancelled` counts as red.
  companion-failure-issue:
    needs: [companion]
    if: >
      always() &&
      github.event_name == 'schedule' &&
      github.ref == 'refs/heads/main' &&
      (
        contains(join(needs.*.result, ','), 'failure') ||
        contains(join(needs.*.result, ','), 'cancelled')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Open or update companion tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE='[companion-e2e] live relay lane red — tracking'
          BODY="Scheduled Companion e2e (live n0-relay) failed.

          - Run: ${RUN_URL}
          - Workflow: extension-e2e / companion
          - Result: \`${{ needs.companion.result }}\`
          - Evidence: run → Artifacts → \`companion-e2e-run\` (7-day retention)

          This lane is environmentally flaky by design and is **not** a PR gate,
          so triage is: confirm it is the relay and not a regression, then either
          fix or note it here. Repeated flake without a note is how the lane rots.

          _Auto-filed by extension-e2e.yml. Prefer updating this issue over opening duplicates._"
          existing="$(gh issue list --search 'in:title [companion-e2e] live relay lane red' --state open --json number --jq '.[0].number' || true)"
          if [ -n "${existing:-}" ] && [ "$existing" != "null" ]; then
            if ! gh issue comment "$existing" --body "$BODY"; then
              echo "::error::Failed to comment on companion tracking issue #$existing — run ${RUN_URL}"
              exit 1
            fi
            echo "Updated issue #$existing"
          else
            if ! gh issue create --title "$TITLE" --body "$BODY" --label 'tech-debt'; then
              if ! gh issue create --title "$TITLE" --body "$BODY"; then
                echo "::error::Failed to create companion tracking issue — run ${RUN_URL}"
                exit 1
              fi
            fi
          fi
