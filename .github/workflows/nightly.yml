name: nightly

# What is too slow or too wide for every pull request, once a day on `main`:
#
#   gate           `cargo xtask gate --profile nightly` (the `pr` profile plus
#                  the device lanes, which skip loudly on a hosted runner).
#   mobile-jvm     `cargo xtask gate --profile mobile-jvm`: the Kotlin binding
#                  specs over the real cdylib, then the generated design tables
#                  regenerated and diffed.
#   prebuilt-core  the release binaries for all six triples, so a
#                  cross-compilation break surfaces before a tag does.
#
# All three green moves `refs/candidates/latest`, which is what `release.yml`
# requires a tag to point at.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          cargo-cache: gate
      # The same tools and pins as gate.yml's lanes: one action states them.
      - uses: ./.github/actions/gate-tools
      - run: cargo xtask gate --profile nightly
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: nightly-gate-artifacts
          path: target/xtask/**
          retention-days: 7
          if-no-files-found: warn

  mobile-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          cargo-cache: mobile-jvm
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - run: cargo xtask gate --profile mobile-jvm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: nightly-mobile-jvm-artifacts
          path: |
            target/xtask/**
            mobile/**/build/reports/**
          retention-days: 7
          if-no-files-found: warn

  prebuilt-core:
    uses: ./.github/workflows/lane-prebuilt-core.yml
    with:
      binary-only: true

  # The candidate pointer `release.yml` and `bun run release:prepare` check.
  promote-candidate:
    needs: [gate, mobile-jvm, prebuilt-core]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git push --force origin "${GITHUB_SHA}:refs/candidates/latest"
