name: lane-release-gateway-image

# Reusable optional GHCR release lane; beta builds never move `latest` (#501, #504).

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: current)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Image metadata
        id: meta
        # #557 — `inputs.ref` is free-text and was interpolated straight into
        # the shell, so its value was parsed as script rather than data. It
        # takes repo write access to dispatch this workflow, so this is
        # hardening rather than an open hole, but env indirection costs nothing
        # and keeps the value a string.
        env:
          # release.yml passes '' on a tag push, so a non-empty value can only
          # have come from an operator's manual run.
          INPUT_REF: ${{ inputs.ref }}
        run: |
          REF="${GITHUB_REF_NAME}"
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          fi
          # Normalize refs/tags/vX → vX
          REF="${REF#refs/tags/}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/centraid-gateway"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          TAGS="${IMAGE}:${REF}"
          if [[ "$REF" != *beta* ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # #671 — build+push, then Trivy on the published tag before the lane
      # reports success. Fail closed on CRITICAL/HIGH (see `.trivyignore`).
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
