name: oauth-worker

# Verification runs on main pushes; production deploy additionally requires a
# protected environment and explicit release evidence (#526, #557).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/oauth-worker/**"
      - "packages/server/src/serve/assist-oauth.ts"
      - ".github/workflows/oauth-worker.yml"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: oauth-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run --cwd apps/oauth-worker typecheck
      - run: bun run --cwd apps/oauth-worker test
      - run: bun run --cwd apps/oauth-worker build

  deploy:
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.OAUTH_WORKER_DEPLOY_ENABLED == 'true'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: oauth-production
      url: https://oauth.centraid.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Deploy protected production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --cwd apps/oauth-worker deploy
