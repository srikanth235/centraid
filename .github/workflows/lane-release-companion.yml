name: lane-release-companion

# A `release.yml` lane, not an independently-triggered workflow (#557). Fires on
# the `companion-v*` tag line, a separate product cadence from `v*.*.*`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: bun run --cwd apps/extension test
      - run: bun run --cwd apps/extension typecheck
      - run: bun run --cwd apps/extension package
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: centraid-companion-packages
          path: apps/extension/artifacts/*.zip
          retention-days: 14
