name: lane-release-companion

# Reusable release lane for the separate `companion-v*` tag cadence (#557).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run --cwd apps/extension test
      - run: bun run --cwd apps/extension typecheck
      - run: bun run --cwd apps/extension package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: centraid-companion-packages
          path: apps/extension/artifacts/*.zip
          retention-days: 14
