name: lane-release-mobile

# A `release.yml` lane, not an independently-triggered workflow (#557).

# #501 / J1 / J7 — secret-gated store pipeline scaffold (EAS Build + Submit).
# Human enrollment residual: Expo token, Play upload key, ASC credentials
# (docs/enrollment.md). Never runs `eas update` (J7 store-only routine path).
#
# Default: workflow_dispatch only — does not auto-publish on every desktop tag.

on:
  workflow_call:
    inputs:
      profile:
        description: 'EAS profile (preview = TestFlight/Play internal; production = store)'
        required: true
        type: string
      platform:
        description: 'Platform (all | ios | android)'
        required: true
        type: string
      submit:
        description: 'Submit to TestFlight / Play internal after build'
        required: true
        type: boolean
    secrets:
      EXPO_TOKEN:
        required: false
      EAS_PROJECT_ID:
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mobile-release
    outputs:
      enrolled: ${{ steps.enroll.outputs.enrolled }}
    steps:
      - name: Enrollment probe (no secret values)
        id: enroll
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "${EXPO_TOKEN:-}" ]; then
            echo "enrolled=true" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN present — EAS path enabled"
          else
            echo "enrolled=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN absent — scaffold-only (no submit)"
          fi

  # Scaffold path: assembleDebug only (no store submit). Proves tree builds.
  android-assemble-scaffold:
    if: needs.probe.outputs.enrolled != 'true' && (inputs.platform == 'all' || inputs.platform == 'android')
    needs: [probe]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: assembleDebug (scaffold — no release signing)
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - run: echo "Scaffold only. Enroll EXPO_TOKEN + store secrets to enable EAS submit (docs/enrollment.md)."

  eas-build:
    if: needs.probe.outputs.enrolled == 'true'
    needs: [probe]
    runs-on: ubuntu-latest
    environment: mobile-release
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.platform == 'all' && fromJSON('["ios","android"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: expo/expo-github-action@04c13d00e429d099d9cffcc5370d54ab38675069 # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS build (${{ matrix.platform }} / ${{ inputs.profile }})
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          # #557 — dispatch inputs reach the shell as env vars, not as
          # interpolated script text. `profile` is a `type: choice` so its
          # values are already constrained, but the pattern should be uniform
          # across the repo rather than "safe because of a schema elsewhere".
          EAS_PROFILE: ${{ inputs.profile }}
          EAS_PLATFORM: ${{ matrix.platform }}
          # Do NOT run eas update — J7 dormant OTA only
        run: |
          eas build --platform "$EAS_PLATFORM" \
            --profile "$EAS_PROFILE" \
            --non-interactive \
            --no-wait || eas build --platform "$EAS_PLATFORM" \
            --profile "$EAS_PROFILE" \
            --non-interactive
      - name: EAS submit (optional)
        # `workflow_call` typed this input as a real boolean; the dispatch form
        # it replaced delivered the string 'true', so the old `== 'true'`
        # comparison would now be permanently false — a store submit that
        # silently never happens.
        if: inputs.submit
        working-directory: apps/mobile
        env:
          EAS_PROFILE: ${{ inputs.profile }}
          EAS_PLATFORM: ${{ matrix.platform }}
        run: |
          eas submit --platform "$EAS_PLATFORM" \
            --profile "$EAS_PROFILE" \
            --latest \
            --non-interactive
