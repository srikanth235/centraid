name: lane-release-mobile

# A `release.yml` lane (dispatch with `surfaces: mobile`): the native projects
# under `mobile/`, a Gradle build for Android and an XcodeGen + Xcode build for
# iOS — the same builds a contributor runs locally. Without the signing secrets
# it builds unsigned and submits nothing (docs/enrollment.md).

on:
  workflow_call:
    inputs:
      profile:
        description: "preview = TestFlight/Play internal; production = store"
        required: true
        type: string
      platform:
        description: "Platform (all | ios | android)"
        required: true
        type: string
      submit:
        description: "Submit to TestFlight / Play internal after build"
        required: true
        type: boolean
    secrets:
      # THE NATIVE PATH'S OWN SECRETS. One set per lane, declared here rather
      # than inherited, per `docs/release.md`'s rule. Absent means
      # scaffold-only: the build runs, nothing is signed, nothing is submitted.
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
      APPLE_API_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  # THE ENROLMENT PROBE PRINTS NO SECRET VALUE, only whether one is present.
  # It keeps "scaffolded" and "enrolled" two visible states rather than one
  # silent one.
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mobile-release
    outputs:
      android_signed: ${{ steps.enroll.outputs.android_signed }}
      ios_signed: ${{ steps.enroll.outputs.ios_signed }}
    steps:
      - name: Enrolment probe (no secret values)
        id: enroll
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "android_signed=true" >> "$GITHUB_OUTPUT"
            echo "Android upload key present - release signing enabled"
          else
            echo "android_signed=false" >> "$GITHUB_OUTPUT"
            echo "Android upload key absent - assembleDebug only (docs/enrollment.md)"
          fi
          if [ -n "${APPLE_API_KEY_ID:-}" ]; then
            echo "ios_signed=true" >> "$GITHUB_OUTPUT"
            echo "App Store Connect key present - archive enabled"
          else
            echo "ios_signed=false" >> "$GITHUB_OUTPUT"
            echo "App Store Connect key absent - simulator build only (docs/enrollment.md)"
          fi

  android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    needs: [probe]
    runs-on: ubuntu-latest
    environment: mobile-release
    timeout-minutes: 60
    env:
      # Dispatch inputs reach the shell as env vars, never as interpolated
      # script text (#557).
      CENTRAID_MOBILE_PROFILE: ${{ inputs.profile }}
      ANDROID_SIGNED: ${{ needs.probe.outputs.android_signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          # AGP 9 requires JDK 17+; `mobile/*/build.gradle.kts` declares
          # `jvmToolchain(21)`.
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      # THE PREBUILT CORE. The AAR carries `libcentraid_core_ffi.so` for the
      # four Android ABIs and is published by `lane-prebuilt-core.yml` (lane G)
      # with its build identity stamped in. A release build that compiled the
      # core itself would be a second artifact with a second digest, and the
      # shell's `ArtifactIdentity` check exists to refuse exactly that.
      - name: Fetch the prebuilt core AAR
        run: |
          echo "OWNER HAND-OFF: lane-prebuilt-core.yml publishes the AAR; this step"
          echo "downloads it with its SHA256SUMS and refuses on a mismatch. It is a"
          echo "placeholder until the first prebuilt-core release exists"
          echo "(mobile/README.md -> The other hand-offs)."

      - name: Build
        working-directory: mobile
        run: |
          if [ "${ANDROID_SIGNED}" = "true" ]; then
            ./gradlew -Pcentraid.android=true :androidApp:bundleRelease --no-daemon
          else
            ./gradlew -Pcentraid.android=true :androidApp:assembleDebug --no-daemon
            echo "Scaffold only. Enrol the upload key to build a signed bundle."
          fi

      - name: Submit to Play internal
        if: inputs.submit && needs.probe.outputs.android_signed == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "OWNER HAND-OFF: the Play upload needs a service account and one"
          echo "successful manual upload first (docs/enrollment.md)."

  ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    needs: [probe]
    runs-on: macos-15
    environment: mobile-release
    timeout-minutes: 90
    env:
      IOS_SIGNED: ${{ needs.probe.outputs.ios_signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      # ONE TOOLCHAIN FILE, READ AND NOT RETYPED. `.xcode-version` is the pin
      # nix cannot carry, and this is the only place CI reads it.
      - name: Select Xcode
        run: |
          version="$(cat .xcode-version)"
          echo "Selecting Xcode ${version}"
          sudo xcode-select --switch "/Applications/Xcode_${version}.app" ||
            echo "OWNER HAND-OFF: ${version} is not on this runner image."

      # THE CORE'S STATIC LIBRARY, built for the iOS slices the project links
      # (`iosApp/CoreBridge` maps its header to `CentraidCoreC`). There is no
      # Kotlin framework in the app any more (#1135).
      - name: Build the core's iOS slices
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          mobile/scripts/ios-core.sh

      # `protobuf` and `swift-protobuf` are `protoc` and `protoc-gen-swift`.
      # `xcodegen generate` runs `mobile/scripts/generate-swift-protos.sh` first
      # (`project.yml`'s `options.preGenCommand`, because the target globs
      # `Sources/Generated`), and the app target's pre-build phase runs it again
      # when a `.proto` is newer than its output.
      - name: Generate the Xcode project
        working-directory: mobile/iosApp
        run: |
          brew install xcodegen protobuf swift-protobuf
          CENTRAID_IOS_DEPLOYMENT_TARGET="$(cat ../ios-deployment-target)" \
            xcodegen generate

      - name: Build
        working-directory: mobile/iosApp
        run: |
          if [ "${IOS_SIGNED}" = "true" ]; then
            xcodebuild -scheme Centraid -destination 'generic/platform=iOS' archive \
              -archivePath build/Centraid.xcarchive
          else
            xcodebuild -scheme Centraid \
              -destination 'platform=iOS Simulator,name=iPhone 16' build
            echo "Scaffold only. Enrol the App Store Connect key to archive."
          fi

      - name: The fixture test - one fixture, two languages
        working-directory: mobile/iosApp
        run: |
          # The SwiftUI shell's unit tests, the first machine in the pipeline
          # that can run them.
          # A SIMULATOR BUNDLE, NOT `swift test`: `Sources/` imports UIKit.
          xcodebuild -scheme Centraid \
            -destination 'platform=iOS Simulator,name=iPhone 16' test

      - name: Submit to TestFlight
        if: inputs.submit && needs.probe.outputs.ios_signed == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "OWNER HAND-OFF: the TestFlight upload needs an App Store Connect"
          echo "key and one successful manual upload first (docs/enrollment.md)."
