name: release-gateway-image

# #501 / #504 — optional GHCR image for centraid-gateway (D5: never move latest on beta).
# Build uses monorepo-root Dockerfile (native tunnel + operator-safe defaults).
# Primary install path remains monorepo source + H5 service install.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (default: current)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Image metadata
        id: meta
        # #557 — `inputs.ref` is free-text and was interpolated straight into
        # the shell, so its value was parsed as script rather than data. It
        # takes repo write access to dispatch this workflow, so this is
        # hardening rather than an open hole, but env indirection costs nothing
        # and keeps the value a string.
        env:
          INPUT_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          REF="${GITHUB_REF_NAME}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          fi
          # Normalize refs/tags/vX → vX
          REF="${REF#refs/tags/}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/centraid-gateway"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          TAGS="${IMAGE}:${REF}"
          if [[ "$REF" != *beta* ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
