name: lane-client-e2e

# A `ci.yml` lane, not an independently-triggered workflow (#557) — the `lane-`
# prefix marks that. Kept in its own file rather than inlined because three jobs
# of Playwright/keyring setup would dominate ci.yml; the small lanes (docs,
# web-build, iroh-wasm, companion-static, oauth-worker) are jobs there instead.
# L1 / E2 — path-filtered client e2e on PRs. Full suites stay on nightly e2e.yml.
# Promotion rule: if a nightly-only area burns us twice, move it here.

on:
  workflow_call:
    inputs:
      web:
        description: Run the web e2e suite (apps/web or shared client changed).
        required: true
        type: boolean
      desktop:
        description: Run the desktop e2e suite (apps/desktop or shared client changed).
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  web-e2e:
    if: inputs.web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # #496 C2 — Turbo/Cargo caches (shared with ci.yml through the composite)
      # so cold installs are rare.
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
          cargo-cache: iroh-wasm
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Ensure Iroh WASM toolchain
        run: bash scripts/ci/ensure-iroh-wasm-toolchain.sh
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run build
      - run: bun run e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: web-e2e-pr-traces
          path: apps/web/test-results/
          retention-days: 7

  desktop-e2e:
    if: inputs.desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
          cargo-cache: iroh-wasm
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Ensure Iroh WASM toolchain
        run: bash scripts/ci/ensure-iroh-wasm-toolchain.sh
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: bun run build
      # #659 R3d — apps/desktop/dist/renderer is built on every desktop-touching
      # PR and was never weighed. Ceilings live in
      # tests/experience-budgets/desktop.json and are tighten-only.
      - name: Weigh the shipped desktop renderer
        run: bun run perf:app-weight -- --surface desktop
      - run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-1-0 libsecret-tools dbus-x11
      - run: |
          xvfb-run --auto-servernum dbus-run-session -- bash -c '
            rm -rf ~/.local/share/keyrings
            printf "\n" | gnome-keyring-daemon --replace --components=secrets --unlock --foreground &
            sleep 2
            bun run test:e2e
          '
        working-directory: apps/desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: desktop-e2e-pr-traces
          path: apps/desktop/test-results/
          retention-days: 7

  # #892 Phase 1 — `boot-smoke` MOVED to ci.yml's `verify` job. It was 4m38s of
  # build and ~0s of assertion: an L2 structure check over a dist it did not need
  # to produce itself. `verify` already runs `bun run build`, which is a superset
  # of the `@centraid/desktop...` closure this used, so the assertion now costs
  # nothing and — because `verify` is unfiltered — it also runs on PRs that never
  # woke the `client` filter at all. That is strictly more coverage than the #496
  # E7 arrangement it replaces, which was itself written to make sure a
  # gateway-only change could not skip it.
