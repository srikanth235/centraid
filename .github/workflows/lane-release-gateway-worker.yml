name: lane-release-gateway-worker

# THE HOSTED ADAPTER'S BUILD AND DEPLOY ([#1029](https://github.com/srikanth235/centraid/issues/1029) §3).
#
# A `release.yml` lane, not an independently-triggered workflow (#557), and a
# `workflow_call` so that the single-open-PR-entry-point rule in
# `scripts/lint-workflow-pins.mjs` holds: `gate.yml` stays the only thing a pull
# request triggers.
#
# WHY THIS IS NOT A STEP OF `cargo xtask gate`. `gateway/cloudflare` is its own
# cargo workspace, compiles only to `wasm32-unknown-unknown`, and needs a second
# several-hundred-crate dependency tree. Putting it inside the PR gate would add
# minutes to every pull request in the repository to prove something only a
# gateway change can break. It runs here, on the ref that is about to ship, and
# the conformance job is what makes that safe: the shared suite runs against the
# Worker under Miniflare BEFORE anything is deployed.
#
# DEPLOY IS GUARDED BY A SECRET. With no `CLOUDFLARE_API_TOKEN` the deploy job
# does not run and the build and conformance jobs still do — which is the state
# this repository is in until the owner creates the account (see
# `gateway/cloudflare/README.md`, "Known gaps"). A workflow that failed for a
# missing account would be a workflow nobody could keep green.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: current)"
        required: false
        default: ""
        type: string
      deploy:
        description: "Deploy after the suite passes"
        required: false
        default: false
        type: boolean
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: wasm build and the shared suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      # `toolchain:` is spelled out because the action reads it from its own
      # ref and a SHA pin has none — it exits 1 before installing anything.
      # `scripts/lint-workflow-pins.mjs` is what catches a pin without it.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # NO `setup-node`. The runner already carries a Node new enough for
      # `wrangler`, and this lane needs no particular version — a pin here would
      # be a second place to keep in step with `.github/actions/setup`.

      # THE HOST HALF FIRST, because it is seconds and it is where the presigner,
      # the receipt interpretation and the error body's companions are tested.
      - name: The pure halves, on the host
        working-directory: gateway/cloudflare
        run: cargo test --locked

      # THE SCANS. `no_rules_here.rs` is the claim that this adapter reimplements
      # no rule; it reads source as text, so it runs here rather than needing a
      # Worker.
      - name: No rule is reimplemented in this adapter
        working-directory: gateway/cloudflare
        run: cargo test --locked --test no_rules_here

      - name: The Worker builds for wasm32
        working-directory: gateway/cloudflare
        run: cargo check --locked --target wasm32-unknown-unknown

      # THE SHARED SUITE, under Miniflare, against a real Durable Object and a
      # real local R2 bucket. `conformance::run` is `crates/gateway-core`'s and
      # this is one of its three callers.
      - name: The conformance suite under Miniflare
        working-directory: gateway/cloudflare
        run: node scripts/conformance.mjs

  deploy:
    name: deploy
    needs: build
    # The suite has to have passed, the caller has to have asked, and the
    # account has to exist. All three, and the third is why this is an `if` and
    # not a failure.
    if: ${{ inputs.deploy && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hosted-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      # `toolchain:` is spelled out because the action reads it from its own
      # ref and a SHA pin has none — it exits 1 before installing anything.
      # `scripts/lint-workflow-pins.mjs` is what catches a pin without it.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # NO `setup-node`. The runner already carries a Node new enough for
      # `wrangler`, and this lane needs no particular version — a pin here would
      # be a second place to keep in step with `.github/actions/setup`.
      - name: Refuse to deploy without an account
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN. This repository has no hosted account yet; see gateway/cloudflare/README.md." >&2
            exit 1
          fi
      - name: Deploy
        working-directory: gateway/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy
