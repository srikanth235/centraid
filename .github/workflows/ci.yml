# governance: allow-toolchain-config issue #637 — turbo-cache on mutation-pr;
# setup-gradle on mobile-smoke (deps only; read-only off main).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # #557 — five of the folded workflows carried their own `workflow_dispatch`.
  # Preserved here: on a manual run the `changes` filter has no diff to read, so
  # `all` below forces every lane on.
  workflow_dispatch:

# Cancel superseded PR runs so stacked pushes do not queue ~18 min serial jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ci.yml is the ONLY workflow that listens on `pull_request` (#557). Everything
# a PR must satisfy is a job here, so all of it rolls up into the single
# required `check`.
#
# Before this, ten workflows each listened on `pull_request` independently. To
# stay affordable each carried its own `paths:` filter — and that is precisely
# what made them unrequirable: a workflow filtered out of a PR reports no
# status, and a required check that never reports blocks the PR forever. So
# eight lanes (web, docs, iroh-wasm, gateway-package, client-e2e, companion,
# oauth-worker, dependency-review) could go red with the merge button still
# green. As path-gated *jobs* they skip cleanly — GitHub counts a skipped job as
# satisfied — and `check` aggregates them explicitly.
#
# Two lanes are big enough to keep their own file and are invoked with
# `workflow_call`; the rest are jobs below. Deploys stay OUT of here: they own
# their own secrets and environments (see web.yml, oauth-worker.yml, release-*),
# and merging those into one file would put every publishing credential in one
# blast radius.
#
# Wall-clock plan: static (format/lint/typecheck) and verify (build/tests/
# coverage) run in parallel, alongside whichever path-gated lanes the diff woke.
# Each uses turbo's GitHub-backed remote cache (+ Cargo cache on verify) so warm
# PR pushes skip cold tsc/cargo.
jobs:
  # One paths-filter table for the whole repo. Previously these globs lived in
  # six `on: paths:` blocks with 20 lines duplicated verbatim between each
  # file's push: and pull_request: halves.
  #
  # #892 Phase 3 — THIS TABLE IS LOAD-BEARING AND IS NOW LINTED. `check` treats
  # `skipped` as a pass (that is what makes a path-gated lane requirable at all),
  # so a path no filter names wakes no lane and merges green, unexercised — #890
  # W0 fixed one instance of that by hand. `bun run lint:path-filters` inverts the
  # table: every workspace package, app and tracked top-level directory must be
  # claimed here or ledgered in tests/path-filter-ledger.json with the always-on
  # job that covers it. It also refuses duplicates, which is how the table looked
  # when the check was written — `packages/server/**` four times inside `gateway`,
  # twice inside `client` and twice inside `extension`, and `packages/core/**`
  # twice inside `gateway`. Those are removed below; the SET each filter matches
  # is unchanged.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # A manual run has no diff for paths-filter to read, so every READ of a
      # filter output also accepts `all`. Lanes stay explicit about this rather
      # than the filter lying about what changed. "Every read", not "every lane
      # `if:`" — which is how this was worded, and how `client-e2e`'s two `with:`
      # inputs came to be the one pair without the fallback. `lint:path-filters`
      # checks the reads now instead of the wording promising it.
      all: ${{ github.event_name == 'workflow_dispatch' }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      client: ${{ steps.filter.outputs.client }}
      gateway: ${{ steps.filter.outputs.gateway }}
      docs: ${{ steps.filter.outputs.docs }}
      iroh-wasm: ${{ steps.filter.outputs.iroh-wasm }}
      extension: ${{ steps.filter.outputs.extension }}
      oauth-worker: ${{ steps.filter.outputs.oauth-worker }}
      mobile: ${{ steps.filter.outputs.mobile }}
      design: ${{ steps.filter.outputs.design }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        # Skipped on manual runs — there is no base to diff against, and `all`
        # above already forces every lane on.
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/client/**'
              - 'packages/blueprints/**'
              - 'packages/design/**'
            desktop:
              - 'apps/desktop/**'
              - 'packages/client/**'
              - 'packages/blueprints/**'
              - 'packages/design/**'
            # #496 E7 — gateway/app-engine changes break artifact boot without
            # client UI edits; boot-smoke must still run for those PRs.
            client:
              - 'apps/web/**'
              - 'apps/desktop/**'
              - 'packages/server/**'
              - 'packages/client/**'
              - 'packages/blueprints/**'
              - 'packages/design/**'
            gateway:
              - 'packages/server/**'
              - 'packages/core/**'
              - 'packages/cli/**'
              - 'packages/vault/**'
              - 'packages/backup/**'
              - 'packages/blueprints/**'
              - 'packages/tunnel/**'
              - 'packages/design/**'
              # #781 — the recognition automations the packaged gateway ships
              # under packages/blueprints/automations are BUILT from
              # packages/model-runtime/automation-handlers, so a source-only
              # change there still changes what the artifact runs. Listed with
              # the other engine packages for the same reason they are.
              - 'packages/model-runtime/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'flake.nix'
              - 'scripts/gateway-package/**'
            docs:
              - 'docs/**'
              - 'scripts/docs-site/**'
              - 'scripts/home-site/**'
              - 'centraid-city/**'
            iroh-wasm:
              - 'apps/web/iroh-wasm/**'
              - 'apps/web/scripts/build-iroh-wasm.sh'
              - 'apps/web/src/generated/**'
            extension:
              - 'apps/extension/**'
              - 'apps/web/iroh-wasm/**'
              - 'apps/web/src/generated/**'
              - 'packages/server/**'
              - 'packages/blueprints/apps/locker/**'
              - 'packages/tunnel/**'
              - 'packages/vault/**'
              - 'tests/agent-e2e-pairing/**'
            oauth-worker:
              - 'apps/oauth-worker/**'
              - 'packages/server/src/serve/assist-oauth.ts'
            # #587 E22/F26/F27 — Bun workspace resolution means a root-only
            # dependency change can break Metro or the committed native trees.
            mobile:
              - 'package.json'
              - 'bun.lock'
              - 'apps/mobile/**'
              - 'packages/client/**'
              - 'packages/blueprints/**'
              - 'packages/design/**'
              - '.github/workflows/ci.yml'
              # #890 W0 — editing a Maestro flow, the harness, or the workflow
              # that schedules them used to trigger NO mobile lane at all: the
              # filter listed only product source, so a change to the test layer
              # of the primary surface was merged unexercised. The device gate
              # (`mobile-device-gate`) and `mobile-smoke` both key on this
              # filter, so both must see a flow edit.
              - 'tests/agent-e2e-mobile/**'
              - 'tests/agent-e2e-shared/**'
              - '.github/workflows/e2e.yml'
            # #781 — everything `bun run design:gallery` reads. #799 widened
            # it: the lane no longer renders a fixture, it BUILDS AND DRIVES
            # `apps/web` and photographs the shell's own `#ui-preview`
            # gallery, so the web host and the React block library it renders
            # are inputs now. (The blueprint app manifests are no longer:
            # the served-app lane that captured them is gone.)
            design:
              - 'packages/design/**'
              - 'packages/client/src/react/ui/**'
              - 'packages/client/src/react/boot.tsx'
              - 'apps/web/**'
              - 'scripts/design-gallery.mjs'
              - 'scripts/design-gallery-lowering.mjs'
              - 'tests/design-gallery/**'
              - 'tests/design-grammar-matrix.json'

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
          cargo-cache: data-plane
      # E5 — https-only / integrity markers on the lockfile (supply-chain gate).
      - run: bun run lockfile:lint
      # Asserts .node-version is exact semver, engines.node agrees with it, and
      # — because CI is the only place the claim is meaningful — that the runner
      # is actually on the pinned version. It warns instead of failing locally
      # (#668), so this step is the enforcing copy.
      - run: bun run lint:node-version
      - run: bun run format:check
      # `--format github` emits inline PR annotations on the offending lines.
      - run: bun run lint -- --format github
      # Monorepo package.json hygiene: unused/undeclared deps, version drift
      # across workspaces, misplaced @types (sherif). Fast, offline.
      - run: bun run lint:packages
      # GitHub Actions workflow linter. Pinned container bundles shellcheck +
      # pyflakes; we gate shellcheck at error severity so pre-existing style /
      # info nits in run: blocks don't fail the build while real shell bugs do.
      - name: Lint workflows (actionlint)
        uses: docker://rhysd/actionlint:1.7.12
        env:
          SHELLCHECK_OPTS: --severity=error

      # Per-package lint scripts (mobile import boundaries, blueprint app
      # no-undef, data-plane cargo fmt/clippy) only exist under turbo.
      - run: bun run turbo run lint
      - run: bun run lint:tsconfigs
      # `typecheck` dependsOn `^build` in turbo.json, so this also builds
      # package dist for consumers — no separate full-repo `build` here.
      - run: bun run typecheck
      # Type-aware pass (oxlint --type-aware); deps' dist is built by the
      # typecheck step's upstream `^build`.
      - run: bun run lint:types
      # Dead-code / unused-dependency scan (knip). Tuned as a files + dependency
      # hygiene gate: unused files, unused deps, undeclared (unlisted) deps.
      # Export/type dimensions are excluded (public-API monorepo makes them
      # ~90% false positives); run `bunx knip --include exports,types` on-demand
      # for a deep export sweep. Offline and fast, so it gates on the per-PR loop.
      - run: bun run knip
      # Claims-ledger anti-rot (#458 Phase 4, renamed in #915 Wave 3 when
      # tests/matrix.json became tests/claims.json): fail if any claim names an
      # owning test file that no longer exists, or a named contract suite shrinks
      # below its recorded floor, or a registered lane's job carries no evidence
      # step. Offline and fast, so it belongs on the per-PR loop next to
      # lint/typecheck.
      - run: bun run test:claims
      # The converse direction of the same seam: an evidence step naming a lane
      # tests/claims.json#lanes does not register writes a file the report has no
      # row for. That must fail a PR rather than become a banner, so it runs
      # here rather than in the nightly.
      - run: bun run lint:evidence-mapping
      - run: bun run test:accessibility
      # #545 A6–A8 — smoke + orphaned script lanes + protocol/css linters that
      # previously lived only in check:pr (no CI enforcement).
      - run: bun run test:report:smoke
      - name: Scripts release + sanitizer tests
        run: |
          bun run scripts:test
      - run: bun run lint:css
      - run: bun run lint:protocol-routes
      - run: bun run lint:acp-min-versions
      # #557 — workflow policy actionlint does not model: every third-party
      # `uses:` SHA-pinned, no hardcoded Bun version (packageManager is the one
      # source of truth), every job bounded by timeout-minutes.
      - run: bun run lint:workflow-pins
      # #892 Phase 0 — no turbo `outputs` entry may name a git-tracked path. A
      # tracked path is also one of the task's hashed INPUTS, so the task's cache
      # key depends on its own product; turbo calls that undefined and it never
      # errors, it just silently stops caching.
      - run: bun run lint:turbo-cache
      # #892 Phase 3 — the inverse of the `changes` filter table above. `check`
      # counts `skipped` as a pass, so a path no filter names merges green and
      # unexercised. Every workspace package, app and top-level directory must be
      # claimed by a filter or ledgered with the always-on job that covers it.
      # It also checks the escape hatch: a read of a filter output without the
      # `|| …outputs.all == 'true'` fallback is dead on a `workflow_dispatch`
      # run, where the filter step is skipped and every output is the empty
      # string — so the one control that forces a full run leaves that lane
      # skipped, which is a pass.
      - run: bun run lint:path-filters
      # #545 D9 — shellcheck governance hooks + coverage-scope self-test.
      - name: Install shellcheck (governance shell lane)
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bun run test:governance-shell
      # #496 E4 — floors/minimumTests may only move upward vs the merge base
      # (or carry an approvedDeviation / approvedMinimumTestsDeviation marker).
      # Fetch is best-effort; ratchet-floors.mjs fails closed when the base ref
      # is missing (no silent "run everything" skip) (#545 A11).
      # `test:ratchet` is the FLOORS half only since #915: a floor is a contract
      # and stays on the merge loop, while the skip budget became
      # `test:skip-inventory` on the weekly hygiene lane (hygiene.yml).
      - name: Ratchet coverage floors and minimumTests
        run: |
          git fetch --no-tags --depth=1 origin main 2>/dev/null || true
          bun run test:ratchet
      # Pure-function unit tests for the ratchet (deletion/missing-key cases).
      - run: bun run test:ratchet:unit
      # Mobile agent-e2e flow anti-rot (issue #483): fail if a Maestro flow
      # asserts on a tab/route label that is drawn on every screen, or types
      # input it never verifies. The flows themselves run nightly, but linting
      # their source is offline and fast, so it gates on the per-PR loop.
      - run: bun run lint:e2e-flows
      # #905 Part 2 — the shell↔app conformance manifest. Four tables in three
      # trees decide whether a launcher tile reaches a screen (the registry, the
      # launcher catalog, Home's navigate switch, the deep-link table) and
      # nothing linked them; `buildLauncherItems` drops an unmapped app id
      # SILENTLY. This holds all four against
      # `apps/mobile/app-conformance.json`, which is also what makes app #9
      # covered the day it registers instead of the day someone remembers it.
      - run: bun run lint:app-conformance
      # Every device flow names what merges wrongly if it passes when it should
      # not. `cold-start` is why: it asserted a marker that renders in both of
      # Home's branches, and passed against a Home with no launcher tiles at all.
      - run: bun run lint:e2e-claims

      # #782 — the ~19 gates in `check:push` that had NO CI job at all. They ran
      # only on a developer's machine, and receipts (#765, #731) show `check:push`
      # being skipped locally, so "enforced by the pre-push hook" was enforcement in
      # name only. These are all offline, deterministic Node scripts with no
      # toolchain beyond `bun install`, so they cost a few seconds each and belong
      # on the required per-PR loop.
      #
      # Deliberately NOT here (tracked in #781 for the excluded lanes):
      #   - `design:gallery` — needs a downloaded Playwright browser; that is an
      #     install + network dependency, not a static check.
      #   - `check:mobile-native-state` — a path filter that shells out to
      #     `apps/mobile ci:native-state`, which `mobile-smoke` already runs on
      #     exactly the diffs that matter. Duplicating it here buys nothing.
      #   - `test:qualities` — needs every package's `dist/`, so it rides `verify`
      #     (which already builds) rather than paying for a second full build.
      # Everything else in `check:push` is already covered by `static` or `verify`.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane static --rung 2 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 900000 --qualities contracts,correctness --surfaces gateway,web,desktop,mobile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-static
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:ui-receipt and lint:quality-knobs resolve a merge-base against
          # origin/main; a shallow clone has none.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Fetch origin/main for merge-base gates
        run: git fetch --no-tags origin main 2>/dev/null || true
      # Share/deep-link reachability: every share surface must be reachable from
      # a route the user can actually get to (TS AST walk, no build needed).
      - run: bun run check:reachability
      # Design-system consumer linters. DESIGN.md is the binding rulebook; these
      # are the machine-checkable half of it (docs/design-machinery.md).
      - run: bun run lint:design-tokens
      - run: bun run lint:mobile-design
      # A virtualized list that anchors by default swallows rows arriving
      # from another device (#903); every FlashList states its anchoring.
      - run: bun run lint:list-anchoring
      - run: bun run lint:logical-insets
      - run: bun run lint:hairline
      - run: bun run lint:aria-labels
      - run: bun run lint:container-opacity
      - run: bun run lint:motion-rule
      # Lints DESIGN.md itself (structure of the rulebook, not its consumers).
      - run: bun run lint:design-md
      # Engine/law invariants: shared engines conform to their declared
      # contracts, and every law in the registry is wired to a real enforcer.
      - run: bun run lint:engine-conformance
      - run: bun run lint:law-registry
      # Quality-knob ratchet — tighten-only vs origin/main. The schema-export
      # half is a standing fingerprint check rather than a diff-scoped one, so
      # #915 moved it to the weekly hygiene lane; see hygiene.yml.
      - run: bun run lint:quality-knobs
      # A UI-touching PR must carry a UI receipt.
      - run: bun run check:ui-receipt
      # Quarantined tests must be declared, attributed, and not expired.
      - run: bun run test:quarantine
      # #892 Phase 3 — a step that ANNOUNCES it will never fail is the one place
      # in this repo without a budget, a ledger or an expiry. The iroh
      # binding-drift warning and the never-failing Expo compatibility map now
      # carry an owner, an issue and a date by which somebody decides whether
      # they should stay advisory (tests/inventory.json#advisory).
      - run: bun run test:advisory-expiry

      # #892 Phase 1 — THE PASS/FAIL HALF. `verify` was 26m34s wall with `bun run
      # coverage` alone at 20m15s, i.e. roughly 77% of PR feedback latency was
      # instrumentation. Splitting it costs some duplicated test execution and buys
      # the thing a PR author actually waits for: "did anything break" now arrives on
      # the uninstrumented suite while the `coverage-shard` / `coverage` pair scores
      # the floors in parallel. Both are in `check`'s needs, so nothing became
      # advisory — only the ORDER in which answers arrive changed.
      #
      # What stayed here rather than moving: everything that needs the built dist and
      # is not instrumentation — the tunnel's native and byte-plane contracts, the
      # user-facing qualities lane, the mobile boot-condition tier, and the two perf
      # ceilings. They are seconds-to-minutes each and would each pay a second
      # `bun run build` if they moved.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane gates --rung 2 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 720000 --qualities contracts --surfaces gateway
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-gates
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  verify:
    runs-on: ubuntu-latest
    # Uninstrumented, so the old 35-minute allowance is no longer the shape of
    # this job. Kept generous rather than tight: this is a backstop against a
    # hung runner, and a cancelled job counts as red with no evidence (#557).
    timeout-minutes: 30
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
          cargo-cache: verify
      # `packages/tunnel test:data-plane` is a real `cargo test`, so the toolchain
      # stays. The wasm32 target went with the iroh step below: nothing on this
      # lane compiles to wasm.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      # #892 Phase 1 — this is now a no-op on every lane that does not rebuild the
      # binding, which is every lane but `iroh-wasm`. The header comment here used
      # to say "wasm is gitignored; clean CI must rebuild"; it has been a COMMITTED
      # 1.9 MB artifact for some time, so `ensure-iroh-wasm.mjs` always exited
      # early and the `cargo install wasm-bindgen-cli` this step performed — ~1.7
      # minutes, in this job and all three of lane-client-e2e — provisioned a
      # toolchain for a build that could not happen. The script keeps the call
      # site (a genuinely absent binding still provisions and rebuilds) and moves
      # the decision inside, where the artifact can be looked at.
      - name: Ensure Iroh WASM toolchain
        run: bash scripts/ci/ensure-iroh-wasm-toolchain.sh
      # Build every package's dist (the worker-thread handler tests load the
      # built worker, not the .ts source), then run the whole suite under vitest.
      # #892 — `build:ci` is `turbo run build --summarize` plus a per-task
      # HIT/MISS table in the Job Summary. Five lanes were paying ~4.5 minutes for
      # this step with the remote cache switched on and nobody could say why;
      # the table is how the next run answers it.
      - run: bun run build:ci:floored
      # #892 Phase 1 — folded in from `lane-client-e2e / boot-smoke`, which paid a
      # 4m38s `build --filter=@centraid/desktop...` for a ~0s L2 structure
      # assertion over a dist it did not need to produce. The build above is a
      # superset of that closure, and this job is unfiltered, so the check now
      # costs nothing AND runs on PRs that never woke the `client` filter.
      - name: L2 boot-the-artifact structure smoke
        run: node scripts/release/boot-smoke.mjs
      # The normal @centraid/tunnel build above ships its target-specific napi
      # module. Prove both pairing ALPNs plus streamed request/response bytes.
      - run: bun run --cwd packages/tunnel test:native
      # Rust format compatibility and the language-independent byte-plane
      # lifecycle contract are non-negotiable rollout gates (N0a/N0b).
      - run: bun run --cwd packages/tunnel test:data-plane
      # #782 — the user-facing-qualities lane (matrix cells R4/D4/U3) was a
      # `check:push` gate with no CI job. It spawns real gateways and imports
      # workspace packages by their published entry points, so it needs the
      # `bun run build` above; that is why it rides here and not in `gates`.
      - run: bun run test:qualities
      # #890 W3 — the mobile BOOT-CONDITION tier. It boots a real `serve()`
      # gateway and a real native replica session over node:sqlite, arranges each
      # app × state as a genuine boot condition, and asserts the state the
      # SESSION reports rather than the state a fixture was handed. It rides here
      # for the same reason `test:qualities` does: it needs the `bun run build`
      # above, because it drives the packages by their published entry points.
      #
      # ~145 s of Linux time, and that is the trade the E-device-only ruling
      # names: a simulator minute on macOS costs roughly 600x a vitest second, so
      # the state grid moving down a tier is what pays for the device roster
      # shrinking. It is NOT path-filtered — a change anywhere in the gateway,
      # the vault or the replica can move what these states report.
      - run: bun run test:integration:mobile
      # Issue #456's real-gateway budget gate. Linux strace supplies an exact
      # fsync/write count; losing that signal is itself a benchmark failure.
      - run: sudo apt-get update && sudo apt-get install --yes strace
      # #532 — per-PR perf gate: gateway low-end budgets (fsync-count on Linux).
      # Budget *numbers* also ratchet tighten-only via test:ratchet on static.
      # One automatic retry absorbs shared-runner event-loop noise (main is green
      # on the same budgets; a single noisy sample should not fail the PR).
      # #557 — the retry stays (shared-runner event-loop noise is real), but a
      # pass-on-retry must not read as a clean pass. Budgets here ratchet
      # tighten-only, so a regression that fails ~50% of the time would look
      # permanently healthy under a bare `cmd || cmd`. The second attempt now
      # annotates the run and the Job Summary, so flake frequency is visible
      # instead of being absorbed.
      - name: Per-PR perf gate (gateway low-end budgets)
        env:
          CENTRAID_BENCH_REQUIRE_FSYNC: "1"
          CENTRAID_HARDWARE_PROFILE: constrained
        run: |
          set -uo pipefail
          if bun run test:perf:pr; then
            exit 0
          fi
          echo "::warning title=Perf gate flaked::First attempt failed; retrying once. If this annotation is frequent, the budget is too tight or the regression is real — do not ignore it."
          {
            echo "### ⚠️ Perf gate needed a retry"
            echo
            echo "\`test:perf:pr\` failed on its first attempt and was retried."
            echo "A green job here is a **second-attempt** pass, not a clean one."
          } >> "$GITHUB_STEP_SUMMARY"
          bun run test:perf:pr
      # #842 W0.5 — send → first token, the product's most-felt latency, which
      # had no rig at all until now. Times a real `runAcpTurn` against the
      # scripted fake ACP harness, so the provider is held constant and the
      # number is dead time this repo owns. ~3 s for 35 turns, and it needs the
      # `bun run build` above for @centraid/server's dist, which is why it
      # rides here. The ceiling it reads is tighten-only; see the entry's
      # `probe` field for exactly which half of the interval is fenced.
      - name: Send-to-first-token ceiling
        run: bun run perf:send-to-first-token
      # `bun run test:suite` — the uninstrumented serial run — no longer rides
      # here. It was ~19 of this job's 24 minutes and re-ran the SAME projects the
      # four `coverage-shard` legs already run, sharded, with coverage; the
      # shards are the pass/fail answer as well as the floors (a failing test
      # fails its shard). The serial run, its collection tripwire and the suite
      # wall-clock ceiling (which #905 showed must be scored on a single unsharded
      # runner) now ride on `candidate.yml`'s `suite` lane, on every push to
      # main, where they block the promotion rather than the merge. The rung-2
      # `pr-gate` ceiling is what forced the move: 24.2 min measured against 15.

      # #892 Phase 1 — the instrumented half, fanned out. `bun run coverage` on one
      # runner was 20m15s; four shards each score a quarter of the test files and the
      # merge job reassembles the blobs.
      #
      # A SHARD IS NOT A SMALLER GATE. It runs under `vitest.shard.config.ts`, which
      # is the root config MINUS `coverage.thresholds`, because a shard sees only its
      # slice: `packages/cli/**` measures 0% on the shard holding no CLI tests, so
      # per-shard floors would either red every run or have to be lowered into
      # meaninglessness. Every floor is evaluated exactly once, on the merged report.
      #
      # The hazard that introduces is #556's: a merge assembled from fewer blobs than
      # were dispatched measures a smaller world and passes more easily. Two things
      # close it — this job is an ordinary (not `always()`) dependency of `coverage`,
      # so a dead shard fails the merge, and `assert-shard-blobs.mjs` requires the
      # exact set {1..N} on disk before vitest is allowed to merge anything.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane verify --rung 2 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 1500000 --qualities correctness,contracts,durability,concurrency --surfaces vault-core,gateway,replica-sync
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-verify
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  coverage-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
          cargo-cache: verify
      - run: bun run build:ci:floored
      - name: Coverage shard ${{ matrix.shard }}/4
        env:
          CENTRAID_COVERAGE_SHARD: ${{ matrix.shard }}/4
        run: bun run coverage:shard
      # The blob is the shard's entire product. `if-no-files-found: error` rather
      # than the default warning: a silently absent blob is precisely the partial
      # world the merge guard exists to refuse, and failing here names the shard.
      #
      # `include-hidden-files` is NOT optional. Vitest's blob reporter writes to
      # `.vitest-reports/`, and upload-artifact excludes any path with a
      # dot-prefixed segment by default — so the first run of this lane wrote
      # `blob-1-4.json` and then uploaded nothing, on all four shards. Left as a
      # warning it would have been the exact #556 shape: four green shards, a
      # merge over an empty directory, and every floor below scoring a world
      # that never ran.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane coverage-shard-${{ matrix.shard }} --rung 2 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 1500000 --qualities correctness --surfaces vault-core,gateway
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-coverage-shard-${{ matrix.shard }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  coverage:
    needs: [coverage-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so test:diff-coverage can resolve merge-base vs origin/main.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
          # #915 — a turbo MISS on `@centraid/tunnel#build` is a release cargo
          # compile (278s of a 349s cold `build:ci`, measured). Without a Cargo
          # cache that miss is a FULLY COLD compile; with one it is incremental.
          # `verify` already carried this preset and this lane did not, so the
          # two lanes degraded very differently from the same miss.
          cargo-cache: verify
      # The merge runs no tests, but `test:report` and the v8 remap read the
      # workspace by its published entry points.
      - run: bun run build:ci:floored
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-blob-*
          path: .vitest-reports
          merge-multiple: true
      # Fail-closed before the merge, not after: once a partial report exists,
      # every gate below scores it happily.
      - name: Merge the shard reports (refuses a partial world)
        env:
          CENTRAID_COVERAGE_SHARDS: "4"
        run: bun run coverage:merge
      # The suite wall-clock ceiling used to ride here, then on `verify`, and now
      # rides on `candidate.yml`'s `suite` lane with the serial run it measures.
      # It cannot come back here: sharding DOES move the metric, because it sums
      # per-file wall spans and a shard's files run concurrently, so this lane
      # scored the runner rather than the suite (#905).
      #
      # On the merge gate the merged report is the only place the whole suite's
      # shape can be seen, so the collection tripwire rides here: a collection
      # error is a "do not merge" answer, not a coverage observation (#842 W0.3).
      - name: No test file failed to collect
        run: bun run test:collection-tripwire -- --require-report
      # #532 — changed-line coverage vs origin/main must be ≥80% (or approvedDeviation).
      - name: Fetch origin/main for diff coverage
        run: git fetch --no-tags origin main 2>/dev/null || true
      - name: Diff coverage on changed lines
        run: bun run test:diff-coverage
      - name: Generate test-health report
        if: always()
        env:
          # Main slot is per-push only; banner + link to nightly (#535 F7).
          TEST_REPORT_SCOPE: main
        run: bun run test:report
      # Job Summary is local to the Actions run (PRs included). Public Pages
      # HTML is main-only — see publish-report.
      - name: Write Job Summary
        if: always()
        env:
          TEST_REPORT_PUBLIC_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('https://{0}.github.io/{1}/test-report/main/', github.repository_owner, github.event.repository.name) || '' }}
        run: node scripts/test-report/write-job-summary.mjs --report-url "$TEST_REPORT_PUBLIC_URL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-health-report
          path: dist/test-report/
          retention-days: 14

      # Public HTML on GitHub Pages — main branch only (not PRs).
      # Merges into the gh-pages tree so nightly slots survive, then deploys via
      # GitHub Pages (workflow build type). Does not gate the required `check` job.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane coverage --rung 2 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 1500000 --qualities correctness --surfaces vault-core,gateway
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-coverage
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  publish-report:
    needs: [coverage]
    if: >
      always() && needs.coverage.result != 'cancelled' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize with nightly so deploys do not race on gh-pages.
    concurrency:
      group: github-pages-test-report
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.slot.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download test-health report
        id: download_report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-health-report
          path: dist/test-report
      - name: Require report HTML
        id: has_report
        run: |
          if [ -f dist/test-report/index.html ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::test-health-report artifact missing; skip Pages publish"
          fi
      - name: Restore previous Pages tree (gh-pages)
        if: steps.has_report.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
      - name: Seed site if gh-pages missing
        if: steps.has_report.outputs.ok == 'true'
        run: |
          mkdir -p site
          rm -rf site/.git
      - name: Resolve report slot
        if: steps.has_report.outputs.ok == 'true'
        id: slot
        run: |
          SLOT="main"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "slot=${SLOT}" >> "$GITHUB_OUTPUT"
          echo "url=https://${OWNER}.github.io/${REPO}/test-report/${SLOT}/" >> "$GITHUB_OUTPUT"
      - name: Merge report into site tree
        if: steps.has_report.outputs.ok == 'true'
        run: |
          node scripts/test-report/prepare-pages-site.mjs \
            --report dist/test-report \
            --site site \
            --slot "${{ steps.slot.outputs.slot }}"
      - name: Persist site on gh-pages (merge source for next runs)
        if: steps.has_report.outputs.ok == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: false
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Upload Pages artifact
        if: steps.has_report.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        if: steps.has_report.outputs.ok == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # #532 — per-PR mutation on affected property-defended seeds only. Skips when
  # the diff touches none of the seed watch paths; enforces mutation floors on
  # packages that ran.
  #
  # #892 Phase 1 — THIS LANE WAS BIMODAL AND THE SWITCH WAS THE WRONG ONE. It
  # measured either 4m30s of build plus ZERO mutation (no affected seeds) or
  # 19m27s of full-seed run — and the second mode fired because `package.json`
  # and `bun.lock` were in `MUTATION_GLOBAL_WATCH`, so any dependency bump ran all
  # sixteen seeds on the PR loop. `scripts/mutation/seeds.mjs` now watches the
  # mutation configuration itself and nothing else globally; the full-seed run
  # moved to `mutation-canary` below, where nobody is waiting on it.
  mutation-pr:
    # A push to main goes to the canary tier instead — running affected seeds
    # there would re-prove on the merge commit what the PR already proved.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          # #637 — this lane re-builds package dist for Stryker seeds.
          turbo-cache: "true"
      - name: Fetch merge base for affected mutation
        run: git fetch --no-tags --depth=1 origin main 2>/dev/null || true
      # Workspace package entry points (dist/) must exist so vitest can resolve
      # @centraid/* imports when Stryker runs from a package cwd. Without this,
      # vault/automation dry-runs fail with "No tests were executed".
      - name: Build packages for mutation seeds
        run: bun run turbo run build --filter='./packages/*'
      # #915 Wave 1 — CAPPED AT EIGHT MINUTES, THEN DEFERRED TO RUNG 3. The
      # affected-seed set is a function of the diff, so one PR paid 90 seconds
      # and the next paid nineteen minutes; the second one is a rung-2 lane
      # answering a rung-3 question. Over the cap the run is killed, the PR gets
      # ONE comment (rewritten in place) saying which rung now owns the answer,
      # and `candidate.yml`'s `mutation-full` re-runs every seed with floors on
      # the merge commit. Nothing is skipped; only the moment the answer arrives
      # moves. See scripts/ci/mutation-cap.mjs.
      - name: Per-PR mutation (affected seeds + floors, 8-minute cap)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CENTRAID_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci/mutation-cap.mjs

      # #915 Wave 1 — `mutation-canary` MOVED TO `candidate.yml` as `mutation-full`.
      # It was already outside `check`'s needs (the merge had happened, so a red
      # canary was a page rather than a gate); rung 3 is where a page belongs, and
      # there it gates promotion instead of only filing an issue. The nightly full
      # run in e2e.yml stays: it is the scheduled sweep that catches a seed rotting
      # without any commit touching its watch list.

      # #915 Wave 1 — NEW-TEST BURN-IN. `author ≠ auditor` was enforced for the
      # product (mutation seeds, diff coverage, the e2e alarm) and not at all for the
      # tests themselves: a newly written test ran exactly once before merging,
      # inside a full suite sharing a worker pool with a thousand siblings. A test
      # that passes because a sibling seeded a fixture, or because it is 1-in-3
      # flaky, passes that one run and then costs everybody a re-run habit for
      # months. Three runs, alone, and any DISAGREEMENT between them is red — not
      # just a failure, because the file that passes twice and fails once is the
      # expensive one and the one a single run cannot see.
      #
      # `fetch-depth: 0` because the file list is a merge-base diff, not a tip diff:
      # what matters is what THIS branch changed, not what main moved underneath it.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane mutation-pr --rung 2 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 900000 --qualities correctness --surfaces vault-core,gateway --cases artifacts/mutation-cap/cases.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-mutation-pr
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  new-test-burn-in:
    runs-on: ubuntu-latest
    # Three runs of a handful of files. The cap is generous against a PR that
    # adds many suites at once; over it, the honest answer is to split the PR.
    timeout-minutes: 25
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - name: Fetch the merge base
        run: git fetch --no-tags origin main 2>/dev/null || true
      # Workspace package entry points must exist so vitest can resolve
      # @centraid/* imports when a test is run from its own package directory.
      - name: Build packages so a per-package vitest run resolves
        run: bun run turbo run build --filter='./packages/*'
      - name: Run every added or modified test three times, alone
        run: node scripts/ci/burn-in.mjs --base origin/main --runs 3
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane new-test-burn-in --rung 2 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 900000 --qualities correctness,concurrency --surfaces vault-core,gateway
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-new-test-burn-in
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Path-gated lanes. Each was its own `pull_request` workflow until #557; the
  # steps are unchanged, only the trigger moved. A lane the diff does not touch
  # reports `skipped`, which `check` treats as satisfied.
  # ---------------------------------------------------------------------------

  # #915 Wave 1 — `client-e2e` AND `gateway-package` ARE GONE FROM RUNG 2.
  # Both were `workflow_call` callers into lanes that still exist and are still
  # run: `candidate.yml` invokes `lane-client-e2e.yml` twice (as
  # `web-e2e-linux` and `desktop-e2e-linux`) and `lane-gateway-package.yml`
  # once, on every push to `main`. What changed is WHICH RUNG ANSWERS: a desktop
  # Playwright journey and a container smoke test are questions about a build we
  # would hand to a device, not about whether a diff can land, and each was
  # ~25-30 minutes of a 15-minute merge budget for a secondary surface.
  #
  # The promotion rule recorded in lane-client-e2e.yml is unchanged and is now
  # counted rather than remembered: `scripts/ci/lane-health.mjs` tallies the
  # times a rung-3 lane caught something the merge gate had already called
  # green, and files `[lanes] promote <lane>` on the second one in 30 days.

  # Required-check-capable mobile liveness gate (#587 E22–E23/F26–F29).
  # Bundle export + committed-native-tree ratchets + shipped-weight ceilings.
  # #892 — it no longer compiles anything: see the note where `ci:android-native`
  # used to be for why that claim belongs to `mobile-device-gate`.
  mobile-smoke:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"
      # #637 Phase 3 — dependency/wrapper cache only (not task-output cache).
      # Writes only on the default branch by setup-gradle defaults; keeps the
      # 431 compile tasks honest so this smoke lane still catches native breaks.
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Advisory only (#646): long pin skew lists must not drown real L4 failures.
      # Hard Expo pin alignment is a dedicated follow-up; this step never fails the job.
      - name: Advisory — Expo compatibility map (non-blocking)
        continue-on-error: true
        run: |
          set +e
          bun run --cwd apps/mobile ci:versions > /tmp/ci-versions.out 2>&1
          code=$?
          {
            echo "## Advisory: Expo compatibility map (non-blocking)"
            echo ""
            echo "Exit code: \`$code\` (does not fail mobile-smoke)."
            echo ""
            echo '```'
            cat /tmp/ci-versions.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ci-versions.out
          exit 0
      - name: Verify native locks, paths, and fingerprint ratchets
        run: bun run --cwd apps/mobile ci:native-state
      - name: Bundle iOS and Android through Metro
        run: bun run --cwd apps/mobile ci:bundle
      # #659 R3d — these two bundles have been built on every mobile-touching PR
      # for months and never weighed. Ceilings live in
      # tests/experience-budgets/mobile.json and are tighten-only.
      - name: Weigh the shipped mobile bundles
        run: bun run perf:app-weight -- --surface mobile
      # #892 Phase 1 — `ci:android-native` (a ~3-minute Debug Kotlin compile) is
      # GONE. It proved the native modules compile; `mobile-device-gate` below
      # compiles the same native tree under `assembleRelease` and then RUNS the
      # artifact, on the same `mobile` path filter, so the two never disagree
      # about a break — the Debug compile could only ever be the slower, weaker
      # half of a claim already made.
      #
      # The `android/app/src/debug` and `debugOptimized` source sets Release never
      # touches are the one thing that went with it. They are dev-client scaffolding
      # (#890 W1 moved every lane off the dev client), and `ci:native-state` still
      # ratchets the committed native trees, so a change to them is not
      # unobserved — it is unCOMPILED, which is the trade being made here.
      #
      # The job's own header rationale ("fails before an expensive macOS build")
      # went stale at the same time: since #890 W4 the mobile gate is Android on
      # Linux, and there is no macOS build on the PR loop to fail before.

      # #890 W4 — THE PR DEVICE GATE. Mobile is the primary surface and until this
      # job no mobile journey ran on any PR: `mobile-smoke` above proves the app
      # BUILDS and nothing about whether it works, and the nightly's first device
      # signal arrived after merge. A feedback loop that contradicts surface priority
      # is the defect; this job is the fix.
      #
      # Android, per D1 (docs/decisions.md#mobile-testing-890): Linux runners expose
      # /dev/kvm so the emulator is hardware-accelerated and the gate costs Linux
      # minutes rather than the macOS multiplier, and Maestro's UIAutomator2 driver
      # is the stabler of the two. iOS is the nightly's depth platform, never a
      # per-PR duplicate.
      #
      # It runs the RELEASE artifact (#890 W1), so none of the dev-client machinery
      # — Metro, the dev launcher, the bundle prewarm, the developer-menu sheet —
      # exists on this path.
      #
      # ONE LEG, EIGHT MINUTES WARM (#915 Wave 1). #905 split the critical five
      # across two matrix legs because in sequence they measured ~795s against a
      # 720s deadline. #915 makes the smaller cut instead: the RESILIENCE leg
      # (native-v0 resilience) is a rung-3 question about a build, not a rung-2
      # question about a diff, and it moved to the candidate roster with the rest of
      # the Android depth. What stays on the merge gate is the smallest set that can
      # falsify "this diff broke the phone": the pairing canary, one home-app
      # journey (`notes-library`), and cold start — 8 minutes warm.
      #
      # A COLD CACHE IS NOW A NAMED LANE FAILURE, NOT A SIXTY-MINUTE WAIT. When the
      # apk restore misses, this job used to compile a release build inside the leg
      # (16m21s on 0655a1b7, inside a 27-minute job) and every PR behind it paid the
      # same. The shell is banked by `candidate.yml`'s `mobile-canary-android` on
      # every push to main, so a miss means that lane has not run for this native +
      # JS fingerprint yet — a statement about the pipeline, which the pipeline
      # should say out loud in seconds rather than discover in an hour.
      #
      # The committed leg script sits literally inside this job block, which is where
      # scripts/lint-e2e-wiring.mjs reads it from.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane mobile-smoke --rung 2 --platform android --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 900000 --qualities contracts,compat --surfaces mobile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-mobile-smoke
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  mobile-device-gate:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    # The SUITE's own 8-minute budget (flows/pr-gate-budget.md) is what fails a
    # slow run, because it fails while evidence can still be written. This is an
    # outer backstop only — but it no longer has to sit above a cold gradle
    # release build, because a cold cache fails fast above instead of building.
    timeout-minutes: 20
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      # ubuntu-latest exposes /dev/kvm; enable it so the x86_64 emulator gets
      # hardware acceleration. Without it every journey times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      # TWO fingerprints, and the difference between them is the whole
      # build-once-run-many contract (#892 Phase 0):
      #
      #   hash    native inputs only. Keys the GRADLE BUILD DIRECTORY, so a
      #           JS-only PR restores a warm native compile and re-runs only the
      #           bundle and packaging tasks.
      #   apk_key native inputs PLUS a hash of the embedded Hermes bundle's
      #           inputs. Keys the APK. `@expo/fingerprint` deliberately ignores
      #           `src/**` — correct under the dev client, where Metro served the
      #           JS live, and WRONG since #890 W1 put every device lane on the
      #           release artifact, where the JS is compiled in. Without the js
      #           component a JS-only PR restored main's apk and the critical five
      #           drove main's JS: green, fast, and measuring the wrong commit.
      - name: Fingerprint the Android native build inputs
        id: native_android
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          fp="$(node scripts/native-fingerprint.mjs android)"
          test -n "$fp" || { echo "::error::empty Android fingerprint"; exit 1; }
          js="$(node scripts/js-bundle-fingerprint.mjs)"
          test -n "$js" || { echo "::error::empty JS bundle fingerprint"; exit 1; }
          jdk="$(java -version 2>&1 | head -1 | shasum -a 256 | cut -d' ' -f1)"
          echo "hash=jdk${jdk:0:12}-fp${fp}" >> "$GITHUB_OUTPUT"
          echo "apk_key=jdk${jdk:0:12}-fp${fp}-js${js}" >> "$GITHUB_OUTPUT"
      - name: Install Maestro CLI
        # Pinned to the SAME version every other mobile lane installs;
        # scripts/test-report/validate-nightly-wiring.mjs fails when the three
        # lanes disagree, because two device drivers on one roster is a
        # difference nobody chose.
        env:
          MAESTRO_VERSION: 2.6.1
        run: bash scripts/ci/install-maestro.sh
      - name: Build and start the tokenless mobile test gateway
        run: |
          bun run turbo run build --filter=@centraid/server
          gateway_dir="$RUNNER_TEMP/centraid-mobile-gateway"
          nohup node tests/agent-e2e-mobile/lib/ci-gateway.mjs "$gateway_dir" 18789 > /tmp/centraid-mobile-gateway.log 2>&1 &
          echo "MAESTRO_GATEWAY_URL=http://127.0.0.1:18789" >> "$GITHUB_ENV"
          for attempt in {1..90}; do
            if node tests/agent-e2e-mobile/lib/ci-gateway-ready.mjs http://127.0.0.1:18789; then exit 0; fi
            sleep 2
          done
          cat /tmp/centraid-mobile-gateway.log
          exit 1
      # #890 W1, build-once-run-many. Two caches with DIFFERENT fallback rules,
      # and the difference is the whole point:
      #
      #   apk cache      exact key, NO restore-keys. A partial match here would
      #                  install a stale binary and pass, which is the one thing
      #                  this must never do. #892 — the key carries the JS bundle
      #                  hash as well as the native one, so "stale" now includes
      #                  "built from a different commit's JS", which under the
      #                  release artifact is the common case rather than the rare
      #                  one.
      #   gradle build   restore-keys ON. A partial match is a warm build
      #     directory   DIRECTORY, not an artifact: gradle re-checks every task's
      #                  inputs against the current tree, so a JS-only change
      #                  re-runs only the bundle and packaging tasks and a native
      #                  change rebuilds what it must. Nothing stale can survive
      #                  a task-input check, which is why restore-keys is safe on
      #                  this one and refused on the other.
      #
      # Both are populated on `main` by `candidate.yml`'s `mobile-canary-android`
      # (rung 3), so a PR normally restores rather than compiles.
      - name: Restore the built Android app
        id: android_app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/centraid-mobile-e2e-android
          key: android-release-${{ runner.os }}-${{ steps.native_android.outputs.apk_key }}
      # #915 Wave 1 — A COLD SHELL FAILS IN SECONDS WITH A NAME. The apk key
      # folds the native fingerprint AND the JS bundle fingerprint, and
      # `candidate.yml`'s `mobile-canary-android` banks that exact key on every
      # push to `main`. A miss therefore means one of two pipeline facts, not a
      # product fact: the canary has not yet run for this fingerprint, or it ran
      # and did not bank. Either way the honest lane verdict is "this gate could
      # not be answered cheaply", and the honest cost is one minute rather than
      # the sixteen-minute release build this job used to absorb silently
      # (0655a1b7, 60732d30: a 0s restore and a 16m21s build inside a 27m job).
      #
      # It writes its own case id so the evidence says WHY, and it fails the job
      # so the miss is visible instead of amortised across everybody's PR.
      - name: A cold Android shell is a lane failure, not an hour of building
        if: steps.android_app.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s\n' '[{"id":"cold-cache","verdict":"failed","durationMs":0,"attempts":1}]' > artifacts/mobile-device-gate-cases.json
          echo "::error title=mobile-device-gate cold cache::no banked Android release shell for this native+JS fingerprint (key android-release-${{ runner.os }}-${{ steps.native_android.outputs.apk_key }}). candidate.yml's mobile-canary-android banks it on every push to main; if that lane is red or has not run for this fingerprint, fix THAT rather than paying a cold release build on every PR behind this one."
          exit 1
      - name: Restore the Android gradle build directory
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/mobile/android/app/build
            apps/mobile/android/build
            ~/.gradle/caches
          key: android-gradle-${{ runner.os }}-${{ steps.native_android.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            android-gradle-${{ runner.os }}-${{ steps.native_android.outputs.hash }}-
            android-gradle-${{ runner.os }}-
      # Restore-then-save, for the reason already written above the apk and
      # gradle caches and not applied to this one: `actions/cache` declares
      # `post-if: success()`, so on a red lane the snapshot never saves and every
      # run pays the ~2-minute create — the warm path stays unreachable until the
      # greenness the cache exists to help deliver. `Post AVD cache` reported
      # `skipped` on every red run while `Create AVD + snapshot` ran on every one,
      # which is that same fact stated twice in the logs.
      - name: AVD cache
        id: avd_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-google_apis-pixel6-r4096-c4-v1
      - name: Create AVD + snapshot (cache miss only)
        if: steps.avd_cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Every AVD-shaping input MUST match the test step's, or the cached
          # snapshot will not load. Pinned in apps/mobile/scripts/device-matrix.json,
          # where the x86_64-vs-arm64 divergence from a member's phone is recorded
          # as deliberate rather than assumed away.
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Save the AVD snapshot
        if: steps.avd_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-google_apis-pixel6-r4096-c4-v1
      - name: Run the critical journeys on the release artifact
        id: emu
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_CACHE_HIT: ${{ steps.android_app.outputs.cache-hit }}
          CENTRAID_MOBILE_BUILD: release
          CENTRAID_MOBILE_LANE: pr-gate
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          # The committed gate script. The literal path lives inside this job
          # block, which is where scripts/lint-e2e-wiring.mjs reads it from.
          script: bash apps/mobile/scripts/android-emulator-pr-gate.sh
      # The gateway's side of a red run. The phone is mute about its replica —
      # nothing on that path logs and the release artifact carries no debugger —
      # so whether a clone was ever ASKED FOR is only knowable from here. Failure
      # only: a green run has nothing to explain, and this is CI output rather
      # than an artifact because the artifact store is not reachable to everyone
      # who has to read it. `ci-gateway.mjs` traces method, path and status for
      # the replica surface alone and never for enrollment.
      - name: What the gateway served
        if: failure()
        run: tail -n 200 /tmp/centraid-mobile-gateway.log || true
      # The harness rm -rf's this in a finally; this is belt-and-braces against a
      # run that dies before the finally, so a crash mid-pairing cannot ship a
      # live enrollment capability in the uploaded artifact.
      - name: Remove sensitive pairing diagnostics
        if: always()
        run: |
          if [ -d tests/agent-e2e-mobile/runs ]; then
            find tests/agent-e2e-mobile/runs -type d \
              -path '*/maestro-debug/*-configure-gateway' \
              -prune -exec rm -rf {} +
          fi
      # BANK WHAT THIS RUN COMPILED. Until now only `mobile-canary` saved, so a
      # PR could restore a shell only if main had already built that exact
      # `apk_key` — and the key names the JS bundle, so any PR touching JS
      # missed it and paid a full cold release build inside this job. On
      # 0655a1b7 and again on 60732d30 the restore was a 0s miss and the build
      # cost 16m21s of a 27m job.
      #
      # Saving here does not help the push that paid for it; it helps the NEXT
      # push on the same branch, which is the common shape — a receipt edit, a
      # doc fix, a workflow tweak, none of which move the JS fingerprint. Actions
      # cache scoping keeps a branch's entry to that branch and its children, so
      # this cannot serve a stale shell to main or to an unrelated PR.
      #
      # `if: always()` and gated on `built` for the same reason the canary's is:
      # a red suite still leaves the next push a warm build, and a run that
      # restored rather than compiled has nothing new to bank.
      #
      # #915 — with one leg and a cold cache failing fast above, this now only
      # ever banks a shell the run legitimately built (a `workflow_dispatch`
      # forcing the lane on, say). The `built` gate is what keeps a run that
      # restored rather than compiled from re-saving what it was given.
      - name: Save the built Android app
        if: always() && steps.emu.outputs.built == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/centraid-mobile-e2e-android
          key: android-release-${{ runner.os }}-${{ steps.native_android.outputs.apk_key }}
      - name: Save the Android gradle build directory
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/mobile/android/app/build
            apps/mobile/android/build
            ~/.gradle/caches
          key: android-gradle-${{ runner.os }}-${{ steps.native_android.outputs.hash }}-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mobile-device-gate-runs
          path: tests/agent-e2e-mobile/runs/
          retention-days: 7
          if-no-files-found: ignore
      # #905 — the ledger the harness appended on THIS runner, uploaded red or
      # green: without it the observed p95 every suite budget must be re-derived
      # from (tests/agent-e2e-mobile/ledger/README.md) never leaves the runner.
      - name: Upload the mobile run ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-run-ledger-pr-gate
          path: tests/agent-e2e-mobile/ledger/durations.json
          retention-days: 30
          if-no-files-found: warn
      # `--cases` only when a step wrote one: the cold-cache guard above emits a
      # single `cold-cache` case so the evidence says WHY the lane is red, and a
      # normal run has no case file to pass.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: |
          set -euo pipefail
          cases=()
          if [ -f artifacts/mobile-device-gate-cases.json ]; then
            cases=(--cases artifacts/mobile-device-gate-cases.json)
          fi
          node scripts/test-report/write-evidence.mjs \
            --lane mobile-device-gate --rung 2 --platform android \
            --verdict auto --job-status "${{ job.status }}" \
            --started-at "$LANE_STARTED_AT" --budget-ms 480000 \
            --qualities journey,correctness,offline \
            --surfaces mobile,tunnel-pairing "${cases[@]+"${cases[@]}"}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-mobile-device-gate
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CI gate only — this does NOT deploy. Cloudflare's own Git integration
    # builds (`bun run docs:bundle` → ./dist/site) and runs `wrangler deploy` on
    # push. Here we build exactly as production does (base=/docs) and run the
    # smoke checks so a broken tree never merges.
    env:
      DOCS_SITE_BASE_PATH: /docs
      DOCS_SITE_CANONICAL_ORIGIN: https://centraid.dev/docs
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run docs:bundle
      - run: bun run docs:smoke

      # #501 — continuous public PWA (app.centraid.dev) gate. The Cloudflare deploy
      # of the same build lives in web.yml, push-to-main only.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane docs --rung 2 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 600000 --qualities contracts --surfaces web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-docs
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  web-build:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run web:build
      - run: bun run web:smoke
      # #781 (#587 D21) — weigh the shipped PWA. Ceilings live in
      # tests/experience-budgets/web.json and are tighten-only.
      - name: Weigh the shipped web bundle
        run: bun run perf:app-weight -- --surface web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane web-build --rung 2 --platform web --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 900000 --qualities contracts --surfaces web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-web-build
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  iroh-wasm:
    needs: changes
    if: needs.changes.outputs.iroh-wasm == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          # #892 Phase 1 — the `iroh-wasm` preset already caches `~/.cargo/bin`
          # alongside the registry and this crate's target/. This lane is the one
          # that actually rebuilds the binding, and it was the ONE lane not asking
          # for the preset that exists for it: it re-ran `cargo install
          # wasm-bindgen-cli --locked` from source on every run (~1.7 min with the
          # apt install) while four other lanes provisioned the same toolchain for
          # a rebuild that never happens. With the cache, the install below is a
          # no-op on a warm runner.
          cargo-cache: iroh-wasm
      - name: Install pinned binding tools
        run: |
          set -euo pipefail
          # apps/web/iroh-wasm/rust-toolchain.toml pins rustc + wasm target.
          rustup show
          # Restored from the cargo cache on a warm runner. Version-checked
          # rather than presence-checked: a cache entry from before a pin bump
          # would otherwise silently drive the rebuild with the wrong bindgen,
          # which is exactly the drift the pin exists to prevent.
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen 0.2.108" ]; then
            cargo install wasm-bindgen-cli --version 0.2.108 --locked
          else
            echo "wasm-bindgen 0.2.108 restored from the cargo cache"
          fi
          # binaryen 108 matches Ubuntu 24.04 apt; pin so wasm-opt does not float.
          sudo apt-get update
          sudo apt-get install --yes binaryen=108-1 clang
      - name: Rebuild browser binding
        env:
          CC_wasm32_unknown_unknown: /usr/bin/clang
        # Invoke via bash so a missing +x bit cannot fail the job with exit 126.
        # Working-directory ensures the crate-local rust-toolchain.toml applies.
        working-directory: apps/web
        run: bash scripts/build-iroh-wasm.sh
      - name: Report generated binding drift (non-blocking)
        # Full byte-exact rebuild is not yet hermetic across rustc/wasm-bindgen
        # intrinsic comment renumbering. Rebuild success is the required gate;
        # drift is reported so owners can refresh committed artifacts deliberately.
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/web/src/generated; then
            echo "Generated Iroh bindings match the committed tree."
          else
            echo "::warning::Generated Iroh binding drift after rebuild (refresh committed artifacts when intentional)."
            git diff --stat -- apps/web/src/generated || true
          fi

      # Pure-local Companion gate. The live n0-relay flow is environmentally flaky
      # and deliberately stays schedule-only in extension-e2e.yml.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane iroh-wasm --rung 2 --platform web --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 1500000 --qualities contracts --surfaces tunnel-pairing,web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-iroh-wasm
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  companion-static:
    needs: changes
    if: needs.changes.outputs.extension == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Extension unit suite + locker companion query handlers. Avoid full
      # blueprints app-boot (jsdom teardown noise unrelated to Companion).
      - run: bun run turbo run build test --filter=@centraid/extension
      # The focused blueprint test imports the shared recurrence engine but
      # intentionally bypasses Turbo's dependency graph, so build that package
      # explicitly on a clean runner before invoking Vitest directly.
      - run: bun run --filter @centraid/core build
      - run: bun run --filter @centraid/blueprints test -- src/query-handlers.test.ts

      # #526 — stateless Assist ceremony edge. The protected production deploy of
      # the same build lives in oauth-worker.yml, push-to-main only.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane companion-static --rung 2 --platform web --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 600000 --qualities contracts --surfaces extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-companion-static
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  oauth-worker:
    needs: changes
    if: needs.changes.outputs.oauth-worker == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run --cwd apps/oauth-worker typecheck
      - run: bun run --cwd apps/oauth-worker test
      - run: bun run --cwd apps/oauth-worker build

      # #557 — fails a PR that ADDS a dependency carrying a known advisory (or a
      # copyleft licence that would contaminate a shipped desktop/mobile binary).
      # Dependabot reports what you already have; this stops new ones arriving.
      # Unfiltered: any PR can add a dependency, so this never skips.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane oauth-worker --rung 2 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 600000 --qualities contracts,security --surfaces oauth-worker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-oauth-worker
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Start at `high`. Starting at `low` on a monorepo this size means the
          # gate is muted within a week; tighten once the baseline is clean.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Denies the licence on NEW dependencies only — existing ones are
          # untouched, so it cannot retroactively red an unrelated PR.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later

      # #671 — secret scanning on every PR/push. GitHub secret scanning + push
      # protection are already enabled for this public repo (primary hosted control).
      # Gitleaks covers non-provider / high-entropy patterns on the *current tree*
      # (not full history — historical fixture noise is not a merge gate). Allowlist:
      # `.gitleaks.toml`. Unfiltered: any PR can introduce a secret.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane dependency-review --rung 2 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 300000 --qualities security --surfaces gateway
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-dependency-review
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gitleaks
        env:
          # Pin the binary release (SHA of the tarball is not needed when the
          # tag is immutable on GitHub releases; version is explicit).
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan working tree
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --verbose --redact

      # #671 — full lockfile inventory via OSV. Complements dependency-review:
      # dependency-review fails *new* high-severity deps on the PR diff; this job
      # scans the whole `bun.lock` for known advisories so latent inventory debt
      # cannot hide. Fail closed on CRITICAL only (HIGH reported, non-blocking) —
      # see scripts/ci/osv-lockfile-scan.mjs + SECURITY.md. Cheap; no bun install.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane gitleaks --rung 2 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 300000 --qualities security --surfaces gateway
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-gitleaks
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OSV-Scanner
        env:
          OSV_VERSION: 2.4.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Scan bun.lock (fail on CRITICAL)
        run: node scripts/ci/osv-lockfile-scan.mjs

      # The one required status check (`check`, matching the main-protection
      # ruleset). Every gate above is in `needs:`, so a lane that goes red turns
      # this red — including the eight that could not gate a merge at all before
      # #557. Reads results only; re-runs no install or tests.
      #
      # `skipped` is a PASS on purpose: that is what a path-gated lane reports when
      # the diff does not touch it. `cancelled` is a FAIL — a dead runner is not a
      # green build. publish-report is best-effort UX and is deliberately absent.
      # #781 — `design:gallery` was one of the two `check:push` gates with NO CI
      # lane. #782 left it out of `gates` because it needs a downloaded Playwright
      # browser — an install + network dependency, not a static check. This
      # path-gated job pays that install only when a design-relevant path changes,
      # mirroring how lane-client-e2e.yml provisions the same pinned browser.
      #
      # THE `system-ui` CAUSE IS FIXED; THE CROSS-PLATFORM CLAIM IS UNMEASURED.
      # #781 recorded this lane as red because the retired fixtures hardcoded
      # `system-ui`, which resolves to a different physical font per OS, and the
      # committed baselines were darwin arm64 (measured 2026-08-15 on linux x64,
      # Chromium 141 / playwright 1.62.0: all 22 diffed 1.93%-7.26% against the 1%
      # ceiling). #799 removed that cause: every lane now loads the product's own
      # vendored Instrument Sans `.woff2`, and each capture FAILS LOUDLY if the
      # family does not resolve, so no baseline can bake in a fallback face.
      #
      # The baselines were then re-pinned from a LINUX x64 container — the same
      # renderer this job uses — so this lane should be green. What has NOT been
      # measured is the reverse: whether darwin `check:push` now agrees with them.
      # A self-hosted woff2 removes the font as a variable, but subpixel and
      # hinting differences between the two rasterizers remain plausible. The
      # first darwin run decides it. If a residual delta appears, record the
      # NUMBERS and land per-platform baseline directories in
      # scripts/design-gallery.mjs — do not widen the 1% ceiling to absorb it.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane osv-scanner --rung 2 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 600000 --qualities security --surfaces gateway
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-osv-scanner
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  design-gallery:
    needs: changes
    if: needs.changes.outputs.design == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      # Same pinned-browser convention as lane-client-e2e.yml: `bunx
      # playwright install` resolves the CLI from the root lockfile's
      # `playwright` pin, so the downloaded Chromium revision is exactly the
      # one that version ships — no floating browser.
      - run: bunx playwright install --with-deps chromium
      # The gallery runs under bun (it imports packages/design/src TS
      # directly for the lowering lanes) and builds the web dist itself — it
      # photographs the SHELL, so it refuses to trust a dist it did not just
      # produce. `scripts/design-gallery.mjs` builds `@centraid/web`'s package
      # dependencies first (`turbo --filter=@centraid/web^...`) because
      # `apps/web/vite.config.ts` imports `@centraid/design/font-faces`, which
      # resolves to `packages/design/dist/font-faces.js`.
      - run: bun run design:gallery
      # On failure the actual captures are the rebaseline/review payload —
      # without them a red pixel diff is undebuggable from the log alone.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: design-gallery-actual
          path: artifacts/design-gallery/actual/
          retention-days: 7

      # #892 Phase 3 — `desktop-e2e-windows` IS GONE. It was permanently gated behind
      # `vars.CENTRAID_DESKTOP_E2E_WINDOWS`, a repo Actions variable that is unset —
      # so the job never ran, could never go red, and existed only as YAML that
      # reviewers had to read past. The parking NOTE was the valuable half and it now
      # lives where a parked thing belongs, in an issue rather than in a dead job:
      #
      #   Windows first-run founding never leaves onboarding-view.
      #   `shouldUseFileFallback()` throws when `safeStorage.isEncryptionAvailable()`
      #   is false on any non-Linux platform, and the job did not set
      #   `CENTRAID_INSECURE_DEVICE_SECRETS=1`. Restoring the lane means fixing
      #   founding on `windows-latest` first (#846 P12 / #850), then re-adding the
      #   job with the `desktop` path filter.
      #
      # #915 Wave 1 — `desktop-e2e-macos` MOVED TO RUNG 3 (`candidate.yml`). #892
      # asked whether a 10x-multiplier runner belongs on the PR loop at all and
      # answered "while it is advisory, yes, because otherwise the twice-burned
      # promotion rule has no darwin signal to read". #915 answers it differently:
      # the signal is worth keeping and the PR loop is the wrong place to buy it, so
      # the lane runs on every promoted build instead of on every push of every
      # branch. It gates promotion there, which is strictly MORE than the advisory
      # status it had here.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane design-gallery --rung 2 --platform web --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 720000 --qualities contracts,accessibility --surfaces web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-evidence-design-gallery
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  check:
    needs: [
        changes,
        static,
        gates,
        design-gallery,
        verify,
        # #892 Phase 1 — `verify`'s coverage half split out. BOTH are here: the
        # split was about when an answer arrives, never about which answers gate.
        # `coverage-shard` is listed as well as `coverage` so a shard that dies
        # without its dependent ever starting still reds `check` rather than
        # reporting `skipped`, which this aggregator counts as satisfied.
        coverage-shard,
        coverage,
        mutation-pr,
        # #915 Wave 1 — every added or modified Vitest file, three times, alone.
        new-test-burn-in,
        mobile-smoke,
        mobile-device-gate,
        docs,
        web-build,
        iroh-wasm,
        companion-static,
        oauth-worker,
        dependency-review,
        gitleaks,
        osv-scanner,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # #915 — the wall-clock step below reads this run's own jobs.
      actions: read
    steps:
      # `needs.*.result` means a lane added to `needs:` above is covered
      # automatically, rather than needing a matching line in a hand-kept list
      # that nothing checks (the #557 nightly-failure-issue lesson).
      - name: Aggregate every PR gate
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          # Fail closed. `join(needs.*.result)` over a non-empty `needs:` list
          # cannot be empty today, but an aggregator that returns 0 when it has
          # nothing to say is the exact shape of #556 — a gate reporting green
          # because it never looked. Cheap to make impossible.
          if [ -z "${RESULTS//,/}" ]; then
            echo "::error::aggregator received no lane results — refusing to pass"
            exit 1
          fi
          bad=0
          IFS=',' read -ra each <<< "$RESULTS"
          for result in "${each[@]}"; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a required lane reported '$result'"
                bad=1
                ;;
            esac
          done
          exit "$bad"
      # #915 — THE RUNG-2 BUDGET, MEASURED ON THE RUN THAT SPENT IT. The suite
      # wall-clock ratchet fences the vitest suite's summed file spans, which is
      # backpressure on adding TESTS and says nothing about the minutes a person
      # waits between pushing and this job going green. That number was measured
      # at ~26 min against a docs claim of 12.3 and nothing could have noticed.
      # `if: always()` so a red gate is still weighed — a slow red gate is worse
      # than a slow green one, not exempt from the budget.
      # The script lives in the repo and this aggregator had no checkout, so
      # every `check` since the ladder landed died on MODULE_NOT_FOUND right
      # after the aggregate step passed: the job read red while every lane it
      # aggregates was green, and the budget it exists to enforce was never
      # measured once. Checked out here rather than at the top of the job so
      # the aggregate step above still runs against a bare runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()
      - name: PR gate wall clock
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ci/pr-gate-wall-clock.mjs \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}"
