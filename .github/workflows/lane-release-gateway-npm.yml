name: lane-release-gateway-npm

# Reusable multi-platform tunnel package lane; publish is NPM_TOKEN-gated (#509).

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Force dry-run even if NPM_TOKEN is set"
        required: false
        default: "true"
        type: string
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  # Build first-party tunnel NAPI on each OS/arch we ship (#511).
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            os: ubuntu-latest
            required: true
          - id: linux-arm64
            os: ubuntu-24.04-arm
            required: false
          - id: darwin-arm64
            os: macos-latest
            required: true
          - id: darwin-x64
            os: macos-15-intel
            required: false
          - id: win32-x64
            os: windows-latest
            required: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.required == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Required when the action is pinned by SHA — see security.yml's note.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      - name: Build tunnel native (+ TS dist)
        shell: bash
        env:
          CENTRAID_REQUIRE_NATIVE_TUNNEL: "1"
        run: bun run turbo run build --filter=@centraid/tunnel
      - name: Assert expected artifact for this host
        shell: bash
        run: |
          set -euo pipefail
          ART="packages/tunnel/native/centraid-tunnel-native.${{ matrix.id }}.node"
          # matrix.id is platform-arch (linux-x64); Node uses same for process.platform-arch
          # except we must expand: id already is "linux-x64" matching filename segment.
          test -f "$ART"
          ls -la packages/tunnel/native/*.node
      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tunnel-native-${{ matrix.id }}
          path: packages/tunnel/native/centraid-tunnel-native.${{ matrix.id }}.node
          if-no-files-found: ${{ matrix.required && 'error' || 'warn' }}
          retention-days: 7

  pack-and-maybe-publish:
    needs: [build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # #557 — `id-token: write` is what makes npm provenance possible; GitHub
    # only injects ACTIONS_ID_TOKEN_REQUEST_URL when it is declared, and
    # scripts/gateway-npm/publish.mjs probes for exactly that before adding
    # `--provenance`. Job-level permissions REPLACE the workflow-level block,
    # so `contents: read` has to be restated here.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
      - name: Build gateway publish graph (TS; host native optional here)
        run: bun run turbo run build --filter=@centraid/server...
        env:
          # Host build may produce linux-x64; multi-arch comes from merge step.
          CENTRAID_REQUIRE_NATIVE_TUNNEL: "1"
      - name: Download multi-platform native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tunnel-native-*
          path: artifacts/tunnel-native
          merge-multiple: true
      - name: Merge natives into packages/tunnel/native
        env:
          CENTRAID_REQUIRE_MULTI_NATIVE: "1"
        run: |
          # download-artifact may nest per artifact name; merge walks recursively
          find artifacts/tunnel-native -name 'centraid-tunnel-native.*.node' -ls || true
          node scripts/gateway-npm/merge-native-artifacts.mjs --from artifacts/tunnel-native --require
          ls -la packages/tunnel/native/*.node
      - name: Unit-test pack/install/platform helpers
        run: bun run gateway:npm:helpers:test
      - name: Pack publish set
        run: bun run gateway:npm:pack
      - name: Assert pack includes multi-platform natives (tarball listing)
        run: |
          set -euo pipefail
          TGZ=$(ls artifacts/npm-packs/centraid-tunnel-*.tgz | head -1)
          test -n "$TGZ"
          # npm pack names may be centraid-tunnel-0.1.0.tgz
          LIST=$(tar -tzf "$TGZ")
          echo "$LIST" | grep -E 'native/centraid-tunnel-native\.linux-x64\.node'
          echo "$LIST" | grep -E 'native/centraid-tunnel-native\.darwin-arm64\.node'
          echo "$LIST" | grep -E 'native/centraid-tunnel-native\.win32-x64\.node'
      - name: Upload pack artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-gateway-packs
          path: artifacts/npm-packs/*.tgz
          if-no-files-found: error
      - name: Install smoke from local packs
        run: |
          PREFIX="${RUNNER_TEMP}/centraid-prefix"
          bash scripts/install-gateway.sh --prefix "$PREFIX" --from-pack-dir artifacts/npm-packs
          test -x "$PREFIX/bin/centraid-gateway"
          "$PREFIX/bin/centraid-gateway" --help 2>&1 | head -40
      - name: Publish (secret-gated)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # #557 — dispatch inputs as env, not interpolated script text.
          # release.yml already resolves this: a tag push passes 'false', a
          # manual run passes the operator's choice. Re-checking event_name here
          # would be a dead condition now that the lane cannot be dispatched
          # directly.
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            node scripts/gateway-npm/publish.mjs --dry-run
            exit 0
          fi
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN absent — dry-run publish only"
            node scripts/gateway-npm/publish.mjs --dry-run
            exit 0
          fi
          node scripts/gateway-npm/publish.mjs
