name: security

# #557 — the repo had no static security analysis at all (`/code-scanning/alerts`
# → 404) despite shipping a documented threat model (SECURITY.md): pairing
# ceremony, relay, sealed vault columns, an OAuth broker, blob custody.
#
# Two independent gates live here:
#   codeql            — SAST over the TS/Rust product code AND the workflow YAML
#                       itself (`actions` finds injection + unpinned-ref classes
#                       that actionlint does not model).
#   dependency-review — blocks a PR that ADDS a dependency with a known
#                       advisory. Dependabot tells you about what you already
#                       have; this stops new ones arriving.
#
# CodeQL is deliberately NOT on the per-PR loop for the compiled matrix: a Rust
# database build is minutes, and `ci` already carries a ~20-25 min budget. Push
# to main + weekly schedule keeps alerts current without taxing every PR.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Sunday 04:00 UTC — before the 06:00 nightly e2e, so a red security lane
    # and a red nightly are never competing for attention in the same hour.
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    # PRs get the fast `dependency-review` gate below; full CodeQL runs on main
    # and on the weekly schedule. `actions` is cheap, but keeping the matrix in
    # one job definition is worth more than shaving it onto PRs separately.
    if: github.event_name != 'pull_request'
    name: codeql (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      # Required for CodeQL to map alerts back to the PR/commit on private forks.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            os: ubuntu-latest
          - language: actions
            os: ubuntu-latest
          - language: rust
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # `build-mode` is deliberately not set. All three languages here default to
      # the no-build database (CodeQL reads source directly rather than
      # observing a compiler), so no Rust toolchain setup is needed — the three
      # crates, packages/tunnel/{data-plane,native} and apps/web/iroh-wasm, are
      # picked up straight from the checkout. Passing the flag explicitly only
      # creates a way to be wrong when a default changes.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@3599b3baa15b485a2e49ef411a7a4bb2452e7f93 # v3.30.5
        with:
          languages: ${{ matrix.language }}
          # security-extended adds the lower-precision-but-real queries; the
          # default suite alone misses most injection sinks.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@3599b3baa15b485a2e49ef411a7a4bb2452e7f93 # v3.30.5
        with:
          category: /language:${{ matrix.language }}

  # Fails a PR that introduces a dependency with a known advisory, or a licence
  # outside the allowlist. Runs only on PRs — it diffs base against head.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          # Start at `high`. Starting at `low` on a monorepo this size means the
          # gate is muted within a week; tighten once the baseline is clean.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences would contaminate a shipped desktop/mobile binary.
          # This denies the licence on NEW dependencies only — existing ones are
          # untouched, so it cannot retroactively red an unrelated PR.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later
