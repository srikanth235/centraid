name: security

# #557 — the repo had no static security analysis at all (`/code-scanning/alerts`
# → 404) despite shipping a documented threat model (SECURITY.md): pairing
# ceremony, relay, sealed vault columns, an OAuth broker, blob custody.
#
# Two independent gates live here:
# CodeQL runs SAST over the TS/Rust product code AND the workflow YAML itself
# (`actions` finds injection + unpinned-ref classes that actionlint does not
# model).
#
# It is deliberately NOT on the per-PR loop: a Rust database build is minutes,
# and `ci` already carries a ~20-25 min budget. Push to main + weekly schedule
# keeps alerts current without taxing every PR. The PR-time supply-chain gate is
# `dependency-review` in ci.yml (#557), where it rolls up into the required
# `check` — as its own `pull_request` workflow it could gate nothing.
on:
  push:
    branches: [main]
  schedule:
    # Sunday 04:00 UTC — before the 06:00 nightly e2e, so a red security lane
    # and a red nightly are never competing for attention in the same hour.
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      # Required for CodeQL to map alerts back to the PR/commit on private forks.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            os: ubuntu-latest
          - language: actions
            os: ubuntu-latest
          - language: rust
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `build-mode` is deliberately not set. All three languages here default to
      # the no-build database (CodeQL reads source directly rather than
      # observing a compiler), so no Rust toolchain setup is needed — the three
      # crates, packages/tunnel/{data-plane,native} and apps/web/iroh-wasm, are
      # picked up straight from the checkout. Passing the flag explicitly only
      # creates a way to be wrong when a default changes.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          # security-extended adds the lower-precision-but-real queries; the
          # default suite alone misses most injection sinks.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:${{ matrix.language }}

  # #842 W7.2 — the Rust half of supply chain. CodeQL above reads the crates'
  # source; this reads their DEPENDENCIES: cargo-audit for known advisories,
  # cargo-deny for licences, banned crates, duplicate versions and unknown
  # registries. It lives here rather than on the PR loop for the same reason
  # codeql does — installing two cargo binaries is minutes.
  #
  # The unsafe-edge ratchet runs on every PR instead (`check:push`): it needs no
  # toolchain, so there is no reason to defer it to a weekly lane. It is
  # repeated here only so a weekly run reports the whole Rust posture in one
  # place.
  rust-supply-chain:
    name: rust supply-chain (cargo-audit + cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
      - run: cargo install cargo-audit --locked
      - run: cargo install cargo-deny --locked
      # `--require` is what makes this job worth having. Without it a missing
      # binary is a loud guarded skip that still exits 0 — correct on a
      # developer machine, wrong here, where this job installs both and so an
      # absent binary means the install step lied rather than that the tool is
      # unavailable. Under --require, "available but did not run" is red too.
      - run: node scripts/security/rust-supply-chain.mjs --require
      - run: node scripts/security/unsafe-edge-audit.mjs
