name: candidate

# THE POST-MERGE CHECKS ON `main` (#915). One question: **is the merged tree
# clean on the checks too slow or too attributive for the pull-request gate?**
#
# Nothing here blocks a merge: the merge already happened. What it produces is
# attribution — a red lane names ONE merged commit through a rolling
# `[candidate] lane red — <lane>` issue, instead of surfacing days later on
# somebody else's branch.
#
# It does NOT move `refs/candidates/latest`. The candidate pointer is promoted
# by `gate-nightly.yml`'s `promote-candidate` job on a green
# `cargo xtask gate --profile nightly` (#1020, D-1020-G3); a second writer with
# a different notion of "green" would make the pointer mean two things.
#
# Deliberately NOT a `pull_request` trigger: gate.yml is the only workflow
# allowed to listen on open-PR events (scripts/lint-workflow-pins.mjs rule 5).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time on `main`, and never cancel a running one: a superseded run
# still owes a verdict for the commit it started on.
concurrency:
  group: candidate-main
  cancel-in-progress: false

permissions:
  contents: read
  # A red lane updates its rolling issue.
  issues: write

jobs:
  # #557 — SAST over the TS/Rust product code AND the workflow YAML itself (the
  # `actions` language finds injection and unpinned-ref classes actionlint does
  # not model). It ran on a weekly cron in `security.yml`; #915 moved it here so
  # the answer arrives attributed to one merged commit rather than to a week.
  #
  # `build-mode` is deliberately not set. All three languages default to the
  # no-build database (CodeQL reads source directly rather than observing a
  # compiler), so no Rust toolchain setup is needed — the workspace under
  # `crates/` is picked up straight from the checkout. Passing the flag explicitly only creates a way to
  # be wrong when a default changes.
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      # Required for CodeQL to map alerts back to the commit on private forks.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            os: ubuntu-latest
          - language: actions
            os: ubuntu-latest
          - language: rust
            os: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          # security-extended adds the lower-precision-but-real queries; the
          # default suite alone misses most injection sinks.
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:${{ matrix.language }}

  # #842 W7.2 — the Rust half of supply chain. CodeQL above reads the crates'
  # source; this reads their DEPENDENCIES: cargo-audit for known advisories,
  # cargo-deny for licences, banned crates, duplicate versions and unknown
  # registries. Off the PR loop for the same reason codeql is — installing two
  # cargo binaries is minutes — and on every merge rather than a weekly cron so
  # a dependency change is attributed to the commit that made it.
  rust-supply-chain:
    name: rust supply-chain (cargo-audit + cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `toolchain` is REQUIRED when the action is pinned by SHA. Unpinned, it
      # reads the toolchain from its own ref (`@stable`); a SHA has no ref name
      # to read, so the input has to be spelled out or the action exits 1 with
      # "'toolchain' is a required input" before installing anything.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      - run: cargo install cargo-deny --locked
      # `--require` is what makes this job worth having. Without it a missing
      # binary is a loud guarded skip that still exits 0 — correct on a
      # developer machine, wrong here, where this job installs both and so an
      # absent binary means the install step lied rather than that the tool is
      # unavailable. Under --require, "available but did not run" is red too.
      - run: node scripts/security/rust-supply-chain.mjs --require
      - run: node scripts/security/unsafe-edge-audit.mjs
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane rust-supply-chain --rung 3 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 1200000 --candidate ${{ github.sha }} --qualities security,compat --surfaces tunnel-pairing,gateway
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: candidate-evidence-rust-supply-chain
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

  # THE RUNG-1 GATES, ON THE MERGED TIP (#931 item 4).
  #
  # Every gate in `lint:product` runs on a BRANCH, against the merge base, and
  # nowhere else. Two failure modes follow, and both were observed:
  #
  #   A ledger annotation that was right on its PR can be wrong the moment it
  #   merges. #916's `replacesMinimumTestsFlow: "schema-migration-corpus"`
  #   turned `lint:ledgers` red on `main`, and no lane ran it there — the next
  #   branch to touch a ledger inherited the red as if it were its own (#930).
  #
  #   `commit-message-format` is a commit-msg hook, and a SQUASH subject is
  #   written by GitHub after the hook has run. #916 merged with a 105-character
  #   subject against a 100-character rule that nothing on `main` ever applied.
  #
  # So this job asks the rung-1 question of the tree that actually exists. It is
  # rung 3 by construction — the merge already happened — and its value is
  # attribution: red here names ONE commit, through the same
  # `[candidate] lane red — <lane>` rolling issue every other candidate lane
  # uses, instead of surfacing days later on somebody else's branch.
  #
  # ONE job, not a matrix: both members are seconds of offline Node work, and a
  # second job would buy a second rolling issue to read rather than a second
  # answer.
  rung1-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The whole rung-1 bundle, on the merged tree. The diff-scoped members
      # (the ratchets, the UI receipt) compare HEAD against `main`, which is
      # HEAD here, so they contribute their STANDING checks and nothing else —
      # which is exactly the half that went missing.
      - run: bun run lint:product
      # The subject the commit-msg hook never saw. With `origin/main` at HEAD
      # the directive's merge-base search finds nothing to compare against and
      # falls back to validating the tip commit, which is the squash subject.
      - name: Commit message format on the merged tip
        run: bash .governance/run.sh commit-message-format
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane rung1-on-main --rung 3 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 1200000 --candidate ${{ github.sha }} --qualities contracts --surfaces vault-core,gateway,replica-sync
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: candidate-evidence-rung1-on-main
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

  # THE VERDICT. Fail-closed over every lane above: `success | skipped` is
  # satisfied, anything else — `cancelled` included — is not, and an EMPTY
  # result list refuses to pass rather than returning 0 because it never
  # looked (#556).
  report:
    needs: [codeql, rust-supply-chain, rung1-on-main]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Aggregate every lane
        id: aggregate
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          if [ -z "${RESULTS//,/}" ]; then
            echo "::error::aggregator received no lane results — refusing to pass"
            exit 1
          fi
          bad=0
          IFS=',' read -ra each <<< "$RESULTS"
          for result in "${each[@]}"; do
            case "$result" in
              success | skipped) ;;
              *) echo "::warning::a lane reported '$result'"; bad=1 ;;
            esac
          done
          if [ "$bad" = "0" ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi
      # A red lane updates ONE rolling issue per lane, in place. Never a
      # comment, never a new issue: the body is the lane's current condition, so
      # a run of red merges leaves one readable issue per lane rather than a
      # thread nobody opens (#915 Wave 0's lesson).
      - name: Update the rolling issue for every red lane
        if: always() && steps.aggregate.outputs.green != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" > /tmp/needs.json
          jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' /tmp/needs.json > /tmp/red-lanes.txt
          while read -r lane; do
            [ -n "$lane" ] || continue
            node scripts/ci/rolling-issue-fallback-body.mjs \
              --lane "$lane" --rung 3 --result failure \
              --run-url "$RUN_URL" --out /tmp/rolling-body.md
            node scripts/ci/file-tracking-issue.mjs --update \
              --title "[candidate] lane red — ${lane}" \
              --search "[candidate] lane red — ${lane}" \
              --body-file /tmp/rolling-body.md \
              --label tech-debt \
              --run-url "$RUN_URL"
          done < /tmp/red-lanes.txt
      - name: Fail when a lane was red
        if: always()
        run: |
          if [ "${{ steps.aggregate.outputs.green }}" != "true" ]; then
            echo "::error::a post-merge lane was red"
            exit 1
          fi

  # The rules table, scored over THIS workflow's runs (#915).
  # `--escape-workflow gate.yml` is what lets it count the times this workflow
  # caught something the merge gate had already called green.
  lane-health:
    needs: [report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Score the candidate lanes against the rules table
        id: lanes
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ci/lane-health.mjs \
            --repo "${{ github.repository }}" \
            --workflow candidate.yml \
            --rung 3 \
            --escape-workflow gate.yml \
            --runs 30 \
            --out artifacts/lane-health/candidate-summary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: candidate-lane-health
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
      # Each finding already carries the rolling issue title the rule wants, so
      # this is a loop rather than a second copy of the rules table.
      - name: Open or update one rolling issue per finding
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          summary=artifacts/lane-health/candidate-summary.json
          if [ ! -f "$summary" ]; then
            echo "::warning::lane-health wrote no summary; no rules issues to file"
            exit 0
          fi
          jq -c '.findings[]?' "$summary" > /tmp/findings.jsonl
          while read -r finding; do
            [ -n "$finding" ] || continue
            title="$(printf '%s' "$finding" | jq -r '.title')"
            {
              printf '## %s\n\n' "$title"
              printf '%s\n\n' "$(printf '%s' "$finding" | jq -r '.detail')"
              printf 'Rule: `%s`. Measured over the trailing 30 `candidate.yml` runs on `main`.\n\n' "$(printf '%s' "$finding" | jq -r '.kind')"
              printf 'This issue is rolling: its body is rewritten every run and never appended to. Close it when the rule stops firing.\n\n'
              printf 'Run: %s\n' "$RUN_URL"
            } > /tmp/rule-body.md
            node scripts/ci/file-tracking-issue.mjs --update \
              --title "$title" --search "$title" \
              --body-file /tmp/rule-body.md --label tech-debt --run-url "$RUN_URL"
          done < /tmp/findings.jsonl
      - name: Fail when a rule that is red fired
        if: always()
        run: |
          if [ "${{ steps.lanes.outcome }}" != "success" ]; then
            echo "::error::a lane rule that counts as red fired — see the step above"
            exit 1
          fi
