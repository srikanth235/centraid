name: release

# The single entry point for cutting a release (#557), and the only workflow
# that listens on tags. One tag, one run, one verdict (`release-check`). Each
# surface is its own `lane-release-*.yml`, declaring only its own secrets.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      surfaces:
        description: "Which surfaces to run (`all` covers the tag surfaces; `mobile` must be selected by name)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - gateway-image
          - prebuilt-core
          - mobile
      ref:
        description: "gateway-image: git ref to build (default: current)"
        required: false
        default: ""
      mobile_profile:
        description: "mobile: EAS profile (preview = TestFlight/Play internal)"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production
      mobile_platform:
        description: "mobile: platform"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android
      mobile_submit:
        description: "mobile: submit to TestFlight / Play internal after build"
        required: false
        default: false
        type: boolean

# A tag is immutable — never cancel a release mid-flight for a "newer" one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # We only ship a build a green nightly promoted: the tag must point at
  # `refs/candidates/latest`. `bun run release:prepare` refuses the same SHA
  # before the tag exists (docs/release.md).
  require-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tagged SHA must be a promoted candidate
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/candidates/latest | cut -f1)"
          if [ "$latest" = "$TAG_SHA" ]; then
            echo "$TAG_SHA is the current candidate"
            exit 0
          fi
          echo "::error title=Not a candidate::${TAG_SHA} is not refs/candidates/latest (${latest:-absent}). Cut the tag on the SHA the last green nightly promoted; \`bun run release:prepare\` says which."
          exit 1

  # Classifies what was cut, so each lane's `if:` reads as a sentence instead of
  # repeating tag-pattern matching seven times.
  plan:
    needs: [require-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.classify.outputs.product }}
      surfaces: ${{ steps.classify.outputs.surfaces }}
    steps:
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          SURFACES: ${{ inputs.surfaces || 'all' }}
        run: |
          set -euo pipefail
          product=false
          case "$EVENT" in
            push)
              # Tag line decides. `companion-v*` was the Companion's own
              # cadence and is gone with it (#1029 §6).
              case "$TAG" in
                v*.*.*) product=true ;;
                *) echo "::error::tag '$TAG' matched the trigger but no known release line"; exit 1 ;;
              esac
              ;;
            workflow_dispatch)
              # A manual run selects surfaces directly; `surfaces` gates the lanes.
              product=true
              ;;
          esac
          {
            echo "product=${product}"
            echo "surfaces=${SURFACES}"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT tag=$TAG product=$product surfaces=$SURFACES"

  gateway-image:
    needs: plan
    if: >
      needs.plan.outputs.product == 'true' && (needs.plan.outputs.surfaces == 'all' || needs.plan.outputs.surfaces == 'gateway-image')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/lane-release-gateway-image.yml
    with:
      ref: ${{ inputs.ref || '' }}

  # Never reached by a tag: store submission is opt-in, by dispatching with
  # `surfaces: mobile` exactly (J7, docs/release.md).
  mobile:
    needs: plan
    if: >
      github.event_name == 'workflow_dispatch' && needs.plan.outputs.surfaces == 'mobile'
    permissions:
      contents: read
    uses: ./.github/workflows/lane-release-mobile.yml
    with:
      profile: ${{ inputs.mobile_profile || 'preview' }}
      platform: ${{ inputs.mobile_platform || 'all' }}
      submit: ${{ inputs.mobile_submit || false }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}

  # The six binary triples, the four Android ABIs and the iOS XCFramework,
  # with one SHA256SUMS (D-1020-G2). Rides `all`: it submits nothing anywhere.
  prebuilt-core:
    needs: plan
    if: >
      needs.plan.outputs.product == 'true' && (needs.plan.outputs.surfaces == 'all' || needs.plan.outputs.surfaces == 'prebuilt-core')
    permissions:
      contents: read
    uses: ./.github/workflows/lane-prebuilt-core.yml
    with:
      ref: ${{ inputs.ref || '' }}
      binary-only: false

  # `skipped` passes; `cancelled` fails.
  release-check:
    needs: [require-candidate, plan, gateway-image, mobile, prebuilt-core]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate every release lane
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "release $TAG lane results: $RESULTS"
          # An empty result list refuses to pass rather than passing unexamined.
          if [ -z "${RESULTS//,/}" ]; then
            echo "::error::aggregator received no lane results — refusing to pass"
            exit 1
          fi
          bad=0
          IFS=',' read -ra each <<< "$RESULTS"
          for result in "${each[@]}"; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a release lane reported '$result' — $TAG is a partial release"
                bad=1
                ;;
            esac
          done
          exit "$bad"
