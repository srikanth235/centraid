name: release

# The single entry point for cutting a release (#557).
#
# One tag produces one run, and `release-check` is the single red/green for it:
# before #557 each surface listened on the tags itself, so a partial release
# looked like several unrelated runs with no shared verdict.
#
# Each surface stays in its own `lane-release-*.yml` file and declares the
# secrets it accepts, so a lane can only ever receive the credentials for its own
# platform — stronger isolation than five peer workflows that could each read
# every repo secret.
#
# Enforced by policy (6) of scripts/lint-workflow-pins.mjs: only this workflow
# may listen on `push: tags`.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      surfaces:
        description: "Which surfaces to run (`all` covers the tag surfaces; `mobile` must be selected by name)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - gateway-image
          - mobile
      ref:
        description: "gateway-image: git ref to build (default: current)"
        required: false
        default: ""
      mobile_profile:
        description: "mobile: EAS profile (preview = TestFlight/Play internal)"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production
      mobile_platform:
        description: "mobile: platform"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android
      mobile_submit:
        description: "mobile: submit to TestFlight / Play internal after build"
        required: false
        default: false
        type: boolean

# A tag is immutable — never cancel a release mid-flight for a "newer" one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # #915 Wave 1 — WE ONLY SHIP A BUILD SOMEBODY PROMOTED. Rung 3 produces
  # candidates; rungs 4 and 5 test them; this refuses to publish a SHA that was
  # never one. Before it, the release SHA was implicitly "whatever HEAD is when
  # publish.mjs runs" — a tag could be cut on a commit no deep rung had ever
  # exercised, and nothing in the chain would have said so.
  #
  # Two ways to be a candidate, and both are checked because both are true: the
  # tag is the CURRENT `refs/candidates/latest` (moved by `gate-nightly.yml`'s
  # `promote-candidate` on a green nightly gate), or it appears in the
  # promotion history on gh-pages at `test-report/candidates.json` (kept 200
  # deep). The second matters because cutting a release takes minutes and `main` keeps moving: a tag cut on
  # yesterday's promoted candidate is exactly right, and requiring "equal to the
  # newest" would refuse it.
  #
  # The same rule is enforced BEFORE the tag exists, by
  # `scripts/release/prepare.mjs` (and `release:classify --require-candidate`),
  # so the normal way to meet it is to be told at prepare time rather than to
  # discover it from a red release run. See docs/release.md.
  require-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore the promotion history (gh-pages)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: .gh-pages-candidates
      - name: The tagged SHA must be a promoted candidate
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/candidates/latest 2>/dev/null | cut -f1 || true)"
          if [ "$latest" = "$TAG_SHA" ]; then
            echo "$TAG_SHA is the current candidate"
            exit 0
          fi
          history=.gh-pages-candidates/test-report/candidates.json
          if [ -f "$history" ] && jq -e --arg sha "$TAG_SHA" '.candidates[]? | select(.sha == $sha)' "$history" > /dev/null; then
            echo "$TAG_SHA was promoted on $(jq -r --arg sha "$TAG_SHA" '.candidates[] | select(.sha == $sha) | .promotedAt' "$history")"
            exit 0
          fi
          echo "::error title=Not a candidate::${TAG_SHA} was never promoted by gate-nightly.yml. Releases ship promoted builds only — cut the tag on a SHA that appears in refs/candidates/latest or in the gh-pages promotion history (test-report/candidates.json). \`bun run release:prepare\` refuses the same SHA locally and says why."
          exit 1

  # Classifies what was cut, so each lane's `if:` reads as a sentence instead of
  # repeating tag-pattern matching seven times.
  plan:
    needs: [require-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.classify.outputs.product }}
      surfaces: ${{ steps.classify.outputs.surfaces }}
    steps:
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          SURFACES: ${{ inputs.surfaces || 'all' }}
        run: |
          set -euo pipefail
          product=false
          case "$EVENT" in
            push)
              # Tag line decides. `companion-v*` was the Companion's own
              # cadence and is gone with it (#1029 §6).
              case "$TAG" in
                v*.*.*) product=true ;;
                *) echo "::error::tag '$TAG' matched the trigger but no known release line"; exit 1 ;;
              esac
              ;;
            workflow_dispatch)
              # A manual run selects surfaces directly; `surfaces` gates the lanes.
              product=true
              ;;
          esac
          {
            echo "product=${product}"
            echo "surfaces=${SURFACES}"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT tag=$TAG product=$product surfaces=$SURFACES"

  gateway-image:
    needs: plan
    if: >
      needs.plan.outputs.product == 'true' && (needs.plan.outputs.surfaces == 'all' || needs.plan.outputs.surfaces == 'gateway-image')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/lane-release-gateway-image.yml
    with:
      ref: ${{ inputs.ref || '' }}

  # THE HOSTED GATEWAY (#1029 §3). Rides along on `all` like the image lane
  # does: the Worker is part of the product that ships, and a release that moved
  # the standalone image without moving the hosted adapter would be a release
  # where the two deployments speak different protocol versions.
  #
  # `deploy` is off on a tag and asked for by name, because this repository has
  # no Cloudflare account yet — the build and the shared suite still run, which
  # is the half that is worth having today. See `gateway/cloudflare/README.md`.
  gateway-worker:
    needs: plan
    if: >
      needs.plan.outputs.product == 'true' && (needs.plan.outputs.surfaces == 'all' || needs.plan.outputs.surfaces == 'gateway-worker')
    permissions:
      contents: read
    uses: ./.github/workflows/lane-release-gateway-worker.yml
    with:
      ref: ${{ inputs.ref || '' }}
      deploy: ${{ needs.plan.outputs.surfaces == 'gateway-worker' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Deliberately NOT reached by a `v*.*.*` tag. The store pipeline is manual by
  # design (J7): a product version bump must not auto-submit to TestFlight/Play.
  #
  # `surfaces: mobile` is required EXACTLY — this lane is the one that must not
  # ride along on `all`. `surfaces` defaults to `all`, so accepting it here would
  # mean re-running release.yml for another surface also burns EAS build quota. Before #557 you had to dispatch release-mobile.yml by name;
  # requiring the explicit value keeps ship opt-in, as docs/release.md states.
  mobile:
    needs: plan
    if: >
      github.event_name == 'workflow_dispatch' && needs.plan.outputs.surfaces == 'mobile'
    permissions:
      contents: read
    uses: ./.github/workflows/lane-release-mobile.yml
    with:
      profile: ${{ inputs.mobile_profile || 'preview' }}
      platform: ${{ inputs.mobile_platform || 'all' }}
      submit: ${{ inputs.mobile_submit || false }}
    secrets:
      # EAS IS RETIRED (#1020 wave 3 lane E). The mobile lane builds the native
      # projects under `mobile/`; these two secrets are no longer read by
      # anything and are dropped from the call and from the lane's declaration
      # in the same change.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}

  # THE PREBUILT CORE ([#1020](https://github.com/srikanth235/centraid/issues/1020), D-1020-G2).
  #
  # Six binary triples with a symbol file each, the four Android ABIs, and the
  # iOS XCFramework — plus one `SHA256SUMS` and one identity digest across all
  # of them. It rides `all` rather than needing an explicit surface, because
  # unlike `mobile` it submits nothing to anybody: it builds and publishes
  # artifacts, and a release that shipped a surface whose core was never built
  # for one of the required triples is a partial release.
  #
  # `require-candidate` is upstream of `plan`, so this lane inherits the
  # candidate precondition like every other: a release ships a build somebody
  # promoted (docs/release.md).
  prebuilt-core:
    needs: plan
    if: >
      needs.plan.outputs.product == 'true' && (needs.plan.outputs.surfaces == 'all' || needs.plan.outputs.surfaces == 'prebuilt-core')
    permissions:
      contents: read
    uses: ./.github/workflows/lane-prebuilt-core.yml
    with:
      ref: ${{ inputs.ref || '' }}
      binary-only: false

  # The one signal for "did this release work". Before #557 there was none: four
  # peer workflows each reported separately, so a partial release looked like
  # greens and a red in different places, with nothing naming the release
  # itself as bad.
  #
  # `skipped` passes; `cancelled` fails.
  #
  # THE DESKTOP AND COMPANION LANES ARE GONE (#1029 §6). `desktop/electron` was
  # a sidecar around a local replica and the Companion's only server was that
  # sidecar's socket; v0 has no paired client, and #1029 question 10 rules the
  # extension re-proposed on top of a desktop reader if and when §6 is built.
  release-check:
    needs: [require-candidate, plan, gateway-image, gateway-worker, mobile, prebuilt-core]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate every release lane
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "release $TAG lane results: $RESULTS"
          # Fail closed — see the same guard in candidate.yml's `report`.
          if [ -z "${RESULTS//,/}" ]; then
            echo "::error::aggregator received no lane results — refusing to pass"
            exit 1
          fi
          bad=0
          IFS=',' read -ra each <<< "$RESULTS"
          for result in "${each[@]}"; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a release lane reported '$result' — $TAG is a partial release"
                bad=1
                ;;
            esac
          done
          exit "$bad"
