name: release

# Single release entry point; `release-check` is the aggregate gate and only
# this workflow may listen for version-tag pushes (#557).

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
      - "companion-v*"
  workflow_dispatch:
    inputs:
      surfaces:
        description: "Which surfaces to run (`all` covers the tag surfaces; `mobile` must be selected by name)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - desktop
          - gateway-npm
          - gateway-image
          - mobile
          - companion
      dry_run:
        description: "npm: force dry-run even if NPM_TOKEN is set"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      ref:
        description: "gateway-image: git ref to build (default: current)"
        required: false
        default: ""
      mobile_profile:
        description: "mobile: EAS profile (preview = TestFlight/Play internal)"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production
      mobile_platform:
        description: "mobile: platform"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android
      mobile_submit:
        description: "mobile: submit to TestFlight / Play internal after build"
        required: false
        default: false
        type: boolean
      restamp_rollout_hours:
        description: "desktop I8: re-stamp rollout window hours on an existing release (empty = skip)"
        required: false
        default: ""
      restamp_tag:
        description: "desktop I8: tag to restamp; required when restamp_rollout_hours is set"
        required: false
        default: ""

  # A tag is immutable; never cancel a release mid-flight for a newer tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # #915 Wave 1 — WE ONLY SHIP A BUILD SOMEBODY PROMOTED. Rung 3 produces
  # candidates; rungs 4 and 5 test them; this refuses to publish a SHA that was
  # never one. Before it, the release SHA was implicitly "whatever HEAD is when
  # publish.mjs runs" — a tag could be cut on a commit no deep rung had ever
  # exercised, and nothing in the chain would have said so.
  # Two ways to be a candidate, and both are checked because both are true: the
  # tag is the CURRENT `refs/candidates/latest`, or it appears in the promotion
  # history `candidate.yml` publishes to gh-pages at
  # `test-report/candidates.json` (kept 200 deep). The second matters because
  # cutting a release takes minutes and `main` keeps moving: a tag cut on
  # yesterday's promoted candidate is exactly right, and requiring "equal to the
  # newest" would refuse it.
  # The same rule is enforced BEFORE the tag exists, by
  # `scripts/release/prepare.mjs` (and `release:classify --require-candidate`),
  # so the normal way to meet it is to be told at prepare time rather than to
  # discover it from a red release run. See docs/release.md.
  require-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore the promotion history (gh-pages)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: .gh-pages-candidates
      - name: The tagged SHA must be a promoted candidate
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/candidates/latest 2>/dev/null | cut -f1 || true)"
          if [ "$latest" = "$TAG_SHA" ]; then
            echo "$TAG_SHA is the current candidate"
            exit 0
          fi
          history=.gh-pages-candidates/test-report/candidates.json
          if [ -f "$history" ] && jq -e --arg sha "$TAG_SHA" '.candidates[]? | select(.sha == $sha)' "$history" > /dev/null; then
            echo "$TAG_SHA was promoted on $(jq -r --arg sha "$TAG_SHA" '.candidates[] | select(.sha == $sha) | .promotedAt' "$history")"
            exit 0
          fi
          echo "::error title=Not a candidate::${TAG_SHA} was never promoted by candidate.yml. Releases ship promoted builds only — cut the tag on a SHA that appears in refs/candidates/latest or in the gh-pages promotion history (test-report/candidates.json). \`bun run release:prepare\` refuses the same SHA locally and says why."
          exit 1

  # Classifies what was cut, so each lane's `if:` reads as a sentence instead of
  # repeating tag-pattern matching seven times.
  plan:
    needs: [require-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.classify.outputs.product }}
      companion: ${{ steps.classify.outputs.companion }}
      surfaces: ${{ steps.classify.outputs.surfaces }}
    steps:
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          SURFACES: ${{ inputs.surfaces || 'all' }}
        run: |
          set -euo pipefail
          product=false
          companion=false
          case "$EVENT" in
            push)
              # Tag line decides. `companion-v*` is a separate product cadence
              # and must never drag the desktop/gateway surfaces along with it.
              case "$TAG" in
                companion-v*) companion=true ;;
                v*.*.*) product=true ;;
                *) echo "::error::tag '$TAG' matched the trigger but no known release line"; exit 1 ;;
              esac
              ;;
            workflow_dispatch)
              # A manual run selects surfaces directly; `surfaces` gates the lanes.
              product=true
              companion=true
              ;;
          esac
          {
            echo "product=${product}"
            echo "companion=${companion}"
            echo "surfaces=${SURFACES}"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT tag=$TAG product=$product companion=$companion surfaces=$SURFACES"

  desktop:
    needs: plan
    if: >
      needs.plan.outputs.product == 'true' && (needs.plan.outputs.surfaces == 'all' || needs.plan.outputs.surfaces == 'desktop')
    permissions:
      contents: write
    uses: ./.github/workflows/lane-release-desktop.yml
    with:
      restamp_rollout_hours: ${{ inputs.restamp_rollout_hours || '' }}
      restamp_tag: ${{ inputs.restamp_tag || '' }}
    secrets:
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
      CENTRAID_RELEASE_SIGNING_KEY: ${{ secrets.CENTRAID_RELEASE_SIGNING_KEY }}

  gateway-npm:
    needs: plan
    if: >
      needs.plan.outputs.product == 'true' && (needs.plan.outputs.surfaces == 'all' || needs.plan.outputs.surfaces == 'gateway-npm')
    permissions:
      contents: read
      # OIDC for `npm publish --provenance` (#557). Job-level permissions
      # REPLACE the workflow-level block, so `contents: read` is restated.
      id-token: write
    uses: ./.github/workflows/lane-release-gateway-npm.yml
    with:
      # A tag publishes for real; a manual run defaults to dry-run.
      dry_run: ${{ github.event_name == 'push' && 'false' || (inputs.dry_run || 'true') }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  gateway-image:
    needs: plan
    if: >
      needs.plan.outputs.product == 'true' && (needs.plan.outputs.surfaces == 'all' || needs.plan.outputs.surfaces == 'gateway-image')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/lane-release-gateway-image.yml
    with:
      ref: ${{ inputs.ref || '' }}

  # Deliberately NOT reached by a `v*.*.*` tag. The store pipeline is manual by
  # design (J7): a desktop version bump must not auto-submit to TestFlight/Play.
  # `surfaces: mobile` is required EXACTLY — this lane is the one that must not
  # ride along on `all`. `surfaces` defaults to `all`, so accepting it here would
  # mean re-running release.yml to repackage a desktop installer also burns EAS
  # build quota. Before #557 you had to dispatch release-mobile.yml by name;
  # requiring the explicit value keeps ship opt-in, as docs/release.md states.
  mobile:
    needs: plan
    if: >
      github.event_name == 'workflow_dispatch' && needs.plan.outputs.surfaces == 'mobile'
    permissions:
      contents: read
    uses: ./.github/workflows/lane-release-mobile.yml
    with:
      profile: ${{ inputs.mobile_profile || 'preview' }}
      platform: ${{ inputs.mobile_platform || 'all' }}
      submit: ${{ inputs.mobile_submit || false }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

  companion:
    needs: plan
    if: >
      needs.plan.outputs.companion == 'true' && (needs.plan.outputs.surfaces == 'all' || needs.plan.outputs.surfaces == 'companion')
    permissions:
      contents: read
    uses: ./.github/workflows/lane-release-companion.yml

  # `release-check` is the single release verdict; `skipped` is valid only for
  # companion tags, while `cancelled` fails.
  release-check:
    needs:
      [
        require-candidate,
        plan,
        desktop,
        gateway-npm,
        gateway-image,
        mobile,
        companion,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate every release lane
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "release $TAG lane results: $RESULTS"
          # Fail closed — see the same guard in ci.yml's `check`.
          if [ -z "${RESULTS//,/}" ]; then
            echo "::error::aggregator received no lane results — refusing to pass"
            exit 1
          fi
          bad=0
          IFS=',' read -ra each <<< "$RESULTS"
          for result in "${each[@]}"; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a release lane reported '$result' — $TAG is a partial release"
                bad=1
                ;;
            esac
          done
          exit "$bad"
