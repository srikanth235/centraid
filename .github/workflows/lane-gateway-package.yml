# governance: allow-toolchain-config issue #637 — turbo-cache on the gateway
# closure build; buildx + registry-backed layer cache for the Docker image.
name: lane-gateway-package

# A `ci.yml` lane, not an independently-triggered workflow (#557) — the `lane-`
# prefix marks that.
#
# Packaging CI (issue #504 Phase G + Docker artifact smoke). External observer:
# host binary smoke + docker build/run with a durable /data volume. No
# product-main "is smoke" branches.

on:
  workflow_call:

permissions:
  contents: read
  # #637 Phase 2 — registry-backed BuildKit cache lives on GHCR (outside the
  # 10 GB Actions pool). The lane still does not push the final runtime image.
  packages: write

jobs:
  trace-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Build gateway dependency closure
        # turbo honors package.json dependsOn so protocol → vault → app-engine →
        # agent-runtime → automation → gateway build in order (full graph).
        run: bun run turbo run build --filter=@centraid/server

      - name: Probe unit tests
        run: node --test scripts/gateway-package/probe.test.mjs

      - name: Assemble symlink unit tests
        # Runs after turbo build so packages/*/dist exist for assembleRuntime.
        run: node --test scripts/gateway-package/assemble-runtime.test.mjs

      - name: Trace install set
        run: |
          mkdir -p artifacts
          node scripts/gateway-package/trace.mjs --out=artifacts/gateway-package-trace.json

      - name: Host install smoke
        run: node scripts/gateway-package/smoke.mjs --gateway-bin packages/server/dist/cli/cli.js --port 18787

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build gateway image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: centraid-gateway:ci-${{ github.sha }}
          build-args: |
            VERSION=0.1.0
            REVISION=${{ github.sha }}
          # Registry-backed cache (not GHA pool). Write only from main so PR
          # branches do not thrash the shared buildcache tag.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/centraid-gateway:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}/centraid-gateway:buildcache,mode=max', github.repository_owner) || null }}

      - name: Container install smoke (volume at /data)
        env:
          IMAGE: centraid-gateway:ci-${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/gateway-package/container-smoke.sh

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-package-trace
          path: artifacts/gateway-package-trace.json
          if-no-files-found: ignore
