          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane pairing-lifecycle --rung 4 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 900000 --candidate ${{ needs.resolve-candidate.outputs.sha }} --qualities journey,security --surfaces tunnel-pairing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-lane-pairing-lifecycle
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

  pairing-ticket-hygiene:
