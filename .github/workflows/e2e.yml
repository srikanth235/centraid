      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # #915 — the CANDIDATE, not the tip. See the resolve-candidate job.
          ref: ${{ needs.resolve-candidate.outputs.sha }}
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - run: bun run turbo run build --filter=@centraid/server --filter=@centraid/tunnel
      - run: node scripts/test-report/prepare.mjs
      - run: node tests/agent-e2e-pairing/flows/device-pairing-lifecycle.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-pairing-lifecycle
          path: artifacts/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-debug-pairing-lifecycle-runs
