# governance: allow-toolchain-config issue #637 — turbo-cache on build-bearing
# nightly jobs; mobile-e2e-ios intentionally excluded (macOS native binary risk).
name: e2e

# Nightly product lanes: desktop/web Playwright, mobile agent-e2e, pairing
# journeys (loopback + cross-network relay), plus the unified test-health
# report. Heavier than per-PR `ci` — schedule and workflow_dispatch only.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC nightly
  workflow_dispatch:
    inputs:
      # #496 C3 — re-run one broken lane without the full ~70-min graph.
      suite:
        description: "Which suite to run (all | desktop | web | mobile | mobile-android | pairing | report | mutation | fuzz | join | compat)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - desktop
          - web
          - mobile
          - mobile-android
          - pairing
          - report
          - mutation
          - fuzz
          - join
          - compat

# #496 C3 — overlapping schedule + dispatch must not double-run macOS.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # E3 auto-issue on red nightly needs issues:write when the failure job runs.
  issues: write

jobs:
  desktop-e2e:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'desktop'
    runs-on: ubuntu-latest
    # Outer backstop only — the suite's own `globalTimeout` (22m, see
    # tests/e2e/playwright.config.ts) is what fails a runaway run, because it
    # aborts while the reporter can still flush traces and the JSON report.
    # This cap MUST stay above setup (~8m) + globalTimeout so it never fires
    # first; when it does fire, the job is cancelled and all evidence is lost.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      # Electron + Playwright need host system libraries (libnss3, libgbm, …)
      # to start a Chromium-based renderer on headless Linux. `--with-deps`
      # apt-installs them; the chromium download itself is what carries the
      # shared libs Electron also links against.
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/desktop
      # Build every package's dist. The desktop main process imports the
      # gateway/runtime packages from their built dist at launch, so a bare
      # `test:e2e` (which only rebuilds the desktop package) isn't enough.
      - run: bun run build
      # safeStorage (gateway-token encryption) needs a real Secret Service on
      # Linux. Install gnome-keyring + libsecret so the `gnome-libsecret`
      # backend the app forces under test (fixtures.ts) has a keyring to talk
      # to. dbus-x11 provides the session bus the keyring registers on.
      - run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-1-0 libsecret-tools dbus-x11
      # `xvfb-run` gives Electron a virtual X display; `dbus-run-session` gives
      # it a private session bus. The catch on a fresh runner: D-Bus
      # auto-activates its own gnome-keyring via the service file, and that
      # daemon owns `org.freedesktop.secrets` but stays LOCKED — so safeStorage
      # still reports "not available" even though the bus name exists (this is
      # what the previous attempts hit). Fix: wipe any stale keyrings, then
      # start our own daemon with `--replace` so it TAKES OVER the bus name, and
      # `--unlock` it with an empty password (read from stdin) so the login
      # keyring is created already-open. `--foreground &` avoids the
      # daemonize-forks-before-reading-stdin trap. We then prove it end-to-end
      # with `secret-tool` (same libsecret/D-Bus path safeStorage uses): if a
      # probe secret round-trips, Electron will work — otherwise fail fast with
      # a clear message instead of 6 minutes of tests. Daemon + tests share this
      # one dbus session; `test:e2e` runs all specs (`workers: 1`, retries once).
      - run: |
          xvfb-run --auto-servernum dbus-run-session -- bash -c '
            set -x
            rm -rf ~/.local/share/keyrings
            printf "\n" | gnome-keyring-daemon --replace --components=secrets --unlock --foreground &
            sleep 2
            echo -n "probe-value" | secret-tool store --label=e2e service centraid-e2e account probe
            test "$(secret-tool lookup service centraid-e2e account probe)" = "probe-value" \
              || { echo "::error::Secret Service not usable — safeStorage would fail"; exit 1; }
            bun run test:e2e
          '
        working-directory: apps/desktop
      # On failure, keep the Playwright traces/screenshots so a flake or a real
      # regression can be inspected without re-running locally.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: desktop-e2e-traces
          path: apps/desktop/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-desktop
          path: artifacts/
          retention-days: 7

  web-e2e:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'web'
    runs-on: ubuntu-latest
    # Outer backstop only — see desktop-e2e. The suite's `globalTimeout` is
    # 10m against ~1m of healthy tests; setup is ~7m.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run build
      - run: bun run e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: web-e2e-traces
          path: apps/web/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-web
          path: artifacts/
          retention-days: 7

  # #842 W5.1 — the same web journeys on the two engines the base image does not
  # ship. WebKit's service-worker lifecycle and Cache-Storage quota, and Gecko's
  # divergence from Blink, are the whole point: a PWA that only works on Chromium
  # is not a PWA. The projects are declared in playwright.config.ts but appended
  # only when CENTRAID_WEB_CROSS_BROWSER=1, so the default `bun run e2e` stays
  # Chromium-only and does not fail on a missing browser download.
  #
  # DELIBERATELY NOT in test-health-report's needs: this lane has never run, so
  # its first green run is the measurement, not a regression baseline. Promote it
  # into the report (and the nightly tracking issue) once it has one.
  web-e2e-cross-browser:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      # webkit and firefox are the point — the engines web-e2e cannot reach —
      # but the cross-browser matrix still RUNS its chromium project too
      # (CENTRAID_WEB_CROSS_BROWSER widens the default set), and Playwright ≥1.49
      # heads chromium at a separate headless-shell binary that `webkit firefox`
      # does not pull in. Omitting it reds every chromium spec in ~2ms with
      # "Executable doesn't exist … chrome-headless-shell".
      - run: bunx playwright install --with-deps chromium webkit firefox
        working-directory: apps/web
      - run: bun run build
      - run: bun run e2e
        working-directory: apps/web
        env:
          CENTRAID_WEB_CROSS_BROWSER: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: web-e2e-cross-browser-traces
          path: apps/web/test-results/
          retention-days: 7

  mobile-e2e-ios:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'mobile'
    # macos-15 defaults to Xcode 16.4 and only ships up to 26.3. Expo SDK 57's
    # expo-modules-jsi needs Swift tools 6.2 / Xcode 26.4+ (#620); on 16.4 the
    # JSI xcframework step exits 65 with an empty "Could not resolve package
    # dependencies" footer (run 30417451436). macos-26 defaults to 26.5+.
    runs-on: macos-26
    # Cold macOS native build + serialized journeys exceed 60 on a cache miss;
    # cancelled counts as red (#557), so the backstop must sit above the
    # budget. Raised from 60 under #781 after the 08-03/04/06/13 nightlies
    # were cancelled at exactly this ceiling. Raised again to 105 under #839
    # when the home-apps suite (10-minute aggregate ceiling) joined the run.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        # #637 — deliberately no turbo-cache: macOS is 1-of-1 and must not
        # restore a Linux-built native/*.node even with RUNNER_OS in the hash.
      - name: Select Xcode 26.4 or newer
        run: |
          set -euo pipefail
          # Prefer the newest installed ≥26.4 so image rolls stay green without
          # pinning a patch. Fail loud if the image dropped below Expo's floor.
          selected=""
          for app in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V -r); do
            version="${app#/Applications/Xcode_}"
            version="${version%.app}"
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            if [ "$major" -gt 26 ] || { [ "$major" -eq 26 ] && [ "$minor" -ge 4 ]; }; then
              selected="$app"
              break
            fi
          done
          test -n "$selected" || {
            echo "::error::no Xcode ≥26.4 under /Applications (ExpoModulesJSI floor)"
            ls -d /Applications/Xcode*.app || true
            exit 1
          }
          echo "selecting $selected"
          sudo xcode-select -s "$selected"
          xcodebuild -version
          swift --version
      # The iOS dev build is cached and reused whenever nothing that changes the
      # *native binary* changed. A JS/TS commit is served live by Metro, so it
      # must not pay the ~32-minute compile; a config-plugin, native-module,
      # bundle-id, or autolinked-pod change must. The cache key (built below) has
      # two independent parts:
      #
      #   fp<hash>  @expo/fingerprint over the native inputs ONLY — config
      #             plugins, autolinked native modules (read from node_modules,
      #             so the install MUST run first), the bare apps/mobile/ios
      #             project, the resolved Expo config, and the RN version. It
      #             deliberately ignores apps/mobile/src/** (Metro-served JS) and
      #             THIS workflow file, so editing either no longer forces a
      #             rebuild — the exact over-hashing the old hand-rolled
      #             `git ls-files | shasum` key suffered (it mixed in the whole
      #             e2e.yml and all of ios/, including gitignored build products,
      #             so any workflow edit or leftover build dir busted the cache).
      #             The hashing lives in apps/mobile/scripts/native-fingerprint.mjs.
      #   xc<hash>  the host toolchain (Xcode build + iphonesimulator SDK).
      #             @expo/fingerprint hashes the PROJECT, not the MACHINE — so a
      #             binary built by a newer Xcode after a macos image roll must
      #             still not be reused; this component forces that rebuild. It
      #             subsumes the old key's raw ImageOS (the Xcode/SDK version is
      #             the part of the image that actually matters here).
      #
      # Deliberately NOT caching turbo here. A per-sha key never hits, so every
      # run would SAVE a fresh multi-hundred-MB blob; against GitHub's 10 GB
      # per-repo budget with LRU eviction, the natural victim is the .app entry
      # below — which is only ever read, never re-saved on a hit.
      - name: Fingerprint the iOS native build inputs
        id: native
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # @expo/fingerprint reads node_modules for the autolinked native tree,
          # so this runs after `bun install` above. The script prints the bare
          # hash and hard-fails on an empty digest (no constant false-hit key).
          fp="$(node scripts/native-fingerprint.mjs ios)"
          test -n "$fp" || { echo "::error::empty iOS fingerprint"; exit 1; }
          # #892 Phase 0 — the same stale-JS defect the Android lanes had. This
          # lane builds `--configuration Release`, so the Hermes bundle is
          # EMBEDDED in the .app and `@expo/fingerprint`'s deliberate blindness to
          # `src/**` means a JS-only night would have reinstalled the previous
          # night's JS and called the depth roster green against it.
          js="$(node scripts/js-bundle-fingerprint.mjs)"
          test -n "$js" || { echo "::error::empty JS bundle fingerprint"; exit 1; }
          # Toolchain captured separately: `a="$(cmd1; cmd2)"` keeps only cmd2's
          # exit status, so a broken xcodebuild would silently weaken the key
          # instead of failing the step.
          xcode="$(xcodebuild -version)"
          sdk="$(xcrun --show-sdk-version --sdk iphonesimulator)"
          xc="$(printf '%s\n%s\n' "$xcode" "$sdk" | shasum -a 256 | cut -d' ' -f1)"
          echo "hash=xc${xc:0:12}-fp${fp}-js${js}" >> "$GITHUB_OUTPUT"
          echo "iOS fingerprints: fp=$fp js=$js toolchain(xc)=$xc"
      - name: Assert runner Xcode satisfies React Native and ExpoModulesJSI
        working-directory: apps/mobile
        run: bun run ci:xcode
      - name: Build and start the tokenless mobile test gateway
        # Scoped to the gateway's dependency subgraph instead of a full
        # `bun run build`. tests/agent-e2e-mobile/lib/ci-gateway.mjs imports only
        # packages/server/dist, and turbo pulls every workspace dependency
        # (vault, app-engine, agent-runtime, automation, backup, blueprints,
        # tunnel, client, web, design) in transitively — nothing
        # the mobile job needs is dropped. The saving is narrow but real, and
        # comes almost entirely from dropping @centraid/desktop (skills and
        # data-plane folded into gateway/tunnel in #495).
        run: |
          bun run turbo run build --filter=@centraid/server
          gateway_dir="$RUNNER_TEMP/centraid-mobile-gateway"
          nohup node tests/agent-e2e-mobile/lib/ci-gateway.mjs "$gateway_dir" 18789 > /tmp/centraid-mobile-gateway.log 2>&1 &
          echo "CENTRAID_MOBILE_GATEWAY_PID=$!" >> "$GITHUB_ENV"
          echo "MAESTRO_GATEWAY_URL=http://127.0.0.1:18789" >> "$GITHUB_ENV"
          for attempt in {1..90}; do
            if node tests/agent-e2e-mobile/lib/ci-gateway-ready.mjs http://127.0.0.1:18789; then exit 0; fi
            sleep 2
          done
          cat /tmp/centraid-mobile-gateway.log
          exit 1
      - name: Install Maestro CLI
        # The mobile agent-e2e flows drive the installed app through Maestro
        # (tests/agent-e2e-mobile/lib/harness.mjs → `maestro --udid … test`).
        # Pin the CLI: the install script honors MAESTRO_VERSION and otherwise
        # pulls whatever is at `releases/latest`, so an upstream release could
        # silently change device-driving behavior mid-nightly. cli-2.6.1 is the
        # current stable release (github.com/mobile-dev-inc/maestro/releases).
        env:
          MAESTRO_VERSION: 2.6.1
        run: bash scripts/ci/install-maestro.sh
      - name: Boot an iOS simulator
        # #890 W0 — the device is PINNED (apps/mobile/scripts/device-matrix.json),
        # not "the first available iPhone". An unpinned pick makes a screen-size
        # or OS-behaviour regression indistinguishable from a runner-image roll:
        # the flow reds, and nothing in the run says the device changed. The
        # resolver fails loudly when the pinned pair is absent rather than
        # silently substituting a different phone.
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json \
            | node apps/mobile/scripts/resolve-ios-simulator.mjs)"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
      # The built .app for the simulator. This is the single biggest win in the
      # job (~32m of the 51m). Keyed on the native fingerprint above, so a commit
      # that touches only JS reuses the binary while ANY native-input or Xcode
      # change forces a rebuild. No `restore-keys`: a partial-match fallback is
      # exactly the stale-binary false-pass this must never allow — the key is
      # all-or-nothing.
      #
      # restore + save are SPLIT rather than the one-step `actions/cache`, because
      # that action declares `post-if: success()` — it saves only when the whole
      # job succeeded. On a lane that is currently red that means the cache never
      # populates, so the 32-minute build is paid on every run and the warm path
      # is unreachable until the very greenness the cache is meant to help
      # deliver. Observed exactly that in runs 29762312605 and 29765712825: the
      # post step reported `skipped` and the native build ran full-length both
      # times. The save below runs `if: always()`, so a red run still banks the
      # binary it built. That is safe because the key is content-addressed: the
      # artifact is the product of those inputs whether or not a later Maestro
      # flow passed.
      - name: Restore the built iOS app
        id: ios_app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/centraid-mobile-e2e
          key: ios-release-${{ runner.os }}-${{ steps.native.outputs.hash }}
      # Deliberately NOT caching CocoaPods. A Pods cache hit leaves
      # ios/Pods/Manifest.lock matching Podfile.lock, so Expo CLI skips
      # `pod install` entirely — and `pod install` is the ONLY thing that runs
      # the centraid-tunnel podspec's prepare_command, which downloads the
      # git-ignored Iroh.xcframework and IrohLib.swift. Those are a vendored
      # framework and a compiled source of that pod, so skipping the fetch breaks
      # the native build outright. It would not even fail on the first run: the
      # cache is empty then. It would fail on the second native change, which is
      # exactly the path a pods cache exists to serve.
      - name: Build and install the mobile release app
        id: ios_build
        if: steps.ios_app.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        env:
          # #890 W1 — the perf-flavored release. `scroll-frames` and `cold-start`
          # were measuring a __DEV__ Hermes build, and the frame sampler only
          # existed under __DEV__ at all, so the probes could not have run
          # against the artifact even in principle. This flag is inlined into the
          # embedded bundle at export time, so the sampler ships in a build that
          # is otherwise a member's build.
          EXPO_PUBLIC_CENTRAID_FRAME_PROBE: "1"
        run: |
          set -euo pipefail
          # `--configure Release` is the whole #890 W1 change on this platform:
          # a Release-configuration simulator build with the Hermes bundle
          # EMBEDDED, so no bundler is involved at launch. `--no-bundler` then
          # only stops the CLI opening one it would not need.
          bunx expo run:ios --configuration Release --device "$SIMULATOR_UDID" --no-bundler
          # Copy the product out of derived data into the cached location. Fail
          # hard if it cannot be found: caching an empty directory would turn
          # every later run into a silent no-install.
          app="$(find ios/build ~/Library/Developer/Xcode/DerivedData \
            -maxdepth 8 -type d -name 'Centraid.app' -path '*-iphonesimulator*' -print -quit 2>/dev/null || true)"
          test -n "$app" || { echo "::error::built Centraid.app not found"; exit 1; }
          rm -rf ~/.cache/centraid-mobile-e2e
          mkdir -p ~/.cache/centraid-mobile-e2e
          # -R preserves the bundle's symlinks/permissions.
          cp -R "$app" ~/.cache/centraid-mobile-e2e/Centraid.app
          # Signals the save step below that there is a real bundle to bank.
          echo 'built=true' >> "$GITHUB_OUTPUT"
      # Banked even when a later step fails — see the note on the restore step.
      # Guarded on the build having actually run and produced a bundle, so a
      # cache-hit run does not re-save what it just restored, and a run that
      # died before the build cannot cache an empty directory.
      - name: Save the built iOS app
        if: always() && steps.ios_build.outputs.built == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/centraid-mobile-e2e
          key: ios-release-${{ runner.os }}-${{ steps.native.outputs.hash }}
      - name: Install the cached mobile release app
        if: steps.ios_app.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          app="$HOME/.cache/centraid-mobile-e2e/Centraid.app"
          test -d "$app" || { echo "::error::cached Centraid.app missing"; exit 1; }
          # Prove the cached bundle is the app the flows actually drive. The
          # Maestro harness launches by bundle id, so a mismatch here would fail
          # obscurely at flow time instead of loudly right now.
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          test "$bundle_id" = 'dev.centraid.mobile' \
            || { echo "::error::cached app bundle id is '$bundle_id', expected dev.centraid.mobile"; exit 1; }
          test -x "$app/Centraid" || { echo "::error::cached app has no executable"; exit 1; }
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          # Confirm the simulator agrees the app is installed and resolvable.
          xcrun simctl get_app_container "$SIMULATOR_UDID" dev.centraid.mobile
      # #890 W1 — NO METRO. The step that started `expo start --dev-client` and
      # waited on `/status` is gone with the dev client itself: a Release build
      # carries its own Hermes bundle, so there is nothing for a bundler to
      # serve. Everything that existed only to make the dev harness testable —
      # the bundle prewarm, the dev-launcher `openLink`, the developer-menu
      # explainer sheet — went with it.
      - run: node scripts/test-report/prepare.mjs
      # #890 W4 — iOS is the DEPTH platform, not a second copy of the roster.
      # Android gates PRs and runs the full roster nightly (D1); duplicating all
      # of it here would spend macOS minutes — roughly ten times a Linux minute —
      # re-proving claims Android already proved that same night. What this lane
      # owns is the set of claims only iOS can carry, enumerated with their
      # reasons in run-ios-depth-suite.mjs.
      - name: Run the iOS depth roster on the release artifact
        env:
          MAESTRO_PLATFORM: ios
          CENTRAID_MOBILE_BUILD: release
          CENTRAID_MOBILE_LANE: nightly-ios
        run: node tests/agent-e2e-mobile/run-ios-depth-suite.mjs
      - name: Remove sensitive pairing diagnostics
        if: always()
        run: |
          if [ -d tests/agent-e2e-mobile/runs ]; then
            find tests/agent-e2e-mobile/runs -type d \
              -path '*/maestro-debug/*-configure-gateway' \
              -prune -exec rm -rf {} +
          fi
      # Single-root evidence upload only — dual path (artifacts/ + runs/) made
      # upload-artifact v4 LCA-nest as artifacts/artifacts/e2e after merge-multiple
      # download, which generate.mjs never reads (#535 F1).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-mobile
          path: artifacts/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-debug-mobile-runs
          path: tests/agent-e2e-mobile/runs/
          retention-days: 7
          if-no-files-found: ignore

  # #496 PC1 / #630 — Android runs the same eight native blueprint covers as
  # iOS. Flake budget:
  # one retry at the flow harness; job failure still reds nightly. Metro and the
  # paired gateway must be up before Maestro.
  mobile-e2e-android:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'mobile-android'
    runs-on: ubuntu-latest
    # 120, not the iOS job's 60: this lane can pay a cold-cache gradle build
    # (~21 min, #535) before any flow runs, and swiftshader software rendering
    # makes each journey slower than the hardware-accelerated iOS simulator.
    # Raised from 90 when #781 added the three experience probes to this lane.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      # ubuntu-latest exposes /dev/kvm; enable it so the x86_64 emulator gets
      # hardware acceleration. macos-15 runners have no Hypervisor.framework
      # (HVF error: HV_UNSUPPORTED), so the Android emulator could not boot there
      # at all — this lane was dead, not slow. This is why the job is on Linux.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Pin the build JDK to 17 so gradle (via `expo run:android`) is stable and
      # the fingerprint's jdk<hash> component does not drift with runner images.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      # Fingerprint the Android native build inputs — same mechanism as the iOS
      # job (apps/mobile/scripts/native-fingerprint.mjs). Keyed so a JS-only
      # commit reuses the cached .apk while any native-input change rebuilds it.
      # The Android build toolchain (Gradle/AGP/NDK/compileSdk) lives in the
      # tracked android/ gradle files, which the fingerprint already hashes; the
      # host JDK is folded in separately (jdk<hash>), mirroring iOS's xc<hash>.
      # #892 Phase 0 — `apk_key` adds the embedded Hermes bundle's inputs to the
      # native ones and keys the APK; `hash` stays native-only and keys the gradle
      # BUILD DIRECTORY. @expo/fingerprint ignores `src/**` by design, which was
      # right under the dev client (Metro served the JS live) and wrong from #890
      # W1 onward, when every device lane moved to the release artifact and the JS
      # became part of the binary. All three Android lanes derive both identically
      # or the caches cannot be shared between them.
      - name: Fingerprint the Android native build inputs
        id: native_android
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          fp="$(node scripts/native-fingerprint.mjs android)"
          test -n "$fp" || { echo "::error::empty Android fingerprint"; exit 1; }
          js="$(node scripts/js-bundle-fingerprint.mjs)"
          test -n "$js" || { echo "::error::empty JS bundle fingerprint"; exit 1; }
          jdk="$(java -version 2>&1 | head -1 | shasum -a 256 | cut -d' ' -f1)"
          echo "hash=jdk${jdk:0:12}-fp${fp}" >> "$GITHUB_OUTPUT"
          echo "apk_key=jdk${jdk:0:12}-fp${fp}-js${js}" >> "$GITHUB_OUTPUT"
          echo "Android fingerprints: fp=$fp js=$js jdk=$jdk"
      - name: Install Maestro CLI
        # #890 W0 — pinned to the SAME version iOS pins. This lane installed
        # whatever `releases/latest` served, so the two platforms could be
        # driven by different device drivers on the same night and a driver
        # regression would land here with no commit to blame it on.
        env:
          MAESTRO_VERSION: 2.6.1
        run: bash scripts/ci/install-maestro.sh
      - name: Build mobile workspace (host, before emulator)
        run: bun run turbo run build --filter=@centraid/mobile...
      - name: Build and start the tokenless mobile test gateway
        run: |
          bun run turbo run build --filter=@centraid/server
          gateway_dir="$RUNNER_TEMP/centraid-mobile-gateway"
          nohup node tests/agent-e2e-mobile/lib/ci-gateway.mjs "$gateway_dir" 18789 > /tmp/centraid-mobile-gateway.log 2>&1 &
          echo "CENTRAID_MOBILE_GATEWAY_PID=$!" >> "$GITHUB_ENV"
          echo "MAESTRO_GATEWAY_URL=http://127.0.0.1:18789" >> "$GITHUB_ENV"
          for attempt in {1..90}; do
            if node tests/agent-e2e-mobile/lib/ci-gateway-ready.mjs http://127.0.0.1:18789; then exit 0; fi
            sleep 2
          done
          cat /tmp/centraid-mobile-gateway.log
          exit 1
      # #890 W1 — NO METRO. Gone with the dev client: the Release apk carries its
      # own Hermes bundle, so there is nothing for a bundler to serve and no
      # `adb reverse` to set up. The dev client stays the LOCAL exploratory rig.
      # Restore the built Android RELEASE apk. Same all-or-nothing, split
      # restore/save rationale as the iOS job: the emulator action's script runs
      # the build, so a cache HIT skips gradle entirely and just adb-installs the
      # banked apk. No restore-keys — a partial match would install a stale apk.
      # The key names the configuration (`android-release-`) so a Debug apk
      # banked before #890 W1 can never restore into this lane.
      - name: Restore the built Android app
        id: android_app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/centraid-mobile-e2e-android
          key: android-release-${{ runner.os }}-${{ steps.native_android.outputs.apk_key }}
      # #890 W1 — the OTHER half of build-once-run-many, and the one place
      # `restore-keys` is correct. A partial match here restores a warm gradle
      # BUILD DIRECTORY, not an artifact: gradle re-checks every task's inputs
      # against the current tree, so a JS-only change re-runs only the bundle and
      # packaging tasks (the "repackage into the cached native shell" case) and a
      # native change rebuilds what it must. Nothing stale can survive a
      # task-input check — which is exactly why restore-keys is refused on the
      # apk cache above and correct on this one.
      - name: Restore the Android gradle build directory
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/mobile/android/app/build
            apps/mobile/android/build
            ~/.gradle/caches
          key: android-gradle-${{ runner.os }}-${{ steps.native_android.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            android-gradle-${{ runner.os }}-${{ steps.native_android.outputs.hash }}-
            android-gradle-${{ runner.os }}-
      # AVD snapshot caching — the reactivecircus best practice. The first run
      # boots a clean emulator once and banks a booted-state snapshot; every
      # later run resumes from it in seconds instead of a ~40s cold boot. It also
      # removes the first-boot Pixel Launcher race that ANR'd under the software
      # GPU and stole the window from Maestro (#535): a resumed launcher is
      # already settled. The key pins every AVD-shaping input — bump the trailing
      # -vN to invalidate after an emulator/image bump. Distinct from the apk
      # cache (different key, different path); both can hit independently.
      # Restore-then-save, for the reason already written above the apk and
      # gradle caches and not applied to this one: `actions/cache` declares
      # `post-if: success()`, so on a red lane the snapshot never saves and every
      # run pays the ~2-minute create — the warm path stays unreachable until the
      # greenness the cache exists to help deliver. `Post AVD cache` reported
      # `skipped` on every red run while `Create AVD + snapshot` ran on every one,
      # which is that same fact stated twice in the logs.
      - name: AVD cache
        id: avd_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-google_apis-pixel6-r4096-c4-v1
      - name: Create AVD + snapshot (cache miss only)
        if: steps.avd_cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Every AVD-shaping input below MUST match the test step's, or the
          # cached snapshot will not load. `disable-animations: false` here so the
          # setting is not baked wrong into the snapshot (reactivecircus pattern).
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Save the AVD snapshot
        if: steps.avd_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-google_apis-pixel6-r4096-c4-v1
      - name: Set up Android SDK + emulator
        id: emu
        # v2.38.0 — prior pin 1dcd009…dd was a typo/orphan SHA (#535 F6).
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          # Read inside the action's script to branch build-vs-install. The apk
          # lives under $HOME so it carries from the restore step into the
          # action's shell (same runner, same home).
          ANDROID_CACHE_HIT: ${{ steps.android_app.outputs.cache-hit }}
          CENTRAID_MOBILE_BUILD: release
          CENTRAID_MOBILE_LANE: nightly-android
        with:
          api-level: 34
          # x86_64 (not arm64-v8a) so /dev/kvm on the Linux runner accelerates it.
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # Match the snapshot-gen step's AVD shape exactly (or the cached
          # snapshot will not load). 4 GB / 4 cores on the 16 GB / 4-vCPU runner
          # gives the app real headroom, so the launcher is far less likely to
          # ANR under Metro + app load.
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          # `-no-snapshot-save`: boot FROM the cached snapshot but do not re-bank
          # it, so a test run never rewrites the clean cached snapshot.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          # The action executes `script:` via dash; a multi-line if/else with
          # comments and non-ASCII chars tripped its parser (#535). Keep this a
          # single line that hands off to a committed bash file instead.
          script: bash apps/mobile/scripts/android-emulator-roster.sh
      # Mirrors the iOS job's identical step. The harness already rm -rf's this
      # directory in a finally, so this is belt-and-braces against a run that
      # dies before the finally — but it was iOS-only, which meant an Android
      # crash mid-pairing could ship pairing diagnostics in the runs/ artifact.
      - name: Remove sensitive pairing diagnostics
        if: always()
        run: |
          if [ -d tests/agent-e2e-mobile/runs ]; then
            find tests/agent-e2e-mobile/runs -type d \
              -path '*/maestro-debug/*-configure-gateway' \
              -prune -exec rm -rf {} +
          fi
      # Bank the apk even if a later flow failed — the artifact is the product of
      # the fingerprinted inputs regardless of whether Maestro passed (see iOS).
      # Guarded on the build having actually produced an apk, so a cache-hit run
      # does not re-save what it just restored and a run that died before the
      # build cannot cache an empty directory.
      - name: Save the built Android app
        if: always() && steps.emu.outputs.built == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/centraid-mobile-e2e-android
          key: android-release-${{ runner.os }}-${{ steps.native_android.outputs.apk_key }}
      # Bank the warm gradle build directory too, so tomorrow's nightly and the
      # next PR gate both restore it. Unguarded `if: always()`: unlike the apk,
      # a build directory is worth banking even from a run that never produced
      # an installable artifact — the compiled native tasks inside it are still
      # valid inputs for the next run.
      - name: Save the Android gradle build directory
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/mobile/android/app/build
            apps/mobile/android/build
            ~/.gradle/caches
          key: android-gradle-${{ runner.os }}-${{ steps.native_android.outputs.hash }}-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-mobile-android
          path: artifacts/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-debug-mobile-android-runs
          path: tests/agent-e2e-mobile/runs/
          retention-days: 7
          if-no-files-found: ignore

  # Pairing journeys (issue #289 / matrix tunnel-pairing). Independent jobs so
  # one failure still leaves evidence from the others for the health report.
  pairing-lifecycle:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'pairing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - run: bun run turbo run build --filter=@centraid/server --filter=@centraid/tunnel
      - run: node scripts/test-report/prepare.mjs
      - run: node tests/agent-e2e-pairing/flows/device-pairing-lifecycle.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-pairing-lifecycle
          path: artifacts/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-debug-pairing-lifecycle-runs
          path: tests/agent-e2e-pairing/runs/
          retention-days: 7
          if-no-files-found: ignore

  pairing-ticket-hygiene:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'pairing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - run: bun run turbo run build --filter=@centraid/server --filter=@centraid/tunnel
      - run: node scripts/test-report/prepare.mjs
      - run: node tests/agent-e2e-pairing/flows/pairing-ticket-hygiene.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-pairing-ticket-hygiene
          path: artifacts/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-debug-pairing-ticket-hygiene-runs
          path: tests/agent-e2e-pairing/runs/
          retention-days: 7
          if-no-files-found: ignore

  pairing-cross-network-relay:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'pairing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - run: docker info
      - run: bun run turbo run build --filter=@centraid/server --filter=@centraid/tunnel
      - run: node scripts/test-report/prepare.mjs
      # Production must never silently fall back to the JS byte pump.
      - run: test -f packages/tunnel/native/centraid-tunnel-native.linux-x64.node
      - run: node tests/agent-e2e-pairing/flows/cross-network-relay.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-pairing-cross-network-relay
          path: artifacts/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-debug-pairing-cross-network-relay-runs
          path: tests/agent-e2e-pairing/runs/
          retention-days: 7
          if-no-files-found: ignore

  # #532 — Stryker mutation lane (nightly, all seeds). Per-PR runs affected
  # seeds only via ci.yml mutation-pr. Floors ratcheted via
  # tests/mutation-floors.json + test:ratchet; per-PR enforces measured floors.
  mutation-testing:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'report' || github.event.inputs.suite == 'mutation'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - run: bun run build
      # #545 A2 — mutation must fail the job (and thus nightly-failure-issue)
      # when floors/seeds go red. continue-on-error was silencing breaches.
      - name: Run Stryker on seed packages
        id: mutation
        run: bun run test:mutation -- --enforce-floors
      # Upload `artifacts/` (not `artifacts/mutation/`) so merge-multiple download
      # into the report job's `artifacts/` path keeps `mutation/scores.json` —
      # same layout as desktop/web/pairing evidence jobs. Uploading the mutation
      # subdir alone flattens scores.json to the artifact root.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-mutation
          path: artifacts/
          retention-days: 14

  # #892 Phase 3 — LANE HEALTH, AND THE CHRONIC-RED RULE.
  #
  # Two decisions this repo has been making on memory. The promotion rule
  # ("a nightly-only area that burns us twice moves to the PR lane",
  # lane-client-e2e.yml) counts nothing; and its inverse — a REQUIRED lane whose
  # first attempt fails on clean code — is worse and was unwritten, because a
  # re-run habit devalues all nineteen lanes at once. This job measures
  # first-attempt pass rate per lane over the last 40 completed `main` runs and
  # puts the table on the run page.
  #
  # The chronic-red half is the enforcement: a lane red on main for more than
  # three days fails this job unless it carries an UNEXPIRED entry in
  # tests/lane-quarantine.json — the same declared/attributed/expiring discipline
  # tests/quarantine.json has applied to tests since #545, extended to lanes,
  # which had no equivalent and so simply stayed red.
  #
  # Nightly rather than per-PR because it reads api.github.com, and the PR loop
  # must not acquire a dependency on it (the rule test:citations already follows).
  lane-health:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'report'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Measure first-attempt pass rate and red streaks
        id: lanes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ci/lane-health.mjs \
            --repo "${{ github.repository }}" \
            --runs 40 \
            --chronic-red-days 3 \
            --out artifacts/lane-health/summary.json
      # The measurement is evidence whether or not the rule fired, so it is
      # uploaded `if: always()` and merged into the nightly report's artifact set
      # the same way every other lane's evidence is.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-lane-health
          path: artifacts/
          retention-days: 14
      - name: File a tracking issue for a chronically red lane
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/chronic-red.md <<EOF
          A required lane has been red on \`main\` for more than three days.

          A lane that stays red teaches merging past red, and that devalues every
          other lane at the same time. Two ways out, both deliberate:

          1. Fix it.
          2. Park it in \`tests/lane-quarantine.json\` **with an expiry** and this
             issue number. An entry with no \`expires\`, or one whose date has
             passed, is treated as no entry at all.

          The per-lane first-attempt pass rates and red streaks are in the
          \`nightly-evidence-lane-health\` artifact on run ${{ github.run_id }}.
          EOF
          node scripts/ci/file-tracking-issue.mjs \
            --title '[lanes] a required lane has been red on main for days' \
            --search '[lanes] a required lane has been red on main' \
            --body-file /tmp/chronic-red.md \
            --label tech-debt \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # #892 Phase 2 — DATA SAFETY OVER TIME FINALLY HAS A LANE.
  #
  # `tests/agent-e2e-compat/flows/install-upgrade-lifecycle.mjs` has existed since
  # #842 W5.4. It asserts, in as many words, "upgrade did not preserve the old
  # vault's data" — the #1 risk for a local-first sovereign vault — and it was
  # referenced by NO WORKFLOW. Its sibling `released-binary-skew.mjs` was in the
  # same position: version skew is proved in this repo as range arithmetic
  # (`mobile-gateway-skew.test.ts`) and never as two real binaries talking.
  #
  # Both are written to skip-with-citation rather than fabricate a pass, so this
  # job is green and LOUD from its first run: with no published release the
  # runners emit their `blocked-external` reasons as warnings and exit 0. What
  # changes tonight is that the citation is on a run page instead of in a file
  # nobody executes, and the day a release exists the lanes start driving real
  # binaries with no further wiring.
  #
  # `--json` on `gh release view` rather than parsing HTML, and a `|| true` so a
  # repo with no releases at all resolves to empty instead of failing the job:
  # "there is no previous release" is the state the runners are built to report.
  compat-upgrade-and-skew:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'report' || github.event.inputs.suite == 'compat'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      # Tonight's gateway, built from source — the N side of the N−1 pairing.
      - run: bun run build
      - name: Resolve the previous release
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "::warning title=No previous release::the compat lanes will skip with their blocked-external citations"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "resolved previous release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/prev-release"
          # Best-effort: a release that ships no installer asset leaves the
          # upgrade lane on its citation rather than failing the job. The lane's
          # own judge refuses an available-but-didn't-run result, so a downloaded
          # asset can never pass vacuously.
          gh release download "$tag" --dir "$RUNNER_TEMP/prev-release" --clobber || true
          installer="$(find "$RUNNER_TEMP/prev-release" -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' \) -print -quit || true)"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
      # Data safety over time: install N−1, write real rows, upgrade in place,
      # re-read them. `CENTRAID_UPGRADE_PREV_INSTALLER` is what turns the lane
      # live; absent, `resolvePreviousInstaller` returns the #790 citation.
      - name: Install → upgrade → the vault is still there
        env:
          CENTRAID_UPGRADE_PREV_INSTALLER: ${{ steps.prev.outputs.installer }}
        run: node tests/agent-e2e-compat/flows/install-upgrade-lifecycle.mjs
      # N−1 binary skew: the last published client against tonight's gateway.
      # Shares "the previous release, runnable" with the lane above, which is why
      # they are one job rather than two.
      - name: N−1 client against tonight's gateway
        env:
          CENTRAID_SKEW_RELEASE_TAG: ${{ steps.prev.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tests/agent-e2e-compat/flows/released-binary-skew.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-compat
          path: artifacts/
          retention-days: 14

  # #839 G10 — mutation-based fuzzing of the parsers that eat bytes somebody
  # else chose: the gateway handshake, the tunnel wire, the CBSF blob
  # directory, WAL object keys, and the two FTS MATCH compilers. No fuzzing
  # dependency exists in this repo and none may be added, so the engine is
  # `scripts/fuzz/` itself: a seeded PRNG, a mutation table, and per-target
  # invariants. Its own job (restore-year3 pattern) because a full lane is
  # millions of executions that must not compete with the 30-minute
  # quality-performance-scale budget, and because it must never touch the PR
  # lane — the PR-path guard is `test:fuzz:replay`, which replays only the
  # committed crashers and finishes in a second.
  fuzz-parsers:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'report' || github.event.inputs.suite == 'fuzz'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      # Five of the six targets are imported from each package's built dist,
      # the same way scripts/design-gallery.mjs reads packages/design/dist.
      - run: bun run build
      # Fails on any finding whose class is not registered in
      # scripts/fuzz/known-findings.json — registered ones are recorded defects
      # pinned byte-for-byte by the replay suite below.
      - name: Fuzz protocol, tunnel, blob, WAL, and search parsers
        run: bun run test:fuzz
      # Runs even when the search above found something new: the committed
      # crasher corpus must keep replaying exactly as recorded.
      - name: Replay committed crashers
        if: always()
        run: bun run test:fuzz:replay
      # Upload `artifacts/` (not `artifacts/fuzz/`) so merge-multiple download
      # into the report job keeps `fuzz/summary.json` — same reason as the
      # mutation lane.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-fuzz
          path: artifacts/
          retention-days: 14

  # #842 W2.4 — dynamic scan of the BOOTED gateway, as opposed to the static
  # route-security enumeration the PR lane already runs. Nightly rather than
  # per-PR because it boots a real server, and it needs `bun run build` for the
  # same reason the fuzz lane does: it drives packages/server/dist and
  # packages/core/dist, and reads the ROUTES table rather than a hardcoded list.
  dast-scan:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'report' || github.event.inputs.suite == 'dast'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - run: bun run build
      # Fails on any finding whose key is not registered in
      # scripts/security/dast-known-findings.json. Registered ones are recorded
      # defects whose current behaviour is pinned by the unit judges — removing
      # an entry is how a fix gets locked in, never adding one to go green.
      - name: Dynamic scan of the booted gateway HTTP surface
        run: node scripts/security/dast-scan.mjs --out artifacts/dast/summary.json
      # Upload `artifacts/` (not `artifacts/dast/`) so merge-multiple download
      # into the report job keeps `dast/summary.json` — same reason as fuzz.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-dast
          path: artifacts/
          retention-days: 14

  # #587 C1 — performance and scale are an independent parallel lane. New
  # rigs cannot consume the report job's 35-minute budget or prevent coverage
  # and report rendering from starting when this lane is red.
  quality-performance-scale:
    needs: [web-e2e, desktop-e2e]
    if: >
      always() && (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.suite == 'all' ||
        github.event.inputs.suite == 'report'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - name: Restore web waterfall evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-evidence-web
          path: artifacts
      # #659 R3b — the REAL Electron launch is measured in the desktop-e2e job
      # (vitest cannot start Electron on a display-less runner) and consumed
      # here by tests/perf/desktop-launch.perf.test.ts, exactly as the PWA
      # waterfall report is.
      - name: Restore desktop launch evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-evidence-desktop
          path: artifacts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            artifacts/perf
            artifacts/scale
            artifacts/year3-cache
          key: quality-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: quality-history-${{ runner.os }}-
      - run: sudo apt-get update && sudo apt-get install -y strace
      - run: bun run build
      - id: perf
        continue-on-error: true
        run: bun run test:perf
      - id: scale
        continue-on-error: true
        env:
          CENTRAID_YEAR3_CACHE_DIR: artifacts/year3-cache
        run: bun run test:scale
      # #842 W3.1/W3.2 — the seeded chaos lanes run on every PR in `cover` mode
      # (every fault exactly once, ~18 s). Here they run in `sample` mode, so
      # the nightly draws ~5 times per fault against a different part of the
      # seeded space. ~68 s.
      - id: chaos
        continue-on-error: true
        run: bun run test:chaos:sweep
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-quality
          path: artifacts/
          retention-days: 14
      - name: Enforce the quality-lane budget results
        if: always()
        run: |
          echo "perf=${{ steps.perf.outcome }}"
          echo "scale=${{ steps.scale.outcome }}"
          echo "chaos=${{ steps.chaos.outcome }}"
          if [ "${{ steps.perf.outcome }}" != "success" ] || \
             [ "${{ steps.scale.outcome }}" != "success" ] || \
             [ "${{ steps.chaos.outcome }}" != "success" ]; then
            echo "::error::Nightly performance/scale/chaos lane failed"
            exit 1
          fi

  # #659 S3 — year-3 restore. Backup honesty is a product promise and the
  # restore time at 10 GiB was a guess until this job ran it. Its own job
  # because 10 GiB of chunk + AEAD + restore does not fit the 30-minute
  # quality-performance-scale budget, and it must never touch the PR lane.
  restore-year3:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'report'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            artifacts/scale
            artifacts/year3-cache
          key: quality-history-restore-${{ runner.os }}-${{ github.run_id }}
          restore-keys: quality-history-restore-${{ runner.os }}-
      - run: bun run build
      # ~25 GiB of scratch is needed for the source vault, the provider store
      # and the restore destination. A runner that cannot spare it fails here
      # with a clear message rather than mid-restore.
      - name: Report free disk before the run
        run: df -h .
      - name: Restore a 10 GiB year-3 vault
        env:
          CENTRAID_SCALE_RESTORE_GIB: "10"
          CENTRAID_YEAR3_CACHE_DIR: artifacts/year3-cache
        run: node node_modules/vitest/vitest.mjs run --config vitest.scale.config.ts tests/scale/restore-10gib.scale.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-restore
          path: artifacts/
          retention-days: 14

  # #839 G11/G12 — the protocol JOIN lane. Every other suite that exercises two
  # vaults talking to each other calls the vault package directly; nothing puts
  # N seats on ONE gateway and makes them speak the real wire. This job runs
  # `packages/server/src/serve/protocol-join-lane.test.ts` at WIDTH
  # (CENTRAID_JOIN_SEATS), where each case boots a real `serve()` daemon, mounts
  # N vaults, and opens one iroh tunnel client per seat.
  #
  # Its own job (restore-year3 pattern) for three reasons: N real iroh endpoints
  # per case must not compete with the 30-minute quality-performance-scale
  # budget protected by #587 C1; a correctness rig has no volume/duration
  # descriptor, so tests/scale + quality-rig-budgets.json would mis-file it; and
  # real QUIC transport is the one dependency here that can be environment
  # sensitive, so a red join lane must not be able to mask coverage and report
  # rendering. The suite still runs on the PR path at its 3-seat floor — this
  # job widens it, it does not own it.
  protocol-join:
    if: >
      github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'report' || github.event.inputs.suite == 'join'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - run: bun run build
      # Five seats = one gateway with five mounted vaults and five live tunnel
      # clients per case. The vitest JSON report IS the evidence: per-test
      # durations for the join laws are what a widening seat count moves.
      - name: Join lane — grant delivery, revocation severance, parked lifecycle, version skew
        env:
          CENTRAID_JOIN_SEATS: "5"
        run: node node_modules/vitest/vitest.mjs run --project @centraid/server --reporter=default --reporter=json --outputFile=artifacts/join/summary.json protocol-join-lane
      # Upload `artifacts/` (not `artifacts/join/`) so merge-multiple download
      # into the report job keeps `join/summary.json` — same reason as the
      # mutation and fuzz lanes.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence-join
          path: artifacts/
          retention-days: 14

  test-health-report:
    needs:
      [
        desktop-e2e,
        web-e2e,
        mobile-e2e-ios,
        mobile-e2e-android,
        pairing-lifecycle,
        pairing-ticket-hygiene,
        pairing-cross-network-relay,
        mutation-testing,
        fuzz-parsers,
        dast-scan,
        compat-upgrade-and-skew,
        lane-health,
        quality-performance-scale,
        restore-year3,
        protocol-join,
      ]
    if: >
      always() && (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.suite == 'all' ||
        github.event.inputs.suite == 'report'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      # Same-run evidence only (desktop/web/mobile/pairing). Pairing no longer
      # pulls artifacts from a separate scheduled workflow run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-evidence-*
          path: artifacts
          merge-multiple: true
      - name: Restore latest weekly real-model evidence
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/enrichment-live/
          key: enrichment-live-${{ runner.os }}-${{ github.run_id }}
          restore-keys: enrichment-live-${{ runner.os }}-
      - run: bun run build
      # #545 A1 — keep continue-on-error so the report still generates when a
      # quality lane fails; a post-step re-reads outcomes and fails the job.
      - id: coverage
        continue-on-error: true
        run: bun run coverage
      # Durable trend source: the append-only summary series committed to
      # gh-pages. Unlike the quality-history cache above it is never evicted.
      - name: Restore durable report history (gh-pages)
        if: always()
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: .gh-pages-history
      - name: Stage durable report history
        if: always()
        run: |
          mkdir -p artifacts/report-history
          if [ -d .gh-pages-history/test-report/history ]; then
            if ! cp .gh-pages-history/test-report/history/*.json artifacts/report-history/ 2>/dev/null; then
              echo "::warning::report history copy produced no files (empty or missing history dir)"
            fi
          else
            echo "::warning::no durable report history on gh-pages yet; trend series starts empty"
          fi
          rm -rf .gh-pages-history
      # Job conclusions for honesty: a red needs.* job cannot yield silent
      # failed:0 (#535 F5). generate.mjs reads artifacts/test-results/job-conclusions.json.
      - name: Write evidence-job conclusions
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          mkdir -p artifacts/test-results
          printf '%s\n' "$NEEDS_JSON" > artifacts/test-results/job-conclusions.json
      - name: Generate full nightly report
        if: always()
        env:
          TEST_REPORT_SCOPE: nightly
        run: bun run test:report
      # Coverage still runs here so the report can render on failure. Perf and
      # scale have their own required nightly job above (#587 C1).
      - name: Fail if quality lanes failed
        if: always()
        run: |
          echo "coverage=${{ steps.coverage.outcome }}"
          if [ "${{ steps.coverage.outcome }}" != "success" ]; then
            echo "::error::Nightly coverage lane failed — see step above"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-test-health-report
          path: dist/test-report/
          retention-days: 30
      - name: Write Job Summary
        if: always()
        env:
          TEST_REPORT_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/test-report/nightly/
        run: node scripts/test-report/write-job-summary.mjs --report-url "$TEST_REPORT_PUBLIC_URL" --title "Nightly test health"
      # #864 Wave 0 — the ledgers' "still open" claim is a hand-maintained
      # snapshot, so only GitHub can say whether it went stale. Nightly-only:
      # the PR lane must not gain a dependency on api.github.com. Runs last and
      # `if: always()` so it can never suppress the report it follows, and an
      # unreachable API fails the job rather than passing silently.
      - name: Every tracked exception cites an open issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run test:citations

  # Public nightly HTML (same Pages tree as main; no per-PR slots).
  # #496 E2 — main-only so branch workflow_dispatch cannot red the workflow
  # with "Branch … is not allowed to deploy to github-pages".
  #
  # #557 — a FAILED report job must still publish. The report's whole purpose is
  # to show red, and `test-health-report` fails on its own honesty exits
  # (orphaned failed evidence, silent all-clear, grey creep) *after* writing
  # dist/test-report/. Gating on `== 'success'` meant every honesty exit also
  # suppressed the page that would have shown the failure — Pages served a
  # three-day-stale green report while #556 tracked a red lane. Mirrors
  # ci.yml's publish-report, which had this right.
  #
  # `skipped` is still excluded: single-lane dispatch (suite != all/report)
  # skips the report job, and publishing then would false-alarm the "HTML
  # missing" tracking issue below (#496 review). The `Require report HTML`
  # step remains the real guard for a job that died before writing output.
  publish-nightly-report:
    needs: [test-health-report]
    if: >
      always() && needs.test-health-report.result != 'cancelled' && needs.test-health-report.result != 'skipped' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages-test-report
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
      # Job-level permissions replace workflow-level; without this, the
      # "HTML missing" auto-issue step 403s on the exact alert path (#496 E2).
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.slot.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download nightly report
        id: download_report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-test-health-report
          path: dist/test-report
      - name: Require report HTML
        id: has_report
        run: |
          if [ -f dist/test-report/index.html ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::nightly-test-health-report missing; skip Pages publish"
            echo "::error::nightly report HTML missing — publish skipped (visible, not silent)"
          fi
      - name: Open tracking issue when HTML is missing
        if: steps.has_report.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > /tmp/missing-html.md <<EOF
          Nightly publish skipped because \`dist/test-report/index.html\` was missing.

          - Run: ${RUN_URL}
          - Workflow: e2e / publish-nightly-report
          - Ref: \`${{ github.ref }}\`

          Auto-filed by #496 E2/E3. Update this issue rather than opening duplicates.
          EOF
          node scripts/ci/file-tracking-issue.mjs \
            --title '[nightly] test-health report HTML missing' \
            --search '[nightly] test-health report HTML missing' \
            --body-file /tmp/missing-html.md \
            --label tech-debt \
            --run-url "$RUN_URL"
      - name: Restore previous Pages tree (gh-pages)
        if: steps.has_report.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
      - name: Seed site if gh-pages missing
        if: steps.has_report.outputs.ok == 'true'
        run: |
          mkdir -p site
          rm -rf site/.git
      - name: Resolve report slot
        if: steps.has_report.outputs.ok == 'true'
        id: slot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SLOT="nightly"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "slot=${SLOT}" >> "$GITHUB_OUTPUT"
          echo "url=https://${OWNER}.github.io/${REPO}/test-report/${SLOT}/" >> "$GITHUB_OUTPUT"
          # Emits date= and slug= — the same derivation nightly-failure-issue
          # uses, so the issue's dated link and this publish cannot disagree.
          node scripts/ci/run-slug.mjs --repo "${{ github.repository }}" --run-id "${{ github.run_id }}"
      - name: Merge report into site tree
        if: steps.has_report.outputs.ok == 'true'
        run: |
          node scripts/test-report/prepare-pages-site.mjs \
            --report dist/test-report \
            --site site \
            --slot "${{ steps.slot.outputs.slot }}" \
            --date "${{ steps.slot.outputs.date }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --keep 30
      - name: Persist site on gh-pages
        if: steps.has_report.outputs.ok == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: false
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Upload Pages artifact
        if: steps.has_report.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        if: steps.has_report.outputs.ok == 'true'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      # #557 — `echo "::error::"` annotates but does not fail a step, so a
      # publish that shipped nothing still ended GREEN. The tracking issue above
      # was the only signal. Fail the job too, so "published nothing" is red in
      # the Actions UI as well as in an issue.
      - name: Fail when nothing was published
        if: always() && steps.has_report.outputs.ok != 'true'
        run: |
          echo "::error::nightly report HTML missing — nothing was published"
          exit 1

  # #496 E3 — single tracking issue when a *scheduled* nightly goes red.
  # Soft SLA (documented in TESTING.md): open/update issue with run + report links.
  nightly-failure-issue:
    needs:
      [
        desktop-e2e,
        web-e2e,
        mobile-e2e-ios,
        mobile-e2e-android,
        pairing-lifecycle,
        pairing-ticket-hygiene,
        pairing-cross-network-relay,
        mutation-testing,
        fuzz-parsers,
        dast-scan,
        compat-upgrade-and-skew,
        lane-health,
        quality-performance-scale,
        restore-year3,
        protocol-join,
        test-health-report,
      ]
    # #557 — `cancelled` counts as red. A runner that dies or a job aborted
    # mid-flight leaves the nightly red in the UI; the old per-job
    # `== 'failure'` list filed nothing for it. `needs.*.result` also means a
    # job added to `needs:` is covered automatically, instead of silently
    # falling outside a hand-maintained list.
    if: >
      always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && (
        contains(join(needs.*.result, ','), 'failure') ||
        contains(join(needs.*.result, ','), 'cancelled')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download report summary for cell-level delta
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-test-health-report
          path: dist/test-report
      - name: Prepare cell-level delta
        run: node scripts/ci/report-cell-delta.mjs --summary dist/test-report/summary.json --output /tmp/cell-delta.md
      - name: Resolve this run's immutable report slot
        id: slug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/run-slug.mjs --repo "${{ github.repository }}" --run-id "${{ github.run_id }}"
      - name: Open or update nightly red tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # /test-report/nightly/ is a MUTABLE alias: tomorrow's run overwrites
          # it, so an issue citing only that link silently starts describing a
          # different run. prepare-pages-site.mjs archives every publish to an
          # immutable runs/<slug>/ slot (kept 30 deep); cite that as primary.
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/test-report/nightly/runs/${{ steps.slug.outputs.slug }}/
          LATEST_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/test-report/nightly/
        run: |
          set -euo pipefail
          cat > /tmp/nightly-red.md <<EOF
          ## Nightly e2e failure

          A **scheduled** nightly run failed. Soft SLA (#496 / TESTING.md): respond within **24h** or before the next scheduled run.

          | Signal | Link |
          | --- | --- |
          | Actions run | ${RUN_URL} |
          | Report for **this** run (immutable) | ${REPORT_URL} |
          | Newest nightly (moves every night) | ${LATEST_URL} |
          | Job Summary | open the run → Summary |

          The dated link is archived for the 30 most recent publishes; after that
          its HTML is pruned and the run stays in \`test-report/history/index.json\`.

          ### Job results
          - desktop-e2e: \`${{ needs.desktop-e2e.result }}\`
          - web-e2e: \`${{ needs.web-e2e.result }}\`
          - mobile-e2e-ios: \`${{ needs.mobile-e2e-ios.result }}\`
          - mobile-e2e-android: \`${{ needs.mobile-e2e-android.result }}\`
          - pairing-lifecycle: \`${{ needs.pairing-lifecycle.result }}\`
          - pairing-ticket-hygiene: \`${{ needs.pairing-ticket-hygiene.result }}\`
          - pairing-cross-network-relay: \`${{ needs.pairing-cross-network-relay.result }}\`
          - mutation-testing: \`${{ needs.mutation-testing.result }}\`
          - quality-performance-scale: \`${{ needs.quality-performance-scale.result }}\`
          - test-health-report: \`${{ needs.test-health-report.result }}\`

          ### Cell-level delta
          EOF
          cat /tmp/cell-delta.md >> /tmp/nightly-red.md
          cat >> /tmp/nightly-red.md <<EOF
          _Auto-filed by e2e.yml \`nightly-failure-issue\`. Prefer updating this issue over opening duplicates._
          EOF
          node scripts/ci/file-tracking-issue.mjs \
            --title '[nightly] e2e lane red — tracking' \
            --search '[nightly] e2e lane red' \
            --body-file /tmp/nightly-red.md \
            --label tech-debt \
            --run-url "$RUN_URL"
