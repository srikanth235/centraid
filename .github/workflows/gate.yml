name: gate

# The pull-request gate, and the only workflow that listens on `pull_request`.
# Nothing here is path-filtered: a filtered-out job reports no status, and a
# required check that never reports blocks the PR forever (#557).
#
#   gate               `cargo xtask gate --profile pr` — every step a PR must
#                      pass, Rust, protobuf, TypeScript and CI policy alike
#                      (crates/xtask/README.md).
#   engine             the on-device chat's llama.cpp build, too slow for the
#                      `pr` profile (R-CHAT-10).
#   ios                Swift 6/XCTest, real Rust core, and asserted simulator captures.
#   android-visual     real Rust core and asserted emulator captures.
#   dependency-review  the PR's dependency diff, read through the API.
#   pr-title           the squash subject, checked by `.githooks/commit-msg`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # UIKit needs a real Apple SDK; Linux's JVM gate cannot compile the shell.
  ios:
    runs-on: macos-26
    # Full native rebuild, XCTest and 66 Maestro cases include simulator-driver
    # startup per case. This is a runner backstop, not an app timing assertion.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Xcode (fail if unavailable)
        run: bash mobile/scripts/select-xcode.sh
      - uses: ./.github/actions/setup
        with:
          bun: "false"
          rust: "true"
          rust-targets: aarch64-apple-ios-sim
          cargo-cache: ios-simulator
      - name: Install the native generators
        run: brew install xcodegen protobuf swift-protobuf
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install checksum-pinned Maestro
        run: bash mobile/scripts/visual-install-maestro.sh
      - name: Build the actual simulator core with llama
        run: |
          set -euo pipefail
          mkdir -p target/ios-verification
          IPHONEOS_DEPLOYMENT_TARGET="$(cat mobile/ios-deployment-target)"
          export IPHONEOS_DEPLOYMENT_TARGET
          mobile/scripts/ios-core.sh aarch64-apple-ios-sim 2>&1 | tee target/ios-verification/rust-core.log
      - name: Compile Swift 6, run XCTest, and capture asserted screens
        env:
          CENTRAID_VISUAL: "1"
        run: bash mobile/scripts/verify-ios.sh
      - name: Upload iOS compiler and XCTest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-verification
          path: |
            target/ios-verification/*.log
            target/ios-verification/*.xcresult
            mobile/iosApp/Sources/Generated
          retention-days: 7
          if-no-files-found: warn
      - name: Upload iOS visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-visual-verification
          path: target/ios-verification/visual
          retention-days: 7
          if-no-files-found: warn

  android-visual:
    runs-on: ubuntu-latest
    # Infrastructure backstop for a cold core + emulator build, not a product
    # performance budget. Each capture asserts content before saving its image.
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          bun: "false"
          rust: "true"
          rust-targets: x86_64-linux-android
          cargo-cache: android-visual
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The action's default includes the retired SDK package `tools`.
          packages: platform-tools
      - name: Install the emulator and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang cmake ninja-build
          sdkmanager "platforms;android-36" "system-images;android-35;google_apis;x86_64" "emulator" "ndk;27.0.12077973"
          sudo chmod 666 /dev/kvm
      - name: Install checksum-pinned Maestro
        run: bash mobile/scripts/visual-install-maestro.sh
      - name: Build the actual emulator core with llama
        run: |
          set -euo pipefail
          mkdir -p target/android-visual
          bash mobile/scripts/android-core.sh x86_64 2>&1 | tee target/android-visual/rust-core.log
      - name: Build the Compose app
        working-directory: mobile
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -Pcentraid.android=true :androidApp:assembleDebug 2>&1 | tee ../target/android-visual/gradle.log
      - name: Capture asserted emulator screens
        run: bash mobile/scripts/visual-android.sh
      - name: Upload Android compiler, test and visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-visual-verification
          path: target/android-visual
          retention-days: 7
          if-no-files-found: warn

  gate:
    runs-on: ubuntu-latest
    # A backstop against a hung job, not a performance budget: the gate does not
    # fail a profile for taking long (owner ruling 2026-11-04), so this sits well
    # above a cold `pr` run on a loaded runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `buf breaking` compares against `main` and the released tags, read
          # out of the local clone.
          fetch-depth: 0
      # buf reads `.git#branch=main` as a LOCAL branch; a PR checkout is a
      # detached merge commit with only `origin/main` (#1047).
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          cargo-cache: gate
      # The profile's external tools. Under CI each step FAILS rather than
      # skips when its binary is missing, so a broken install reds the gate.
      # Release binaries, pinned here and nowhere else.
      - name: Install the gate's tools
        env:
          NEXTEST_VERSION: 0.9.144
          NEXTEST_SHA256: 8a4f726272b0a1c499bd87ca3978bfbb1a8c20bb08ccf075b9996e2081bd1e1e
          ACTIONLINT_VERSION: 1.7.12
          BUF_VERSION: 1.61.0
        run: |
          set -euo pipefail
          command -v cargo-deny >/dev/null || cargo install cargo-deny --locked
          nextest="cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/${nextest}" -o "${RUNNER_TEMP}/${nextest}"
          echo "${NEXTEST_SHA256}  ${RUNNER_TEMP}/${nextest}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${nextest}" -C /usr/local/bin cargo-nextest
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin actionlint
          curl -sSfL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf
      - run: cargo xtask gate --profile pr
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: gate-pr-artifacts
          path: target/xtask/**
          retention-days: 7
          if-no-files-found: warn

  # llama.cpp is a ~5 minute cmake build, so `centraid-assist-llama/engine`
  # and `centraid-core-ffi/llama` are off in the workspace build and this job
  # builds, lints and tests the two crates with the engine on. A phone's
  # cross-compile of the engine is `lane-prebuilt-core.yml`'s.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          bun: "false"
          rust: "true"
          # Its own key: an engine-flavoured `target/` restored into `gate`
          # would be a cold release build inside the `pr` job.
          cargo-cache: engine
      - run: cargo clippy -p centraid-assist-llama -p centraid-core-ffi --all-targets --features centraid-core-ffi/llama -- -D warnings
      # The real-model suites are `#[ignore]`d: they need a GGUF file the
      # repository does not carry.
      - run: cargo test -p centraid-assist-llama -p centraid-core-ffi --features centraid-core-ffi/llama

  # Its own job so `pull-requests: write` is not handed to the job that
  # compiles third-party crates.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # New dependencies only; existing ones cannot red an unrelated PR.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later

  # A squash merge's subject is the PR title, and the commit-msg hook never
  # sees it. Dependabot cannot append an issue number.
  pr-title:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "${RUNNER_TEMP}/title"
          bash .githooks/commit-msg "${RUNNER_TEMP}/title"
