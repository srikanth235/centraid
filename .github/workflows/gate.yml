name: gate

# The pull-request gate, and the only workflow that listens on `pull_request`.
# Nothing here is path-filtered: a filtered-out job reports no status, and a
# required check that never reports blocks the PR forever (#557).
#
#   lane               `cargo xtask gate --profile pr --lane <name>`, once per
#                      matrix entry: static, tests, build and ts, in
#                      parallel. `PR_LANES` in crates/xtask/src/gate.rs says
#                      which steps each runs, and a unit test keeps that table,
#                      the `pr` profile and the matrix below in step, so a step
#                      added to `pr` cannot silently stop running here.
#   gate               the REQUIRED check: runs after every lane and passes
#                      only if all of them did. Same name as when it was one
#                      job, because branch protection is set outside the repo.
#   engine             the on-device chat's llama.cpp build, too slow for the
#                      `pr` profile (R-CHAT-10).
#   ios                Swift 6 app/XCTest, HealthSeeder, and the Rust simulator core.
#   android            the Compose shell's Kotlin compiled against the Android SDK (no native
#                      core: `compileDebugKotlin` stops before the libraries are packaged), on
#                      the runner's own SDK.
#   dependency-review  the PR's dependency diff, read through the API.
#   pr-title           the squash subject, checked by `.githooks/commit-msg`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # UIKit needs a real Apple SDK; Linux's JVM gate cannot compile the shell.
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Xcode (fail if unavailable)
        run: bash mobile/scripts/select-xcode.sh
      - uses: ./.github/actions/setup
        with:
          bun: "false"
          rust: "true"
          rust-targets: aarch64-apple-ios-sim
          cargo-cache: ios-simulator
      - name: Install the native generators
        run: brew install xcodegen protobuf swift-protobuf
      - name: Build the actual simulator core with llama
        run: |
          set -euo pipefail
          mkdir -p target/ios-verification
          IPHONEOS_DEPLOYMENT_TARGET="$(cat mobile/ios-deployment-target)"
          export IPHONEOS_DEPLOYMENT_TARGET
          mobile/scripts/ios-core.sh aarch64-apple-ios-sim 2>&1 | tee target/ios-verification/rust-core.log
      - name: Compile Swift 6 app, run XCTest, and compile HealthSeeder
        run: bash mobile/scripts/verify-ios.sh
      - name: Upload iOS compiler and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-verification
          path: |
            target/ios-verification/*.log
            target/ios-verification/*.xcresult
            mobile/iosApp/Sources/Generated
          retention-days: 7
          if-no-files-found: warn

  # One lane of the `pr` profile per job (`PR_LANES` in crates/xtask/src/gate.rs
  # names what is in each; a unit test keeps this list and that table equal).
  # `fail-fast: false`: a red lane must not hide what the others found.
  lane:
    name: gate-${{ matrix.lane }}
    runs-on: ubuntu-latest
    # A backstop against a hung job, not a performance budget: the gate does not
    # fail a profile for taking long (owner ruling 2026-11-04).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `cache` is the Swatinem key; lanes build different profiles, so each
        # has its own and none evicts another's. `tests` keeps the key the single
        # job used, so it inherits that warm dev/test `target/`. `save_pr`: the
        # tests lane's cold compile is the cost (50 to 70 minutes cold against
        # 24 warm), so it alone also saves its cache from a pull request, scoped
        # by GitHub to that PR's ref: main's is the fallback and is never
        # replaced. The others stay main-only so the 10 GB pool is not filled.
        include:
          - lane: static
            cache: gate-static
            save_pr: "false"
          - lane: tests
            cache: gate
            save_pr: "true"
          - lane: build
            cache: gate-build
            save_pr: "false"
          # `bun run check` is cargo-free, but the lane is still entered through
          # `cargo xtask`, so it builds xtask: a small key of its own.
          - lane: ts
            cache: gate-xtask
            save_pr: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `buf breaking` compares against `main` and the released tags, and
          # `ledgers` reads its merge base, out of the local clone.
          fetch-depth: 0
      # buf reads `.git#branch=main` as a LOCAL branch; a PR checkout is a
      # detached merge commit with only `origin/main` (#1047).
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - uses: ./.github/actions/setup
        with:
          bun: ${{ matrix.lane == 'ts' }}
          rust: "true"
          cargo-cache: ${{ matrix.cache }}
          cargo-cache-save-pr: ${{ matrix.save_pr }}
      # Under CI a missing tool FAILS its step rather than skips.
      - uses: ./.github/actions/gate-tools
        if: matrix.lane != 'ts'
      - run: cargo xtask gate --profile pr --lane ${{ matrix.lane }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: gate-pr-${{ matrix.lane }}-artifacts
          path: target/xtask/**
          retention-days: 7
          if-no-files-found: warn

  # THE REQUIRED CHECK. Its name is what branch protection knows, so it stays
  # `gate`; it passes only when every lane did (a skipped or cancelled lane is
  # not a pass).
  gate:
    if: always()
    needs: [lane]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LANES: ${{ needs.lane.result }}
        run: |
          echo "lanes: ${LANES}"
          [ "${LANES}" = success ]

  # llama.cpp is a ~5 minute cmake build, so `centraid-assist-llama/engine`
  # and `centraid-core-ffi/llama` are off in the workspace build and this job
  # builds, lints and tests the two crates with the engine on. A phone's
  # cross-compile of the engine is `lane-prebuilt-core.yml`'s.
  # THE COMPOSE SHELL COMPILED, which nothing else in a pull request does: the JVM gate
  # (`mobile-jvm`) proves the binding, and Linux has no Android SDK in the `gate` job. This is
  # `compileDebugKotlin`, not `assembleDebug`: it type-checks every Kotlin file of `:androidApp`
  # and `:core`'s Android target without packaging the native libraries the release lane owns.
  # A job of its own so `gate` is no longer for it (#1188, B13).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          # AGP 9 requires JDK 17+; `mobile/*/build.gradle.kts` declares `jvmToolchain(21)`.
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            mobile/gradle/libs.versions.toml
            mobile/**/*.gradle.kts
            mobile/gradle/wrapper/gradle-wrapper.properties
      # THE RUNNER'S OWN SDK (ANDROID_HOME, /usr/local/lib/android/sdk): `android-actions/setup-android`
      # failed in sdkmanager ("Failed to find package 'tools'") on top of it. Licences are accepted here
      # so AGP can fetch the platform and build-tools it names.
      - name: Accept the Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compile the Android shell's Kotlin
        working-directory: mobile
        run: ./gradlew -Pcentraid.android=true :androidApp:compileDebugKotlin --no-daemon --stacktrace
      # The fixtures both shells read, run where the Kotlin compiles: no emulator, no native core.
      - name: Run the shared-fixture tests
        working-directory: mobile
        run: ./gradlew -Pcentraid.android=true :androidApp:testDebugUnitTest --tests 'dev.centraid.android.kit.BackupCheckControlsTest' --no-daemon --stacktrace

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          bun: "false"
          rust: "true"
          # Its own key: an engine-flavoured `target/` restored into `gate`
          # would be a cold release build inside the `pr` job.
          cargo-cache: engine
      - run: cargo clippy -p centraid-assist-llama -p centraid-core-ffi --all-targets --features centraid-core-ffi/llama -- -D warnings
      # The real-model suites are `#[ignore]`d: they need a GGUF file the
      # repository does not carry.
      - run: cargo test -p centraid-assist-llama -p centraid-core-ffi --features centraid-core-ffi/llama

  # Its own job so `pull-requests: write` is not handed to the job that
  # compiles third-party crates.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # New dependencies only; existing ones cannot red an unrelated PR.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later

  # A squash merge's subject is the PR title, and the commit-msg hook never
  # sees it. Dependabot cannot append an issue number.
  pr-title:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "${RUNNER_TEMP}/title"
          bash .githooks/commit-msg "${RUNNER_TEMP}/title"
