name: gate

# The pull-request gate, and the only workflow that listens on `pull_request`.
# Nothing here is path-filtered: a filtered-out job reports no status, and a
# required check that never reports blocks the PR forever (#557).
#
#   gate               `cargo xtask gate --profile pr` — every step a PR must
#                      pass, Rust, protobuf, TypeScript and CI policy alike
#                      (crates/xtask/README.md).
#   engine             the on-device chat's llama.cpp build, too slow for the
#                      `pr` profile's budget (R-CHAT-10).
#   native-python      the native tool task's CPU suite (#1044).
#   dependency-review  the PR's dependency diff, read through the API.
#   pr-title           the squash subject, checked by `.githooks/commit-msg`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # A backstop against a hung job, above the `pr` profile's own cold budget
    # (contracts/ledgers/gate-budgets.json) plus provisioning.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `buf breaking` compares against `main` and the released tags, read
          # out of the local clone.
          fetch-depth: 0
      # buf reads `.git#branch=main` as a LOCAL branch; a PR checkout is a
      # detached merge commit with only `origin/main` (#1047).
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          cargo-cache: gate
      # The profile's external tools. Under CI each step FAILS rather than
      # skips when its binary is missing, so a broken install reds the gate.
      # Release binaries, pinned here and nowhere else.
      - name: Install the gate's tools
        env:
          NEXTEST_VERSION: 0.9.144
          NEXTEST_SHA256: 8a4f726272b0a1c499bd87ca3978bfbb1a8c20bb08ccf075b9996e2081bd1e1e
          ACTIONLINT_VERSION: 1.7.12
          GITLEAKS_VERSION: 8.30.1
          OSV_VERSION: 2.4.0
          BUF_VERSION: 1.61.0
        run: |
          set -euo pipefail
          command -v cargo-deny >/dev/null || cargo install cargo-deny --locked
          nextest="cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/${nextest}" -o "${RUNNER_TEMP}/${nextest}"
          echo "${NEXTEST_SHA256}  ${RUNNER_TEMP}/${nextest}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${nextest}" -C /usr/local/bin cargo-nextest
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin actionlint
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
          curl -sSfL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/osv-scanner /usr/local/bin/buf
      - run: cargo xtask gate --profile pr
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: gate-pr-artifacts
          path: target/xtask/**
          retention-days: 7
          if-no-files-found: warn

  # llama.cpp is a ~5 minute cmake build, so `centraid-assist-llama/engine`
  # and `centraid-core-ffi/llama` are off in the workspace build and this job
  # builds, lints and tests the two crates with the engine on. A phone's
  # cross-compile of the engine is `lane-prebuilt-core.yml`'s.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          bun: "false"
          rust: "true"
          # Its own key: an engine-flavoured `target/` restored into `gate`
          # would be a cold release build inside the `pr` budget.
          cargo-cache: engine
      - run: cargo clippy -p centraid-assist-llama -p centraid-core-ffi --all-targets --features centraid-core-ffi/llama -- -D warnings
      # The real-model suites are `#[ignore]`d: they need a GGUF file the
      # repository does not carry.
      - run: cargo test -p centraid-assist-llama -p centraid-core-ffi --features centraid-core-ffi/llama

  # `experiments/toolchat/native/run_cpu_tests.py`: every test module of the
  # native tool task, none skipped. Inputs are pinned by content: hashed pip
  # requirements, a tokenizer fetched at a commit and checked by SHA-256.
  native-python:
    runs-on: ubuntu-latest
    # The suite takes ~16 minutes at `--jobs 4`.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          bun: "false"
          rust: "true"
      - run: cargo build --locked -p centraid-nativetools --bin nativetools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The minor the training image runs (train/vm/run_job.sh).
          python-version: "3.11"
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r experiments/toolchat/native/requirements-ci.txt
      # The trainer's tiny-model tests build a random model from Qwen3.5-0.8B's
      # config and tokenize with its tokenizer: six small files, no weights.
      - name: Fetch the Qwen3.5-0.8B tokenizer and config
        env:
          HF_HOME: ${{ runner.temp }}/hf
          QWEN_REVISION: 2fc06364715b967f1860aea9cf38778875588b17
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            hf download Qwen/Qwen3.5-0.8B --revision "${QWEN_REVISION}" \
              config.json tokenizer.json tokenizer_config.json vocab.json merges.txt chat_template.jinja && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "::warning::hf download failed (attempt ${attempt}); retrying"
            sleep 5
          done
          repo="${HF_HOME}/hub/models--Qwen--Qwen3.5-0.8B"
          mkdir -p "${repo}/refs"
          printf '%s' "${QWEN_REVISION}" > "${repo}/refs/main"
          cd "${repo}/snapshots/${QWEN_REVISION}"
          sha256sum -c - <<'SUMS'
          273d8e0e683b885071fb17e08d71e5f2a5ddfb5309756181681de4f5a1822d80  chat_template.jinja
          b90b86f35c8e6925ef74ee04d0e758f0a845c83a42089ad82bbaa948de9b4204  config.json
          a9d356d7bdf1ef4949e3e748e95b8e10ad9d4e2e838eddc38a0a7b6b94d1db8d  merges.txt
          5f9e4d4901a92b997e463c1f46055088b6cca5ca61a6522d1b9f64c4bb81cb42  tokenizer.json
          49e2b6e395f959f077f1e992b338919c0d4a9732fc6e613995e06557f843500c  tokenizer_config.json
          ce99b4cb2983d118806ce0a8b777a35b093e2000a503ebde25853284c9dfa003  vocab.json
          SUMS
      # The 35 public train worlds, rebuilt byte for byte from the tree and
      # verified by the manifest (R-1088-16); no held-out file, no secret.
      - name: Materialise the public worlds
        working-directory: experiments/toolchat/native
        run: |
          python artefacts.py fetch --public-only
          python artefacts.py check --public-only
      - name: Run the CPU suite
        env:
          NATIVETOOLS: ${{ github.workspace }}/target/debug/nativetools
          HF_HOME: ${{ runner.temp }}/hf
          HF_HUB_OFFLINE: "1"
          EVAL_VAULTS: ${{ runner.temp }}/vaults
          GEN_INTEGRATION: "1"
          NOISE_INTEGRATION: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python experiments/toolchat/native/run_cpu_tests.py --jobs 4

  # Its own job so `pull-requests: write` is not handed to the job that
  # compiles third-party crates.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # New dependencies only; existing ones cannot red an unrelated PR.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later

  # A squash merge's subject is the PR title, and the commit-msg hook never
  # sees it. Dependabot cannot append an issue number.
  pr-title:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "${RUNNER_TEMP}/title"
          bash .githooks/commit-msg "${RUNNER_TEMP}/title"
