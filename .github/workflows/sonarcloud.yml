name: sonarcloud

# #842 W0.6 — `scripts/ci/configure-sonarcloud.mjs` was a complete, idempotent
# configurator that no workflow ran, while SECURITY.md advertised SonarCloud as
# the second-opinion check. The scope exclusions and silenced-noise rules that
# keep the Autoscan PR gate honest therefore only existed on whatever a
# maintainer had last applied by hand from a laptop keychain. This lane applies
# them from the repo instead.
# Analysis itself stays SonarCloud **Automatic Analysis** (Autoscan), per
# docs/toolchain.md#sonarcloud-autoscan: SonarCloud refuses a CI-side scanner
# run while Automatic Analysis is enabled on the project, so this workflow
# configures the project and lets Autoscan scan. It is a configuration lane, not
# a scanner lane.
# #557 — not a `pull_request` workflow: `ci.yml` is the single open-PR entry
# point, and a project-configuration apply is not a per-PR gate. Push-to-main on
# the configurator itself, plus a weekly re-apply so UI drift is corrected, plus
# manual dispatch.
# SONAR_TOKEN is optional: it is a personal SonarCloud token with project
# administer, absent on forks and on any clone of this repo. Every step is
# gated on its presence through an env indirection (the `secrets` context is not
# readable from a job-level `if:`), and the absent case logs an explicit skip
# line so the lane is visibly skipped rather than silently missing.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC — re-apply, catching UI drift.
  push:
    branches: [main]
    paths:
      - "scripts/ci/configure-sonarcloud.mjs"
      - ".github/workflows/sonarcloud.yml"

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `secrets` is unavailable in a job `if:`; hoist presence into env so the
      # steps below can branch on it.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' && 'true' || 'false' }}
    steps:
      - name: Report skip when no SonarCloud token is configured
        if: env.HAS_SONAR_TOKEN != 'true'
        run: |
          set -euo pipefail
          echo "::notice title=SonarCloud::SONAR_TOKEN is not configured for this repository — skipping the SonarCloud project configuration apply. Autoscan (if enabled) still analyses pushes and PRs with whatever scope is currently stored on the project. See docs/toolchain.md#sonarcloud-autoscan."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_SONAR_TOKEN == 'true'

      - uses: ./.github/actions/setup
        if: env.HAS_SONAR_TOKEN == 'true'

      # Idempotent: applies analysis scope, issue-ignore multicriteria, the
      # Centraid quality profiles and gate, then prints the live summary.
      # `--resolve-noise` is deliberately not passed — bulk-WONTFIXing residual
      # issues is a maintainer-initiated action, not a scheduled one.
      - name: Apply SonarCloud project configuration
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bun run scripts/ci/configure-sonarcloud.mjs
