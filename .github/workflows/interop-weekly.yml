name: interop-weekly

# #496 G5 / C5 — packages/backup test:interop was stranded (env-gated,
# referenced by no workflow). Weekly schedule + manual dispatch.
on:
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      # #915 Wave 1 — empty means "the promoted candidate"; a value overrides it.
      ref:
        description: "Candidate ref or SHA to test (default: the promoted candidate)"
        required: false
        default: ""
        type: string

concurrency:
  group: interop-weekly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  # #915 Wave 1 — RUNG 5 CONSUMES THE CANDIDATE, like rung 4. A weekly lane that
  # tests whatever `main` happened to point at on Saturday morning cannot tell a
  # product regression from Friday's merge, and it has a whole week to be wrong
  # about it. `scripts/ci/resolve-candidate.mjs` prints which link of the
  # fallback chain answered (dispatch input -> refs/candidates/latest -> the last
  # green ci.yml run -> this run's own SHA).
  resolve-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      source: ${{ steps.candidate.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the candidate under test
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ci/resolve-candidate.mjs \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.inputs.ref }}" \
            --fallback-sha "${{ github.sha }}"

  backup-interop:
    needs: [resolve-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # #915 — the CANDIDATE, not the tip. See resolve-candidate.
          ref: ${{ needs.resolve-candidate.outputs.sha }}
      - uses: ./.github/actions/setup
      - run: bun run turbo run build --filter=@centraid/backup...
      - name: Run backup interop suite
        env:
          CLAWGNITION_INTEROP: "1"
        run: bun run test:interop:backup
      # #915 Wave 3 — see the note in soak-weekly.yml: a registered lane with no
      # evidence file renders as `no evidence` every week.
      - name: Write lane evidence
        if: always()
        env:
          LANE_STARTED_AT: ${{ steps.start.outputs.at }}
        run: >
          node scripts/test-report/write-evidence.mjs --lane backup-interop --rung 5 --platform any --verdict auto --job-status ${{ job.status }} --started-at "$LANE_STARTED_AT" --budget-ms 1800000 --candidate ${{ needs.resolve-candidate.outputs.sha }} --qualities compat --surfaces backup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: interop-weekly-evidence
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

  # Same silent-rot mode #496 E3 closes for nightly — interop is weekly and
  # would otherwise fail with no tracking issue.
  interop-failure-issue:
    needs: [resolve-candidate, backup-interop]
    # #557 — `cancelled` counts as red (a dead runner is not a pass), and a
    # failed alert must itself be loud rather than a swallowed ::warning::.
    if: >
      always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && (
        contains(join(needs.*.result, ','), 'failure') ||
        contains(join(needs.*.result, ','), 'cancelled')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # #915 — the CANDIDATE, not the tip. See resolve-candidate.
          ref: ${{ needs.resolve-candidate.outputs.sha }}
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.backup-interop.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > /tmp/body.md <<EOF
          Weekly backup interop suite failed.

          - Run: ${RUN_URL}
          - Workflow: interop-weekly / backup-interop
          - Result: \`${RESULT}\`

          _Auto-filed by interop-weekly.yml. Prefer updating this issue over opening duplicates._
          EOF
          node scripts/ci/file-tracking-issue.mjs \
            --title '[interop-weekly] backup interop red' \
            --search '[interop-weekly] backup interop red' \
            --body-file /tmp/body.md \
            --label tech-debt \
            --run-url "$RUN_URL"
