name: interop-weekly

# #496 G5 / C5 — packages/backup test:interop was stranded (env-gated,
# referenced by no workflow). Weekly schedule + manual dispatch.
on:
  schedule:
    - cron: '0 9 * * 1' # Monday 09:00 UTC
  workflow_dispatch:

concurrency:
  group: interop-weekly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  backup-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@centraid/backup...
      - name: Run backup interop suite
        env:
          CLAWGNITION_INTEROP: '1'
        run: bun run test:interop:backup

  # Same silent-rot mode #496 E3 closes for nightly — interop is weekly and
  # would otherwise fail with no tracking issue.
  interop-failure-issue:
    needs: [backup-interop]
    # #557 — `cancelled` counts as red (a dead runner is not a pass), and a
    # failed alert must itself be loud rather than a swallowed ::warning::.
    if: >
      always() &&
      github.event_name == 'schedule' &&
      github.ref == 'refs/heads/main' &&
      (
        contains(join(needs.*.result, ','), 'failure') ||
        contains(join(needs.*.result, ','), 'cancelled')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE='[interop-weekly] backup interop red'
          BODY="Weekly backup interop suite failed.

          - Run: ${RUN_URL}
          - Workflow: interop-weekly / backup-interop
          - Result: \`${{ needs.backup-interop.result }}\`

          _Auto-filed by interop-weekly.yml. Prefer updating this issue over opening duplicates._"
          existing="$(gh issue list --search 'in:title [interop-weekly] backup interop red' --state open --json number --jq '.[0].number' || true)"
          if [ -n "${existing:-}" ] && [ "$existing" != "null" ]; then
            if ! gh issue comment "$existing" --body "$BODY"; then
              echo "::error::Failed to comment on interop tracking issue #$existing — run ${RUN_URL}"
              exit 1
            fi
            echo "Updated issue #$existing"
          else
            if ! gh issue create --title "$TITLE" --body "$BODY" --label 'tech-debt'; then
              if ! gh issue create --title "$TITLE" --body "$BODY"; then
                echo "::error::Failed to create interop tracking issue — run ${RUN_URL}"
                exit 1
              fi
            fi
          fi
