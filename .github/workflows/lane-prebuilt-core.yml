name: lane-prebuilt-core

# The prebuilt core (D-1020-G2): the `centraid` binary (and `centraid-gateway`
# beside it on Linux and macOS, #1080) for six triples, the four Android ABIs
# of `centraid-core-ffi`, and its iOS XCFramework. Called by `nightly.yml`
# (binaries only, to catch cross-compilation breaks) and by `release.yml`.
#
# Two mechanisms keep "which build is this" answerable:
#   * the KEY (`cargo xtask artifact-key`, crates/xtask/src/artifact.rs) is
#     computed from sources before the build;
#   * the IDENTITY STAMP is baked into the artifact by `crates/core/build.rs`
#     and read back out of the built binary below, so a build that dropped it
#     cannot publish.
#
# Symbols: `split-debuginfo = "packed"` makes cargo write one symbol file
# beside each binary (`.dwp`, `.dSYM`, `.pdb`); it is collected FIRST, then the
# binary is stripped. `--profile dist` is `release` plus thin LTO.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: the caller's)"
        required: false
        default: ""
        type: string
      binary-only:
        description: Build only the `centraid` binary triples, not the mobile FFI artifacts.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  binary:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # One red triple must not cancel the other five.
      fail-fast: false
      matrix:
        # `required` triples gate the publish (`prebuilt-core-required`).
        # `gateway`: the leg also ships `centraid-gateway`, whose `install`
        # writes a systemd or launchd unit; Windows has no unit writer yet.
        include:
          - {
              triple: x86_64-unknown-linux-gnu,
              runner: ubuntu-latest,
              required: true,
              gateway: true,
            }
          - {
              triple: aarch64-unknown-linux-gnu,
              runner: ubuntu-24.04-arm,
              required: false,
              gateway: true,
            }
          - {
              triple: aarch64-apple-darwin,
              runner: macos-latest,
              required: true,
              gateway: true,
            }
          - {
              triple: x86_64-apple-darwin,
              runner: macos-15-intel,
              required: false,
              gateway: true,
            }
          - {
              triple: x86_64-pc-windows-msvc,
              runner: windows-latest,
              required: true,
              gateway: false,
            }
          - {
              triple: aarch64-pc-windows-msvc,
              runner: windows-11-arm,
              required: false,
              gateway: false,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup
        with:
          bun: "false"
          rust: "true"
          rust-targets: ${{ matrix.triple }}
          cargo-cache: prebuilt-${{ matrix.triple }}
      - id: key
        shell: bash
        run: |
          set -euo pipefail
          key="$(cargo xtask artifact-key --triple '${{ matrix.triple }}' --profile dist --explain)"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "artifact key ${key}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        shell: bash
        env:
          CENTRAID_BUILD_GIT_SHA: ${{ github.sha }}
          CENTRAID_BUILD_DIGEST: ${{ steps.key.outputs.key }}
        run: cargo build --profile dist --bin centraid ${{ matrix.gateway && '--bin centraid-gateway' || '' }} --target '${{ matrix.triple }}'
      - name: Collect the symbol file and strip the binary
        shell: bash
        run: |
          set -euo pipefail
          out="artifact/${{ matrix.triple }}"
          mkdir -p "$out"
          built="target/${{ matrix.triple }}/dist"
          bins="centraid"
          if [ "${{ matrix.gateway }}" = "true" ]; then bins="centraid centraid-gateway"; fi
          case "${{ runner.os }}" in
            Linux)
              for bin in $bins; do
                cp "$built/$bin" "$out/$bin"
                cp "$built/$bin.dwp" "$out/$bin.dwp"
                objcopy --strip-debug "$out/$bin"
              done
              ;;
            macOS)
              for bin in $bins; do
                cp "$built/$bin" "$out/$bin"
                cp -R "$built/$bin.dSYM" "$out/$bin.dSYM"
                strip -S "$out/$bin"
              done
              ;;
            Windows)
              cp "$built/centraid.exe" "$out/centraid.exe"
              cp "$built/centraid.pdb" "$out/centraid.pdb"
              ;;
          esac
          ls -l "$out"
      - name: Identity and checksums
        shell: bash
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          out="artifact/${{ matrix.triple }}"
          identity="$out/centraid-${{ matrix.triple }}.identity.json"
          # Read back OUT OF THE BINARY, not copied from the environment.
          if [ "${{ runner.os }}" = "Windows" ]; then
            "$out/centraid.exe" --version --json > "$identity"
          else
            "$out/centraid" --version --json > "$identity"
          fi
          cat "$identity"
          grep -q "\"digest\":\"${KEY}\"" "$identity" \
            || { echo "::error title=Identity stamp missing::the built binary does not report the digest this run computed"; exit 1; }
          tar -czf "centraid-${{ matrix.triple }}.tar.gz" -C "$out" .
          sha256sum "centraid-${{ matrix.triple }}.tar.gz" > "SHA256SUMS.${{ matrix.triple }}"
          cat "SHA256SUMS.${{ matrix.triple }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-core-${{ matrix.triple }}
          path: |
            centraid-${{ matrix.triple }}.tar.gz
            SHA256SUMS.${{ matrix.triple }}
            artifact/${{ matrix.triple }}/centraid-${{ matrix.triple }}.identity.json
          retention-days: 90
          if-no-files-found: error

  # The four Android ABIs in the AAR's `jni/<abi>/` layout, with an NDK
  # symbols.zip. `x86_64` is what lets the KVM emulator load the library.
  # `--features llama` in the key and the build: the on-device chat's engine is
  # off in the workspace build (R-CHAT-10), and the key names what was built.
  android:
    if: ${{ !inputs.binary-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup
        with:
          bun: "false"
          rust: "true"
          rust-targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo-cache: prebuilt-android
      - run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
      - id: key
        run: echo "key=$(cargo xtask artifact-key --triple android-all-abis --features llama --profile dist)" >> "$GITHUB_OUTPUT"
      - name: Build the four ABIs
        env:
          CENTRAID_BUILD_GIT_SHA: ${{ github.sha }}
          CENTRAID_BUILD_DIGEST: ${{ steps.key.outputs.key }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o dist/android/jni \
            build --profile dist -p centraid-core-ffi --features llama
          find dist/android -name '*.so' -print
      - name: Collect symbols, then strip
        run: |
          set -euo pipefail
          mkdir -p dist/android/symbols
          while IFS= read -r -d '' lib; do
            abi="$(basename "$(dirname "$lib")")"
            mkdir -p "dist/android/symbols/${abi}"
            cp "$lib" "dist/android/symbols/${abi}/"
            "${ANDROID_NDK_HOME:-/usr/local/lib/android/sdk/ndk-bundle}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "$lib" || true
          done < <(find dist/android/jni -name '*.so' -print0)
          (cd dist/android && zip -qr ../../centraid-android-symbols.zip symbols)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-core-android
          path: |
            dist/android/jni/**
            centraid-android-symbols.zip
          retention-days: 90
          if-no-files-found: error

  # `libcentraid_core_ffi.a` per slice plus the cbindgen header. The simulator
  # slice is ONE lipo'd library: Xcode rejects an xcframework with two.
  ios:
    if: ${{ !inputs.binary-only }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup
        with:
          bun: "false"
          rust: "true"
          rust-targets: aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          cargo-cache: prebuilt-ios
      - run: command -v cbindgen >/dev/null || cargo install cbindgen --locked
      - id: key
        run: echo "key=$(cargo xtask artifact-key --triple apple-ios-xcframework --features llama --profile dist)" >> "$GITHUB_OUTPUT"
      - name: Build the three slices and the header
        env:
          CENTRAID_BUILD_GIT_SHA: ${{ github.sha }}
          CENTRAID_BUILD_DIGEST: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            cargo build --profile dist -p centraid-core-ffi --features llama --target "$target"
          done
          mkdir -p dist/ios/Headers dist/ios/sim
          cbindgen --crate centraid-core-ffi --output dist/ios/Headers/centraid_core.h
          lipo -create \
            target/aarch64-apple-ios-sim/dist/libcentraid_core_ffi.a \
            target/x86_64-apple-ios/dist/libcentraid_core_ffi.a \
            -output dist/ios/sim/libcentraid_core_ffi.a
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/dist/libcentraid_core_ffi.a -headers dist/ios/Headers \
            -library dist/ios/sim/libcentraid_core_ffi.a -headers dist/ios/Headers \
            -output dist/ios/CentraidCore.xcframework
          echo "${IPHONEOS_DEPLOYMENT_TARGET}" > dist/ios/DEPLOYMENT_TARGET
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-core-ios
          path: dist/ios/**
          retention-days: 90
          if-no-files-found: error

  # The lane's one verdict: every required triple published, every artifact
  # stamped from one commit, and one SHA256SUMS over all of them for
  # `deploy/vps/install.sh`.
  prebuilt-core-required:
    needs: [binary]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuilt-core-*
          path: artifacts
      - name: Every required triple is present
        run: |
          set -euo pipefail
          missing=0
          for triple in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            if [ -f "artifacts/prebuilt-core-${triple}/centraid-${triple}.tar.gz" ]; then
              echo "ok       ${triple}"
            else
              echo "::error title=Required triple missing::${triple} produced no artifact (docs/release.md)."
              missing=$((missing + 1))
            fi
          done
          for triple in aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-pc-windows-msvc; do
            if [ -f "artifacts/prebuilt-core-${triple}/centraid-${triple}.tar.gz" ]; then
              echo "ok       ${triple} (optional)"
            else
              echo "::warning title=Optional triple missing::${triple} produced no artifact; it does not gate the publish."
            fi
          done
          cat artifacts/prebuilt-core-*/SHA256SUMS.* | sort > SHA256SUMS
          cat SHA256SUMS
          # Each triple's digest differs by construction (the key hashes the
          # triple); what every leg must share is the commit and the schema.
          for field in gitSha schemaVersion; do
            values="$(grep -ho "\"${field}\":\"\?[^\",}]*" artifacts/prebuilt-core-*/artifact/*/centraid-*.identity.json | sort -u)"
            if [ "$(printf '%s\n' "$values" | wc -l)" -gt 1 ]; then
              echo "::error title=Stamps disagree::the artifacts report more than one ${field}"
              printf '%s\n' "$values"
              exit 1
            fi
          done
          [ "$missing" -eq 0 ]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-core-SHA256SUMS
          path: SHA256SUMS
          retention-days: 90
          if-no-files-found: error
