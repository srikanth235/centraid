name: gate-nightly

# THE NIGHTLY LANE for the v1 tree ([#1020](https://github.com/srikanth235/centraid/issues/1020)).
#
# `cargo xtask gate --profile nightly` — the `pr` profile plus the v0 ORACLE
# SUITE and the device lanes. The oracle suite is the whole of what v0's CI
# still owes a v1 commit: from wave 1 v0's own gates are off pull requests
# (*Two trees, one CI bill*), and what survives is the v0 tests that read
# `contracts/` files, run once a night against the pinned tree. v0's gates were
# MOVED, not deleted — ci.yml still runs every one of its jobs on pushes to
# `main` and on its own nightly schedule.
#
# 05:30 UTC: after hygiene.yml's Saturday 05:00 and before e2e.yml's 06:00
# nightly, so a red v1 gate never competes with either for attention.
#
# `schedule:` + `workflow_dispatch:` only — gate.yml is the one workflow allowed
# to listen on `pull_request` (enforced by lint:workflow-pins rule 5).
#
# The profile is unbounded by ruling, so there is no budget line to score; the
# runner bound below is a backstop against a hung job.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: gate-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Same learning posture as gate.yml; this lane's destinations are a
          # superset (it also builds the v0 package closure the oracle imports).
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # turbo-cache because the oracle step builds the suite's package closure:
      # the v0 suites import their workspace packages by published entry point,
      # so they need `dist/` on disk, the same reason ci.yml's `verify` builds
      # before it runs vitest.
      - uses: ./.github/actions/setup
        with:
          cargo-cache: v1
          turbo-cache: "true"
      - id: channel
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)"
          if [ -z "$channel" ]; then
            echo "::error::gate-nightly: rust-toolchain.toml has no [toolchain] channel"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: ${{ steps.channel.outputs.channel }}
          components: rustfmt, clippy
      # The `pr` profile's external tools. Each one FAILS rather than skips when
      # its binary is absent under CI (see crates/xtask/src/gate.rs `external`),
      # so an install that silently stopped working reds the gate instead of
      # quietly removing a lane. Versions are pinned here and nowhere else.
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          if command -v cargo-deny >/dev/null 2>&1; then
            echo "cargo-deny already on PATH from the restored Cargo cache: $(cargo-deny --version)"
          else
            cargo install cargo-deny --locked
          fi
      - name: Install actionlint, gitleaks and osv-scanner
        env:
          # actionlint: the version ci.yml's `static` job pins as a container
          # action. gitleaks and osv-scanner: the same release pins ci.yml's
          # `gitleaks` and `osv-scanner` jobs use. Those two steps are red on
          # inherited tree state (D-1020-B1, #1020) and are here anyway: a PR
          # gate that stops reporting because its target is red today is a
          # weakening, and inherited red is named, never hidden.
          ACTIONLINT_VERSION: 1.7.12
          GITLEAKS_VERSION: 8.30.1
          OSV_VERSION: 2.4.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          actionlint --version
          gitleaks version
          osv-scanner --version
      - run: cargo xtask gate --profile nightly
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: gate-nightly-artifacts
          path: target/xtask/**
          retention-days: 7
          if-no-files-found: warn

  # THE KOTLIN HALF ([#1020](https://github.com/srikanth235/centraid/issues/1020) wave 3, D-1020-B2-3).
  #
  # `cargo xtask gate --profile mobile-jvm` — one step: build the cdylib, run
  # `./gradlew -p mobile mobileJvm` (`:shared:jvmTest`, `:core:jvmTest` over the
  # REAL `libcentraid_core_ffi.so`, `:shared:koverXmlReport`), then regenerate
  # the committed native theme and screen fixtures and fail on drift.
  #
  # A SEPARATE JOB, not a step of the profile above, because `mobile-jvm` is not
  # a superset of any other profile: it is a second toolchain with its own cold
  # cost and its own ledger row (420 s), and folding it into a Rust profile's
  # ceiling would make one number answer for two build systems.
  #
  # Nightly rather than `pr` for the same reason. If Gradle is missing the step
  # FAILS — the wrapper is committed, so its absence is a broken checkout and
  # not a reason to report a suite that did not run.
  mobile-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cargo-cache: v1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - id: channel
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: ${{ steps.channel.outputs.channel }}
      - run: cargo xtask gate --profile mobile-jvm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: gate-mobile-jvm-artifacts
          path: |
            target/xtask/**
            mobile/**/build/reports/**
          retention-days: 7
          if-no-files-found: warn

  # THE DEVICE LANES ([#1020](https://github.com/srikanth235/centraid/issues/1020), D-1020-G4).
  #
  # Four cells, each `cargo xtask gate --profile nightly --lane <name>`, each
  # running ONLY on a runner that carries the `[self-hosted, macos, devices]`
  # labels with one iPhone and one Android attached. That runner does not exist
  # yet — it is open question 13 and an owner hand-off — so on GitHub-hosted
  # infrastructure these jobs do not run at all and the `gate-nightly` job above
  # reports `device-lanes` as a loud SKIP naming them.
  #
  # THE FOUR BODIES ARE ON THE BRANCH (wave 3 lane E, applied by the close
  # pass). They live in `crates/xtask/src/gate.rs` rather than as four `run:`
  # blocks here, because each cell is already `cargo xtask gate --lane <name>`
  # and a second copy in YAML would be a second thing to keep true — an owner
  # with a phone runs the same lane the same way on a laptop. What each one
  # does when its prerequisite is absent is a LOUD SKIP naming the command, and
  # `battery-per-background-pass` is a permanent one: neither platform exposes
  # per-pass energy to an app, so the owner's Settings → Battery reading IS the
  # measurement.
  #
  # WHY A SEPARATE JOB PER LANE and not one job with four steps: the four have
  # different failure modes and different owners (Maestro flows, Macrobenchmark,
  # XCTest metrics, a battery measurement), and one job would make "which lane
  # is red" a question you answer by reading a log.
  #
  # WHY `runs-on` IS A MATRIX ENTRY and not a literal: `runs-on` cannot be
  # conditional, and a job pinned to a label no runner carries sits queued until
  # it times out — which reads as a hung lane rather than as an absent runner.
  # The `if:` below is what makes it not start at all, and the workflow's own
  # dispatch input is how the owner turns them on once the runner exists.
  #
  # WHAT THESE LANES MAY AND MAY NOT DO TO A LEDGER: they measure, and a number
  # measured here is written to `tests/journeys.json` only when it came from a
  # run on a NAMED REFERENCE DEVICE (`device-android-mid` / `device-iphone-oldest`,
  # R-1020-20). A simulator or an emulator number bounds the experience from
  # below and can never become a ceiling, which is why no `_intended` entry is
  # promoted by this workflow existing.
  device-lanes:
    # `vars.CENTRAID_DEVICE_RUNNER` is set by the owner once the self-hosted
    # runner is enrolled. Until then this evaluates false and the four cells are
    # never queued.
    if: vars.CENTRAID_DEVICE_RUNNER == 'true'
    runs-on: [self-hosted, macos, devices]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane:
          - ios-transfer-experiment
          - android-macrobenchmark
          - ios-xctest-metrics
          - battery-per-background-pass
    env:
      # `cargo xtask gate`'s `device-lanes` step reads this: set, it stops
      # skipping and starts REQUIRING the two device enumerators to answer
      # (`xcrun devicectl list devices` for a physical iPhone — not `simctl`,
      # which lists simulators — and `adb devices`). A runner that claims the
      # label and has no phone goes red rather than quietly reporting four lanes
      # it did not run.
      CENTRAID_DEVICE_RUNNER: "1"
      CENTRAID_GATE_HARDWARE: device-android-mid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: channel
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: ${{ steps.channel.outputs.channel }}
      - name: Lease a device and make it appear where the harness looks
        # The lease script's rule, unchanged: it leases a device and makes it
        # appear where the EXISTING harness already looks, because a farm SDK
        # that drove the flows itself would be a second device driver whose
        # green says nothing about the first. iOS needs `xcrun devicectl`, not
        # `simctl`, which is what the lane bodies use.
        run: bash scripts/ci/device-farm-lease.sh
      - run: cargo xtask gate --profile nightly --lane ${{ matrix.lane }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-lane-${{ matrix.lane }}
          path: target/xtask/**
          retention-days: 14
          if-no-files-found: warn

  # THE FLAKE, which has still never been evaluated ([#1020](https://github.com/srikanth235/centraid/issues/1020), D-1020-G6).
  #
  # `nix` is not installed on the container the v1 tree was built on, so
  # `flake.nix` has been written and never run. There are two honest things to
  # do about that and not a third: evaluate it, or say it has not been
  # evaluated. This job does the second, and checks the one property of the
  # flake that IS checkable without nix.
  #
  # WHY THERE IS NO `nix flake check` STEP HERE YET. Running it needs nix on the
  # runner, and this repository installs external tools one of exactly two ways:
  # a SHA-pinned third-party action, or a pinned release binary fetched in a
  # `run:` step (`scripts/lint-workflow-pins.mjs` rule 1 and `gate.yml`'s
  # actionlint/gitleaks/osv-scanner/buf installs). It has no pin for either
  # shape of nix installer, and inventing one would be a fabricated pin in the
  # file whose whole subject is pinning. So the evaluation is an OWNER HAND-OFF
  # with the command written down, and this job refuses to imply otherwise.
  #
  # OWNER HAND-OFF: on a machine with nix, run `nix flake check
  # --print-build-logs`, commit the resulting `flake.lock`, and add the pinned
  # installer this job is missing. Until then `flake.nix`'s header says it has
  # never been evaluated and so does this lane's summary.
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The flake states the toolchain channel ONCE, and has not been evaluated
        run: |
          set -euo pipefail
          # THE ONE CHECKABLE PROPERTY. `rust-toolchain.toml` is the single
          # version file for the v1 tree; `flake.nix` must read it through
          # `fromRustupToolchainFile` rather than repeat the channel, because a
          # second literal is exactly how the two drift. This is greppable
          # without nix, and it is the part of the flake most likely to rot.
          if ! grep -q 'fromRustupToolchainFile ./rust-toolchain.toml' flake.nix; then
            echo "::error title=flake repeats the toolchain::flake.nix must read the channel from rust-toolchain.toml (fromRustupToolchainFile), not state it again"
            exit 1
          fi
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)"
          if grep -q "\"${channel}\"" flake.nix; then
            echo "::error title=flake repeats the channel literal::flake.nix names ${channel} as a literal; rust-toolchain.toml is the one place it belongs"
            exit 1
          fi
          echo "flake.nix reads the channel (${channel}) from rust-toolchain.toml and states no second copy"
          if [ -f flake.lock ]; then
            echo "::warning title=flake.lock exists and nothing evaluated it::add the pinned nix installer this job is missing, then `nix flake check`"
          fi
          {
            echo "### nix flake check: NOT RUN"
            echo
            echo "\`flake.nix\` has never been evaluated. \`nix\` is absent from every runner"
            echo "this repository uses and there is no pinned installer for it, so the first"
            echo "evaluation is an owner hand-off: \`nix flake check --print-build-logs\` on a"
            echo "machine with nix, then commit \`flake.lock\`. What WAS checked here is that"
            echo "the flake reads the Rust channel out of \`rust-toolchain.toml\` instead of"
            echo "carrying a second copy of it."
          } >> "$GITHUB_STEP_SUMMARY"

  # THE CANDIDATE POINTER, in its v1 form ([#1020](https://github.com/srikanth235/centraid/issues/1020), D-1020-G3).
  #
  # `docs/release.md`'s candidate precondition is the one thing standing between
  # a tag and a commit no deep rung ever exercised, because "every release lane
  # BUILDS the tree rather than testing it". v0 moves `refs/candidates/latest`
  # on a green `candidate.yml`; v1's deep rung is this workflow, so a green
  # nightly gate is what promotes. `release.yml`'s `require-candidate` backstop
  # is unchanged and still accepts either the current pointer or any commit in
  # the gh-pages promotion history.
  #
  # It writes the ref through the repository's existing script rather than a
  # hand-rolled `git push`, so there is one writer and one shape of history.
  promote-candidate:
    needs: [gate-nightly]
    if: github.event_name == 'schedule' && needs.gate-nightly.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: node scripts/ci/write-candidate.mjs --sha "${{ github.sha }}" --reason "green cargo xtask gate --profile nightly (#1020)"
