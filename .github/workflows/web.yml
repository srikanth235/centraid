name: web

# #501 — deploy of the continuous public PWA (app.centraid.dev).
# Gateway-embedded shell remains primary for the LAN/ticket path.
# The deploy step runs only when CLOUDFLARE_API_TOKEN is present.
#
# #557 — the PR gate for this build is `web-build` in ci.yml, so every merge
# blocker lives under the single required `check`. What stays here is the
# deploy, which owns the Cloudflare credentials. Deploys are deliberately not
# folded into ci.yml: one workflow holding every publishing secret is a blast
# radius, not a simplification.
#
# The build previously ran twice on a push to main (a `build` job, then again
# inside `deploy`). It is one job now — the smoke check that gated the deploy
# runs in the same job that performs it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/client/**"
      - "packages/design/**"
      - ".github/workflows/web.yml"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run web:build
      # Gates the deploy below — a failing smoke stops the job before wrangler.
      - run: bun run web:smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7
      - name: Deploy to Cloudflare (when token present)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/web
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN absent — skip deploy (scaffold). Bind app.centraid.dev in CF when ready."
            exit 0
          fi
          bunx wrangler deploy --config wrangler.json
