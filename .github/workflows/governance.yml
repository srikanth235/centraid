# governance-kit:managed kit-version=0.14.0
name: Governance

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # Full history is required by git-grep-based governance directives.
          fetch-depth: 0

      - name: Run bash governance directives
        run: bash .governance/run.sh

      # Native test runners are opt-in; governance itself must use the project's
      # declared toolchain.
