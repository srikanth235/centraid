# Keep SHA-pinned actions current, including their trailing version comments;
# security advisories bypass weekly grouping and open immediately.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      # Dependabot cannot append the required issue suffix; the governance
      # hook's Dependabot exemption handles these commit titles.
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # The root manifest and bun.lock cover every workspace.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    # Keep the dev/prod split; `prefix-development` is not verified for Bun and
    # an invalid key disables the whole config.
    commit-message:
      prefix: "chore(deps)"
    # Monthly toolchain upgrades own these coupled exact pins and their review.
    ignore:
      - dependency-name: ultracite
      - dependency-name: oxlint
      - dependency-name: oxlint-tsgolint
      - dependency-name: oxfmt
      - dependency-name: typescript
      - dependency-name: knip
      - dependency-name: vitest
      - dependency-name: turbo
    groups:
      # Batch low-risk toolchain churn.
      dev-toolchain:
        dependency-type: development
        patterns: ["*"]
      production:
        dependency-type: production
        patterns: ["*"]
        # Keep major production bumps attributable; group patch/minor updates.
        update-types: ["minor", "patch"]

  # Keep the three crates independent; each owns its adjacent Cargo.lock.
  - package-ecosystem: cargo
    directories:
      - /packages/tunnel/data-plane
      - /packages/tunnel/native
      - /apps/web/iroh-wasm
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Iroh minor bumps can change ALPN/relay behavior; require pairing tests
      # and keep them out of batched dependency PRs.
      - dependency-name: iroh
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
