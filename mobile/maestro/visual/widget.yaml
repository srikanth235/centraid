# CONTENT must identify a real row, calendar cell, or honest first-use control.
# Merely seeing a page container is insufficient: errors can draw one too.
appId: ${APP_ID}
name: Seeded app content from Home
---
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible:
      id: home-grid
    timeout: 60000
- assertNotVisible:
    id: home-failure
- scrollUntilVisible:
    element:
      id: home-tile-${WIDGET}
    direction: DOWN
    timeout: 60000
- tapOn:
    id: home-tile-${WIDGET}
- scrollUntilVisible:
    element:
      id: ${CONTENT}
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: ${CONTENT}
- takeScreenshot: screen
