appId: ${APP_ID}
name: Backup settings and destination action
---
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible:
      id: home-backup-status
    timeout: 30000
- tapOn:
    id: home-backup-status
- extendedWaitUntil:
    visible:
      id: backup-screen
    timeout: 30000
- takeScreenshot: backup-top
- scrollUntilVisible:
    element:
      id: backup-add-destination
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: backup-add-destination
- takeScreenshot: backup-destination
