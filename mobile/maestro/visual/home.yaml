appId: ${APP_ID}
name: Seeded Home widgets
---
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible:
      id: home-grid
    timeout: 30000
- assertNotVisible:
    id: home-failure
- assertVisible:
    id: home-tile-agenda
- takeScreenshot: home-top
- scrollUntilVisible:
    element:
      id: home-tile-photos
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: home-tile-photos
- takeScreenshot: home-photos
- scrollUntilVisible:
    element:
      id: home-tile-docs
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: home-tile-docs
- takeScreenshot: home-lower
