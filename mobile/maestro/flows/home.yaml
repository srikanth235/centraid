# Home: the three springboards, and the two that are easy to confuse.
#
# THE POINT OF THIS FLOW is the same as the Tally one's, one level up. An empty
# vault and an unreadable one both produce a Home with no content in it, and
# only one of them may say the vault is empty. A unit test asserts the state; a
# flow is the only thing that can assert the two RENDER differently, which is
# where the confusion actually reaches a member.
appId: dev.centraid.Centraid
name: home
---
# A VAULT-HOLDING INSTALL, NOT A FRESH ONE: a fresh install holds no vault and
# opens onto the first-launch deck (`first-launch.yaml`), and `clearState` here
# would throw away the vault this flow reads. Seed one first with
# `mobile/scripts/demo-vault.sh`, which relaunches the debug app on it.
- launchApp
# The grid is the root. Every other screen in the product is reached through it.
- assertVisible:
    id: "home-grid"
# The lockup's second line is the backup's status, always (R-ONBOARD-11). The
# health ribbon (`home-status`) is drawn only while there is something to say,
# so a healthy vault has none.
- assertVisible:
    id: "home-backup-status"

# DAY ONE is a claim about the vault, and only a settled, readable, empty vault
# earns it. When it shows, first moves show with it — never dashed placeholders.
- runFlow:
    when:
      visible:
        id: "home-day-one"
    commands:
      - assertVisible: "Nothing in here yet"
      - assertVisible:
          id: "home-first-moves"
      # An unreadable Home must NOT be able to reach this screen.
      - assertNotVisible: "Not on this phone yet"

# EVERY TILE UNREADABLE still shows the grid — demoting them all would leave a
# launcher with no tiles — and it must never claim the vault is empty.
- runFlow:
    when:
      visible: "Not on this phone yet"
    commands:
      - assertVisible:
          id: "home-grid"
      - assertNotVisible: "Nothing in here yet"

# A Home that could not load at all has NO grid: it does not invent eight empty
# apps out of one failure.
- runFlow:
    when:
      visible:
        id: "home-failure"
    commands:
      - assertNotVisible:
          id: "home-grid"

# EVERY APP IS A TILE ON HOME (R-ONBOARD-11), empty or not. There is no All
# apps sheet.
- assertVisible:
    id: "home-grid"
