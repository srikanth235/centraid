# Home: the three springboards, and the two that are easy to confuse.
#
# THE POINT OF THIS FLOW is the same as the per-app flows', one level up. An empty
# vault and an unreadable one both produce a Home with no content in it, and
# only one of them may say the vault is empty. A unit test asserts the state; a
# flow is the only thing that can assert the two RENDER differently, which is
# where the confusion actually reaches a member.
appId: dev.centraid.Centraid
name: home
---
# A DAY-ZERO VAULT, made by `onboarding.yaml` and not yet added to (run this straight after it). A
# fresh install holds no vault and opens onto the first-launch screen (`first-launch.yaml`), and
# `clearState` here would throw away the vault this flow reads. The seeded demo vault is NOT this
# flow's: its items are older than a day, so its lockup carries "Not backed up yet · Pair"
# (`backup::line::pair_owed`, 2026-11-17), where a day-zero vault carries no status line.
- launchApp
# The grid is the root. Every other screen in the product is reached through it.
- assertVisible:
    id: "home-grid"
# The lockup's second line is the backup's status, empty on day zero and day one by ruling
# (2026-11-17, R-ONBOARD-11): a fresh vault shows the welcome card and no status line. The health
# ribbon (`home-status`) is drawn only while there is something to say, so a healthy vault has none.
- assertNotVisible:
    id: "home-backup-status"

# DAY ZERO is a claim about the vault, and only a settled, readable vault that holds nothing of
# the member's earns it. It is the one Home with a welcome card above it; each empty widget says
# its one action (2026-11-17).
- runFlow:
    when:
      visible:
        id: "home-welcome"
    commands:
      - assertVisible: "Nothing in here yet. Start with what this phone already holds."
      - assertVisible: "Import your calendar"
      - assertVisible: "This note is yours"
      # An unreadable Home must NOT be able to reach this screen.
      - assertNotVisible: "Not on this phone yet"

# EVERY TILE UNREADABLE still shows the grid — demoting them all would leave a
# launcher with no tiles — and it must never claim the vault is empty.
- runFlow:
    when:
      visible: "Not on this phone yet"
    commands:
      - assertVisible:
          id: "home-grid"
      - assertNotVisible: "Nothing in here yet"

# A Home that could not load at all has NO grid: it does not invent eight empty
# apps out of one failure.
- runFlow:
    when:
      visible:
        id: "kit-failure"
    commands:
      - assertNotVisible:
          id: "home-grid"

# EVERY APP IS A TILE ON HOME (R-ONBOARD-11), empty or not. There is no All
# apps sheet.
- assertVisible:
    id: "home-grid"
