# Home: the springboard room, and the two Homes that are easy to confuse.
#
# THE POINT OF THIS FLOW is one level up from the per-app flows': a Home that read nothing and a
# Home that could not load both lack content, and only the failed one draws the failure sentence.
# Ids are the room's own selector ids (`crates/screens/tests/rooms/home_springboard.txt`).
appId: dev.centraid.Centraid
name: home
---
# A VAULT THE MEMBER HAS MADE. Run it after `onboarding.yaml`, or on the seeded demo vault
# (`mobile/scripts/demo-vault.sh`). A fresh install holds no vault and opens onto the words screen.
- launchApp
- assertVisible:
    id: "room-home"
# The band's three places, and the springboard's glance over its tiles.
- assertVisible:
    id: "tab/home"
- assertVisible:
    id: "tab/chat"
- assertVisible:
    id: "tab/backup"
- assertVisible:
    id: "band/search"
- assertVisible:
    id: "glance/today"
- assertVisible:
    id: "block-tiles"
# EVERY APP IS A TILE ON HOME, empty or not. The tiles the room draws are all launchable.
- assertVisible:
    id: "tile/calendar"
- assertVisible:
    id: "tile/notes"
- assertVisible:
    id: "tile/people"
# A Home that could not load draws the failure sentence and no springboard: it does not invent
# empty apps out of one failure.
- runFlow:
    when:
      visible:
        id: "kit-failure"
    commands:
      - assertNotVisible:
          id: "block-tiles"
