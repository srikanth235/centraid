# Home: the three springboards, and the two that are easy to confuse.
#
# THE POINT OF THIS FLOW is the same as the per-app flows', one level up. An empty
# vault and an unreadable one both produce a Home with no content in it, and
# only one of them may say the vault is empty. A unit test asserts the state; a
# flow is the only thing that can assert the two RENDER differently, which is
# where the confusion actually reaches a member.
appId: dev.centraid.Centraid
name: home
---
# A VAULT-HOLDING INSTALL, NOT A FRESH ONE: a fresh install holds no vault and
# opens onto the first-launch deck (`first-launch.yaml`), and `clearState` here
# would throw away the vault this flow reads. Seed one first with
# `mobile/scripts/demo-vault.sh`, which relaunches the debug app on it.
- launchApp
# The grid is the root. Every other screen in the product is reached through it.
- assertVisible:
    id: "home-grid"
# The lockup's second line is the backup's status, always (R-ONBOARD-11). The
# health ribbon (`home-status`) is drawn only while there is something to say,
# so a healthy vault has none.
- assertVisible:
    id: "home-backup-status"

# DAY ONE keeps Rust's first-run tile order and shows each app's own typed state.
# A tile invitation never turns into an aggregate claim about the whole vault.
- runFlow:
    when:
      visible:
        id: "home-day-one"
    commands:
      - assertVisible:
          id: "home-grid"
      - assertNotVisible: "Nothing in here yet"

# An unreadable tile remains visibly distinct from a typed-empty invitation;
# the grid remains available so the member can still open another app.
- runFlow:
    when:
      visible: "Not on this phone yet"
    commands:
      - assertVisible:
          id: "home-grid"
      - assertVisible: "Not on this phone yet"
      - assertNotVisible: "Nothing in here yet"

# A Home that could not load at all has NO grid: a read failure is not a set of
# empty app invitations.
- runFlow:
    when:
      visible:
        id: "kit-failure"
    commands:
      - assertNotVisible:
          id: "home-grid"

# EVERY APP IS A TILE ON HOME (R-ONBOARD-11), empty or not. There is no All
# apps sheet. Rust can choose first-run or content order; return to the top
# before searching down for each app so neither order depends on the last one.
- assertVisible:
    id: "home-grid"
- scrollUntilVisible:
    element: { id: "home-tile-calendar" }
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-calendar" }
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-reminders" }
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-calendar" }
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-photos" }
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-calendar" }
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-notes" }
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-calendar" }
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-docs" }
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-calendar" }
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-people" }
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-calendar" }
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-money" }
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-calendar" }
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-health" }
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-calendar" }
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element: { id: "home-tile-locker" }
    centerElement: true
