# An app root has no back chevron, and a swipe in from its leading edge returns to Home (#1173,
# iOS: the root's own edge swipe; Android: the system back gesture). Calendar and Photos stand for
# every app: both draw the same `AppPlace` room.
#
# THE DEMO VAULT (`mobile/scripts/demo-vault.sh`), as `home.yaml`.
appId: dev.centraid.Centraid
name: app-root-edge-swipe
---
- launchApp
- tapOn:
    id: "tile/calendar"
- assertVisible:
    id: "tab/calendar"
- swipe:
    start: "1%,50%"
    end: "70%,50%"
- assertVisible:
    id: "tile/calendar"
- tapOn:
    id: "tile/photos"
- swipe:
    start: "1%,50%"
    end: "70%,50%"
- assertVisible:
    id: "tile/photos"
