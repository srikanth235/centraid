# The member's chat history is searchable from the Chats page (#1097, R-1097-22): a word of a question
# they asked finds the chat, a slip is corrected, and nothing matching says so. A tap on the row
# opens the thread in the Chat room.
#
# THIS FLOW NEEDS A MODEL ON THE PHONE, and it does not relaunch the app. A chat is saved when a turn
# finishes, so a question has to be asked and its turn finished (a slow one: the flow waits up to ten
# minutes for a small model on a simulator). Launch a DEBUG build with a model file first (the flow
# starts from whatever is in front):
#
#   xcrun simctl launch <udid> dev.centraid.Centraid   # with
#   SIMCTL_CHILD_CENTRAID_DEV_MODEL=<path to the .gguf> in the environment
#
# THE DEMO VAULT (`mobile/scripts/demo-vault.sh`), which holds no chat. Re-runnable: each run asks the
# question again and leaves one more chat with the same title, so the flow asserts that a row is there
# and never how many. Home's search no longer lists chats; the Chats page's own search does. Ids are
# the Chat room's own (`crates/screens/tests/rooms/chat_root.txt`, `chat_thread.txt`).
appId: dev.centraid.Centraid
name: search-chat
---
# 1. Ask a distinctive question and let the turn finish, so the chat is saved.
- tapOn:
    id: "tab/chat"
- extendedWaitUntil:
    visible:
      id: "field/composer"
    timeout: 120000
- tapOn:
    id: "field/composer"
- inputText: "Where is the quarzlux warranty letter"
- tapOn:
    id: "form/save"
# The turn is over when the assistant's message is there, whatever it says: a small model may answer
# "I could not settle this", and the member's message is saved all the same.
- extendedWaitUntil:
    visible:
      id: "msg/1"
    timeout: 600000
# 2. The Chats page lists the thread, and its search finds it by a word of the question.
- tapOn:
    id: "back"
- tapOn:
    id: "key/threads"
- tapOn:
    id: "band/search"
- tapOn:
    id: "search"
- inputText: "quarzluk"
- extendedWaitUntil:
    visible:
      id: "search-corrected"
    timeout: 10000
- assertVisible: "Including results for “quarzlux”"
- assertVisible:
    id: "thread/.*"
- eraseText: 8
- inputText: "quarzlux"
- extendedWaitUntil:
    visible:
      id: "thread/.*"
    timeout: 10000
- assertNotVisible:
    id: "search-corrected"
- eraseText: 8
- inputText: "zzqxv"
- extendedWaitUntil:
    visible:
      id: "block-empty"
    timeout: 10000
# 3. Closing the field puts the plain list back.
- tapOn:
    id: "search/close"
- assertVisible:
    id: "thread/.*"
