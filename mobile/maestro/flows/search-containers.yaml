# A container is a search result of its own (#1097): the list a member typed the name of is a row of
# Home's search (`search/container/<id>`), and a tap opens it where its app opens it, the list's page.
#
# THE FLOW MAKES ITS OWN LIST. The demo vault holds no list called "Orchard", so the first run adds
# one from Reminders' "New list" (`lists/add`, a form with `field/title` and `form/save`) and every
# later run finds it there and skips the step. Re-runnable: it leaves that one list and a recent
# search. Maestro matches an id as a regular expression, so the container's id is matched by its stem.
appId: dev.centraid.Centraid
name: search-containers
---
- launchApp
- tapOn:
    id: "tile/reminders"
- runFlow:
    when:
      notVisible: "Orchard.*"
    commands:
      - tapOn:
          id: "lists/add"
      - tapOn:
          id: "field/title"
      - inputText: "Orchard"
      - tapOn:
          id: "form/save"
- assertVisible: "Orchard.*"
# Home's search: the list is a hit, before the rows.
- launchApp
- tapOn:
    id: "band/search"
- tapOn:
    id: "search"
- inputText: "orchard"
- extendedWaitUntil:
    visible:
      id: "search/container/.*"
    timeout: 5000
- assertVisible: ".*Orchard.*"
# A tap opens the list's page; the search is behind it.
- tapOn:
    id: "search/container/.*"
- extendedWaitUntil:
    visible: ".*Orchard.*"
    timeout: 5000
- assertNotVisible:
    id: "search"
