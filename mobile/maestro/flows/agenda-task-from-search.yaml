# A task found by Home's search opens its page, and closing it lands back on the results.
#
# THE DEMO VAULT (`mobile/scripts/demo-vault.sh`), as `home.yaml`. The flow adds "Flow task" first, as
# `agenda-todo.yaml` does; each run leaves one. Ids are Home's and Reminders' room selector ids.
appId: dev.centraid.Centraid
name: agenda-task-from-search
---
- launchApp
- tapOn:
    id: "tile/reminders"
- tapOn:
    id: "key/add"
- tapOn:
    id: "field/title"
- inputText: "Flow task"
- tapOn:
    id: "form/save"
- extendedWaitUntil:
    visible:
      id: "room-reminders"
    timeout: 5000
- launchApp
- tapOn:
    id: "band/search"
- tapOn:
    id: "search"
- inputText: "Flow task"
- extendedWaitUntil:
    visible:
      id: "search/hit/.*"
    timeout: 5000
# A hit's row is one spoken element and its text is also the field's, so the tap names the row by id.
- tapOn:
    id: "search/hit/.*"
- extendedWaitUntil:
    visible:
      id: "hero/done"
    timeout: 5000
- tapOn:
    id: "back"
- assertVisible:
    id: "search/section/.*"
# Reminders' own search finds the task too.
- tapOn:
    id: "search/close"
- tapOn:
    id: "tile/reminders"
- tapOn:
    id: "band/search"
- tapOn:
    id: "search"
- inputText: "Flow task"
- extendedWaitUntil:
    visible: "Flow task"
    timeout: 5000
