# A task found by Home's search opens its page, and the page is Agenda's
# (#1128, R-1128-5, R-1128-7): the hit is grouped under Agenda, a tap pushes
# the task, and closing it lands back on the results.
#
# A VAULT-HOLDING INSTALL, as `home.yaml`. There is no starter task (starter rows exist only in
# Notes), so the flow adds "Flow task" to the Inbox first; each run leaves one.
appId: dev.centraid.Centraid
name: agenda-task-from-search
---
- launchApp
- tapOn:
    id: "home-tile-reminders"
- tapOn:
    id: "reminders-band-reminders"
- tapOn:
    id: "agenda-add-task"
- extendedWaitUntil:
    visible:
      id: "agenda-quick-add"
    timeout: 5000
- inputText: "Flow task"
- tapOn:
    id: "agenda-quick-add-verb"
# The status line says where it went (Reminders' root is the lists page, not the rows, #1173).
- extendedWaitUntil:
    visible:
      id: "agenda-status-action"
    timeout: 5000
- launchApp
- tapOn:
    id: "home-search-open"
- tapOn:
    id: "home-search-field"
- inputText: "Flow task"
- extendedWaitUntil:
    visible:
      id: "home-search-group-reminders"
    timeout: 5000
# A hit's row is one spoken element ("Task, Flow task") and its text is also the field's, so the
# tap names the row by its id (the first of the runs' tasks).
- tapOn:
    id: "home-search-row-task-.*"
- extendedWaitUntil:
    visible:
      id: "tasks-title-field"
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Done"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible:
    id: "home-search-group-reminders"
# Agenda's own search finds the task too, above the event days.
- tapOn:
    id: "home-search-close"
- tapOn:
    id: "home-tile-reminders"
- tapOn:
    id: "band-search"
- inputText: "Flow task"
- extendedWaitUntil:
    visible: "Flow task"
    timeout: 5000
# The field holds the same words, so the hit itself is named by its row's id.
- assertVisible:
    id: "agenda-task-row-.*"
