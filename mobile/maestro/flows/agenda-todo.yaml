# Reminders' room: the smart lists over the lists of My Lists, a new reminder from the header's plus,
# the task's own page, and More's places.
#
# THE DEMO VAULT (`mobile/scripts/demo-vault.sh`), as `home.yaml`. Re-runnable, but each run leaves
# one task titled "Flow task" (the flow does not touch the seeded rows). Ids are the room's own
# (`crates/screens/tests/rooms/reminders_today.txt`, `reminders_task_detail.txt`).
appId: dev.centraid.Centraid
name: agenda-todo
---
- launchApp
- tapOn:
    id: "tile/reminders"
- assertVisible:
    id: "room-reminders"
- assertVisible:
    id: "tab/reminders"
- assertVisible:
    id: "choice/smart"
- assertVisible:
    id: "key/add"
# The plus opens the new-reminder form; saving it adds the task and returns to the room.
- tapOn:
    id: "key/add"
- assertVisible:
    id: "field/title"
- tapOn:
    id: "field/title"
- inputText: "Flow task"
- tapOn:
    id: "form/save"
- tapOn:
    id: "choice/smart-all"
- extendedWaitUntil:
    visible: "Flow task"
    timeout: 5000
# A task's row opens its page: the hero's Done and the subtasks section.
- tapOn: "Flow task"
- extendedWaitUntil:
    visible:
      id: "hero/done"
    timeout: 5000
- assertVisible:
    id: "section/subtasks"
- tapOn:
    id: "back"
- assertVisible:
    id: "choice/smart"
# More holds the room's places.
- tapOn:
    id: "band/more"
- assertVisible:
    id: "more/trash"
