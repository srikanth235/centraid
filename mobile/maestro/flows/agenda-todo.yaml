# Reminders' root, the lists page (#1128, R-1128-1, #1173): the smart lists, then My Lists with the Inbox.
# The Plus opens the quick-add bar on the keyboard (R-CHROME-1, #1130): an add
# lands in the Inbox and the bar stays for the next; an empty bar closes when
# the keyboard leaves. More holds the Tasks places, and a page pushed from it
# names Reminders as its back.
#
# A VAULT-HOLDING INSTALL, as `home.yaml`. Re-runnable, but each run leaves one
# task titled "Flow task" in the Inbox (the flow does not touch the starters).
appId: dev.centraid.Centraid
name: agenda-todo
---
- launchApp
- tapOn:
    id: "home-tile-reminders"
- tapOn:
    id: "reminders-band-reminders"
# A day-zero vault has no list rows yet: the page is the smart lists over an empty state, and the
# Plus is there either way (`agenda-todo-list` is drawn once a task exists).
- extendedWaitUntil:
    visible:
      id: "agenda-add-task"
    timeout: 5000
# The bar is not drawn until the Plus opens it.
- assertNotVisible:
    id: "agenda-quick-add"
- tapOn:
    id: "agenda-add-task"
- extendedWaitUntil:
    visible:
      id: "agenda-quick-add"
    timeout: 5000
- inputText: "Flow task"
- tapOn:
    id: "agenda-quick-add-verb"
# THE ROOT IS THE LISTS PAGE (Today, Scheduled, All, Flagged, then My Lists, #1173): a task added
# to the Inbox is a row of the Inbox's own page, which the Inbox list opens. The status line says
# where it went.
- extendedWaitUntil:
    visible:
      id: "agenda-status-action"
    timeout: 5000
- hideKeyboard
- tapOn:
    id: "agenda-project-inbox"
- extendedWaitUntil:
    visible: "Flow task"
    timeout: 5000
# A task's row opens its page; Done returns to the list.
- tapOn: "Flow task"
- extendedWaitUntil:
    visible:
      id: "tasks-title-field"
    timeout: 5000
# iOS closes the page with Done, Android with back.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Done"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible:
    id: "tasks-list-title"
# The Inbox's back control returns to the lists page.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "kit-pushed-back"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "room-back"
- assertVisible:
    id: "agenda-todo-list"
# More: the Tasks places, then back to Reminders.
- tapOn:
    id: "reminders-band-more"
- tapOn:
    id: "agenda-more-anytime"
- extendedWaitUntil:
    visible:
      id: "tasks-list"
    timeout: 5000
# The page pushed from More names Reminders as its back (Calendar and Reminders are two apps, #1173).
- assertVisible: "Back to Reminders"
