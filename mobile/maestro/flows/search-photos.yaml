# Photos' search: a slip in a word of a photograph's caption finds the photograph, the line over the
# field says what was searched ("Including results for “emerald”"), and a term nothing matches draws
# the empty block.
#
# THE DEMO VAULT, and no other: the onboarding starters hold no photograph. Seed it first with
# `mobile/scripts/demo-vault.sh ios` (or `android`); the "Demo vault" is the one this flow reads. Its
# roll holds a photograph captioned "Emerald Bay overlook", and "emrald" is its first word with a
# letter dropped. Re-runnable: the flow leaves a closed search and nothing else.
#
# A photograph's cell is `tile/<asset id>` (`crates/screens/tests/rooms/photos_library.txt`); the room's
# search field is `search` and its close key `search/close`.
appId: dev.centraid.Centraid
name: search-photos
---
- launchApp
- tapOn:
    id: "tile/photos"
- tapOn:
    id: "band/search"
- inputText: "emrald"
# The slip finds the photograph, and the line names the word searched.
- extendedWaitUntil:
    visible:
      id: "search-corrected"
    timeout: 8000
- assertVisible: "Including results for “emerald”"
- assertVisible:
    id: "tile/.*"
- assertNotVisible:
    id: "block-empty"
# An exact word says nothing: no line over a photograph it did not correct.
- eraseText: 6
- inputText: "emerald"
- extendedWaitUntil:
    visible:
      id: "tile/.*"
    timeout: 8000
- assertNotVisible:
    id: "search-corrected"
# Nothing matches: the empty block, with the term in its sentence.
- eraseText: 7
- inputText: "zzqxv"
- extendedWaitUntil:
    visible:
      id: "block-empty"
    timeout: 8000
- assertVisible: "Nothing matches.*"
- assertNotVisible:
    id: "search-corrected"
