# Onboarding without sample data: a fresh install makes ONE vault, the member's, and every empty app
# is a tile that opens on its own first-open card.
#
# THE POINT OF THIS FLOW is what the shared specs cannot see: that Get started lands on Home with one
# vault, that an empty app opens on its own card with nothing borrowed, that People offers the phone's
# contacts at the point of use (the OS prompt itself is not tapped here), and that Locker opens on its
# wall. Ids are the room's own (`day_one_welcome.txt`, `first_open_*.txt`, `locker_*.txt`).
#
# THE RECOVERY KEY. On both platforms Get started keeps the key without showing it and goes straight to
# Home; only a vault on its own key shows the words at creation, so the conditional step below runs
# only for that.
#
# A FRESH INSTALL WITH NO KEY HELD. `clearState` does not clear the simulator keychain, and a phone
# that already holds a seed makes the next vault from it without showing anything. Reset it first:
#   xcrun simctl keychain <udid> reset
appId: dev.centraid.Centraid
name: onboarding
---
# EVERY GRANT DENIED. Maestro grants all by default; with none, Home stays uninterrupted and People
# offers its explicit import at the point of use.
- launchApp:
    clearState: true
    permissions:
      all: deny
- assertVisible:
    id: "room-welcome"
- tapOn:
    id: "welcome/start"
# THE KEY, SHOWN ONCE where it stays on this phone alone.
- runFlow:
    when:
      visible:
        id: "words-shown"
    commands:
      - assertVisible:
          id: "words-save-copy"
      - tapOn:
          id: "words-make-primary"
# ONE VAULT, THE MEMBER'S: the springboard, with its glance over the tiles.
- extendedWaitUntil:
    visible:
      id: "block-tiles"
    timeout: 30000
- assertVisible:
    id: "glance/today"
# AN EMPTY APP IS STILL A TILE, one tap from Home, and opens on its own first card.
- tapOn:
    id: "tile/docs"
- extendedWaitUntil:
    visible:
      id: "first/docs/action"
    timeout: 10000
- tapOn:
    id: "band/home"
# PEOPLE OFFERS THE PHONE'S CONTACTS at the point of use. A phone that was never asked offers the
# import (`first/people/action`); one whose grant is DENIED, as this flow's is, offers Settings
# (`first/people/settings`). Either way no system prompt lands on the member.
- tapOn:
    id: "tile/people"
- extendedWaitUntil:
    visible:
      id: "first/people/(action|settings)"
    timeout: 10000
- tapOn:
    id: "band/home"
# LOCKER opens on its wall, "Step 1 of 2", and asks for the owner check only at the tap.
- scrollUntilVisible:
    element:
      id: "tile/locker"
- tapOn:
    id: "tile/locker"
- assertVisible:
    id: "wall/unlock"
