# Onboarding without sample data: a fresh install makes ONE vault — the member's, with its teaching
# starter rows — and every empty app is a tile that opens on its own day one.
#
# THE POINT OF THIS FLOW is what the shared specs cannot see: that Get started
# lands on Home with one vault, that Home is day zero (the welcome card over the one layout) and Notes opens on its starter rows, the only starters,
# that an empty app opens on its own empty state with nothing borrowed, and
# that People offers the phone's contacts at the point of use (the OS prompt
# itself is not tapped here).
#
# THE RECOVERY KEY (R-1047-E15, R-ONBOARD-10). On both platforms Get started keeps the key
# without showing it and goes straight to Home; the key is asked for after the first backup
# (`RecoveryKeyPrompt`, owner 2026-11-18). Only a vault on its own key shows the words at
# creation, so the conditional step below runs only for that. There is no framing screen and
# no word check.
#
# A FRESH INSTALL WITH NO KEY HELD. `clearState` does not clear the simulator
# keychain, and a phone that already holds a seed makes the next vault from it
# without showing anything. Reset it first:
#   xcrun simctl keychain <udid> reset
appId: dev.centraid.Centraid
name: onboarding
---
# EVERY GRANT DENIED. Maestro grants all by default; the automatic import pass
# uses existing grants without prompting. With no grants, Home remains uninterrupted
# and People offers its explicit import at the point of use (R-ONBOARD-8).
- launchApp:
    clearState: true
    permissions:
      all: deny
- assertVisible:
    id: "first-launch"
- tapOn:
    id: "first-launch-primary"

# THE KEY, SHOWN ONCE where it stays on this phone alone.
- runFlow:
    when:
      visible:
        id: "words-shown"
    commands:
      - assertVisible:
          id: "words-save-copy"
      - tapOn:
          id: "words-make-primary"

# ONE VAULT, THE MEMBER'S. No sample beside it. (The lockup reads as one
# element, "My vault, Not backed up", so it is selected by id.)
- extendedWaitUntil:
    visible:
      id: "home-grid"
    timeout: 30000
- assertVisible:
    id: "home-vault-name"
# THE LOCKUP'S SECOND LINE IS EMPTY ON DAY ZERO AND DAY ONE (ruling 2026-11-17, R-ONBOARD-11): the
# backup's one seat says nothing until about a day after the first item. The day-zero state below is
# the welcome card, and no status line.
- assertNotVisible:
    id: "home-backup-status"

# DAY ZERO: the welcome card over the one Home, each empty widget with its one action, and the
# starter note in Notes' widget (`crates/core/src/starters.rs`), the only starter rows.
- assertVisible:
    id: "home-welcome"
- assertVisible: "This note is yours"

# AN EMPTY APP IS STILL A TILE, one tap from Home, and opens on its own day
# one: its add, and no example (R-ONBOARD-12).
- scrollUntilVisible:
    element:
      id: "home-tile-docs"
    direction: UP
- tapOn:
    id: "home-tile-docs"
- extendedWaitUntil:
    visible:
      id: "kit-empty"
    timeout: 10000
- assertNotVisible: "See an example"
# Back to Home: an app root has no back chevron (#1173); the band's Home capsule is the way, on both shells.
- tapOn:
    id: "docs-band-home"

# PEOPLE OFFERS THE PHONE'S CONTACTS in place of its add, at the point of use.
- scrollUntilVisible:
    element:
      id: "home-tile-people"
- tapOn:
    id: "home-tile-people"
# A phone that was never asked offers "Import from Contacts" (`kit-empty-import`); one whose grant is
# DENIED, as this flow's is, cannot be asked again, so it says so and offers Settings (`kit-empty-action`,
# "Contacts access is off", #1186). Either way no system prompt lands on the member.
- extendedWaitUntil:
    visible:
      id: "kit-empty-(import|action)"
    timeout: 10000
