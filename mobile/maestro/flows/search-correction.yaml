# Search says what it searched for (#1097): a one-letter slip finds the row and the line over the
# field names the word searched ("Including results for “yours”"); a term nothing matches draws the
# empty block.
#
# THE DEMO VAULT (`mobile/scripts/demo-vault.sh`): the starter note "This note is yours" holds the
# word "yours", and "yuors" is its two neighbours swapped. Ids are Home's room selector ids
# (`band/search`, `search`, `search/close`). The Ask row to the Chat tab is not driven here.
appId: dev.centraid.Centraid
name: search-correction
---
- launchApp
- tapOn:
    id: "band/search"
- tapOn:
    id: "search"
- inputText: "yuors"
# The slip finds the row, and the field says what was searched for.
- extendedWaitUntil:
    visible:
      id: "search-corrected"
    timeout: 5000
- assertVisible: "Including results for “yours”"
- assertVisible: ".*This note is yours"
# An exact term says nothing: no line over rows it did not correct.
- eraseText: 5
- inputText: "yours"
- extendedWaitUntil:
    visible: ".*This note is yours"
    timeout: 5000
- assertNotVisible:
    id: "search-corrected"
# Nothing matches: the headline and the block.
- eraseText: 5
- inputText: "zzqxv"
- extendedWaitUntil:
    visible:
      id: "block-empty"
    timeout: 5000
- assertVisible: "No matches"
- assertNotVisible:
    id: "search-corrected"
- tapOn:
    id: "search/close"
