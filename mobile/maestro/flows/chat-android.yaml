# Chat on Android: the same band place and ids as `chat.yaml`; only the package differs (`dev.centraid`).
#
# THE POINT: Chat is a band place, not an app. It opens from Home's band, lists the member's chats
# over the composer, and the band's Home place returns the springboard. Ids are the room's own
# (`crates/screens/tests/rooms/chat_root.txt`). The model's download step, suggestions and proposed
# write cards are not rooms of this tree and are not driven here; neither is a reply, which needs a
# model (a DEBUG build with the chat script named in `crates/assist/src/testing.rs`).
#
# THE DEMO VAULT (`mobile/scripts/demo-vault.sh`), as `home.yaml`.
appId: dev.centraid
name: chat-android
---
- launchApp
- assertVisible:
    id: "tab/chat"
- tapOn:
    id: "tab/chat"
- assertVisible:
    id: "room-chat"
- assertVisible:
    id: "key/threads"
- assertVisible:
    id: "section/threads"
- assertVisible:
    id: "field/composer"
# Send waits for words.
- tapOn:
    id: "field/composer"
- inputText: "Who am I meeting?"
- assertVisible:
    id: "form/save"
# BACK TO HOME: the band's Home place returns the springboard.
- tapOn:
    id: "tab/home"
- assertVisible:
    id: "block-tiles"
