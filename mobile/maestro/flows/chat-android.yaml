# Chat on Android: the same band place and ids as `chat.yaml`; only the package differs (`dev.centraid`).
#
# Chat is an unavailable state today: no composer or Send action is drawn. This flow checks the
# empty-state block, opens the thread list, returns to Chat, and uses the band's Home tab. It never
# submits a fake message. Selectors are from the Rust room state (`chat_root.txt`).
#
# THE DEMO VAULT (`mobile/scripts/demo-vault.sh`), as `home.yaml`.
appId: dev.centraid
name: chat-android
---
- launchApp
- assertVisible:
    id: "tab/chat"
- tapOn:
    id: "tab/chat"
- assertVisible:
    id: "room-chat"
- assertVisible:
    id: "key/threads"
- assertVisible:
    id: "block-empty"
- assertVisible: "No chats yet"
- assertNotVisible:
    id: "field/composer"
- assertNotVisible:
    id: "form/save"
- tapOn:
    id: "key/threads"
- assertVisible:
    id: "room-chat/threads"
- assertVisible:
    id: "block-empty"
- tapOn:
    id: "room-back"
- assertVisible:
    id: "room-chat"
# The band's Home place returns the springboard.
- tapOn:
    id: "tab/home"
- assertVisible:
    id: "block-tiles"
