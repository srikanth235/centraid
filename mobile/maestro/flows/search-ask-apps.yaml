# A search that finds nothing offers the assistant: Home's no-match block carries the "Ask about
# “…”" row (`search/ask`), whose tap opens the Chat room; Locker's search never draws it, because a
# term there can itself be a secret.
#
# THE DEMO VAULT (`mobile/scripts/demo-vault.sh`), as `home-search.yaml`. Re-runnable: it relaunches
# between steps and leaves nothing behind. LOCKER may open on its own gate before it shows a search:
# the last step runs only once the band's search key is on screen.
#
# THE ASSISTANT NEEDS A MODEL for the question to be answered; opening the Chat room does not.
# Ids are Home's and Locker's room selector ids.
appId: dev.centraid.Centraid
name: search-ask-apps
---
- launchApp
- tapOn:
    id: "band/search"
- tapOn:
    id: "search"
- inputText: "zzqxv"
- extendedWaitUntil:
    visible:
      id: "search/ask"
    timeout: 5000
- assertVisible: "Ask about “zzqxv”"
- tapOn:
    id: "search/ask"
- extendedWaitUntil:
    visible:
      id: "room-chat"
    timeout: 5000
- assertNotVisible:
    id: "search"
# --- Locker: never ----------------------------------------------------------
- launchApp
- scrollUntilVisible:
    element:
      id: "tile/locker"
- tapOn:
    id: "tile/locker"
- assertNotVisible:
    id: "search/ask"
- runFlow:
    when:
      visible:
        id: "band/search"
    commands:
      - tapOn:
          id: "band/search"
      - inputText: "zzqxl"
      - extendedWaitUntil:
          visible: "Nothing matches.*"
          timeout: 5000
      - assertNotVisible:
          id: "search/ask"
      - assertNotVisible: "Ask about “zzqxl”"
