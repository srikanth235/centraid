# Health: Home -> Health -> More -> Follow Health, up to the tap.
#
# THE POINT OF THIS FLOW is the one thing a unit test cannot see: the follow row is where the member
# asks the phone's health store to be followed, and the room answers with a status line. The OS sheet
# itself is another process's view and is outside Maestro's reach on the real performer, which is not
# built yet, so the flow stops at the tap and asserts the status line ("Waiting for your phone." while
# the ask is out, or the refused state's sentence).
#
# BEFORE IT RUNS: a vault on the simulator (`mobile/scripts/demo-vault.sh`, or `onboarding.yaml`).
# Health must not be followed yet. Ids are the room's own (`first_open_health.txt`).
appId: dev.centraid.Centraid
name: health-connect
---
- launchApp
- assertVisible:
    id: "block-tiles"
- scrollUntilVisible:
    element:
      id: "tile/health"
    direction: DOWN
- tapOn:
    id: "tile/health"
- assertVisible:
    id: "room-health"
- assertVisible:
    id: "tab/summary"
# NOT FOLLOWED: the first-open card offers the connect, and More holds the follow row.
- runFlow:
    when:
      visible:
        id: "first/health/action"
    commands:
      - assertVisible: ".*Apple Health.*"
- tapOn:
    id: "band/more"
- assertVisible:
    id: "more/follow-health"
- tapOn:
    id: "more/follow-health"
# The tap's answer is the room's status line.
- extendedWaitUntil:
    visible:
      id: "room-status-line"
    timeout: 5000
