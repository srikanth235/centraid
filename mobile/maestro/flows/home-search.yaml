# Home's search (R-CHROME-6): one field over every app, grouped by
# app, a row opening in its own app.
#
# A VAULT-HOLDING INSTALL, as `home.yaml`: the starter note "This note is yours" (Notes is
# the one app with starter rows, 2026-11-17) is what "yours" finds, in Notes' group.
appId: dev.centraid.Centraid
name: home-search
---
- launchApp
- tapOn:
    id: "home-search-open"
- tapOn:
    id: "home-search-field"
- inputText: "yours"
# Grouped by app: the Notes group heads the one hit.
- extendedWaitUntil:
    visible:
      id: "home-search-group-notes"
    timeout: 5000
# The row is one spoken element, "Note, This note is yours" on Android, so match the title at its end.
- assertVisible: ".*This note is yours"
# A row opens in its own app (the tap is what makes the term a recent search); Done closes the note
# and lands on the results it left.
- tapOn: ".*This note is yours"
- assertNotVisible:
    id: "home-search-field"
- tapOn: "Done"
- assertVisible:
    id: "home-search-group-notes"
# The picked term comes back as a recent search once the field is emptied.
- tapOn:
    id: "home-search-clear"
- assertVisible:
    id: "home-search-recent-yours"
# The close key goes home; the picked term comes back as a recent search when search is opened again.
# OPEN FINDING (#1202): the recents live in the page's own state (`shell/search.rs`, `Search.recent`),
# so a search opened again starts with none and this step fails on both shells until the owner rules
# whether recents are the session's (R-CHROME-6, "this session's recent searches").
- tapOn:
    id: "home-search-close"
- assertVisible:
    id: "home-grid"
- tapOn:
    id: "home-search-open"
- assertVisible:
    id: "home-search-recent-yours"
- tapOn:
    id: "home-search-close"
