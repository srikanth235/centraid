# Home's search: one field over every app, grouped by app, a row opening in its own app.
#
# THE DEMO VAULT (`mobile/scripts/demo-vault.sh`): "yours" is a word of the starter note "This note is
# yours" in Notes. Ids are the room's own (`band/search` opens the field, `search` is the field,
# `search/close` the close key).
appId: dev.centraid.Centraid
name: home-search
---
- launchApp
- tapOn:
    id: "band/search"
- tapOn:
    id: "search"
- inputText: "yours"
# Grouped by app: the Notes group heads the hit.
- extendedWaitUntil:
    visible: "Notes"
    timeout: 5000
- assertVisible: ".*This note is yours"
# A term nothing matches draws the empty block and no correction line.
- eraseText: 5
- inputText: "zzqxv"
- extendedWaitUntil:
    visible:
      id: "block-empty"
    timeout: 5000
- assertNotVisible:
    id: "search-corrected"
# The close key goes home.
- tapOn:
    id: "search/close"
- assertVisible:
    id: "block-tiles"
