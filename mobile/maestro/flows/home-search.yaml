# Home's search (R-CHROME-6): one field over every app, grouped by
# app, a row opening in its own app.
#
# A VAULT-HOLDING INSTALL, as `home.yaml`: the starter note "This note is yours" (Notes is
# the one app with starter rows, 2026-11-17) is what "yours" finds, in Notes' group.
appId: dev.centraid.Centraid
name: home-search
---
- launchApp
- tapOn:
    id: "home-search-open"
- tapOn:
    id: "home-search-field"
- inputText: "yours"
# Grouped by app: the Notes group heads the one hit.
- extendedWaitUntil:
    visible:
      id: "home-search-group-notes"
    timeout: 5000
- assertVisible: "This note is yours"
# Cancel goes home; the picked term comes back as a recent search.
- tapOn:
    id: "home-search-cancel"
- assertVisible:
    id: "home-grid"
- tapOn:
    id: "home-search-open"
- assertVisible:
    id: "home-search-recent-yours"
- tapOn:
    id: "home-search-cancel"
