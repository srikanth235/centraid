# The Calendar room's views: Day opens as an hour grid, and the view choice reaches Week, Month,
# List and Year. The band holds Calendar and Calendars, with Home, search and More beside them.
#
# THE DEMO VAULT: a made vault is day zero and draws no grid, so this flow reads the seeded
# "Demo vault" (`mobile/scripts/demo-vault.sh`). It changes no row, so the vault is left as it was.
# Ids are the room's own selector ids (`crates/screens/tests/rooms/calendar_day.txt`).
appId: dev.centraid.Centraid
name: agenda-day
---
- launchApp
- tapOn:
    id: "tile/calendar"
- assertVisible:
    id: "room-calendar"
- assertVisible:
    id: "tab/calendar"
- assertVisible:
    id: "tab/calendars"
- assertVisible:
    id: "band/more"
- assertVisible:
    id: "band/search"
# Day is where the room opens: the grid, with its stepper and Today.
- assertVisible:
    id: "choice/view"
- assertVisible:
    id: "canvas-calendar-grid"
- assertVisible:
    id: "cal/today"
# Each view of the choice draws the grid again.
- tapOn:
    id: "choice/view-week"
- assertVisible:
    id: "canvas-calendar-grid"
- tapOn:
    id: "choice/view-month"
- assertVisible:
    id: "canvas-calendar-grid"
- tapOn:
    id: "choice/view-year"
- assertVisible:
    id: "canvas-calendar-grid"
- tapOn:
    id: "choice/view-list"
- assertVisible:
    id: "choice/view"
# The header's plus is a new event.
- assertVisible:
    id: "key/add"
- tapOn:
    id: "choice/view-day"
- assertVisible:
    id: "canvas-calendar-grid"
