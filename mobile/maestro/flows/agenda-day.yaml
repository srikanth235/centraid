# Agenda's band and the Calendar's views (#1128, #1173): Calendar · Reminders ·
# Invites · More on the band; Calendar opens on Day, an hour grid under the week
# strip, and its view menu reaches Week, Month, List and Year. A reminder due on a
# day is ticked where it stands, with the status line's Undo to take it back.
#
# A VAULT-HOLDING INSTALL, as `home.yaml`. Re-runnable: the check is undone
# before the flow ends, so the vault is left as it was. The check-off steps
# run only when a task row is drawn (the starters put the first one there; a
# vault whose tasks are all undated shows none, and the places are still
# asserted).
appId: dev.centraid.Centraid
name: agenda-day
---
- launchApp
- tapOn:
    id: "home-tile-calendar"
- assertVisible:
    id: "calendar-band-calendar"
- assertVisible:
    id: "calendar-band-invites"
- assertVisible:
    id: "calendar-band-more"
# Day is where the app opens: the week strip over the hour grid.
- assertVisible:
    id: "agenda-week-strip"
- assertVisible:
    id: "agenda-time-grid"
# A dated reminder on the day ticks where it stands (Reminders' own complete-task, so the row stays
# on its day, filled, with the status line's Undo), and its row opens it in Reminders.
# The layout key (Day and Week's header) lists the views: Month is a grid of whole weeks, Year
# twelve months, and List draws the same rows over the coming days. The month chip goes back to
# the Month; Month, Year and List keep the view menu.
- assertVisible:
    id: "agenda-month-chip"
- tapOn:
    id: "agenda-month-chip"
- assertVisible:
    id: "agenda-month-grid"
- tapOn:
    id: "agenda-view-menu"
- tapOn:
    id: "agenda-view-day"
- tapOn:
    id: "agenda-layout-key"
- tapOn:
    id: "agenda-view-month"
- assertVisible:
    id: "agenda-month-grid"
- tapOn:
    id: "agenda-view-menu"
- tapOn:
    id: "agenda-view-year"
- assertVisible:
    id: "agenda-year-grid"
- tapOn:
    id: "agenda-view-menu"
- tapOn:
    id: "agenda-view-list"
- assertVisible:
    id: "agenda-list|kit-empty"
# The Plus differs per place: here it is a new event.
- assertVisible:
    id: "agenda-new-event"
- tapOn:
    id: "agenda-view-menu"
- tapOn:
    id: "agenda-view-day"
