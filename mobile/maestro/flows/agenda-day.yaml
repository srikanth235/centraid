# Agenda's band and the Calendar's views (#1128, #1173): Calendar · Reminders ·
# Invites · More on the band; Calendar opens on Day, an hour grid under the week
# strip, and its view menu reaches Week, Month, List and Year. A task due on a
# day is checked off where it stands, with the status line's Undo to take it
# back.
#
# A VAULT-HOLDING INSTALL, as `home.yaml`. Re-runnable: the check is undone
# before the flow ends, so the vault is left as it was. The check-off steps
# run only when a task row is drawn (the starters put the first one there; a
# vault whose tasks are all undated shows none, and the places are still
# asserted).
appId: dev.centraid.Centraid
name: agenda-day
---
- launchApp
- tapOn:
    id: "home-tile-agenda"
- assertVisible:
    id: "agenda-band-calendar"
- assertVisible:
    id: "agenda-band-reminders"
- assertVisible:
    id: "agenda-band-invites"
- assertVisible:
    id: "agenda-band-more"
# Day is where the app opens: the week strip over the hour grid.
- assertVisible:
    id: "agenda-week-strip"
- assertVisible:
    id: "agenda-time-grid"
# A dated task is checked off in place: the row stays on Day, the status line
# says so and offers Undo, and Undo puts it back.
- runFlow:
    when:
      visible:
        id: "agenda-task-row-check-.*"
    commands:
      - tapOn:
          id: "agenda-task-row-check-.*"
      - extendedWaitUntil:
          visible:
            id: "agenda-status-action"
          timeout: 5000
      - assertVisible: "Task done"
      - tapOn:
          id: "agenda-status-action"
# The view menu: Month is a grid of whole weeks, Year twelve months, and
# List draws the same rows over the coming days.
- tapOn:
    id: "agenda-view-menu"
- tapOn:
    id: "agenda-view-month"
- assertVisible:
    id: "agenda-month-grid"
- tapOn:
    id: "agenda-view-menu"
- tapOn:
    id: "agenda-view-year"
- assertVisible:
    id: "agenda-year-grid"
- tapOn:
    id: "agenda-view-menu"
- tapOn:
    id: "agenda-view-list"
- assertVisible:
    id: "agenda-list|kit-empty"
# The Plus differs per place: here it is a new event.
- assertVisible:
    id: "agenda-new-event"
- tapOn:
    id: "agenda-view-menu"
- tapOn:
    id: "agenda-view-day"
