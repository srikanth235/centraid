# XcodeGen (#1020, D-1020-E1; the issue's Tooling coverage).
#
# THE `.xcodeproj` IS NOT COMMITTED — `mobile/.gitignore` excludes it. That is
# the same rule v0 broke by committing `apps/mobile/android` and `apps/mobile/ios`
# as `expo prebuild` outputs, which CI then had to REGENERATE before every
# release build "so the release builds what the inputs say rather than what the
# index happens to carry" (`.github/workflows/lane-release-mobile.yml`). A
# generated project that is also committed has two sources of truth and a
# regeneration step to reconcile them; one source and one generator has neither.
#
#   brew install xcodegen && cd mobile/iosApp && xcodegen generate
#
# `mobile/README.md` carries that command and the version to install.

name: Centraid
options:
  bundleIdPrefix: dev.centraid
  # READ FROM THE ONE FILE. XcodeGen resolves `${…}` from the environment, and
  # the hand-off command exports it from `mobile/ios-deployment-target` so the
  # floor is never typed twice.
  deploymentTarget:
    iOS: ${CENTRAID_IOS_DEPLOYMENT_TARGET}

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # THE DIGEST THIS BUILD EXPECTS OF THE CORE (#1020 Artifacts). Stamped by
    # `lane-prebuilt-core.yml`; `dev` in a development build, which routes
    # `requireDigest` into its NOT-CHECKED branch and makes it say so.
    CENTRAID_CORE_DIGEST: ${CENTRAID_CORE_DIGEST:-dev}

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: 1.28.2

targets:
  Centraid:
    type: application
    platform: iOS
    settings:
      base:
        # THE MODULE IS `CentraidApp` IN BOTH BUILD SYSTEMS, AND IT WAS NOT.
        #
        # `Package.swift` names its library target `CentraidApp`, so every file in
        # `Tests/` says `@testable import CentraidApp`. XcodeGen's target is called
        # `Centraid`, and a Swift module is named after its target unless told
        # otherwise — so under Xcode those same three test files imported a module
        # that did not exist. Two build systems over ONE `Tests/` directory, each
        # with its own idea of what the app is called, is the two-sources problem
        # this file's header argues against, one level down.
        #
        # ON THIS TARGET AND NOT IN `settings.base`: the base block reaches
        # EVERY target, so stating it there renamed the test bundle's module
        # to `CentraidApp` as well and two targets raced to write one
        # `CentraidApp.swiftmodule` — "Multiple commands produce", four
        # times over.
        PRODUCT_MODULE_NAME: CentraidApp
    sources:
      - path: Sources
      - path: Design
      # THE FACES, AS A BUILD PHASE — AND `resources:` IS NOT AN XCODEGEN KEY.
      #
      # This target carried `resources: - path: Resources` for its whole life
      # and it did NOTHING: xcodegen has no `resources` key on a target, so the
      # block was parsed as nothing and silently dropped. It looked correct, and
      # it read correct, and no file under `Resources` was ever copied into the
      # bundle — which went unnoticed only because the two files in there,
      # `Info.plist` and `Centraid.entitlements`, reach the build through the
      # `info:` and `entitlements:` keys below instead. The first thing that
      # needed a real resource was the font, and it arrived in a bundle with no
      # resource phase at all: `UIFont(name:)` returned nil and
      # `CentraidTypeModifier` died on the first label.
      #
      # A source entry with `buildPhase: resources` is how xcodegen actually
      # spells it. `Resources/Fonts` and not `Resources`, so the plist and the
      # entitlements are not ALSO copied in as loose resources beside their
      # generated selves.
      - path: Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: SwiftProtobuf
      # THE SHARED FRAMEWORK. Dynamic in debug and static in release, which the
      # Gradle side decides (`mobile/shared/build.gradle.kts`); from Xcode's
      # point of view it is one XCFramework either way.
      - framework: ../shared/build/XCFrameworks/debug/CentraidShared.xcframework
        embed: true
    # WITHOUT THIS THE KEYCHAIN IS DEAD AND PAIRING CANNOT PERSIST (#1025).
    #
    # `IosSecureStore` is where this device's endpoint secret lives, and every
    # `SecItem*` call from an app with NO entitlements fails `-34018` ("client
    # has neither application-identifier nor keychain-access-groups
    # entitlements"). The store then reads nothing and writes nothing, so the
    # minted secret is lost the moment the pairing core closes: the next dial
    # presents a key the gateway never enrolled, the gateway logs "an unenrolled
    # peer did not pair", and the phone renders "this app and that gateway are
    # too far apart in version to talk" — the exact sentence D-1025-S7-13 exists
    # to prevent, arrived at from the shell rather than the core.
    #
    # A device build got the entitlement from its provisioning profile and hid
    # this; a simulator build signed ad-hoc has no profile, so nothing supplied
    # it and no local simulator run could ever prove pairing survives a close.
    # `$(AppIdentifierPrefix)` is the team prefix on a provisioned build and
    # empty on an ad-hoc one, which is what makes one declaration serve both.
    entitlements:
      path: Resources/Centraid.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
    # `Resources/Info.plist` IS XCODEGEN'S OUTPUT, NOT A SOURCE FILE (#1020).
    #
    # The keys below are the source; `xcodegen generate` writes the plist from
    # them and overwrites whatever is there. The committed copy is kept so a
    # reader can see the result without running the generator — and the first
    # real run of the hand-off command showed it had drifted from what the
    # generator actually emits (sorted keys, the `$(...)` bundle keys, and no
    # XML comment, which xcodegen cannot preserve). This note lives here
    # because this file survives regeneration and the plist does not.
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Centraid
        # WITHOUT THIS THE APP RUNS LETTERBOXED, AND EVERY SCREENSHOT LIES.
        #
        # An iOS app with neither a launch storyboard nor `UILaunchScreen` is
        # treated as pre-modern and run at a legacy screen size, scaled up and
        # centred inside black bars — which is how wave A's first Home renders
        # were taken, with the page ground stopping short of the notch and every
        # tile drawn about half again its real size. An empty dictionary is the
        # whole declaration: the launch screen is the app's own background, and
        # nothing else belongs on it.
        UILaunchScreen: {}
        # THE FACE, DECLARED. Copying a .ttf into the bundle registers NOTHING:
        # iOS only loads an app-supplied font whose filename is listed here, and
        # `UIFont(name:size:)` for an unlisted face returns nil — silently. That
        # silence is the whole reason "sans" meant SF Pro for this project's
        # entire life, so `CentraidTypeModifier` now fails loudly instead, and
        # `FontRegistrationTests` asserts both names resolve.
        #
        # The files are copied into `Resources/Fonts` by
        # `contracts/tools/export-native-theme.ts` from `packages/design/fonts`,
        # the one source, and the emitted `centraidFontFiles` in
        # `Design/Theme.swift` is this list's other half — they must agree.
        #
        # `InstrumentSans_470Book.ttf` IS THE 400 REGISTER'S FACE HERE, and is
        # not a third weight: the ramp still says 400, the file is a derived
        # instance at `usWeightClass` 470, and `docs/decisions.md` says why a
        # touch surface needs it where a desktop pane does not.
        UIAppFonts:
          - InstrumentSans_470Book.ttf
          - InstrumentSans-SemiBold.ttf
        # BGTaskScheduler does NOT refuse an undeclared identifier politely: it
        # raises an NSInternalInconsistencyException on `register` and on
        # `submit`, and the app TERMINATES. This file is the SOURCE — the
        # committed `Resources/Info.plist` is xcodegen's output of it — so an
        # identifier that is in the plist and not here ships as not there at all,
        # which is what `dev.centraid.upload-pass` did: the plist named it, this
        # array did not, and the first `submitTaskRequest` on a generated build
        # would have killed the app on launch.
        #
        # BOTH IDENTIFIERS, and they are `IosBackgroundTasks.PERMITTED_IDENTIFIERS`
        # in `mobile/shared/src/iosMain/.../PlatformServices.ios.kt`. One fact in
        # three files, and `BackgroundIdentifierSpec` is what compares them.
        BGTaskSchedulerPermittedIdentifiers:
          - dev.centraid.sync-pass
          - dev.centraid.upload-pass
        UIBackgroundModes:
          - fetch
          - processing
        # WHY CENTRAID ASKS. The camera-roll backup asks; the Photos GRID does
        # not — it reads the vault. Two planes, and the string says which one is
        # asking.
        NSPhotoLibraryUsageDescription: Centraid backs up your camera roll into your own vault.
        # iCloud is EXCLUDED from the replica directory in code; this is the
        # declaration that goes with it (`docs/mobile-offline.md:240-247`).
        ITSAppUsesNonExemptEncryption: false

  CentraidTests:
    type: bundle.unit-test
    platform: iOS
    # A TEST BUNDLE NEEDS AN `Info.plist` TOO, AND NOTHING HERE SUPPLIED ONE.
    #
    # The app target gets its plist from the `info:` key above; this target had
    # neither that nor `GENERATE_INFOPLIST_FILE`, so `xcodebuild
    # build-for-testing` refused the bundle outright — "does not contain an
    # Info.plist, and GENERATE_INFOPLIST_FILE is not enabled". Every test under
    # `Tests/` has therefore never been COMPILED, let alone run:
    # `ScreenFixtureTests` was written in wave A and `FontRegistrationTests`
    # with the faces, and both were green in the only sense that nothing ever
    # asked them a question.
    #
    # `GENERATE_INFOPLIST_FILE` and not an `info:` block, because a test bundle's
    # plist carries nothing this repo chooses — no launch screen, no background
    # identifiers, no usage strings. Xcode's generated one is the whole truth,
    # and a committed copy would be a second source for a file with no content.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests
    dependencies:
      - target: Centraid
