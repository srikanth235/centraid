org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# A DEPRECATION IS A RED (D-1020-E0-1, owner instruction 2026-09-12).
#
# `fail` and not `all`: a warning nobody's gate reads is a warning that stays
# for two Gradle majors and then becomes a build that does not run. The cost is
# that a Gradle or plugin upgrade reds here first, which is the point.
org.gradle.warning.mode=fail

# The Kotlin plugin's own hint that a target is declared on a host that cannot
# link it. The iOS targets are declared here and unbuildable on Linux; this
# keeps that a message rather than a failure, and `mobile/README.md` names the
# machine that can build them.
kotlin.native.ignoreDisabledTargets=true

# THE iOS KLIBS ARE NOT CROSS-COMPILED, AND THE CINTEROP IS COMMONIZED.
#
# `iosMain` needs commonization to see `:core`'s one `centraid` klib across the
# three iOS targets, so that stays ON — it is what makes the iOS actual a single
# file rather than three. What is OFF is cross-compiling the klibs: processing a
# cinterop needs an Apple native toolchain, and with cross-compilation left on a
# Linux `:core:compileKotlinJvm` fails with "Cross Compilation with Cinterop Not
# Supported" rather than simply not building iOS. So the iOS klibs are built on
# the machine that can build them, and `mobile/README.md`'s iOS hand-off passes
# `-Pkotlin.native.enableKlibsCrossCompilation=true`.
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.enableKlibsCrossCompilation=false
