# One version catalogue for the mobile tree (#1020, D-1020-E1).
#
# Every version the KMP build resolves is here, including the ones only a
# machine with an Android SDK or an Xcode can use, so `mobile/README.md`'s
# owner hand-offs name a version rather than "whatever is current".

[versions]
# CURRENT STABLE, NOT WHAT THE CONTAINER HAPPENED TO HAVE (D-1020-E0-1).
# The wrapper is Gradle 9.7.1 and the build runs with
# `org.gradle.warning.mode=fail`, so a deprecated Gradle feature is a red
# rather than a line in the log.
kotlin = "2.4.20"
coroutines = "1.11.0"
# `com.android.kotlin.multiplatform.library` — AGP 9's KMP library plugin.
# The newest version with no alpha/beta/rc suffix in Google's maven metadata.
# DECLARED and resolved only when `-Pcentraid.android=true`.
agp = "9.4.0"
wire = "7.0.1"
kotest = "6.2.5"
turbine = "1.2.1"
kover = "0.9.9"
konsist = "0.17.3"
jna = "5.19.1"
# Android-only, unresolvable here.
androidx-activity-compose = "1.12.0"
androidx-compose-bom = "2025.10.01"
androidx-core = "1.17.0"
androidx-lifecycle = "2.9.4"
androidx-security-crypto = "1.1.0"
androidx-work = "2.10.5"
# THE LIGHTBOX'S VIDEO PLAYER (#1029 photos port): ExoPlayer for decode and
# the `PlayerView` surface only — the transport is the app's own controls, so
# `media3-ui`'s controller is never shown.
androidx-media3 = "1.11.1"
# BLOCK STORE, AND THE ADAPTER THAT MAKES ITS `Task` AWAITABLE (#1029 §5, W5B-3).
#
# The seed is the ONE secret allowed to follow a member to their next phone, and
# on Android the only thing that carries it is Block Store. It is Play Services,
# which is a real cost — a device without Play Services gets
# `SyncedSecrets.UNKNOWN_SENTENCE` and the written phrase, which is the path
# Android members are on anyway (Block Store restores only in the device-setup
# flow). Confined to `:shared`'s androidMain, behind `androidEnabled`.
gms-blockstore = "16.4.0"
roborazzi = "1.53.0"
robolectric = "4.16"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
gms-blockstore = { module = "com.google.android.gms:play-services-auth-blockstore", version.ref = "gms-blockstore" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
# `libjnidispatch.so` for desktop ABIs only; the AAR carries the Android ones
# and is the only way the native bridge loads on a device. Without it the app
# runs, the screen draws, and the first `centraid_open` fails with
# `dlopen failed: library "libjnidispatch.so" not found` — which is what the
# first emulator run of a wired Home did.

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# The Compose BOM stopped bringing the icon set in transitively; the three
# screens that use `Icons.Filled.*` need it named (#1020, wave A).
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
# The Keystore-backed `EncryptedSharedPreferences` behind `AndroidSecureStore`.
# 1.1.0 is the first STABLE release of the line; 1.0.0 is the one that pins
# Tink 1.5 and the alphas in between were never a thing to ship a credential on.
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security-crypto" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "androidx-media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "androidx-media3" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
# Gated: see the `agp` note above.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
