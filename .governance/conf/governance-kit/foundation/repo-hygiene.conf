# Your overlay for the `repo-hygiene` directive.
#
# This file is YOURS. `governance pack update`, `reset`, and `kit update` never
# touch it — your edits are sacred. It starts empty: with nothing below, the
# directive runs on its pack-owned defaults. Delete this file to do the same.
#
# The live defaults AND their documentation (every knob, rule mode, and worked
# example for this directive) are in the pack-owned defaults.conf, refreshed on
# every `governance pack update`:
#
#   .governance/packs/governance-kit/foundation/directives/repo-hygiene/defaults.conf
#
# Syntax — your lines layer over those defaults:
#
#   KEY=value     override a scalar setting (env GOVERNANCE_<KEY> still wins)
#   <rule>        a bare line ADDS a rule/item to a list-valued directive
#   !<rule>       drop one of the pack-owned default rules (gitignore-style)
#
# Blank lines and `#` comments are ignored. See the defaults.conf linked above
# for this directive's specific knobs, rule syntax, and examples.

# ── #615 ─────────────────────────────────────────────────────────────────────
# Recalibrated 500 → 625 after #596 ("adopt oxlint rule families C-F") reflowed
# 2627 files. That commit changed no behaviour but inflated line counts by 12.9%
# in aggregate (2420 source files: 474,010 → 535,164 lines), pushing 65 files
# past the old limit — every one of them at or under 500 beforehand, so none was
# a god-file the directive had previously tolerated.
#
# 625 is derived, not chosen: the worst observed per-file inflation is 1.25×
# (packages/server/src/routes/connections-routes.test.ts, 464 → 580), so
# 500 × 1.25 reproduces the pre-#596 violation set exactly — the same files pass
# and the same files fail. This restores the directive's original strictness
# under the new formatting rather than relaxing it.
#
# If a future formatter change moves line counts again, redo that arithmetic
# rather than nudging this number: the limit is only meaningful relative to the
# formatting it was measured against.
FILE_SIZE_LIMIT=625

# ── #860 ─────────────────────────────────────────────────────────────────────
# The default `vendor/**` glob is repo-root-relative, so it never matches the
# vendored three.js bundle under explorer/js/vendor/. Widen it to any-depth so
# genuinely vendored content anywhere in the tree is excluded from the
# line-count ceiling (minified library code is not a source god-file).
EXCLUDE_PATTERNS+=**/vendor/**
