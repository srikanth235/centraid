# Your overlay for the `managed-tree-integrity` directive.
#
# This file is YOURS. `governance pack update`, `reset`, and `kit update` never
# touch it — your edits are sacred. It starts empty: with nothing below, the
# directive runs on its pack-owned defaults. Delete this file to do the same.
#
# The live defaults AND their documentation (every knob, rule mode, and worked
# example for this directive) are in the pack-owned defaults.conf, refreshed on
# every `governance pack update`:
#
#   .governance/packs/governance-kit/foundation/directives/managed-tree-integrity/defaults.conf
#
# Syntax — your lines layer over those defaults:
#
#   KEY=value     override a scalar setting (env GOVERNANCE_<KEY> still wins)
#   <rule>        a bare line ADDS a rule/item to a list-valued directive
#   !<rule>       drop one of the pack-owned default rules (gitignore-style)
#
# Blank lines and `#` comments are ignored. See the defaults.conf linked above
# for this directive's specific knobs, rule syntax, and examples.

# The governance CI workflow carries a repo-owned job-level `if:` that skips the
