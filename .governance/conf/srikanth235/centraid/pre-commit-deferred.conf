# Directives deferred from rung 0 (pre-commit) to rung 1 (pre-push) — #915.
#
# One bare directive id per line. `.githooks/pre-commit` skips these;
# `.githooks/pre-push` runs exactly these before `check:push`. `.governance/run.sh`
# is untouched, so CI still runs all 22 directives on every PR and the enforcing
# copy never moved — only the local rung did.
#
# Add an id here only when the directive is repo-wide BY CONSTRUCTION (it cannot
# be scoped to the staged set) and its cost is a material share of the 5 s rung-0
# budget. Anything scopable belongs at rung 0, scoped.

# 51.2 s measured on this tree: `git grep` + `git ls-files` across every tracked
# file for merge markers, oversized files, build artefacts and debug statements.
# Nothing it looks for is knowable from the staged set alone.

# 35.1 s measured: re-reads the whole receipts corpus for the 1:1 issue binding,
# then unions the staged additions with the merge-base→HEAD range. At pre-push
# that range is the whole push, so the audit is if anything wider than it was at
# commit time.

# Empty since #1005: the four vendored directives that were repo-wide by
# construction are now rules under `.governance/law/`, which the `law` directive
# runs at pre-commit behind the hook door. Nothing in `.githooks/` reads this
# file under governance-kit 0.15.0 anyway — the hooks dispatch on the `hook:`
# field alone — so the deferral it described had already stopped operating.
