# handler-uses-ctx-primitives — handlers must use ctx.* primitives, not direct provider SDKs.
category: Correctness
recommended: true
summary: |
  Centraid handlers (queries/*.js and actions/*.js) must not import provider
  SDKs directly (`@anthropic-ai/sdk`, `openai`, `groq-sdk`, etc.). Inference
  flows through `ctx.delegate`; related deterministic capabilities use their
  own ctx primitives. Direct SDK use bypasses cost accounting, profile-based
  model routing, and breaks the gateway parity that centraid's
  "same code, three hosts" property depends on.
surface: repo-state
hook: pre-commit
