# coverage-scope-reachability — gated runtime scopes must stay visible to
# coverage floors / flow ownership (#532, #630, #725, #753, #781, #799, #1020).
category: Testing
recommended: true
summary: |
  Every top-level package under packages/*/src that contains non-test
  TypeScript source, plus every executable tree co-located OUTSIDE src/
  inside a package, must either (a) be covered by a
  tests/floors.json#coverage glob, (b) own at least one flow in the derived
  flow view (scripts/test-report/derive-flows.mjs), or (c) be listed in this
  directive's intentional-ungated allowlist. The non-src trees are discovered
  rather than enumerated (#781) and are scored as their own scope ids,
  because a floor on packages/<pkg>/src/** cannot instrument a sibling tree.
  Directory names that are never product runtime (scripts, tests, fixtures,
  build output) are skipped.

  Additionally, every tests/floors.json#coverage glob key must sit under
  packages/ and the vitest coverage include must still cover
  packages/*/src/** (and any floored non-src tree), so a floor cannot point
  at a scope the coverage tool never instruments. A tree that moves INTO
  src/ stops being a scope of its own and rides its package's src/** floor
  (#799). The v0 apps/* class and its named runtime roots were retired with
  the v0 TypeScript tree (#1020).
surface: repo-state
hook: pre-commit
