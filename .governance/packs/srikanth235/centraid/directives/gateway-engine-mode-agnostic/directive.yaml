# gateway-engine-mode-agnostic - a gateway rule may not branch on its deployment.
category: Architecture
recommended: true
summary: |
  Code under crates/gateway-core/ and crates/gateway-server/ may not branch
  on which deployment it is running in. The gateway is one protocol with two
  deployments (#1029 §3) - a paid hosted offering on Cloudflare and a
  standalone server anyone can self-host - and neither is the reference
  implementation: the protocol and its conformance suite are.

  What genuinely differs goes behind a port. Where bytes live is ByteStore;
  where state lives is StateStore; how a member is admitted is the adapter's
  own path; and which checksum evidence a store can produce is ChecksumMode,
  which is a property of the STORE the adapter was pointed at rather than of
  the adapter. A rule that knows which adapter it is inside is a rule that
  will differ between them, on a phone somebody is restoring.
surface: repo-state
hook: pre-commit
