# electron-builder for the desktop seat (#1020, D-1020-F7).
#
# Three rules, each asserted by `src/main/packaging.test.ts`:
#
#  1. `files:` lists every runtime asset EXPLICITLY, because a file that is not
#     listed is simply absent in the built app with no error — the symptom is an
#     empty menu-bar icon. The renderer's own `index.html`, `styles.css` and
#     bundle live under `dist/renderer/`, and `dist/**/*` covers them; tray
#     assets, when they exist, go on this list and not into a comment.
#  2. `extraResources` carries the `centraid` BINARY. The seat is a separate
#     process, not a dylib, which is why the mac entitlements below drop
#     `disable-library-validation` — nothing unsigned is loaded into this
#     process.
#  3. The protocol registration is HERE, in this file, and not in a second one:
#     a scheme split across two configs is silently lost by whoever rewrites
#     one of them. One file, one place.

appId: dev.centraid.desktop
productName: Centraid
copyright: Copyright © Centraid

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"

# THE `centraid://` REGISTRATION. The media door and the deep link are the same
# scheme; a build without this is a build whose `<video>` tags never load and
# whose OAuth return never arrives.
protocols:
  - name: Centraid
    schemes:
      - centraid

# The seat sidecar, per platform. Built by `.github/workflows/lane-release-
# desktop.yml`; when lane G's prebuilt-core artifacts land, the workflow
# downloads them instead of compiling, and this path does not change.
extraResources:
  - from: resources/centraid
    to: centraid

extraMetadata:
  main: dist/main.js

# ZIP for the updater, DMG for humans — v0's split, unchanged.
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # `identity: null` = unsigned scaffolding. CI flips this on enrolment; see
  # `docs/enrollment.md`.
  identity: null

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

linux:
  target:
    - AppImage
  category: Office
  # Version-less filename so a self-update overwrites in place.
  artifactName: Centraid-${arch}.${ext}

# Metadata only — CI always runs `--publish never` and softprops is the single
# publisher.
publish:
  provider: github
  releaseType: release
  owner: srikanth235
  repo: centraid
