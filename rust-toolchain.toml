# The workspace's single Rust toolchain pin. `flake.nix` reads it through
# `rust-bin.fromRustupToolchainFile`; CI's `.github/actions/setup` installs it
# with `rustup toolchain install`, including the components below.
[toolchain]
channel = "1.94.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
