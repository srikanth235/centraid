# The single version file for the v1 Rust tree (#1020). `flake.nix`'s dev shell
# reads it through `rust-bin.fromRustupToolchainFile`, and CI's
# `dtolnay/rust-toolchain` step installs from it, so the channel is stated once.
#
# NOT read by the v0 byte plane: `apps/web/iroh-wasm/rust-toolchain.toml` pins
# its own channel and the wasm32 target, and the root `Cargo.toml` excludes all
# three v0 crates from this workspace. Two trees, two pins, until wave 6.
[toolchain]
channel = "1.94.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
