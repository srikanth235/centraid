# buf configuration for the schema workspace (#1020, D-1020-C5).
#
# ONE MODULE: `centraid.core.v1`, under WIRE_JSON. core.v1 crosses exactly one
# boundary, the C ABI between a shell and the core it links, and the two ship in
# ONE artifact. The gateway a phone speaks to declares its own protocol
# (`crates/gateway/src/rules`, HTTPS and JSON) and does not depend on this
# package (#1080), so a deleted message reaches no install. What can still hurt
# is a stored or in-flight byte read under a new meaning, and that is exactly
# what WIRE_JSON refuses: a field's number, wire type or JSON name changing, and
# a deleted field, value or enum value whose NAME and NUMBER are not both
# reserved.
#
# `buf.gen.yaml` beside this file is DOCUMENTATION. The Rust codegen is
# `crates/api-proto/build.rs` (prost-build over protox), because there is no
# `protoc` binary on the build machines.
version: v2
modules:
  - path: crates/api-proto/proto
    lint:
      use:
        - STANDARD
    breaking:
      use:
        - WIRE_JSON
