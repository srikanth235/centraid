# A document page is content, so it and everything inside it stay light: a
# white `background`, at least `min_height` px tall, with a radius no larger
# than `max_radius` px.
[mockups.dark.paper]
background = "#FFFFFF"
min_height = 100
max_radius = 8

# An iOS switch thumb stays white: an absolutely positioned `size` px circle.
[mockups.dark.knob]
background = "#FFFFFF"
size = 26

# An app tile keeps its ink fill: a square, centred flex box holding a white
# glyph.
[mockups.dark.tile]
background = "#1C1B19"

# Translucent white (glass) becomes translucent `to`, never less opaque than
# `min_alpha`.
[mockups.dark.glass]
from = [255, 255, 255]
to = [44, 42, 39]
min_alpha = "0.72"

# Black shadows and scrims are never lighter than `min_alpha`.
[mockups.dark.shade]
min_alpha = "0.5"

# The Centraid brand icon swaps its white for the dark ground. The 120-wide
# app-icon tile (`tile_view_box`) also keeps its quarter colours and drops its
# hairline.
[mockups.dark.icon]
white = "#FFFFFF"
ground = "#1C1B19"
tile_view_box = "0 0 120 120"
# ---------------------------------------------------------------------------
# 3. The public sites (#1173)
# ---------------------------------------------------------------------------
#
# `cargo xtask design` lowers the product's tokens onto `centraid-tokens.css`,
# the one stylesheet the landing page and the docs site share. Most of that
# sheet is already above: the colour roles are `[native.colors.*]`, spacing and
# radii are `[native.spacing]` and `[native.radii]`, the touch type scale is
# `[native.type.*]`. This section is only what the sites need and the shells do
# not: the desktop (fine-pointer) overrides, the page-scale values, the font
# subsets, and a handful of colours the native roles do not carry. The order of
# the custom properties is the generator's (design_site.rs), not this file's.

[site.fonts]
family = "Instrument Sans"
weights = [400, 600]
# One entry per subset, in the order the faces are written. `unicode_range`
# is the browser's cue to fetch the subset only when a glyph needs it.
subsets = [
  { name = "latin", unicode_range = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD" },
  { name = "latin-ext", unicode_range = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF" },
]

# Fixed values, in the order they are written: after the radii and spacing steps
# (head), after the type scale (tail).
[site.root]
head = [
  [
    "--sp-gutter",
    "2px",
  ],
  [
    "--sp-hair",
    "1px",
  ],
  [
    "--sp-chip",
    "3px",
  ],
  [
    "--ease",
    "cubic-bezier(0.3, 0, 0.4, 1)",
  ],
  [
    "--ease-entry",
    "cubic-bezier(0.2, 0.7, 0.2, 1)",
  ],
  [
    "--target-min",
    "44px",
  ],
  [
    "--o-disabled",
    "0.45",
  ],
  [
    "--dur-1",
    "140ms",
  ],
  [
    "--dur-2",
    "280ms",
  ],
  [
    "--h-control",
    "34px",
  ],
  [
    "--h-row",
    "44px",
  ],
  [
    "--h-segmented",
    "28px",
  ],
  [
    "--w-stem",
    "240px",
  ],
  [
    "--w-key-col",
    "110px",
  ],
  [
    "--page-margin",
    "18px",
  ],
  [
    "--density-row",
    "44px",
  ],
  [
    "--density-pad",
    "16px",
  ],
  [
    "--font-code",
    "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace",
  ],
  [
    "--font-sans",
    "'Instrument Sans', 'Helvetica Neue', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif",
  ],
]
tail = [
  [
    "--t-display-tracking",
    "-0.02em",
  ],
  [
    "--t-title-tracking",
    "-0.01em",
  ],
  [
    "--t-eyebrow-tracking",
    "0.06em",
  ],
  [
    "--t-eyebrow-transform",
    "uppercase",
  ],
  [
    "--t-mono-numeric",
    "tabular-nums",
  ],
  [
    "--t-mono-direction",
    "ltr",
  ],
  [
    "--t-mono-bidi",
    "isolate",
  ],
  [
    "--tile-row-badge-w",
    "116px",
  ],
  [
    "--tile-shelf-max",
    "1560px",
  ],
  [
    "--tile-shelf-pad-x",
    "56px",
  ],
  [
    "--tile-bg",
    "color-mix(in srgb, var(--text) 2.5%, transparent)",
  ],
  [
    "--tile-bg-hover",
    "color-mix(in srgb, var(--text) 5%, transparent)",
  ],
  [
    "--tile-gap",
    "11px",
  ],
  [
    "--tile-h",
    "248px",
  ],
  [
    "--tile-icon",
    "44px",
  ],
  [
    "--tile-icon-radius",
    "11.44px",
  ],
  [
    "--tile-pad",
    "15px 16px",
  ],
  [
    "--tile-radius",
    "12px",
  ],
]

# `@media (pointer: fine)`: a pointer can hit a smaller target and read a
# denser scale. The properties here replace the ones above.
[site.fine]
props = [
  [
    "--page-margin",
    "32px",
  ],
  [
    "--target-min",
    "34px",
  ],
  [
    "--w-key-col",
    "150px",
  ],
]

