# Content colours: list colours, photos and tints, document pages, the app
# icon, switch knobs. They keep their value in every role not listed above. A
# light colour that is in neither `colors` nor here is an error, so a new
# colour in a light screen forces a decision about its dark value.
keep = [
  "#1399B5", "#2E4F2A", "#2E6A60", "#2F5577", "#2F5A2B", "#2F6B4F",
  "#2F7D4F", "#35507A", "#3A3936", "#3A6FD8", "#3D5A80", "#3D5AA8",
  "#3D5E7A", "#3E6B36", "#468DE5", "#4A3F66", "#4A3F7A", "#4C7A3E",
  "#4E7A3E", "#4E9A8C", "#5A3A2A", "#5A8CB0", "#5E4A8E", "#5F8F4A",
  "#6B5A40", "#6E8DB5", "#7A6AB0", "#7FA3C0", "#7FA866", "#808C9A",
  "#8D8170", "#8E3B52", "#8F7A57", "#9A6A22", "#9DBF8A", "#9EC3D9",
  "#A08560", "#A39E95", "#A84A3A", "#A85A12", "#A8D0C8", "#AA71E3",
  "#B0602A", "#B08505", "#B9B2D8", "#B9D3A0", "#C2366B", "#C46A4A",
  "#C8473B", "#C9D6E8", "#CFC6B8", "#D462B2", "#D8CBA6",
  "#D9784E", "#D9A23A", "#D9C7A7", "#E0A060", "#E55D7E",
  "#E8A3C0", "#E9F5F6", "#F0B23E", "#F0B86A", "#F2A93B", "#F2C9A0",
  "#F2D57A", "#F3E8B8", "#F3EDE2",
]

# A document page is content, so it and everything inside it stay light: a
# white `background`, at least `min_height` px tall, with a radius no larger
# than `max_radius` px.
[mockups.dark.paper]
background = "#FFFFFF"
min_height = 100
max_radius = 8

# An iOS switch thumb stays white: an absolutely positioned `size` px circle.
[mockups.dark.knob]
background = "#FFFFFF"
size = 26

# An app tile keeps its ink fill: a square, centred flex box holding a white
# glyph.
[mockups.dark.tile]
background = "#1C1B19"

# Translucent white (glass) becomes translucent `to`, never less opaque than
# `min_alpha`.
[mockups.dark.glass]
from = [255, 255, 255]
to = [44, 42, 39]
min_alpha = "0.72"

# Black shadows and scrims are never lighter than `min_alpha`.
[mockups.dark.shade]
min_alpha = "0.5"

# The Centraid brand icon swaps its white for the dark ground. The 120-wide
# app-icon tile (`tile_view_box`) also keeps its quarter colours and drops its
# hairline.
[mockups.dark.icon]
white = "#FFFFFF"
ground = "#1C1B19"
tile_view_box = "0 0 120 120"
