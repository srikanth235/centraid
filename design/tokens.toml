  "#A08560", "#A39E95", "#A84A3A", "#A85A12", "#A8D0C8", "#AA71E3",
  "#B0602A", "#B08505", "#B9B2D8", "#B9D3A0", "#C2366B", "#C46A4A",
  "#C8473B", "#C9D6E8", "#CFC6B8", "#D462B2", "#D8CBA6",
  "#D9784E", "#D9A23A", "#D9C7A7", "#E0A060", "#E55D7E",
  "#E8A3C0", "#E9F5F6", "#F0B23E", "#F0B86A", "#F2A93B", "#F2C9A0",
  "#F2D57A", "#F3E8B8", "#F3EDE2",
]

# A document page is content, so it and everything inside it stay light: a
# white `background`, at least `min_height` px tall, with a radius no larger
# than `max_radius` px.
[mockups.dark.paper]
background = "#FFFFFF"
min_height = 100
max_radius = 8

# An iOS switch thumb stays white: an absolutely positioned `size` px circle.
[mockups.dark.knob]
background = "#FFFFFF"
size = 26

# An app tile keeps its ink fill: a square, centred flex box holding a white
# glyph.
[mockups.dark.tile]
background = "#1C1B19"

# Translucent white (glass) becomes translucent `to`, never less opaque than
# `min_alpha`.
[mockups.dark.glass]
from = [255, 255, 255]
to = [44, 42, 39]
min_alpha = "0.72"

# Black shadows and scrims are never lighter than `min_alpha`.
[mockups.dark.shade]
min_alpha = "0.5"

# The Centraid brand icon swaps its white for the dark ground. The 120-wide
# app-icon tile (`tile_view_box`) also keeps its quarter colours and drops its
# hairline.
[mockups.dark.icon]
white = "#FFFFFF"
ground = "#1C1B19"
tile_view_box = "0 0 120 120"
