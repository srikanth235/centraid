line_height = 19.0
weight = 600

[site.fine.type.labelOn]
font_size = 13.0
line_height = 19.0
weight = 600

[site.fine.type.small]
font_size = 13.0
line_height = 19.0
weight = 400

[site.fine.type.smallStrong]
