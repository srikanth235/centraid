"--c-rose-text" = "#d48da2"
"--c-slate-text" = "#7ea7dc"
"--c-teal-text" = "#58b4c4"
"--c-violet-text" = "#be92c8"

# The density tiers, comfortable first.
[[site.density]]
tier = "comfortable"
pad = 16
row = 44

[[site.density]]
tier = "compact"
pad = 12
row = 38

[[site.density]]
tier = "dense"
pad = 8
row = 34

# Page-scale values, in groups. `comment` is the CSS comment above the group
# (a line break in it is a line break in the sheet).
[[site.layer]]
comment = "Long-form measure. The reading role's contract is 66ch at the consumer;\nthese are that contract spelled once for both sites."
props = [["--measure-reading", "66ch"], ["--measure-lede", "52ch"]]

[[site.layer]]
comment = "Section rhythm. The spacing scale tops out at 32px because that is the\nlargest rhythm step INSIDE a product screen; a scrolling page stacks the\ntop rung rather than inventing a bigger one."
props = [
  [
    "--sp-band",
    "calc(var(--sp-6) * 2)",
  ],
  [
    "--sp-band-lg",
    "calc(var(--sp-6) * 3)",
  ],
  [
    "--sp-band-xl",
    "calc(var(--sp-6) * 4)",
  ],
]

[[site.layer]]
comment = "The marketing display step: the display ROLE, scaled. Same face, same\nweight, same tracking — only the size moves, and it moves as a multiple\nof the role's own published size token rather than as a second scale."
props = [
  [
    "--t-hero-size",
    "clamp(\n    calc(var(--t-display-size) * 1.35),\n    6vw,\n    calc(var(--t-display-size) * 2.25)\n  )",
  ],
  [
    "--t-chapter-size",
    "clamp(\n    calc(var(--t-display-size) * 1.15),\n    4.4vw,\n    calc(var(--t-display-size) * 1.6)\n  )",
  ],
]

