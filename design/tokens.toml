# design/tokens.toml: THE ONE SOURCE OF DESIGN VALUES (#1173).
#
# Values only, no logic. `cargo xtask design` reads this file (and
# `design/icons.toml`, `design/site/tokens.css` and `design/fonts/`) and writes
# every native design artifact from it:
#
#   mobile/iosApp/Design/{Theme,Catalog,Words,DesignScale}.swift
#   mobile/iosApp/Resources/Assets.xcassets/Colors/*.colorset
#   mobile/iosApp/Resources/Fonts/*.ttf
#   mobile/androidApp/src/main/kotlin/dev/centraid/android/design/{Tokens,Catalog,Words}.kt
#   mobile/androidApp/src/main/res/values/{colors,dimens}.xml
#   mobile/androidApp/src/main/res/values-night/colors.xml
#   mobile/androidApp/src/main/res/font/*.ttf
#   scripts/{docs-site,home-site}/public/assets/centraid-tokens.css and fonts/
#
# `cargo xtask design --check` regenerates into memory and fails on any file
# that differs; the gate's `design` step runs the same check. The model, the
# parser and the validation (every role in both schemes, hex well-formed, every
# app with its dark fill and dark text, contrast floors) are
# `crates/design/src/tokens.rs`; a value that fails a floor is a failing test.
#
# Two layers live here, on purpose:
#
#   1. THE REDESIGN (#1173): the values in `design/mockups/DesignRules.dc.html`.
#      Sections `surface`, `text`, `shell`, `app`, `state`, `list`, `type`,
#      `radius`. Dark fill and dark text pairs are read off that board.
#   2. THE LEGACY NATIVE LOWERING (`native.*`): the 55-role theme, the app
#      catalogue and the geometry the shells draw today, transcribed verbatim
#      so that regeneration changes no pixel. The Phase 4 screen PRs move the
#      shells onto layer 1 and then delete layer 2.

# ---------------------------------------------------------------------------
# 1. The redesign
# ---------------------------------------------------------------------------

# Surfaces. Two page colours (pages of cards, plain lists) and white cards.
# `line` is the 1px rule between rows inside a card; `border` is a card's edge.
[surface.light]
page = "#F4F2EE"
plain_page = "#FBFAF8"
card = "#FFFFFF"
line = "#EEEBE5"
border = "#E4E0D8"

# Dark is designed, not inverted: sheets sit one level up (sheet, sheet_card).
[surface.dark]
page = "#0E0D0C"
card = "#1F1E1C"
sheet = "#1A1918"
sheet_card = "#2B2927"
fill = "#2A2826"
line = "#2C2A27"
border = "#3A3733"

# Text. The light values are the ones the Design rules board draws with.
[text.light]
ink = "#1C1B19"
body = "#4A4741"
meta = "#6F6B64"

[text.dark]
ink = "#F2EFEA"
body = "#C9C4BA"
meta = "#A39E95"

# Colour has one job each. Every accent has three values: `light` (the
# accent on the light page, text and fill alike), `dark_fill` (a fill under
# white glyphs, 4.5:1 or more) and `dark_text` (text and icons on dark, lighter).
# The dark pairs are read off the Design rules board
# (`design/mockups/DesignRules.dc.html`, "Each accent gets two dark values").

# The shell's own colour: Welcome, Home, Chat, Backup.
[shell]
light = "#1F4A45"
dark_fill = "#2E7268"
dark_text = "#7FC4B8"

# The eight apps. `tile` is the bright colour on tiles and icons where it is
# not the accent (Notes: Apple Notes yellow, content, so it does not change in
# dark).
[app.agenda]
light = "#266FC4"
dark_fill = "#3077CD"
dark_text = "#569EF7"

[app.notes]
light = "#8C6802"
dark_fill = "#967002"
dark_text = "#BF9738"
tile = "#F5C431"

[app.people]
light = "#7638AD"
dark_fill = "#935BCB"
dark_text = "#BA82F5"

[app.docs]
light = "#087990"
dark_fill = "#01819B"
dark_text = "#30A9C6"

[app.money]
light = "#27388B"
dark_fill = "#536EDC"
dark_text = "#7C97F4"

[app.locker]
light = "#454E58"
dark_fill = "#6A7888"
dark_text = "#939DA8"

[app.health]
light = "#BB365C"
dark_fill = "#CB4669"
dark_text = "#F76E8E"

[app.photos]
light = "#A8398A"
dark_fill = "#BB4C9C"
dark_text = "#E573C3"

# States. In words and badges red, amber and green only ever mean a state.
[state.red]
light = "#C8392F"
dark_fill = "#CD483D"
dark_text = "#F27A6D"

[state.amber]
light = "#874300"
dark_fill = "#964C04"
dark_text = "#F2A64F"

[state.green]
light = "#2B7B51"
dark_fill = "#2F8556"
dark_text = "#62D092"

# One palette for lists, calendars and categories: the eight app hues, lighter.
# They reach 3:1 on the light page and on dark cards, so they do not change in
# dark. Dots, bars, tiles and big titles only; never small text.
[list]
blue = "#468DE5"
mustard = "#B08505"
violet = "#AA71E3"
petrol = "#1399B5"
indigo = "#6785F5"
graphite = "#808C9A"
raspberry = "#E55D7E"
orchid = "#D462B2"

# The four brand colours of the app mark (`design/mockups/QuartersIcon.dc.html`):
# a squared circle of four quarters around an open square heart. One family at
# even brightness, brighter than the in-app colours, which stay dark enough for
# text. Brand colours, not app keys: they draw the mark (the assistant's avatar
# in Chat, the app icon) and nothing else. They do not change in dark.
[brand]
teal = "#00AA98"
orange = "#F48E04"
blue = "#5698F8"
pink = "#F83F6E"

# Type scale, in points (sp on Android). `caps` means the text is drawn in upper case.
[type.title]
size = 34
weight = 700

[type.section]
size = 20
weight = 700

[type.row]
size = 16
weight = 400

[type.meta]
size = 13
weight = 400

[type.group]
size = 12
weight = 600
caps = true

[type.badge]
size = 11
weight = 700
caps = true

# Radii, in points. Only floating glass casts a shadow.
[radius]
card = 16

# ---------------------------------------------------------------------------
# 2. The legacy native lowering (what the shells draw today)
# ---------------------------------------------------------------------------

[native.faces]
# Which .ttf draws each ramp weight. The 400 key resolves to a 470 face on
# purpose: the phone's touch step makes a true 400 read thin. `design/fonts/`
# holds the files; the PostScript name is read from each file's `name` table.

sans = [
  { weight = 400, file = "InstrumentSans_470Book.ttf", android_resource = "instrument_sans_book" },
  { weight = 600, file = "InstrumentSans-SemiBold.ttf", android_resource = "instrument_sans_semibold" },
]

