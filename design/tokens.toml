# The boards' own colour roles (#1214). A board writes every colour as `var(--role)`;
# `cargo xtask design` writes the roles of this table and of the sections above into
# `design/mockups/tokens.css`: light on `:root`, dark on `[data-theme="dark"]`. Dark is
# designed here, never derived. A colour that is a photograph or a third-party mark has no
# role: its element carries `data-keep`.
[board]

# Glass: translucent white over a screen (a floating control, a bar). In dark it is the dark card, never less opaque than 0.72.
glass-sheer = { light = "rgba(255,255,255,0.5)", dark = "rgba(44,42,39,0.72)" }
glass-veil = { light = "rgba(255,255,255,0.6)", dark = "rgba(44,42,39,0.72)" }
glass-bar = { light = "rgba(255,255,255,0.72)", dark = "rgba(44,42,39,0.72)" }
glass-key = { light = "rgba(255,255,255,0.8)", dark = "rgba(44,42,39,0.8)" }
glass-card = { light = "rgba(255,255,255,0.85)", dark = "rgba(44,42,39,0.85)" }
glass-solid = { light = "rgba(255,255,255,0.9)", dark = "rgba(44,42,39,0.9)" }

# Scrims: black over a screen. Heavier in dark.
scrim-soft = { light = "rgba(0,0,0,0.12)", dark = "rgba(0,0,0,0.5)" }
scrim-dim = { light = "rgba(0,0,0,0.18)", dark = "rgba(0,0,0,0.5)" }
scrim-heavy = { light = "rgba(0,0,0,0.5)", dark = "rgba(0,0,0,0.5)" }

# Shadows: black under a card or a sheet. Heavier in dark, because a dark surface needs more to read.
shadow-sheet = { light = "rgba(0,0,0,0.10)", dark = "rgba(0,0,0,0.5)" }
shadow-flat = { light = "rgba(0,0,0,0.12)", dark = "rgba(0,0,0,0.12)" }
shadow-text = { light = "rgba(0,0,0,0.4)", dark = "rgba(0,0,0,0.5)" }
shadow-card = { light = "rgba(0,0,0,0.08)", dark = "rgba(0,0,0,0.5)" }

# Translucent inks and tints that keep their value.
shadow-deep = { light = "rgba(20,20,20,0.5)", dark = "rgba(20,20,20,0.5)" }
ink-wash = { light = "rgba(28,27,25,0.38)", dark = "rgba(28,27,25,0.38)" }
ink-wash-strong = { light = "rgba(28,27,25,0.42)", dark = "rgba(28,27,25,0.42)" }
rose-wash = { light = "rgba(187,54,92,0.08)", dark = "rgba(187,54,92,0.08)" }
page-glass = { light = "rgba(244,242,238,0.92)", dark = "rgba(244,242,238,0.92)" }

# Washes: a pale ground in light and its deep twin in dark (a chip, a tile, an avatar).
chip-ink = { light = "#1C1B19", dark = "#3A3733" }
chip-graphite = { light = "#4A4741", dark = "#3A3733" }
chip-slate = { light = "#6E6B66", dark = "#5F5B55" }
chip-stone = { light = "#8E8A84", dark = "#5F5B55" }
chip-sand = { light = "#D7D3CC", dark = "#3A3733" }
tint-sage = { light = "#D9E6DF", dark = "#263A30" }
