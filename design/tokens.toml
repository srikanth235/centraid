# Design tokens. `[mockups.dark]` is read by `cargo xtask design-dark`
# (crates/xtask/src/design_dark.rs), which writes every `XDark.dc.html` in
# design/mockups from the light `X.dc.html` (#1173). Never edit a dark screen.

[mockups.dark]
# Appended to the <title> of a dark screen.
title_suffix = " (dark)"

# One entry per light colour that changes. The dark value depends on the role
# the colour plays: `text` is CSS `color`; `ink` is SVG `fill`/`stroke` (the
# text value when absent); `fill` is `background*`, gradient stops and SVG
# `stop-color`; `line` is `border*` and `outline*`; `shadow` is `box-shadow`
# and `text-shadow`. A role left out keeps the light value.
colors = [
  { light = "#00AA98", ink = "#00F6DC" },
  { light = "#087990", text = "#30A9C6", fill = "#01819B" },
  { light = "#1C1B19", text = "#F2EFEA", fill = "#3A3733", line = "#F2EFEA" },
