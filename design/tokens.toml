# One palette for lists, calendars and categories: the eight app hues, lighter.
# They reach 3:1 on the light page and on dark cards, so they do not change in
# dark. Dots, bars, tiles and big titles only; never small text.
[list]
blue = "#468DE5"
mustard = "#B08505"
violet = "#AA71E3"
petrol = "#1399B5"
indigo = "#6785F5"
graphite = "#808C9A"
raspberry = "#E55D7E"
orchid = "#D462B2"

# The four brand colours of the app mark (`design/mockups/QuartersIcon.dc.html`):
# a squared circle of four quarters around an open square heart. One family at
# even brightness, brighter than the in-app colours, which stay dark enough for
# text. Brand colours, not app keys: they draw the mark (the assistant's avatar
# in Chat, the app icon) and nothing else. They do not change in dark.
[brand]
teal = "#00AA98"
orange = "#F48E04"
blue = "#5698F8"
pink = "#F83F6E"

# The app icon (`design/mockups/QuartersIcon.dc.html`): the tiles the mark sits
# on, and the two quiet variants. `cargo xtask design` draws every icon file from
# these and `[brand]` (design/icon/, the iOS AppIcon set, the Android adaptive
# icon). `light_edge` is the hairline round the white tile, drawn in the master
# SVG only (iOS and Android mask their own edge). `tinted_*` is iOS's tinted
# appearance, which the system recolours: ONE neutral grey for the mark (the system
# maps luminance to its tint, so a second step would only be recoloured oddly); the
# cuts between the quarters keep them apart. `light_tile`/`light_tile_bottom` and
# `dark_ground_top`/`dark_ground_bottom` are the two grounds of the layered iOS 26 icon
# (`AppIcon.icon`): the system adds the glass, rim and shadows, the artwork is only
# flat colour. The flat PNGs use `light_tile` and `dark_tile`. `themed_*` is Android's themed icon: one
# flat glyph colour, which the system repaints from the wallpaper; the board's
# colours stand in for the preview.
[icon]
light_tile = "#FFFFFF"
light_edge = "#E4E0D8"
light_tile_bottom = "#ECF0F8"
dark_tile = "#1C1B19"
dark_ground_top = "#2E3A63"
dark_ground_bottom = "#04060D"
tinted_tile = "#1B1B1B"
tinted_mark = "#D9D9D9"
themed_tile = "#DCE5EE"
themed_glyph = "#22374A"
# The mark's disc as a share of the iOS tile's width: 0.76 is an outer radius of 45.6
# on the 120 grid, today's proportions (inner edge and cuts included) scaled uniformly.
# It matches Apple's Watch icon, measured on the iOS 26 home screen: its artwork spans
# 76% of the tile tall (70% wide with the side button), a margin of about 12%. 91% and
# 82% left too little white gap once iOS masked the tile and added its glass rim. The
# masters and the three flat AppIcon PNGs (the pre-iOS-26 fallback) follow it, and so
# does the layered iOS 26 icon `AppIcon.icon`; Android's adaptive icon keeps its own
# rule, the 66dp safe zone.
ios_mark_share = 0.76

# Type scale, in points (sp on Android). `caps` means the text is drawn in upper case.
[type.title]
size = 34
weight = 700

# The hero title: the Locker item's and the Person's centred hero, one rung under the page title.
[type.hero]
size = 24
weight = 700

[type.section]
size = 20
weight = 700

[type.row]
size = 16
weight = 400

[type.meta]
size = 13
weight = 400

[type.group]
size = 12
weight = 600
caps = true

[type.badge]
size = 11
weight = 700
caps = true

# Radii, in points. Only floating glass casts a shadow.
[radius]
card = 16

