"--bg-wall" = "#060606"
"--device-wall" = "repeating-linear-gradient(0deg, transparent 0 23px, rgba(255,255,255,.022) 23px 24px), repeating-linear-gradient(90deg, transparent 0 23px, rgba(255,255,255,.022) 23px 24px), var(--bg-wall)"
"--glass-sheen" = "none"
"--c-amber-text" = "#d78f85"
"--c-forest-text" = "#7bb587"
"--c-indigo-text" = "#a39bda"
