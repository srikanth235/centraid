"--bg-wall" = "#F0EFED"
"--device-wall" = "repeating-linear-gradient(0deg, transparent 0 23px, rgba(20,20,20,.035) 23px 24px), repeating-linear-gradient(90deg, transparent 0 23px, rgba(20,20,20,.035) 23px 24px), linear-gradient(180deg, #EAE9E6 0%, #E1E0DC 100%)"
"--glass-sheen" = "none"
"--c-amber-text" = "#894a43"
"--c-forest-text" = "#346841"
"--c-indigo-text" = "#5f568d"
"--c-ochre-text" = "#7c5420"
"--c-olive-text" = "#5e5f20"
"--c-rose-text" = "#894a5f"
"--c-slate-text" = "#3a5e8b"
"--c-teal-text" = "#006774"
"--c-violet-text" = "#744e7d"

# Colours the native roles do not carry, dark scheme.
[site.dark]
"--bg-app" = "#060606"
