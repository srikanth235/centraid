<!DOCTYPE html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8">
<title>Photos viewer (dark)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css"></head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div data-screen-id="photos.lightbox" data-selector="photos.lightbox.details" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--ds-bg); font-family: Geist, system-ui, sans-serif; color: var(--ds-text);">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 8px;">
    <a href="PhotosLibraryDark.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--ds-lineStrong); background: var(--ds-glass); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="text-align: center;">
      <div style="font-size: 16px; font-weight: 600;">4 November 2026</div>
      <div style="font-size: 13px; color: var(--ds-textFaint);">07:48 · Cubbon Park</div>
    </div>
    <button aria-label="More" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--ds-lineStrong); background: var(--ds-glass); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--ds-text)" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </button>
  </div>

  <div role="img" aria-label="Morning walk before work" style="margin-top: 4px; height: 268px; background: linear-gradient(170deg, #B9D3A0 0%, #7FA866 35%, #5F8F4A 60%, #3E6B36 100%);"></div>

  <div style="padding: 14px 16px 0;">
    <div style="background: var(--ds-bgElev); border-radius: 16px; padding: 12px 14px;">
      <div style="font-size: 13px; color: var(--ds-textFaint);">Caption</div>
      <div style="font-size: 16px; margin-top: 2px;">Morning walk before work</div>
    </div>

    <div style="background: var(--ds-bgElev); border-radius: 16px; margin-top: 10px; overflow: hidden;">
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--ds-line);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ds-textFaint)" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18"></path></svg>
        <div style="flex-grow: 1;"><div style="font-size: 13px; color: var(--ds-textFaint);">Captured</div><div style="font-size: 15px;">4 November 2026 07:48 · Cubbon Park · UTC+05:30</div></div>
      </div>
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ds-textFaint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 011-1h4l2 2h8a1 1 0 011 1v12a1 1 0 01-1 1H5a1 1 0 01-1-1z"></path><circle cx="12" cy="13" r="3"></circle></svg>
        <div style="flex-grow: 1; font-size: 15px;">iPhone 16 Pro · 4032 × 3024 · 3.2 MB</div>
      </div>
    </div>

    <div style="background: var(--ds-bgElev); border-radius: 16px; margin-top: 10px; overflow: hidden;">
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--ds-line);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ds-photosText)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
        <div style="flex-grow: 1;"><div style="font-size: 13px; color: var(--ds-textFaint);">Place</div><div style="font-size: 15px;">Cubbon Park, Bengaluru</div></div>
        <span style="font-size: 15px; font-weight: 600; color: var(--ds-photosText);">Change</span>
      </div>
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--ds-line);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ds-textFaint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
        <div style="flex-grow: 1;"><div style="font-size: 13px; color: var(--ds-textFaint);">Albums</div><div style="font-size: 15px;">Walks · Bengaluru mornings</div></div>
      </div>
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ds-textFaint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><path d="M7.5 8h.01"></path></svg>
        <div style="flex-grow: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
          <span style="font-size: 13px; color: var(--ds-textSoft); background: var(--ds-bgSunken); border-radius: 12px; padding: 3px 10px;">park</span>
          <span style="font-size: 13px; color: var(--ds-textSoft); background: var(--ds-bgSunken); border-radius: 12px; padding: 3px 10px;">trees</span>
          <span style="font-size: 13px; color: var(--ds-textDisabled); border: 1px dashed var(--ds-lineStrong); border-radius: 12px; padding: 2px 10px;">Add a label</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 6px; margin: 10px 4px 0; font-size: 13px; color: var(--ds-textFaint);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ds-successText)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      The original is on this phone.
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 56px; border-radius: 28px; border: 1px solid var(--ds-glass); background: var(--ds-glass); box-shadow: 0 6px 20px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: space-around;">
    <button aria-label="Send a copy" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M5 12v8h14v-8"></path></svg>
    </button>
    <button aria-label="Favorite" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"></path></svg>
    </button>
    <button aria-label="Info" aria-pressed="true" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: var(--ds-bgSunken); display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-photosText)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg>
    </button>
    <button aria-label="Edit" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg>
    </button>
    <button aria-label="Archive" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"></rect><path d="M5 9v11h14V9M10 13h4"></path></svg>
    </button>
    <button aria-label="Trash" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>


</body></html>
