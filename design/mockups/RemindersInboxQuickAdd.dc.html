<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reminders Inbox and quick add</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}button,input{font:inherit;color:inherit}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--surface-plain-page);font-family:Geist,system-ui,sans-serif;color:var(--text-ink)">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:56px 20px 12px">
    <div><h1 style="margin:4px 0 0;font-size:34px;font-weight:700;color:var(--app-reminders)">Reminders</h1><div style="margin-top:5px;font-size:14px;color:var(--text-meta)">Inbox · 2 open</div></div>
    <button aria-label="Add reminder" style="width:44px;height:44px;border:1px solid var(--surface-border);border-radius:22px;background:var(--glass-card);font-size:24px">+</button>
  </div>
  <div style="margin:0 16px;padding:12px;background:var(--surface-card);border:1px solid var(--surface-border);border-radius:14px">
    <div style="font-size:13px;color:var(--text-meta);margin-bottom:7px">Quick add</div>
    <div style="display:flex;gap:8px;align-items:center"><div style="flex:1;padding:10px 12px;border-radius:10px;background:var(--surface-plain-page);color:var(--text-faint)">Pick up library books tomorrow</div><button style="border:0;border-radius:10px;padding:10px 14px;background:var(--app-reminders);color:var(--on-fill);font-weight:600">Review</button></div>
    <div style="font-size:12px;color:var(--text-meta);margin-top:8px">Title and date are clear. Check before adding.</div>
  </div>
  <div style="padding:20px 20px 0"><div style="font-size:15px;font-weight:600;color:var(--text-meta);padding:8px 0">Inbox</div>
    <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--surface-line);align-items:center"><span style="width:22px;height:22px;border-radius:11px;border:1.6px solid var(--app-reminders)"></span><div style="font-size:16px">Pick up library books</div></div>
    <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--surface-line);align-items:center"><span style="width:22px;height:22px;border-radius:11px;border:1.6px solid var(--app-reminders)"></span><div style="font-size:16px">Renew parking permit</div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals(){return{};} }
</script>
</body>
</html>
