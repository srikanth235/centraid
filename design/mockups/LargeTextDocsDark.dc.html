<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0E0D0C; font-family: Geist, system-ui, sans-serif; color: #F2EFEA;">

    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="width: 96px; height: 120px; border-radius: 8px; background: linear-gradient(160deg, #D9C7A7, #8F7A57); border: 1px solid #3A3733;"></div>
      <span style="font-size: 22px; text-align: center; line-height: 1.2;">Rent receipt Oct</span>
      <span style="font-size: 18px; color: #A39E95; text-align: center; line-height: 1.2;">27 Oct · 640 KB</span>

  </div>

      <span aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #F2EFEA; font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Recents</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #A39E95;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</span>
      </div>
