<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part: Choice (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div data-theme="dark" style="width: 390px; box-sizing: border-box; position: relative; background: var(--surface-page); font-family: Geist, system-ui, sans-serif; color: var(--text-ink); padding: 56px 0 28px;">
  <div style="padding: 0 16px 4px; font-size: 20px; font-weight: 700;">Choice</div>
  <div style="padding: 0 16px 14px; font-size: 13px; color: var(--text-meta); line-height: 1.4;">One or many options: segmented, menu, list or chips.</div>
  <div style="padding: 10px 16px 6px; font-size: 12px; font-weight: 600; color: var(--text-meta); letter-spacing: 0.4px;">SEGMENTED</div>
  <div>
    <!-- variant:segmented -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 20px 8px;">
      <button aria-label="View: Month" style="height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-card); display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600;">Month <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-meta)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <div style="display: flex; gap: 8px;"><button aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-card); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button><button aria-label="Next month" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-card); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></div>
    </div>
    <!-- /variant -->
  </div>
  <div style="padding: 10px 16px 6px; font-size: 12px; font-weight: 600; color: var(--text-meta); letter-spacing: 0.4px;">LIST</div>
  <div>
    <!-- variant:list -->
    <div style="background: var(--surface-card); border-radius: 16px; margin-top: 12px; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 54px;"><span data-slot="t0" style="font-size: 16px; flex-grow: 1;">Every</span><span data-slot="t1" style="height: 34px; min-width: 52px; padding: 0 12px; border-radius: 10px; background: var(--surface-line); font-size: 16px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;">2</span><span data-slot="t2" style="font-size: 16px; color: var(--text-meta);">weeks</span></div>
    <!-- /variant -->
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

</body>
</html>
