<!DOCTYPE html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8">
<title>Docs document viewer (dark)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css"></head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EDEAE5; font-family: Geist, system-ui, sans-serif; color: var(--ds-text);">
  <div style="display: flex; align-items: center; gap: 10px; padding: 56px 20px 8px;">
    <a href="DocsDark.dc.html" aria-label="Back to Recents" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid var(--ds-lineStrong); background: var(--ds-glass); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex-grow: 1; text-align: center;">
      <div style="font-size: 16px; font-weight: 600;">Passport scan.pdf</div>
      <div style="font-size: 12px; color: var(--ds-textFaint);">Docs › Taxes 2025 · page 1 of 2</div>
    </div>
    <button aria-label="More actions" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid var(--ds-lineStrong); background: var(--ds-glass); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--ds-text)" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </button>
  </div>

  <div style="margin: 8px 28px 0; height: 440px; background: var(--ds-bgElev); border-radius: 4px; box-shadow: 0 6px 24px rgba(0,0,0,0.12); padding: 26px 22px; box-sizing: border-box;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="height: 10px; width: 120px; background: var(--ds-text); border-radius: 2px;"></div>
      <div style="width: 28px; height: 28px; border-radius: 14px; border: 2px solid var(--ds-textFaint);"></div>
    </div>
    <div style="display: flex; gap: 14px; margin-top: 22px;">
      <div style="width: 78px; height: 96px; border-radius: 4px; background: linear-gradient(160deg, #CFC6B8, #8D8170);"></div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 4px;">
        <div style="height: 6px; width: 80%; background: #D7D3CC; border-radius: 2px;"></div>
        <div style="height: 6px; width: 60%; background: #D7D3CC; border-radius: 2px;"></div>
        <div style="height: 6px; width: 70%; background: #D7D3CC; border-radius: 2px;"></div>
        <div style="height: 6px; width: 50%; background: #D7D3CC; border-radius: 2px;"></div>
        <div style="height: 6px; width: 65%; background: #D7D3CC; border-radius: 2px;"></div>
      </div>
    </div>
    <div style="margin-top: 26px; display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 6px; width: 100%; background: var(--ds-bgSunken); border-radius: 2px;"></div>
      <div style="height: 6px; width: 92%; background: var(--ds-bgSunken); border-radius: 2px;"></div>
      <div style="height: 6px; width: 96%; background: var(--ds-bgSunken); border-radius: 2px;"></div>
      <div style="height: 14px; width: 100%; background: var(--ds-bg); border-radius: 2px; margin-top: 14px;"></div>
      <div style="height: 14px; width: 100%; background: var(--ds-bg); border-radius: 2px;"></div>
    </div>
  </div>

  <div style="margin: 16px 16px 0; background: var(--ds-bgElev); border-radius: 16px;">
    <div style="display: flex; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--ds-line); font-size: 14px;"><span>PDF · 2.1 MB</span><span style="color: var(--ds-textFaint);">Changed 28 Oct</span></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--ds-line); font-size: 14px;"><span style="flex-grow: 1;">Labels</span><span style="display: flex; align-items: center; gap: 4px; color: var(--ds-textFaint);"><span style="width: 8px; height: 8px; border-radius: 4px; background: var(--ds-listBlue);"></span>Taxes</span></div>
    <div style="display: flex; align-items: center; padding: 10px 14px; font-size: 14px;"><span style="flex-grow: 1;">Versions</span><span style="color: var(--ds-textFaint);">3 versions ›</span></div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 56px; border-radius: 28px; border: 1px solid var(--ds-glass); background: var(--ds-glass); box-shadow: 0 6px 20px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: space-around;">
    <button aria-label="Share" style="width: 48px; height: 48px; border: none; background: none; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-docsText)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4M5 11v9h14v-9"></path></svg></button>
    <button aria-label="Star" style="width: 48px; height: 48px; border: none; background: none; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"></path></svg></button>
    <button aria-label="Labels" style="width: 48px; height: 48px; border: none; background: none; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1.5"></circle></svg></button>
    <button aria-label="Move" style="width: 48px; height: 48px; border: none; background: none; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg></button>
    <button aria-label="Move to trash" style="width: 48px; height: 48px; border: none; background: none; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-dangerText)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>


</body></html>
