<!doctype html>
<html lang="en">
<head>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div data-theme="dark" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--surface-plain-page); font-family: Geist, system-ui, sans-serif; color: var(--text-ink);">
  <div style="display: flex; align-items: flex-start; justify-content: space-between; padding: 56px 20px 8px;">
    <h1 style="margin: 4px 0 0; flex: 1; min-width: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">Photos</h1>
    <div style="display: flex; gap: 8px;">
      <button aria-label="Show: All photos or Starred" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-card); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8z" stroke-linejoin="round"></path></svg>
      </button>
      <button aria-label="Select" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-card); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.6 2.6L16 9.5"></path></svg>
      </button>
    </div>
  </div>



  <h2 style="margin: 0 20px 4px; font-size: 20px; font-weight: 700;">November 2026</h2>
  <div style="margin: 0 20px; padding: 4px 0 6px; font-size: 13px; font-weight: 600; color: var(--text-meta);">Wed, Nov 4</div>
  <!-- part:CanvasPhotoGrid variant="grid" -->
  <div style="display: flex; gap: 2px; height: 140px;">
    <a data-keep href="PhotoViewerDark.dc.html" aria-label="Photo, Morning walk before work, 07:48" style="display: block; width: 140px; flex-shrink: 0; background: linear-gradient(170deg, #B9D3A0, #5F8F4A 55%, #3E6B36);"></a>
    <div data-keep role="img" aria-label="Live photo, 12:10" style="position: relative; width: 108px; flex-shrink: 0; background: linear-gradient(160deg, #F2C9A0, #D9784E 60%, #A84A3A);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--on-fill)" stroke-width="2" aria-hidden="true" style="position: absolute; left: 6px; top: 6px;"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="7" stroke-dasharray="2 2.4"></circle></svg>
    </div>
    <div data-keep role="img" aria-label="Photo, 18:05" style="flex-grow: 1; background: linear-gradient(180deg, #F0B86A, #C46A4A 50%, #4A3F66);"></div>
  </div>
  <!-- /part -->

  <div style="margin: 0 20px; padding: 10px 0 6px; font-size: 13px; font-weight: 600; color: var(--text-meta);">Tue, Nov 3</div>
  <div style="display: flex; gap: 2px; height: 150px;">
    <div data-keep role="img" aria-label="Photo, starred, 09:20" style="position: relative; width: 230px; flex-shrink: 0; background: linear-gradient(200deg, var(--fixed-powder), var(--fixed-denim) 50%, #2F5577);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--on-fill)" aria-hidden="true" style="position: absolute; left: 6px; bottom: 6px;"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"></path></svg>
    </div>
    <div data-keep role="img" aria-label="Video, 0:42" style="position: relative; flex-grow: 1; background: linear-gradient(165deg, #D9C7A7, #A08560 55%, #6B5A40);">
      <span style="position: absolute; right: 7px; bottom: 6px; font-size: 12px; font-weight: 600; color: var(--on-fill); text-shadow: 0 1px 3px var(--scrim-heavy);">0:42</span>
    </div>
  </div>

  <div style="margin: 0 20px; padding: 10px 0 6px; font-size: 13px; font-weight: 600; color: var(--text-meta);">Sun, Nov 1</div>
  <div style="display: flex; gap: 2px; height: 110px;">
    <div data-keep role="img" aria-label="Photo" style="width: 80px; flex-shrink: 0; background: linear-gradient(170deg, #E8A3C0, #C2366B 70%);"></div>
    <div data-keep role="img" aria-label="Photo" style="width: 110px; flex-shrink: 0; background: linear-gradient(150deg, var(--fixed-gold), #D9A23A 60%, #9A6A22);"></div>
    <div data-keep role="img" aria-label="Photo" style="width: 98px; flex-shrink: 0; background: linear-gradient(190deg, #B9B2D8, #7A6AB0 60%, #4A3F7A);"></div>
    <div data-keep role="img" aria-label="Photo" style="flex-grow: 1; background: linear-gradient(160deg, #A8D0C8, #4E9A8C 60%, #2E6A60);"></div>
  </div>

  <h2 style="margin: 18px 20px 4px; font-size: 20px; font-weight: 700;">October 2026</h2>
  <div style="margin: 0 20px; padding: 4px 0 6px; font-size: 13px; font-weight: 600; color: var(--text-meta);">Sat, Oct 31</div>
  <div style="display: flex; gap: 2px; height: 130px;">
    <div data-keep role="img" aria-label="Photo" style="width: 170px; flex-shrink: 0; background: linear-gradient(175deg, #E0A060, #B0602A 55%, #5A3A2A);"></div>
    <div data-keep role="img" aria-label="Photo" style="flex-grow: 1; background: linear-gradient(160deg, #9DBF8A, #4E7A3E);"></div>
  </div>

  <!-- part:CanvasPhotoGrid variant="zoom" t0="Years" t1="Months" t2="All" -->
  <div style="position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); height: 36px; padding: 3px; box-sizing: border-box; border-radius: 18px; border: 1px solid var(--glass-bar); background: var(--glass-bar); box-shadow: 0 6px 20px var(--shadow-card); display: flex; gap: 2px; font-size: 13px;" role="radiogroup" aria-label="Zoom">
    <button data-slot="t0" role="radio" aria-checked="false" style="border: none; background: none; border-radius: 15px; padding: 0 14px; color: var(--text-meta);">Years</button>
    <button data-slot="t1" role="radio" aria-checked="false" style="border: none; background: none; border-radius: 15px; padding: 0 14px; color: var(--text-meta);">Months</button>
    <button data-slot="t2" role="radio" aria-checked="true" style="border: none; background: var(--surface-card); border-radius: 15px; padding: 0 18px; color: var(--text-ink); font-weight: 600;">All</button>
  </div>
  <!-- /part -->

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 8px;">
    <button aria-label="Home" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; border: 1px solid var(--glass-bar); background: var(--glass-bar); box-shadow: 0 6px 20px var(--shadow-card); display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"></path></svg>
    </button>
    <div style="flex-grow: 1; height: 56px; border-radius: 28px; border: 1px solid var(--glass-bar); background: var(--glass-bar); box-shadow: 0 6px 20px var(--shadow-card); display: flex; align-items: center; justify-content: space-around; font-size: 11px;">
      <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-ink); font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>Library</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-meta);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Collections</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-meta);"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>More</span>
    </div>
    <button aria-label="Search" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; border: 1px solid var(--glass-bar); background: var(--glass-bar); box-shadow: 0 6px 20px var(--shadow-card); display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    </button>
  </div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim-soft);"></div>
<div role="dialog" aria-label="More" style="position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 34px; background: var(--surface-page); padding: 24px; box-sizing: border-box;">
<div style="font-size: 22px; font-weight: 600; margin-bottom: 18px;">More</div>
<div style="min-height: 44px; display: flex; align-items: center;">Tile size · M</div>
<div style="min-height: 44px; display: flex; align-items: center;">Follow Camera roll</div>
<div style="min-height: 44px; display: flex; align-items: center;">Export ›</div>
<div style="min-height: 44px; display: flex; align-items: center;">Trash ›</div>
<div role="group" aria-label="Free up space" style="margin-top: 8px; padding: 10px 0; min-height: 44px;"><div style="font-size: 16px;">Free up space</div><div style="font-size: 13px; color: var(--text-meta); margin-top: 2px;">214 photos · 3.2 GB on this phone</div><div style="font-size: 13px; color: var(--text-meta); margin-top: 4px;">198 photos are backed up.</div><div style="margin-top: 6px; font-size: 15px; font-weight: 600; color: var(--app-photos);">Free up 2.9 GB</div></div>
<div style="font-size: 13px; color: var(--text-meta); margin-top: 12px;">The rest of Photos is in Collections.</div>
</div>
</div>
</x-dc>
