<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div data-theme="dark" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--surface-plain-page); font-family: Geist, system-ui, sans-serif; color: var(--text-ink);">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 8px;">
    <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-85); font-size: 22px; font-weight: 600;">November</button>
    <button aria-label="New event" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--app-calendar-fill); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--on-fill)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>
  <div style="margin: 4px 20px 8px; font-size: 18px; color: var(--text-meta); line-height: 1.25;">From today</div>
  <div style="margin: 0 20px;">
    <div style="font-size: 22px; font-weight: 700; padding: 8px 0 6px; line-height: 1.2;">Wed 4 Nov</div>
    <div style="background: var(--surface-card); border-radius: 16px; overflow: hidden;">
      <div style="display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--surface-line);">
        <span style="width: 5px; align-self: stretch; border-radius: 3px; background: var(--list-blue); flex-shrink: 0;"></span>
        <div><div style="font-size: 20px; color: var(--text-meta); line-height: 1.25;">9:00 am</div><div style="font-size: 22px; line-height: 1.25;">Standup</div><div style="font-size: 20px; color: var(--text-meta); line-height: 1.25;">Work</div></div>
      </div>
      <div style="display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--surface-line);">
        <span style="width: 5px; align-self: stretch; border-radius: 3px; background: var(--list-violet); flex-shrink: 0;"></span>
        <div><div style="font-size: 20px; color: var(--text-meta); line-height: 1.25;">7:30 pm</div><div style="font-size: 22px; line-height: 1.25;">Dinner with Maya</div><div style="font-size: 20px; color: var(--text-meta); line-height: 1.25;">Taberna do Mercado</div></div>
      </div>
    </div>
    <div style="font-size: 22px; font-weight: 700; padding: 14px 0 6px; line-height: 1.2;">Thu 5 Nov</div>
    <div style="background: var(--surface-card); border-radius: 16px; overflow: hidden;">
      <div style="display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--surface-line);">
        <span style="width: 5px; align-self: stretch; border-radius: 3px; background: var(--list-mustard); flex-shrink: 0;"></span>
        <div><div style="font-size: 20px; color: var(--text-meta); line-height: 1.25;">All day</div><div style="font-size: 22px; line-height: 1.25;">Rent due</div><div style="font-size: 20px; color: var(--text-meta); line-height: 1.25;">Home</div></div>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 8px;">
    <button aria-label="Home" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; background: var(--glass-72); border: 1px solid var(--surface-border); box-shadow: 0 6px 20px var(--shadow-8); display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"></path></svg></button>
    <div style="flex-grow: 1; height: 56px; border-radius: 28px; background: var(--glass-72); border: 1px solid var(--surface-border); box-shadow: 0 6px 20px var(--shadow-8); display: flex; align-items: center; justify-content: space-around; font-size: 11px;">
      <span aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-ink); font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendar</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-meta);"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>More</span>
      </div>
    <button aria-label="Search" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; background: var(--glass-72); border: 1px solid var(--surface-border); box-shadow: 0 6px 20px var(--shadow-8); display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

}
</script>

</html>
