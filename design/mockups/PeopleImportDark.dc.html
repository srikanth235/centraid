<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>People import (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div data-theme="dark" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--surface-page); font-family: Geist, system-ui, sans-serif; color: var(--text-ink);">
  <div style="display: flex; align-items: flex-start; justify-content: space-between; padding: 56px 20px 8px;">
    <h1 style="margin: 4px 0 0; flex: 1; min-width: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">Import people</h1>
    <a href="PeopleDark.dc.html" aria-label="Back to People" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-card); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span aria-hidden="true"></span>
  </div>
  

  <p style="margin: 0 20px 14px; font-size: 16px; color: var(--text-meta); line-height: 1.4;">vCard files. People you already have are merged, not repeated.</p>
  <div style="margin: 0 20px 8px; font-size: 16px; font-weight: 600;">Ready to import</div>
  <div style="margin: 0 16px; background: var(--surface-card); border-radius: 16px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 24px; border-bottom: 1px solid var(--surface-line);"><div style="flex-grow: 1; font-size: 16px;">New people</div><span style="font-size: 16px; color: var(--text-meta);">12</span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 24px; border-bottom: 1px solid var(--surface-line);"><div style="flex-grow: 1; font-size: 16px;">Merge into someone you have</div><span style="font-size: 16px; color: var(--text-meta);">2</span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 24px; border-bottom: 1px solid var(--surface-line);"><div style="flex-grow: 1; font-size: 16px;">Already here</div><span style="font-size: 16px; color: var(--text-meta);">5</span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 24px; border-bottom: 1px solid var(--surface-line);"><div style="flex-grow: 1; font-size: 16px;">Merges Maya Rao</div></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 24px;"><div style="flex-grow: 1; font-size: 16px;">Merges Sam Lee</div></div>
  </div>
  <button style="margin: 16px 16px 0; height: 50px; width: calc(100% - 32px); border-radius: 25px; border: none; background: var(--fixed-violet); color: var(--on-fill); font-size: 16px; font-weight: 600;">Import 14 people</button>
  <button style="margin: 4px 16px 0; height: 44px; width: calc(100% - 32px); border: none; background: none; color: var(--text-violet-deep); font-size: 16px; font-weight: 600;">Add new only</button>
  <button style="margin: 4px 16px 0; height: 44px; width: calc(100% - 32px); border: none; background: none; color: var(--text-violet-deep); font-size: 16px; font-weight: 600;">Choose again</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
