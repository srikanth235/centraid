<!DOCTYPE html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8">
<title>Locker trash (dark)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css"></head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--ds-bg); font-family: Geist, system-ui, sans-serif; color: var(--ds-text);">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 8px;">
    <a href="MoreMenuDark.dc.html" aria-label="Back to Locker" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--ds-lineStrong); background: var(--ds-glass); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span aria-hidden="true"></span>
  </div>
  <h1 style="margin: 4px 20px 16px; font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">Trash</h1>

  <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 0 20px 6px;">
    <span style="font-size: 13px; color: var(--ds-textFaint);">Trash · 3</span>
  </div>
  <div style="margin: 0 16px; background: var(--ds-bgElev); border-radius: 16px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 6px 10px 14px; border-bottom: 1px solid var(--ds-line);">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-lockerFill); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3"></path></svg></span>
      <div style="flex-grow: 1; min-width: 0;"><div style="font-size: 16px;">Netflix</div><div style="font-size: 13px; color: var(--ds-textFaint); line-height: 1.35;">Deleted Mon 2 November · Erased Wed 2 December</div></div>
      <button style="border: none; background: none; color: var(--ds-lockerText); font-size: 15px; font-weight: 600; min-width: 44px; height: 44px; padding: 0 4px;">Restore</button>
      <button aria-label="Delete forever" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ds-dangerText)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 6px 10px 14px; border-bottom: 1px solid var(--ds-line);">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-lockerFill); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3"></path></svg></span>
      <div style="flex-grow: 1; min-width: 0;"><div style="font-size: 16px;">Old Airtel router</div><div style="font-size: 13px; color: var(--ds-textFaint); line-height: 1.35;">Deleted Tue 27 October · Erased Thu 26 November</div></div>
      <button style="border: none; background: none; color: var(--ds-lockerText); font-size: 15px; font-weight: 600; min-width: 44px; height: 44px; padding: 0 4px;">Restore</button>
      <button aria-label="Delete forever" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ds-dangerText)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 6px 10px 14px;">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-lockerFill); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3"></path></svg></span>
      <div style="flex-grow: 1; min-width: 0;"><div style="font-size: 16px;">SBI net banking</div><div style="font-size: 13px; color: var(--ds-textFaint); line-height: 1.35;">Deleted Sat 10 October · Erased Mon 9 November</div></div>
      <button style="border: none; background: none; color: var(--ds-lockerText); font-size: 15px; font-weight: 600; min-width: 44px; height: 44px; padding: 0 4px;">Restore</button>
      <button aria-label="Delete forever" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ds-dangerText)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.12);"></div>

  <div role="alertdialog" aria-label="Delete this item forever?" style="position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--ds-bg); border-radius: 34px; padding: 10px 20px 24px; box-sizing: border-box;">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: var(--ds-lineStrong); margin: 0 auto 18px;"></div>
    <div style="font-size: 20px; font-weight: 700;">Delete this item forever?</div>
    <p style="margin: 8px 0 0; font-size: 16px; color: var(--ds-textSoft); line-height: 1.4;">It's erased with its secrets and history. This cannot be undone.</p>
    <button style="margin-top: 20px; width: 100%; height: 50px; border-radius: 25px; border: 1.5px solid var(--ds-dangerText); background: var(--ds-bgElev); color: var(--ds-dangerText); font-size: 16px; font-weight: 600;">Delete forever</button>
    <button style="margin-top: 8px; width: 100%; height: 50px; border-radius: 25px; border: none; background: none; color: var(--ds-text); font-size: 16px; font-weight: 600;">Cancel</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
