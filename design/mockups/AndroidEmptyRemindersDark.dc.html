<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reminders, fresh vault, Android (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div data-theme="dark" style="width: 412px; height: 915px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--surface-page); font-family: Geist, system-ui, sans-serif; color: var(--text-ink);">
  <div style="display: flex; align-items: flex-start; justify-content: space-between; padding: 56px 20px 8px;">
    <h1 style="margin: 4px 0 0; flex: 1; min-width: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">Reminders</h1>
    <div style="display: flex; gap: 8px;">
      <button aria-label="Filter and sort" style="width: 44px; height: 44px; border-radius: 22px; background: var(--glass-72); border: 1px solid var(--surface-border); box-shadow: 0 6px 20px var(--shadow-8); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8z" stroke-linejoin="round"></path></svg>
      </button>
      <button aria-label="New reminder" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--app-reminders-fill); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--on-fill)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
  </div>
  


  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 20px;">
    <a href="TodayDark.dc.html" style="text-decoration: none; color: var(--on-fill); background: var(--list-blue); border-radius: 18px; padding: 14px; height: 92px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--on-fill)" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18"></path></svg>
        <span style="font-size: 28px; font-weight: 700;">0</span>
      </div>
      <span style="font-size: 17px; font-weight: 600;">Today</span>
    </a>
    <div style="text-decoration: none; color: var(--on-fill); background: var(--list-raspberry); border-radius: 18px; padding: 14px; height: 92px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--on-fill)" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"></path></svg>
        <span style="font-size: 28px; font-weight: 700;">0</span>
      </div>
      <span style="font-size: 17px; font-weight: 600;">Scheduled</span>
    </div>
    <div style="text-decoration: none; color: var(--on-fill); background: var(--fill-1c1b19); border-radius: 18px; padding: 14px; height: 92px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--on-fill)" stroke-width="2" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3z"></path><path d="M3 13h5l1 2h6l1-2h5"></path></svg>
        <span style="font-size: 28px; font-weight: 700;">0</span>
      </div>
      <span style="font-size: 17px; font-weight: 600;">All</span>
    </div>
    <div style="text-decoration: none; color: var(--on-fill); background: var(--state-amber-fill); border-radius: 18px; padding: 14px; height: 92px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--on-fill)" stroke-width="2" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"></path></svg>
        <span style="font-size: 28px; font-weight: 700;">0</span>
      </div>
      <span style="font-size: 17px; font-weight: 600;">Starred</span>
    </div>
    <div style="grid-column: span 2; color: var(--on-fill); background: var(--fill-6e6b66); border-radius: 18px; padding: 14px; height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--on-fill)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        <span style="font-size: 17px; font-weight: 600;">Completed</span>
      </div>
      <span style="font-size: 15px; font-weight: 500; opacity: 0.85;">Logbook</span>
    </div>
  </div>

  <div style="margin: 28px 20px 0; background: var(--surface-card); border-radius: 16px; padding: 24px 20px 20px; display: flex; flex-direction: column; align-items: center; text-align: center;">
    <span style="width: 52px; height: 52px; border-radius: 26px; background: var(--fill-e2eef8); display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--app-reminders)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="7" r="2"></circle><circle cx="5" cy="17" r="2"></circle><path d="M10 7h11M10 17h11"></path></svg></span>
    <div style="font-size: 18px; font-weight: 600; margin-top: 12px; line-height: 1.3;">Add the first thing you must not forget.</div>
    <div style="font-size: 13px; color: var(--text-meta); margin-top: 12px;">Tap + to write one.</div>
  </div>

  <!-- part:Band variant="two" -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 8px;">
    <button aria-label="Home" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; background: var(--glass-72); border: 1px solid var(--surface-border); box-shadow: 0 6px 20px var(--shadow-8); display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"></path></svg>
    </button>
    <div style="flex-grow: 1; height: 56px; border-radius: 28px; background: var(--glass-72); border: 1px solid var(--surface-border); box-shadow: 0 6px 20px var(--shadow-8); display: flex; align-items: center; justify-content: space-around; font-size: 11px;">
      <span aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-ink); font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="7" r="2"></circle><circle cx="5" cy="17" r="2"></circle><path d="M10 7h11M10 17h11"></path></svg>Reminders</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-meta);"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>More</span>
    </div>
    <button aria-label="Search" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; background: var(--glass-72); border: 1px solid var(--surface-border); box-shadow: 0 6px 20px var(--shadow-8); display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    </button>
  </div>
  <!-- /part -->
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
