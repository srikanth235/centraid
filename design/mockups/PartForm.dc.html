<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part: Form</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; box-sizing: border-box; position: relative; background: var(--surface-page); font-family: Geist, system-ui, sans-serif; color: var(--text-ink); padding: 56px 0 28px;">
  <div style="padding: 0 16px 4px; font-size: 20px; font-weight: 700;">Form</div>
  <div style="padding: 0 16px 14px; font-size: 13px; color: var(--text-meta); line-height: 1.4;">Fields, repeatable rows, then autosave (prose) or Cancel and Save (explicit).</div>
  <div style="padding: 10px 16px 6px; font-size: 12px; font-weight: 600; color: var(--text-meta); letter-spacing: 0.4px;">EXPLICIT: TITLE FIELD</div>
  <div style="margin: 0 16px; background: var(--surface-card); border-radius: 16px; overflow: hidden;">
    <!-- variant:explicit -->
    <div style="background: var(--surface-card); border-radius: 16px; margin-top: 12px; padding: 12px 16px;"><div data-slot="t0" style="font-size: 12px; color: var(--text-meta);">Title</div><div style="font-size: 22px; font-weight: 600; margin-top: 2px;">Renew passport<span style="display: inline-block; width: 2px; height: 20px; background: var(--app-reminders-fill); vertical-align: -4px; margin-left: 1px;"></span></div></div>
    <!-- /variant -->
  </div>
  <div style="padding: 10px 16px 6px; font-size: 12px; font-weight: 600; color: var(--text-meta); letter-spacing: 0.4px;">EXPLICIT: NAME FIELD</div>
  <div style="margin: 0 16px; background: var(--surface-card); border-radius: 16px; overflow: hidden;">
    <!-- variant:name -->
    <div style="flex-grow: 1; min-width: 0;"><div data-slot="t0" style="font-size: 12px; color: var(--text-meta);">Name</div><div data-slot="t1" style="font-size: 16px; overflow-wrap: anywhere;">Ada Lovelace</div></div>
    <!-- /variant -->
  </div>
  <div style="padding: 10px 16px 6px; font-size: 12px; font-weight: 600; color: var(--text-meta); letter-spacing: 0.4px;">AUTOSAVE: SAVED</div>
  <div style="margin: 0 16px; background: var(--surface-card); border-radius: 16px; overflow: hidden;">
    <!-- variant:autosave -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 8px;">
      <a data-slot="t0" href="NotesHome.dc.html" aria-label="Done, back to Notes" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-card); display: flex; align-items: center; text-decoration: none; color: var(--app-notes); font-size: 16px; font-weight: 600;">Done</a>
      <span data-slot="t1" style="font-size: 13px; color: var(--text-meta);">Saved</span>
      <button aria-label="Note actions" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-card); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text-ink)" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
      </button>
    </div>
    <!-- /variant -->
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
