<div data-theme="dark" style="width: 390px; box-sizing: border-box; position: relative; background: var(--surface-page); font-family: Geist, system-ui, sans-serif; color: var(--text-ink); padding: 56px 0 28px;">
  <div style="padding: 0 16px 4px; font-size: 20px; font-weight: 700;">Header</div>
  <div style="padding: 0 16px 14px; font-size: 13px; color: var(--text-meta); line-height: 1.4;">A room's title and at most two keys; a pushed page has back and one verb.</div>
  <div style="padding: 10px 16px 6px; font-size: 12px; font-weight: 600; color: var(--text-meta); letter-spacing: 0.4px;">ROOT: TITLE AND KEYS</div>
  <div>
    <!-- variant:keys -->
    <div style="display: flex; align-items: flex-start; justify-content: space-between; padding: 56px 20px 4px;">
      <h1 data-slot="t0" style="margin: 4px 0 0; flex: 1; min-width: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">People</h1>
      <div style="display: flex; gap: 8px;">
        <button aria-label="Filter and sort" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-85); display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8z" stroke-linejoin="round"></path></svg>
        </button>
        <button aria-label="Add person" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--app-people-fill); display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--on-fill)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
    </div>
    <!-- /variant -->
  </div>
  <div style="padding: 10px 16px 6px; font-size: 12px; font-weight: 600; color: var(--text-meta); letter-spacing: 0.4px;">PUSHED: BACK AND A VERB</div>
  <div>
    <!-- variant:pushed -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 4px;">
      <a href="PeopleDark.dc.html" aria-label="Back to People" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--glass-80); background: var(--glass-60); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; gap: 8px;">
        <button aria-label="More" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--glass-80); background: var(--glass-60); display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text-ink)" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
        </button>
        <button data-slot="t0" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--glass-80); background: var(--glass-60); font-size: 16px; font-weight: 600;">Edit</button>
      </div>
    </div>
    <!-- /variant -->
  </div>
