<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<title>Calendar at largest text</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css"></head>
<body>
<x-dc>
<helmet><style>
body{margin:0}
button{font:inherit;color:inherit}
.calendar-large{width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--ds-bgList);color:var(--ds-text);font-family:Geist,system-ui,sans-serif;padding:48px 16px 24px}
.calendar-large h1{font-size:34px;line-height:1.15;margin:0 0 4px}
.calendar-large h2{font-size:30px;line-height:1.2;margin:16px 0 8px;overflow-wrap:anywhere}
.calendar-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 16px}
.calendar-controls button{font-size:23px;font-weight:600;min-height:48px;padding:8px 12px;border:1px solid var(--ds-lineStrong);border-radius:16px;background:var(--ds-bg)}
.calendar-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.calendar-week span{padding:4px 0;font-size:24px;line-height:1.35}
.calendar-week small{display:block;font-size:17px}
.calendar-week .selected{background:var(--ds-agendaFill);color:var(--ds-onAccent);border-radius:12px}
.calendar-week i{display:block;width:5px;height:5px;margin:2px auto;background:var(--ds-agendaText);border-radius:50%}
.calendar-week .selected i{background:var(--ds-onAccent)}
.calendar-hour{display:flex;gap:8px;min-height:80px;align-items:flex-start}
.calendar-hour time{flex:none;min-width:5ch;white-space:nowrap;font-size:24px;font-variant-numeric:tabular-nums;text-align:end;color:var(--ds-textSoft)}
.calendar-hour .lane{flex:1;min-width:0;border-top:1px solid var(--ds-line);padding-top:8px}
.calendar-event{background:var(--ds-agendaTint);color:var(--ds-agendaText);border-inline-start:3px solid var(--ds-listBlue);border-radius:8px;padding:8px;font-size:22px;line-height:1.3}
</style></helmet>
<main class="calendar-large">
  <h1>Calendar</h1>
  <div style="font-size:24px;color:var(--ds-textSoft)">November 2026 · 1 event</div>
  <!-- The range has its own line when text grows; controls wrap instead of truncating it. -->
  <h2>Today</h2>
  <div class="calendar-controls">
    <button>Calendar view</button>
    <button aria-label="Previous day">‹</button><button aria-label="Next day">›</button>
  </div>
  <div class="calendar-week">
    <span><small>Mon</small>2</span><span><small>Tue</small>3</span><span><small>Wed</small>4</span>
    <span class="selected"><small>Thu</small>5<i></i></span>
    <span><small>Fri</small>6<i></i></span><span><small>Sat</small>7</span><span><small>Sun</small>8</span>
  </div>
  <h2>Thursday 5 November</h2>
  <!-- The gutter follows the measured clock text; HH:MM never breaks at the colon. -->
  <div class="calendar-hour"><time>09:00</time><div class="lane"></div></div>
  <div class="calendar-hour"><time>10:00</time><div class="lane"><div class="calendar-event">Team standup<br><span style="font-size:20px">10:00 – 11:00</span></div></div></div>
  <div class="calendar-hour"><time>11:00</time><div class="lane"></div></div>
  <div class="calendar-hour"><time>12:00</time><div class="lane"></div></div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body></html>
