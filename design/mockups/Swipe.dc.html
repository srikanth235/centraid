<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<title>Agenda swipe actions and notification</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css"></head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--ds-bgList); font-family: Geist, system-ui, sans-serif; color: var(--ds-text);">
  <div style="margin: 56px 12px 0; background: var(--ds-glass); border: 1px solid var(--ds-lineStrong); border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); padding: 12px 14px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="width: 28px; height: 28px; border-radius: 7px; background: var(--ds-agendaFill); display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18"></path></svg></span>
      <span style="flex-grow: 1; font-size: 13px; color: var(--ds-textFaint);">Centraid · Agenda</span>
      <span style="font-size: 13px; color: var(--ds-textFaint);">now</span>
    </div>
    <div style="font-size: 15px; font-weight: 600; margin-top: 8px;">Call the bank about the card</div>
    <div style="font-size: 14px; color: var(--ds-textSoft); margin-top: 2px;">Reminder</div>
    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <button style="flex-grow: 1; height: 40px; border-radius: 12px; border: none; background: var(--ds-line); font-size: 14px; font-weight: 600;">Mark as done</button>
      <button style="flex-grow: 1; height: 40px; border-radius: 12px; border: none; background: var(--ds-line); font-size: 14px; font-weight: 600;">In 1 hour</button>
      <button style="flex-grow: 1; height: 40px; border-radius: 12px; border: none; background: var(--ds-line); font-size: 14px; font-weight: 600;">Tomorrow at 9</button>
    </div>
  </div>
  <p style="margin: 8px 20px 0; font-size: 12px; color: var(--ds-textFaint); text-align: center;">Delivered by the phone, even with the app closed</p>

  <h1 style="margin: 26px 20px 12px; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; color: var(--ds-peopleText);">Home</h1>

  <div style="padding: 0 20px;">
    <div style="display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--ds-line);">
      <span style="width: 22px; height: 22px; border-radius: 11px; border: 1.6px solid var(--ds-textDisabled); flex-shrink: 0;"></span>
      <div style="flex-grow: 1;">
        <div style="font-size: 16px;">Fix the hallway light</div>
        <div style="font-size: 13px; color: var(--ds-textFaint); margin-top: 3px;">Sat 7 Nov</div>
      </div>
    </div>
  </div>
  <div style="position: relative; height: 66px; border-bottom: 1px solid var(--ds-line); overflow: hidden;">
    <div style="position: absolute; right: 0; top: 0; bottom: 0; display: flex;">
      <button style="width: 74px; border: none; background: var(--ds-lockerFill); color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg>Details
      </button>
      <button style="width: 74px; border: none; background: var(--ds-warningFill); color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>Flag
      </button>
      <button style="width: 74px; border: none; background: var(--ds-dangerFill); color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Delete
      </button>
    </div>
    <div style="position: absolute; left: -222px; width: 390px; top: 0; bottom: 0; background: var(--ds-bgList); display: flex; gap: 12px; padding: 10px 20px; box-sizing: border-box;">
      <span style="width: 22px; height: 22px; border-radius: 11px; border: 1.6px solid var(--ds-textDisabled); flex-shrink: 0;"></span>
      <div><div style="font-size: 16px;">Renew home insurance</div><div style="font-size: 13px; color: var(--ds-textFaint); margin-top: 3px;">Mon 9 Nov</div></div>
    </div>
  </div>
  <div style="padding: 0 20px;">
    <div style="display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--ds-line);">
      <span style="width: 22px; height: 22px; border-radius: 11px; border: 1.6px solid var(--ds-textDisabled); flex-shrink: 0;"></span>
      <div style="flex-grow: 1;">
        <div style="font-size: 16px;">Water the plants</div>
        <div style="font-size: 13px; color: var(--ds-textFaint); margin-top: 3px;">Today, 20:00 · Every 3 days</div>
      </div>
    </div>
    <div style="display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--ds-line); background: var(--ds-bgElev); box-shadow: 0 8px 24px rgba(0,0,0,0.12); border-radius: 12px; margin: 6px -8px; padding-left: 8px; padding-right: 8px;">
      <span style="width: 22px; height: 22px; border-radius: 11px; border: 1.6px solid var(--ds-textDisabled); flex-shrink: 0;"></span>
      <div style="flex-grow: 1;">
        <div style="font-size: 16px;">Clear out the garage</div>
        <div style="font-size: 13px; color: var(--ds-textFaint); margin-top: 3px;">Dragging to reorder</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ds-textFaint)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9h16M4 15h16"></path></svg>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--ds-textFaint);">
    <span>2 completed · <span style="color: var(--ds-peopleText); font-weight: 600;">Show</span></span>
    <span>Clear</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>


</body></html>
