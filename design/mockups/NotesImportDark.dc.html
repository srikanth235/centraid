<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0E0D0C; font-family: Geist, system-ui, sans-serif; color: #F2EFEA;">
  <div style="display: flex; align-items: flex-start; justify-content: space-between; padding: 56px 20px 8px;">
    <h1 style="margin: 4px 0 0; flex: 1; min-width: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">Import notes</h1>
    <a href="Notes.dc.html" aria-label="Back to Notes" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3A3733; background: rgba(44,42,39,0.85); display: flex; align-items: center; justify-content: center;">

    </a>
    <span aria-hidden="true"></span>
  </div>
  

  <p style="margin: 0 20px 14px; font-size: 16px; color: #A39E95; line-height: 1.4;">Markdown or text files, or a folder. Links and tags come along.</p>
  <div style="margin: 0 20px 8px; font-size: 16px; font-weight: 600;">Ready to import</div>
  <div style="margin: 0 16px; background: #1F1E1C; border-radius: 16px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 24px; border-bottom: 1px solid #2C2A27;"><div style="flex-grow: 1; font-size: 16px;">Notes</div><span style="font-size: 16px; color: #A39E95;">48</span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 24px; border-bottom: 1px solid #2C2A27;"><div style="flex-grow: 1; font-size: 16px;">Links</div><span style="font-size: 16px; color: #A39E95;">31</span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 24px; border-bottom: 1px solid #2C2A27;"><div style="flex-grow: 1; font-size: 16px;">Tags</div><span style="font-size: 16px; color: #A39E95;">9</span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 24px; border-bottom: 1px solid #2C2A27;"><div style="flex-grow: 1; font-size: 16px;">Notebooks</div><span style="font-size: 16px; color: #A39E95;">4</span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 24px; border-bottom: 1px solid #2C2A27;"><div style="flex-grow: 1; font-size: 16px;">Links to nothing yet</div><span style="font-size: 16px; color: #A39E95;">2</span></div>

  </div>
  <button style="margin: 16px 16px 0; height: 50px; width: calc(100% - 32px); border-radius: 25px; border: none; background: #6A7888; color: #FFFFFF; font-size: 16px; font-weight: 600;">Import 48 notes</button>
  <button style="margin: 4px 16px 0; height: 44px; width: calc(100% - 32px); border: none; background: none; color: #939DA8; font-size: 16px; font-weight: 600;">Choose again</button>
</div>
</x-dc>
