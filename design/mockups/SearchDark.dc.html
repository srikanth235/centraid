<!DOCTYPE html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8">
<title>Search everything (dark)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css"></head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--ds-bgList); font-family: Geist, system-ui, sans-serif; color: var(--ds-text);">
  <h1 style="margin: 64px 20px 2px; font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">Search</h1>
  <p style="margin: 0 20px 10px; font-size: 13px; color: var(--ds-textFaint);">All apps</p>

  <div style="padding: 0 20px;">
    <div aria-label="Photos, 1 result" style="display: flex; align-items: baseline; justify-content: space-between; padding: 8px 0 6px;">
      <span style="font-size: 15px; font-weight: 600; color: var(--ds-photosText);">Photos</span>
      <span style="font-size: 13px; color: var(--ds-textFaint);">1</span>
    </div>
    <div style="display: flex; gap: 8px; padding-bottom: 8px;">
      <span aria-label="Album, Lisbon 2024" style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 8px; border-radius: 17px; background: var(--ds-bgElev); border: 1px solid var(--ds-lineStrong); font-size: 15px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ds-photosText)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
        <span style="color: var(--ds-textFaint);">Album</span>Lisbon 2024
      </span>
    </div>

    <div aria-label="Docs, 2 results" style="display: flex; align-items: baseline; justify-content: space-between; padding: 12px 0 2px;">
      <span style="font-size: 15px; font-weight: 600; color: var(--ds-docsText);">Docs</span>
      <span style="font-size: 13px; color: var(--ds-textFaint);">2</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--ds-line);">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-docsFill); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path></svg></span>
      <div style="flex-grow: 1;"><div style="font-size: 16px;">Trip plan</div><div style="font-size: 13px; color: var(--ds-textFaint);">Document</div></div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0;">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-docsFill); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path></svg></span>
      <div style="flex-grow: 1;"><div style="font-size: 16px;">Lisbon flights</div><div style="font-size: 13px; color: var(--ds-textFaint);">Document</div></div>
    </div>

    <div aria-label="Agenda, 2 results" style="display: flex; align-items: baseline; justify-content: space-between; padding: 12px 0 2px;">
      <span style="font-size: 15px; font-weight: 600; color: var(--ds-agendaText);">Agenda</span>
      <span style="font-size: 13px; color: var(--ds-textFaint);">2</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--ds-line);">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-agendaFill); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18"></path></svg></span>
      <div style="flex-grow: 1;"><div style="font-size: 16px;">Lisbon trip</div><div style="font-size: 13px; color: var(--ds-textFaint);">Event</div></div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0;">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-agendaFill); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg></span>
      <div style="flex-grow: 1;"><div style="font-size: 16px;">Buy a plug adapter for Lisbon</div><div style="font-size: 13px; color: var(--ds-textFaint);">Task</div></div>
    </div>

    <div aria-label="Notes, 1 result" style="display: flex; align-items: baseline; justify-content: space-between; padding: 12px 0 2px;">
      <span style="font-size: 15px; font-weight: 600; color: var(--ds-notesText);">Notes</span>
      <span style="font-size: 13px; color: var(--ds-textFaint);">1</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0;">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-notesFill); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18H5z"></path><path d="M9 8h6M9 12h6M9 16h3"></path></svg></span>
      <div style="flex-grow: 1;"><div style="font-size: 16px;">Lisbon restaurants</div><div style="font-size: 13px; color: var(--ds-textFaint);">Note</div></div>
    </div>

    <div aria-label="Locker, 1 result" style="display: flex; align-items: baseline; justify-content: space-between; padding: 12px 0 2px;">
      <span style="font-size: 15px; font-weight: 600; color: var(--ds-lockerText);">Locker</span>
      <span style="font-size: 13px; color: var(--ds-textFaint);">1</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--ds-line);">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-lockerFill); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3"></path></svg></span>
      <div style="flex-grow: 1;"><div style="font-size: 16px;">TAP Air Portugal</div><div style="font-size: 13px; color: var(--ds-textFaint);">Locker item</div></div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0 0;">
      <span style="width: 30px; height: 30px; border-radius: 15px; background: var(--ds-shellTint); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ds-shellText)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"></path></svg></span>
      <span style="flex-grow: 1; font-size: 16px; font-weight: 600; color: var(--ds-shellText);">Ask about “lisbon”</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ds-textDisabled)" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 8px;">
    <div style="flex-grow: 1; height: 56px; border-radius: 28px; border: 1px solid var(--ds-glass); background: var(--ds-glass); box-shadow: 0 6px 20px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ds-textFaint)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span role="searchbox" aria-label="Search everything" style="flex-grow: 1; font-size: 17px;">lisbon<span style="display: inline-block; width: 2px; height: 20px; background: var(--ds-shellFill); vertical-align: -4px; margin-left: 1px;"></span></span>
      <span aria-label="Clear" role="button" style="width: 20px; height: 20px; border-radius: 10px; background: var(--ds-textDisabled); display: flex; align-items: center; justify-content: center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
    </div>
    <button aria-label="Close search" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; border: 1px solid var(--ds-glass); background: var(--ds-glass); box-shadow: 0 6px 20px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>


</body></html>
