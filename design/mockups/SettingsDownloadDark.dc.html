<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Download settings sheet (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<!-- Settings > Download settings: the member's one transfer rule as a sheet over Settings (the row used to open Backup). Same three choices as Home's gear and the Backup page, from the same store; a pick keeps the rule and closes the sheet. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #5F5B55; font-family: Geist, system-ui, sans-serif; color: #F2EFEA;">
<div style="position: absolute; left: 0; right: 0; top: 280px; bottom: 0; background: #0E0D0C; border-radius: 28px 28px 0 0; padding: 10px 16px 0; box-sizing: border-box; overflow: hidden;">
<div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #4A4741; margin: 0 auto 6px;"></div>
<div style="font-size: 20px; font-weight: 700; margin: 8px 4px 0;">Downloads</div>
<div style="font-size: 14px; color: #A39E95; margin: 6px 4px 0; line-height: 1.4;">Set per phone, not per vault; thumbnails download on any network.</div>
<div role="radiogroup" aria-label="Downloads" style="background: #1F1E1C; border-radius: 16px; margin-top: 14px; overflow: hidden;"><div role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid #2C2A27;"><span style="flex-grow: 1; font-size: 16px; line-height: 1.35;">Full-size photos and videos back up and download on Wi-Fi only.</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2EFEA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid #2C2A27;"><span style="flex-grow: 1; font-size: 16px; line-height: 1.35;">Full-size photos back up and download on Wi-Fi or cellular; videos wait for Wi-Fi.</span><span style="width: 20px; height: 20px;"></span></div><div role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; "><span style="flex-grow: 1; font-size: 16px; line-height: 1.35;">Full-size photos download when you tap one; backups wait for Wi-Fi.</span><span style="width: 20px; height: 20px;"></span></div></div>
<button style="margin-top: 20px; width: 100%; height: 52px; border-radius: 26px; border: none; background: #2E7268; color: #FFFFFF; font-size: 17px; font-weight: 600;">Done</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
