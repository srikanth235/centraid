<!DOCTYPE html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8">
<title>Locker More sheet (dark)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css"></head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--ds-bg); font-family: Geist, system-ui, sans-serif; color: var(--ds-text);">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 8px;">
    <span aria-hidden="true"></span>
    <div style="display: flex; gap: 8px;">
      <button aria-label="Filter" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--ds-lineStrong); background: var(--ds-glass); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8z"></path></svg>
      </button>
      <button aria-label="New item" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--ds-lockerFill); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
  </div>
  <h1 style="margin: 4px 20px 16px; font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">Locker</h1>

  <h2 style="margin: 0 20px 6px; font-size: 20px; font-weight: 700;">Starred</h2>
  <div style="margin: 0 16px; background: var(--ds-bgElev); border-radius: 16px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--ds-line);">
      <span style="width: 36px; height: 36px; border-radius: 9px; background: var(--ds-text); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 700; font-size: 15px;">G</span>
      <div style="flex-grow: 1; min-width: 0;"><div style="font-size: 16px;">GitHub</div><div style="font-size: 13px; color: var(--ds-textFaint);">Login · srikanth@crowdshakti.com</div></div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px;">
      <span style="width: 36px; height: 36px; border-radius: 9px; background: var(--ds-moneyFill); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 700; font-size: 15px;">Z</span>
      <div style="flex-grow: 1; min-width: 0;"><div style="font-size: 16px;">Zerodha Kite</div><div style="font-size: 13px; color: var(--ds-textFaint);">Login · srikanth.k</div></div>
      <span style="font-size: 11px; font-weight: 700; color: var(--ds-dangerText); background: var(--ds-dangerTint); padding: 3px 6px; border-radius: 6px;">COMPROMISED</span>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.12);"></div>

  <div role="dialog" aria-label="Locker" style="position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--ds-bg); border-radius: 34px; padding: 10px 16px 24px; box-sizing: border-box;">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: var(--ds-lineStrong); margin: 0 auto 6px;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span aria-hidden="true" style="width: 44px;"></span>
      <span style="font-size: 17px; font-weight: 600;">Locker</span>
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--ds-lineStrong); background: var(--ds-bgElev); display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ds-text)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div style="background: var(--ds-bgElev); border-radius: 16px; margin-top: 12px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--ds-line);">
        <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-lockerFill); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"></path></svg></span>
        <div style="flex-grow: 1;"><div style="font-size: 16px;">Import</div><div style="font-size: 13px; color: var(--ds-textFaint);">From a password manager</div></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ds-textDisabled)" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
      <a href="TrashDark.dc.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--ds-line);">
        <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-lockerFill); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></span>
        <div style="flex-grow: 1;"><div style="font-size: 16px;">Trash</div><div style="font-size: 13px; color: var(--ds-textFaint);">Thirty days, then erased</div></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ds-textDisabled)" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--ds-line);">
        <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-lockerFill); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 12v8h14v-8"></path></svg></span>
        <div style="flex-grow: 1;"><div style="font-size: 16px;">Export</div><div style="font-size: 13px; color: var(--ds-textFaint);">Unencrypted file</div></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ds-textDisabled)" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px;">
        <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-lockerFill); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg></span>
        <div style="flex-grow: 1;"><div style="font-size: 16px;">What Locker keeps</div><div style="font-size: 13px; color: var(--ds-textFaint);">What's encrypted, what isn't</div></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ds-textDisabled)" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
    </div>

    <div style="background: var(--ds-bgElev); border-radius: 16px; margin-top: 12px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px;">
        <span style="width: 30px; height: 30px; border-radius: 8px; background: var(--ds-lockerFill); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg></span>
        <div style="flex-grow: 1;"><div style="font-size: 16px; color: var(--ds-lockerText); font-weight: 600;">Lock</div><div style="font-size: 13px; color: var(--ds-textFaint);">Cover every item now</div></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>


</body></html>
