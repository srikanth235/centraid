<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Health today and typical range</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<style>body{margin:0}button{font:inherit;color:inherit}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--surface-page);color:var(--text-ink);">
<header style="display:flex;align-items:center;justify-content:space-between;padding:56px 18px 8px;"><h1 style="margin:0;font-size:34px;font-weight:700;letter-spacing:-.5px;">Health</h1><button aria-label="Edit figures" style="width:44px;height:44px;border:0;border-radius:22px;background:var(--glass-bar);color:var(--text-ink);font-size:18px;">＋</button></header>
<p style="margin:0 18px 16px;color:var(--text-meta);font-size:14px;">Today · 27 Nov 2026</p>
<h2 style="margin:0 18px 8px;font-size:20px;">Today</h2>
<div style="margin:0 14px;background:var(--surface-card);border-radius:16px;overflow:hidden;">
<div style="display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--surface-line);"><div style="flex:1;min-width:0;"><div style="font-size:16px;font-weight:500;">Steps</div><div style="font-size:13px;color:var(--text-meta);margin-top:3px;">Nothing yet today</div></div><div style="font-size:15px;font-weight:600;white-space:nowrap;"></div></div>
</div>
<h2 style="margin:18px 18px 8px;font-size:20px;">Typical range</h2>
<div style="margin:0 14px;background:var(--surface-card);border-radius:16px;padding:14px;">
<div style="font-size:13px;color:var(--text-meta);">Steps · previous 28 completed days</div>
<div style="font-size:24px;font-weight:700;color:var(--app-health);margin-top:6px;">6,200–8,400</div>
<div style="font-size:13px;color:var(--text-meta);margin-top:3px;">12 days with recorded steps</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
