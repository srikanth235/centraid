<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part: Status line (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div data-theme="dark" style="width: 390px; box-sizing: border-box; position: relative; background: var(--surface-page); font-family: Geist, system-ui, sans-serif; color: var(--text-ink); padding: 56px 0 28px;">
  <div style="padding: 0 16px 4px; font-size: 20px; font-weight: 700;">Status line</div>
  <div style="padding: 0 16px 14px; font-size: 13px; color: var(--text-meta); line-height: 1.4;">One line, never a toast: what happened, with Undo, or a refusal with Try again.</div>
  <div style="padding: 10px 16px 6px; font-size: 12px; font-weight: 600; color: var(--text-meta); letter-spacing: 0.4px;">ACTED, WITH UNDO</div>
  <div>
    <!-- variant:acted -->
    <div role="status" aria-live="polite" style="position: absolute; left: 16px; right: 16px; bottom: 88px; height: 44px; border-radius: 22px; background: var(--surface-card); border: 1px solid var(--surface-border); display: flex; align-items: center; gap: 10px; padding: 0 6px 0 16px; box-sizing: border-box;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-meta)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"></path></svg>
      <span data-slot="t0" style="flex-grow: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Passport scan moved to trash</span>
      <button data-slot="t1" style="height: 44px; padding: 0 12px; border: none; background: none; color: var(--app-docs); font-size: 15px; font-weight: 600;">Undo</button>
    </div>
    <!-- /variant -->
  </div>
  <div style="padding: 10px 16px 6px; font-size: 12px; font-weight: 600; color: var(--text-meta); letter-spacing: 0.4px;">REFUSED</div>
  <div>
    <!-- variant:refused -->
    <div role="status" style="position: absolute; left: 20px; right: 20px; bottom: 150px; min-height: 44px; border-radius: 12px; background: var(--surface-fill); border: 1px solid var(--surface-border); display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; box-sizing: border-box;">
      <span data-slot="t0" style="flex-grow: 1; font-size: 13px; line-height: 1.3; color: var(--text-ink);">Couldn’t refresh; showing what was here.</span>
      <button data-slot="t1" style="height: 44px; padding: 0 12px; border: none; background: none; color: var(--app-docs); font-size: 13px; font-weight: 600;">Try again</button>
    </div>
    <!-- /variant -->
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
