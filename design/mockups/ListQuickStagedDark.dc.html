<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reminders list, quick add with a link and a photo staged (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div data-theme="dark" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--surface-plain-page); font-family: Geist, system-ui, sans-serif; color: var(--text-ink);">
  <div style="display: flex; align-items: flex-start; justify-content: space-between; padding: 56px 20px 8px;">
    <h1 style="margin: 4px 0 0; flex: 1; min-width: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">Errands</h1>
    <a href="MainDark.dc.html" aria-label="Back to Reminders" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-card); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <button aria-label="Done" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--list-mustard); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--on-fill)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
    </button>
  </div>
  


  <div style="padding: 0 20px;">
    <div style="font-size: 15px; font-weight: 600; color: var(--text-meta); padding: 6px 0 4px;">Groceries</div>
    <div style="display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--surface-line);">
      <span style="width: 22px; height: 22px; border-radius: 11px; border: 1.6px solid var(--stroke-strong); flex-shrink: 0;"></span>
      <div style="font-size: 16px;">Oat milk</div>
    </div>
    <div style="display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--surface-line);">
      <span style="width: 22px; height: 22px; border-radius: 11px; border: 1.6px solid var(--stroke-strong); flex-shrink: 0;"></span>
      <div style="flex-grow: 1;">
        <div style="font-size: 16px;">Coffee beans</div>
        <div style="font-size: 13px; color: var(--text-meta); margin-top: 3px;">2 subtasks</div>
      </div>
    </div>
    <div style="display: flex; gap: 12px; padding: 10px 0 10px 34px; border-bottom: 1px solid var(--surface-line);">
      <span style="width: 20px; height: 20px; border-radius: 10px; border: 1.6px solid var(--stroke-strong); flex-shrink: 0;"></span>
      <div style="font-size: 15px;">Decaf for Ana</div>
    </div>

    <div style="font-size: 15px; font-weight: 600; color: var(--text-meta); padding: 18px 0 4px;">Around town</div>
    <div style="display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--surface-line);">
      <span style="width: 22px; height: 22px; border-radius: 11px; border: 1.6px solid var(--stroke-strong); flex-shrink: 0;"></span>
      <div style="flex-grow: 1;">
        <div style="font-size: 16px;">Return library books</div>
        <div style="font-size: 13px; color: var(--text-meta); margin-top: 3px;">Fri 6 Nov</div>
      </div>
    </div>
    <div style="display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--surface-line); align-items: flex-start;">
      <span style="width: 22px; height: 22px; border-radius: 11px; border: 1.6px solid var(--list-mustard); flex-shrink: 0;"></span>
      <div style="flex-grow: 1;">
        <div style="font-size: 16px;">Get passport photos<span style="display: inline-block; width: 2px; height: 18px; background: var(--list-mustard); vertical-align: -3px; margin-left: 1px;"></span></div>
        <div style="font-size: 13px; color: var(--app-calendar); margin-top: 3px;">Tomorrow, 10:00 · understood from “tomorrow 10am”</div>
        <div style="font-size: 13px; color: var(--text-faint); margin-top: 2px;">Notes</div>
      </div>
      <button aria-label="Details" style="width: 32px; height: 32px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--list-mustard)" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg>
      </button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: var(--chip-sand); display: flex; align-items: center; justify-content: center; color: var(--text-meta); font-size: 13px;">Keyboard</div>
  <div role="group" aria-label="Staged for the next reminder" style="position: absolute; left: 16px; right: 16px; bottom: 372px; background: var(--surface-card); border-radius: 16px; box-shadow: 0 6px 20px var(--shadow-card); overflow: hidden;"><div style="display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 44px; box-sizing: border-box; border-bottom: 1px solid var(--surface-line);"><span style="width: 28px; height: 28px; border-radius: 8px; background: var(--surface-line); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 006 0l3-3a4 4 0 00-6-6l-1 1M14 10a4 4 0 00-6 0l-3 3a4 4 0 006 6l1-1"></path></svg></span><div style="flex-grow: 1; min-width: 0;"><div style="font-size: 12px; color: var(--text-meta);">Link · Note</div><div style="font-size: 16px; overflow-wrap: anywhere;">Lisbon trip</div></div><button aria-label="Remove Lisbon trip" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--stroke-strong)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div><div style="display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 44px; box-sizing: border-box; border-bottom: 1px solid var(--surface-line);"><span style="width: 28px; height: 28px; border-radius: 8px; background: var(--surface-line); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 006 0l3-3a4 4 0 00-6-6l-1 1M14 10a4 4 0 00-6 0l-3 3a4 4 0 006 6l1-1"></path></svg></span><div style="flex-grow: 1; min-width: 0;"><div style="font-size: 12px; color: var(--text-meta);">Link · Person</div><div style="font-size: 16px; overflow-wrap: anywhere;">Ana Díaz</div></div><button aria-label="Remove Ana Díaz" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--stroke-strong)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div><div style="display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 44px; box-sizing: border-box;"><span style="width: 28px; height: 28px; border-radius: 8px; background: var(--surface-line); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span><div style="flex-grow: 1; min-width: 0;"><div style="font-size: 12px; color: var(--text-meta);">Photo</div><div style="font-size: 16px; overflow-wrap: anywhere;">1 photo</div></div><button aria-label="Remove 1 photo" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--stroke-strong)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 312px; height: 52px; border-radius: 26px; border: 1px solid var(--glass-bar); background: var(--glass-key); box-shadow: 0 6px 20px var(--shadow-card); display: flex; align-items: center; justify-content: space-around;">
    <button aria-label="Date and time" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--list-mustard); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--on-fill)" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18"></path></svg>
    </button>
    <button aria-label="Tag" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"></path></svg>
    </button>
    <button aria-label="Star" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"></path></svg>
    </button>
    <button aria-label="Link a person, note or event" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 006 0l3-3a4 4 0 00-6-6l-1 1M14 10a4 4 0 00-6 0l-3 3a4 4 0 006 6l1-1"></path></svg>
    </button>
    <button aria-label="Photo" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

}

</body>
</html>
