iv><div style="margin-top: 4px;"><span style="font-size: 28px; font-weight: 700; letter-spacing: -0.3px;">31:04</span></div></div><div style="background: var(--ds-bgElev); border-radius: 16px; padding: 12px 14px;"><div style="font-size: 13px; color: var(--ds-textFaint);">Average pace</div><div style="margin-top: 4px;"><span style="font-size: 28px; font-weight: 700; letter-spacing: -0.3px;">5:58</span> <span style="font-size: 15px; color: var(--ds-textFaint); font-weight: 500;">/km</span></div></div><div style="background: var(--ds-bgElev); border-radius: 16px; padding: 12px 14px;"><div style="font-size: 13px; color: var(--ds-textFaint);">Active energy</div><div style="margin-top: 4px;"><span style="font-size: 28px; font-weight: 700; letter-spacing: -0.3px;">352</span> <span style="font-size: 15px; color: var(--ds-textFaint); font-weight: 500;">kcal</span></div></div><div style="background: var(--ds-bgElev); border-radius: 16px; padding: 12px 14px;"><div style="font-size: 13px; color: var(--ds-textFaint);">Average heart rate</div><div style="margin-top: 4px;"><span style="font-size: 28px; font-weight: 700; letter-spacing: -0.3px;">148</span> <span style="font-size: 15px; color: var(--ds-textFaint); font-weight: 500;">bpm</span></div></div><div style="background: var(--ds-bgElev); border-radius: 16px; padding: 12px 14px;"><div style="font-size: 13px; color: var(--ds-textFaint);">Elevation gain</div><div style="margin-top: 4px;"><span style="font-size: 28px; font-weight: 700; letter-spacing: -0.3px;">42</span> <span style="font-size: 15px; color: var(--ds-textFaint); font-weight: 500;">m</span></div></div></div><p style="margin: 14px 24px 0; font-size: 13px; color: var(--ds-textFaint); line-height: 1.45;">Recorded by Srikanth’s Apple Watch, read from Apple Health. Route and splits stay in Apple Health.</p>
