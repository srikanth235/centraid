<!-- A refreshed device environment reloads the same photograph without discarding its refusal, receipt, Undo or in-flight copy. Cancelling the native copy chooser hands over zero files and remains quiet: no Sent or Saved claim. A completed one-file handoff keeps its existing receipt. -->
