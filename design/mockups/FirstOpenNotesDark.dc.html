<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes, first open (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div data-theme="dark" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--surface-page); font-family: Geist, system-ui, sans-serif; color: var(--text-ink);">
  <div style="display: flex; align-items: flex-start; justify-content: space-between; padding: 56px 20px 8px;">
    <h1 style="margin: 4px 0 0; flex: 1; min-width: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">Notes</h1>
    <div style="display: flex; gap: 8px;">
      <button aria-label="Filter and sort" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-85); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8z" stroke-linejoin="round"></path></svg>
      </button>
      <a href="NoteEditorDark.dc.html" aria-label="New note" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--app-notes-fill); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--on-fill)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </a>
    </div>
  </div>
  <p style="margin: 0 20px 14px; font-size: 13px; color: var(--text-meta);">2 notes</p>
  <div style="margin: 0px 20px 0; background: var(--surface-card); border-radius: 16px; padding: 24px 20px 20px; display: flex; flex-direction: column; align-items: center; text-align: center;">
    <span style="width: 52px; height: 52px; border-radius: 26px; background: var(--fill-f6efd8); display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--app-notes)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"></path><path d="M4 17a2 2 0 0 1 2-2h13"></path></svg></span>
    <div style="font-size: 18px; font-weight: 600; margin-top: 12px; line-height: 1.3;">Write down what you want to keep.</div>
    <div style="font-size: 13px; color: var(--text-meta); margin-top: 10px;">Tap + to write one.</div>
  </div>
  <div style="font-size: 13px; color: var(--text-meta); margin: 22px 32px 6px;">TO GET YOU STARTED</div>
  <div style="margin: 0 16px; background: var(--surface-card); border-radius: 16px; overflow: hidden;">
    <div style="padding: 11px 14px; border-bottom: 1px solid var(--surface-line);">
      <div style="font-size: 16px; font-weight: 600;">Link with [[</div>
      <div style="font-size: 13px; color: var(--text-body); margin-top: 3px;">Type [[ in a note to link to another one.</div>
      <div style="font-size: 13px; color: var(--text-meta); margin-top: 2px;">Edited today</div>
    </div>
    <div style="padding: 11px 14px;">
      <div style="font-size: 16px; font-weight: 600;">This note is yours</div>
      <div style="font-size: 13px; color: var(--text-body); margin-top: 3px;">Change it, or move it to trash.</div>
      <div style="font-size: 13px; color: var(--text-meta); margin-top: 2px;">Edited today</div>
    </div>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 8px;">
    <button aria-label="Home" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; border: 1px solid var(--glass-70); background: var(--glass-72); box-shadow: 0 6px 20px var(--shadow-8); display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"></path></svg>
    </button>
    <div style="flex-grow: 1; height: 56px; border-radius: 28px; border: 1px solid var(--glass-70); background: var(--glass-72); box-shadow: 0 6px 20px var(--shadow-8); display: flex; align-items: center; justify-content: space-around; font-size: 11px;">
      <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-ink); font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 11h7M9 15h7"></path></svg>Notes</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-meta);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"></path><path d="M5 17a3 3 0 013-3h11"></path></svg>Notebooks</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-meta);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg>Journal</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-meta);"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>More</span>
    </div>
    <button aria-label="Search" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; border: 1px solid var(--glass-70); background: var(--glass-72); box-shadow: 0 6px 20px var(--shadow-8); display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

renderVals() { return {}; }
}

</body>
</html>
