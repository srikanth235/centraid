<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}button{font:inherit;color:inherit}</style>

<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--surface-page);font-family:Geist,system-ui,sans-serif;color:var(--text-ink);">
  <div style="display:flex;align-items:center;gap:8px;padding:52px 16px 12px;">

  <p style="margin:4px 20px 16px;color:var(--text-meta);font-size:14px;line-height:1.4;">Choose the kind of health data to save.</p>
  <div style="margin:0 16px;background:var(--surface-card);border-radius:16px;overflow:hidden;">
    <button style="width:100%;height:60px;padding:0 16px;text-align:left;border:0;border-bottom:1px solid var(--surface-line);background:none;font-size:16px;">Daily measurements</button>
    <button style="width:100%;height:60px;padding:0 16px;text-align:left;border:0;border-bottom:1px solid var(--surface-line);background:none;font-size:16px;">Readings</button>
    <button style="width:100%;height:60px;padding:0 16px;text-align:left;border:0;background:none;font-size:16px;">Workouts</button>
  </div>
</div>
