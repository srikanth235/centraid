<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photos video viewer (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div data-theme="dark" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--surface-page); font-family: Geist, system-ui, sans-serif; color: var(--text-ink);">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 8px;">
    <a href="PhotosLibraryDark.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-card); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="text-align: center;">
      <div style="font-size: 16px; font-weight: 600;">4 November 2026</div>
      <div style="font-size: 13px; color: var(--text-meta);">07:48 · Cubbon Park</div>
    </div>
    <button aria-label="More" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--glass-card); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text-ink)" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </button>
  </div>

  <div role="img" aria-label="Public motion video preview" style="position: absolute; left: 0; right: 0; top: 120px; bottom: 104px; background: linear-gradient(145deg, var(--chip-ink) 0%, var(--chip-graphite) 50%, var(--chip-ink) 100%);"></div>

  <div aria-label="Video playback controls" style="position: absolute; left: 0; right: 0; bottom: 104px; height: 52px; padding: 4px 20px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; background: var(--surface-page); color: var(--text-ink);">
    <button aria-label="Pause" style="width: 44px; height: 44px; flex-shrink: 0; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg>
    </button>
    <div role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="60" aria-valuenow="25" style="position: relative; flex: 1; height: 28px; display: flex; align-items: center;"><div style="width: 100%; height: 2px; background: var(--surface-border);"></div><div style="position: absolute; width: 42%; height: 2px; background: var(--chip-ink);"></div></div>
    <span style="font-size: 12px; color: var(--text-meta); white-space: nowrap;">0:25 / 1:00</span>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 56px; border-radius: 28px; border: 1px solid var(--glass-bar); background: var(--glass-bar); box-shadow: 0 6px 20px var(--shadow-card); display: flex; align-items: center; justify-content: space-around;">
    <button aria-label="Send a copy" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M5 12v8h14v-8"></path></svg>
    </button>
    <button aria-label="Star" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"></path></svg>
    </button>
    <button aria-label="Info" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--app-photos)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg>
    </button>
    <button aria-label="Edit" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg>
    </button>
    <button aria-label="Archive" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"></rect><path d="M5 9v11h14V9M10 13h4"></path></svg>
    </button>
    <button aria-label="Trash" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
