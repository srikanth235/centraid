        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2EFEA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8z" stroke-linejoin="round"/></svg>

      <button aria-label="New reminder" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #3077CD; display: flex; align-items: center; justify-content: center;">

      <div style="display: flex; justify-content: space-between; align-items: flex-start;">

    </div>

  <div style="margin: 28px 20px 0; background: #1F1E1C; border-radius: 16px; padding: 24px 20px 20px; display: flex; flex-direction: column; align-items: center; text-align: center;">

    <div style="font-size: 18px; font-weight: 600; margin-top: 12px; line-height: 1.3;">Add the first thing you must not forget.</div>
    <button style="margin-top: 16px; height: 48px; padding: 0 24px; border-radius: 24px; border: none; background: #3077CD; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px;">

    </button>
    <div style="font-size: 13px; color: #A39E95; margin-top: 10px;">Or tap + to write one.</div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 8px;">

    </button>
    <div style="flex-grow: 1; height: 56px; border-radius: 28px; background: rgba(44,42,39,0.72); border: 1px solid #3A3733; box-shadow: 0 6px 20px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: space-around; font-size: 11px;">
      <a href="CalendarDark.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #A39E95;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/></svg>Calendar</a>
      <span aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #F2EFEA; font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="7" r="2"/><circle cx="5" cy="17" r="2"/><path d="M10 7h11M10 17h11"/></svg>Reminders</span>

      <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #A39E95;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</span>
    </div>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2EFEA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
  </div>
</div>
