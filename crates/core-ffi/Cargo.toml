[package]
name = "centraid-core-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_core_ffi"
path = "src/lib.rs"
# Both: `cdylib` is what a shell links (`libcentraid_core_ffi.so`, `.dylib`,
# `.dll`) and what the symbol-count test runs `nm` over; `rlib` is what this
# crate's own tests link so they can call the entry points directly as well as
# through `libloading` on the built cdylib.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Forwarded to `centraid-core`, where the panic is. See its `debug-fault`.
debug-fault = ["centraid-core/debug-fault"]

[dependencies]
centraid-api-proto = { path = "../api-proto" }
centraid-core = { path = "../core" }
centraid-vault = { path = "../vault" }
rusqlite.workspace = true
prost.workspace = true
serde_json.workspace = true

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
centraid-ontology = { path = "../ontology" }
libloading = "0.8"
cbindgen = "0.29"
centraid-protocol = { path = "../protocol" }
centraid-core = { path = "../core" }
rusqlite.workspace = true
