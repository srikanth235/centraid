// A CONTAINER AS A SEARCH RESULT (#1097, R-1097-19..21): the notebook, project
// or Docs folder a member typed the name of.
//
// One message shared by the three owning apps' own search answers
// (`NotesSearch.containers`, `TasksSearch.containers`, `DocsSearch.containers`),
// so a shell draws a container the same way wherever it
// is found. Home carries the same fact as a `VaultSearchHit` (`vault_search.proto`),
// which has its own subtitle and day and so does not use this.
//
// Photos' albums in Photos' own search ride `PhotosSearch.albums`
// (`photos.proto`, #1097, R-1097-25): the same message, narrowed to the rows
// that open in Photos.

syntax = "proto3";

package centraid.core.v1;

message ContainerHit {
  // The entity kind of the index row: `notebook`, `album`, `project` or `folder`
  // (a Docs folder). `app_id` is the app it opens in.
  string entity = 1;
  // The row's own primary key in that index.
  string id = 2;
  // What the container is called.
  string title = 3;
  // The app the container opens in: `notes`, `photos`, `tasks`, `docs`.
  string app_id = 4;
  // The index's highlight of the match, or empty.
  string snippet = 5;
  // 6 was `open_id`, the Tally group's id (a group was a circle in the index and
  // a `tally_group` in Tally). The circle index left with Tally (#1099); every
  // container opens by `id` (a notebook, album or folder by its container id, a project
  // by its project id).
  reserved 6;
  reserved "open_id";
}
