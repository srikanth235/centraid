// THE SCREEN RUNTIME'S WIRE (#1135, lane C2). Every decision a person sees is
// made in Rust: a screen is a state machine (`crates/screens`) that takes a
// `ScreenEvent` and yields a `ViewState` and `Effect`s. SwiftUI and Compose draw
// the view state, send events, and perform effects — they own no copy, no count,
// no timer and no route.
//
// IT RIDES THE ONE `Envelope` (`Request.screen`, `Response.screen`,
// `Event.screen`), so the ABI stays five symbols.
//
// HOW AN APP LANE ADDS A SCREEN: one arm in each of `Route.args`,
// `ScreenEvent.kind` and `ViewState.kind`, in the app's reserved range (below),
// and its messages in its own file (`<app>_screens.proto`) imported here.
// Reserved arm ranges: 10-19 proof, 100-199 agenda, 200-299 docs, 300-399
// health, 400-499 locker, 500-599 money, 600-699 notes, 700-799 people, 800-899
// photos, 900-999 the kit (trash), 1000-1999 the shell (Home, search, chat,
// onboarding, backup).
//
// WHERE THE MESSAGES LIVE: the `Route` and its argument messages in
// `route.proto`, the shared view vocabulary (`Failure`, `Loading`, `Denied`,
// `EmptyState`, `StatusLine`, ...) in `kit_screens.proto`, an app's own in
// `<app>_screens.proto`. All three are leaves that this file imports, so a view
// can name a `Route` without a cycle.

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/assist.proto";
import "centraid/core/v1/chat_screens.proto";
import "centraid/core/v1/imports_screens.proto";
import "centraid/core/v1/backup_screens.proto";
import "centraid/core/v1/custody_screens.proto";
import "centraid/core/v1/pair_screens.proto";
import "centraid/core/v1/passes_screens.proto";
import "centraid/core/v1/plumbing_screens.proto";
import "centraid/core/v1/kit_screens.proto";
import "centraid/core/v1/notify_screens.proto";
import "centraid/core/v1/route.proto";
import "centraid/core/v1/vault_screens.proto";
import "centraid/core/v1/shell_home_screens.proto";
import "centraid/core/v1/shell_search_screens.proto";
import "centraid/core/v1/shell_settings_screens.proto";

// ---------------------------------------------------------------------------
// The door
// ---------------------------------------------------------------------------

message ScreenRequest {
  oneof kind {
    // The shell reports a tap on a link or a back-swipe; Rust moves the stack.
    NavEvent nav = 1;
    // An event for one open screen.
    InstanceEvent send = 2;
    // Everything again: the navigation and every open screen's view state. A
    // shell asks after it was suspended or restarted its views.
    SnapshotRequest snapshot = 3;
    // The device's locale and time zone. Rust formats every string and civil
    // reading from these; a shell reports them at start and when they change.
    Environment environment = 4;
    // The app went to the background or came back. The runtime tells every open
    // screen (`AppLifecycle`): a Locker relocks the instant it leaves.
    AppLifecycle lifecycle = 5;
    // A fact the shell reports about the phone: the link, a background window
    // the OS granted, the vaults held, a finished import or restore, an upload
    // the OS finished (`passes_screens.proto`). The runtime hands it to every
    // open screen and service as `ScreenEvent.shell_fact`.
    ShellFact shell_fact = 1500;
    // The operating system is asking for memory back (iOS
    // `didReceiveMemoryWarning`, Android `onTrimMemory`). The runtime tells every
    // open screen and service (`ScreenEvent.memory_warning`); the shelf closes
    // every vault's core but the one in front.
    MemoryWarning memory_warning = 1560;
  }
}

// iOS `scenePhase == .background` (NOT `.inactive`, which a system prompt
// causes); Android `ON_STOP` (NOT `ON_PAUSE`).
message AppLifecycle {
  bool foreground = 1;
}

message SnapshotRequest {}

message Environment {
  // A BCP 47 tag, e.g. `en`. An unknown locale falls back to English.
  string locale = 1;
  // An IANA zone, e.g. `Asia/Kolkata`.
  string zone = 2;
  // The OS the shell runs on: `ios` or `android`. Health names the phone's own
  // health store by it; nothing else varies by it.
  string platform = 3;
  // The platform deletes from its photo library behind its own confirmation
  // (iOS PhotoKit; Android 11 and later). False draws no "Free up space" row:
  // an action the phone cannot take is not offered (#1080 A20).
  bool library_deletes = 4;
  // The phone's own 12/24-hour preference, so every time the core words reads
  // as the phone does ("9:00 AM", not "09:00"). iOS: the template "j" of
  // `DateFormatter.dateFormat(fromTemplate:options:locale:)` contains "a";
  // Android: `DateFormat.is24HourFormat(context)` is false. False (the
  // default, and what a shell that never says reports) is 24-hour.
  bool hour_cycle_12 = 5;
}

// A timer elapsed (`Event.wake`). Internal to the core: see `next_event`.
message ScreenWake {}

// A job a screen started with `Ctx::off_thread` finished on its worker thread
// (`Event.job_done`). Internal to the core, like `ScreenWake`: `next_event`
// hands it to the runtime and never to a shell.
message ScreenJobDone {
  uint64 job = 1;
  bytes bytes = 2;
}

// What the asking screen hears when its job is done. Delivered like a timer.
message OffThreadDone {
  // The tag the screen gave the job.
  string tag = 1;
  bytes bytes = 2;
}

// The answer to every `ScreenRequest`, and the body of every pushed
// `Event.screen`: what changed, in one message, so a shell applies one update
// and draws once.
message ScreenUpdate {
  // Present only when the stack or the selected tab moved.
  optional Navigation navigation = 1;
  // The views whose state moved, each with a revision a renderer uses to drop
  // an update it has already surpassed.
  repeated ViewState views = 2;
  // Platform work the shell is asked to perform. Each is answered with a
  // `ScreenEvent.effect_result` carrying the same `effect_id`.
  repeated EffectRequest effects = 3;
  // Instances closed by this update (popped off a stack): a shell frees their
  // view models.
  repeated uint64 closed = 4;
  // Small changes to views the shell already holds, applied in order after `views`. A delta whose
  // `base` is not the held view's revision is dropped: the next full view repairs it.
}

message ScreenResponse {
  ScreenUpdate update = 1;
}

// ---------------------------------------------------------------------------
// Navigation: a route stack per tab, owned by Rust
// ---------------------------------------------------------------------------

message Navigation {
  string selected_tab = 1;
  repeated TabStack tabs = 2;
  // Monotonic: a renderer drops a navigation older than the one it drew.
  uint64 revision = 3;
  // THE BAND (#1135): the places a tab root is framed by, Rust's to word and to
  // light. A shell draws it under a tab's root and sends `select_tab` for a press.
  ShellBand band = 4;
}

message TabStack {
  string tab = 1;
  // Root first.
  repeated StackEntry entries = 2;
}

message StackEntry {
  // The screen instance this entry shows; `ViewState.instance` names it.
  uint64 instance = 1;
  Route route = 2;
}

message NavEvent {
  oneof kind {
    NavPush push = 1;
    // The shell already popped visually (a back-swipe or the back button); Rust
    // drops the instance and everything above it.
    NavPopped popped = 2;
    NavSelectTab select_tab = 3;
    // Pop to the root of a tab: the apps' Home control sends it (`RustRoot.popToRoot`
    // on Android, `ShellModel.popToRoot()` on iOS), not a second tap on the tab.
    NavPopToRoot pop_to_root = 4;
  }
}

message NavPush {
  string tab = 1;
  Route route = 2;
}

message NavPopped {
  string tab = 1;
  uint64 instance = 2;
}

message NavSelectTab {
  string tab = 1;
}

message NavPopToRoot {
  string tab = 1;
}

// ---------------------------------------------------------------------------
// Events: what a shell (or the runtime itself) says to a screen
// ---------------------------------------------------------------------------

message InstanceEvent {
  uint64 instance = 1;
  ScreenEvent event = 2;
}

message ScreenEvent {
  // 404 was `locker.access`'s event, gone with the Locker's access history (#1146).
  reserved 404;
  reserved "locker_access";
  // 503 was `money.search`: Money searches in place (owner, 2026-11-19).
  reserved 503;
  reserved "money_search";
  // 806 and 807 were Photos' Duplicates and its review, retired (#1146 D5).
  reserved 806, 807;
  reserved "photos_duplicates", "photos_duplicate_review";
  // 203 and 602 were `docs.versions` and `notes.history`, replaced by the kit's earlier-versions
  // screen (#1185).
  reserved 203, 602;
  reserved "docs_versions", "notes_history";
  oneof kind {
    // The screen came into view. The first one loads.
    Appeared appeared = 1;
    // A shell answers an `EffectRequest`.
    EffectResult effect_result = 2;
    // RUNTIME-ORIGINATED: a timer the screen started has elapsed. A shell never
    // sends it.
    TimerFired timer_fired = 3;
    // RUNTIME-ORIGINATED: a table the screen read has changed. A shell never
    // sends it.
    DataChanged data_changed = 4;
    // RUNTIME-ORIGINATED: the locale or zone changed.
    EnvironmentChanged environment_changed = 5;
    // RUNTIME-ORIGINATED: the app left or returned to the foreground.
    AppLifecycle lifecycle = 7;
    // RUNTIME-ORIGINATED: a job the screen started off the runtime's lock
    // (`Ctx::off_thread`) has finished.
    OffThreadDone off_thread_done = 8;
    // RUNTIME-ORIGINATED: the screen is being popped. Its last chance to write
    // what the member typed (an autosave's pending edit); a shell never sends
    // it, and only its `act`s survive: the view is no longer drawn.
    Left left = 6;
    // RUNTIME-ORIGINATED: the screen's tab went out of view (another tab was
    // selected) while the screen stays on its stack. A screen with an OS prompt
    // out withdraws it; a shell never sends it.
    TabHidden tab_hidden = 12;
    // RUNTIME-ORIGINATED: the assistant's running turn said something (a token,
    // the cards, the answer). Only a screen that opts in (`hears_assist`, the
    // chat) hears it; a shell never sends it.
    AssistEvent assist = 11;
    CounterEvent counter = 10;
    // RUNTIME-ORIGINATED: a screen asked the shell to act on a topic
    // (`Announce`), and every open screen, services included, hears it.
    Announced announced = 9;
    // ---- words (1300-1399, lane H2): custody_screens.proto ----
    WordsMakeEvent words_make = 1300;
    WordsEnterEvent words_enter = 1301;
    WordsShowEvent words_show = 1302;
    // ---- agenda (100-199) ----
    // ---- photos (800-899) ----
    // ---- locker (400-499) ----
    // ---- money (500-599) ----
    // ---- docs (200-299) ----
    // ---- notes (600-699) ----
    // ---- people (700-799) ----
    // ---- pairing (1400-1449, lane H2) ----
    PairLaptopEvent pair_laptop = 1400;
    // ---- the kit (900-999) ----
    TransferEvent transfer = 901;
    // The action under a "phone says" line, from any page that draws one (#1183).
    // The earlier-versions screen (#1185).
    // The verb of any status line ("Undo"), from any screen; no per-screen arm is needed (#1185).
    StatusActed status_acted = 904;
    // ---- backup (1450-1499, lane H2) ----
    BackupHomeEvent backup_home = 1450;
    BackupCheckEvent backup_check = 1451;
    // ---- passes (1500-1599): passes_screens.proto ----
    // RUNTIME-ORIGINATED from `ScreenRequest.shell_fact`.
    ShellFact shell_fact = 1500;
    // RUNTIME-ORIGINATED: another screen called `Ctx::post` with it (the pass
    // conductor's wake, to the pass and vault services).
    Signalled signalled = 1501;
    // RUNTIME-ORIGINATED: the camera-roll service's report to the pass service.
    // ---- the vault shelf (1560-1599, lane H2): vault_screens.proto ----
    // RUNTIME-ORIGINATED from `ScreenRequest.memory_warning`.
    MemoryWarning memory_warning = 1560;
    // RUNTIME-ORIGINATED, to services only: a screen asked the shelf for
    // something (Home's `VaultCommand` effect, which never reaches a shell).
    VaultCommand vault_commanded = 1561;
    // RUNTIME-ORIGINATED, to services only: a screen was opened.
    ScreenOpened screen_opened = 1562;
    // ---- the shell (1000-1999): chat (1600-1699) ----
    // ---- the shell: phone imports (1700-1899) ----
    // ---- the shell (1000-1999): Home 1000-1299 ----
    HomeEvent home = 1000;
    SettingsEvent settings = 1010;
  }
}

message Appeared {}

message TimerFired {
  // The screen's own name for the timer.
  string timer = 1;
}

message EnvironmentChanged {}

// A topic a screen announced (`Announce`), as the runtime relays it to every
// open screen. The shell performs its own half of the announcement and sends
// nothing back.
message Announced {
  string topic = 1;
}

message Left {}

message TabHidden {}

message DataChanged {
  repeated string tables = 1;
}

// ---------------------------------------------------------------------------
// View state: finished, ready to draw
// ---------------------------------------------------------------------------

message ViewState {
  uint64 instance = 1;
  uint64 revision = 2;
  // 403 was `locker.access`'s state, gone with the Locker's access history (#1146).
  reserved 403;
  reserved "locker_access";
  // 503 was `money.search`: Money searches in place (owner, 2026-11-19).
  reserved 503;
  reserved "money_search";
  // 806 and 807 were Photos' Duplicates and its review, retired (#1146 D5).
  reserved 806, 807;
  reserved "photos_duplicates", "photos_duplicate_review";
  // 203 and 602 were `docs.versions` and `notes.history`, replaced by the kit's earlier-versions
  // screen (#1185).
  reserved 203, 602;
  reserved "docs_versions", "notes_history";
  oneof kind {
    CounterView counter = 10;
    // ---- words (1300-1399, lane H2) ----
    WordsMakeState words_make = 1300;
    WordsEnterState words_enter = 1301;
    WordsShowState words_show = 1302;
    // ---- agenda (100-199) ----
    // ---- photos (800-899) ----
    // ---- locker (400-499) ----
    // ---- money (500-599) ----
    // ---- docs (200-299) ----
    // ---- notes (600-699) ----
    // ---- people (700-799) ----
    // ---- pairing (1400-1449, lane H2) ----
    PairLaptopState pair_laptop = 1400;
    // ---- the kit (900-999) ----
    TransferView transfer = 901;
    // ---- backup (1450-1499, lane H2) ----
    BackupHomeState backup_home = 1450;
    BackupCheckState backup_check = 1451;
    // ---- the shell (1000-1999): chat (1600-1699) ----
    // ---- the shell: phone imports (1700-1899) ----
    // ---- the shell (1000-1999): Home 1000-1299 ----
    SettingsState settings = 1010;
  }
}

// ---------------------------------------------------------------------------
// Effects: platform work the shell performs
// ---------------------------------------------------------------------------

message EffectRequest {
  // Unique per runtime; the answer names it.
  uint64 effect_id = 1;
  // The screen that asked, and that the answer returns to.
  uint64 instance = 2;
  Effect effect = 3;
}

message Effect {
  oneof kind {
    ClipboardSet clipboard_set = 1;
    ClipboardClear clipboard_clear = 2;
    Haptic haptic = 3;
    Share share = 4;
    OpenUrl open_url = 5;
    KeychainOp keychain = 9;
    ScreenshotShield screenshot_shield = 10;
    // The phone's own owner check: biometric, device passcode as fallback.
    OwnerCheck owner_check = 14;
    // Let the member choose a file and hand its bytes back.
    PickBytes pick_bytes = 15;
    // Hand bytes to the OS save sheet, the only place a file is written.
    SaveFile save_file = 16;
    // Tell the shell something happened it may act on (a Locker unlock).
    Announce announce = 17;
    // ---- photos (#1135, lane D) ----
    ExportOriginals export_originals = 22;
    CameraRoll camera_roll = 23;
    // Clear only a still-matching sensitive Locker copy owned by this vault.
    // The shell carries only a digest/owner lease across process restart.
    ClipboardClearOwned clipboard_clear_owned = 28;
    // Open the OS maps app at an address (People's address channel).
    OpenMap open_map = 19;
    // Open a page now, wherever the member is: the shell pushes `route` as a
    // tapped row's route is pushed. For a screen that makes a thing and
    // opens it (a document just filed).
    OpenRoute open_route = 20;
    // ---- agenda (100-199): notifications (#1173, `notify_screens.proto`) ----
    // Make the OS hold exactly this set of reminders and alerts.
    ScheduleNotifications schedule_notifications = 120;
    OpenNotificationSettings open_notification_settings = 121;
    // ---- docs (200-299): files ----
    // ---- agenda (100-199): outside the app ----
    // Keep the widgets' snapshot: write the document to the shared container,
    // then reload the widgets (`agenda_glance_screens.proto`). 150 stays clear
    // of a parallel notifications branch.
    // ---- health (300-399): outside the app ----
    // Keep the Health widget's snapshot (`health_glance_screens.proto`).
    PickFile pick_file = 200;
    // Hand one document's file to the platform's share sheet.
    // Hand one small item made in memory (a note, a vCard) to the platform's share sheet as a file.
    // Offer a file already on disk (a streamed export) to the OS save sheet, copied by streaming.
    SaveFilePath save_file_path = 205;
    // ---- pairing (1340-1349, lane H2): pair_screens.proto ----
    ScanCode scan_code = 1340;
    BrowseGateways browse_gateways = 1341;
    // ---- vault plumbing (1300-1399, lane H2): plumbing_screens.proto ----
    SecretBatch secrets = 1300;
    SyncedSecretsProbe synced_probe = 1302;
    // ---- backup (1350-1369, lane H2): backup_screens.proto ----
    BackgroundProbe background_probe = 1350;
    // ---- passes (1370-1399, lane H2): passes_screens.proto ----
    ScheduleWindows schedule_windows = 1370;
    PassWindowDone pass_window_done = 1371;
    LongRun long_run = 1372;
    UploadsOp uploads = 1373;
    // ---- the shell (1000-1999): chat (1600-1699) ----
    ModelDownload model_download = 1600;
    DeleteModelFile delete_model_file = 1602;
    // ---- the shell: phone imports (1700-1899) ----
    RollPage roll_page = 1701;
    LibraryStage library_stage = 1703;
    LibraryDerivatives library_derivatives = 1704;
    // ---- the shell (1000-1999) ----
    // Home asks the shell to act on the vaults the phone holds.
    VaultCommand vault_command = 1000;
    // Select a tab: the runtime performs it itself (the shell hears the new
    // `Navigation`), so no destination is ever named in Swift or Kotlin.
    SelectTab select_tab = 1001;
  }
  // `FetchOriginal` and `FreeUpSpace`: Rust calls the core's `fetch_original`,
  // `census`, `releasable` and `released` itself and asks the shell only
  // `LibraryDelete`. `StreamFromLibrary`: the camera roll serves the bytes a
  // pass asks for again.
  reserved 21, 24, 1374;
  // 6, 7 and 11 were `pick_photos`, `capture_photo` and `schedule_notification`:
  // no screen asked for them and neither shell performed them (#1152).
  reserved 6, 7, 11;
  reserved "pick_photos", "capture_photo", "schedule_notification";
  // 1708 was `calendar_write`: the phone's calendars are followed one way and nothing is written
  // back to them (#1183).
  reserved 1708;
  reserved "calendar_write";
}

message ClipboardSet {
  string text = 1;
  // A secret is marked so the OS keeps it out of clipboard history.
  bool sensitive = 2;
  // When the clip must be gone, in milliseconds from the set; 0 keeps it. A
  // shell persists the deadline and digest with the clip, so a process killed
  // before the Rust timer fires still clears it. The Rust timer's
  // `ClipboardClear` is the same conditional clear while the app lives.
  uint64 clear_after_ms = 3;
  // Set only for sensitive Locker copies; empty for ordinary clipboard writes.
  // Lets an explicit Lock clear its copy after a process restart without
  // persisting the secret text in the shell.
  string owner_vault_id = 4;
}

// Clears the clipboard only if it still holds what the core put there.
message ClipboardClear {
  string expected_text = 1;
}

// Clears a sensitive Locker copy only when its current shell-owned lease is
// still for `vault_id` and the clipboard still matches that lease's digest.
// Carries no secret text.
message ClipboardClearOwned {
  string vault_id = 1;
}

enum HapticKind {
  HAPTIC_KIND_UNSPECIFIED = 0;
  HAPTIC_KIND_SELECTION = 1;
  HAPTIC_KIND_SUCCESS = 2;
  HAPTIC_KIND_WARNING = 3;
  HAPTIC_KIND_ERROR = 4;
}

message Haptic {
  HapticKind kind = 1;
}

message Share {
  string text = 1;
  string url = 2;
  // Already localized: it is shown by the OS share sheet.
  string subject = 3;
}

message OpenUrl {
  string url = 1;
}

message KeychainOp {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_GET = 1;
    OP_SET = 2;
    OP_DELETE = 3;
  }
  Op op = 1;
  string key = 2;
  // For `OP_SET`.
  bytes value = 3;
}

message ScreenshotShield {
  bool on = 1;
}

message OpenMap {
  // An address, as the member wrote it.
  string query = 1;
}

// ---------------------------------------------------------------------------
// Photos' platform work (#1135, lane D). Four effects the screens of Photos
// share: the lightbox, the library and a shelf each ask for the same fetch and
// the same hand-off, so they are named here once. Every sentence a member reads
// about their outcome is Rust's (`photos::fetch`, `photos::keep_originals`,
// `strings::photos_home`); the shell reports what happened as a closed enum.
// ---------------------------------------------------------------------------

// HAND THE ORIGINALS OF A PICK TO THE PLATFORM: its share sheet (`MODE_SEND`) or
// this device's own photo library (`MODE_SAVE`). The shell finds each original
// on this phone, takes the location out of the file unless `keep_location`
// (failing closed: a file whose place cannot be removed is not sent, #816), and
// answers `OriginalsExported`.
message ExportOriginals {
  repeated string photo_ids = 1;
  Mode mode = 2;
  // The share sheet's title ("Send a copy").
  // The stems the copied files are named by, `<stem> <n>.<ext>`: a
  // photograph's ("Photo") and a video's ("Video").
  // `MODE_ARCHIVE` supplies one OS original to a Rust-owned aggregate ZIP.
  // These are the immutable descriptor from `VaultExportResponse`, not a
  // request for the shell to re-read the current photo row.
  string export_job_id = 7;
  string export_photo_id = 8;
  string export_os_ref = 9;
  uint64 export_byte_size = 10;
  string export_content_hash = 11;
  string export_media_type = 12;

  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_SEND = 1;
    MODE_SAVE = 2;
    MODE_ARCHIVE = 3;
  }
}

message OriginalsExported {
  Status status = 1;
  // How many originals went, and how many of the pick were not on this phone.
  uint32 handed = 2;
  uint32 missing = 3;
  // Set for `MODE_ARCHIVE`: how the core handled this snapshot original.
  ArchiveDisposition archive_disposition = 4;
  // Opaque Rust stage session id; used for the async ZIP commit, never a path.
  string archive_stage_id = 5;

  enum ArchiveDisposition {
    ARCHIVE_DISPOSITION_UNSPECIFIED = 0;
    ARCHIVE_DISPOSITION_UNREADABLE = 3;
    ARCHIVE_DISPOSITION_UNAVAILABLE = 4;
    ARCHIVE_DISPOSITION_STAGED = 5;
  }

  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The sheet or the library took what was found. (The sheet says what it did.)
    STATUS_DONE = 1;
    // Nothing of the pick is on this phone.
    STATUS_NONE_HERE = 2;
    // A file's location could not be taken out, so nothing was sent.
    STATUS_LOCATION_NOT_REMOVABLE = 3;
    // The platform refused the save or the copy.
    STATUS_FAILED = 4;
    // The phone has no room for the copy (#1202). The core words it, as it does a full phone anywhere.
    STATUS_STORAGE_FULL = 5;
  }
}

// THE CAMERA ROLL'S PLATFORM HALF (#1025 S6). Photos' grid decides what the
// banner says and which remedy it offers; the shell performs the remedy. The
// roll itself (enumerating, uploading) is the shell's own and is not an effect.
// THE PLATFORM'S OWN PHOTO PAGES, which only it can open: this app's page in
// Settings, and iOS's limited selection. The prompt and a walk are the camera
// roll's (`imports.camera_roll`), asked by name.
message CameraRoll {
  Action action = 1;

  enum Action {
    ACTION_UNSPECIFIED = 0;
    // This app's page in Settings.
    ACTION_OPEN_SETTINGS = 2;
    // iOS's limited selection: let the member edit it.
    ACTION_MANAGE_SELECTION = 3;
    // `ACTION_ASK_PERMISSION`, `ACTION_IMPORT_NOW`: the camera roll's.
    reserved 1, 4;
  }
}

// THE OWNER CHECK: iOS `LAContext().evaluatePolicy(.deviceOwnerAuthentication,
// localizedReason: reason)`; Android `BiometricPrompt` with
// `setAllowedAuthenticators(BIOMETRIC_STRONG or DEVICE_CREDENTIAL)`,
// `setTitle(title)` and `setSubtitle(subtitle)` and no negative button. With
// `ask` false it only reads what this phone can do (`OwnerChecked.available`,
// `biometry`) and raises nothing. With `cancel` true it withdraws the prompt
// that is up (iOS `LAContext.invalidate()`, Android
// `BiometricPrompt.cancelAuthentication()`), raises nothing, and answers `Done`:
// Rust sends it when the member leaves Locker before answering, so no prompt
// outlives the screen that asked for it.
message OwnerCheck {
  bool ask = 1;
  string reason = 2;
  string title = 3;
  string subtitle = 4;
  bool cancel = 5;
}

// What this phone can do, as its shell reads it.
enum Biometry {
  BIOMETRY_UNSPECIFIED = 0;
  // A passcode and no biometric enrolled.
  BIOMETRY_PASSCODE = 1;
  BIOMETRY_FACE = 2;
  BIOMETRY_FINGERPRINT = 3;
  // Touch ID's name for the same thing.
  BIOMETRY_TOUCH = 4;
  BIOMETRY_OPTIC = 5;
}

message OwnerChecked {
  // A passcode is set, so the check can succeed.
  bool available = 1;
  Biometry biometry = 2;
  Outcome outcome = 3;

  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // The member passed the check.
    OUTCOME_SUCCEEDED = 1;
    // The member dismissed it. Not a failure.
    OUTCOME_CANCELLED = 2;
    // Not recognised, or the prompt errored.
    OUTCOME_FAILED = 3;
    // No passcode is set (`LAError.passcodeNotSet`; `ERROR_NO_DEVICE_CREDENTIAL`).
    OUTCOME_UNAVAILABLE = 4;
    // Too many attempts (`LAError.biometryLockout`; `ERROR_LOCKOUT*`).
    OUTCOME_LOCKED_OUT = 5;
    // Nothing was asked (`ask` was false).
    OUTCOME_NOT_ASKED = 6;
  }
}

// Ask the member for one small file and read it whole (a Locker import, a bank
// statement). Docs' `PickFile` is the other one: it stages a large file.
message PickBytes {
  // Media types or extensions the picker offers; empty is any file.
  repeated string accept = 1;
  // Several files at once (#1173): each comes back in `BytesPicked.files`.
  bool multiple = 2;
  // A folder, read whole (#1173): every file in it and below it that `accept` names comes back
  // in `BytesPicked.files`, each named by its path below the folder, so a folder of notes is
  // notebooks. Wins over `multiple`.
  bool folder = 3;
  // THE CEILINGS THE IMPORTER WILL READ (#1202), so the shell refuses before it reads: a file larger
  // than `max_bytes` is not read (a single pick answers `Failed` with reason `too_large`; a
  // `multiple` or `folder` pick leaves it out and names it in `BytesPicked.skipped`), and once
  // `max_total_bytes` have been read the rest are left out the same way. 0 is no ceiling.
  uint64 max_bytes = 4;
  uint64 max_total_bytes = 5;
}

// The picked file. The bytes are the member's own and may be secrets in the
// clear: Rust holds them only as long as the screen that asked.
message BytesPicked {
  bool cancelled = 1;
  string name = 2;
  string media_type = 3;
  bytes content = 4;
  // The files of a `multiple` or `folder` pick (`name` is the path below the folder, `/`
  // separated). Empty for a single pick, whose one file is the four fields above.
  repeated PickedBytes files = 5;
  // The files of a `multiple` or `folder` pick that were left out (#1202): one that would not read, one
  // over `PickBytes.max_bytes`, one past `max_total_bytes`. Named as `files` names them, so the screen
  // says how many were left out and never imports fewer in silence.
  repeated string skipped = 6;
}

message PickedBytes {
  string name = 1;
  string media_type = 2;
  bytes content = 3;
}

message SaveFile {
  string name = 1;
  string media_type = 2;
  bytes content = 3;
}

message Announce {
  // `locker.unlocked`.
  string topic = 1;
}

message EffectResult {
  uint64 effect_id = 1;
  oneof outcome {
    EffectDone done = 2;
    EffectFailed failed = 3;
    KeychainValue keychain = 6;
    BytesPicked bytes_picked = 9;
    OwnerChecked owner_checked = 10;
    // ---- photos (#1135, lane D) ----
    OriginalsExported originals_exported = 12;
    // ---- agenda (100-199): notifications (#1173) ----
    NotificationsScheduled notifications_scheduled = 120;
    // ---- docs (200-299): files ----
    // ---- pairing (1340-1349, lane H2) ----
    CodeScanned code_scanned = 1340;
    GatewaysSighted gateways_sighted = 1341;
    // ---- the shell (1000-1999): chat (1600-1699) ----
    // ---- the shell: phone imports (1700-1899) ----
    // ---- vault plumbing (1300-1399, lane H2) ----
    SecretBatched secrets = 1300;
    SyncedSecretsStatus synced_status = 1302;
    // ---- backup (1350-1369, lane H2) ----
    BackgroundStatus background_status = 1350;
    // ---- passes (1370-1399, lane H2) ----
    WindowsScheduled windows_scheduled = 1370;
    UploadsState uploads_state = 1371;
    PassNoted pass_noted = 1373;
  }
  // `OriginalFetched` and `FreeUpFacts`: the fetch and the count are Rust's.
  // `LibraryStreamed`: the camera roll reports to the pass service itself.
  reserved 11, 13, 1372;
  // 4 was `photos` (`PhotosPicked`): no effect asked for it and no shell sent it (#1152).
  reserved 4;
  reserved "photos";
  // 1708 was `calendar_written`, the answer to the write-back `Effect` (#1183).
  reserved 1708;
  reserved "calendar_written";
}

message EffectDone {}

message EffectFailed {
  // Which platform refused, in words for a log; the screen decides what a
  // member reads.
  string reason = 1;
  bool denied = 2;
  // The member dismissed it (a save sheet): not a failure.
  bool cancelled = 3;
  // A GRANT'S STATE, reported and never worded (#1185): the shell says which, Rust says the sentence
  // (`kit::permission`). `denied` is the member's no; `restricted` is a policy that blocks it (parental
  // controls, a managed phone) which no button here can change; `limited` is a grant that is not
  // enough (a chosen selection of photos or contacts, write-only calendar or reminders).
  bool restricted = 4;
  bool limited = 5;
}

message KeychainValue {
  bool found = 1;
  bytes value = 2;
}

// ---------------------------------------------------------------------------
// Files (Docs): pick and stage a file, follow a folder
// ---------------------------------------------------------------------------

message OpenRoute {
  Route route = 1;
}

// Pick one file for the drive's Add sheet: Upload is the system file picker,
// Scan the document camera (its pages written to one PDF). The shell copies the
// choice to a file on this device, STREAMS it through the stage door (a 900 MB
// scan never exists in memory at once), and answers `FilePicked` with the hash
// the core named. While it streams it may answer `FileProgress` any number of
// times under the same `effect_id`. A closed picker is `EffectDone`; a refusal
// is `EffectFailed` (`denied` for a camera or file grant the member refused).
message PickFile {
  Kind kind = 1;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_UPLOAD = 1;
    KIND_SCAN = 2;
    // The photo library's picker, images only (#1173): the choice is staged
    // like an upload and answered as `FilePicked`.
    KIND_PHOTO = 3;
  }
}

// SAVE A FILE ALREADY ON DISK (#1185, take out; owner decision D17: a large export is written as
// a streamed file, never built in memory): the core staged the export at `path` (a file under the
// vault's staging folder, which holds plaintext, so Rust asks the owner check first) and the
// shell offers the platform's save sheet for it and copies it by STREAMING, never reading the
// whole file: iOS `UIDocumentPickerViewController(forExporting:asCopy:)` on the file, Android
// `ACTION_CREATE_DOCUMENT` named `name`, then an input stream copied to the chosen document's
// output stream in fixed-size pieces. Answers `EffectDone` once saved, `EffectFailed` with
// `cancelled` when the sheet is dismissed, `EffectFailed` when the copy fails. The shell deletes
// the staged file whatever the answer was.
message SaveFilePath {
  // Absolute path of the staged file.
  string path = 1;
  // The file's name as the member sees it in the save sheet: "Documents.zip".
  string name = 2;
  string media_type = 3;
}

// ---------------------------------------------------------------------------
// The proof screen (`proof.counter`): how many events are upcoming, one `load`
// over `agenda.upcoming`. Exists to prove the runtime end to end — load, a
// re-render on a change, an effect and a timer — and is deleted when the first
// real screen is ported.
// ---------------------------------------------------------------------------

message CounterEvent {
  oneof kind {
    // The member tapped the count: copy it, and clear the clipboard later.
    CounterCopyTapped copy_tapped = 1;
    CounterRetryTapped retry_tapped = 2;
  }
}

message CounterCopyTapped {}

message CounterRetryTapped {}

message CounterView {
  string title = 1;
  // 2 and 3 were `loading` and `failed`: the read is `page` (#1185).
  reserved 2, 3;
  reserved "loading", "failed";
  // Set when the page is ready.
  oneof content {
    CounterData data = 4;
  }
  // THE READ: loading, failed, or ready.
  PageState page = 5;
  // "Loading…", said under the skeleton while the first read is out.
  string loading_label = 6;
}

message CounterData {
  // "3 upcoming events": plural-aware, finished.
  string count_label = 1;
  string copy_label = 2;
  // "Copied. The clipboard clears in 30 seconds." Empty when nothing was copied.
  string notice = 3;
}
