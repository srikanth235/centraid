// THE SCREEN RUNTIME'S WIRE (#1135, lane C2). Every decision a person sees is
// made in Rust: a screen is a state machine (`crates/screens`) that takes a
// `ScreenEvent` and yields a `ViewState` and `Effect`s. SwiftUI and Compose draw
// the view state, send events, and perform effects — they own no copy, no count,
// no timer and no route.
//
// IN `core.v1` AND NOT `screen.v1`, deliberately. `centraid.screen.v1` is the
// KMP shell's per-screen state package and is deleted with that shell; this file
// is what replaces it, and it rides the one `Envelope` (`Request.screen`,
// `Response.screen`, `Event.screen`) so the ABI stays five symbols.
//
// HOW AN APP LANE ADDS A SCREEN: one arm in each of `Route.args`,
// `ScreenEvent.kind` and `ViewState.kind`, in the app's reserved range (below),
// and its messages in its own file (`<app>_screens.proto`) imported here.
// Reserved arm ranges: 10-19 proof, 100-199 agenda, 200-299 docs, 300-399
// health, 400-499 locker, 500-599 money, 600-699 notes, 700-799 people, 800-899
// photos, 900-999 the kit (trash), 1000-1999 the shell (Home, search, chat,
// onboarding, backup).
//
// WHERE THE MESSAGES LIVE: the `Route` and its argument messages in
// `route.proto`, the shared view vocabulary (`Failure`, `Loading`, `Denied`,
// `EmptyState`, `StatusLine`, ...) in `kit_screens.proto`, an app's own in
// `<app>_screens.proto`. All three are leaves that this file imports, so a view
// can name a `Route` without a cycle.

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/agenda_screens.proto";
import "centraid/core/v1/assist.proto";
