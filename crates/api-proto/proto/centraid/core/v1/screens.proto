import "centraid/core/v1/shell_home_screens.proto";
import "centraid/core/v1/shell_search_screens.proto";

// ---------------------------------------------------------------------------
// The door
// ---------------------------------------------------------------------------

message ScreenRequest {
  oneof kind {
    // The shell reports a tap on a link or a back-swipe; Rust moves the stack.
    NavEvent nav = 1;
    // An event for one open screen.
    InstanceEvent send = 2;
    // Everything again: the navigation and every open screen's view state. A
    // shell asks after it was suspended or restarted its views.
    SnapshotRequest snapshot = 3;
    // The device's locale and time zone. Rust formats every string and civil
    // reading from these; a shell reports them at start and when they change.
    Environment environment = 4;
    // The app went to the background or came back. The runtime tells every open
    // screen (`AppLifecycle`): a Locker relocks the instant it leaves.
    AppLifecycle lifecycle = 5;
    // A fact the shell reports about the phone: the link, a background window
    // the OS granted, the vaults held, a finished import or restore, an upload
    // the OS finished (`passes_screens.proto`). The runtime hands it to every
    // open screen and service as `ScreenEvent.shell_fact`.
    ShellFact shell_fact = 1500;
    // The operating system is asking for memory back (iOS
    // `didReceiveMemoryWarning`, Android `onTrimMemory`). The runtime tells every
    // open screen and service (`ScreenEvent.memory_warning`); the shelf closes
    // every vault's core but the one in front.
    MemoryWarning memory_warning = 1560;
  }
}

// iOS `scenePhase == .background` (NOT `.inactive`, which a system prompt
// causes); Android `ON_STOP` (NOT `ON_PAUSE`).
message AppLifecycle {
  bool foreground = 1;
}

message SnapshotRequest {}

message Environment {
  // A BCP 47 tag, e.g. `en`. An unknown locale falls back to English.
  string locale = 1;
  // An IANA zone, e.g. `Asia/Kolkata`.
  string zone = 2;
  // The OS the shell runs on: `ios` or `android`. Health names the phone's own
  // health store by it; nothing else varies by it.
  string platform = 3;
}

// A timer elapsed (`Event.wake`). Internal to the core: see `next_event`.
message ScreenWake {}

// A job a screen started with `Ctx::off_thread` finished on its worker thread
// (`Event.job_done`). Internal to the core, like `ScreenWake`: `next_event`
// hands it to the runtime and never to a shell.
message ScreenJobDone {
  uint64 job = 1;
  bytes bytes = 2;
}

// What the asking screen hears when its job is done. Delivered like a timer.
message OffThreadDone {
  // The tag the screen gave the job.
  string tag = 1;
  bytes bytes = 2;
}

// The answer to every `ScreenRequest`, and the body of every pushed
// `Event.screen`: what changed, in one message, so a shell applies one update
// and draws once.
message ScreenUpdate {
  // Present only when the stack or the selected tab moved.
  optional Navigation navigation = 1;
  // The views whose state moved, each with a revision a renderer uses to drop
  // an update it has already surpassed.
  repeated ViewState views = 2;
  // Platform work the shell is asked to perform. Each is answered with a
  // `ScreenEvent.effect_result` carrying the same `effect_id`.
  repeated EffectRequest effects = 3;
  // Instances closed by this update (popped off a stack): a shell frees their
  // view models.
  repeated uint64 closed = 4;
}

message ScreenResponse {
  ScreenUpdate update = 1;
}

// ---------------------------------------------------------------------------
// Navigation: a route stack per tab, owned by Rust
// ---------------------------------------------------------------------------

message Navigation {
  string selected_tab = 1;
  repeated TabStack tabs = 2;
  // Monotonic: a renderer drops a navigation older than the one it drew.
  uint64 revision = 3;
  // THE BAND (#1135): the places a tab root is framed by, Rust's to word and to
  // light. A shell draws it under a tab's root and sends `select_tab` for a press.
  ShellBand band = 4;
}

message TabStack {
  string tab = 1;
  // Root first.
  repeated StackEntry entries = 2;
}

message StackEntry {
  // The screen instance this entry shows; `ViewState.instance` names it.
  uint64 instance = 1;
  Route route = 2;
}

message NavEvent {
  oneof kind {
    NavPush push = 1;
    // The shell already popped visually (a back-swipe or the back button); Rust
    // drops the instance and everything above it.
    NavPopped popped = 2;
    NavSelectTab select_tab = 3;
    // Pop to the root of a tab (a second tap on the selected tab).
    NavPopToRoot pop_to_root = 4;
  }
}

message NavPush {
  string tab = 1;
  Route route = 2;
}

message NavPopped {
  string tab = 1;
  uint64 instance = 2;
}

message NavSelectTab {
  string tab = 1;
}

message NavPopToRoot {
  string tab = 1;
}

// ---------------------------------------------------------------------------
// Events: what a shell (or the runtime itself) says to a screen
// ---------------------------------------------------------------------------

message InstanceEvent {
  uint64 instance = 1;
  ScreenEvent event = 2;
}

message ScreenEvent {
  oneof kind {
    // The screen came into view. The first one loads.
    Appeared appeared = 1;
    // A shell answers an `EffectRequest`.
    EffectResult effect_result = 2;
    // RUNTIME-ORIGINATED: a timer the screen started has elapsed. A shell never
    // sends it.
    TimerFired timer_fired = 3;
    // RUNTIME-ORIGINATED: a table the screen read has changed. A shell never
    // sends it.
    DataChanged data_changed = 4;
    // RUNTIME-ORIGINATED: the locale or zone changed.
    EnvironmentChanged environment_changed = 5;
    // RUNTIME-ORIGINATED: the app left or returned to the foreground.
    AppLifecycle lifecycle = 7;
    // RUNTIME-ORIGINATED: a job the screen started off the runtime's lock
    // (`Ctx::off_thread`) has finished.
    OffThreadDone off_thread_done = 8;
    // RUNTIME-ORIGINATED: the screen is being popped. Its last chance to write
    // what the member typed (an autosave's pending edit); a shell never sends
    // it, and only its `act`s survive: the view is no longer drawn.
    Left left = 6;
    // RUNTIME-ORIGINATED: the assistant's running turn said something (a token,
    // the cards, the answer). Only a screen that opts in (`hears_assist`, the
    // chat) hears it; a shell never sends it.
    AssistEvent assist = 11;
    CounterEvent counter = 10;
    // RUNTIME-ORIGINATED: a screen asked the shell to act on a topic
    // (`Announce`), and every open screen, services included, hears it.
    Announced announced = 9;
    // ---- words (1300-1399, lane H2): custody_screens.proto ----
    WordsMakeEvent words_make = 1300;
    WordsEnterEvent words_enter = 1301;
    WordsShowEvent words_show = 1302;
    // ---- agenda (100-199) ----
    AgendaHomeEvent agenda_home = 100;
    AgendaEventEvent agenda_event = 101;
    AgendaEditorEvent agenda_editor = 102;
    TodoListEvent todo_list = 103;
    TodoProjectEvent todo_project = 104;
    TodoDetailEvent todo_detail = 105;
    TodoCatchUpEvent todo_catch_up = 106;
    // ---- photos (800-899) ----
    PhotosHomeEvent photos_home = 800;
    PhotosShelfEvent photos_shelf = 801;
    PhotosPickerEvent photos_picker = 802;
    PhotosPlacesEvent photos_places = 803;
    PhotosLightboxEvent photos_lightbox = 804;
    PhotosEditorEvent photos_editor = 805;
    PhotosDuplicatesEvent photos_duplicates = 806;
    PhotosDuplicateReviewEvent photos_duplicate_review = 807;
    // ---- locker (400-499) ----
    LockerWallEvent locker_wall = 400;
    LockerHomeEvent locker_home = 401;
    LockerItemEvent locker_item = 402;
    LockerEditorEvent locker_editor = 403;
    LockerAccessEvent locker_access = 404;
    LockerExportEvent locker_export = 405;
    LockerImportEvent locker_import = 406;
    // ---- money (500-599) ----
    MoneyHomeEvent money_home = 500;
    MoneyTransactionEvent money_transaction = 501;
    MoneyTargetEvent money_target = 502;
    MoneySearchEvent money_search = 503;
    MoneyRecurringEvent money_recurring = 504;
    MoneyAccountsEvent money_accounts = 505;
    MoneyCategoriesEvent money_categories = 506;
    MoneyRulesEvent money_rules = 507;
    MoneyImportEvent money_import = 508;
    // ---- docs (200-299) ----
    DocsDriveEvent docs_drive = 200;
    DocsDocumentEvent docs_document = 201;
    DocsEditorEvent docs_editor = 202;
    DocsVersionsEvent docs_versions = 203;
    // ---- notes (600-699) ----
    HealthHomeEvent health_home = 300;
    HealthMetricEvent health_metric = 301;
    HealthWorkoutEvent health_workout = 302;
    HealthConnectEvent health_connect = 303;
    NotesHomeEvent notes_home = 600;
    NotesEditorEvent notes_editor = 601;
    NotesHistoryEvent notes_history = 602;
    // ---- people (700-799) ----
    PeopleHomeEvent people_home = 700;
    PeoplePersonEvent people_person = 701;
    PeopleEditorEvent people_editor = 702;
    // ---- pairing (1400-1449, lane H2) ----
    PairLaptopEvent pair_laptop = 1400;
    // ---- the kit (900-999) ----
    TrashEvent trash = 900;
    // ---- backup (1450-1499, lane H2) ----
    BackupHomeEvent backup_home = 1450;
    // ---- passes (1500-1599): passes_screens.proto ----
    // RUNTIME-ORIGINATED from `ScreenRequest.shell_fact`.
    ShellFact shell_fact = 1500;
    // RUNTIME-ORIGINATED: another screen called `Ctx::signal`; only a screen
    // that `hears` the topic is sent it.
    Signalled signalled = 1501;
    // ---- the vault shelf (1560-1599, lane H2): vault_screens.proto ----
    // RUNTIME-ORIGINATED from `ScreenRequest.memory_warning`.
    MemoryWarning memory_warning = 1560;
    // RUNTIME-ORIGINATED, to services only: a screen asked the shelf for
    // something (Home's `VaultCommand` effect, which never reaches a shell).
    VaultCommand vault_commanded = 1561;
    // RUNTIME-ORIGINATED, to services only: a screen was opened.
    ScreenOpened screen_opened = 1562;
    // ---- the shell (1000-1999): chat (1600-1699) ----
    ChatEvent chat = 1600;
    // ---- the shell: phone imports (1700-1899) ----
    ImportsCameraRollEvent imports_camera_roll = 1700;
    ImportsFilesEvent imports_files = 1701;
    ImportsMadeEvent imports_made = 1702;
    // ---- the shell (1000-1999): Home 1000-1299 ----
    HomeEvent home = 1000;
    HomeSearchEvent home_search = 1001;
  }
}

message Appeared {}

message TimerFired {
  // The screen's own name for the timer.
  string timer = 1;
}

message EnvironmentChanged {}

// A topic a screen announced (`Announce`), as the runtime relays it to every
// open screen. The shell performs its own half of the announcement and sends
// nothing back.
message Announced {
  string topic = 1;
}

message Left {}

message DataChanged {
  repeated string tables = 1;
}

