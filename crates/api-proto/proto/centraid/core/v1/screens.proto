// ---------------------------------------------------------------------------
// Effects: platform work the shell performs
// ---------------------------------------------------------------------------

message EffectRequest {
  // Unique per runtime; the answer names it.
  uint64 effect_id = 1;
  // The screen that asked, and that the answer returns to.
  uint64 instance = 2;
  Effect effect = 3;
}

message Effect {
  oneof kind {
    ClipboardSet clipboard_set = 1;
    ClipboardClear clipboard_clear = 2;
    Haptic haptic = 3;
    Share share = 4;
    OpenUrl open_url = 5;
    PickPhotos pick_photos = 6;
    CapturePhoto capture_photo = 7;
    HealthRead health_read = 8;
    KeychainOp keychain = 9;
    ScreenshotShield screenshot_shield = 10;
    ScheduleNotification schedule_notification = 11;
    CalendarRead calendar_read = 12;
    PhoneWatch phone_watch = 13;
    // The phone's own owner check: biometric, device passcode as fallback.
    OwnerCheck owner_check = 14;
    // Let the member choose a file and hand its bytes back.
    PickBytes pick_bytes = 15;
    // Hand bytes to the OS save sheet, the only place a file is written.
    SaveFile save_file = 16;
    // Tell the shell something happened it may act on (a Locker unlock).
    Announce announce = 17;
    // ---- photos (#1135, lane D) ----
    FetchOriginal fetch_original = 21;
    ExportOriginals export_originals = 22;
    CameraRoll camera_roll = 23;
    FreeUpSpace free_up_space = 24;
    RenderEdit render_edit = 25;
    ReadCamera read_camera = 26;
    ContactsRead contacts_read = 18;
    // Open the OS maps app at an address (People's address channel).
    OpenMap open_map = 19;
    // Open a page now, wherever the member is: the shell pushes `route` as a
    // tapped row's route is pushed. For a screen that makes a thing and
    // opens it (a document just filed).
    OpenRoute open_route = 20;
    // ---- docs (200-299): files ----
    PickFile pick_file = 200;
    FollowFolder follow_folder = 201;
    StopFollowing stop_following = 202;
    // ---- pairing (1340-1349, lane H2): pair_screens.proto ----
    ScanCode scan_code = 1340;
    BrowseGateways browse_gateways = 1341;
    // ---- vault plumbing (1300-1399, lane H2): plumbing_screens.proto ----
    SecretBatch secrets = 1300;
    SyncedSecretsProbe synced_probe = 1302;
    // ---- backup (1350-1369, lane H2): backup_screens.proto ----
    BackgroundProbe background_probe = 1350;
    // ---- passes (1370-1399, lane H2): passes_screens.proto ----
    ScheduleWindows schedule_windows = 1370;
    PassWindowDone pass_window_done = 1371;
    LongRun long_run = 1372;
    UploadsOp uploads = 1373;
    StreamFromLibrary stream_from_library = 1374;
    // ---- the shell (1000-1999): chat (1600-1699) ----
    ModelDownload model_download = 1600;
    PickLibraryPhoto pick_library_photo = 1601;
    // ---- the shell: phone imports (1700-1899) ----
    LibraryPermission library_permission = 1700;
    RollPage roll_page = 1701;
    LinkRead link_read = 1702;
    LibraryStage library_stage = 1703;
    LibraryDerivatives library_derivatives = 1704;
    FoldersRead folders_read = 1705;
    StageFolderFile stage_folder_file = 1706;
    RemindersRead reminders_read = 1707;
    // ---- the shell (1000-1999) ----
    // Home asks the shell to act on the vaults the phone holds.
    VaultCommand vault_command = 1000;
    // Select a tab: the runtime performs it itself (the shell hears the new
    // `Navigation`), so no destination is ever named in Swift or Kotlin.
    SelectTab select_tab = 1001;
  }
}

message ClipboardSet {
  string text = 1;
  // A secret is marked so the OS keeps it out of clipboard history.
  bool sensitive = 2;
  // When the clip must be gone, in milliseconds from the set; 0 keeps it. A
  // shell persists the DEADLINE with the clip, so a process killed before the
  // Rust timer fires still clears it: it clears a stale clip it finds on its
  // next launch. The Rust timer's `ClipboardClear` is the same clear while the
  // app lives.
  uint64 clear_after_ms = 3;
}

// Clears the clipboard only if it still holds what the core put there.
message ClipboardClear {
  string expected_text = 1;
}

enum HapticKind {
  HAPTIC_KIND_UNSPECIFIED = 0;
  HAPTIC_KIND_SELECTION = 1;
  HAPTIC_KIND_SUCCESS = 2;
  HAPTIC_KIND_WARNING = 3;
  HAPTIC_KIND_ERROR = 4;
}

message Haptic {
  HapticKind kind = 1;
}

message Share {
  string text = 1;
  string url = 2;
  // Already localized: it is shown by the OS share sheet.
  string subject = 3;
}

message OpenUrl {
  string url = 1;
}

message PickPhotos {
  uint32 max_count = 1;
}

message CapturePhoto {}

// READ THE PHONE'S HEALTH STORE (HealthKit on iOS, Health Connect on Android) over
// the window Rust placed, for the types the member chose, and answer a
// `HealthSnapshot`. Read only: nothing is ever written to the store (R-1129-7).
// `ask_permission` is the member's Connect tap, the one place the OS is asked
// (R-1127-15); a pass never asks, and answers `EffectFailed{denied}` when
// nothing was ever granted.
message HealthRead {
  // The type keys the member chose: `steps`, `sleep_min`, `active_energy_kcal`,
  // `exercise_min`, `resting_hr_bpm`, `weight_kg`, `workouts`.
  repeated string chosen = 1;
  bool ask_permission = 2;
  // The day totals are read from this civil day (`YYYY-MM-DD`, the phone's
  // zone) through `today`; a workout that started at or after `workouts_since_ms`
  // is in the window.
  string totals_from = 3;
  string today = 4;
  int64 workouts_since_ms = 5;
}

message KeychainOp {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_GET = 1;
    OP_SET = 2;
    OP_DELETE = 3;
  }
  Op op = 1;
  string key = 2;
  // For `OP_SET`.
  bytes value = 3;
}

message ScreenshotShield {
  bool on = 1;
}

message ScheduleNotification {
  string id = 1;
  // Already localized: the notification is shown by the OS.
  string title = 2;
  string body = 3;
  // Epoch milliseconds. A cancel is an empty `title` and `body`.
  int64 at_ms = 4;
}

// Read the phone's calendars over a window around the shell's clock. A shell
// that is denied (or has no calendar) answers `EffectFailed{denied}`.
message CalendarRead {
  // The member's Import tap lets the OS ask for permission; a following pass
  // never does.
  bool ask_permission = 1;
  uint32 days_back = 2;
  uint32 days_on = 3;
}

// Read the phone's address book. A shell that is denied (or has none) answers
// `EffectFailed{denied}`; a pass that only follows never asks the OS for
// permission (`ask_permission` false), the member's Import tap does.
message ContactsRead {
  bool ask_permission = 1;
}

message OpenMap {
  // An address, as the member wrote it.
  string query = 1;
}

// Start (`on`) or stop watching a phone store; while it is on, the shell
// answers this effect with a `PhoneChanged` each time the store changes, under
// the effect's one `effect_id`.
message PhoneWatch {
  ImportSource source = 1;
  bool on = 2;
}

// ---------------------------------------------------------------------------
// Photos' platform work (#1135, lane D). Four effects the screens of Photos
// share: the lightbox, the library and a shelf each ask for the same fetch and
// the same hand-off, so they are named here once. Every sentence a member reads
// about their outcome is Rust's (`photos::fetch`, `photos::keep_originals`,
// `strings::photos_home`); the shell reports what happened as a closed enum.
// ---------------------------------------------------------------------------

// BRING ONE ORIGINAL BACK from a paired gateway by its content hash (#1080): the
// shell sends the core's `fetch_original` request and answers
// `OriginalFetched`. A shell with no core answers `EffectFailed`.
message FetchOriginal {
  // The bytes' hash as 64 hex characters (`PhotoTile.content_id`).
  string content_hash = 1;
}

// How a fetch ended: the core's `FetchOutcome`, restated here so a screen's wire
// does not import the backup plane's.
enum OriginalFetchOutcome {
  ORIGINAL_FETCH_OUTCOME_UNSPECIFIED = 0;
  ORIGINAL_FETCH_OUTCOME_LANDED = 1;
  ORIGINAL_FETCH_OUTCOME_ALREADY_HELD = 2;
  ORIGINAL_FETCH_OUTCOME_UNREACHABLE = 3;
  ORIGINAL_FETCH_OUTCOME_NOT_IN_BACKUP = 4;
  ORIGINAL_FETCH_OUTCOME_UNTRUSTED = 5;
  ORIGINAL_FETCH_OUTCOME_DAMAGED = 6;
}

message OriginalFetched {
  OriginalFetchOutcome outcome = 1;
  // The file in the app's own store when there is one; empty otherwise.
  string path = 2;
  // The hash that was asked for, echoed, so a screen with several fetches in
  // flight knows which one this answers.
  string content_hash = 3;
}

// HAND THE ORIGINALS OF A PICK TO THE PLATFORM: its share sheet (`MODE_SEND`) or
// this device's own photo library (`MODE_SAVE`). The shell finds each original
// on this phone, takes the location out of the file unless `keep_location`
// (failing closed: a file whose place cannot be removed is not sent, #816), and
// answers `OriginalsExported`.
message ExportOriginals {
  repeated string photo_ids = 1;
  Mode mode = 2;
  bool keep_location = 3;

  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_SEND = 1;
    MODE_SAVE = 2;
  }
}

message OriginalsExported {
  Status status = 1;
  // How many originals went, and how many of the pick were not on this phone.
  uint32 handed = 2;
  uint32 missing = 3;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The sheet or the library took what was found. (The sheet says what it did.)
    STATUS_DONE = 1;
    // Nothing of the pick is on this phone.
    STATUS_NONE_HERE = 2;
    // A file's location could not be taken out, so nothing was sent.
    STATUS_LOCATION_NOT_REMOVABLE = 3;
    // The platform refused the save or the copy.
    STATUS_FAILED = 4;
  }
}

// THE CAMERA ROLL'S PLATFORM HALF (#1025 S6). Photos' grid decides what the
// banner says and which remedy it offers; the shell performs the remedy. The
// roll itself (enumerating, uploading) is the shell's own and is not an effect.
message CameraRoll {
  Action action = 1;

  enum Action {
    ACTION_UNSPECIFIED = 0;
    // The system's photo-access prompt. The shell answers by sending the
    // screen a `PermissionChanged` event.
    ACTION_ASK_PERMISSION = 1;
    // This app's page in Settings.
    ACTION_OPEN_SETTINGS = 2;
    // iOS's limited selection: let the member edit it.
    ACTION_MANAGE_SELECTION = 3;
    // Run one camera-roll pass now.
    ACTION_IMPORT_NOW = 4;
  }
}

// FREE UP SPACE (#1080 A19, A20): count what this phone holds that a gateway
// also holds, or free it behind the system's own confirmation. Either way the
// shell answers `FreeUpFacts`; the sentences are Rust's.
message FreeUpSpace {
  Action action = 1;

  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_COUNT = 1;
    ACTION_FREE = 2;
  }
}

message FreeUpFacts {
  // The platform can delete from its library behind the system's own
  // confirmation. False draws no row at all.
  bool offered = 1;
  // The census of originals on this phone answered.
  bool counted = 2;
  uint32 on_phone_count = 3;
  uint64 on_phone_bytes = 4;
  // How many of them are in albums the member keeps on this phone.
  uint32 kept_count = 5;
  // The core named what is safe to free (`releasable`) and how much.
  bool checked = 6;
  uint32 releasable_count = 7;
  uint64 releasable_bytes = 8;
  // What the last free-up came to; unspecified before the first.
  Outcome outcome = 9;
  // For `OUTCOME_FREED`: the bytes that went.
  uint64 freed_bytes = 10;
  // For `OUTCOME_PLATFORM_ERROR`: the platform's own words.
  string platform_error = 11;

  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_FREED = 1;
    // The member said no in the system's dialog, or nothing could go.
    OUTCOME_NOTHING_REMOVED = 2;
    // The library let them go and the core did not record it.
    OUTCOME_NOT_RECORDED = 3;
    // The core could not say what is safe, so nothing was deleted.
    OUTCOME_NOT_CHECKED = 4;
    OUTCOME_PLATFORM_ERROR = 5;
  }
}

// THE OWNER CHECK: iOS `LAContext().evaluatePolicy(.deviceOwnerAuthentication,
// localizedReason: reason)`; Android `BiometricPrompt` with
// `setAllowedAuthenticators(BIOMETRIC_STRONG or DEVICE_CREDENTIAL)`,
// `setTitle(title)` and `setSubtitle(subtitle)` and no negative button. With
// `ask` false it only reads what this phone can do (`OwnerChecked.available`,
// `biometry`) and raises nothing.
message OwnerCheck {
  bool ask = 1;
  string reason = 2;
  string title = 3;
  string subtitle = 4;
}

// What this phone can do, as its shell reads it.
enum Biometry {
  BIOMETRY_UNSPECIFIED = 0;
  // A passcode and no biometric enrolled.
  BIOMETRY_PASSCODE = 1;
  BIOMETRY_FACE = 2;
  BIOMETRY_FINGERPRINT = 3;
  // Touch ID's name for the same thing.
  BIOMETRY_TOUCH = 4;
  BIOMETRY_OPTIC = 5;
}

message OwnerChecked {
  // A passcode is set, so the check can succeed.
  bool available = 1;
  Biometry biometry = 2;
  Outcome outcome = 3;

  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // The member passed the check.
    OUTCOME_SUCCEEDED = 1;
    // The member dismissed it. Not a failure.
    OUTCOME_CANCELLED = 2;
    // Not recognised, or the prompt errored.
    OUTCOME_FAILED = 3;
    // No passcode is set (`LAError.passcodeNotSet`; `ERROR_NO_DEVICE_CREDENTIAL`).
    OUTCOME_UNAVAILABLE = 4;
    // Too many attempts (`LAError.biometryLockout`; `ERROR_LOCKOUT*`).
    OUTCOME_LOCKED_OUT = 5;
    // Nothing was asked (`ask` was false).
    OUTCOME_NOT_ASKED = 6;
  }
}

// Ask the member for one small file and read it whole (a Locker import, a bank
// statement). Docs' `PickFile` is the other one: it stages a large file.
message PickBytes {
  // Media types or extensions the picker offers; empty is any file.
  repeated string accept = 1;
}

// The picked file. The bytes are the member's own and may be secrets in the
// clear: Rust holds them only as long as the screen that asked.
message BytesPicked {
  bool cancelled = 1;
  string name = 2;
  string media_type = 3;
  bytes content = 4;
}

message SaveFile {
  string name = 1;
  string media_type = 2;
  bytes content = 3;
}

message Announce {
  // `locker.unlocked`.
  string topic = 1;
}

message EffectResult {
  uint64 effect_id = 1;
  oneof outcome {
    EffectDone done = 2;
    EffectFailed failed = 3;
    PhotosPicked photos = 4;
    HealthSnapshot health = 5;
    KeychainValue keychain = 6;
    CalendarSnapshot calendar = 7;
    PhoneChanged phone_changed = 8;
    BytesPicked bytes_picked = 9;
    OwnerChecked owner_checked = 10;
    // ---- photos (#1135, lane D) ----
    OriginalFetched original_fetched = 11;
    OriginalsExported originals_exported = 12;
    FreeUpFacts free_up_facts = 13;
    EditRendered edit_rendered = 14;
    CameraRead camera_read = 15;
    ContactsSnapshot contacts = 16;
    // ---- docs (200-299): files ----
    FilePicked file_picked = 200;
    FileProgress file_progress = 201;
    FolderFollowed folder_followed = 202;
    // ---- pairing (1340-1349, lane H2) ----
    CodeScanned code_scanned = 1340;
    GatewaysSighted gateways_sighted = 1341;
    // ---- the shell (1000-1999): chat (1600-1699) ----
    LibraryPhotoPicked library_photo_picked = 1600;
    // ---- the shell: phone imports (1700-1899) ----
    LibraryPermissionRead library_permission_read = 1700;
    RollPaged roll_paged = 1701;
    LinkReading link_reading = 1702;
    LibraryStaged library_staged = 1703;
    FoldersListing folders_listing = 1705;
    FolderFileStaged folder_file_staged = 1706;
    RemindersSnapshot reminders_snapshot = 1707;
    // ---- vault plumbing (1300-1399, lane H2) ----
    SecretBatched secrets = 1300;
    SyncedSecretsStatus synced_status = 1302;
    // ---- backup (1350-1369, lane H2) ----
    BackgroundStatus background_status = 1350;
    // ---- passes (1370-1399, lane H2) ----
    WindowsScheduled windows_scheduled = 1370;
    UploadsState uploads_state = 1371;
    LibraryStreamed library_streamed = 1372;
    PassNoted pass_noted = 1373;
  }
}

message EffectDone {}

message EffectFailed {
  // Which platform refused, in words for a log; the screen decides what a
  // member reads.
  string reason = 1;
  bool denied = 2;
  // The member dismissed it (a save sheet): not a failure.
  bool cancelled = 3;
}

message PhotosPicked {
  // Ids of bytes the shell streamed through the stage door; the screen hands
  // them to `act`.
  repeated string stage_ids = 1;
}

// WHAT THE SHELL READ OF THE HEALTH STORE. Nothing here is a decision: Rust diffs
// the days against the vault's, maps a workout's kind, decides when a read is
// complete and what is sent.
message HealthSnapshot {
  // Which store this phone has.
  Store store = 1;
  // False when the store is not on the phone at all (Health Connect
  // uninstalled): nothing is read, and the store's origin is not touched.
  bool store_present = 2;
  // The chosen types the OS refused. Health Connect names them; HealthKit hides
  // a refusal, so iOS leaves this empty.
  repeated string refused = 3;
  // Every day total the store has in the window, chosen metrics only; a day the
  // store has nothing for is absent, never a zero.
  repeated HealthDayTotal days = 4;
  repeated HealthPhoneWorkout workouts = 5;
  // False when the workout read may have missed some (a query failed part-way).
  bool workouts_complete = 6;
  // This phone's id, which a followed workout carries.
  string device_id = 7;
  // With `store_present` false: Health Connect is not installed and Google Play
  // can bring it, so Connect says where to get it.
  bool installable = 8;

  enum Store {
    STORE_UNSPECIFIED = 0;
    STORE_APPLE_HEALTH = 1;
    STORE_HEALTH_CONNECT = 2;
  }
}

// One day's total as the store states it: `day` is the store's own day in the
// phone's zone (a night of sleep is keyed to the day the member woke), `metric`
// the metric's key, `value` in the metric's own unit.
message HealthDayTotal {
  string day = 1;
  string metric = 2;
  double value = 3;
}

// One workout as the store holds it.
message HealthPhoneWorkout {
  // The store's own id (HealthKit's uuid, Health Connect's record id): it means
  // something on this phone only.
  string id = 1;
  // The store's word for the kind, whole (`running`, `EXERCISE_TYPE_RUNNING`).
  string kind = 2;
  // UTC instants, `YYYY-MM-DDTHH:MM:SS[.sss]Z`.
  string started_at = 3;
  string ended_at = 4;
  optional int64 moving_sec = 5;
  optional double distance_m = 6;
  optional double energy_kcal = 7;
  optional int64 avg_hr_bpm = 8;
  optional double elevation_gain_m = 9;
  optional string recorded_by = 10;
}

message KeychainValue {
  bool found = 1;
  bytes value = 2;
}

// The phone's calendars as the OS holds them, every occurrence in the window
// its own event; Rust folds a series back into one and makes every record.
message CalendarSnapshot {
  // The shell's clock when it read, epoch milliseconds, and its zone.
  int64 now_ms = 1;
  string device_zone = 2;
  // False when the read may have missed events: nothing is then trashed.
  bool complete = 3;
  // Every visible calendar the member writes to, an empty one included.
  repeated PhoneCalendar calendars = 4;
  repeated PhoneCalendarEvent events = 5;
  // This install's id, minted once and kept off the vault: an id that means
  // something on this phone only is followed under it (R-1127-10).
  string device_id = 6;
}

message PhoneCalendar {
  // The platform's own id for the calendar, not yet prefixed.
  string key = 1;
  string source_title = 2;
  string title = 3;
}

// One occurrence. An all-day `start`/`end` is `YYYY-MM-DD` with `end` the LAST
// day, inclusive; a timed one is `YYYY-MM-DDTHH:MM:SS` in `tz`, `end` exclusive.
message PhoneCalendarEvent {
  string title = 1;
  string notes = 2;
  bool all_day = 3;
  string start = 4;
  string end = 5;
  // The event's IANA zone; empty is the device's.
  string tz = 6;
  // The calendar holds it as not blocking its time.
  bool free = 7;
  optional PhoneCalendarSeries series = 8;
  // Where the series' rule puts this occurrence, when the member moved it.
  string original_start = 9;
  bool moved = 10;
  // The phone's most durable id, kind-prefixed (`uid:`, `lookup:`, `local:`).
  string phone_id = 11;
  string calendar_key = 12;
}

// A repeating series as the phone holds it; `start`/`end` are the series' OWN
// first occurrence, in the form of the occurrences'.
message PhoneCalendarSeries {
  string id = 1;
  string rrule = 2;
  string start = 3;
  string end = 4;
}

// The phone's address book as the OS holds it. Rust makes every record: it
// squashes the names, keeps one contact once, labels each account and decides
// what to send (`follow-contacts`).
message ContactsSnapshot {
  // False when the read may have missed contacts (iOS limited access, a read
  // that failed part-way): nothing is then trashed.
  bool complete = 1;
  // This install's id, minted once and kept off the vault: an id that means
  // something on this phone only is followed under it (R-1127-10).
  string device_id = 2;
  // Every account or container present, an empty one included.
  repeated PhoneContactContainer containers = 3;
  repeated PhoneContact contacts = 4;
}

message PhoneContactContainer {
  // The platform's own id for the account, not yet prefixed.
  string key = 1;
  // What the OS calls it ("iCloud", "Gmail"); empty is the phone's own.
  string name = 2;
}

message PhoneContact {
  // The display name; a contact with none is skipped.
  string name = 1;
  repeated string phones = 2;
  repeated string emails = 3;
  // `MM-DD`, or empty: the year is not asked for, because a People date is a
  // day of the year.
  string birthday = 4;
  // The phone's most durable id, kind-prefixed (`lookup:` Android's
  // `LOOKUP_KEY`, `local:` a device-scoped id). A contact with none is skipped,
  // because nothing could find it again.
  string phone_id = 5;
  // The account the contact was read in (a `PhoneContactContainer.key`); empty
  // is this phone.
  string container_key = 6;
}

// A watched store changed.
message PhoneChanged {
  ImportSource source = 1;
}

// ---------------------------------------------------------------------------
// Files (Docs): pick and stage a file, follow a folder
// ---------------------------------------------------------------------------

message OpenRoute {
  Route route = 1;
}

// Pick one file for the drive's Add sheet: Upload is the system file picker,
// Scan the document camera (its pages written to one PDF). The shell copies the
// choice to a file on this device, STREAMS it through the stage door (a 900 MB
// scan never exists in memory at once), and answers `FilePicked` with the hash
// the core named. While it streams it may answer `FileProgress` any number of
// times under the same `effect_id`. A closed picker is `EffectDone`; a refusal
// is `EffectFailed` (`denied` for a camera or file grant the member refused).
message PickFile {
  Kind kind = 1;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_UPLOAD = 1;
    KIND_SCAN = 2;
  }
}

// A file the shell picked and staged. `blob` is the hash the stage door named
// and `byte_size` the bytes it counted; `name` is what the platform called the
// file (empty for a scan) and `media_type` its type (empty: Rust reads it off
// the name).
message FilePicked {
  string blob = 1;
  uint64 byte_size = 2;
  string name = 3;
  string media_type = 4;
}

// Bytes streamed so far, of a file `total_bytes` long (0 is unknown). `name` is
// what the platform called the file (empty for a scan), so the line can say what
// is being added while it streams.
message FileProgress {
  uint64 staged_bytes = 1;
  uint64 total_bytes = 2;
  string name = 3;
}

// Follow a folder the member picks (#1127): the shell opens its folder picker,
// keeps the access it is given (a security-scoped bookmark, a persisted tree
// URI) under an origin it mints, and answers `FolderFollowed`. A closed picker
// is `EffectDone`.
message FollowFolder {}

// The folder the shell is now following, and the name the phone gives it.
message FolderFollowed {
  // `folder:<uuid>`.
  string origin = 1;
  string name = 2;
}

// Stop following the folder whose origin is `origin`: the shell forgets its
// access and tells the core to forget the folder's links; every document stays.
message StopFollowing {
  string origin = 1;
}

// ---------------------------------------------------------------------------
// The proof screen (`proof.counter`): how many events are upcoming, one `load`
// over `agenda.upcoming`. Exists to prove the runtime end to end — load, a
// re-render on a change, an effect and a timer — and is deleted when the first
// real screen is ported.
// ---------------------------------------------------------------------------

message CounterEvent {
  oneof kind {
    // The member tapped the count: copy it, and clear the clipboard later.
    CounterCopyTapped copy_tapped = 1;
    CounterRetryTapped retry_tapped = 2;
  }
}

message CounterCopyTapped {}

message CounterRetryTapped {}

message CounterView {
  string title = 1;
  oneof content {
    CounterLoading loading = 2;
    Failure failed = 3;
    CounterData data = 4;
  }
}

message CounterLoading {
  string label = 1;
}

message CounterData {
  // "3 upcoming events": plural-aware, finished.
  string count_label = 1;
  string copy_label = 2;
  // "Copied. The clipboard clears in 30 seconds." Empty when nothing was copied.
  string notice = 3;
}
