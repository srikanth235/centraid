// Typed errors (#1020, D-1020-C4).
//
// **No free-text reason reaches a member from this message.** A member-facing
// sentence is either the author's (a precondition's, `CommandOutcome.reason`) or
// the shell's, rendered from `code`. `detail` here is for logs and support
// bundles only.
//
// The enum is closed on purpose. A shell switches on a value; a shell that
// switches on a string is a shell that breaks when the string is reworded.

syntax = "proto3";

package centraid.core.v1;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;

  // --- transport and admission ---
  // The remote endpoint is not an enrolled, unrevoked device. Unknown and
  // revoked are the SAME refusal.
  ERROR_CODE_UNAUTHORIZED = 1;
  // The version window does not admit the peer; an `UpgradeRequired` rides
  // with it.
  ERROR_CODE_VERSION_WINDOW = 2;
  // A frame's length prefix was zero or above `MAX_FRAME_BYTES`, or the body
  // did not decode. The connection closes; a malformed frame is not a
  // recoverable request.
  ERROR_CODE_MALFORMED_FRAME = 3;
  // A message type this build does not know. An `Unsupported` rides with it.
  ERROR_CODE_UNSUPPORTED_MESSAGE = 4;
  // No relay was reachable and no direct path was found.
  ERROR_CODE_NO_RELAY_REACHABLE = 5;
  // The peer id is routable in principle and did not answer.
  ERROR_CODE_PEER_UNREACHABLE = 6;
  // The bounded connect timeout elapsed. Never a hang (#1020, D-1020-C9).
  ERROR_CODE_TIMEOUT = 7;
  // The request was cancelled by a `Cancel` frame.
  ERROR_CODE_CANCELLED = 8;

  // --- the replica plane ---
  // The cursor cannot be served from; a `RebootstrapRequired` rides with it.
  ERROR_CODE_REBOOTSTRAP_REQUIRED = 20;
  // A `limit` of zero, a cursor with a non-decimal seq, a page query missing an
  // order column. The request is wrong, not the state.
  ERROR_CODE_INVALID_REQUEST = 21;
  // The gateway has no durable directory to build a snapshot in
  // (v0's `503 seat_snapshot_unavailable`).
  ERROR_CODE_SNAPSHOT_UNAVAILABLE = 22;
  // THIS REPLICA ALREADY HOLDS A VAULT (#1025 S7-9).
  //
  // A pairing bootstraps a first copy INTO the file the core is open on, so a
  // pair run against a core that is already holding someone's rows would lay a
  // second vault over the first and destroy it. It is refused before the ticket
  // is redeemed, so nothing is burned: the caller pairs from a fresh file.
  //
  // A CODE and not a sentence, like every refusal here — the shell's own table
  // says what a member reads.
  ERROR_CODE_VAULT_ALREADY_HELD = 23;

  // 24 WAS `ERROR_CODE_IDENTITY_MISMATCH` (#1025 S7-13): an open whose iroh
  // endpoint was not the key its gateway enrolled. There is no endpoint and no
  // enrolment since #1080 — a gateway knows a phone by the token its pairing
  // minted — so nothing produced it, and it left with the iroh plane.
  reserved 24;
  reserved "ERROR_CODE_IDENTITY_MISMATCH";

  // THE VAULT MOVED TO ANOTHER DEVICE (#1029 §0, §3).
  //
  // In the 20s and not the 1s deliberately: a superseded device is NOT a
  // stranger, and the two refusals have different answers. `UNAUTHORIZED` means
  // "whoever you are, not here"; this means "you held this vault and a higher
  // epoch took it". It comes from a TOMBSTONE and not a deletion, which is what
  // lets a blind gateway tell the two apart at all.
  //
  // The phone's answer is behavioural rather than a sentence: it freezes that
  // vault read-only, shows the unacked spool as "N changes since <date>", and
  // keeps it. A `VaultMoved` (below) rides with this code.
  ERROR_CODE_VAULT_MOVED = 25;

  // A READ REACHED ITS OWN STATED CEILING (#1046).
  //
  // An app query walks its joins to a bound it declares, and expands a series
  // to a bound it declares, and stops with THIS rather than answering what it
  // had: a short agenda that reads as a whole one is the truncation flag again
  // (D-1020-D3-12). Not `INVALID_REQUEST` — nothing about the request was wrong
  // — and not `INTERNAL`, whose remedy is a restart that cannot help. The
  // remedy is a narrower range, which is the shell's to offer.
  ERROR_CODE_READ_BOUND_REACHED = 26;

  // --- intents and commands ---
  // The submitted `payload_hash` does not match the input.
  ERROR_CODE_INTENT_HASH_MISMATCH = 40;
  // The same intent id was already admitted with a different payload.
  ERROR_CODE_INTENT_ID_REUSED = 41;
  // The outcome aged past the idempotency window; the remedy is to RESUBMIT AS
  // A NEW INTENT, never a silent retry.
  ERROR_CODE_INTENT_OUTCOME_EXPIRED = 42;
  // The declared read-set did not version every row the operation reads.
  ERROR_CODE_READ_SET_INCOMPLETE = 43;
  // RESERVED. Held `ERROR_CODE_ONLINE_ONLY` ("this action refuses to queue for
  // a gateway") until #1047 (Q-1047-14) deleted the flag it answered: the
  // phone is the vault, nothing queues, and nothing gated on it. The number and
  // the name are not re-used, for the same reason as 91 below.
  reserved 44;
  reserved "ERROR_CODE_ONLINE_ONLY";
  // The access plane returned a deny. A deny is an OUTCOME, not an exception,
  // so the member-facing sentence is on the outcome and this code is what the
  // shell branches on.
  ERROR_CODE_DENIED = 45;
  // THE GATEWAY DOES NOT YET HOLD THE BYTES THIS INTENT NAMES (#1025 S3).
  //
  // A RETRYABLE refusal, and the distinction is the whole point: the intent was
  // NOT executed and did NOT fail. The gateway tried to pull the declared blobs
  // over the connection this seat opened and the transfer did not finish — the
  // phone went out of range mid-pull, or the window closed. The write stays in
  // the seat's outbox and the next pass submits it again, which is what an
  // `Error` envelope on the `intent` stream already means to the seat
  // (`decode_outcome`: a refusal is not a verdict).
  //
  // Bytes commit after rows, and never only on a phone: the alternative to this
  // code is a content row on the gateway naming bytes nobody has.
  ERROR_CODE_BYTES_NOT_YET_HELD = 46;

  // --- the vault file ---
  // The file is newer than this binary. Refuses rather than guessing (#1020
  // Compatibility).
  ERROR_CODE_DOWNGRADE_REFUSED = 60;
  // The file needs a forward migration this build does not carry.
  ERROR_CODE_UPGRADE_REQUIRED = 61;
  // The subcommand or capability is not built yet. Exit code 3 in the CLI —
  // never a silent stub (#1020, D-1020-C11).
  ERROR_CODE_NOT_YET_AVAILABLE = 62;
  // An entry point caught a panic. The handle is poisoned and the shell
  // restarts the core deliberately (#1020 Execution model).
  ERROR_CODE_INTERNAL = 63;

  // --- the #1029 gateway (#1029 §3), retired ---
  //
  // 80–94 were the refusals of `crates/gateway-core` (a signature, a clock
  // skew, a checksum, a write-once name, an object's size, the head's
  // compare-and-set, the lease, a quota, a plan, a delete, a capability, a
  // mailbox). That gateway left at #1080's cut-over: the one a phone speaks to
  // now refuses in its own protocol's codes (`crates/gateway`'s `rules::code`),
  // and the core maps those onto `UNAUTHORIZED`, `VAULT_MOVED` and
  // `PEER_UNREACHABLE`. No build produces any of them, so every number and
  // every name is reserved: a phone carrying an older build reads 88 as "lease
  // stale", and giving a number a second meaning is how a refusal becomes a lie.
  reserved 80 to 94;
  reserved "ERROR_CODE_GATEWAY_SIGNATURE_INVALID", "ERROR_CODE_GATEWAY_CLOCK_SKEW",
    "ERROR_CODE_GATEWAY_CHECKSUM_MISSING", "ERROR_CODE_GATEWAY_CHECKSUM_MISMATCH",
    "ERROR_CODE_GATEWAY_ALREADY_COMMITTED", "ERROR_CODE_GATEWAY_OBJECT_UNKNOWN",
    "ERROR_CODE_GATEWAY_OBJECT_TOO_LARGE", "ERROR_CODE_GATEWAY_HEAD_CONFLICT",
    "ERROR_CODE_GATEWAY_LEASE_STALE", "ERROR_CODE_GATEWAY_NOT_LEASE_HOLDER",
    "ERROR_CODE_GATEWAY_QUOTA_EXCEEDED", "ERROR_CODE_GATEWAY_PLAN_LAPSED",
    "ERROR_CODE_GATEWAY_DELETE_REFUSED", "ERROR_CODE_GATEWAY_CAPABILITY_SCOPE",
    "ERROR_CODE_GATEWAY_MAILBOX_REFUSED";
}

message Error {
  ErrorCode code = 1;
  // FOR LOGS ONLY. A shell may put it in a support bundle and must not render
  // it as the reason. It carries whatever the failing layer said, **including a
  // database message**: `entity id is already held by another kind: core_party
  // (#916)` is a SQLite `RAISE(ABORT)`, and it reached a member's screen
  // through this field ([#1020](https://github.com/srikanth235/centraid/issues/1020)
  // wave 3, lane E finding 2).
  string detail = 2;
  // The diagnostic id a panic or an internal error is filed under, so a crash
  // report and a log line name the same event.
  string diagnostic_id = 3;
  // THE OWNER-FACING SENTENCE, derived from `code` ALONE.
  //
  // The header above says no free-text reason reaches a member from this
  // message, and a shell was still left with two choices: render nothing, or
  // render `detail`. Both are wrong — the first loses the refusal, the second
  // ships SQL. So the sentence is a field of its own, it is built from the code
  // with no layer's own text interpolated into it, and a shell renders THIS.
  //
  // It is not a second `detail` and it is not localisation: it is one English
  // sentence a shell may show verbatim or replace by branching on `code`. The
  // raw predicate stays in `detail` for the audit trail and never reaches a
  // member — the rule `command.proto` states for `CommandOutcome.reason`, which
  // this message had no way to keep.
  string sentence = 4;

  // WHAT `ERROR_CODE_VAULT_MOVED` RIDES WITH (#1029 §0, W5 hand-off 2).
  //
  // The code's own comment above has said "a `VaultMoved` rides with this code"
  // since the gateway messages landed, and **there was no field
  // for it to ride in** — so a phone could learn THAT its vault had moved and
  // never when, which is half the line a member is owed ("N changes since
  // <date>"). A client that inferred the date from its own clock would be
  // inventing the one fact the refusal exists to carry.
  //
  // A field rather than a `oneof` over every code's companion: companions are
  // per-code and rare, and a oneof would make each new one a change to the
  // shape every decoder reads. `code` is still what a shell branches on, and an
  // absent `moved` on a `VAULT_MOVED` is HANDLED rather than trusted — see
  // `dev.centraid.shared.sync.movedFrom`.
  optional VaultMoved moved = 5;
}

// A SUPERSEDED PHONE IS TOLD IT WAS SUPERSEDED, not that it is a stranger
// (#1029 F1; #1080).
//
// A gateway answers `MOVED` to a writer whose epoch a newer claim superseded,
// and that is a different fact from `UNAUTHORIZED`: the phone FREEZES THAT
// VAULT READ-ONLY and keeps what it had not uploaded, and taking the vault back
// is a deliberate action on that phone, never automatic. The seed is on both
// phones, so this is cooperation and not enforcement: the claim's
// compare-and-set is what makes the race first-writer-wins, and this message
// is what makes the loser coherent. It lived in `lease.proto` with the lease
// the #1029 gateway kept; that file left with that gateway (#1080), and the
// message moved here, beside the one code it rides with.
message VaultMoved {
  uint64 current_epoch = 1;
  int64 moved_at_ms = 2;
}
