// THE CHAT SCREEN (#1135, lane I): the on-device assistant as a Rust screen. The
// thread, the composer, the scope, the confirm cards and the drawer of past chats
// are decided in `crates/screens/src/chat`; SwiftUI and Compose draw `ChatState`
// and send `ChatEvent`s. The turn itself is the core's (`assist.proto`): this
// screen never re-implements a decision the assistant makes.
//
// `chat` is a tab on the bottom bar, not an app, and a chat opened from an app is
// the same screen with `scope_app` set.
//
// THE ANSWER IS CARDS. A reply is one short line of model text and the rows it
// found, each a reference (`ChatCard`) that the app's own tile draws. A tap on a
// card is a `CardTapped` event: Rust asks whether the row is still there and
// answers with an `OpenRoute` effect (the page) or `card_gone_line`.
//
// THE MODEL FILE IS A STEP, NOT A SCREEN. Until a model is on the phone the phase is
// `PHASE_NEEDS_MODEL` and `model_step` carries the sentence, the size and the
// action; the shell owns the download (the only thing Centraid ever fetches) and
// reports its progress as events.

syntax = "proto3";

package centraid.core.v1;


// WHAT A TAP ON A STEP'S ACTION ASKS (#1188 download rules): the shell sends it back as
// `DownloadTapped.choice` and Rust decides what follows.
enum ChatStepAction {
  CHAT_STEP_ACTION_UNSPECIFIED = 0;
  // Fetch it, over Wi-Fi (waiting for Wi-Fi when the phone is on mobile data).
  CHAT_STEP_ACTION_DOWNLOAD = 1;
  // Fetch it now, over mobile data too.
  CHAT_STEP_ACTION_DOWNLOAD_CELLULAR = 2;
  // Keep to Wi-Fi: the member declined mobile data.
  CHAT_STEP_ACTION_WAIT_WIFI = 3;
  // Look at the phone's space and network again.
  CHAT_STEP_ACTION_CHECK_AGAIN = 4;
  // Leave it for now: the photo that asked for the reader is taken off the composer.
  CHAT_STEP_ACTION_NOT_NOW = 5;
}

message ChatCard {
  string app = 1;
  string entity = 2;
  string id = 3;
  string qualifier = 4;
  string title = 5;
  string subtitle = 6;
  string meta = 7;
  // A Locker card that offers a reveal or a code (`qualifier` `reveal:<column>`, `code:<column>`):
  // the sealed row the card shows under its title, shut with Reveal, or revealed with Copy and
  // Conceal (#1188). The core read the value; the model never did. Absent on every other card.
  // A sentence under the row: a refusal, a copy, "This item is gone." (then there is no row).
  string note = 9;
}

// ---------------------------------------------------------------------------
// The chat's platform work (effects)
// ---------------------------------------------------------------------------

// START (OR RESUME) THE SHELL'S DOWNLOAD of the assistant's model, or with `vision`
// of the photo reader's projector, to the directory `ChatEvent.Opened` named. The
// shell owns the transfer, the only thing Centraid ever fetches. It answers
// `EffectDone` at once and reports the transfer as `ChatEvent.DownloadProgress`
// and `DownloadFinished` events to the chat instance.
message ModelDownload {
  bool vision = 1;
  // The file to fetch and how to know it arrived whole: the shell downloads `url`
  // into `models_dir/file_name`, hashes what arrived and keeps it only when the
  // digest is `sha256` (lowercase hex); anything else is deleted and reported as
  // `DownloadFinished{ok: false}`.
  string url = 2;
  string file_name = 3;
  string sha256 = 4;
  uint64 bytes = 5;
  string models_dir = 6;
  // The member allowed mobile data for this transfer. Without it the shell fetches over Wi-Fi only
  // and waits for it when the phone has none.
  bool allow_cellular = 7;
}

// Delete a model file the chat no longer needs: the new one arrived whole, was verified beside the
// old and loaded, so the old one goes. A name in the models directory, never a path.
message DeleteModelFile {
  string models_dir = 1;
  string file_name = 2;
}
