// HEALTH'S PHONE QUERIES, AS THE CORE ANSWERS THEM (#1129).
//
// `crates/apps/health` reads the vault's daily totals (`health_daily`) and
// workouts (`health_workout` over `core_activity`) through the page door and
// folds them: today against the member's own 30-day typical, a metric's week,
// month or year, the trends, the workouts. These are its answers, typed. A
// shell reaches them through `app_query.proto`'s `AppQueryRequest` (arms
// 120-125) and draws them; it computes no typical, average, percentile or
// bucket, because the figures are Rust's (R-1129-12) and a second engine in
// Kotlin or Swift is the drift that rule exists to prevent. The shell FORMATS:
// units follow the phone's locale (km or mi, kg or lb), storage never does.
//
// Every message mirrors a Rust struct in `crates/apps/health/src/queries.rs`;
// `crates/core`'s `app_query/health.rs` is the one conversion.
//
// FIGURES ARE IN THE METRIC'S OWN UNIT, which its name states (`weight_kg`,
// `sleep_min`, `distance_m`): SI or the store's own count, never converted.
//
// DAYS ARE THE PHONE'S. A day is `YYYY-MM-DD` as the health store reckoned it
// in the device's zone when it was read; a request states `today`, the caller's
// local day, and the core reads no zone to find it. The one request that has to
// place instants on a day (`HealthTodayRequest`, for today's workouts) states
// the instants the caller's day begins and ends. A `today` that is not a day of
// the calendar is `ERROR_CODE_INVALID_REQUEST`.
//
// A FIGURE NOTHING FEEDS IS ABSENT, never zero: a day with no row is not a
// day of zero steps, and an average of no days is not an average.

syntax = "proto3";

package centraid.core.v1;

// ---------------------------------------------------------------------------
// Shared shapes.
// ---------------------------------------------------------------------------

// The six daily metrics, in the order Today lists them. Each folds one way:
// steps, active energy and exercise are SUMS of a day (a period's total is
// their sum); sleep is a NIGHT's total keyed to the day the member woke (never
// added across nights); resting heart rate is the store's daily AVERAGE; weight
// is the day's LAST sample (a period's figure is its newest).
enum HealthMetric {
  HEALTH_METRIC_UNSPECIFIED = 0;
  HEALTH_METRIC_STEPS = 1;
  HEALTH_METRIC_SLEEP_MIN = 2;
  HEALTH_METRIC_ACTIVE_ENERGY_KCAL = 3;
  HEALTH_METRIC_EXERCISE_MIN = 4;
  HEALTH_METRIC_RESTING_HR_BPM = 5;
  HEALTH_METRIC_WEIGHT_KG = 6;
}

// A metric's series: the last 7 days, the last 30 days, or the last 12
// calendar months (the current month to today).
enum HealthRange {
  HEALTH_RANGE_UNSPECIFIED = 0;
  HEALTH_RANGE_WEEK = 1;
  HEALTH_RANGE_MONTH = 2;
  HEALTH_RANGE_YEAR = 3;
}

// The trends: the last 30 days, the last 90 days, or the last 12 calendar
// months.
enum HealthTrendRange {
  HEALTH_TREND_RANGE_UNSPECIFIED = 0;
  HEALTH_TREND_RANGE_DAYS_30 = 1;
  HEALTH_TREND_RANGE_DAYS_90 = 2;
  HEALTH_TREND_RANGE_YEAR = 3;
}

// One bucket of a series: a day, a run of days, or a calendar month, and the
// per-day average of the days in it that have a row.
message HealthBucket {
  // The first day, `YYYY-MM-DD`.
  string start = 1;
  // The last day, inclusive. A day bucket's `start`; a month's last day, or
  // `today` for the current month.
  string end = 2;
  // The per-day average over the days that have a row (weight: the newest
  // value in the bucket). Absent when no day in it has a row.
  optional double value = 3;
  // How many days in it have a row.
  uint32 days = 4;
}

// One workout, as the vault holds it.
message HealthWorkoutRow {
  string activity_id = 1;
  // The workout-kinds concept, its key (`run`, or the store's word for a
  // kind the seed does not name) and its label.
  string kind_concept_id = 2;
  string kind_key = 3;
  string kind_label = 4;
  // The store's own word for the kind, kept whole.
  string phone_kind = 5;
  // Instants, `YYYY-MM-DDTHH:MM:SS.sssZ`.
  string started_at = 6;
  string ended_at = 7;
  // What the store measured; absent when it did not.
  optional int64 moving_sec = 8;
  optional double distance_m = 9;
  optional double energy_kcal = 10;
  optional int64 avg_hr_bpm = 11;
  optional double elevation_gain_m = 12;
  // The app or device that recorded it ("Apple Watch").
  optional string recorded_by = 13;
}

// The keyset position of the next page of workouts: the start and the id of
// the last row served. Opaque to a shell; sent back as is.
message HealthWorkoutsCursor {
  string started_at = 1;
  string activity_id = 2;
}

// ---------------------------------------------------------------------------
// The six queries (AppQueryRequest 120-125).
// ---------------------------------------------------------------------------

// `health.today`: today's numbers against the member's own typical (R-1129-8).
message HealthTodayRequest {
  // The caller's local day, `YYYY-MM-DD`.
  string today = 1;
  // The instants the caller's day begins and the next one begins, in UTC
  // (`2026-10-19T22:00:00Z`, fraction optional): a workout that started in
  // [day_start, day_end) is today's. The core reads no zone to find them; an
  // instant not of that shape is `ERROR_CODE_INVALID_REQUEST`.
  string day_start = 2;
  string day_end = 3;
}

message HealthTodayMetric {
  HealthMetric metric = 1;
  // Today's figure: today's row for a sum, last night's for sleep (the row
  // keyed today), today's for resting heart rate, and for weight the newest
  // row in the 30 days to today. Absent when there is none.
  optional double value = 2;
  // The day `value` is for.
  optional string day = 3;
  // The median of the 30 whole days before today that have a row, and the
  // 25th and 75th percentiles of the same days (linear between ranks). Absent
  // when no such day has a row.
  optional double typical = 4;
  optional double low = 5;
  optional double high = 6;
  // How many days fed `typical`.
  uint32 typical_days = 7;
}

message HealthToday {
  string today = 1;
  // All six, in `HealthMetric` order.
  repeated HealthTodayMetric metrics = 2;
  // The workouts that started today, newest first.
  repeated HealthWorkoutRow workouts = 3;
  // A health store has been connected: a `phone_origin` of source `health`
  // exists.
  bool connected = 4;
  // The metrics with any row in the 365 days to today (R-1129-6: a chosen
  // type that read nothing is named by the shell from this).
  repeated HealthMetric metrics_with_data = 5;
}

// `health.series`: one metric over a week, a month or a year.
message HealthSeriesRequest {
  HealthMetric metric = 1;
  HealthRange range = 2;
  // The caller's local day, `YYYY-MM-DD`.
  string today = 3;
}

message HealthSeries {
  HealthMetric metric = 1;
  HealthRange range = 2;
  string today = 3;
  // WEEK: 7 days to today; MONTH: 30 days to today; YEAR: 12 months to
  // today's, each the per-day average of its days that have a row. Oldest
  // first.
  repeated HealthBucket buckets = 4;
  // The period's per-day average over its days that have a row (weight: the
  // newest value in it), and the equal period before it.
  optional double average = 5;
  optional double previous_average = 6;
  // WEEK and MONTH: the 30-day typical (`HealthTodayMetric.typical`). YEAR:
  // the previous year's per-day average.
  optional double typical = 7;
  // The best bucket: the highest, but the lowest for resting heart rate;
  // absent for weight, where no direction is better.
  optional HealthBucket best = 8;
  // The period's total, for a sum metric only.
  optional double total = 9;
  // How many buckets with a value are above `typical`, out of how many have a
  // value.
  uint32 above_typical = 10;
  uint32 counted = 11;
}

// `health.trends`: every metric over a range, with a sparkline.
message HealthTrendsRequest {
  HealthTrendRange range = 1;
  // The caller's local day, `YYYY-MM-DD`.
  string today = 2;
}

message HealthTrend {
  HealthMetric metric = 1;
  // The period's per-day average (weight: the newest value in it), and the
  // equal period before it's.
  optional double average = 2;
  optional double previous = 3;
  // 9 buckets for 30 and 90 days (the days split as evenly as they go, the
  // later buckets taking the extra day), 12 months for a year. Oldest first.
  repeated HealthBucket buckets = 4;
}

message HealthTrends {
  HealthTrendRange range = 1;
  string today = 2;
  // In `HealthMetric` order; a metric with no row in either period is absent.
  repeated HealthTrend trends = 3;
}

// `health.workouts`: every workout, newest first, a page at a time.
message HealthWorkoutsRequest {
  // Only this kind's workouts; absent is every workout.
  optional string kind_concept_id = 1;
  // REQUIRED: 0 is `ERROR_CODE_INVALID_REQUEST`, never a default. At most 200.
  uint32 limit = 2;
  // The previous page's `next`; absent is the first page.
  optional HealthWorkoutsCursor after = 3;
}

message HealthKindCount {
  string kind_concept_id = 1;
  string kind_key = 2;
  string kind_label = 3;
  uint32 count = 4;
}

message HealthWorkouts {
  repeated HealthWorkoutRow workouts = 1;
  // Every kind with a workout, and how many, whatever the filter: the chips.
  // Most first, then by label.
  repeated HealthKindCount kinds = 2;
  // The next page; absent when this page is the last.
  optional HealthWorkoutsCursor next = 3;
}

// `health.workout`: one workout.
message HealthWorkoutRequest {
  string activity_id = 1;
}

message HealthWorkout {
  // Absent when no such workout is in the vault.
  optional HealthWorkoutRow workout = 1;
}

// `health.follow_view`: what the follower engine reads before a pass
// (R-1129-3, R-1129-4). It derives its read window from the two latests and
// diffs the store's totals against `days`, sending only what moved.
message HealthFollowViewRequest {
  // `YYYY-MM-DD`: the first day of the window the engine is about to read.
  // A window holding more than 2,400 rows (400 days of the six metrics) is
  // `ERROR_CODE_READ_BOUND_REACHED`, never a short answer.
  string since = 1;
}

message HealthDayValue {
  string day = 1;
  HealthMetric metric = 2;
  double value = 3;
}

message HealthFollowView {
  // The newest day with any row; absent when there is none.
  optional string latest_day = 1;
  // The newest followed workout's start; absent when there is none.
  optional string latest_workout_started_at = 2;
  // Every (day, metric, value) the vault holds with day >= `since`, oldest
  // first.
  repeated HealthDayValue days = 3;
}
