// NOTES' QUERIES, AS THE CORE ANSWERS THEM (#1046).
//
// `crates/apps/notes` folds the library (a bounded recent window plus EVERY
// pinned note, decorated by `IN`-bounded reads of the edges that carry its
// tags, links and attachments), the memo set that four surfaces exclude (a
// note with an `about` edge: a People-journal entry among them), a note's
// revisions and the powerbox over every searchable kind (D-1020-N1). These are
// its answers, typed. A shell reaches them through `app_query.proto`'s
// `AppQueryRequest` at numbers 40-49, and draws them; it joins nothing and
// decodes no body.
//
// Every message mirrors one Rust struct in `crates/apps/notes/src/queries.rs`
// or `editor.rs`; `crates/core`'s `app_query_notes` module is the one
// conversion. Instants are the vault's text form,
// `YYYY-MM-DDTHH:MM:SS.mmmZ`; days are `YYYY-MM-DD`.
//
// THE JOURNAL ASYMMETRY IS THE CONTRACT (D-1020-N3): a memo (a People-journal
// entry is one) is absent from `library`, `trash`, the tag chips, `search` and
// `link_targets`, is the whole of `journal`, and is still answered by `note`,
// because the People screen opens one by id.
//
// CIVIL DAYS. `library`, `trash` and `history` take a `tz` and answer each
// instant's `*_local_day` beside it, so "edited today" and "purges on" are
// string comparisons in a view. `agenda.proto`'s zone rule, unsoftened: an
// empty `tz` is the vault's zone, and a request that states none in a vault
// whose settings name none — or names one the bundled database does not
// know — is `ERROR_CODE_INVALID_REQUEST`. Never UTC.
//
// A LIST ROW CARRIES A PREVIEW, NEVER A BODY (#404). `note` is the editor's
// lazy pull of the full text.

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/container.proto";

// ---------------------------------------------------------------------------
// The requests.
// ---------------------------------------------------------------------------

// How the library's shelf is ordered. PINNED NOTES LEAD under every order.
enum NotesSort {
  // The default: newest `updated_at` first.
  NOTES_SORT_UNSPECIFIED = 0;
  NOTES_SORT_UPDATED = 1;
  NOTES_SORT_CREATED = 2;
  // Title, case-insensitively, A first.
  NOTES_SORT_TITLE = 3;
}

// `notes.library`: the live shelf.
//
// The filters narrow the WINDOW the vault returned, never the vault: a
// notebook or tag filter over a truncated window answers `truncated = true`,
// and a wider `window` is the member's way to see further. `pinned_only` is
// complete whatever the window, because every pinned note is read beside it.
message NotesLibraryRequest {
  // Rows in the recent window. 0 is the manifest's default (200); anything
  // else is clamped to 20..2000.
  uint32 window = 1;
  NotesSort sort = 2;
  bool pinned_only = 3;
  // Only notes filed in this notebook. Empty is every notebook and none.
  string notebook_id = 4;
  // Only notes filed in NO notebook. Ignored when `notebook_id` is set.
  bool unfiled_only = 5;
  // Only notes carrying EVERY one of these concepts.
  repeated string tag_concept_ids = 6;
  // The zone each row's `*_local_day` is read in; see "CIVIL DAYS" below.
  string tz = 7;
}

// `notes.notebooks`: the spine.
message NotesNotebooksRequest {}

// `notes.journal`: the People-journal entries, grouped by the local day each
// was written on.
message NotesJournalRequest {
  // As `NotesLibraryRequest.window`.
  uint32 window = 1;
  // The zone the days are in: `agenda.proto`'s rule — an IANA name, EMPTY is
  // the vault's zone, and neither is REFUSED (`ERROR_CODE_INVALID_REQUEST`).
  string tz = 2;
}

// `notes.search`: full-text search over live, non-journal notes, in the
// index's rank order, at most 100 hits.
message NotesSearchRequest {
  // A blank term answers no hits, as does a term with no searchable word.
  string term = 1;
  // The zone each hit's `*_local_day` is read in: the stated name, else the
  // vault's. An unknown name is refused; no zone at all answers EMPTY days
  // rather than failing a search over a decoration.
  string tz = 2;
}

// `notes.trash`: the trash shelf, newest `deleted_at` first, at most 200.
message NotesTrashRequest {
  // As `NotesLibraryRequest.tz`.
  string tz = 1;
}

// `notes.history`: one note's body versions, newest first.
message NotesHistoryRequest {
  string note_id = 1;
  // As `NotesLibraryRequest.tz`.
  string tz = 2;
}

// `notes.link_targets`: the powerbox — what a note can link to.
message NotesLinkTargetsRequest {
  string term = 1;
  // The zone `NotesLinkTarget.subtitle_local_day` is read in. A DECORATION's
  // zone: none stated on a vault that names none leaves the days EMPTY
  // rather than refusing the sheet; an unknown name is refused.
  string tz = 2;
}

// `notes.note`: one note, whole, for the editor.
message NotesNoteRequest {
  string note_id = 1;
  // As `NotesSearchRequest.tz`: the zone of the note's local readings.
  string tz = 2;
}

// ---------------------------------------------------------------------------
// The answers.
// ---------------------------------------------------------------------------

message NotesLibrary {
  // Pinned first, then by the request's sort.
  repeated NotesRow notes = 1;
  repeated NotesNotebook notebooks = 2;
  // The chips the WINDOW saw, by label.
  repeated NotesTagFacet tags = 3;
  // The recent window filled: there may be more notes than it holds.
  bool truncated = 4;
  uint32 window = 5;
}

message NotesNotebooks {
  // By `sort_order`, then id.
  repeated NotesNotebook notebooks = 1;
  // The "Unfiled" row's count: live, non-journal notes filed in no notebook,
  // over the library's default recent window (200, newest `updated_at`) —
  // the same rows `NotesLibraryRequest.unfiled_only` draws at that window.
  uint32 unfiled_count = 2;
  // More live notes exist beyond that window, so `unfiled_count` is of the
  // window only.
  bool unfiled_truncated = 3;
}

message NotesJournal {
  // Newest day first; within a day, newest `created_at` first. Only days
  // with an entry.
  repeated NotesJournalDay days = 1;
  // The vault clock's day in the request's zone.
  string today = 2;
  bool truncated = 3;
  uint32 window = 4;
  // The IANA zone `today` and every day's grouping were read in: the request's,
  // else the vault's own. A new entry is filed ON `today` IN THIS ZONE
  // (`people.add_journal_entry`'s `tz`), so a shell states it back rather than
  // computing a zone of its own.
  string tz = 5;
}

message NotesSearch {
  repeated NotesSearchHit hits = 1;
  // THE WORDS THE ROWS ANSWER. Set only when the term as typed found fewer than
  // three rows and a correction of its words added some: the typed words with each
  // mistyped one replaced by a word the vault's own index holds. The rows
  // above are the exact rows first and then the ones the corrected words
  // found, none twice. EMPTY when nothing was added. A shell says
  // "Including results for <corrected>".
  string corrected = 2;
  // THE CONTAINERS THE TERM NAMES (#1097, R-1097-19..21): the notebooks whose own name
  // matched, in the index's rank order, at most eight. Empty when none did. A
  // correction counts them: the term is corrected only when the rows and these
  // are both empty.
  repeated ContainerHit containers = 3;
}

message NotesTrash {
  repeated NotesRow notes = 1;
}

message NotesHistory {
  // Newest first; `current` is the first, then each `revision` — the words a
  // later edit replaced — newest to oldest.
  repeated NotesVersion versions = 1;
  // More revisions exist than the newest 200 listed.
  bool truncated = 2;
}

message NotesLinkTargets {
  // Grouped by domain in the search crate's domain order, at most eight each.
  // A Locker item is a target too (#1135), found by its plain title.
  repeated NotesLinkTarget targets = 1;
}

// The editor's note. `found = false` is a note id nothing answers to — never
// an empty note a save would write over.
message NotesNote {
  // `body_content_id` and `current_revision_id`: a body is the note's own
  // column now and a version is a `revision` with a `seq`; `row_version` is the
  // editor's base.
  reserved 7, 8;
  reserved "body_content_id", "current_revision_id";
  bool found = 1;
  string note_id = 2;
  string title = 3;
  // `markdown` or `plain`.
  string format = 4;
  bool pinned = 5;
  // The whole body.
  string body = 6;
  // THE EDITOR'S BASE: bumped once by every commit that changes the note — title,
  // pin, format, body, notebook, trash. An editor that saw this version and
  // reads a different one has lost a race; the command takes no base, so the
  // last save wins (R-1047-K3).
  int64 row_version = 9;
  string created_at = 10;
  string updated_at = 11;
  // Set when the note is in the trash; `note.edit` refuses it.
  optional string deleted_at = 12;
  optional string purge_at = 13;
  // The one notebook it is filed in (`note.notebook_id`).
  optional string notebook_id = 14;
  // `created_at`'s and `updated_at`'s civil days, and `updated_at`'s wall
  // clock (`YYYY-MM-DDTHH:MM`), in the request's zone — what "Edited" says.
  // EMPTY when no zone resolved (`NotesNoteRequest.tz`).
  string created_local_day = 15;
  string updated_local_day = 16;
  string updated_local = 17;
}

// ---------------------------------------------------------------------------
// The parts.
// ---------------------------------------------------------------------------

message NotesRow {
  string note_id = 1;
  optional string title = 2;
  optional string format = 3;
  bool pinned = 4;
  optional string created_at = 5;
  optional string updated_at = 6;
  optional string deleted_at = 7;
  optional string purge_at = 8;
  // Six lines, 200 characters, marks stripped.
  string preview = 9;
  uint32 check_total = 10;
  uint32 check_done = 11;
  repeated string notebook_ids = 12;
  repeated string notebook_names = 13;
  repeated NotesAttachment attachments = 14;
  repeated NotesReference references = 15;
  repeated NotesBacklink backlinks = 16;
  repeated NotesTag tags = 17;
  // The civil days (`YYYY-MM-DD`) of the four instants above in the
  // request's zone; EMPTY when the instant is absent.
  string created_local_day = 18;
  string updated_local_day = 19;
  string deleted_local_day = 20;
  string purge_local_day = 21;
}

message NotesSearchHit {
  string note_id = 1;
  optional string title = 2;
  optional string format = 3;
  bool pinned = 4;
  optional string created_at = 5;
  optional string updated_at = 6;
  string preview = 7;
  uint32 check_total = 8;
  uint32 check_done = 9;
  repeated string notebook_ids = 10;
  repeated string notebook_names = 11;
  repeated NotesAttachment attachments = 12;
  // The index's highlight, matches between `⟦` and `⟧`.
  string snippet = 13;
  // The civil days of `created_at` and `updated_at` in the request's zone;
  // EMPTY when the instant is absent or no zone resolved.
  string created_local_day = 14;
  string updated_local_day = 15;
}

// A notebook is a `core_collection` whose `kind` is `notebook` (#274, rung
// six). The same table holds Photos' albums, and the read filters them out by
// kind, so every row here is a notebook.
message NotesNotebook {
  // Was `other_entry_count`, the album heuristic `kind` replaced.
  reserved 6;
  reserved "other_entry_count";
  string notebook_id = 1;
  optional string name = 2;
  int64 sort_order = 3;
  optional string parent_notebook_id = 4;
  // Live, non-journal notes filed here. Zero in `NotesLibrary.notebooks`,
  // which does not count.
  uint32 note_count = 5;
}

message NotesTagFacet {
  string concept_id = 1;
  string label = 2;
}

message NotesTag {
  // `tag_id`: a tag on a note is an edge, which has no id of its own; the tag's
  // `concept_id` and the note name it.
  reserved 1;
  reserved "tag_id";
  string concept_id = 2;
  string label = 3;
}

message NotesAttachment {
  // `role` and `is_primary`: an attachment is an `attached` edge and keeps
  // neither.
  reserved 3, 4;
  reserved "role", "is_primary";
  // The attached document's or photo's id: the edge has no id of its own.
  string attachment_id = 1;
  // The bytes' blob hash.
  string content_id = 2;
  string media_type = 5;
  string content_uri = 6;
  int64 byte_size = 7;
}

// The far end of a link, as a shelf draws it.
message NotesCard {
  // The thing's kind (`person`, `event`, `task`, `document`, `photo`, ...);
  // EMPTY when `status` is `missing`.
  string entity = 1;
  string id = 2;
  // `live`, `trashed` or `missing`.
  string status = 3;
  optional string title = 4;
  // What the kind adds: a person's form, an event's start, a task's status, a
  // document's media type, a photo's form.
  optional string subtitle = 5;
  // A person's avatar or a photo's blob hash.
  optional string thumbnail_content_id = 6;
}

message NotesReference {
  // `link_id`: a `links` edge has no id of its own.
  reserved 1;
  reserved "link_id";
  // The edge's anchor, as JSON: a wikilink's names its title, a link made by
  // hand names a range of the text. Resolving it is presentation (#282).
  optional string selector_json = 2;
  NotesCard card = 3;
}

message NotesBacklink {
  reserved 1;
  reserved "link_id";
  NotesCard card = 2;
}

message NotesJournalDay {
  // `YYYY-MM-DD` in the request's zone.
  string day = 1;
  repeated NotesJournalEntry entries = 2;
}

message NotesJournalEntry {
  string note_id = 1;
  optional string title = 2;
  optional string format = 3;
  string created_at = 4;
  optional string updated_at = 5;
  // `HH:MM`, the wall clock `created_at` reads in the request's zone.
  string local_time = 6;
  string preview = 7;
  uint32 check_total = 8;
  uint32 check_done = 9;
}

message NotesVersion {
  // `content_id` and `media_type`: a version is a `revision`, named by its
  // `seq`, and a note's format is the note's.
  reserved 1, 3;
  reserved "content_id", "media_type";
  string body = 2;
  bool current = 4;
  // When these words became the note's: when the words before them were
  // replaced, or the note's creation for its first.
  string asserted_at = 5;
  // `asserted_at`'s civil day in the request's zone; EMPTY as `NotesRow`'s.
  string asserted_local_day = 6;
  // `asserted_at`'s wall clock there, `YYYY-MM-DDTHH:MM`, for the history's
  // time of day. EMPTY as `asserted_local_day`.
  string asserted_local = 7;
  // The `revision`'s `seq`, which `note.restore_version` takes; 0 for the
  // current words, which no revision holds.
  int64 seq = 8;
}

message NotesLinkTarget {
  // The thing's kind, e.g. `note`, `person`, `task`.
  string entity = 1;
  string id = 2;
  string title = 3;
  string subtitle = 4;
  // The app a member would open it in.
  string app_id = 5;
  string snippet = 6;
  // THE SUBTITLE'S CIVIL DAY, `YYYY-MM-DD`, when the subtitle is a when (an
  // event's `dtstart`, a task's `due_at`, an expense's `spent_on`): a date or
  // a floating wall clock is its own date part; an instant (a `Z` or an
  // offset) is its day in the request's zone. EMPTY when the subtitle is not
  // a when, or is an instant and no zone is known — never a UTC slice.
  string subtitle_local_day = 7;
}
