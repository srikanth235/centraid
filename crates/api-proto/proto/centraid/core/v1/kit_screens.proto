// THE VIEW VOCABULARY EVERY APP'S SCREENS SHARE (#1135): the three states of a
// read, the empty state, the status line, the confirm, the autosave line. Rust
// finishes every sentence in these; SwiftUI and Compose draw them.
//
// A LEAF FILE (it imports only `route.proto`), so an app's own `<app>_screens.proto`
// and `screens.proto` can both import it without a cycle.

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/route.proto";

// THE READ LAW: a failed read is not an empty list. A view has three states —
// loading, a `Failure`, data — and never two.
message Failure {
  // A finished sentence for the member.
  string sentence = 1;
  // Something the member can do about it; empty when nothing.
  string remedy = 2;
  // Trying again cannot help (the item is gone, or cannot be opened here): the shared view
  // draws no Retry. False for an ordinary failed read.
  bool permanent = 3;
}

// The loading state. A message rather than a bare `bool`, so the oneof can hold
// it as a present value and a decode of an unset oneof stays distinguishable
// from "loading" — the same reason `centraid.core.v1.NullValue` is a message.
message Loading {
  // 1 was `first_load`: a refresh never shows the skeleton over what is on screen, so a loading
  // state is always the first one (#1185).
  reserved 1;
  reserved "first_load";
}

// THE VAULT WOULD NOT LET THIS APP READ — a state, not an error (law 1's
// fourth shape where a screen has one). Finished strings; `receipt` names what
// was asked and refused, so a member can find the grant.
message Denied {
  string title = 1;
  string body = 2;
  string receipt = 3;
}

// A list with nothing in it, said once: one sentence and at most one action
// (design/wording.md § Wording). `action_label` empty means no action; the action
// itself is the screen's own event.
message EmptyState {
  string headline = 1;
  string body = 2;
  string action_label = 3;
  // `offers_example`, which put "See an example" under an app's day-one
  // empty state, retired with the preview (R-ONBOARD-12).
  reserved 4;
  reserved "offers_example";
  // WHERE THE PHONE ALREADY HOLDS THIS APP'S DATA, on an app's day-one empty
  // state only. A shell that can read that source draws its import as the
  // empty state's action in place of `action_label` — asked here, at the point
  // of use, never as an up-front permission wall — and a shell that cannot
  // draws `action_label` as before. The app's own add stays in its header.
  ImportSource import_source = 5;
  // The catalogue glyph on the card's wash. Empty means the app's own glyph
  // (day one); a trash's empty state says "Trash", so Locker's empty trash does
  // not wear a lock.
  string icon_key = 6;
  // The small line under the action on an app's first open ("Or tap + to write one."):
  // the way to add by hand, once the card has said what the app is for. Empty elsewhere.
  string hint = 7;
}

// A SOURCE ON THE PHONE ITSELF that an app's day-one empty state can import
// from in one tap. The
// OS asks its own permission when the member taps it, never before.
enum ImportSource {
  IMPORT_SOURCE_UNSPECIFIED = 0;
  // The phone's contacts, into People: a person per contact, with its phone
  // numbers, email addresses and birthday.
  IMPORT_SOURCE_CONTACTS = 1;
  // The phone's calendars the member writes to, into Agenda: each event from
  // a week back to two months on, timed or all-day, free or busy as the
  // calendar holds it. Subscribed and birthday calendars are not read.
  IMPORT_SOURCE_CALENDAR = 2;
  // The phone's open reminders, into Tasks: a task per reminder, with its due
  // day and notes. iOS has a system source; Android has none, so its shell
  // draws the app's own action.
  IMPORT_SOURCE_REMINDERS = 3;
}

// THE ONE ASK A SEARCH OFFERS (#1135), finished by `SearchLaw` so every app reads
// it the same way: `label` is the row's words ("Ask about “x”"), `question` is
// what the chat is sent ("Find x"), and `scope` is the chat scope to open it in,
// the id of the app the member searched from (`agenda`, `notes`, ...), or EMPTY
// for Home's, which asks the assistant across every app.
message SearchAsk {
  string label = 1;
  string question = 2;
  string scope = 3;
  // The page a tap opens: `chat.ask`, the assistant asking `question` in `scope`. A
  // shell pushes it; it builds no route of its own.
  Route route = 4;
}

// A CONTAINER AS A SEARCH RESULT (#1097, R-1097-19..21): one notebook, album,
// project or Docs folder, finished in Rust so Home's search and the owning
// apps' own searches draw the same row and open it by the same push.
message SearchContainer {
  // The index's entity kind (`notebook`, `album`, `project`, `folder`) and the
  // row's own id.
  string entity = 1;
  string id = 2;
  // The app it opens in: `notes`, `photos`, `agenda`, `docs`.
  string app_id = 3;
  // What it IS, in a word: "Notebook", "Album", "Project", "Group", "Folder".
  string kind_label = 4;
  string title = 5;
  // The kit's glyph for that kind (`Book`, `Image`, `List`, `Users`, `Folder`).
  string icon_key = 6;
  // "Notebook, Cabin".
  string accessibility_label = 7;
  // WHERE A TAP GOES: the page that opens this container, as the route the
  // shell pushes.
  Route route = 8;
}

// A decision the member confirms. Full sentences, because only a destructive
// confirm earns them (design/behaviour.md § Controls); `destructive` draws the outlined `net` action.
message Confirm {
  string title = 1;
  string body = 2;
  string confirm_label = 3;
  bool destructive = 4;
  // ONE AMBER LINE ABOVE THE BODY, or empty (#1209, R4): what the member should know before the
  // thing is done, and may still do. Photos says a photograph no backup device holds whole
  // cannot be brought back.
  string warning = 5;
}

// THE ONE STATUS LINE (design/behaviour.md § Status line). One clause, at most one verb.
// A screen carries it where it says what a write did — "Task done" with
// Undo — and `action_label` empty is a line with no verb. What the verb does
// is the kit's `StatusActed` (any screen), or the screen's own.
message StatusLine {
  string sentence = 1;
  // "Undo", or empty.
  string action_label = 2;
  // The vault refused a write: the sentence is the core's.
  bool refused = 3;
}

// The status line's verb is tapped. One event for every screen: the screen runs the inverse it
// offered (`kit::undo`).
message StatusActed {}

// ---------------------------------------------------------------------------
// The kit's trash screen (`<app>.trash`, arm 900 of Route/ScreenEvent/ViewState)
// ---------------------------------------------------------------------------

// One trashed row, finished: `meta` is "Deleted Wed 11 March · Erased Mon 12
// October" (the erase clause is left off where the core stated no day). The
// verbs are the kit's words, identical in every app.
message TrashRow {
  string id = 1;
  string title = 2;
  string meta = 3;
  string icon_key = 4;
  string restore_label = 5;
  string purge_label = 6;
}

message TrashData {
  repeated TrashRow rows = 1;
  // 2 was `empty`: a trash with nothing in it is the page's own empty state (#1185).
  reserved 2;
  reserved "empty";
  // "Empty trash"; empty when the app cannot empty its trash, or has nothing in it.
  string empty_label = 3;
  // The scope line under the title ("Trash · 3"); empty when there is nothing in it.
  string count_label = 4;
}

// ---------------------------------------------------------------------------
// Earlier versions (#1185): every record keeps its earlier values, and one screen lists them
// ---------------------------------------------------------------------------

// `shell.origin-of`: where one record came from (#1185). `system` is the origin's system (a followed
// store: `contacts`, `calendar`, `files`, `health`, `statement`; or an arrival: `camera_roll`,
// `picker`, `vcard`, `markdown`, `csv`, `scan`, `upload`, `phone_reminders`) and `label` its name
// (a store, a file, a device). Both empty for an item the member typed. A Locker label is a file
// name and nothing of what is in it.
message OriginOf {
  string system = 1;
  string label = 2;
}

// `shell.earlier-count`: how many earlier versions one record holds.
message EarlierCount {
  uint32 count = 1;
}

// `shell.earlier-versions`: one page of a record's earlier versions, newest first. Every value is
// JSON text in the form the vault keeps it; the app's screen words it.
message EarlierVersions {
  repeated EarlierVersion versions = 1;
  // The page after this one starts below this seq; absent on the last page.
  optional int64 next = 2;
  // The titles of the other records the page's changes name by id (a list or album a record was
  // in, an item it was linked to), so the screen can word them. One entry per id, only ones the
  // vault still holds and may show.
  repeated EarlierName names = 3;
}

// A record's title, by id.
message EarlierName {
  string id = 1;
  string title = 2;
}

message EarlierVersion {
  // The version's number: what Restore names.
  int64 seq = 1;
  // When it was replaced, and when it became the record's state, as civil minutes in the
  // request's zone (`YYYY-MM-DDTHH:MM`); empty when the vault names no zone.
  string replaced_local = 2;
  string since_local = 3;
  // The phone store whose pass replaced it, and the one whose pass made it the record's state
  // (`contacts`, `calendar`, `files`, `health`, `statement`); empty when the member did.
  string store_system = 4;
  string since_store_system = 6;
  // `assist` when the chat made the change that replaced it, and when the chat made it the record's
  // state; empty otherwise.
  string made_by = 7;
  string since_made_by = 8;
  // What the replacing change moved, field by field: `entity.title`, `<kind table>.<column>`,
  // `contact_point[<key>].<column>`, `attendee[<person>]`, and what decorates the record: `tag[<id>]`,
  // `flag[<id>]`, `membership[<list>]`, `link[<id>]` (either end), `about[<id>]`,
  // `depicts[<id>]`.
  repeated EarlierChange field_changes = 5;
}

message EarlierChange {
  string field = 1;
  string before_json = 2;
  string after_json = 3;
}

message EarlierField {
  string field = 1;
  string value_json = 2;
}

// `shell.earlier-record`: one earlier version of a record, whole. Every value is JSON text in the
// form the vault keeps it, a sealed cell as the vault's placeholder; the app's screen words it.
message EarlierRecord {
  // The version's number: what Restore names.
  int64 seq = 1;
  // When it was replaced, and when it became the record's state, as civil minutes in the
  // request's zone; empty when the vault names no zone.
  string replaced_local = 2;
  string since_local = 3;
  // The phone store whose pass replaced it, and the one whose pass made it the record's state;
  // empty when the member did.
  string store_system = 4;
  string since_store_system = 5;
  // Every field the version held: `entity.title`, `<kind table>.<column>`, and each child row whole
  // as `contact_point[<key>]`.
  repeated EarlierField fields = 6;
  // What the replacing change moved, field by field, as the list gives it.
  repeated EarlierChange field_changes = 7;
  // The titles of the other records the version, or its change, names by id, as the list's page
  // gives them.
  repeated EarlierName names = 8;
  // `assist` when the chat made the change that replaced it, and when it made it the record's
  // state; empty otherwise.
  string made_by = 9;
  string since_made_by = 10;
}

// One row of the earlier-versions list. The first is the record as it is now, tagged "Current",
// and carries no Restore.
message EarlierRow {
  // The version's number; 0 for the current row.
  int64 seq = 1;
  // "Wed 4 November · 09:12", with "· From your phone" after it when a phone store made the change
  // that replaced the version.
  string label = 2;
  // One line: the values the version held.
  string value = 3;
  bool current = 4;
  // "Current" on the current row, else empty.
  string current_label = 5;
  // "Restore"; empty on the current row.
  string restore_label = 6;
  string accessibility_label = 7;
  // A sealed value the version held, one per changed secret (Locker's password, card number, ...).
  // Never the value: `masked` is dots, and the value arrives in `EarlierSecret.value` only after
  // a Reveal, behind the owner check, for a short life. Empty for every other app.
  repeated EarlierSecret secrets = 8;
  // Opens the full preview of this version (`<app>.earlier` on one version); absent on the
  // current row, which is the record itself.
  optional Route preview = 9;
}

// ONE SEALED VALUE OF AN EARLIER VERSION (Locker, #1185). Shown as `label` and `masked` with the
// `reveal_label` control. A Reveal tap sends `EarlierEvent.reveal` with the row's `seq` and this
// `key`; the core opens the cell, and the screen answers `revealed` with `value` for its life,
// then conceals it again. A shell draws only what is here and keeps no copy; the screen raises
// the screenshot shield itself.
message EarlierSecret {
  // What to send back: the cell's name (`password`, `field:<id>`).
  string key = 1;
  // "Password".
  string label = 2;
  // Always dots, the same for every value: neither the value nor its length.
  string masked = 3;
  // The revealed value while `revealed`; empty otherwise.
  string value = 4;
  bool revealed = 5;
  // "Reveal"; empty for a secret that is never shown (a one-time-code seed).
  string reveal_label = 6;
  // "Conceal"; empty when `reveal_label` is.
  string conceal_label = 7;
  string accessibility_label = 8;
}

message EarlierData {
  repeated EarlierRow rows = 1;
  // 2 was `empty`: a record with no earlier version is the page's own empty state (#1185).
  reserved 2;
  reserved "empty";
  // "Show more" when a page below this one exists; empty otherwise.
  string more_label = 3;
}

// What the full preview of one earlier version shows (#1185): the record as it was, drawn read-only
// under a banner that says which version it is, with Restore and Close. The screen name
// (`<app>.earlier`) says which app.
message EarlierPreviewView {
  string app_id = 1;
  // "Earlier version", and the back control's words: the list it was opened from.
  string title = 2;
  string back_label = 3;
  PageState page = 4;
  // Set when the page is ready.
  optional EarlierPreviewData data = 5;
  // A refusal's sentence, or "Already how it is now".
  StatusLine status = 6;
  // THE SHELL POPS THIS SCREEN: it was closed, or restored (the list beneath draws the line).
  bool done = 7;
}

message EarlierPreviewData {
  // "As it was on Tue 27 October · 20:40", with "· From your phone" when a store made it.
  string banner_headline = 1;
  // "Changed on Wed 4 November · 09:12 to Friend · London"; empty when nothing shows.
  string banner_changed = 2;
  // "Read only. Nothing changes until you restore it."
  string banner_note = 3;
  // The record's first line, as its own page heads it.
  string heading = 4;
  // The rest of what the version held, one worded line each.
  repeated string details = 5;
  string restore_label = 6;
  string close_label = 7;
  string accessibility_label = 8;
}

message EarlierPreviewEvent {
  oneof kind {
    // The failure's "Try again".
    Refreshed refreshed = 1;
    // "Restore this version": it asks nothing, as the list's Restore does.
    Restored restore = 2;
    Closed close = 3;
  }

  message Refreshed {}
  message Restored {}
  message Closed {}
}

// What the earlier-versions screen shows. The screen name (`<app>.earlier`) says which app.
message EarlierView {
  string app_id = 1;
  // "Earlier versions", and the back control's words: the page it was pushed from.
  string title = 3;
  string back_label = 4;
  // 5, 6 and 7 were `loading`, `failure` and `denied`: the read is `page` (#1185).
  reserved 5, 6, 7;
  reserved "loading", "failure", "denied";
  // Set when the page is ready.
  oneof content {
    EarlierData data = 8;
  }
  // "Earlier version restored" with "Undo", or a refusal's sentence; the list stays.
  StatusLine status = 9;
  // THE READ: loading, failed, refused, empty, or ready, with a note when a re-read failed.
  PageState page = 10;
}

message EarlierEvent {
  oneof kind {
    // The failure's "Try again".
    Refreshed refreshed = 1;
    // Restore asks nothing: it undoes.
    RestoreTapped restore = 2;
    MoreTapped more = 3;
    // "Undo" on the status line after a restore.
    StatusActed status_acted = 4;
    // Reveal a sealed value of one version (Locker): `EarlierSecret.reveal_label`.
    SecretTapped reveal = 5;
    // Conceal it again: `EarlierSecret.conceal_label`.
    SecretTapped conceal = 6;
  }

  message SecretTapped {
    int64 seq = 1;
    string key = 2;
  }

  message Refreshed {}

  message RestoreTapped {
    int64 seq = 1;
  }

  message MoreTapped {}

  message StatusActed {}
}

// THE TRANSFER SCREEN (#1173): bring something in from a file, or write something out to one,
// in the app's own words. Rust decides every line; the shell draws the rows and the buttons and
// sends back the key of whichever was tapped. `<app>.import` reads a file or folder, shows what
// it holds as rows, and waits for the member's tap on the primary action; `<app>.export` lists
// what can go out as tappable rows.
message TransferView {
  string app_id = 1;
  // "Import notes", and the back control's words.
  string title = 2;
  string back_label = 3;
  // What is happening, in a line ("Ready to import", "Imported 12 notes").
  string headline = 4;
  // One sentence of what the page does.
  string lede = 5;
  // What the file holds (label and count), or what can be exported (tappable).
  repeated TransferRow rows = 6;
  repeated TransferAction actions = 7;
  // A read or a write is under way: the rows and buttons are drawn but do nothing.
  bool busy = 8;
  StatusLine status = 9;
  // THE READ, for a page that reads the vault (Reconnect): loading, or failed with Retry. Unset
  // is ready, for the pages that read nothing (an export's choices, a file's import).
  PageState page = 10;
}

message TransferRow {
  string key = 1;
  string label = 2;
  // A count or a short fact; empty for a tappable scope row.
  string value = 3;
  bool tappable = 4;
  string icon_key = 5;
  string accessibility_label = 6;
}

message TransferAction {
  string key = 1;
  string label = 2;
  // The one filled button of the page.
  bool primary = 3;
  bool enabled = 4;
}

// A tap on an action or a row: its key.
message TransferEvent {
  string key = 1;
  // The failed read's "Try again": the page reads again.
  bool refreshed = 2;
}

// What a trash screen shows. The screen name (`<app>.trash`) says which app.
message TrashView {
  string app_id = 1;
  // "Trash", and the back control's words: the app the trash belongs to
  // ("Agenda"), because the page was pushed from it.
  string title = 2;
  string back_label = 3;
  // 4, 5 and 6 were `loading`, `failure` and `denied`: the read is `page` (#1185).
  reserved 4, 5, 6;
  reserved "loading", "failure", "denied";
  // Set when the page is ready.
  oneof content {
    TrashData data = 7;
  }
  // The confirm on screen: a purge of one row, or the emptying of the shelf.
  optional Confirm confirm = 8;
  // A refusal's sentence, over the list; the list stays.
  StatusLine status = 9;
  // 10 was `purge_window_days`: nothing read it (#1152).
  reserved 10;
  reserved "purge_window_days";
  // THE READ: loading, failed, refused, empty, or ready, with a note when a re-read failed.
  PageState page = 11;
}

message TrashEvent {
  oneof kind {
    // The failure's "Try again".
    Refreshed refreshed = 1;
    // Restore asks nothing: it undoes.
    RestoreTapped restore = 2;
    // Destroying asks first (`Confirm`), in full sentences.
    PurgeTapped purge = 3;
    EmptyTapped empty = 4;
    Confirmed confirmed = 5;
    Dismissed dismissed = 6;
    // "Undo" on the status line after a restore: the row goes back in the trash.
    StatusActed status_acted = 7;
  }

  message Refreshed {}

  message RestoreTapped {
    string id = 1;
  }

  message PurgeTapped {
    string id = 1;
  }

  message EmptyTapped {}

  message Confirmed {}

  message Dismissed {}

  message StatusActed {}
}

// Which field, and which item of it, the action takes the phone's value for. Opaque to a shell:
// it is sent back as it came.
message PhoneSaysTake {
  string field = 1;
  // The item of a field made of items; absent for the whole field.
  optional string item_key = 2;
}

// The action is tapped: the screen takes the phone's value and reads again, so the line goes.
// The same event on every page that draws a `PhoneSays`.
message PhoneSaysTaken {
  PhoneSaysTake take = 1;
}

// ---------------------------------------------------------------------------
// The general link (#1185): any item linked to any other, one read each way
// ---------------------------------------------------------------------------

// `shell.links`: what one item is linked to, both ways, in name order. A Locker item is listed only
// on its own page.
message LinkedItems {
  repeated LinkedItem items = 1;
}

message LinkedItem {
  // The linked item's entity id.
  string id = 1;
  // `person`, `place`, `event`, `task`, `note`, `document`, `photo`, `account`, `transaction`,
  // `workout`, or `locker_item` on a Locker item's own page. A screen routes by it.
  string kind = 2;
  string title = 3;
  // The member's own person: "You".
  bool is_owner = 4;
  // The link is written as [[title]] in a note's text, in either direction; it is taken off by
  // editing that text, not here.
  bool in_text = 5;
}

// `shell.link-candidates`: the items of one kind the picker offers for a typed term, at most 50,
// in name order. Never a Locker item.
message LinkCandidates {
  repeated LinkCandidate candidates = 1;
}

message LinkCandidate {
  string id = 1;
  string title = 2;
  // The member's own person: listed first, said as "You".
  bool is_owner = 3;
}

// THE STATE OF A PAGE'S READ, said once for every screen that reads (#1185). The oneof is what
// the page shows INSTEAD of data; none set is ready, with the page's own content drawn. A
// refresh never blanks data already on screen: it keeps ready, and a refresh that failed is
// ready with a `PageNote`. `refused` is a gate that never retries itself, `failed` is a read that
// came to nothing (never an empty list), `empty` only a read that succeeded with nothing.
message PageState {
  oneof state {
    Loading loading = 1;
    Failure failed = 2;
    Denied refused = 3;
    EmptyState empty = 4;
  }
  // One sentence over the data when the read was short or unchecked. Only ever with ready.
  optional PageNote note = 5;
}

// THE NOTE OVER DATA: one finished sentence and at most one action. A partial read says what
// was shown (and may offer Retry); an unchecked one says what could not be checked and has no
// action.
message PageNote {
  enum Kind {
    // Never sent: a note whose kind is unset is not drawn.
    KIND_UNSPECIFIED = 0;
    // What is shown is some of it: a refresh that failed, or a follow that read part.
    KIND_PARTIAL = 1;
    // Something beside the data was not checked (what the phone says).
    KIND_NOT_CHECKED = 2;
  }
  Kind kind = 1;
  string sentence = 2;
  // "Try again", or empty when nothing can be done here.
  string action_label = 3;
}

// ---------------------------------------------------------------------------
// The kit's reads page: "What <app> may read" (owner, 2026-11-19)
// ---------------------------------------------------------------------------

// ONE APP'S "WHAT <APP> MAY READ" (`<app>.reads`), drawn once by each shell from
// `ViewState.reads`: what the app reads and what it writes, as finished words. Notes, Docs, Money and
// People open it from their More sheet, as Calendar, Reminders and Health do.
message ReadsView {
  // The app this page belongs to, so the page wears its colour.
  string app_id = 1;
  // "What Notes may read".
  string title = 2;
  // The app the page was opened from, which the back control names.
  string back_label = 3;
  repeated ReadsFact facts = 4;
}

message ReadsFact {
  // "Reads", "Writes".
  string label = 1;
  string detail = 2;
}
