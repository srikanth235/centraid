// THE VIEW VOCABULARY EVERY APP'S SCREENS SHARE (#1135): the three states of a
// read, the empty state, the status line, the confirm, the autosave line. Rust
// finishes every sentence in these; SwiftUI and Compose draw them.
//
// A LEAF FILE (it imports only `route.proto`), so an app's own `<app>_screens.proto`
// and `screens.proto` can both import it without a cycle.

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/route.proto";

// THE READ LAW: a failed read is not an empty list. A view has three states —
// loading, a `Failure`, data — and never two.
message Failure {
  // A finished sentence for the member.
  string sentence = 1;
  // Something the member can do about it; empty when nothing.
  string remedy = 2;
}

// The loading state. A message rather than a bare `bool`, so the oneof can hold
// it as a present value and a decode of an unset oneof stays distinguishable
// from "loading" — the same reason `centraid.core.v1.NullValue` is a message.
message Loading {
  // True on the FIRST load of this screen, false on a refresh over rows the
  // screen is already showing. A spinner over an empty frame and a spinner over
  // last night's rows are different screens.
  bool first_load = 1;
}

// THE VAULT WOULD NOT LET THIS APP READ — a state, not an error (law 1's
// fourth shape where a screen has one). Finished strings; `receipt` names what
// was asked and refused, so a member can find the grant.
message Denied {
  string title = 1;
  string body = 2;
  string receipt = 3;
}

// A list with nothing in it, said once: one sentence and at most one action
// (product-intuition/references/design-behaviour.md § Wording). `action_label` empty means no action; the action
// itself is the screen's own event.
message EmptyState {
  string headline = 1;
  string body = 2;
  string action_label = 3;
  // `offers_example`, which put "See an example" under an app's day-one
  // empty state, retired with the preview (R-ONBOARD-12).
  reserved 4;
  reserved "offers_example";
  // WHERE THE PHONE ALREADY HOLDS THIS APP'S DATA, on an app's day-one empty
  // state only. A shell that can read that source draws its import as the
  // empty state's action in place of `action_label` — asked here, at the point
  // of use, never as an up-front permission wall — and a shell that cannot
  // draws `action_label` as before. The app's own add stays in its header.
  ImportSource import_source = 5;
  // The catalogue glyph on the card's wash. Empty means the app's own glyph
  // (day one); a trash's empty state says "Trash", so Locker's empty trash does
  // not wear a lock.
  string icon_key = 6;
}

// A SOURCE ON THE PHONE ITSELF that an app's day-one empty state can import
// from in one tap. The
// OS asks its own permission when the member taps it, never before.
enum ImportSource {
  IMPORT_SOURCE_UNSPECIFIED = 0;
  // The phone's contacts, into People: a person per contact, with its phone
  // numbers, email addresses and birthday.
  IMPORT_SOURCE_CONTACTS = 1;
  // The phone's calendars the member writes to, into Agenda: each event from
  // a week back to two months on, timed or all-day, free or busy as the
  // calendar holds it. Subscribed and birthday calendars are not read.
  IMPORT_SOURCE_CALENDAR = 2;
  // The phone's open reminders, into Tasks: a task per reminder, with its due
  // day and notes. iOS has a system source; Android has none, so its shell
  // draws the app's own action.
  IMPORT_SOURCE_REMINDERS = 3;
}

// THE ONE ASK A SEARCH OFFERS (#1135), finished by `SearchLaw` so every app reads
// it the same way: `label` is the row's words ("Ask about “x”"), `question` is
// what the chat is sent ("Find x"), and `scope` is the chat scope to open it in,
// the id of the app the member searched from (`agenda`, `notes`, ...), or EMPTY
// for Home's, which asks the assistant across every app.
message SearchAsk {
  string label = 1;
  string question = 2;
  string scope = 3;
  // The page a tap opens: `chat.ask`, the assistant asking `question` in `scope`. A
  // shell pushes it; it builds no route of its own.
  Route route = 4;
}

// A CONTAINER AS A SEARCH RESULT (#1097, R-1097-19..21): one notebook, album,
// project or Docs folder, finished in Rust so Home's search and the owning
// apps' own searches draw the same row and open it by the same push.
message SearchContainer {
  // The index's entity kind (`notebook`, `album`, `project`, `folder`) and the
  // row's own id.
  string entity = 1;
  string id = 2;
  // The app it opens in: `notes`, `photos`, `agenda`, `docs`.
  string app_id = 3;
  // What it IS, in a word: "Notebook", "Album", "Project", "Group", "Folder".
  string kind_label = 4;
  string title = 5;
  // The kit's glyph for that kind (`Book`, `Image`, `List`, `Users`, `Folder`).
  string icon_key = 6;
  // "Notebook, Cabin".
  string accessibility_label = 7;
  // WHERE A TAP GOES: the page that opens this container, as the route the
  // shell pushes.
  Route route = 8;
}

// AN EDITOR THAT SAVES AS THE MEMBER WRITES (#1015 D3: close = done).
//
// `edit_seq` counts edits; `saved_seq` is the last edit the vault committed;
// `saving_seq` is the edit in flight. Unsaved words exist exactly when
// `edit_seq > saved_seq`, and a change arriving from the vault while they do
// sets `remote_changed` instead of replacing them. There is no vault-side
// revision check: the last save on this phone wins.
message Autosave {
  Phase phase = 1;
  uint64 edit_seq = 2;
  uint64 saved_seq = 3;
  string base_revision_id = 4;
  optional Failure failure = 5;
  bool remote_changed = 6;
  // 7 was `saving_seq`: nothing read it (#1152).
  reserved 7;
  reserved "saving_seq";
  // 8 was `invoke_key`: nothing read it (#1152).
  reserved 8;
  reserved "invoke_key";
  // THE STATUS LINE'S WORDS (#1047): "Saved", "Edited", "Saving…", the
  // refusal's own sentence or "Not saved", "Changed on another device" — set
  // by the kit's law with every phase, so no shell spells them. Empty before
  // the law has written a phase.
  string label = 9;
  // THE SAVE WAS REFUSED, set by the kit's law with every phase and `label`:
  // the line inks `net` and an editor stops concealing on it. A shell reads
  // this, never `phase`.
  bool refused = 10;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_CLEAN = 1;
    PHASE_DIRTY = 2;
    PHASE_SAVING = 3;
    PHASE_SAVED = 4;
    PHASE_REFUSED = 5;
    // Kept for the stale-base compare a later slice adds; nothing reaches it.
    PHASE_CONFLICT = 6;
  }
}

// A decision the member confirms. Full sentences, because only a destructive
// confirm earns them (product-intuition/references/design-behaviour.md § Controls); `destructive` draws the outlined `net` action.
message Confirm {
  string title = 1;
  string body = 2;
  string confirm_label = 3;
  bool destructive = 4;
}

// A row's status as a finished label and a tone. `seam` is "not yet", `net`
// is owe/leaves (product-intuition/references/design-behaviour.md § Colour).
// `accent` is the app's own colour for a state that is the app's good news
// ("New" on an import row, "Paid" on a bill): a wash of the app accent with the
// accent's text.
message StatusChip {
  string label = 1;
  Tone tone = 2;

  enum Tone {
    TONE_UNSPECIFIED = 0;
    TONE_NEUTRAL = 1;
    TONE_SEAM = 2;
    TONE_NET = 3;
    TONE_WARNING = 4;
    TONE_ACCENT = 5;
  }
}

// The simple list row: search hits, notebooks, projects, settings-like rows.
// A row whose fields carry meaning (`AgendaEventRow`) stays the
// app's own and maps onto the same native primitive in the view.
message ListRow {
  string id = 1;
  string title = 2;
  string meta = 3;
  string trailing = 4;
  // In draw order; a row draws every one (People's "Overdue" and "Birthday ·
  // in 3 days" side by side). Empty draws none.
  repeated StatusChip chips = 5;
  string hue_key = 6;
  string accessibility_label = 7;
  bool dimmed = 8;
  bool pending = 9;
  // How `trailing` is inked: NEUTRAL is ink, NET is owe/leaves (product-intuition/references/design-behaviour.md § Colour).
  // UNSPECIFIED is ink too, so a row with a plain count sets nothing.
  StatusChip.Tone trailing_tone = 10;
}

// THE ONE FILTER AND SORT MENU (product-intuition/references/design-behaviour.md § App roots): the header's filter
// button opens this, in every app that filters or sorts, in place of the chip
// row that stood under the header. Rust makes the whole menu: every section,
// option, count and checkmark, the words, and whether anything is narrowing the
// list now. The shell draws it with its platform's menu (SwiftUI `Menu`,
// Material 3 `DropdownMenu`) and sends the pick back as `FilterMenuPicked`, or
// `FilterMenuCleared` for the clear row; it keeps no state of its own.
message FilterMenu {
  repeated MenuSection sections = 1;
  // A filter is narrowing the list now: the button is drawn lit (the selected
  // ground, never an accent) and the menu opens with `clear_label` on top. A
  // sort is not a filter, so a changed order never sets this.
  bool filtering = 2;
  // "Clear filters": drawn first while `filtering`, and only then.
  string clear_label = 3;
  // What a screen reader says for the button: "Filter and sort", and what is on.
  string spoken = 4;
}

// A titled group of options. `key` is the section's id in the selectors
// (`<app>-filter-<key>-<option>`) and in `FilterMenuPicked`.
message MenuSection {
  string key = 1;
  string title = 2;
  Kind kind = 3;
  repeated MenuOption options = 4;
  // Drawn as a menu of its own, labelled `title` with `summary` beside it and
  // a chevron, that the member opens from the menu (two levels deep, never
  // more); otherwise the options stand in the menu under `title` as a header.
  bool nested = 5;
  // The nested menu's current value in a word ("Any type", "PDF"). Unused by a
  // section that is not nested.
  string summary = 6;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Exactly one option is selected; a pick moves the check.
    KIND_SINGLE = 1;
    // Any number are selected; a pick toggles the option and the menu stays open.
    KIND_MULTI = 2;
  }
}

message MenuOption {
  string key = 1;
  string label = 2;
  // How many rows the option holds, drawn beside the label; 0 draws none.
  uint32 count = 3;
  bool selected = 4;
}

// A pick: the section's `key` and the option's `key`, as Rust made them.
message FilterMenuPicked {
  string section_key = 1;
  string option_key = 2;
}

// The menu's "Clear filters" row.
message FilterMenuCleared {}

// A TITLE'S SECOND LINE in the header, under the app's name: the scope the page
// is in ("Work" for a notebook, "March 2026" for Money's month). `clearable`
// draws a close key after the words that sends the app's own clear event; a
// tap on the words themselves is the app's own event too (Money opens its
// month sheet), and an app with none draws them as plain text.
message HeaderSubtitle {
  string label = 1;
  // What a screen reader says for the words ("Notebook Work").
  string spoken = 2;
  bool clearable = 3;
  // What a screen reader says for the close key ("Show every note").
  string clear_spoken = 4;
  // The words open something (Money's month sheet).
  bool tappable = 5;
}

// THE ONE STATUS LINE (product-intuition/references/design-behaviour.md § Status line). One clause, at most one verb.
// A screen carries it where it says what a write did — "Task done" with
// Undo — and `action_label` empty is a line with no verb. What the verb does
// is the screen's own event (`StatusActed`).
message StatusLine {
  string sentence = 1;
  // "Undo", or empty.
  string action_label = 2;
  // The vault refused a write: the sentence is the core's.
  bool refused = 3;
}

// ---------------------------------------------------------------------------
// The kit's trash screen (`<app>.trash`, arm 900 of Route/ScreenEvent/ViewState)
// ---------------------------------------------------------------------------

// One trashed row, finished: `meta` is "Deleted Wed 11 March" (and the app's
// "Erased ..." clause where it states one). The verbs are the app's own words;
// `purge_label` is empty where the app has no destroy path.
message TrashRow {
  string id = 1;
  string title = 2;
  string meta = 3;
  string icon_key = 4;
  string restore_label = 5;
  string purge_label = 6;
}

message TrashData {
  repeated TrashRow rows = 1;
  EmptyState empty = 2;
  // "Empty trash"; empty when the app cannot empty its trash, or has nothing in it.
  string empty_label = 3;
  // The scope line under the title ("Trash · 3"); empty when there is nothing in it.
  string count_label = 4;
}

// THE TRANSFER SCREEN (#1173): bring something in from a file, or write something out to one,
// in the app's own words. Rust decides every line; the shell draws the rows and the buttons and
// sends back the key of whichever was tapped. `<app>.import` reads a file or folder, shows what
// it holds as rows, and waits for the member's tap on the primary action; `<app>.export` lists
// what can go out as tappable rows.
message TransferView {
  string app_id = 1;
  // "Import notes", and the back control's words.
  string title = 2;
  string back_label = 3;
  // What is happening, in a line ("Ready to import", "Imported 12 notes").
  string headline = 4;
  // One sentence of what the page does.
  string lede = 5;
  // What the file holds (label and count), or what can be exported (tappable).
  repeated TransferRow rows = 6;
  repeated TransferAction actions = 7;
  // A read or a write is under way: the rows and buttons are drawn but do nothing.
  bool busy = 8;
  StatusLine status = 9;
}

message TransferRow {
  string key = 1;
  string label = 2;
  // A count or a short fact; empty for a tappable scope row.
  string value = 3;
  bool tappable = 4;
  string icon_key = 5;
  string accessibility_label = 6;
}

message TransferAction {
  string key = 1;
  string label = 2;
  // The one filled button of the page.
  bool primary = 3;
  bool enabled = 4;
}

// A tap on an action or a row: its key.
message TransferEvent {
  string key = 1;
}

// What a trash screen shows. The screen name (`<app>.trash`) says which app.
message TrashView {
  string app_id = 1;
  // "Trash", and the back control's words: the app the trash belongs to
  // ("Agenda"), because the page was pushed from it.
  string title = 2;
  string back_label = 3;
  oneof content {
    Loading loading = 4;
    Failure failure = 5;
    Denied denied = 6;
    TrashData data = 7;
  }
  // The confirm on screen: a purge of one row, or the emptying of the shelf.
  optional Confirm confirm = 8;
  // A refusal's sentence, over the list; the list stays.
  StatusLine status = 9;
  // 10 was `purge_window_days`: nothing read it (#1152).
  reserved 10;
  reserved "purge_window_days";
}

message TrashEvent {
  oneof kind {
    // The failure's "Try again".
    Refreshed refreshed = 1;
    // Restore asks nothing: it undoes.
    RestoreTapped restore = 2;
    // Destroying asks first (`Confirm`), in full sentences.
    PurgeTapped purge = 3;
    EmptyTapped empty = 4;
    Confirmed confirmed = 5;
    Dismissed dismissed = 6;
  }

  message Refreshed {}

  message RestoreTapped {
    string id = 1;
  }

  message PurgeTapped {
    string id = 1;
  }

  message EmptyTapped {}

  message Confirmed {}

  message Dismissed {}
}

// LINKS, SET BY HAND (#1173, O3): a transaction is With someone, a document is About someone, a
// photograph shows someone, a Locker item is linked to an account, a place or a person. Rust makes
// every word and row; the shell draws a section of rows and one picker sheet, the same in all four.
//
// One linked thing, or one thing the picker offers.
message LinkRow {
  // A person's party id, an account's or a place's.
  string id = 1;
  string title = 2;
  // A small label over the title where a section mixes kinds ("Account", "Place", "Person"), and
  // "You" on the owner. Empty draws nothing.
  string meta = 3;
  // Opens the thing: a person's page. Absent for what no page opens.
  optional Route route = 4;
  // "Remove Priya": the remove key's spoken name. Empty draws no key.
  string remove_label = 5;
  // On a picker row: the thing is linked now, so a tap takes the link off.
  bool selected = 6;
}

// A way to add a link: the label of the row, and the kind of thing it picks.
message LinkAdd {
  // `person`, `account` or `place`.
  string key = 1;
  // "Add person".
  string label = 2;
}

// A titled section of links.
message LinkSection {
  string title = 1;
  repeated LinkRow rows = 2;
  repeated LinkAdd adds = 3;
  // What the section says with no row ("No one"); empty draws nothing.
  string empty = 5;
  reserved 4;
  reserved "offer";
}

// THE PICKER SHEET: search by name, tap a row to link it, tap a linked one to unlink it.
message LinkPicker {
  bool open = 1;
  string title = 2;
  // What the member has typed.
  string query = 3;
  string placeholder = 4;
  repeated LinkRow candidates = 5;
  // What the list says when nothing matches or nothing exists.
  string empty = 6;
  bool loaded = 7;
}

message LinkEvent {
  oneof kind {
    // A `LinkAdd.key`: opens the picker for that kind.
    AddTapped add = 1;
    // A `LinkRow.id` from the section's remove key.
    RemoveTapped remove = 2;
    // A `LinkRow.id` from the picker.
    Picked pick = 3;
    QueryChanged query = 4;
    PickerClosed closed = 5;
  }

  message AddTapped {
    string key = 1;
  }

  message RemoveTapped {
    string id = 1;
  }

  message Picked {
    string id = 1;
  }

  message QueryChanged {
    string text = 1;
  }

  message PickerClosed {}
}
