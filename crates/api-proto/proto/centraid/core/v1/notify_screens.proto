// NOTIFICATIONS (#1173, Agenda wave 1c): task reminders and event alerts, one
// pipeline. Rust decides WHICH notifications the phone should hold, WHEN each
// fires and WHAT each says (`crates/screens/src/agenda/notify`); a shell only
// makes the operating system hold exactly that set and reports back what the
// member tapped. Arms: Effect 120, EffectResult 120, ShellFact 8.
//
// THE SET IS DECLARATIVE. `ScheduleNotifications.all` is everything the app
// wants pending, not a change to apply: a shell diffs it against what it put in
// the OS (iOS `getPendingNotificationRequests`, Android its own record of the
// alarms it set), removes pending ones not in the set, removes DELIVERED ones
// only when they are in neither `all` nor `live_ids` in legacy mode. With
// retain_delivered, only explicit cancel_delivered_ids remove delivered cards. It adds or replaces what
// is in `all`. Sent again whenever the set changes: an edit,
// a completion, a delete, a vault switch (the new vault's set, or none), the
// locale or the zone.

syntax = "proto3";

package centraid.core.v1;

// What a notification's button (or a tap on the notification itself) asks for.
// A shell uses the number as the OS action's identifier and sends it back
// unchanged in `NotificationAnswered`; it never decides what a verb does.
enum NotificationVerb {
  NOTIFICATION_VERB_UNSPECIFIED = 0;
  // The notification itself was tapped: open what it is about.
  NOTIFICATION_VERB_OPEN = 1;
  // Mark the task as done.
  NOTIFICATION_VERB_DONE = 2;
  // Remind again in an hour.
  NOTIFICATION_VERB_SNOOZE_HOUR = 3;
  // Move the task to tomorrow.
  NOTIFICATION_VERB_TOMORROW = 4;
  // Reverse the action a receipt names.
  NOTIFICATION_VERB_UNDO = 5;
}

// One button, worded in the device's locale.
message NotificationAction {
  NotificationVerb verb = 1;
  string label = 2;
}

// A set of buttons a notification can carry (iOS `UNNotificationCategory`,
// Android the actions added to each notification). The same few categories
// are sent every time, so a shell registers them as they are.
message NotificationCategory {
  string category_id = 1;
  repeated NotificationAction actions = 2;
}

// One notification the phone should hold.
message PendingNotification {
  // Stable for as long as the notification means the same thing (the same
  // item, the same moment): a shell replaces by it. Opaque; sent back as is.
  string notification_id = 1;
  // When it fires: the wall clock and the zone it is read in (iOS builds its
  // calendar trigger from these; Android recomputes from them after a reboot),
  // and the instant they name (Android's alarm, and the test for "already
  // past").
  string fire_local = 2;
  string zone = 3;
  int64 fire_at_ms = 4;
  string title = 5;
  string body = 6;
  // `NotificationCategory.category_id`; empty is no buttons.
  string category_id = 7;
  // Notifications of one thread are grouped (iOS `threadIdentifier`, Android
  // the group key).
  string thread_id = 8;
  // Deliver now rather than at `fire_at_ms`: a receipt for a button just
  // pressed, which carries Undo.
  bool immediate = 9;
  // WHICH CHANNEL (#1188, NB2). Empty is the reminders-and-events channel; "backup" is the
  // backup warnings' own, so switching one off does not silence the other. Android only.
  string channel_id = 10;
  // Opaque raw alert configuration digest; display locale/zone and unrelated edits do not change it.
  string source_fingerprint = 11;
}

// Effect 120: make the operating system hold exactly `all`.
message ScheduleNotifications {
  // Soonest first, and bounded by construction (Rust sends at most the next 48
  // inside ninety days; iOS keeps at most 64 pending).
  repeated PendingNotification all = 1;
  repeated NotificationCategory categories = 2;
  // PERMISSION IS ASKED ONLY WHEN IT IS FIRST NEEDED: true when `all` holds a
  // notification that would fire. A shell whose permission was never asked
  // asks then, and never otherwise. Refused is a quiet state: nothing is
  // scheduled and nothing is said.
  bool ask_permission = 3;
  // The Android channel's name, as the member sees it in system settings.
  string channel_name = 4;
  // PENDING AND DELIVERED ARE SEPARATE (#1188, A2). `all` is what should be
  // pending. `live_ids` are the ids of reminders that have already fired and are
  // still wanted, so TIME PASSING NEVER REMOVES A DELIVERED NOTIFICATION; ONLY
  // RESOLVING THE ITEM DOES (a task done, moved or deleted; an event cancelled,
  // moved, deleted or over). A shell removes a delivered notification only when
  // its id is in neither `all` nor `live_ids`. A shell that predates the field
  // sees it empty and keeps the old rule.
  repeated string live_ids = 5;
  // The backup channel's name, as the member sees it in system settings (Android).
  string backup_channel_name = 6;
  // Exact OS presses whose handling is terminal, including their press_id. Durable receipt
  // writes/Undo cleanup must be acknowledged before inclusion; a refresh is never an ACK.
  repeated NotificationAnswered completed_answers = 7;
  // Actual delivered cards are kept unless explicitly cancelled. False retains the legacy
  // all/live_ids rule and clears the departed vault during a known vault switch.
  bool retain_delivered = 8;
  repeated string cancel_delivered_ids = 9;
}

// Actual delivered OS inventory, not the desired future set.
message DeliveredNotification {
  string notification_id = 1;
  string source_fingerprint = 2;
}

// What the OS said about notifications.
enum NotificationPermission {
  NOTIFICATION_PERMISSION_UNSPECIFIED = 0;
  // Never asked, and not asked now (`ask_permission` was false).
  NOTIFICATION_PERMISSION_NOT_ASKED = 1;
  NOTIFICATION_PERMISSION_GRANTED = 2;
  NOTIFICATION_PERMISSION_DENIED = 3;
}

// A button under an alert line that says "in Settings" (#1188, NA1): the shell sends this when it
// is pressed. The same message is the event of a reminder's page and of an event's editor.
message AlertSettingsPressed {}

// Open this app's notification page in the phone's Settings (Android: the app's notification
// settings, where the channels are; iOS: the app's page). Answered with `EffectDone`.
message OpenNotificationSettings {}

// EffectResult 120: the answer to `ScheduleNotifications`.
message NotificationsScheduled {
  NotificationPermission permission = 1;
  // How many the OS holds pending for the app now.
  uint32 held = 2;
  // WHAT THE PHONE WILL DO WITH WHAT IS HELD (#1188, NA1). Android only; iOS
  // leaves both false. `exact_denied`: the app may not set exact alarms, so an
  // alert can arrive minutes late. `channel_off`: the member switched the
  // channel the alerts post to off in system settings; `channel_shown` is its
  // name as the system shows it, for the sentence that says so.
  bool exact_denied = 3;
  bool channel_off = 4;
  string channel_shown = 5;
  // The same for the backup channel.
  bool backup_channel_off = 6;
  string backup_channel_shown = 7;
  repeated DeliveredNotification delivered = 8;
}

// ShellFact 8: the member pressed a button on a notification, or tapped it.
// A shell sends it as the OS hands it over, even when the app was launched for
// it; Rust decides what it does.
message NotificationAnswered {
  string notification_id = 1;
  NotificationVerb verb = 2;
  // DURABLE PRESSES (#1188, A6). The shell writes a press to a small outbox
  // before it dismisses the banner and gives it a unique id; it sends the same
  // press again, with the same id, at the next start if it never learned the
  // core applied it. The core runs a press under a key made from this id, so a
  // press that is sent twice is applied once. Empty (a shell that predates the
  // field) is a press with nothing to deduplicate by.
  string press_id = 3;
}
