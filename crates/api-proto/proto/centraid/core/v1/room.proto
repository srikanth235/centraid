}

message RoomFieldGroup {
  string selector_id = 1;
  repeated RoomField fields = 2;
  string remove_selector_id = 3;
}

message RoomRepeat {
  string selector_id = 1;
  string label = 2;
  repeated RoomFieldGroup rows = 3;
  RoomAction add = 4;
}

enum RoomAutosavePhase {
  ROOM_AUTOSAVE_PHASE_UNSPECIFIED = 0;
  ROOM_AUTOSAVE_PHASE_CLEAN = 1;
  ROOM_AUTOSAVE_PHASE_DIRTY = 2;
  ROOM_AUTOSAVE_PHASE_SAVING = 3;
  ROOM_AUTOSAVE_PHASE_SAVED = 4;
  ROOM_AUTOSAVE_PHASE_REFUSED = 5;
  ROOM_AUTOSAVE_PHASE_CONFLICT = 6;
}

message RoomAutosave {
  RoomAutosavePhase phase = 1;
  string label = 2;
  bool refused = 3;
  string reload_label = 4;
  string reload_selector_id = 5;
}

message RoomExplicitSave {
  string save_label = 1;
  string save_selector_id = 2;
  string cancel_label = 3;
  string cancel_selector_id = 4;
  bool save_enabled = 5;
  bool dirty = 6;
  bool drafted = 7;
}

message RoomForm {
  repeated RoomField fields = 1;
  repeated RoomRepeat repeats = 2;
  oneof save {
    RoomAutosave autosave = 3;
    RoomExplicitSave explicit = 4;
