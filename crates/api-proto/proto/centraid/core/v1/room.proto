enum RoomConfirmClass {
  ROOM_CONFIRM_CLASS_UNSPECIFIED = 0;
  ROOM_CONFIRM_CLASS_OUTLINED = 1;
  ROOM_CONFIRM_CLASS_OWNER = 2;
