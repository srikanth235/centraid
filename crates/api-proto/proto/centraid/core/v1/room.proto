message RoomMoment {
  RoomMomentKind kind = 1;
  string value = 2;
  string zone = 3;
  string display = 4;
  bool clearable = 5;
}

message RoomToggle {
  bool on = 1;
}

message RoomItemPick {
  string display = 1;
  string noun = 2;
  string clear_selector_id = 3;
}

message RoomFilePick {
  string display = 1;
  string clear_selector_id = 2;
}

message RoomSecret {
  bool masked = 1;
  string value = 2;
  string reveal_selector_id = 3;
}

message RoomField {
  string selector_id = 1;
  string label = 2;
  string hint = 3;
  string error = 4;
  bool required = 5;
  bool focused = 6;
  oneof input {
    RoomText text = 10;
    RoomMoney money = 11;
    RoomMoment moment = 12;
    RoomChoice choice = 13;
    RoomToggle toggle = 14;
    RoomItemPick item = 15;
    RoomFilePick file = 16;
    RoomSecret secret = 17;
