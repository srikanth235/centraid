// The native wire of the app plane: rooms, blocks, four canvas slots, and the events back.
// The meaning of every field is in `.claude/skills/change/app-plane.md`; this file states shape only.
// Every interactive element carries a `selector_id`: the address an event names and a test taps.
// A message states what a thing means, never how it looks.

syntax = "proto3";

package centraid.core.v1;

enum RoomKind {
  ROOM_KIND_UNSPECIFIED = 0;
  ROOM_KIND_HOME = 1;
  ROOM_KIND_APP_PLACE = 2;
  ROOM_KIND_PUSHED_PAGE = 3;
  ROOM_KIND_EDITOR = 4;
  ROOM_KIND_SHEET = 5;
  ROOM_KIND_SYSTEM_PLACE = 6;
  ROOM_KIND_STAGE = 7;
}

enum RoomTone {
  ROOM_TONE_UNSPECIFIED = 0;
  ROOM_TONE_NEUTRAL = 1;
  ROOM_TONE_SEAM = 2;
  ROOM_TONE_NET = 3;
  ROOM_TONE_WARNING = 4;
  ROOM_TONE_ACCENT = 5;
}

message Room {
  RoomKind kind = 1;
  string key = 2;
  RoomHeader header = 3;
  RoomBand band = 4;
  oneof state {
    RoomLoading loading = 5;
    RoomReady ready = 6;
    RoomFailed failed = 7;
  }
  RoomStatusLine status_line = 8;
  RoomSearch search = 9;
  RoomSelection selection = 10;
  RoomPlace restore = 11;
  bool secure = 12;
}

message RoomLoading {}

message RoomFailed {
  string sentence = 1;
  string retry_label = 2;
  string retry_selector_id = 3;
}

message RoomReady {
  repeated RoomBlock blocks = 1;
}

message RoomHeader {
  string title = 1;
  string subtitle = 2;
  string subtitle_clear_selector_id = 3;
  RoomBack back = 4;
  repeated RoomKey keys = 5;
  RoomFilterMenu filter = 6;
}

message RoomBack {
  string label = 1;
  string selector_id = 2;
}

enum RoomKeyRole {
  ROOM_KEY_ROLE_UNSPECIFIED = 0;
  ROOM_KEY_ROLE_ADD = 1;
  ROOM_KEY_ROLE_TOOL = 2;
  ROOM_KEY_ROLE_MENU = 3;
  ROOM_KEY_ROLE_VERB = 4;
}

message RoomKey {
  string selector_id = 1;
  RoomKeyRole role = 2;
  string icon = 3;
  string label = 4;
  bool enabled = 5;
  RoomMenu menu = 6;
}

message RoomBand {
  repeated RoomTab tabs = 1;
  string home_selector_id = 2;
  string search_selector_id = 3;
  RoomMenu more = 4;
  string more_selector_id = 5;
  bool more_selected = 6;
}

message RoomTab {
  string selector_id = 1;
  string label = 2;
  string icon = 3;
  bool selected = 4;
}

message RoomStatusLine {
  string sentence = 1;
  string action_label = 2;
  string action_selector_id = 3;
  bool refused = 4;
}

message RoomSearch {
  bool open = 1;
  string selector_id = 2;
  string term = 3;
  string placeholder = 4;
  string corrected = 5;
  string close_selector_id = 6;
  repeated RoomRow containers = 7;
  RoomRow ask = 8;
}

message RoomSelection {
  bool on = 1;
  string label = 2;
  uint32 count = 3;
  string select_all_selector_id = 4;
  string done_selector_id = 5;
  repeated RoomMenuItem actions = 6;
}

message RoomPlace {
  string anchor_selector_id = 1;
  uint32 anchor_fraction_milli = 2;
  string search_term = 3;
  repeated string filter_selector_ids = 4;
  string lens = 5;
}

message RoomBlock {
  oneof kind {
    RoomHero hero = 1;
    RoomSection section = 2;
    RoomRow row = 3;
    RoomFacts facts = 4;
    RoomForm form = 5;
    RoomChoice choice = 6;
    RoomFigure figure = 7;
    RoomProse prose = 8;
    RoomMedia media = 9;
    RoomProgress progress = 10;
    RoomEmpty empty = 11;
    RoomWall wall = 12;
    RoomTiles tiles = 13;
    RoomGlance glance = 14;
    RoomTrash trash = 15;
    RoomConfirm confirm = 16;
    RoomMenu menu = 17;
    RoomAttachments attachments = 20;
    RoomLinked linked = 21;
    RoomMentionedIn mentioned_in = 22;
    RoomSays says = 23;
    RoomEarlierVersions earlier_versions = 24;
    RoomOrigin origin = 25;
    RoomCalendarGrid calendar_grid = 40;
    RoomPhotoGrid photo_grid = 41;
    RoomNoteEditor note_editor = 42;
    RoomChart chart = 43;
  }
}

message RoomAction {
  string selector_id = 1;
  string label = 2;
  string icon = 3;
  bool enabled = 4;
  bool destructive = 5;
}

message RoomChip {
  string label = 1;
  RoomTone tone = 2;
  string remove_selector_id = 3;
}

message RoomMenu {
  string selector_id = 1;
  repeated RoomMenuSection sections = 2;
}

message RoomMenuSection {
  string heading = 1;
  repeated RoomMenuItem items = 2;
}

message RoomMenuItem {
  string selector_id = 1;
  string label = 2;
  string secondary = 3;
  string icon = 4;
  bool destructive = 5;
  bool checked = 6;
  bool enabled = 7;
  repeated RoomMenuItem submenu = 8;
}

message RoomFilterMenu {
  RoomMenu menu = 1;
  bool filtering = 2;
  string clear_selector_id = 3;
}

message RoomGlyph {
  string icon = 1;
  string hue_key = 2;
}

message RoomThumb {
  string ref = 1;
  string alt = 2;
  string hue_key = 3;
}

enum RoomCheckState {
  ROOM_CHECK_STATE_UNSPECIFIED = 0;
  ROOM_CHECK_STATE_OFF = 1;
  ROOM_CHECK_STATE_ON = 2;
  ROOM_CHECK_STATE_MIXED = 3;
  ROOM_CHECK_STATE_PARTIAL = 4;
}

message RoomCheck {
  string selector_id = 1;
  RoomCheckState state = 2;
}

message RoomMark {
  oneof kind {
    RoomGlyph glyph = 1;
    RoomThumb thumb = 2;
    RoomCheck check = 3;
  }
}

message RoomSwipe {
  string selector_id = 1;
  string label = 2;
}

message RoomRow {
  string selector_id = 1;
  string title = 2;
  string meta = 3;
  string trailing = 4;
  RoomTone trailing_tone = 5;
  repeated RoomChip chips = 6;
  RoomMark mark = 7;
  string a11y_label = 8;
  bool dimmed = 9;
  bool pending = 10;
  bool selected = 11;
  RoomMenu menu = 12;
  RoomSwipe swipe = 13;
}

message RoomSection {
  string selector_id = 1;
  string heading = 2;
  string count_label = 3;
  RoomAction trailing = 4;
  repeated RoomBlock blocks = 5;
  string next_page_selector_id = 6;
}

message RoomHero {
  string title = 1;
  string noun = 2;
  RoomMark mark = 3;
  repeated string lines = 4;
  repeated RoomChip chips = 5;
  RoomAction primary = 6;
  RoomMenu menu = 7;
}

enum RoomFactKind {
  ROOM_FACT_KIND_UNSPECIFIED = 0;
  ROOM_FACT_KIND_TEXT = 1;
  ROOM_FACT_KIND_DATE = 2;
  ROOM_FACT_KIND_MONEY = 3;
  ROOM_FACT_KIND_LINK = 4;
  ROOM_FACT_KIND_PHONE = 5;
  ROOM_FACT_KIND_EMAIL = 6;
  ROOM_FACT_KIND_ADDRESS = 7;
  ROOM_FACT_KIND_SECRET = 8;
}

message RoomFact {
  string label = 1;
  string value = 2;
  RoomFactKind kind = 3;
  string open_selector_id = 4;
  string copy_selector_id = 5;
  bool sealed = 6;
  string reveal_selector_id = 7;
}

message RoomFacts {
  repeated RoomFact facts = 1;
}

message RoomOption {
  string id = 1;
  string label = 2;
  bool selected = 3;
}

enum RoomChoiceStyle {
  ROOM_CHOICE_STYLE_UNSPECIFIED = 0;
  ROOM_CHOICE_STYLE_SEGMENTED = 1;
