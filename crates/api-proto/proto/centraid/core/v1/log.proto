// The replica log on the wire (#1020, D-1020-C4; the tail is #1025 S2,
// D-1025-S7-40).
//
// ## ONE LOG PER VAULT, AND A SEAT NEVER SUBSCRIBES TO A TABLE
//
// There is exactly one log per vault. Every table's changes are ROWS IN IT,
// named by `LogRow.table`; there is no per-table stream, no filter on the
// request and no subscription vocabulary anywhere on this wire. A seat holds a
// COPY of the vault, not a view of some of it, so a request that could ask for
// less would be a request that could produce a copy which is silently not one.
//
// A seat becomes current by exactly one mechanism: connect, ask for the log
// from its durable cursor with `LogRequest.tail` set, and stay on that stream
// as long as the OS allows. Polling and foreground timers are deleted
// concepts — "up to date" means current within one round trip whenever this
// device is connected.
//
// The wire is deliberately not the storage shape: `epoch` is carried ONCE per
// page, not per row, and the flags that are false are simply not set.

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/row.proto";
import "centraid/core/v1/value.proto";

// What a log row did.
enum LogOp {
  LOG_OP_UNSPECIFIED = 0;
  LOG_OP_INSERT = 1;
  LOG_OP_UPDATE = 2;
  LOG_OP_DELETE = 3;
  // A schema statement. Never deferrable, whatever the commit says.
  LOG_OP_DDL = 4;
}

// One row of the log.
message LogRow {
  // `replica_log.seq` — the SEAT CURSOR's unit. Not `commit_seq`; census seam 5
  // names comparing the two "the R6 mistake in miniature — 432 against 2".
  uint64 seq = 1;
  // The transaction `seq` belongs to. An intent outcome names THIS number, and
  // an overlay clears against it.
  uint64 commit_seq = 2;
  // Compatibility. A mismatch is a re-bootstrap.
  uint32 schema_epoch = 3;
  // Additive progress INSIDE one schema epoch. Conflating it with
  // `schema_epoch` makes every additive column a full re-bootstrap.
  uint32 ddl_version = 4;
  string table = 5;
  LogOp op = 6;
  RecordKey pk = 7;
  // The row image. Absent for a private/local table's key-only row and for a
  // row whose op carries no image.
  optional RowImage row = 8;
  // The delta prior image, for `LOG_OP_UPDATE` only. ABSENT means "no prior is
  // known"; PRESENT AND EMPTY means "the statement touched only the key".
  // `optional` is what keeps those two apart on the wire.
  optional PriorDelta prior = 9;
  // The change was a side effect of another statement (SQLite's session
  // `indirect` flag).
  bool indirect = 10;
  // The commit was over the defer threshold. The flag is a property of the
  // COMMIT and rides on every row of it, never on the page.
  bool deferred = 11;
  string producer = 12;
  // RFC 3339, as v0 stores it.
  string committed_at = 13;
}

// One page of the log.
message LogPage {
  // Which vault answered. Absence does not brick a compatible pair with an
  // older gateway that says nothing; here an empty string is that same "this
  // door did not say".
  string vault_id = 1;
  string epoch = 2;
  uint32 schema_epoch = 3;
  uint32 ddl_version = 4;
  // The retention floor. A cursor below it is told to re-bootstrap, never
  // served short.
  uint64 floor = 5;
  uint64 watermark = 6;
  // The cursor to send next: the last SERVED seq when `has_more`, else the
  // watermark.
  uint64 next = 7;
  bool has_more = 8;
  // Whole commits only — a page never ends mid-commit, and the tail of the last
  // row's commit is appended whatever the limit said (`log.ts:817-833`).
  repeated LogRow rows = 9;
}

// A cursor a seat sends. The wire form is two fields rather than the string
// `<epoch>:<seq>`, so colons in the epoch need no escaping rule.
message LogCursor {
  string epoch = 1;
  uint64 seq = 2;
}

// Why a seat must throw its file away and start from a snapshot. The verdict
// vocabulary is closed and ten values wide; anything unrecognised normalises
// to `REBOOTSTRAP_REASON_UNSPECIFIED`.
enum RebootstrapReason {
  REBOOTSTRAP_REASON_UNSPECIFIED = 0;
  REBOOTSTRAP_REASON_EPOCH_MISMATCH = 1;
  REBOOTSTRAP_REASON_RETENTION = 2;
  REBOOTSTRAP_REASON_CURSOR_AHEAD = 3;
  REBOOTSTRAP_REASON_INITIAL = 4;
  REBOOTSTRAP_REASON_EPOCH_CHANGED = 5;
  REBOOTSTRAP_REASON_SNAPSHOT_RETENTION = 6;
  REBOOTSTRAP_REASON_SHAPE_CHANGED = 7;
  REBOOTSTRAP_REASON_CHECKPOINT_INCOMPATIBLE = 8;
  REBOOTSTRAP_REASON_DEVICE_ACCESS_CHANGED = 9;
  REBOOTSTRAP_REASON_INVALID_CURSOR = 10;
}

// The answer to a cursor the gateway cannot serve from.
message RebootstrapRequired {
  RebootstrapReason reason = 1;
  string epoch = 2;
  uint64 floor = 3;
  uint64 watermark = 4;
  uint32 schema_epoch = 5;
  // THE BLOB TO TAKE, NAMED IN THE ANSWER THAT ASKS FOR IT (#1025 S7, item 5).
  //
  // The same three values `PairOk` carries, and for the same reason: these two
  // messages are the only two occasions on which a device is told to take a
  // copy, so a separate `snapshot_head` request could only ever be a second
  // round trip for an answer this one already had.
  string snapshot_hash = 6;
  uint64 snapshot_seq = 7;
  uint64 snapshot_bytes = 8;
}

// Ask for a page of the log.
message LogRequest {
  // Where the seat is. Absent means "from the floor".
  optional LogCursor since = 1;
  // Rows per page. Required and validated > 0 by the reader.
  uint32 limit = 2;
  // STAY OPEN (#1025 S2, D-1025-S7-40).
  //
  // A gateway answering a tail serves the catch-up pages from `since` exactly
  // as it does without this flag — following `has_more` — and then KEEPS THE
  // STREAM OPEN, writing a further `LogPage` every time this vault's watermark
  // moves past what it last sent. One page per COMMIT BATCH and never one per
  // row: a batch of four hundred rows is one wake and one page.
  //
  // `RebootstrapRequired` ends the stream exactly as it ends a one-shot
  // request. There are no other new messages, and none are needed: a tail is
  // the same answer, more than once.
  //
  // A seat may hold at most ONE tail per vault. A second tail from the same
  // device replaces the first, because the second is what that device believes
  // and a gateway writing pages into a stream nobody reads is a task held by a
  // phone that has moved on.
  bool tail = 3;
}
