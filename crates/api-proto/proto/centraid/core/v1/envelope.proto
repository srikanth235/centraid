// The request/response envelope (#1020, D-1020-C2).
//
// Every stream carries length-prefixed `Envelope`s: `u32BE(len) ‖ bytes`, with
// `len <= MAX_FRAME_BYTES` (262144) and bodies chunked at 64 KiB. The framing
// itself lives in `crates/protocol`, which knows nothing about iroh.
//
// **Request ids are per connection, monotonic, and never reused.** That is what
// makes `Cancel{request_id}` unambiguous: an id that has been answered is an id
// nothing will refer to again, so a late `Cancel` is a no-op rather than a
// cancellation of somebody else's work.
//
// **One envelope, not one stream per request.** v0 opened a bi-stream per
// tunnelled request; multiplexing over one stream is what lets a change event
// arrive while a paged read is in flight without a second QUIC stream per
// subscription.

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/app_query.proto";
import "centraid/core/v1/action.proto";
import "centraid/core/v1/assist.proto";
import "centraid/core/v1/change.proto";
import "centraid/core/v1/content.proto";
import "centraid/core/v1/error.proto";
import "centraid/core/v1/handshake.proto";
import "centraid/core/v1/notify_screens.proto";
import "centraid/core/v1/originals.proto";
import "centraid/core/v1/phone.proto";
import "centraid/core/v1/query.proto";
import "centraid/core/v1/room.proto";
import "centraid/core/v1/screens.proto";
import "centraid/core/v1/vault.proto";

message Envelope {
  // Zero is reserved for the handshake, which is not a request: `Hello` is
  // exchanged before any id has been minted. Every other body carries a
  // non-zero id.
  uint64 request_id = 1;
  oneof body {
    Request request = 2;
    Response response = 3;
    Event event = 4;
    Cancel cancel = 5;
    Error error = 6;
  }
}

message Request {
  // SEVEN VERBS LEFT WITH THE SEAT (#1029 §1, §6), and NO NUMBER IS REUSED —
  // a field number that comes back meaning something else is how an old build
  // reads a new message as a shape it recognises:
  //   2  `log`            — a page of `replica_log` for a seat's cursor
  //   3  `snapshot_head`  — already deleted in #1025 S7
  //   4  `intent`         — a write queued for a gateway to run
  //   7  `pair`           — redeeming a pairing ticket
  //   8  `devices_list`   — the seats this vault has enrolled
  //   9  `devices_revoke` — un-enrolling one
  //   12 `blob`           — handing the stream over to iroh-blobs
  //
  // AND ONE MORE, RETIRED BY ITS REPLACEMENT (#1029 W15):
  //   10 `backup_now`     — answered `NotYetAvailable` for the whole of its
  //                         life. `drain` (15) is the door it stood in for,
  //                         and it is a different message with a deadline and
  //                         an acked txid, so the number does not come back.
  //
  // AND THE RAW COMMAND, RETIRED BY THE ONE WRITE (#1135):
  //   5  `command`        — a registered command by name, with a principal
  //                         the core never read. Every screen writes through
  //                         `act` (36), which names an app's action and is
  //                         answered once per key; a raw name over the ABI
  //                         was a second write door beside it.
  reserved 5, 10;
  reserved "command";
  oneof kind {
    Hello hello = 1;
    PageRequest page = 6;
    ContentUrlRequest content_urls = 11;
    // A SHELL STREAMS BYTES IN AND THE CORE NAMES THEM (#1025 S4). See
    // `content.proto`'s `StageRequest`.
    StageRequest stage = 13;
    // MAKE THIS FILE A VAULT (#1029 W5, hand-off 1). The door `Core::open` with
    // `create` left missing: the migrations were laid and nothing over this ABI
    // could write the `vault` row. See `vault.proto`.
    FoundRequest found = 14;
    // THE PHONE'S TWO FLOWS, AND THE TWO SCREENS BESIDE THEM (#1029 W15). See
    // `phone.proto` for why none of the four is a registered command.
    DrainRequest drain = 15;
    PairRequest pair_phone = 16;
    RestoreRequest restore = 17;
    BackupStatusRequest backup_status = 18;
    // THE ORIGINALS ON THIS PHONE, AND THE ALBUMS WHOSE ORIGINALS STAY (#1029,
    // the photos port). See `originals.proto`, including why it carries no
    // release verb.
    OriginalsRequest originals = 19;
    // AN APP'S OWN QUERY, RUN IN THE CORE (#1046). See `app_query.proto` for
    // why a query that joins and expands cannot be a page read a shell writes.
    AppQueryRequest app_query = 20;
    // THE 24 WORDS (#1047 E1): minted, judged and turned into a seed in Rust,
    // with no vault. See `phone.proto`.
    PhraseRequest phrase = 22;
    // THE BACKUP PLANE'S DOORS BESIDE THE PASS (#1080). `drain` (15) stays
    // the pass; these are what a pass cannot do by itself. `handoff` and
    // `settle` are the two halves of an upload the operating system runs while
    // the app is suspended, `reconcile` squares the device's ledger with what a
    // gateway holds, `pins` gives a shell the certificates its own TLS pins,
    // `fetch_original` brings one original back by its content hash,
    // `forget_destination` drops a paired gateway, and `releasable` and
    // `released` are the two halves of freeing space: which originals a
    // gateway holds so the library's copy may go, and which the member
    // deleted. See `phone.proto`.
    // DEPRECATED (#1209): `handoff`, `settle` and `reconcile` belong to the plane before
    // the bundle. A core answers them with an empty answer and does nothing; the OS bundle
    // files come back with `drain` (`DrainResponse.os_bundles`).
    HandoffRequest handoff = 23;
    SettleRequest settle = 24;
    FetchOriginalRequest fetch_original = 25;
    PinsRequest pins = 26;
    ReconcileRequest reconcile = 27;
    ForgetDestinationRequest forget_destination = 28;
    ReleasableRequest releasable = 29;
    ReleasedRequest released = 30;
    // THE ON-DEVICE CHAT: a session, a question, and the model's file. Reads
    // only; nothing a turn does is written. See `assist.proto`.
    AssistRequest assist = 31;
    // A PAIRED GATEWAY FOUND AGAIN AT NEW ADDRESSES (#1080, Q-1080-D3): the
    // shell's foreground browse hands the core candidates, and the core keeps
    // those that answer as the pinned gateway. See `phone.proto`.
    RefreshDestinationRequest refresh_destination = 33;
    // WHICH ASSET A LIBRARY ITEM WAS BACKED UP AS (#1127, A20): how an edit made
    // in place finds the photograph it is an edit of. See `phone.proto`.
    LibraryAssetsRequest library_assets = 34;
    // THE ONE READ AND THE ONE WRITE (#1135). See `action.proto`.
    LoadRequest load = 35;
    ActRequest act = 36;
    // Screen events and navigation (#1135, lane C2): `screens.proto`.
    ScreenRequest screen = 37;
    // CHECK MY BACKUP (#1188, B6): open each backup in a spare copy. See `phone.proto`.
    CheckBackupRequest check_backup = 45;
    // THE GATEWAY TOKENS THE SHELL KEEPS (#1191, E12), handed to the core at
    // open and kept in its memory only. See `phone.proto`.
    GatewayTokensRequest gateway_tokens = 46;
    // UNDO THE DELETES A GATEWAY HOLDS (#1191, E6). See `phone.proto`.
    UndoHeldRequest undo_held = 47;
    // WHOLE-VAULT EXPORT: resumable because each library original is supplied
    // by the shell between core-owned ZIP writes. See `phone.proto`.
    VaultExportRequest vault_export = 48;
    // WHICH GATEWAYS HOLD ONE ORIGINAL WHOLE (#1209, R4): the delete warning's read.
    HeldWholeRequest held_whole = 49;
    // THE APP PLANE (`room.proto`, `notify_screens.proto`): a room by key and a room's events;
    // the notification service's launch, presses and permission.
    RoomRequest room = 50;
    NotifyRequest notify = 51;
  }
}

message Response {
  // 4 `log`, 5 `rebootstrap_required`, 6 `snapshot_head`, 7 `outcome`,
  // 10 `pair` and 11 `devices_list` were the answers to the requests above,
  // and 8 `command` was the raw command's outcome (#1135): `act` (36) answers
  // every write. The numbers are retired, not reused.
  reserved 8;
  reserved "command";
  oneof kind {
    Hello hello = 1;
    UpgradeRequired upgrade_required = 2;
    Unsupported unsupported = 3;
    Page page = 9;
    ContentUrls content_urls = 12;
    StageResponse stage = 13;
    FoundResponse found = 14;
    // The four answers to `phone.proto`'s four requests, at the same numbers
    // as their requests so a reader of one file can read the other.
    DrainResponse drain = 15;
    PairResponse pair_phone = 16;
    RestoreResponse restore = 17;
    BackupStatusResponse backup_status = 18;
    OriginalsResponse originals = 19;
    AppQueryResponse app_query = 20;
    PhraseResponse phrase = 22;
    // The answers to the backup plane's doors (#1080), at their requests'
    // numbers like the phone's four.
    HandoffResponse handoff = 23;
    SettleResponse settle = 24;
    FetchOriginalResponse fetch_original = 25;
    PinsResponse pins = 26;
    ReconcileResponse reconcile = 27;
    ForgetDestinationResponse forget_destination = 28;
    ReleasableResponse releasable = 29;
    ReleasedResponse released = 30;
    AssistResponse assist = 31;
    RefreshDestinationResponse refresh_destination = 33;
    LibraryAssetsResponse library_assets = 34;
    LoadResponse load = 35;
    ActResponse act = 36;
    ScreenResponse screen = 38;
    CheckBackupResponse check_backup = 45;
    GatewayTokensResponse gateway_tokens = 46;
    UndoHeldResponse undo_held = 47;
    VaultExportResponse vault_export = 48;
    HeldWholeResponse held_whole = 49;
    RoomResponse room = 50;
    NotifyResponse notify = 51;
  }
}

message Event {
  oneof kind {
    ChangeEvent change = 1;
    HealthEvent health = 2;
    ConnectivityEvent connectivity = 3;
    // A running chat turn: its activity, cards, sentence and outcome.
    AssistEvent assist = 4;
    // A screen's new view state, pushed by Rust (a table changed, a timer
    // fired): `screens.proto`.
    ScreenUpdate screen = 5;
    // The screen runtime's own timer marker. The core handles it inside
    // `next_event` and never hands it to a shell.
    ScreenWake wake = 6;
    // A screen's off-thread job finished. Handled by the core inside
    // `next_event`, like `wake`; a shell never sees it.
    ScreenJobDone job_done = 7;
    // A room Rust shows on its own (a commit reached its reads, a timer fired): `room.proto`.
    RoomShown room = 8;
    // The notification set the phone should hold, whole, each time it changes: `notify_screens.proto`.
    ScheduleNotifications notify = 9;
  }
}

// Cancel an IN-FLIGHT UNBOUNDED operation. Bounded reads are never cancellable
// and are bounded instead (#1020 Execution model) — a `Cancel` naming a bounded
// read is answered by the read finishing.
message Cancel {}
