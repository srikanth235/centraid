// MONEY'S SCREENS (#1135): the view states and events of the nine screens in
// `crates/screens/src/money`. Every sentence and every amount in them is
// finished text made in Rust (`kit::money` is the one formatter); a shell draws
// them and writes no copy, no sign and no currency of its own.
//
// A row that opens a page carries the `Route` to push, so a shell never names a
// screen. Arms in `Route.args`, `ScreenEvent.kind` and `ViewState.kind` are in
// Money's range, 500-599: home 500, transaction 501, target 502, search 503,
// recurring 504, accounts 505, categories 506, rules 507, import 508.

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/kit_screens.proto";
import "centraid/core/v1/route.proto";

// ---------------------------------------------------------------------------
// The vocabulary the nine screens share
// ---------------------------------------------------------------------------

// A page's chrome: its title, the back control's words and the retry label.
message MoneyPageChrome {
  string title = 1;
  // The page it was pushed from, by its title: the back control says it.
  string back_label = 2;
  string retry = 3;
}

// One choice in a sheet: a month, an account, a category, a kind.
message MoneyChoice {
  string key = 1;
  string label = 2;
  bool selected = 3;
  // A note beside the label ("Groceries" under a group's name); empty for none.
  string detail = 4;
  // The category's colour in the one list palette (`blue`, `petrol` ...); empty
  // for a choice that is not a category, and for "No category".
  string color_key = 5;
}

// A label beside a finished amount: Planned, Left, In, Out, Net.
message MoneyFigure {
  string label = 1;
  // `$1,234.56`, `-$42.50`: the sign, the currency and the digits are made by
  // `kit::money` and nowhere else.
  string amount = 2;
  // NET is money out or over plan; NEUTRAL is ink; SEAM is "not counted".
  StatusChip.Tone tone = 3;
  // Money in: drawn in the state green, wherever the tone is neutral.
  bool positive = 4;
}

message MoneyFact {
  string label = 1;
  string detail = 2;
  // The `MoneyAction.key` that changes this fact (the transaction's Category
  // and Name); empty for a fact nothing changes.
  string action = 3;
  // SEAM or NET when the fact is owed attention; UNSPECIFIED for every other.
  StatusChip.Tone tone = 4;
}

// One transaction as a list draws it.
message MoneyRow {
  string txn_id = 1;
  // The member's name for it, else the bank's words.
  string title = 2;
  string meta = 3;
  // Finished, signed: negative is money out.
  string amount = 4;
  // NET for money out, NEUTRAL for money in, SEAM for a transfer or a void.
  StatusChip.Tone amount_tone = 5;
  // Empty for none; "No category" is a chip, not this.
  string category_label = 6;
  repeated StatusChip chips = 7;
  string accessibility_label = 8;
  // A void or a transfer is struck through or greyed.
  bool dimmed = 9;
  // Where a tap goes: the transaction's page.
  Route route = 10;
  // The category's colour in the list palette; empty with no category.
  string color_key = 11;
  // The first letter of the title, for the tile.
  string initial = 12;
  // `Swap` for a transfer, empty for every other row: the tile's glyph.
  string tile_icon = 13;
  // Money in: the amount is drawn green.
  bool positive = 14;
}

message MoneyDaySection {
  // `YYYY-MM-DD`.
  string day = 1;
  // "Today", "Yesterday", "Mon 12 October".
  string heading = 2;
  repeated MoneyRow rows = 3;
  // What the day came to, finished and signed: "-₹2,450", "+₹1,41,401"; one per
  // currency, joined by " · ". Empty when no row of the day counts, and until
  // the page that completes the day is read.
  string total = 4;
  // The day came to money in.
  bool total_positive = 5;
}

message MoneyAction {
  string key = 1;
  string label = 2;
  string icon_key = 3;
  bool enabled = 4;
  bool destructive = 5;
}

// ---------------------------------------------------------------------------
// money.home: Activity (home) · Spending · Cash flow, and More as a sheet
// ---------------------------------------------------------------------------

message MoneyHomeState {
  Destination destination = 2;
  oneof content {
    Loading loading = 3;
    Failure failure = 4;
    Denied denied = 5;
    MoneyHomeData data = 6;
  }
  Sheet sheet = 7;
  // Four tabs in order; empty while denied.
  repeated MoneyBandTab band = 8;
  MoneyHomeChrome chrome = 9;
  // `YYYY-MM`; the month in view.
  string month = 10;
  // 11 was `account_id` and 12 was `category_filter`: nothing read them (#1152);
  // the filters are `filter_menu`'s checks.
  reserved 11, 12;
  reserved "account_id", "category_filter";
  // 14 was `chips`, the chip row under the search bar: the account and the
  // category are `filter_menu` in the header and the month is `subtitle`.
  reserved 14;
  reserved "chips";
  // THE HEADER'S FILTER BUTTON (R-CHROME-3): Account and Category as nested
  // sections, no sort. Activity only; unset elsewhere and while denied.
  optional FilterMenu filter_menu = 15;
  // THE MONTH IN VIEW, under the app's name: a tap opens the month sheet
  // (`MonthTapped`), the one way to change month. Activity and Spending; unset
  // on Cash flow, which reads twelve months at once.
  optional HeaderSubtitle subtitle = 16;

  enum Destination {
    DESTINATION_UNSPECIFIED = 0;
    DESTINATION_SPENDING = 1;
    DESTINATION_ACTIVITY = 2;
    DESTINATION_CASHFLOW = 3;
  }

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_MORE = 2;
    SHEET_MONTH = 3;
    // 4 and 5 were the account and category sheets: they are the filter menu's.
    reserved 4, 5;
    reserved "SHEET_ACCOUNT", "SHEET_CATEGORY";
  }
}

message MoneyBandTab {
  // `spending`, `activity`, `cashflow`, `more` - what `BandPicked` sends.
  string key = 1;
  string label = 2;
  string icon_key = 3;
  bool current = 4;
}

message MoneyMoreRow {
  string label = 1;
  string meta = 2;
  string icon_key = 3;
  // The page the row opens.
  Route route = 4;
}

message MoneyHomeChrome {
  string title = 1;
  // The header's one trailing action, the Plus glyph's spoken words.
  string add_label = 2;
  string retry = 3;
  string more_title = 4;
  repeated MoneyMoreRow more_rows = 5;
  // The search bar under the title. It never opens in place: a tap pushes
  // `search_route`.
  string search_placeholder = 6;
  // 7 and 8 were the month stepper's labels: the month under the title, which
  // opens the month sheet, is the one way to change month.
  reserved 7, 8;
  reserved "previous_month_label", "next_month_label";
  string month_sheet_title = 9;
  // 10 and 11 were the account and category sheets' titles: the filter menu's
  // section titles are its own.
  reserved 10, 11;
  reserved "account_sheet_title", "category_sheet_title";
  string close_label = 12;
  // Where the Plus and the day-one action go, and where the search bar goes.
  Route import_route = 13;
  Route search_route = 14;
}

message MoneyHomeData {
  // `YYYY-MM-DD` in the device's zone, the core's.
  string today = 1;
  // "October 2026".
  string month_label = 2;
  // 3 and 4 were the month stepper's: the subtitle replaced it.
  reserved 3, 4;
  reserved "can_step_next", "shows_month";
  MoneySpendingData spending = 5;
  MoneyActivityData activity = 6;
  MoneyCashflowData cashflow = 7;
  // The month sheet's choices: this month and the eleven before it.
  repeated MoneyChoice month_options = 8;
}

message MoneySpendingData {
  // Day one: no account or no transaction yet. One sentence and Import.
  optional EmptyState empty = 1;
  // One per currency, in the core's order.
  repeated MoneyHero heroes = 2;
  // "17 days left".
  string days_left_label = 3;
  repeated MoneyInOutNet in_out_net = 4;
  repeated MoneyCategoryTable tables = 5;
  // "3 rows need a category", "3 transfers are not counted". Sentences.
  repeated string notes = 6;
  repeated MoneyFact definitions = 7;
  // A row to the recurring charges.
  string recurring_label = 8;
  string recurring_meta = 9;
  Route recurring_route = 10;
  string window_note = 11;
  // The month by week or by day, one chart per currency.
  repeated MoneyBars bars = 12;
}

// THE SPENDING CHART: stacked bars, one per week (or day) of the month, each cut
// by category; the three biggest categories of the month wear their own colour
// and the rest share the neutral one.
message MoneyBars {
  string currency = 1;
  // The currency code when more than one currency is drawn; empty otherwise.
  string heading = 2;
  // Week, Day: one is selected (`BarsModePicked` sends its key).
  repeated MoneyChoice modes = 3;
  repeated MoneyBar bars = 4;
  // Where the plan's pace falls on the bars' scale, basis points of the chart's
  // height; 0 with no plan. `pace_label` names the line.
  uint32 pace_bp = 5;
  string pace_label = 6;
  // The selected bar in words: "15-21 Oct · ₹21,040 · Eating out was the biggest share".
  string caption = 7;
}

message MoneyBar {
  // "1-7", "8-14"; in day mode a tick on every seventh day and empty between.
  string label = 1;
  // Height as basis points of the chart's height (the tallest bar or the pace,
  // whichever is higher, is full): drawing, not a figure.
  uint32 height_bp = 2;
  // Bottom to top.
  repeated MoneyBarSegment segments = 3;
  // Nothing is dated here yet (after today): outlined, not drawn as zero.
  bool upcoming = 4;
  bool selected = 5;
  string accessibility_label = 6;
}

message MoneyBarSegment {
  // A list palette key; `graphite` for the categories that share the rest.
  string color_key = 1;
  // Basis points of the bar's own height.
  uint32 share_bp = 2;
}

// One line under the chart that is not one category: "4 more categories" and
// "No category".
message MoneyRestLine {
  string label = 1;
  string amount = 2;
  string accessibility_label = 3;
  // The list palette key of its dot; empty draws the dashed outline.
  string color_key = 4;
  // The category filter a tap applies in Activity (`uncategorised`); empty for a row that opens
  // the rest of the list instead.
  string key = 5;
}

message MoneyHero {
  // Spent so far this month, finished.
  string spent = 1;
  string spent_label = 2;
  // Planned, Left, Refunds.
  repeated MoneyFigure figures = 3;
  bool has_bar = 4;
  // Basis points of the plan spent, clamped to 10000 for the bar; the tick is
  // how far through the month today falls.
  uint32 fill_bp = 5;
  uint32 tick_bp = 6;
  bool over = 7;
  string accessibility_label = 8;
}

message MoneyInOutNet {
  // In, Out, Net in one currency.
  repeated MoneyFigure figures = 1;
}

message MoneyCategoryTable {
  // The currency code when more than one currency is drawn; empty otherwise.
  string heading = 1;
  string currency = 2;
  repeated MoneyCategoryLine rows = 3;
  // The column heads.
  // 4 to 6 were the column heads (Planned, Spent, Left): a line is a bar and a sentence now.
  reserved 4, 5, 6;
  reserved "planned_label", "spent_label", "left_label";
  // What the categories past the first three come to, until tapped open.
  optional MoneyRestLine more = 7;
  // Rows with no category this month; a tap lists them in Activity.
  optional MoneyRestLine uncategorised = 8;
}

message MoneyCategoryLine {
  string label = 1;
  bool has_plan = 2;
  // 3 and 5 were `planned` and `left`: the caption says them.
  reserved 3, 5;
  reserved "planned", "left";
  string spent = 4;
  bool over = 6;
  string accessibility_label = 7;
  // The target page for this category and month.
  Route route = 8;
  // The category's colour in the list palette.
  string color_key = 9;
  // Spent over planned, basis points, clamped to 10000; 0 with no plan.
  uint32 progress_bp = 10;
  // "of ₹22,500 · ₹4,300 left", "₹2,850 over the ₹12,000 plan", "No plan".
  string caption = 11;
}

message MoneyActivityData {
  // 1 and 2 were the account and category sheets' choices: they are the filter
  // menu's sections.
  reserved 1, 2;
  reserved "account_options", "category_options";
  // "Needs a category · 3" and what it comes to, per currency.
  string needs_label = 3;
  // 4 was `needs_category`, the banner's amounts per currency: `needs_title` says them.
  reserved 4;
  reserved "needs_category";
  repeated MoneyDaySection sections = 5;
  // "Showing 50"; empty when every row is drawn.
  string window = 6;
  bool more = 7;
  optional EmptyState empty = 8;
  // The category filter that lists the rows `needs_label` counts; empty while
  // there are none. A tap on the Needs row sends it as `category_picked`.
  string needs_key = 9;
  // THE MONTH'S OVERVIEW CARD (the same figures Spending opens with): spent and
  // what is left of the plan, then in, out and net. One per currency.
  repeated MoneyHero heroes = 10;
  repeated MoneyInOutNet in_out_net = 11;
  string days_left_label = 12;
  // THE REVIEW BANNER: "Need a category · ₹4,310", the count in its badge, and
  // the word on its button. `needs_label` is what it says aloud.
  string needs_title = 13;
  string needs_count = 14;
  string review_label = 15;
}

message MoneyCashflowData {
  optional EmptyState empty = 1;
  repeated MoneyCashflowSeries series = 2;
  repeated MoneyFact definitions = 3;
  string window_note = 4;
}

message MoneyCashflowSeries {
  string currency = 1;
  // The currency code when more than one currency is drawn.
  string heading = 2;
  repeated MoneyCashflowMonth months = 3;
  // The legend and the month rows' figure labels.
  string in_label = 4;
  string out_label = 5;
  string partial_label = 6;
  string net_label = 7;
}

message MoneyCashflowMonth {
  string month = 1;
  // "Oct".
  string label = 2;
  string incoming = 3;
  string outgoing = 4;
  string net = 5;
  StatusChip.Tone net_tone = 6;
  // The bars: this month's side as basis points of the series' largest side.
  uint32 in_bp = 7;
  uint32 out_bp = 8;
  // 9 was `rate_label`: nothing read it (#1152).
  reserved 9;
  reserved "rate_label";
  // The month is not over: outlined, never compared as if whole.
  bool partial = 10;
  string accessibility_label = 11;
  // `rate_label` and, while the month is not over, its note: one meta line.
  string meta = 12;
}

message MoneyHomeEvent {
  oneof kind {
    // The failure state's retry, and pull to refresh: read again.
    Refreshed refreshed = 30;
    BandPicked band = 3;
    MonthPicked month_picked = 5;
    CategoryPicked category_picked = 8;
    SheetClosed sheet_closed = 9;
    ShowMore show_more = 10;
    // A More row was tapped: the sheet closes behind the page it opens.
    MoreOpened more_opened = 16;
    // The subtitle's month was tapped: opens the month sheet.
    MonthTapped month_tapped = 31;
    // The Spending chart's Week / Day switch.
    BarsModePicked bars_mode_picked = 34;
    // A bar of the chart was tapped (its index in the series).
    BarPicked bar_picked = 35;
    // "N more categories" was tapped: every category is listed.
    CategoriesExpanded categories_expanded = 36;
    // ---- The header's filter menu ----
    FilterMenuPicked filter_menu_picked = 32;
    FilterMenuCleared filter_menu_cleared = 33;
  }
  // 6 was `chip` (a chip's tap: the month's is `month_tapped`, the account's and
  // the category's are `filter_menu_picked`) and 7 was `account_picked`.
  reserved 6, 7;
  reserved "chip", "account_picked";
  // 4 was `month_stepped`: the month changes through the month sheet only.
  reserved 4;
  reserved "month_stepped";

  message BandPicked {
    string key = 1;
  }

  message MonthPicked {
    string month = 1;
  }

  message MonthTapped {}

  // `week` or `day`.
  message BarsModePicked {
    string key = 1;
  }

  message BarPicked {
    uint32 index = 1;
  }

  message CategoriesExpanded {}

  // The Needs row: `uncategorised`, the filter that lists its rows. The menu's
  // picks are `FilterMenuPicked`.
  message CategoryPicked {
    string key = 1;
  }

  message SheetClosed {}

  message ShowMore {}

  message MoreOpened {}

  message Refreshed {}
}

// ---------------------------------------------------------------------------
// money.transaction
// ---------------------------------------------------------------------------

message MoneyTransactionState {
  string txn_id = 2;
  oneof content {
    Loading loading = 3;
    Failure failure = 4;
    Denied denied = 5;
    MoneyTransactionData data = 6;
    // The line is in the trash (#1185): the page stays open on this so the status line (Move to
    // trash, with Undo) shows over it.
    EmptyState gone = 14;
  }
  // 8 was `confirm`, the confirm over Void: a transaction goes to the trash and asks nothing (#1185).
  reserved 8;
  reserved "confirm";
  Sheet sheet = 9;
  // THE "WITH" PICKER (#1173): who the line was with, picked by name. Open while the sheet is up.
  LinkPicker with_picker = 13;
  // The name being typed in the name sheet.
  string name_draft = 10;
  MoneyPageChrome chrome = 11;
  // What the last act did: "Category saved", or the core's refusal.
  optional StatusLine status = 12;

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_CATEGORY = 2;
    SHEET_NAME = 3;
  }
}

message MoneyTransactionData {
  // The member's name for it, else the bank's words.
  string title = 1;
  // Finished, signed.
  string amount = 2;
  StatusChip.Tone amount_tone = 3;
  // "Money out" / "Money in".
  string direction_label = 4;
  // Account, Posted, Bank wrote, Category, Name, Imported, Memo.
  repeated MoneyFact facts = 5;
  repeated StatusChip chips = 6;
  optional MoneyOffer transfer_offer = 7;
  optional MoneyOffer rule_offer = 8;
  // The person the payee is, PROPOSED ("With Priya?"): written only when the member confirms
  // (#1173). Its `key` is `with`.
  optional MoneyOffer with_offer = 20;
  // "Seen 6 times", "Repeats every month".
  repeated string notes = 9;
  repeated MoneyAction actions = 10;
  // The category sheet's choices; group names in `detail`.
  repeated MoneyChoice category_options = 11;
  string category_sheet_title = 12;
  string name_sheet_title = 13;
  string name_placeholder = 14;
  string save_label = 15;
  string clear_label = 16;
  string accessibility_label = 17;
  // 18 was `is_transfer`: nothing read it (#1152).
  reserved 18;
  reserved "is_transfer";
  // Money in: the amount is drawn green. Money out is ink.
  bool amount_positive = 19;
}

// An offer the app PROPOSES and never applies on its own.
message MoneyOffer {
  // `transfer` or `rule`.
  string key = 1;
  string title = 2;
  string body = 3;
  // The condition, in the bank's own words.
  string detail = 4;
  string accept_label = 5;
  string dismiss_label = 6;
}

message MoneyTransactionEvent {
  oneof kind {
    // The failure state's retry, and pull to refresh: read again.
    Refreshed refreshed = 30;
    ActionPicked action = 3;
    CategoryPicked category = 4;
    NameEdited name_edited = 5;
    NameSaved name_saved = 6;
    SheetClosed sheet_closed = 7;
    OfferAccepted offer_accepted = 8;
    OfferDismissed offer_dismissed = 9;
    // 10 and 11 were `confirm_accepted` and `confirm_dismissed`, the confirm over Void (#1185).
    // "Undo" on the status line after Move to trash or its Undo (#1185).
    StatusActed status_acted = 12;
    // The "With" picker's own events (#1173).
    LinkEvent with_link = 31;
  }
  reserved 10, 11;
  reserved "confirm_accepted", "confirm_dismissed";

  message StatusActed {}

  message ActionPicked {
    string key = 1;
  }

  // Empty clears the category.
  message CategoryPicked {
    string category_id = 1;
  }

  message NameEdited {
    string text = 1;
  }

  message NameSaved {}

  message SheetClosed {}

  message OfferAccepted {
    string key = 1;
  }

  message OfferDismissed {
    string key = 1;
  }

  message Refreshed {}
}

// ---------------------------------------------------------------------------
// money.target: a category's plan for one month
// ---------------------------------------------------------------------------

message MoneyTargetState {
  // `YYYY-MM`.
  string month = 2;
  string category_id = 3;
  string currency = 4;
  oneof content {
    Loading loading = 5;
    Failure failure = 6;
    Denied denied = 7;
    MoneyTargetData data = 8;
  }
  // What the member is typing, and whether unused money carries.
  string amount_text = 10;
  bool carry = 11;
  MoneyPageChrome chrome = 13;
  optional StatusLine status = 14;
  // The target was saved or removed: the shell pops.
  bool finished = 15;
}

message MoneyTargetData {
  string title = 1;
  string month_label = 2;
  string amount_label = 3;
  // "USD".
  string currency_label = 4;
  // Last six months averaged / spent / carried in: figures beside words.
  repeated MoneyFigure figures = 5;
  string use_average_label = 6;
  string carry_label = 7;
  string carry_note = 8;
  // The next month's effect, said before the member commits.
  string preview_label = 9;
  string preview = 10;
  string preview_note = 11;
  string save_label = 12;
  // Empty when no target is stored (nothing to remove).
  string remove_label = 13;
  bool can_save = 14;
  string issue = 15;
  string exponent_hint = 16;
}

message MoneyTargetEvent {
  oneof kind {
    // The failure state's retry, and pull to refresh: read again.
    Refreshed refreshed = 30;
    AmountEdited amount = 3;
    CarryToggled carry = 4;
    UseAverage use_average = 5;
    Save save = 6;
    Remove remove = 7;
  }

  message AmountEdited {
    string text = 1;
  }

  message CarryToggled {}

  message UseAverage {}

  message Save {}

  message Remove {}

  message Refreshed {}
}

// ---------------------------------------------------------------------------
// money.recurring
// ---------------------------------------------------------------------------

message MoneyRecurringState {
  oneof content {
    Loading loading = 2;
    Failure failure = 3;
    Denied denied = 4;
    MoneyRecurringData data = 5;
  }
  MoneyPageChrome chrome = 6;
}

message MoneyRecurringData {
  repeated MoneyRecurringRow rows = 1;
  optional EmptyState empty = 2;
  repeated MoneyFact definitions = 3;
  string window_note = 4;
}

message MoneyRecurringRow {
  string key = 1;
  string merchant = 2;
  // "every month · Chase Total Checking".
  string meta = 3;
  // What it costs each time, finished.
  string amount = 4;
  // "next Oct 28", "seen 6 times".
  string detail = 5;
  repeated StatusChip chips = 6;
  string accessibility_label = 7;
}

message MoneyRecurringEvent {
  oneof kind {
    Refreshed refreshed = 2;
  }

  message Refreshed {}
}

// ---------------------------------------------------------------------------
// money.search
// ---------------------------------------------------------------------------

message MoneySearchState {
  oneof content {
    Loading loading = 2;
    Failure failure = 3;
    Denied denied = 4;
    MoneySearchData data = 5;
  }
  // The resting page: no term, nothing read.
  optional EmptyState resting = 6;
  MoneyPageChrome chrome = 7;
  string placeholder = 8;
  string clear_label = 9;
  // What the member has typed.
  string term = 10;
}

message MoneySearchData {
  repeated MoneyRow rows = 1;
  // "12 matches", "50 of 212 matches"; empty with no rows.
  string count_label = 2;
  optional EmptyState empty = 3;
  // The spelling the index searched for instead, when it corrected the term.
  string corrected = 4;
  // THE ASK (the owner's ruling: Ask in every search): hands the term to the
  // assistant, scoped to Money. Offered on a match and on none.
  optional SearchAsk ask = 5;
}

message MoneySearchEvent {
  oneof kind {
    // The failure state's retry, and pull to refresh: read again.
    Refreshed refreshed = 30;
    TermChanged term = 2;
    Cleared cleared = 3;
  }

  message TermChanged {
    string term = 1;
  }

  message Cleared {}

  message Refreshed {}
}

// ---------------------------------------------------------------------------
// money.accounts
// ---------------------------------------------------------------------------

message MoneyAccountsState {
  oneof content {
    Loading loading = 2;
    Failure failure = 3;
    Denied denied = 4;
    MoneyAccountsData data = 5;
  }
  Sheet sheet = 6;
  optional MoneyAccountEditor editor = 7;
  optional Confirm confirm = 8;
  MoneyPageChrome chrome = 9;
  optional StatusLine status = 10;

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_EDITOR = 2;
  }
}

message MoneyAccountsData {
  repeated MoneyAccountSection sections = 1;
  string net_worth_label = 2;
  repeated MoneyFigure net_worth = 3;
  string net_worth_note = 4;
  optional EmptyState empty = 5;
  string add_label = 6;
  repeated MoneyFact definitions = 7;
}

message MoneyAccountSection {
  string title = 1;
  repeated MoneyAccountRow rows = 2;
}

message MoneyAccountRow {
  string account_id = 1;
  string name = 2;
  // "····1234 · Checking · USD".
  string meta = 3;
  bool has_balance = 4;
  string balance = 5;
  string balance_note = 6;
  // "Matches Oct 14 statement" / "Off from the Oct 14 statement".
  string checkpoint_line = 7;
  bool has_delta = 8;
  string delta = 9;
  StatusChip.Tone checkpoint_tone = 10;
  string accessibility_label = 11;
}

// The add / edit sheet. Every label is finished here.
message MoneyAccountEditor {
  Mode mode = 1;
  string account_id = 2;
  string name = 3;
  string kind = 4;
  string currency = 5;
  bool on_budget = 6;
  // Typed only; the bank's number is never sent back to the phone's view.
  string external_ref = 7;
  // 8 was `has_external_ref`: nothing read it (#1152).
  reserved 8;
  reserved "has_external_ref";
  bool closed = 9;
  bool can_save = 10;
  string issue = 11;
  string title = 12;
  string save_label = 13;
  string name_label = 14;
  string kind_label = 15;
  repeated MoneyChoice kind_options = 16;
  // Empty when the currency is not editable (an existing account).
  string currency_label = 17;
  string on_budget_label = 18;
  string external_ref_label = 19;
  string external_ref_note = 20;
  // Empty when adding.
  string closed_label = 21;
  string cancel_label = 22;
  string remove_number_label = 23;
  bool can_remove_number = 24;

  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_ADD = 1;
    MODE_EDIT = 2;
  }
}

