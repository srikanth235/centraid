// `<app>.import` and `<app>.export` (#1173, items 14 and 20): the kit's one transfer screen
// (Notes' Markdown, People's vCards); the screen name says which app and which way.
message TransferRoute {
  // The title of the page it was pushed from: its back control says it.
  string back_label = 1;
}

// `backup.home`: the Backup screen. No arguments.
message BackupHomeRoute {}

// `backup.check`: Check my backup (#1188, B6), pushed from Backup. No arguments.
message BackupCheckRoute {}

