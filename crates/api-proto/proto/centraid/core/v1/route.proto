// ---------------------------------------------------------------------------
// The shell (1600-1999): chat
// ---------------------------------------------------------------------------

// `chat.home`: no arguments. The Chat tab's root.
message ChatRoute {}

// `chat.thread`: a stored chat opened as a page (a search hit on a conversation). The
// header reads `title` until the thread is read.
message ChatThreadRoute {
  string thread_id = 1;
  string title = 2;
}

// `imports.camera_roll`, `imports.files`, `imports.made`: the phone imports'
// headless services, each serving one vault. The camera roll's cursor is kept per
// vault (a photograph offered to two vaults is two imports).
message ImportsRoute {
  string vault_id = 1;
}

// ---- the shell (1000-1999): Home 1000-1299 ----

// Home takes no arguments: it is the root of the `home` tab.
message HomeRoute {}

// Home's search takes no arguments.
message HomeSearchRoute {}

// Settings takes no arguments.
message SettingsRoute {}

// The Reconnect page (#1185): the phone stores a vault followed on another phone, offered one
// by one. `parent` names the page it was opened from, which its back control reads.
message ReconnectRoute {
  string parent = 1;
}

// What a tap on a search's Ask row opens: the assistant, asking `question` in
// `scope` (an app's id, or empty for every app). The chat lane registers the
// screen that takes it.
message ShellAskRoute {
  string question = 1;
  string scope = 2;
}
