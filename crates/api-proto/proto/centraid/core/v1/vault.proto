// Founding a vault, over the ABI (#1029 §1, W5 hand-off 1).
//
// THE HALF THE SHELL WAS MISSING. `Core::open` with `create` lays the
// migrations down and stops there; the two rows that make those tables a VAULT
// — `core_vault` and its owner's `core_party` — are written by
// `centraid_vault::Vault::found`, and until this file existed nothing over the
// C ABI could reach it. A phone could make a file it could never name, which is
// what `Shelf.FoundRefusal.NOT_FOUNDED` was refusing honestly.
//
// ## Why a REQUEST ARM and not a registered command
//
// Every other write the shell makes is a `Command` through
// `centraid_vault::commands::Registry`, and founding cannot be one. The
// registry's gate order (`crates/vault/src/commands/mod.rs`) begins with the
// ontology version and ends with a RECEIPT, and every step in between needs
// facts a vault that has not been founded does not have: the access plane
// evaluates a `Principal` against `core_vault.self_party_id`, and the audit
// trail's invocation row names the vault the receipt belongs to. Founding is
// the act that WRITES those. A command that had to be exempted from the gate
// order would be a second command plane wearing the first one's name.
//
// ## Founding is not idempotent and does not pretend to be
//
// A second found over a founded file would lay a second `core_vault` row beside
// the first, and `Vault::vault_id` reads `ORDER BY vault_id LIMIT 1` — so the
// file would answer a different id depending on which row sorted first. It is
// refused with `ERROR_CODE_VAULT_ALREADY_HELD`, which is that code's own
// wording ("a run against a core that is already holding someone's rows would
// lay a second vault over the first and destroy it").

syntax = "proto3";

package centraid.core.v1;

// Make this file a vault.
message FoundRequest {
  // What the member calls it. Written to `core_vault.display_name`, which is
  // THE ONE PLACE a vault's name lives — `Shelf` reads it back off the file
  // rather than keeping the string it sent, so a rename inside the vault is the
  // only rename there is.
  //
  // Empty is accepted and is a real state: a vault with no name draws "No vault
  // yet" rather than a blank, and the member names it later.
  string display_name = 1;
  // What the owner party is called. A `core_party` of kind `person`, and the
  // only party in a fresh vault.
  //
  // THERE IS NO EMAIL ADDRESS, NO PHONE NUMBER AND NO ACCOUNT HERE, and there
  // is nowhere for one to arrive. A display name is what the owner is called
  // on their own device.
  string owner_name = 2;
  // WHAT THE NEW VAULT HOLDS WHEN THE FOUND ANSWERS. Rows are written through
  // the command plane after the found's own commit, never by the found itself.
  FoundContent content = 3;
  // The device's zone once dated the starter tasks; they are undated now
  // (R-ONBOARD-5), so nothing reads it.
  reserved 4;
  reserved "tz";
}

// WHAT A FOUND FILLS THE NEW VAULT WITH.
//
// Onboarding's goal is time to the member's OWN data, so nothing a found
// writes is fake data the member has to clean up later: a member's first vault
// gets a few teaching starter rows that are ordinary rows of theirs, and no
// found writes a sample scenario.
enum FoundContent {
  // A found that names no content: it gets what founding always writes and
  // nothing else — the vault row, the owner, the relation vocabulary and the
  // default calendar. Proto3's zero, so a request that leaves `content` unset
  // lands here, and the core writes no row beyond those.
  FOUND_CONTENT_UNSPECIFIED = 0;
  // TEACHING STARTER ROWS in the member's own first vault: a few notes and
  // tasks that each teach one real gesture and are completed or deleted by
  // doing it. Ordinary member rows with no mark. Best-effort: a refused
  // starter row leaves the vault founded rather than refusing it.
  FOUND_CONTENT_STARTERS = 1;
  // `FOUND_CONTENT_SAMPLE`, the separate sample vault on the member's shelf,
  // retired with it (docs/decisions.md, "Onboarding without sample data").
  reserved 2;
  reserved "FOUND_CONTENT_SAMPLE";
  // `FOUND_CONTENT_EXAMPLE`, the Tahoe scenario founded into an ephemeral
  // example core for "See an example", retired with that preview. A core that
  // receives 3 refuses it as a content this build does not know.
  reserved 3;
  reserved "FOUND_CONTENT_EXAMPLE";
}

// The vault that now exists in this file.
message FoundResponse {
  // The vault's own id, minted inside the commit. The shell does NOT choose it:
  // a file name is not an identity (`Shelf`'s header), and an id the shell
  // supplied would be a second place it lives.
  string vault_id = 1;
  // The owner party `core_vault.self_party_id` points at.
  string owner_party_id = 2;
}
