// BACKUP (#1135, lane H2): the Backup screen, the line Home draws over it, and
// the one effect it asks of the shell. See `plumbing_screens.proto` for the arm
// ranges; this file's are 1450-1499 (route, event and view arms) and 1350-1369
// (effects and their answers).
//
// "Backed up" means a gateway acknowledged it and the phone recorded that
// (#1080): the line never says more than the ledger holds, and every sentence
// here is finished in Rust (`crates/screens/src/backup`).

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/kit_screens.proto";
import "centraid/core/v1/phone.proto";
import "centraid/core/v1/route.proto";

// THE BACKUP'S STANDING, as the shell's `backup-status` query answers it
// (`crates/core/src/shell/backup.rs`): the core's reading of its own ledger, and
// this phone's wall clock at the moment it was read. The clock is for "2
// minutes ago" only; every time inside `status` that a gateway acknowledged is
// on the GATEWAY's clock, because an acknowledgement is not something this
// phone's clock can make.
message ShellBackupStatus {
  BackupStatusResponse status = 1;
  int64 now_ms = 2;
}

// ---------------------------------------------------------------------------
// The line: Home's status and the top of the Backup screen
// ---------------------------------------------------------------------------

// One reason items wait, with how many.
message BackupWaitingRow {
  Reason reason = 1;
  uint64 count = 2;
  // "12 waiting for Wi-Fi".
  string sentence = 3;

  // The numbers are the core's `WaitReason`, so a shell reading either sees
  // one value.
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_WIFI = 1;
    REASON_CHARGER = 2;
    REASON_GATEWAY = 3;
    // iCloud-only originals, fetched only under the rule and inside a window.
    REASON_ICLOUD = 4;
    // The core is waiting for the shell to stream an item's bytes.
    REASON_BYTES = 5;
    REASON_WINDOW = 6;
    // An original the MANUAL rule holds until the member taps "Back up now"
    // (#1080 A24).
    REASON_ASK = 7;
    // The machine that answered at a gateway's address is not the gateway this
    // phone pinned.
    REASON_UNTRUSTED = 8;
    // The gateway answered and refused a write because its disk is full.
    REASON_REFUSED = 9;
    // The gateway no longer knows this phone's token: pair it again.
    REASON_PAIR_AGAIN = 10;
    // This phone has too little free space to copy its vault.
    REASON_NO_ROOM = 11;
    // The gateway refused a part as over its size limit.
    REASON_TOO_LARGE = 12;
    // The gateway refused a write for a reason that is neither full nor too large.
    REASON_REFUSED_OTHER = 13;
  }
}

message BackupLine {
  // 1 was `records_as_of_ms`: nothing read it (#1152).
  reserved 1;
  reserved "records_as_of_ms";
  // Photos, videos, documents and their derivatives a gateway acknowledged.
  uint64 confirmed = 2;
  // 3 was `total`: nothing read it (#1152).
  reserved 3;
  reserved "total";
  repeated BackupWaitingRow waiting = 4;
  // 5 was `frozen`: nothing read it (#1152).
  reserved 5;
  reserved "frozen";
  // 6 was `unpaired`: nothing read it (#1152).
  reserved 6;
  reserved "unpaired";
  // The line, finished: "Backed up 2 minutes ago." Empty draws no line.
  string sentence = 7;
  // Its second clause, or empty: "1,203 of 1,240 photos and files".
  string detail = 8;
  Tone tone = 9;
  string accessibility_label = 10;
  // THE LINE IN A FEW WORDS, for the vault lockup's second line where Home
  // draws it: "Backed up 2 minutes ago", "Not backed up". `sentence` is the
  // Backup screen's.
  string status = 11;
  // 12 was `pair_again`: nothing read it (#1152).
  reserved 12;
  reserved "pair_again";

  enum Tone {
    TONE_UNSPECIFIED = 0;
    // Backed up, or catching up on its own.
    TONE_QUIET = 1;
    // Something waits on the member: a gateway, a setting.
    TONE_ATTENTION = 2;
    // Moved to another phone, or nothing is backed up at all.
    TONE_URGENT = 3;
  }
}

// ---------------------------------------------------------------------------
// backup.home
// ---------------------------------------------------------------------------

// One gateway this vault backs up to (#1080 ruling 8: the pairing record is a
// list). A gateway id names a DESTINATION; a vault is mounted by its own id.
message BackupDestinationRow {
  string gateway_id = 1;
  string label = 2;
  // Where it was last reached and when, finished:
  // "192.168.1.20:7443 · Reached 2 minutes ago".
  string detail = 3;
  string accessibility_label = 4;
  // 5 was `pair_again`: nothing read it (#1152).
  reserved 5;
  reserved "pair_again";
  // What it holds, finished: "Holds 5.1 GB". Empty when it holds nothing
  // this phone recorded (#1144).
  string held = 6;
  // WHEN THIS GATEWAY LAST ACKNOWLEDGED A BACKUP, on its own clock, finished: "Last backup 2
  // hours ago" or "Not backed up yet". The row's `detail` says when it was reached; this says
  // what it holds (#1188).
  string backed_up = 7;
  // WHAT ELSE IS TRUE OF IT, one sentence each, drawn after `held`, `backed_up` and `detail`
  // (#1191): an old backup it cannot read, a piece found damaged and sent again, deletes this
  // phone made there that it holds for a week.
  repeated string notes = 8;
  // "Undo": set only while this phone has deletes held there that it may undo. Pressing it sends
  // `UndoHeld` for this row; the row's notes then lose the held sentence.
  string undo_label = 9;
}

// ONE APP'S PART OF THE BACKUP (#1144), finished: "In this backup" draws one
// per app, biggest first.
message BackupAppRow {
  // The catalogue's id, for the app's mark: `photos`, `notes`.
  string app_id = 1;
  // "Notes".
  string name = 2;
  // What it holds and its size: "312 notes · 38 MB", "1,203 of 1,240 photos
  // and videos · 4.0 of 4.4 GB".
  string detail = 3;
  // What was left out of it, or empty: "37 videos, 8.4 GB, left out".
  string note = 4;
  // "Backed up", "37 waiting", "3 edits waiting", "Not backed up".
  string status = 5;
  // Something of it is not backed up: `status` is drawn as a wait.
  bool waiting = 6;
  string accessibility_label = 7;
}

// One choice of the transfer rule, with the sentence a member reads.
message BackupRuleChoice {
  // The word the phone keeps: `wifi-only`, `wifi-and-cellular-photos`,
  // `manual`. Sent back on `RuleChosen`.
  string stored = 1;
  string sentence = 2;
  bool picked = 3;
}

// THE PAGE'S ONE INK BUTTON (design/behaviour.md § Controls: at most one per view), named once for
// both shells.
enum BackupInk {
  BACKUP_INK_UNSPECIFIED = 0;
  // The state draws no button worth an Ink fill.
  BACKUP_INK_NONE = 1;
  // `key_show_label`, while `key_warning` stands.
  BACKUP_INK_SHOW_KEY = 2;
  // `add_destination_label`, with nothing paired.
  BACKUP_INK_ADD_DESTINATION = 3;
  // `back_up_now_label`.
  BACKUP_INK_BACK_UP_NOW = 4;
}

message BackupHomeState {
  // 1 and 2 were `loading` and `failure`: the read is `page` (#1185).
  reserved 1, 2;
  reserved "loading", "failure";
  // Set when the page is ready.
  oneof body {
    BackupHomeData data = 3;
  }
  // THE READ: loading, failed, or ready, with a note when a re-read failed.
  PageState page = 4;
}

message BackupHomeData {
  string title = 1;
  BackupLine line = 2;
  // "Backup devices"; empty while none is paired.
  string devices_heading = 3;
  repeated BackupDestinationRow destinations = 4;
  // "Add backup device": empty on a vault that moved (it comes back by a
  // restore, which starts from the head).
  string add_destination_label = 5;
  // Where it goes: the pairing page.
  Route add_destination = 6;
  // One label for every row's forget control; empty on a vault that moved (the
  // core refuses it, because the gateway's row is where the moved mark lives).
  string forget_label = 7;
  // 8 was `rule_label`, the rule's heading: the "Back up over" row says it now (#1173).
  reserved 8;
  reserved "rule_label";
  // The rule's three choices.
  repeated BackupRuleChoice rule_choices = 9;
  bool include_videos = 10;
  string include_videos_label = 11;
  // "Back up now"; empty with nothing paired (a dead primary above "Add backup
  // device" put the one useful act second).
  string back_up_now_label = 12;
  bool back_up_now_enabled = 13;
  // 14 was `backing_up_now`: nothing read it (#1152).
  reserved 14;
  reserved "backing_up_now";
  string progress = 15;
  // Why battery saving can hold backups back, and the label of the control that
  // lets Centraid run. Empty until a backlog has stood for a day; a shell draws
  // them only where the platform says the app is held back (Android's battery
  // optimisation list).
  string battery_sentence = 16;
  string battery_label = 17;
  // What the last act did, or why it could not: one clause, never a toast.
  string notice = 18;
  // The phone will not wake Centraid in the background, and what that means.
  string background_notice = 19;

  // THE RECOVERY KEY: where it is, in one sentence, under `key_heading`. Empty
  // heading: this phone holds no key and the section is not drawn.
  string key_heading = 20;
  string key_line = 21;
  // The key is on this phone alone and the member has not said they saved a
  // copy: `key_line` is a warning, drawn as one.
  bool key_warning = 22;
  // "Show recovery key"; empty when this phone has no words to show (its key
  // came through the keychain).
  string key_show_label = 23;
  Route key_show = 24;
  // "Keep my key off iCloud Keychain" while `key_synced`, "Save my key in iCloud
  // Keychain" while not. Empty where the platform will not synchronise.
  string key_sync_label = 25;
  bool key_synced = 26;
  BackupInk ink = 27;
  // "In this backup" and one row per app (#1144); empty heading, no section.
  string apps_heading = 28;
  repeated BackupAppRow apps = 29;

  // ---- THE SETTINGS-STYLE PAGE (#1173) ----
  BackupCondition condition = 30;
  // NOT_REACHED: "Last good backup 5 days ago" and what to check, in the member's words.
  string last_good = 31;
  string reason = 32;
  // NOT_REACHED: the apps that wait, under "Not backed up yet", out of `apps`.
  string waiting_heading = 33;
  repeated BackupAppRow apps_waiting = 34;
  // "What travels when" with its first row, "Back up over", worth the picked
  // rule's short word. `rule_choices` are what that row opens.
  string travel_heading = 35;
  string over_label = 36;
  string over_value = 37;
  // "Saved elsewhere", "Saved in iCloud Keychain", "Only on this phone": the
  // recovery key row's second line, empty with no key section.
  string key_summary = 38;
  // "Restore my vaults": the row under the recovery key, and its event.
  string restore_label = 39;
  // "Check my backup": the row under the recovery key that pushes the check page (#1188, B6);
  // empty with nothing paired or on a vault that moved.
  string check_label = 42;
  Route check = 43;
  // THE ONE-TIME PROMPT after the first confirmed backup (#1188, NB5): unset when it is not due,
  // already answered, or the key is already saved somewhere.
  BackupKeyPrompt key_prompt = 44;
  // THE ASK FOR NOTIFICATIONS after the first device is paired (#1188, NB2): unset when it is not due,
  // already answered with Not now, or the phone has answered the system prompt either way.
  BackupNotifyAsk notify_ask = 45;
  // WHAT THE PHONE SAYS ABOUT BACKUP ALERTS when they cannot arrive: refused, switched off, or late.
  // Empty when they will.
  string notify_off = 46;
  // "Open Settings", set only when the grant was refused (the only case Settings mends).
  string notify_settings_label = 47;
  // HOW BACKUP RUNS ON THIS PLATFORM, in the sentences the member is owed: never continuous, and
  // what a force-quit does. Drawn under "What travels when" (#1188).
  string posture = 48;
  // "Checked 2 days ago" or "Never checked": the second line of the "Check my backup" row,
  // from the verdict this phone kept (#1188). Empty when the row is not drawn.
  string check_status = 49;
  // Whether that verdict found something wrong, so the row's line is drawn as a warning.
  bool check_warning = 50;
  // WHAT THE LAST CHECK READ, at the rate it reads at (#1191): "Each check reads 64 of the 1,216
  // stored pieces ...". Drawn under `check_status`; empty before a check ran.
  string check_rate = 51;
  // A RUN'S BYTES, for the status card's bar under `progress` ("Backing up — 412
  // MB to go"). Known only while a run is going and the phone can say how many
  // bytes the backup covers; the fraction is what a gateway has acknowledged
  // of that total, 0..1. Otherwise `progress` is drawn with a spinner.
  bool progress_known = 40;
  float progress_fraction = 41;
}

// WHERE THE BACKUP STANDS, in one word the page draws its status card from (#1173).
enum BackupCondition {
  BACKUP_CONDITION_UNSPECIFIED = 0;
  // Everything a gateway was sent is acknowledged and nothing warns.
  BACKUP_CONDITION_UP_TO_DATE = 1;
  // A "Back up now" run is going.
  BACKUP_CONDITION_RUNNING = 2;
  // No backup device has answered for longer than a backup should go without
  // (`line.STALE_MS`): the page says so and what to check.
  BACKUP_CONDITION_NOT_REACHED = 3;
  // No backup device is paired.
  BACKUP_CONDITION_UNPAIRED = 4;
  // The vault moved to another phone: read-only here.
  BACKUP_CONDITION_MOVED = 5;
  // Something stands that the line warns of (a device behind, full or holding an older backup,
  // nothing acknowledged yet, a device to pair again, a backlog that has waited too long): the
  // card is never green beside it.
  BACKUP_CONDITION_ATTENTION = 6;
  // Records are backed up and items still wait for a window, with nothing yet to warn of.
  BACKUP_CONDITION_CATCHING_UP = 7;
}

// "Save your recovery key": shown once, dismissible, with no checkbox.
message BackupKeyPrompt {
  string title = 1;
  string body = 2;
  string save_label = 3;
  string not_now_label = 4;
  // Where Save goes: the page that shows the key behind the passcode.
  Route save = 5;
}

// "Allow notifications": shown once, dismissible.
message BackupNotifyAsk {
  string title = 1;
  string body = 2;
  string allow_label = 3;
  string not_now_label = 4;
}

message BackupHomeEvent {
  oneof kind {
    BackUpNow back_up_now = 1;
    SetIncludeVideos set_include_videos = 2;
    // Forgets at once: it drops this phone's pairing and nothing the gateway
    // holds, and pairing again undoes it.
    ForgetDestination forget_destination = 3;
    // Move the recovery key into the keychain, or out of it.
    SetKeySync set_key_sync = 4;
    RuleChosen rule_chosen = 5;
    Retry retry = 6;
    // Restore this phone's vaults: Home's own restore, asked from here.
    RestorePressed restore_pressed = 7;
    // The prompt was answered, by Save or by Not now: it is not shown again.
    KeyPromptAnswered key_prompt_answered = 8;
    // Allow notifications: the system prompt through the one notification service.
    NotifyAllow notify_allow = 9;
    // Not now: the ask is not shown again.
    NotifyNotNow notify_not_now = 10;
    // The platform's own settings page for this app.
    NotifyOpenSettings notify_open_settings = 11;
    // Undo the deletes this phone made on that backup device and it still holds (#1191).
    UndoHeld undo_held = 12;
  }

  message KeyPromptAnswered {}

  message NotifyAllow {}

  message NotifyNotNow {}

  message NotifyOpenSettings {}

  message RestorePressed {}

  message BackUpNow {}

  message SetIncludeVideos {
    bool include = 1;
  }

  message ForgetDestination {
    string gateway_id = 1;
  }

  message UndoHeld {
    string gateway_id = 1;
  }

  message SetKeySync {
    bool on = 1;
  }

  message RuleChosen {
    // `BackupRuleChoice.stored`.
    string stored = 1;
  }

  message Retry {}
}

// ---------------------------------------------------------------------------
// Effects
// ---------------------------------------------------------------------------

// Ask the platform whether it will wake Centraid in the background (iOS
// Background App Refresh, Android's work scheduler): the shell answers with
// what it last registered, without registering anything.
message BackgroundProbe {}

message BackgroundStatus {
  // The platform took at least one window.
  bool registered = 1;
}

// ---------------------------------------------------------------------------
// Check my backup (#1188, B6): `backup.check`, pushed from Backup's Recovery section.
// ---------------------------------------------------------------------------

message BackupCheckState {
  string title = 1;
  string intro = 2;
  // "Result" while a result stands, "Checking" while one runs; empty before the first check.
  string heading = 3;
  repeated BackupCheckRow rows = 4;
  // THE STATUS LINE AT THE FOOT: "Checked just now", "Not checked", "Checking Office NAS".
  StatusLine status = 5;
  // A determinate bar while a check runs: `fraction` of the device in hand, 0..1.
  bool running = 6;
  float fraction = 7;
  // The one action: "Check my backup", "Check again", or "Stop" while running.
  string action_label = 8;
  BackupCheckAction action = 9;
  // "Back up now", offered under a result that found something to send again; empty otherwise.
  string back_up_now_label = 10;
  // The page it was pushed from, for the back control: "Backup".
  string back_label = 11;
}

enum BackupCheckAction {
  BACKUP_CHECK_ACTION_UNSPECIFIED = 0;
  BACKUP_CHECK_ACTION_CHECK = 1;
  BACKUP_CHECK_ACTION_STOP = 2;
  BACKUP_CHECK_ACTION_NONE = 3;
}

message BackupCheckRow {
  string gateway_id = 1;
  // The name the member gave the device.
  string name = 2;
  // "Tuesday 10 November, 21:40 opens." / "Not checked." / "Opens fine · Tuesday 10 November, 21:40".
  string line = 3;
  // "91,204 files held, 40 opened to check." / "It didn't answer." / "112 of 260 parts".
  string detail = 4;
  BackupCheckTone tone = 5;
}

enum BackupCheckTone {
  BACKUP_CHECK_TONE_UNSPECIFIED = 0;
  BACKUP_CHECK_TONE_OK = 1;
  BACKUP_CHECK_TONE_BAD = 2;
  BACKUP_CHECK_TONE_NOT_RUN = 3;
  BACKUP_CHECK_TONE_RUNNING = 4;
}

message BackupCheckEvent {
  oneof kind {
    Start start = 1;
    Stop stop = 2;
    // "Back up now" under a result: the pass service's, asked of the conductor.
    BackUpNow back_up_now = 3;
  }

  message Start {}
  message Stop {}
  message BackUpNow {}
}
