// HOME'S SEARCH: EVERY APP, LOCKER INCLUDED, IN ONE ANSWER (R-CHROME-6).
//
// Home's search bar asks the vault once and draws the answer grouped by the app
// each row opens in. It is the SAME search Notes' powerbox runs
// (`notes.link_targets`, D-1020-N1): one isolated FTS probe per
// `centraid_search::DOMAINS` domain — notes, people, agenda, tasks,
// photos and docs — at most eight rows each, under the owner, with People's
// journal notes left out — and one more probe per named index (notebooks
// and albums, projects, Docs folders; #1097, R-1097-19..21; and
// chat threads, found by their title and by what the member said, R-1097-22),
// also at most eight. There is no second search engine behind it
// (R-1046-1, D-1020-S1); this arm is that loader asked from Home.
//
// **A LOCKER ITEM IS A HIT WHETHER OR NOT LOCKER IS LOCKED** (#1135). The index
// holds it by its plain text (title, username, address, notes ...) and never by
// a sealed secret, so a row names the item and nothing to reveal; the hit's
// `app_id` is `locker`, and opening it passes through Locker's own lock wall on
// the shell side, as any Locker destination does.
//
// A probe that refuses drops its own app's rows and never the answer, so a
// shell cannot tell "no Docs matched" from "Docs could not be searched" — the
// powerbox's ruling, kept.
//
// It rides `app_query.proto` at number 80, Home's own: Home is not an app,
// so it takes a number after the apps' blocks.

syntax = "proto3";

package centraid.core.v1;

// `vault.search`: every searchable app's rows for one term.
message VaultSearchRequest {
  // The words. Blank answers no hits, never every row.
  string term = 1;
  // The zone `VaultSearchHit.subtitle_local_day` is read in. A DECORATION's
  // zone, as `NotesLinkTargetsRequest.tz`: none stated on a vault that names
  // none leaves the days EMPTY rather than refusing the search; an unknown
  // name is refused.
  string tz = 2;
}

message VaultSearch {
  // In the domains' order (`centraid_search::DOMAINS`), each domain's rows in
  // the index's rank order, then the named kinds' (`centraid_search::NAMED`,
  // #1097), each index's rows in rank order. A shell groups and orders them as
  // it draws, and draws a `chat` row only if it has a Chat tab.
  repeated VaultSearchHit hits = 1;
  // THE WORDS THE ROWS ANSWER. Set only when the term as typed found fewer than
  // three rows and a correction of its words added some: the typed words with each
  // mistyped one replaced by a word the vault's own index holds. The rows
  // above are the exact rows first and then the ones the corrected words
  // found, none twice. EMPTY when nothing was added. A shell says
  // "Including results for <corrected>".
  string corrected = 2;
}

// One row a member can open, from the index — five strings and the readings
// the core adds, never a column the index does not carry.
message VaultSearchHit {
  // The logical entity: `knowledge.note`, `core.party`, `core.event`,
  // `schedule.task`, `core.content_item`, `core.document`, or a
  // CONTAINER's (#1097, R-1097-19): `core.collection` (a notebook, app `notes`, or
  // an album, app `photos`), `schedule.project`
  // or `core.concept` (a Docs folder); or a chat thread's (R-1097-22): `chat.thread`,
  // app `chat`, `id` the thread's id, `title` its title, `snippet` the match in
  // the member's own words.
  string entity = 1;
  // The row's own primary key.
  string id = 2;
  string title = 3;
  // The index's subtitle column — a when, a body excerpt — or the app's id
  // when the row has none.
  string subtitle = 4;
  // The app the row opens in.
  string app_id = 5;
  // The index's highlight of the match, or empty.
  string snippet = 6;
  // As `NotesLinkTarget.subtitle_local_day`.
  string subtitle_local_day = 7;
  // WHAT THE ROW OPENS BY in its app, when that is not `id`. A photo is a
  // content item in the index and a media asset in Photos, so its hit carries
  // the asset's id here; every other hit leaves it empty. A photo whose asset
  // is gone or in the trash is not a hit at all.
  string open_id = 8;
}
