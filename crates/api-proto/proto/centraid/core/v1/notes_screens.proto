// NOTES' SCREENS (#1135): the library, notebooks and journal under one band, the
// editor with its powerbox, a note's version history, and the kit's `notes.trash`.
// Every message here is finished state a view draws or an event a view sends;
// Rust (`crates/screens`, module `notes`) makes every decision, string, count and
// route. Arms in `screens.proto`: 600-699.
//
// Screens: `notes.home` (Notes, Notebooks and Journal are PLACES of one screen,
// so a tap on the band changes a value and no stack entry), `notes.editor`
// (autosaving; the link powerbox is a sheet it owns), `notes.history` and the
// kit's `notes.trash`.

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/kit_screens.proto";
import "centraid/core/v1/route.proto";

// ---------------------------------------------------------------------------
// notes.home
// ---------------------------------------------------------------------------

message NotesHomeState {
  NotesPlace place = 1;
  // The page's heading: "Notes", "Notebooks" or "Journal". A notebook the
  // Notes place is scoped to is the `subtitle`, never the title.
  string title = 2;
  // The band: Notes · Notebooks · Journal, then More. EMPTY while denied.
  repeated NotesBandTab band = 3;
  NotesHomeChrome chrome = 4;
  oneof content {
    Loading loading = 5;
    Failure failure = 6;
    Denied denied = 7;
    NotesLibraryData library = 8;
    NotesNotebooksData notebooks = 9;
    NotesJournalData journal = 10;
  }
  // 11 was `chips`, the Notes place's filters and sort as a chip row: the
  // filters and the sort are `filter_menu`, the notebook scope is `subtitle`.
  reserved 11;
  reserved "chips";
  // Search is the field under the title; its answer replaces the shelf.
  NotesSearchState search = 12;
  // More holds Import, Export and Trash.
  repeated NotesMoreRow more_rows = 13;
  NotesSheet sheet = 14;
  // The sheet's content, by which sheet is open.
  NotesRowMenu menu = 15;
  repeated NotesChoice choices = 16;
  optional Confirm confirm = 17;
  // A refusal's sentence, or what a write did; the screen under it stays.
  StatusLine status = 18;
  // The new / rename notebook sheet; absent when closed.
  optional NotesNotebookForm form = 19;
  // The journal's new-entry sheet; absent when closed.
  optional NotesJournalCompose compose = 20;
  // "New note": the header's one action in the Notes place.
  Route new_note = 21;
  // The recent window is the library's current window size.
  uint32 window = 22;
  // The header's filter button: Pinned and the tags (any number, the filter)
  // and the sort (one of three, never a filter). Unset while denied, over
  // search and off the Notes place.
  optional FilterMenu filter_menu = 23;
  // The notebook (or "Unfiled") the Notes place is scoped to, under the title,
  // with a close key that shows every note. Unset when the place is not scoped,
  // while denied, over search and off the Notes place.
  optional HeaderSubtitle subtitle = 24;
}

enum NotesSheet {
  // No sheet is open.
  NOTES_SHEET_UNSPECIFIED = 0;
  NOTES_SHEET_MORE = 1;
  // 2 was NOTES_SHEET_SORT: the sort is a section of the filter menu.
  reserved 2;
  reserved "NOTES_SHEET_SORT";
  NOTES_SHEET_ROW_MENU = 3;
  NOTES_SHEET_FILE_INTO = 4;
  NOTES_SHEET_NOTEBOOK_MENU = 5;
}

// The library's order. No message carries it any more (a pick is a
// `FilterMenuPicked` under the `sort` section); the screen holds it as its state.
enum NotesLibrarySort {
  NOTES_LIBRARY_SORT_UNSPECIFIED = 0;
  NOTES_LIBRARY_SORT_UPDATED = 1;
  NOTES_LIBRARY_SORT_CREATED = 2;
  NOTES_LIBRARY_SORT_TITLE = 3;
}

message NotesBandTab {
  // `notes`, `notebooks`, `journal` or `more`.
  string key = 1;
  string label = 2;
  string icon_key = 3;
  bool current = 4;
}

// The page's fixed words, so a view carries no copy of its own.
message NotesHomeChrome {
  string new_notebook = 1;
  string search_placeholder = 2;
  string search_label = 3;
  string search_close = 4;
  string retry = 5;
  string loading = 6;
  string more_title = 7;
  string file_title = 8;
  // 9 was `sort_title`, the sort sheet's heading.
  reserved 9;
  reserved "sort_title";
  string home = 10;
  string row_menu_label = 11;
  string new_entry = 12;
  string journal_origin = 13;
  string trash_label = 14;
  string notebook_menu_title = 15;
  string cancel = 16;
  string close = 17;
  // The header's one action in the Notes place.
  string new_note = 18;
  // A row's own actions (long press, swipe): Pin or Unpin by the row's `pinned`,
  // File into notebook, and `trash_label`'s Trash. Each acts on that row.
  string pin_label = 19;
  string unpin_label = 20;
  string file_label = 21;
}

message NotesMoreRow {
  string key = 1;
  string label = 2;
  string icon_key = 3;
  // Where a tap goes.
  Route route = 4;
  // The row's second line (#1185): Trash says "30 days, then erased". Empty for the others.
  string meta = 5;
}

message NotesChoice {
  string id = 1;
  string label = 2;
  bool selected = 3;
  // 4 was `sort`, the order a sort-sheet choice set.
  reserved 4;
  reserved "sort";
}

message NotesRowMenu {
  string note_id = 1;
  string title = 2;
  string pin_label = 3;
  string file_label = 4;
  string trash_label = 5;
  // For a notebook's menu (the same sheet).
  string rename_label = 6;
}

message NotesTextRun {
  string text = 1;
  bool highlighted = 2;
}

message NotesNoteRow {
  string note_id = 1;
  string title = 2;
  string snippet = 3;
  repeated NotesTextRun snippet_runs = 4;
  // "Edited 3 March · Recipes".
  string meta = 5;
  bool pinned = 6;
  // "2 of 5 done", or empty.
  string check_label = 7;
  string accessibility_label = 8;
  // The one notebook it is filed in; empty for none.
  string notebook_id = 9;
  // Where a tap goes: the editor on this note.
  Route route = 10;
  // What the note is about, as chips ("About · Maya"): empty for a plain note.
  repeated NotesAboutChip about = 11;
}

// One subject of a note, drawn as a chip on its card and over the note. A tap opens the
// subject in its own app.
message NotesAboutChip {
  string id = 1;
  // `person`, `event`, `task`, `document`: the shell picks the glyph.
  string kind = 2;
  // "About · Maya".
  string label = 3;
  string accessibility_label = 4;
  Route route = 5;
}

message NotesLibrarySection {
  NotesSectionHead head = 1;
  repeated NotesNoteRow rows = 2;
}

message NotesSectionHead {
  string title = 1;
  uint32 count = 2;
}

message NotesLibraryData {
  repeated NotesLibrarySection sections = 1;
  // 2 was `tags`, the window's tags as chips: they are the filter menu's options.
  reserved 2;
  reserved "tags";
  // "12 notes".
  string count_label = 3;
  EmptyState empty = 4;
  // The recent window filled: older notes exist.
  bool truncated = 5;
  string window_end_label = 6;
  string window_end_verb = 7;
  bool can_widen = 8;
}

message NotesSearchState {
  bool open = 1;
  string term = 2;
  // "Including results for “x”".
  string corrected = 3;
  repeated SearchContainer containers = 4;
  // The answer for `term`, once it has landed; absent while the field is empty
  // or the answer is out.
  optional NotesSearchResults results = 5;
  optional SearchAsk ask = 6;
}

message NotesSearchResults {
  repeated NotesNoteRow rows = 1;
  optional EmptyState empty = 2;
  bool loading = 3;
}

message NotesNotebooksData {
  // "Unfiled" first, then every notebook, with its count.
  repeated NotesNotebookRow rows = 1;
  EmptyState empty = 2;
}

message NotesNotebookRow {
  // `unfiled`, or the notebook's id.
  string id = 1;
  string title = 2;
  // "12 notes", "200+ notes".
  string count = 3;
  string accessibility_label = 4;
  // False for Unfiled, which is no collection and has no menu.
  bool manageable = 5;
}

// The new / rename sheet.
message NotesNotebookForm {
  // Empty creates; a notebook id renames it.
  string notebook_id = 1;
  string title = 2;
  string name = 3;
  string placeholder = 4;
  string confirm_label = 5;
  string cancel_label = 6;
  bool can_confirm = 7;
  // A refusal's sentence over the typed name.
  string status = 8;
}

message NotesJournalData {
  repeated NotesJournalDaySection days = 1;
  string today = 2;
  string tz = 3;
  EmptyState empty = 4;
  bool truncated = 5;
  string window_end_verb = 6;
}

message NotesJournalDaySection {
  NotesSectionHead head = 1;
  string day = 2;
  repeated NotesJournalRow rows = 3;
}

message NotesJournalRow {
  string note_id = 1;
  string title = 2;
  // The wall clock the entry was written at.
  string meta = 3;
  // The checklist tally, or empty.
  string trailing = 4;
  string accessibility_label = 5;
  Route route = 6;
}

// The new-entry sheet. `day` and `tz` are the day the core read as today and the
// zone it read it in, so the entry is filed on that day IN that zone.
message NotesJournalCompose {
  string day = 1;
  string tz = 2;
  string mood = 3;
  string text = 4;
  string status = 5;
  string title = 6;
  string mood_placeholder = 7;
  string text_placeholder = 8;
  string save = 9;
  string close = 10;
  bool can_save = 11;
}

message NotesHomeEvent {
  oneof kind {
    // Retry after a failed read.
    Refreshed refreshed = 1;
    BandPicked band = 2;
    // ---- the Notes place ----
    SearchOpened search_opened = 3;
    SearchTerm search_term = 4;
    SearchClosed search_closed = 5;
    WindowWidened window_widened = 9;
    SheetClosed sheet_closed = 12;
    RowMenuOpened row_menu = 13;
    PinToggled pin = 14;
    FileIntoOpened file_into = 15;
    NotebookChosen notebook_chosen = 16;
    TrashAsked trash = 17;
    Confirmed confirmed = 18;
    Dismissed dismissed = 19;
    // ---- the Notebooks place ----
    NotebookPicked notebook_picked = 20;
    FormOpened form_opened = 21;
    FormNameEdited form_name = 22;
    FormDismissed form_dismissed = 23;
    FormConfirmed form_confirmed = 24;
    NotebookMenuOpened notebook_menu = 25;
    NotebookDeleteAsked notebook_delete = 26;
    // ---- the Journal place ----
    NewEntryTapped new_entry = 27;
    ComposeEdited compose_edited = 28;
    ComposeClosed compose_closed = 29;
    ComposeSaved compose_saved = 30;
    // ---- the header ----
    FilterMenuPicked filter_menu_picked = 31;
    FilterMenuCleared filter_menu_cleared = 32;
    // The close key after the notebook under the title: every note again.
    NotebookScopeCleared notebook_scope_cleared = 33;
  }

  // 6 was `sort`, 7 `pinned_only`, 8 `tag`, 10 `chip` and 11 `sheet_opened`: a
  // pick in the filter menu is `filter_menu_picked`.
  reserved 6, 7, 8, 10, 11;
  reserved "sort", "pinned_only", "tag", "chip", "sheet_opened";

  message Refreshed {}

  message BandPicked {
    string key = 1;
  }

  message SearchOpened {}

  message SearchTerm {
    string term = 1;
  }

  message SearchClosed {}

  message WindowWidened {}

  message NotebookScopeCleared {}

  message SheetClosed {}

  message RowMenuOpened {
    string note_id = 1;
  }

  message PinToggled {
    string note_id = 1;
  }

  message FileIntoOpened {
    string note_id = 1;
  }

  // The choice the file-into sheet picked; empty is "No notebook".
  message NotebookChosen {
    string notebook_id = 1;
  }

  message TrashAsked {
    string note_id = 1;
  }

  message Confirmed {}

  message Dismissed {}

  // A row of the Notebooks place; `unfiled` opens the Notes place on the
  // unfiled filter.
  message NotebookPicked {
    string id = 1;
  }

  // Empty `notebook_id` opens the create sheet.
  message FormOpened {
    string notebook_id = 1;
  }

  message FormNameEdited {
    string name = 1;
  }

  message FormDismissed {}

  message FormConfirmed {}

  message NotebookMenuOpened {
    string notebook_id = 1;
  }

  message NotebookDeleteAsked {
    string notebook_id = 1;
  }

  message NewEntryTapped {}

  message ComposeEdited {
    string mood = 1;
    string text = 2;
  }

  message ComposeClosed {}

  message ComposeSaved {}
}

// ---------------------------------------------------------------------------
// notes.editor
// ---------------------------------------------------------------------------

message NotesEditorState {
  string note_id = 1;
  // 2 was `is_new`: nothing read it (#1152).
  reserved 2;
  reserved "is_new";
  oneof content {
    Loading loading = 3;
    Failure failure = 4;
    NotesEditorDraft draft = 5;
  }
  NotesEditorChrome chrome = 6;
  Autosave autosave = 7;
  // The powerbox, while open.
  optional NotesLinkSheet link = 8;
  // 9 was `history`: the menu's earlier-versions row is `earlier` (#1185).
  reserved 9;
  reserved "history";
  // Where Send to Agenda goes (To-do's quick add holds the words); absent
  // while there are none.
  optional Route send_to_agenda = 10;
  // The note's tags, each removable; empty before the note exists.
  repeated NotesEditorTag tags = 11;
  // The line over the title: the notebook it is filed in, then "Edited Wed 4
  // November" ("Travel · Edited Wed 4 November"). Empty before the note exists.
  string meta = 12;
  // THE BODY, DRAWN: the draft body's blocks and spans. Absent while there is
  // no draft.
  NotesRichText rich = 13;
  // Where the caret goes after a core edit (Return); a shell applies a `seq`
  // once.
  optional NotesEditorSelection selection = 14;
  // What the note is about, above its words (#1173): chips that open the subject.
  repeated NotesAboutChip about = 15;
  // The menu's "Earlier versions   2 ›" row (#1185): the kit's entry, absent until the note holds
  // an earlier version. Its route is the kit's one screen, `notes.earlier`.
  optional EarlierEntry earlier = 16;
}

message NotesEditorTag {
  string concept_id = 1;
  string label = 2;
  // "Remove tag", said for a screen reader.
  string remove_label = 3;
}

// The body drawn. Every range is in UTF-16 code units, half-open [start, end):
// NSString's unit on iOS and Kotlin's Char on Android, so both shells index
// the body directly. A shell whose text length differs from `body_length`
// draws the body plain until the next state.
message NotesTextRange {
  uint32 start = 1;
  uint32 end = 2;
}

message NotesRichText {
  repeated NotesRichBlock blocks = 1;
  repeated NotesRichSpan spans = 2;
  // A bound was hit (a very large note): past it the body is plain.
  bool truncated = 3;
  // The UTF-16 length of the body these ranges are of.
  uint32 body_length = 4;
}

enum NotesRichBlockKind {
  NOTES_RICH_BLOCK_KIND_UNSPECIFIED = 0;
  NOTES_RICH_BLOCK_KIND_PARAGRAPH = 1;
  NOTES_RICH_BLOCK_KIND_HEADING = 2;
  NOTES_RICH_BLOCK_KIND_CHECKLIST = 3;
  NOTES_RICH_BLOCK_KIND_BULLET = 4;
  NOTES_RICH_BLOCK_KIND_QUOTE = 5;
}

message NotesRichBlock {
  NotesRichBlockKind kind = 1;
  // The line, without its terminator.
  NotesTextRange range = 2;
  // The checklist "[ ]" / "[x]", the bullet character, the heading hashes or
  // the quote ">"; absent for a paragraph.
  NotesTextRange marker = 3;
  // The words after the marker.
  NotesTextRange content = 4;
  // Heading 1-6; a list's indent depth.
  uint32 level = 5;
  bool checked = 6;
  // What a screen reader says for a checklist circle ("Checked" / "Not
  // checked"); empty otherwise.
  string accessibility_label = 7;
}

enum NotesRichStyle {
  NOTES_RICH_STYLE_UNSPECIFIED = 0;
  NOTES_RICH_STYLE_EMPHASIS = 1;
  NOTES_RICH_STYLE_STRONG = 2;
  NOTES_RICH_STYLE_STRIKE = 3;
  NOTES_RICH_STYLE_CODE = 4;
  // Markdown punctuation the shell draws faint.
  NOTES_RICH_STYLE_SYNTAX = 5;
  NOTES_RICH_STYLE_LINK = 6;
}

message NotesRichSpan {
  NotesRichStyle style = 1;
  NotesTextRange range = 2;
  // A LINK span's chip.
  optional NotesLinkChip chip = 3;
}

enum NotesLinkChipKind {
  NOTES_LINK_CHIP_KIND_UNSPECIFIED = 0;
  NOTES_LINK_CHIP_KIND_URL = 1;
  NOTES_LINK_CHIP_KIND_NOTE = 2;
}

enum NotesLinkResolution {
  NOTES_LINK_RESOLUTION_UNSPECIFIED = 0;
  NOTES_LINK_RESOLUTION_RESOLVED = 1;
  NOTES_LINK_RESOLUTION_MISSING = 2;
  NOTES_LINK_RESOLUTION_TRASHED = 3;
}

message NotesLinkChip {
  NotesLinkChipKind kind = 1;
  // What the chip shows: a resolved note's title, the link's words, or the URL.
  string label = 2;
  NotesLinkResolution resolution = 3;
  // A resolved note: where a tap goes (the shell opens it, as it does
  // `history`).
  optional Route route = 4;
  string accessibility_label = 5;
}

message NotesEditorSelection {
  uint32 caret = 1;
  uint64 seq = 2;
}

message NotesEditorDraft {
  string title = 1;
  string body = 2;
  bool pinned = 3;
}

message NotesEditorChrome {
  // "Cancel" before the first keystroke of this visit, "Done" after.
  string close = 1;
  string title_placeholder = 2;
  string body_placeholder = 3;
  string pin_label = 4;
  // 5 was `history_label`: the entry carries its own label (#1185).
  reserved 5;
  reserved "history_label";
  string send_to_agenda_label = 6;
  string link_label = 7;
  // "Saving…", "Saved", the refusal's sentence, or empty.
  string status = 8;
  // "New note" or "Note".
  string title = 9;
  string menu_label = 10;
  // 11 was `history_enabled`: the entry is absent until there is something earlier (#1185).
  reserved 11;
  reserved "history_enabled";
  string retry = 12;
  // The add-tag field's placeholder; empty while the note does not exist (tags need a note).
  string tag_placeholder = 13;
  // The toolbar's checklist key: starts a checklist line at the end of the note.
  string checklist_label = 14;
  // The toolbar's keyboard key.
  string keyboard_label = 15;
  // The status line's verb after a checklist tap: "Undo", or empty.
  string status_action = 16;
  // "Share", the menu's row (#1185); empty until the note exists.
  string share_label = 17;
}

message NotesLinkSheet {
  string term = 1;
  string title = 2;
  string search_placeholder = 3;
  string close = 4;
  string retry = 5;
  string loading_label = 6;
  string foot = 7;
  oneof content {
    Loading loading = 8;
    Failure failure = 9;
    Denied denied = 10;
    NotesLinkData data = 11;
  }
}

message NotesLinkData {
  repeated NotesLinkDomain domains = 1;
  EmptyState empty = 2;
}

message NotesLinkDomain {
  NotesSectionHead head = 1;
  repeated NotesLinkTargetRow rows = 2;
}

message NotesLinkTargetRow {
  string entity = 1;
  string id = 2;
  string title = 3;
  string subtitle = 4;
  string app_id = 5;
  string accessibility_label = 6;
}

message NotesEditorEvent {
  oneof kind {
    TitleEdited title = 1;
    BodyEdited body = 2;
    PinToggled pin = 3;
    LinkRequested link_requested = 4;
    LinkTerm link_term = 5;
    LinkPicked link_picked = 6;
    LinkDismissed link_dismissed = 7;
    Refreshed refreshed = 8;
    // Save now (the native Done / back).
    Saved save = 9;
    TagAdded tag_added = 10;
    TagRemoved tag_removed = 11;
    // The toolbar's checklist key: a new "- [ ]" line at the end of the body.
    ChecklistRequested checklist_requested = 12;
    // A tap on a checklist item's circle: `at` is any UTF-16 offset on its line.
    ChecklistToggled checklist_toggled = 13;
    // A tap on a link chip: `at` is the chip's range start (UTF-16).
    LinkOpened link_opened = 14;
    // Return pressed with the caret at `caret` (UTF-16); the core edits the body.
    ReturnPressed return_pressed = 15;
    // The status line's verb (Undo).
    StatusActed status_acted = 16;
    // The menu's Share row (#1185): Rust asks the owner check, then hands the note to the OS.
    ShareRequested share_requested = 17;
  }

  message ShareRequested {}

  message ChecklistToggled {
    uint32 at = 1;
  }

  message LinkOpened {
    uint32 at = 1;
  }

  message ReturnPressed {
    uint32 caret = 1;
  }

  message StatusActed {}

  message ChecklistRequested {}

  message TagAdded {
    string label = 1;
  }

  message TagRemoved {
    string label = 1;
  }

  message TitleEdited {
    string title = 1;
  }

  message BodyEdited {
    string body = 1;
  }

  message PinToggled {}

  message LinkRequested {}

  message LinkTerm {
    string term = 1;
  }

  // A row of the powerbox: the editor looks it up by `id`.
  message LinkPicked {
    string id = 1;
  }

  message LinkDismissed {}

  message Refreshed {}

  message Saved {}
}

