// Pairing (#1020, D-1020-C8).
//
// v0's ticket is `base64url(JSON.stringify(payload))`
// (`packages/server/src/serve/pairing-ticket-codec.ts:1-13`); this one is
// `base64url(PairTicket encoded)`, which is smaller in a QR and cannot be
// hand-edited into a shape the parser half-accepts.
//
// **No key rides the ticket** (`packages/core/src/protocol/seat-log.ts:143-158`).
// The ticket is read off a screen by a camera, survives in a photo roll, and is
// validated before any device exists to be a principal. The vault's Locker key
// reaches a seat over the authenticated post-pair channel only.
//
// Only a HASH of `secret` is stored on the gateway, TTL is 15 minutes, and
// redemption BURNS the ticket, records the device's public key in the allowlist
// and answers — all in one transaction of the gateway's own state store, so a
// failure anywhere leaves zero enrolment and never a half-paired device
// (v0's `redeemAndEnroll`, `packages/server/src/serve/pairing-store.ts:98-105`).

syntax = "proto3";

package centraid.core.v1;

// What the QR encodes.
message PairTicket {
  // Ticket format version. `1` for v1; a reader refuses anything else rather
  // than guessing, because a ticket is the one message with no handshake in
  // front of it.
  uint32 v = 1;
  // The gateway's iroh EndpointId, 32 raw bytes.
  bytes gateway_endpoint = 2;
  // The relay the gateway expects to be reachable through. Empty means "the
  // default relays"; a self-hosted deployment names its own
  // (`crates/net/README.md`).
  string relay_url = 3;
  // Names the row in the gateway's `tickets` store.
  string ticket_id = 4;
  // The one-use secret, in the clear IN THE TICKET and hashed at rest.
  bytes secret = 5;
  // What the member sees on the confirm screen.
  string vault_name = 6;
  // Milliseconds since the epoch. `DEFAULT_TICKET_TTL_MS = 15 * 60 * 1000`
  // (`packages/server/src/serve/pairing-store.ts:21`).
  uint64 expires_at_ms = 7;
  // The gateway's IP addresses, `<ip>:<port>`, as dialling HINTS.
  //
  // **D-1020-C15.** Required by `RelayMode::Disabled`, which #1020 names as a
  // supported mode: with no relay and no address-lookup service there is
  // nothing an EndpointId alone can be dialled through, so a LAN-only or
  // loopback deployment needs the addresses in the ticket. With relays on they
  // are a shortcut that saves the first round trip and nothing depends on
  // them.
  //
  // They are HINTS and never authority: iroh's TLS handshake proves the
  // endpoint id, so a tampered address reaches either the right gateway or
  // nothing. That is what makes it safe for a value read off a screen by a
  // camera to carry them at all.
  repeated string direct_addrs = 8;
}

// The seat redeeming it.
message PairRequest {
  // The ticket's `secret`, echoed. Named `code` for v0's spelling
  // (`packages/tunnel/src/protocol.ts:101-114`).
  bytes code = 1;
  string ticket_id = 2;
  // What the member will see in the device list.
  string device_name = 3;
  // `ios` / `android` / `macos` / `windows` / `linux`.
  string platform = 4;
  // The seat's iroh public key, 32 raw bytes. This is what lands in the
  // allowlist, and what a later connection on `centraid/v1/seat` is checked
  // against before any frame is read.
  bytes device_public_key = 5;
}

message PairResponse {
  oneof result {
    PairOk ok = 1;
    PairError error = 2;
  }
}

message PairOk {
  // WHERE THIS VAULT IS REACHED RIGHT NOW — an ADDRESS, never a name
  // (#1025 S1). The gateway's iroh endpoint id, lowercase hex. A device keys
  // nothing by it: the replica file, the outbox and the byte store are named
  // by `vault_id`, so a vault restored onto another machine keeps every one of
  // them and only this value changes. Two tickets carrying the same endpoint
  // are a coincidence a device never acts on.
  //
  // NAMED FOR WHAT IT IS since #1025 S2: it was `gateway_id`, and a name
  // ending in `_id` is the one thing this field must never be read as.
  string gateway_address = 1;
  // The vault-side `access_device.device_id` the seat now is.
  string device_id = 2;
  string vault_id = 3;
  string vault_name = 4;
  // THE BOOTSTRAP BLOB, NAMED IN THE ANSWER THAT CREATES THE PAIRING
  // (#1025 S7, item 5).
  //
  // There used to be a `snapshot_head` request for these three values, asked
  // on the connection the redemption had just promoted, one round trip after
  // the answer that could have carried them. Deleting it removes a request
  // kind, a response kind and a stream — and removes the state in between, in
  // which a device is paired and does not yet know what to fetch.
  //
  // `snapshot_bytes` is here for the ROOM CHECK, which happens before the
  // first byte moves: a phone with less free space than the artifact is told
  // so by name rather than filling its disk and failing somewhere further in.
  // It is also the denominator of the progress a "Copying your vault" screen
  // draws.
  //
  // The seat asks for the same three again when it falls under the floor, and
  // it is answered on `RebootstrapRequired` — which is the other message that
  // tells a device to take a copy. Those are the only two occasions, so those
  // are the only two messages that carry them.
  //
  // The blob's BLAKE3 content address, lowercase hex.
  string snapshot_hash = 5;
  // The log position the artifact stands at. The seat's cursor after it lands.
  uint64 snapshot_seq = 6;
  uint64 snapshot_bytes = 7;
  // Where to reach the gateway through, when it uses a relay. A DIALLING HINT:
  // empty is a LAN-only deployment, not an error.
  //
  // Here because the shell persists the pairing BEFORE there is a replica to
  // put it in (#1025 S7, item 3): until the first copy lands, the pairing
  // record lives only in the secure store, and a record with no way to dial is
  // a durable identity presented to nobody — which is exactly the defect S5
  // found from the other end.
  string relay_url = 8;
  // `<ip>:<port>` shortcuts. Hints with NO AUTHORITY — a stale or tampered
  // address reaches the right gateway or nothing at all — which is what makes
  // them safe to persist beside the id that is proved.
  repeated string direct_addrs = 9;
  // THE PUBLIC KEY THIS GATEWAY JUST ENROLLED, 32 raw bytes (#1025 S7-13).
  //
  // Derived from the endpoint that redeemed — the key iroh's TLS PROVED on the
  // connection, never a field the redeeming device sent — so it is the
  // gateway's own statement of which identity is now in its allowlist.
  //
  // It travels back because the device has to be able to check, at every later
  // open, that the endpoint it is about to dial with is the one that was
  // enrolled. Without it a seat whose secure store lost or never kept the
  // secret mints a fresh keypair and dials as a STRANGER: the gateway refuses
  // it as an unenrolled peer, and the member reads a version-window sentence
  // over what is really a lost credential. The check is the shell's enrolment
  // record against the spawned endpoint, and the refusal is
  // `ERROR_CODE_IDENTITY_MISMATCH`.
  bytes enrolled_public_key = 10;
}

// The closed refusal vocabulary. v0's is the same three
// (`packages/tunnel/src/protocol.ts:101-114`), and it is deliberately coarse:
// a member holding a screenshot of an old QR must not learn from the answer
// whether the ticket ever existed.
enum PairErrorCode {
  PAIR_ERROR_CODE_UNSPECIFIED = 0;
  PAIR_ERROR_CODE_INVALID_CODE = 1;
  PAIR_ERROR_CODE_EXPIRED_CODE = 2;
  PAIR_ERROR_CODE_BAD_REQUEST = 3;
}

message PairError {
  PairErrorCode code = 1;
}
