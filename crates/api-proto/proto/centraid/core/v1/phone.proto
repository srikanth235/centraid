// THE PHONE'S TWO FLOWS, OVER THE ABI (#1029 §2, §5, W15).
//
// The shell has exactly two things to ask this core that it could not ask
// before: **back up what is waiting to my gateways**, and **bring my vaults
// back from 24 words**. Two more ride with them because a shell cannot draw
// either screen without them: **pair with a gateway** (the QR it scanned) and
// **what is the state of my backup**.
//
// [#1080](https://github.com/srikanth235/centraid/issues/1080) rebuilt the
// plane behind them — direct HTTPS to the member's own gateways, a snapshot of
// the vault file, every original and derivative sealed and named from the 24
// words — and added the doors beside the pass, in their own sections below:
// the operating system's half of an upload (`handoff`, `settle`), the ledger
// squared with a gateway (`reconcile`), the certificates a shell pins (`pins`),
// one original fetched back (`fetch_original`), a gateway forgotten
// (`forget_destination`), and the originals a member may delete from the
// operating system's library because a gateway holds them (`releasable`,
// `released`).
//
// ## Why four REQUEST KINDS and not four registered commands
//
// Same answer `vault.proto` gives for founding, one layer further out. A
// registered command runs through `centraid_vault::commands::Registry`, whose
// gate order evaluates its principal against `vault.self_id`. **A restore has no vault to be a principal in** — that is the
// whole of what it is for — and a drain is not a write to the vault at all: it
// moves sealed ciphertext of what the vault holds out to a gateway. Neither
// is a command, and a command exempted from the gate order would be a second
// command plane wearing the first one's name.
//
// ## The five symbols are not touched
//
// A new flow is a new arm on `Request.kind` through `centraid_call`
// (`crates/core-ffi/CONTRACT.md` §10). There is no sixth symbol here and there
// never will be: `nm -D --defined-only libcentraid_core_ffi.so | grep ' T
// centraid_'` is 5 and `abi-five-symbols` counts the declarations on every
// gate run.
//
// ## The gateway is blind, and so is this file
//
// Nothing here carries a key to or from a GATEWAY. `RestoreRequest` carries
// the 24 words INWARD — from the member's own fingers into their own device's
// core — and a restoring phone **derives**; it never downloads a key (#1029
// §0, §5). Two secrets do cross this ABI, and only between the core and its
// own shell on the same device: the words and seed of `PhraseRequest` (#1047
// E1, for the screen that shows them once and the synchronised store), and a
// gateway's bearer token inside `HandoffPart.headers` (#1080, for the
// operating system's background upload, which needs the whole request and
// runs while this core is suspended). The device secret a pair or a restore
// used to mint left with the signed requests it signed (#1080): a gateway
// admits a phone by the token its ledger keeps.

syntax = "proto3";

package centraid.core.v1;

// ---------------------------------------------------------- transfer rule --

// WHEN THIS DEVICE MAY FETCH OR SEND ORIGINALS — the member's setting, as one
// value (#1025 S4, D-1025-S7-60). One per DEVICE and not per vault, because
// what it governs is a data plan and a phone has one data plan however many
// vaults it holds. The drain's input and the Photos backup sheet's choice: one
// enum, so there is one rule.
//
// A SELECTOR AND NEVER A BYTE COUNT: the planner admits an item larger than
// the whole budget on purpose, so a ceiling cannot express "not this tier".
// The core does every bit of the arithmetic — a Kotlin or Swift copy of the
// table would be a second rule deciding a member's bill.
//
// Thumbnails and previews are NOT in this enum, which is the shape of the
// ruling rather than an omission: a thumbnail crosses on any link and ahead of
// everything because it is kilobytes and it is the grid. Only the originals
// are worth a member's decision.
//
// Unspecified is WIFI_ONLY: the default, and the one whose failure mode is a
// photograph that arrives late rather than a bill.
enum TransferRule {
  TRANSFER_RULE_UNSPECIFIED = 0;
  // Originals wait for a link the member is not paying for.
  TRANSFER_RULE_WIFI_ONLY = 1;
  // A photograph's original may cross a metered link; a VIDEO's may not. That
  // last part is a fixed rule and not a fourth setting: the two differ by
  // three orders of magnitude, and a member who said "photos on cellular" did
  // not say "a 900 MB video on cellular".
  TRANSFER_RULE_WIFI_AND_CELLULAR_PHOTOS = 2;
  // No original crosses on any link unless the member taps it.
  //
  // Not "Wi-Fi off": a member on unlimited fibre may still want a phone that
  // holds thumbnails and fetches a full-size photograph only when asked,
  // because the constraint being spent is the device's disk rather than its
  // data plan.
  TRANSFER_RULE_MANUAL = 3;
}

// ------------------------------------------------------------------ drain --

// RUN ONE DRAIN PASS. Replaces `BackupNow` (`admin.proto`), which answered
// `NotYetAvailable` and classed itself unbounded over a door that did not
// exist.
//
// The pass (#1080): take a snapshot of the vault when one is due, seal what a
// reachable gateway does not yet hold into the spool — the snapshot's changed
// ranges, then every derivative, then the originals the rule admits, newest
// first — `PUT` it, record each acknowledgement, and move the gateway's head
// once every range of the snapshot is acknowledged. It answers with what the
// GATEWAY acknowledged.
//
// **Idempotent, and a second call while one runs is REFUSED, not queued.** A
// queue behind this door would make a background window's call sit waiting for
// a foreground pass it cannot see, and expire holding nothing. The shell is
// told `ERROR_CODE_INVALID_REQUEST` with "a drain is already running" and
// decides for itself whether to wait.
message DrainRequest {
  // How long this pass may take, in milliseconds from when it starts. `0` is
  // "no deadline" — the foreground case, where the member is watching a
  // progress bar and the pass runs until the spool is empty.
  //
  // It is a DURATION and not a wall-clock instant on purpose: a background
  // window hands out a budget ("you have 28 seconds"), not a moment, and a
  // shell converting one to the other against a phone clock the gateway has
  // already corrected would be converting against the wrong clock.
  uint64 deadline_ms = 1;
  // THE MEMBER'S TRANSFER RULE, as the shell keeps it (#1080). It decides
  // which ORIGINALS may cross this link, and never whether thumbnails and
  // previews may: they always may, because they are the grid. Unspecified is
  // WIFI_ONLY (`TransferRule` above). Videos never cross a metered link, whatever
  // the rule.
  TransferRule rule = 2;
  // THE LINK IS METERED: cellular, a hotspot, tethering. A shell that cannot
  // tell sends `true` — guessing "unmetered" wrongly costs a member's data
  // plan, and guessing "metered" wrongly costs a photograph some waiting.
  bool metered = 3;
  // THE PHONE IS ON EXTERNAL POWER. A shell that cannot tell sends `false`.
  bool charging = 4;
  // TAKE A SNAPSHOT OF THE VAULT NOW, whether or not one is due: "Back up
  // now", and the app leaving the screen. Without it a snapshot is taken only
  // when the schedule says one is due. It decides the snapshot's TIMING and
  // nothing else: it is not the member asking (`asked`, below).
  bool wants_snapshot = 5;
  // LEAVE VIDEOS OUT of this pass's originals (#1080). False is the complete
  // backup, so a shell that never sets it backs everything up; "include
  // videos" on the backup screen is this negated.
  bool exclude_videos = 6;
  // THE MEMBER TAPPED "BACK UP NOW" IN THIS PASS (#1080, the root's ruling
  // A24), and nothing else sets it: not the app leaving the screen, not a
  // background window. Under `TRANSFER_RULE_MANUAL` it is what lets originals
  // be sealed; on any rule it lets a video's original be sealed off the
  // charger, and on a metered link it sends the snapshot — the records, a few
  // MB — whatever the rule, while originals still follow it (R-1080-C38). A
  // shell that sent `wants_snapshot` for both meant two things by one bit,
  // and MANUAL means the member's own tap.
  bool asked = 7;
}

// Why the pass stopped. Every arm is a fact about the spool or the gateway, and
// none of them is a failure the shell should draw as one: two of the three are
// ordinary.
enum DrainStop {
  DRAIN_STOP_UNSPECIFIED = 0;
  // Nothing the rule admits is left to move: every part sealed for this pass
  // is on a gateway and acknowledged. `need_bytes` may still name items whose
  // bytes only the shell can read.
  DRAIN_STOP_EMPTY = 1;
  // The deadline came up first. `pending_bytes` is what is left; the next pass
  // continues where this one stopped and re-sends nothing acknowledged.
  DRAIN_STOP_DEADLINE = 2;
  // No paired gateway answered, or none is paired. Nothing was lost — the
  // spool is intact and the next pass starts where this one did.
  DRAIN_STOP_UNREACHABLE = 3;
  // The machine that answered is not the pinned gateway: its certificate is
  // not the one this phone paired with, or it answered as another gateway
  // (#1080, the audit's finding 5). Nothing was sent to it, and the spool is
  // intact.
  DRAIN_STOP_UNTRUSTED = 4;
  // The gateway ANSWERED AND REFUSED a write for a reason that is its own, not
  // an absence: its disk is full, it has a quota, or it will not take a part
  // of this size (`DISK_FULL`, `QUOTA`, `TOO_LARGE`; #1080, the sweep's F1).
  // Nothing was acknowledged, the spool is intact, and the next pass tries
  // again. Not `UNREACHABLE`: the member can act on this one (free room on
  // the machine), and a status that waited for time would never say so.
  DRAIN_STOP_REFUSED = 5;
}

message DrainResponse {
  // 1 WAS `acked_txid`, the last txid a gateway acknowledged (#1029 §2). A
  // snapshot plane has no txid (#1080): `acked_at_ms` and `confirmed_parts`
  // say what a gateway acknowledged. The number is reserved, not reused.
  reserved 1;
  reserved "acked_txid";
  // Sealed bytes still in the spool when the pass stopped. The number a shell
  // draws as "3.2 MB left to back up".
  uint64 pending_bytes = 2;
  DrainStop stopped = 3;
  // When the gateway acked, on the GATEWAY's clock — the only moment a member
  // may be shown as "last backed up". Absent when this pass acked nothing.
  optional int64 acked_at_ms = 4;
  // PARTS A GATEWAY ACKNOWLEDGED IN THIS PASS (#1080). Acknowledgement is a
  // `PUT`'s success, recorded in the device's ledger before it is counted.
  uint32 confirmed_parts = 5;
  // ITEMS WAITING ON BYTES ONLY THE SHELL CAN READ (#1080): originals that
  // live in the operating system's library, which this core cannot open.
  uint32 waiting_bytes_parts = 6;
  // THE ITEMS THIS CORE WANTS STREAMED NEXT (#1080), at most 64, newest first.
  // The shell streams each through the stage door with
  // `STAGE_SOURCE_OS_LIBRARY`.
  repeated NeedBytes need_bytes = 7;
}

// ONE ITEM WHOSE BYTES ONLY THE SHELL CAN READ (#1080), and everything the
// shell needs to find it in the operating system's library and stream it.
message NeedBytes {
  // 32 raw bytes: the BLAKE3 of the whole plaintext, as the vault holds it.
  bytes content_hash = 1;
  // The library's own identifier for the item, as `StageBegin.os_ref` carried
  // it when the item was imported.
  string os_ref = 2;
  // What the vault reads the bytes as.
  string media_type = 3;
  // The item's length in bytes, as the vault holds it.
  uint64 size = 4;
}

// ------------------------------------------------------------------- pair --

// PAIR WITH THE GATEWAY WHOSE PAIRING CODE THE MEMBER SCANNED (#1080).
//
// A gateway's `pair` verb prints the payload `{v: 2, gw, addrs, pin, secret,
// exp_ms}` as JSON and as a QR; the phone's camera reads it and hands it here
// whole. The core dials the addresses trusting only the certificate whose
// BLAKE3 is `pin`, pairs this vault with the one-use `secret`, and keeps the
// gateway in the device's ledger: its addresses, the certificate's DER and
// the bearer token. A gateway that already holds this vault is taken over by
// a claim signed with the vault's identity key, the claim a restore makes.
message PairRequest {
  // The scanned string, exactly as it was read. **Not a decoded struct**: the
  // payload is the one message with no handshake in front of it, and a shell
  // that parsed it would be a second parser to disagree with the gateway's
  // own (`centraid_gateway::rules::payload`).
  string payload = 1;
}

message PairResponse {
  // 1 WAS `gateway_endpoint`, the laptop's iroh `EndpointId`; 2 WAS
  // `record_published`, whether the identity record reached the pkarr
  // resolver; 3 WAS `device_secret`, the device key a pairing minted (#1029
  // W15, W17). A gateway is reached over HTTPS and named by `destination`,
  // there is no resolver, and a gateway admits a phone by the bearer token
  // the ledger keeps (#1080). The numbers are reserved, not reused.
  reserved 1, 2, 3;
  reserved "gateway_endpoint", "record_published", "device_secret";
  // WHAT THE MEMBER COMPARES, AND IT IS NOT A HEX ID (#1029 W15-D5).
  //
  // `centraid_identity::safety_number_of_bytes` over this phone's vault
  // identity key and the gateway certificate's BLAKE3 fingerprint — both 32
  // bytes, sorted — grouped for reading aloud. The gateway's `serve` prints
  // the same digits when the pairing lands, and `pairings` beside each vault,
  // so the two screens agree. A 64-character hex id is a string people check
  // four characters of and stop — which catches a typo and misses an
  // attacker, who gets to choose the other sixty. The safety number is short
  // enough to be read out in full, and being read out in full is the whole of
  // what it is for.
  //
  // Empty means this build could not compute one; `pair.laptop` refuses such
  // a pairing rather than show it — never "it matched".
  string safety_number = 4;
  // THE GATEWAY THIS PAIRING ADDED (#1080): its id, its label, the addresses
  // it was reached at and the certificate this phone now pins. A phone may be
  // paired with more than one; `BackupStatusResponse.destinations` lists them
  // all.
  Destination destination = 5;
  // THE TOKEN THIS PAIRING MINTED, for the shell to keep (#1191, E12): one
  // entry. The shell SETs it under `GatewayToken.key()`'s spelling in its
  // device secret store; the core keeps it in memory and writes it nowhere.
  repeated GatewayToken tokens = 6;
}

// A GATEWAY'S BEARER TOKEN, as the shell keeps it (#1191, E12). Device store
// only, under the key `gateway-token.<vault_id>.<gateway_id>`, value the
// token's 64 lowercase hex characters. Never in a database file, never in a
// synchronised store.
message GatewayToken {
  // 64 lowercase hex: the vault's id.
  string vault_id = 1;
  // 32 lowercase hex: the gateway's id.
  string gateway_id = 2;
  // 64 lowercase hex. Empty in `ForgetDestinationResponse.forget_token`,
  // which names the key to delete.
  string token = 3;
}

// The tokens the shell holds for this vault, read at open (LIST the prefix
// `gateway-token.<vault_id>.`, then GET). The core replaces its in-memory set
// for the vault with these.
message GatewayTokensRequest {
  repeated GatewayToken tokens = 1;
}

message GatewayTokensResponse {
  // Gateways the device state has paired and no token was handed for: each is
  // marked to pair again. Opening is never refused for one.
  repeated string pair_again = 1;
}

// ---------------------------------------------------------------- restore --

// BRING EVERY VAULT BACK FROM 24 WORDS (#1029 §5, #1080).
//
// The whole input, and F2 held structurally: there is no vault id here, no
// key and no path on the lost phone, and no index the shell chose — `indices`
// only ever repeats what an earlier restore answered as `unclaimed`. What this
// core does with it is derive, dial the gateway the pairing payload names,
// ask it which vaults it holds for this identity, and fetch. **A vault this
// phone already holds is never touched**: its file is left as it is, open
// session and all, and it is neither answered nor counted a miss.
message RestoreRequest {
  // 2 WAS `endpoint`, a laptop's iroh endpoint id typed when DNS could not
  // answer; 3 WAS `direct_addrs`, its dialling hints (#1029 §5). The pairing
  // payload names the gateway and carries its addresses (#1080). The numbers
  // are reserved, not reused.
  reserved 2, 3;
  reserved "endpoint", "direct_addrs";
  // The 24 words, as the member typed them. Parsed by
  // `centraid_identity::phrase::RecoveryPhrase::parse`, which refuses a bad
  // checksum rather than deriving from nonsense.
  string phrase = 1;
  // THE SEED IN PLACE OF THE WORDS (#1047, Q-1047-18, answered 2026-09-29).
  //
  // 64 raw bytes — what `RecoveryPhrase::seed` makes of the 24 words. A phone
  // that received the seed through the platform's synchronised keychain holds
  // no words and cannot type them; the seed is what every key derives from, so
  // it restores exactly what the words would. EXACTLY ONE of `phrase` and
  // `seed` is set: both is refused (two answers to "whose vaults"), and neither
  // is refused as "not your 24 words". Like the phrase, it is never logged,
  // never quoted in an error and never kept by the core past this request.
  optional bytes seed = 4;
  // BRING BACK ONLY THESE VAULTS (#1047 T1, R-1047-R6).
  //
  // Derivation indices, as `UnclaimedVault.index` named them: a vault that
  // stayed with the old phone when a claim failed after another landed, asked
  // for again on its own. Empty is the ordinary restore — every index, scanned
  // upward to the gap limit. Set, the core probes exactly these and no others,
  // skips any this phone already holds, and answers `gap_scanned` 0.
  repeated uint32 indices = 5;
  // THE GATEWAY TO RESTORE FROM (#1080): the pairing payload its `pair` verb
  // printed, exactly as scanned — the same text `PairRequest.payload`
  // carries. Required. The restore reaches the gateway under that payload's
  // certificate pin, reads each vault's head with a read-only grant, fetches
  // and checks the snapshot it names, and claims the vault at the next writer
  // epoch only once the checks passed; then it fetches every derivative, so
  // the grid is whole, and leaves the originals to the rule or a tap
  // (`fetch_original`). The payload's one-use secret is never spent by a
  // restore: a claim needs only the vault's identity key.
  string payload = 6;
  // TAKE THE OLDER BACKUP THE LAST RESTORE OFFERED (#1188, B5). Unset, a vault whose newest
  // backup fails a check is not restored: the answer carries `older_offers` and nothing is
  // claimed. Set, the same restore uses the newest older backup that passes for each such vault.
  // Never set by a shell before the member said yes to the offer.
  bool use_older = 7;
  // GO AHEAD WITHOUT PROOF OF THE NEWEST (#1191, E8). Unset, a restore that cannot prove it holds
  // the newest backup claims nothing and answers `unproven_newest`. Set, the same restore goes
  // ahead with the greatest head it could verify. Never set before the member said yes.
  bool confirm_unproven = 8;
}

// One vault a restore brought back.
message RestoredVault {
  // The vault's identity public key, hex — which IS its id (#1029 §0).
  string vault_id = 1;
  // The derivation index this vault was found at. Reported so the shell can
  // show "2 vaults" honestly and so a support log names which index a failure
  // was at; **never reused** (F2) and never chosen by the shell.
  uint32 index = 2;
  // Where the restored file landed, under the directory the core was opened
  // on.
  string path = 3;
  // 4 WAS `txid`, the txid a restored generation stood at (#1029 §5). A
  // snapshot plane has no txid (#1080). The number is reserved, not reused.
  reserved 4;
  reserved "txid";
  // Rows the snapshot's census promised, summed, and the restored file held.
  // The number that makes "your vault is back" a claim rather than a hope: a
  // perfect page tree over no rows passes `integrity_check` and is a total
  // loss (§2).
  int64 rows = 5;
  // See `PairResponse.safety_number`. **Per vault**, because each vault has its
  // own identity key — one number for all of them would confirm nothing about
  // any of them.
  string safety_number = 6;
  // How many derivatives (thumbnails, previews) the restore brought back, of how many the
  // restored vault names. The vault is kept before they are fetched, so a gateway that stops
  // answering leaves `landed` below `total` and the rest is fetched on demand. Both 0 when
  // the vault names none.
  uint32 derivatives_landed = 7;
  uint32 derivatives_total = 8;
}

message RestoreResponse {
  // 3 WAS `device_secret`, the device key a restore minted (#1029 W15-D3). A
  // gateway admits the restored phone by the bearer token its claim minted,
  // which the restored vault's ledger keeps, so nothing is minted and nothing
  // is handed to a shell to keep (#1080). The number is reserved, not reused.
  reserved 3;
  reserved "device_secret";
  // Every vault the gateway holds for this identity, restored. Empty is a real
  // answer and not a failure: an identity the gateway has never seen has no
  // vaults, and a shell that drew an error would tell a member their words
  // were wrong when they were right.
  repeated RestoredVault vaults = 1;
  // How many derivation indices were tried past the last one that answered.
  // The gap limit, reported, so "we looked" is checkable.
  uint32 gap_scanned = 2;
  // VAULTS THAT CHECKED AND WHOSE WRITER EPOCH WOULD NOT MOVE (#1047 M1).
  //
  // Every vault is fetched, laid down and checked before any claim, so a
  // vault that fails its checks refuses the whole restore and moves nothing.
  // What can still fail is a claim itself, after an earlier vault's claim
  // landed — the gateway dropped, or refused. Refusing the whole restore then
  // would drop the vaults already claimed, and the old phone would be frozen
  // on them with nothing restored anywhere. So the claimed vaults are answered
  // in `vaults`, and each one that was not is named here: its file is
  // removed, its writer is still the old phone, and a second restore takes
  // it. Empty is the ordinary answer. When no claim landed at all the restore
  // is refused instead, with the first claim's refusal. A second restore
  // naming these in `RestoreRequest.indices` asks for them alone (R-1047-R6).
  //
  // ONE EXCEPTION IS NOT AN ABSENCE (#1188, item 7): an entry with `claimed` set is a vault whose
  // claim LANDED and whose keeping on this phone then failed. The old phone is frozen, nothing is
  // forgotten here (the checked file stays), and restoring again, naming it, finishes it.
  repeated UnclaimedVault unclaimed = 4;
  // AN OLDER BACKUP IN PLACE OF A NEWEST THAT WILL NOT OPEN (#1188, B5, NB4). When any vault's
  // newest backup failed a check and an older one passes, the restore claims nothing and
  // restores nothing: `vaults` is empty and each such vault is named here. The member decides;
  // a second restore with `RestoreRequest.use_older` restores them. Empty is the ordinary answer.
  repeated OlderOffer older_offers = 5;
  // THE TOKENS THIS RESTORE'S CLAIMS MINTED, one per vault per gateway it
  // claimed at, for the shell to keep (#1191, E12). A read grant is spent
  // inside the restore and never returned.
  repeated GatewayToken tokens = 6;
  // A RESTORE THAT CANNOT PROVE IT HOLDS THE NEWEST CLAIMS NOTHING (#1191, E8): when the
  // gateways reachable show a backup but fewer than the vault's last known writes say may exist,
  // each such vault is offered here and `vaults` is empty. A second restore with
  // `RestoreRequest.confirm_unproven` goes ahead.
  repeated UnprovenNewest unproven_newest = 7;
}

// The newest backup this restore could read for a vault it cannot prove is the newest.
message UnprovenNewest {
  // The derivation index, as `RestoredVault.index`.
  uint32 index = 1;
  // The vault's identity public key, hex.
  string vault_id = 2;
  // When that backup was taken (ms since the epoch, the backup device's record).
  int64 taken_at_ms = 3;
  // A short label for the backup (its snapshot's name as the member sees it).
  string label = 4;
}

// The newest older backup that passes, for one vault whose newest does not (`RestoreResponse.older_offers`).
message OlderOffer {
  // The derivation index, as `RestoredVault.index`.
  uint32 index = 1;
  // The vault's identity public key, hex, as `RestoredVault.vault_id`.
  string vault_id = 2;
  // When the newest backup, the one that will not open, was taken (ms since the epoch, the
  // backup device's record).
  int64 newest_taken_at_ms = 3;
  // When the older backup that passes was taken.
  int64 offered_taken_at_ms = 4;
  // The backup device it is on, as the pairing code names it.
  string device = 5;
}

// One vault a restore checked and could not claim (`RestoreResponse.unclaimed`).
message UnclaimedVault {
  // The derivation index, as `RestoredVault.index`.
  uint32 index = 1;
  // The vault's identity public key, hex, as `RestoredVault.vault_id`.
  string vault_id = 2;
  // Why the claim did not land, for a support log. Carries no key and no
  // word.
  string reason = 3;
  // True when the claim LANDED on the gateway and keeping the vault on this phone failed: the
  // old phone is already frozen, this phone kept the checked file, and restoring must be
  // finished by restoring again naming this index. False when the claim did not land and the
  // old phone is still the writer.
  bool claimed = 4;
}

// ----------------------------------------------------------------- status --

// WHAT THE SHELL DRAWS ON THE BACKUP SCREEN. Reads local state and the last
// thing the gateway said; it dials nothing of its own.
message BackupStatusRequest {}

message BackupStatusResponse {
  // 1 WAS `acked_txid`, the last txid a gateway acked; 4 WAS `laptop_paired`
  // (#1029 W15). A snapshot plane has no txid, and `destinations` is the
  // pairing — empty is unpaired (#1080). The numbers are reserved, not
  // reused.
  reserved 1, 4;
  reserved "acked_txid", "laptop_paired";
  // WHEN A GATEWAY LAST ACKNOWLEDGED THE VAULT'S HEAD, on the GATEWAY's clock
  // — the only moment a member may be shown as "last backed up". Absent: never.
  optional int64 acked_at_ms = 2;
  // Bytes still to back up: the number a shell draws as "3.2 MB left". The
  // plaintext length of every file the vault knows that some gateway has not
  // acknowledged whole, plus the snapshot parts waiting in the spool. A video
  // the member left out is not counted: it is not to back up (#1144).
  uint64 pending_bytes = 3;
  // EVERY GATEWAY THIS PHONE IS PAIRED WITH (#1080). Like everything here, read
  // from the device's ledger: nothing is dialled to draw a screen.
  repeated Destination destinations = 5;
  // When the newest snapshot a gateway's head names was taken, on this
  // phone's clock: the moment the member's records are backed up as of.
  // Absent: none yet.
  optional int64 last_snapshot_ms = 6;
  // CONTENT HASHES THE VAULT KNOWS, originals and derivatives alike (#1080).
  // A body kept in its own row (a `data:` URI, as a note's is) is the
  // records' and not counted here, nor is a file deleted forever or past its
  // trash window.
  uint64 content_total = 7;
  // Of those, the ones every part of which a gateway acknowledged AND whose
  // row is in the snapshot a gateway's head names: bytes no snapshot names
  // would restore as nothing (#1080, the edge sweep).
  uint64 content_confirmed = 8;
  // Sealed bytes in the spool right now, waiting to move.
  uint64 spool_bytes = 9;
  // WHAT WAITS, AND WHY: one row per reason, with a count. Empty is nothing
  // waiting.
  repeated Waiting waiting = 10;
  // A GATEWAY ANSWERED `VAULT_MOVED`: another phone holds this vault's writer
  // epoch, and this one is read-only for it (#1029 F1). Nothing is wiped.
  bool frozen = 11;
  // WHAT EACH APP'S BACKUP HOLDS (#1144), one row per app in the product's
  // order. Empty on a core holding no vault, or no keys to name its files by.
  repeated AppHolding apps = 12;
  // THE BACKUP IN BYTES: every app's size, the vault file and every file it
  // knows, less the videos the member left out; and of that, what a gateway
  // acknowledged. The apps' rows add up to these.
  uint64 total_bytes = 13;
  uint64 confirmed_bytes = 14;
  // THE VIDEOS THE MEMBER LEFT OUT ("Include videos" off, as the last pass was
  // told it): how many originals, and their bytes. Not in `total_bytes`.
  uint64 left_out_items = 15;
  uint64 left_out_bytes = 16;
  // HOW OLD THE BACKLOG IS: when the oldest item still waiting began to wait (ms since the
  // epoch, this phone's clock). Waiting means some paired gateway has not confirmed it; videos
  // left out are not waiting. It is the time the item's row was WRITTEN INTO THE VAULT on this
  // phone (the entity's `created_at`, or a derivative's), never a photograph's capture time or a
  // followed store's date. And it is CLAMPED to no earlier than when the earliest paired
  // gateway was paired: a wait cannot start before there was a gateway to wait for, so a
  // member who pairs today with a year of data is not told items waited a year. Absent: nothing
  // waits, or no waiting item says when it was written. The screen subtracts it from now.
  optional int64 oldest_waiting_ms = 17;
}

// ONE APP'S PART OF THE BACKUP (#1144). Counts come from the app's own
// tables; a size is the app's own files (a photograph's or a document's
// original and its derivatives) plus its share of the vault file and of the
// files no one app owns, shared by record rows.
message AppHolding {
  // The app's id, as the catalogue names it: `photos`, `notes`.
  string app_id = 1;
  // What the app holds, in its own unit: photographs and videos, documents,
  // notes, transactions, people, events and tasks, Locker items; for Health,
  // the days with a reading.
  uint64 items = 2;
  // Health's workouts; zero for every other app.
  uint64 workouts = 3;
  // Of `items`, the ones a gateway acknowledged with their row (Photos and
  // Docs only; a records-only app's rows travel whole in each snapshot).
  uint64 items_confirmed = 4;
  uint64 bytes = 5;
  uint64 bytes_confirmed = 6;
  // Originals no gateway holds yet, the videos left out not among them.
  uint64 waiting = 7;
  // Rows written since the newest snapshot a gateway acknowledged: they wait
  // for the next one. Zero before any snapshot was acknowledged.
  uint64 edits_waiting = 8;
  // The videos left out of this app's backup, and their bytes.
  uint64 left_out_items = 9;
  uint64 left_out_bytes = 10;
}

// One reason things wait, and how many (`BackupStatusResponse.waiting`).
message Waiting {
  WaitReason reason = 1;
  uint64 count = 2;
}

// WHY CONTENT IS NOT BACKED UP YET (#1080). Every arm is a reason a member can
// act on or wait out; none is a failure.
enum WaitReason {
  WAIT_REASON_UNSPECIFIED = 0;
  // An original the transfer rule keeps off a metered link.
  WAIT_REASON_WIFI = 1;
  // Work kept for external power.
  WAIT_REASON_CHARGER = 2;
  // No paired gateway is reachable.
  WAIT_REASON_GATEWAY = 3;
  // An original whose bytes are in iCloud and not on this phone.
  WAIT_REASON_ICLOUD = 4;
  // An original in the operating system's library the shell has not streamed
  // yet (`DrainResponse.need_bytes`).
  WAIT_REASON_BYTES = 5;
  // Nothing but time: the next pass, or the next background window the
  // operating system grants, reaches it.
  WAIT_REASON_WINDOW = 6;
  // An original the MANUAL rule holds until the member taps Back up now
  // (`DrainRequest.asked`); no pass on its own moves it.
  WAIT_REASON_ASK = 7;
  // The last pass stopped because the machine that answered is not the
  // pinned gateway (`DRAIN_STOP_UNTRUSTED`). Not time but the member: the
  // gateway was replaced or something else answers at its address.
  WAIT_REASON_UNTRUSTED = 8;
  // The last pass stopped because the gateway answered and refused a write
  // for want of room: its disk is full (`DRAIN_STOP_REFUSED`; #1080, the sweep's F1).
  // Not time: the machine has to make room. A part over its size limit is TOO_LARGE and any
  // other refusal is REFUSED_OTHER.
  WAIT_REASON_REFUSED = 9;
  // The gateway no longer knows this phone's token — its store was lost, or
  // its operator revoked the token — so nothing reaches it until the member
  // pairs again (`Destination.pair_again`; #1080, the sweep's F2).
  WAIT_REASON_PAIR_AGAIN = 10;
  // This phone has too little free space to copy its vault for a snapshot
  // (#1188, design 6). Not time and not the gateway: the member frees space.
  WAIT_REASON_NO_ROOM = 11;
  // The gateway refused a part as over its size limit (`TOO_LARGE`); the limit is
  // `Destination.refused_limit_bytes`. Not time and not room: this build and that gateway
  // disagree about how big a part may be. (REFUSED, above, is a full disk.)
  WAIT_REASON_TOO_LARGE = 12;
  // The gateway refused a write for a reason that is neither: a code this build does not know.
  // Only that gateway's pass stops; the others are fed.
  WAIT_REASON_REFUSED_OTHER = 13;
}

// ----------------------------------------------------------- destinations --

// ONE GATEWAY THIS PHONE IS PAIRED WITH (#1080).
//
// A gateway is any machine the member controls that runs `centraid-gateway` —
// the laptop at home, a VPS, a NAS — and the pairing record is a list, so a
// phone may hold more than one. Read from the device's ledger; nothing here is
// a key or a token.
message Destination {
  // The gateway's own id, as its `GET /v2/info` answers it.
  string gateway_id = 1;
  // What the member called it when pairing.
  string label = 2;
  // The addresses it was last reached at, `host:port`. Kept so a background
  // upload needs no browse of the LAN; a browse in the foreground refreshes
  // them.
  repeated string addrs = 3;
  // THE CERTIFICATE THIS PHONE PINS, in DER. The gateway minted it at its
  // first `serve`; the pairing payload carried its BLAKE3 fingerprint, and the
  // core kept the DER once the two matched. A shell whose own TLS makes the
  // connection — iOS's background `URLSession` — pins by byte equality with
  // this in its authentication challenge.
  bytes cert_der = 4;
  // When this phone last reached the gateway, and when the gateway last
  // acknowledged a part; 0 is never.
  int64 last_seen_ms = 5;
  int64 last_ack_ms = 6;
  // THIS GATEWAY ANSWERED `UNAUTHORIZED` TO THIS PHONE'S TOKEN (#1080, the
  // sweep's F2): it lost its store but kept its identity, or its operator
  // revoked the token. The ledger's acknowledgements are a cache of what the
  // gateway held, so "backed up" would still read true while every pass is
  // refused; this says it is not. Cleared by pairing again, or by the gateway
  // accepting the token. Set only by `backup_status`; `pins` leaves it false.
  bool pair_again = 7;
  // THE BYTES THIS GATEWAY ACKNOWLEDGED, as this phone recorded them (#1144):
  // every snapshot range and file it holds for this vault, old snapshots'
  // included. Set only by `backup_status`.
  uint64 held_bytes = 8;
  // HOW THIS GATEWAY STANDS AGAINST THE VAULT (#1188, NB1). Every paired
  // gateway is a full replica, fed on its own, so each has its own standing;
  // "backed up" means every one is current and otherwise the line names the one
  // behind. Set only by `backup_status`.
  //
  // Files whose bytes this gateway has not acknowledged whole, or whose row no
  // snapshot its head names covers, and the plaintext bytes of those. A video
  // the member left out is not counted.
  uint64 behind_files = 9;
  uint64 behind_bytes = 10;
  // Its head names no snapshot, or one older than the newest this phone took.
  bool records_behind = 11;
  // When the snapshot its head names was taken, on the vault's clock. Absent:
  // this phone has set no head there.
  optional int64 head_snapshot_ms = 12;
  // Why it is behind, as its last answer says: GATEWAY (silent), UNTRUSTED,
  // REFUSED (its own limit), PAIR_AGAIN. Unspecified: it answered.
  WaitReason reach = 13;
  // ITS HEAD WENT BACKWARDS (#1188, B4): it names an older snapshot than this phone
  // set there, or none. This phone remembers the newest it set at each gateway and
  // flags the gateway until it sets a current head again. Set only by `backup_status`.
  bool rolled_back = 14;
  // When this phone paired with it, on this phone's clock (#1188, NB2): the age a device that
  // never confirmed anything is counted from.
  int64 paired_at_ms = 15;
  // WHAT IT STILL OWES, BY APP (#1188, NB1): the originals this gateway has not acknowledged whole,
  // per app, for the Backup screen's "waiting for <device>" rows. Set only by `backup_status`.
  repeated DeviceWaiting waiting_apps = 16;
  // The size limit a TOO_LARGE refusal crossed, in bytes (the protocol's largest object); 0
  // when `reach` is anything else. Set only by `backup_status`.
  uint64 refused_limit_bytes = 17;
  // HOW THIS GATEWAY STANDS, in one word the Backup screen draws (#1191, B16): the last answer
  // this phone had from it. Set only by `backup_status`.
  DestinationReach reach_state = 18;
  // THE DELETES THE GATEWAY IS HOLDING FOR THIS VAULT (#1191, E6): how many names, when the
  // earliest goes for good (the gateway's clock; 0 when none is held), and how many the member
  // may undo (every hold is signed by the vault key, so all of them). As of the last pass: the
  // status dials nobody.
  uint32 held_count = 19;
  int64 held_purge_at_ms = 20;
  uint32 held_undoable = 21;
  // THE LAST READ-BACK (#1191, E10): parts checked of the parts the head names, 0/0 when none
  // has run in this core's life.
  uint32 sample_checked = 22;
  uint32 sample_of = 23;
  // A KEPT SNAPSHOT'S MANIFEST CANNOT BE READ at this gateway (E9): collection is stopped there.
  bool manifest_unreadable = 24;
}

// How a gateway last answered this phone (`Destination.reach_state`).
enum DestinationReach {
  DESTINATION_REACH_UNSPECIFIED = 0;
  // It answered and took what it was sent.
  DESTINATION_REACH_OK = 1;
  // It did not answer.
  DESTINATION_REACH_UNREACHABLE = 2;
  // Another machine answered in its place.
  DESTINATION_REACH_UNTRUSTED = 3;
  // It does not know this phone's token, or the shell holds none.
  DESTINATION_REACH_PAIR_AGAIN = 4;
  // It answered and refused for its own reason: its disk, a size limit, or another code.
  DESTINATION_REACH_REFUSED = 5;
  // Another phone took the vault over here, proven by a claim the vault key signed.
  DESTINATION_REACH_MOVED = 6;
  // The person at the gateway machine paused the vault.
  DESTINATION_REACH_FROZEN = 7;
  // The gateway runs a protocol older than this phone needs.
  DESTINATION_REACH_GATEWAY_OLD = 8;
  // A read-back found damage here and the snapshot is being sent again.
  DESTINATION_REACH_REPAIRING = 9;
}

// UNDO THE DELETES A GATEWAY IS HOLDING (#1191, E6): lift every hold on this vault at that
// gateway, signed by the vault key. The names come back as they were; retention will not delete
// them again for a week.
message UndoHeldRequest {
  string gateway_id = 1;
}

message UndoHeldResponse {
  // How many holds were lifted.
  uint32 restored = 1;
}

// One app's originals a gateway still owes (`Destination.waiting_apps`).
message DeviceWaiting {
  string app_id = 1;
  uint64 files = 2;
}

// A PAIRED GATEWAY, FOUND AGAIN AT NEW ADDRESSES (#1080, Q-1080-D3).
//
// The shell's foreground browse of `_centraid-gateway._tcp` saw something that
// advertised this gateway's id and hands its addresses here. **The shell's
// match is a hint and the core's is the check**: each candidate is dialled
// with the certificate this phone pinned at pairing and must answer
// `GET /v2/info` with this gateway's own id, so a machine that merely claims
// the id in its advertisement is refused by the certificate, and one that
// answers as another gateway is not recorded. Only addresses that answered
// are kept, first in the list, ahead of the ones already recorded.
message RefreshDestinationRequest {
  // `Destination.gateway_id`.
  string gateway_id = 1;
  // `host:port`, at most eight, each an IP literal (IPv6 in brackets). The
  // core drops anything else without dialling it.
  repeated string candidates = 2;
}

message RefreshDestinationResponse {
  // Whether at least one candidate answered as this gateway and the ledger
  // now lists it. False for no such gateway, no candidate worth dialling, and
  // candidates that did not answer, which is an answer and not a refusal.
  bool refreshed = 1;
  // The addresses the ledger lists for the gateway after this call, empty
  // when it holds no such gateway.
  repeated string addrs = 2;
}

// FORGET ONE GATEWAY (#1080). The destination and every confirmation it gave
// leave the device's ledger. What that gateway stores is left as it is: this
// phone stops writing to it, and the member's disk is the member's to clear.
// First, best-effort, the core asks the gateway to revoke this phone's token
// (`POST /v2/v/{vault}/revoke`, the audit's finding 2), so a forgotten
// gateway stops answering this phone; a gateway that cannot be reached does
// not keep its row, and says so in `revoked`.
message ForgetDestinationRequest {
  // `Destination.gateway_id`.
  string gateway_id = 1;
}

message ForgetDestinationResponse {
  // False when the ledger held no such gateway, which is an answer and not a
  // refusal.
  bool forgotten = 1;
  // True when the gateway answered that this phone's token opens nothing
  // there any more. False when it could not be reached, answered as another
  // machine, or the core holds no vault keys to name the vault with: the row
  // is forgotten all the same, and the token stays live on that gateway until
  // its operator runs `centraid-gateway pairings revoke <token id>`.
  bool revoked = 2;
  // THE KEY THE SHELL DELETES from its device secret store (#1191, E12): the
  // token field is empty. Unset when nothing was forgotten.
  GatewayToken forget_token = 3;
}

// ---------------------------------------------------------------- handoff --

// HAND SEALED PARTS TO THE OPERATING SYSTEM TO UPLOAD (#1080 rulings 2, 7).
//
// The only transfer iOS continues while an app is suspended is a file upload
// handed to a background `URLSession`, and it talks only to a URL. So the core
// seals parts into its spool while the app is alive, and this answers a batch
// of them as ready-made requests — a file, a URL, a method and every header —
// with nothing left for the shell to compute. Each part answered is marked
// handed off in the device's ledger; `settle` records what the operating
// system reported, and `reconcile` asks the gateway about any it never did.
// Android moves its parts in-process, inside `drain`, and never asks.
message HandoffRequest {
  // At most this many sealed bytes in the batch, and at most `max_parts`
  // parts. Both are required: a zero is refused `ERROR_CODE_INVALID_REQUEST`
  // and never read as "no limit", because batches stay modest — the operating
  // system throttles an app whose uploads it cannot finish.
  uint64 max_bytes = 1;
  uint32 max_parts = 2;
}

message HandoffResponse {
  // Empty is nothing to hand off: an empty spool, or no paired gateway.
  repeated HandoffPart parts = 1;
}

// ONE SEALED PART, AS A REQUEST THE OPERATING SYSTEM CAN SEND BY ITSELF.
message HandoffPart {
  // The object's name: 64 lowercase hex characters keyed by the vault's backup
  // key, so a gateway can neither read the part nor recognise it.
  string name = 1;
  // The sealed file in the spool, inside the app's own container. The shell
  // hands it to the upload as it is and never opens it.
  string path = 2;
  // The object's URL on the gateway this part is for:
  // `https://<addr>/v2/v/<vault>/o/<name>`.
  string url = 3;
  // The HTTP method: `PUT`.
  string method = 4;
  // Every header the request carries — the bearer token, `Content-Length` and
  // `Content-Digest` among them. The shell adds none of its own.
  repeated Header headers = 5;
  // The sealed file's length in bytes.
  uint64 size = 6;
  // `Destination.gateway_id` of the gateway `url` names; `Settled` repeats it.
  string gateway_id = 7;
  // The vault this part belongs to, hex: whose core `settle` goes to. A shell
  // that lost the handoff (the operating system relaunched it to finish an
  // upload) reads it back off `url`'s path.
  string vault_id = 8;
  // WHETHER THE OPERATING SYSTEM MAY MOVE THIS PART OVER A METERED LINK
  // (#1080, the root's ruling A10), so the member's rule holds for uploads
  // that run while the app is suspended: thumbnails and previews always, a
  // video's original never, a photograph's original under
  // `TRANSFER_RULE_WIFI_AND_CELLULAR_PHOTOS`, and everything else — the
  // vault's own snapshot among it — exactly when the rule lets photographs
  // cross cellular. The rule is the one the last `drain` carried.
  bool allows_cellular = 9;
}

// One HTTP header.
message Header {
  string name = 1;
  string value = 2;
}

// ----------------------------------------------------------------- settle --

// WHAT THE OPERATING SYSTEM REPORTED FOR PARTS IT MOVED (#1080 ruling 7).
//
// The shell's transfer delegate hears one completion per upload and passes
// each, as it heard it, to the core of the vault the part belongs to. A 201 or
// a 200 is the gateway's acknowledgement: the core records it in the ledger
// and deletes the spool file. Anything else puts the part back in the queue
// for a later pass. A name the ledger does not hold is ignored and not
// counted.
message SettleRequest {
  repeated Settled settled = 1;
}

// One upload's completion, as the operating system reported it.
message Settled {
  // `HandoffPart.name`.
  string name = 1;
  // The HTTP status the upload received; 0 when it ended with no answer.
  uint32 http_status = 2;
  // The operating system's own error, for a log; empty when there was none.
  // Never shown to a member as it is.
  string error = 3;
  // `HandoffPart.gateway_id`.
  string gateway_id = 4;
  // `HandoffPart.vault_id`.
  string vault_id = 5;
}

message SettleResponse {
  // Parts recorded as acknowledged.
  uint32 confirmed = 1;
  // Parts put back in the queue.
  uint32 requeued = 2;
}

// -------------------------------------------------------------- reconcile --

// SQUARE THE LEDGER WITH WHAT THE GATEWAY HOLDS (#1080 ruling 7).
//
// The device's ledger is a cache of the gateway's truth, so it is checked
// rather than trusted: every name not yet confirmed is asked of the gateway
// with `exists`, a name it holds is confirmed, and a part handed to the
// operating system that never arrived goes back in the queue. A shell calls it
// before handing a batch to the operating system; `reachable` false means
// nothing should be handed off now.
message ReconcileRequest {}

message ReconcileResponse {
  // Names the gateway held that the ledger had not confirmed.
  uint32 confirmed = 1;
  // Parts put back in the queue.
  uint32 requeued = 2;
  // Whether a paired gateway answered at all.
  bool reachable = 3;
}

// ------------------------------------------------------------------- pins --

// THE CERTIFICATES A SHELL'S OWN TLS PINS (#1080 ruling 1).
//
// A gateway's certificate is self-signed, with no certificate authority behind
// it, so every connection pins it. The core pins its own; a shell that opens
// its own — iOS's background `URLSession` — pins each paired gateway's DER by
// byte equality in its authentication challenge. Read from the ledger; nothing
// is dialled.
message PinsRequest {}

message PinsResponse {
  repeated Destination destinations = 1;
}

// --------------------------------------------------------- fetch original --

// BRING ONE ORIGINAL BACK FROM A GATEWAY (#1080).
//
// Only the hash is asked for: every part's name is computed from it and the
// vault's backup key. The parts are opened and the whole is checked against
// the hash before it lands in the app's own store, and a screen refreshes
// through the ordinary `RowsChanged`.
message FetchOriginalRequest {
  // 32 raw bytes: the BLAKE3 of the whole plaintext, which is
  // `StageHandle.content_hash` decoded from hex.
  bytes content_hash = 1;
}

enum FetchOutcome {
  FETCH_OUTCOME_UNSPECIFIED = 0;
  // Fetched, checked against its hash, and stored; `path` names the file.
  FETCH_OUTCOME_LANDED = 1;
  // This phone already holds it, and nothing was fetched.
  FETCH_OUTCOME_ALREADY_HELD = 2;
  // No paired gateway answered. Nothing changed.
  FETCH_OUTCOME_UNREACHABLE = 3;
  // A gateway answered and does not hold it whole: it has not been backed up.
  FETCH_OUTCOME_NOT_IN_BACKUP = 4;
  // The machine that answered is not the pinned gateway. Nothing was taken
  // from it (#1080, the audit's finding 5).
  FETCH_OUTCOME_UNTRUSTED = 5;
  // The copy on the gateway did not open: its bytes do not hash to their
  // digest, a part does not open under this vault's key, or the parts are not
  // the file their names derive from. Nothing landed.
  FETCH_OUTCOME_DAMAGED = 6;
}

message FetchOriginalResponse {
  FetchOutcome outcome = 1;
  // The file in the app's own store when there is one; empty otherwise. An
  // original already held in the operating system's library is the shell's to
  // open.
  string path = 2;
}

// ----------------------------------------------------------- free up space --

// THE ORIGINALS A MEMBER MAY DELETE FROM THE OPERATING SYSTEM'S LIBRARY
// (#1080, the root's rulings A19 and A20).
//
// An original the library holds is backed up from there and never copied into
// the app (#1080 ruling 6). Once every part of it is acknowledged by a gateway,
// the library's copy is no longer the only one, and a member short of space may
// delete it. This answers which: originals whose bytes live only in the
// library, every part of which some gateway acknowledged, not in an album the
// member keeps on this phone, and never one the member edited in the library
// (the backup holds the rendition, not the camera original) — oldest first. A
// library item is offered whole or not at all: a Live Photo is two content
// hashes under one identifier, and both must be safe. **The core never deletes
// from the library.** The shell does, behind the operating system's own
// confirmation, and reports what went through `released`.
message ReleasableRequest {
  // At most this many items. Required: a zero is refused
  // `ERROR_CODE_INVALID_REQUEST`, never read as "no limit".
  uint64 limit = 1;
}

message ReleasableResponse {
  // Oldest first, a whole library item at a time.
  repeated Releasable items = 1;
  // The bytes every releasable item adds up to, `items` or not: the "Free up
  // N GB" a shell draws.
  uint64 total_bytes = 2;
}

// One original the library holds and a gateway holds too.
message Releasable {
  // 32 raw bytes: the BLAKE3 of the whole plaintext.
  bytes content_hash = 1;
  // The library's identifier, which the shell deletes by.
  string os_ref = 2;
  uint64 size = 3;
  // What the vault reads the bytes as, so a shell can pick the library's
  // collection to delete from.
  string media_type = 4;
}

// WHICH VAULT ASSET A LIBRARY ITEM WAS BACKED UP AS (#1127, A20).
//
// An item the member edited in place (Android overwrites the file and keeps its
// `_ID`) has bytes the vault has not seen under a ref the vault already holds:
// the camera's version is gone from the phone, so the only way to say "this is
// an edit of that photograph" is to ask the ledger which asset the ref was last
// backed up as. The shell asks BEFORE staging the new bytes, then names the
// answer as the edit's `source_asset_id` when the new hash differs from
// `content_hash` here (the same hash is no edit at all).
//
// The ledger keeps, per ref, the item most recently staged (`verified_ms`); a
// ref staged under two hashes answers the newer. Only a LIVE asset answers: a
// ref whose bytes the vault no longer holds, or whose asset is in the trash,
// is absent from `items`, and the shell then files the edit as a photograph of
// its own. It reads this phone's own ledger and this core's own vault, so it
// can name no other vault's asset. At most 100 refs; more is
// `ERROR_CODE_INVALID_REQUEST`. Not a command: it writes nothing.
message LibraryAssetsRequest {
  // `Releasable.os_ref`'s spelling: what the shell staged the item under.
  repeated string os_ref = 1;
}

message LibraryAssetsResponse {
  // One per ref that names a live asset, in no particular order.
  repeated LibraryAsset items = 1;
}

message LibraryAsset {
  string os_ref = 1;
  string asset_id = 2;
  // 32 raw bytes: the BLAKE3 of the bytes that asset wraps.
  bytes content_hash = 3;
}

// THE LIBRARY ITEMS THE MEMBER DELETED, after the operating system's own
// confirmation. The core records that their bytes are no longer on this phone
// and announces the ordinary `RowsChanged`, so a grid draws them as fetchable.
message ReleasedRequest {
  // 32 raw bytes each, as `Releasable.content_hash`.
  repeated bytes content_hash = 1;
}

message ReleasedResponse {
  // How many of those this phone had recorded in the library, and now does
  // not. A hash it never recorded is not counted.
  uint32 recorded = 1;
}

// ----------------------------------------------------------------- phrase --

// THE 24 WORDS, MINTED, JUDGED AND TURNED INTO A SEED — IN RUST (#1047 E1).
//
// BIP39 lives in `centraid_identity::phrase` and nowhere else: the shell has
// no word list, no checksum and no PBKDF2, and a second implementation in
// Kotlin would be a second opinion about which words are a member's vaults.
// So the three things a words screen needs are one request kind. `mint` is 24
// words from the operating system's CSPRNG, for the make-vault screen to show
// ONCE. `check` judges each cell against the list, with suggestions, and gives
// the whole phrase's verdict (count, unknown word, checksum) for the entry
// grid. `seed` is the 64-byte seed the words derive, for the shell's
// synchronised secure store (`CONTRACT.md` §4b), where every later open reads
// it.
//
// **It needs no vault**, like `restore`: a phone making its first vault, or
// restoring onto a fresh install, has none. It is bounded, and it is not a
// command, so it writes no action key — the words and the seed reach no row, no
// log line and no error detail. A refused `seed` names the count or "not a
// valid phrase", never a word.
message PhraseRequest {
  oneof op {
    PhraseMint mint = 1;
    PhraseCheck check = 2;
    PhraseSeed seed = 3;
  }
}

message PhraseMint {}

// The cells as typed, in order. Each is trimmed and lowercased here, because
// a keyboard's capital or a trailing space is not a wrong word.
message PhraseCheck {
  repeated string words = 1;
}

message PhraseSeed {
  repeated string words = 1;
}

message PhraseResponse {
  oneof answer {
    PhraseMinted minted = 1;
    PhraseChecked checked = 2;
    PhraseSeeded seeded = 3;
  }
}

// 24 lowercase English words, in order. Shown once and held by the shell only
// until the seed they derive is stored.
message PhraseMinted {
  repeated string words = 1;
}

message PhraseChecked {
  // One per cell sent, in order.
  repeated PhraseWord words = 1;
  Verdict verdict = 2;
  // The 1-based position of the first cell that is not a list word, or 0.
  uint32 first_unknown = 3;

  enum Verdict {
    VERDICT_UNSPECIFIED = 0;
    // Fewer than 24 filled cells.
    VERDICT_INCOMPLETE = 1;
    // A filled cell is not on BIP39's English list; `first_unknown` names it.
    VERDICT_UNKNOWN_WORD = 2;
    // Every word is on the list and the checksum does not close: a word is
    // in the wrong place, or is the wrong list word.
    VERDICT_BAD_CHECKSUM = 3;
    // A phrase `seed` will accept.
    VERDICT_VALID = 4;
    // More than 24 filled cells.
    VERDICT_TOO_MANY = 5;
  }
}

message PhraseWord {
  // 1-based.
  uint32 position = 1;
  // The cell is empty.
  bool empty = 2;
  // The cell is a word on the list.
  bool known = 3;
  // Up to four list words beginning with what the cell holds, when it is
  // filled and not yet a list word. Empty otherwise.
  repeated string suggestions = 4;
}

// The 64-byte BIP39 seed, no passphrase (`phrase.rs`'s header). The shell
// stores it in the synchronised secure store and drops it.
message PhraseSeeded {
  bytes seed = 1;
}

// CHECK MY BACKUP (#1188, B6). For each backup device the phone can reach: restore the records
// into a scratch copy and run every restore check, confirm by name that the device holds every
// file the records refer to, read back and open a sample of those files. It never touches the
// vault; it obeys the member's transfer rule and a stated scratch-space budget. A sampled file
// that fails is marked unconfirmed, so the next pass sends it again.
message CheckBackupRequest {
  // One device, or every paired one when empty.
  string gateway_id = 1;
  // The member's rule, as a drain states it (zero is `WIFI_ONLY`); and whether the link is metered.
  TransferRule rule = 2;
  bool metered = 3;
  // The member left videos out: their files are not expected to be held.
  bool exclude_videos = 4;
  // Do not check: answer how far a running check has got (`CheckBackupResponse.progress`).
  bool progress_only = 5;
  // Stop the check that is running: the device in hand is "not checked" and so are the rest.
  bool stop = 6;
}

message CheckBackupResponse {
  repeated DeviceCheck devices = 1;
  CheckProgress progress = 2;
}

// How far the check this core is running has got; `running` is false when none is.
message CheckProgress {
  bool running = 1;
  string gateway_id = 2;
  string label = 3;
  // Parts opened and parts to open for the device in hand.
  uint64 done = 4;
  uint64 total = 5;
}

message DeviceCheck {
  string gateway_id = 1;
  string label = 2;
  Verdict verdict = 3;
  // The snapshot that was opened (or that would not), vault clock; zero when not known.
  int64 snapshot_ms = 4;
  // Files the records refer to that the device holds, and the sample that was opened.
  uint64 files_held = 5;
  uint64 files_opened = 6;
  uint64 files_missing = 7;
  uint64 files_damaged = 8;
  NotRun not_run = 9;
  // When the newest backup would not open and an older one did: that older one, vault clock.
  int64 older_snapshot_ms = 10;

  enum Verdict {
    VERDICT_UNSPECIFIED = 0;
    VERDICT_OPENS = 1;
    VERDICT_WONT_OPEN = 2;
    VERDICT_MISSING_FILES = 3;
    VERDICT_DAMAGED_FILE = 4;
    VERDICT_NOT_RUN = 5;
  }
  enum NotRun {
    NOT_RUN_UNSPECIFIED = 0;
    NOT_RUN_DID_NOT_ANSWER = 1;
    NOT_RUN_WAITING_FOR_WIFI = 2;
    NOT_RUN_NEEDS_SPACE = 3;
    NOT_RUN_STOPPED = 4;
    // Paired and never backed up: there is nothing to open yet.
    NOT_RUN_NO_BACKUP_YET = 5;
    // A backup pass is running: files in flight would read as missing.
    NOT_RUN_BACKUP_RUNNING = 6;
  }
}
