// AGENDA'S FIVE QUERIES, AS THE CORE ANSWERS THEM (#1046, #1029).
//
// `crates/apps/agenda` runs `upcoming`, `day-context`, `parties` and `search`
// over the vault — six-plus tables joined and every repeating series expanded by
// the one recurrence engine (D-1020-S1) — and these are its answers, typed. A
// shell reaches them through `app_query.proto`'s `AppQueryRequest`, and draws
// them; it expands nothing and joins nothing, because a second recurrence engine
// in Kotlin or Swift is the drift D-1020-S1/S3 rule out.
//
// TYPED, NOT JSON. `commonMain` has no JSON dependency and Wire and
// SwiftProtobuf already decode everything else the core says, so the answers
// are messages. Every message here mirrors one Rust struct in
// `crates/apps/agenda/src/queries.rs`, field for field; `crates/core`'s
// `app_query` module is the one conversion, and a field that moved moves there.
//
// Instants are the vault's own text form, `YYYY-MM-DDTHH:MM:SS.mmmZ`, and days
// are `YYYY-MM-DD`. A shell formats them for a member; it never does arithmetic
// on them that the core could have done.
//
// CIVIL TIME IS ANSWERED IN THE DEVICE'S ZONE. `commonMain` has no calendar,
// zone or date-time library by design (`sync/Instants.kt`), and a screen still
// groups by the member's local day, draws a now line and prints "08:15". So a
// request states `tz`, and the answer carries the local readings — every
// occurrence's `local_start`, `local_end` and `local_days`, and the answer's
// `today` and `now_local` — computed by `crates/apps/agenda`'s `local` module
// against the bundled zone database. A shell reads those strings and does no
// zone arithmetic; the only civil arithmetic left to it is a weekday from a
// `YYYY-MM-DD`, which is pure.
//
// THE ZONE RULE, for every request that carries `tz`: an IANA name (the
// device's own, e.g. `America/New_York`). EMPTY is the vault's zone —
// the vault's `zone` — and a vault that names none either
// is REFUSED, `ERROR_CODE_INVALID_REQUEST`, as is a name the bundled database
// does not know. Never UTC by default: 00:00Z is somebody else's midnight.

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/container.proto";

// ---------------------------------------------------------------------------
// The requests.
// ---------------------------------------------------------------------------

// `agenda.upcoming`: the events in a range, every repeating series expanded
// into one row per occurrence.
message AgendaUpcomingRequest {
  // The range's start, an instant. EMPTY IS "TODAY": the first instant of the
  // vault clock's day in `tz` — the loader's own default, not a shell's guess.
  string from = 1;
  // The range's end, an instant, exclusive. EMPTY IS OPEN-ENDED, and an
  // open-ended range still expands a series only 120 days past `from`, so a
  // daily series cannot answer a year (#404).
  string to = 2;
  // The zone every local reading is in (the file header's rule). An empty
  // `from` is the first instant of TODAY IN THIS ZONE, and a floating or
  // all-day row is read in it when the lower bound asks whether it has ended.
  string tz = 3;
}

// `agenda.day-context`: the birthdays a calendar grid decorates its days with.
message AgendaDayContextRequest {
  // The first day, `YYYY-MM-DD` (an instant is read for its day). Empty, or a
  // day that does not parse, is TODAY — an unusable range is not an error and
  // the default window stands.
  string from = 1;
  // The last day, inclusive. Empty, or earlier than `from`, is 45 days after
  // `from`; later than 400 days after it is clamped to 400.
  string to = 2;
  // The zone (the file header's rule). It decides which day TODAY is — for an
  // empty `from`, and for the answer's `today` — and nothing else: a birthday
  // is a civil day already.
  string tz = 3;
}

// `agenda.parties`: the people an event can invite.
message AgendaPartiesRequest {}

// `agenda.search`: events matching a term, in the index's rank order.
message AgendaSearchRequest {
  // Owner-typed words. FTS operators in it stay literals; a term with no
  // searchable word answers no events and no denial.
  string term = 1;
  // How many hits. REQUIRED: a zero is refused as `ERROR_CODE_INVALID_REQUEST`
  // rather than defaulted, because a default is how an unbounded read gets
  // written by accident. Clamped to 100, the query's own ceiling.
  uint32 limit = 2;
  // The zone each hit's local readings are in (the file header's rule).
  string tz = 3;
}

// `agenda.event`: ONE event, or one occurrence of one, by id — what a detail
// screen reads instead of a padded `upcoming` window (#1029).
message AgendaEventRequest {
  // The SERIES' id, as every row carries it.
  string event_id = 1;
  // The list's key, `<event_id>:<wall clock>` for an occurrence. Read only
  // when `original_start_local` is empty; the event id alone is the series.
  string instance_key = 2;
  // The occurrence's series-local wall clock, as `AgendaEvent` carries it.
  // EMPTY (and no occurrence in `instance_key`) is the series row itself.
  string original_start_local = 3;
  // The zone the local readings are in (the file header's rule).
  string tz = 4;
}

// ---------------------------------------------------------------------------
// The rows.
// ---------------------------------------------------------------------------

// One event — or ONE OCCURRENCE of a repeating one, which is the same row with
// its own `dtstart` and `instance_key`. `event_id` is always the SERIES' id, so
// reschedule, cancel, RSVP and attach all still target the series.
message AgendaEvent {
  // `ical_uid`, `organizer_party_id` and `sequence`: the model keeps none of them
  // (an event has no iCalendar identity, organizer or revision count).
  reserved 2, 14, 15;
  reserved "ical_uid", "organizer_party_id", "sequence";
  string event_id = 1;
  optional string summary = 3;
  optional string description = 4;
  // This occurrence's start: the series' anchor moved to the occurrence.
  string dtstart = 5;
  optional string dtend = 6;
  optional string start_tz = 7;
  optional string end_tz = 8;
  // `zoned`, `floating` or `all-day`. `all-day` is a day and not a time, so a
  // surface draws no clock time for it (#1046, a v0 defect not carried).
  optional string recurrence_semantics = 9;
  // THE RULE, FOR AN EDITOR AND NEVER FOR A MEMBER. An editor reads it to show
  // which repeat preset is set; what a member reads is `recurrence_summary`,
  // and a raw RRULE on a screen is the defect that field exists to prevent
  // (#834).
  optional string rrule = 10;
  // `supported` or `unsupported`. An unsupported rule — only an import can
  // store one; a command refuses it — expands to nothing and the anchor stays
  // visible (D-1020-S1).
  optional string rrule_support = 11;
  // `tentative`, `confirmed` or `cancelled`. `upcoming` never answers a
  // cancelled event; `search` drops one after the hit.
  optional string status = 12;
  optional string location_place_id = 13;
  optional string created_at = 16;
  optional string updated_at = 17;
  // The calendar edge: which calendar, the joining link, the reminders.
  optional string calendar_id = 18;
  optional string conferencing_uri = 19;
  // The reminders, in the order they were set. Stored as JSON in the vault;
  // decoded HERE, once, because a shell has no JSON to decode it with.
  repeated AgendaReminder reminders = 20;
  repeated AgendaAttachment attachments = 21;
  // THE OWNER FIRST, so RSVP controls lead (#337); then by name.
  repeated AgendaAttendee attendees = 22;
  // The ONE member-facing recurrence sentence, resolved by the core. Absent
  // on an event that does not repeat.
  optional string recurrence_summary = 23;
  // True on an occurrence the expansion moved off the series' own start, and
  // FALSE on the occurrence AT it — the anchor. So this is not "does this
  // repeat": `recurrence_summary` present is.
  bool is_recurrence_instance = 24;
  // THE LIST'S KEY, NEVER THE ROW'S IDENTITY: the event id for a one-off, and
  // `<event_id>:<wall clock>` for every occurrence of a series, the anchor
  // included.
  string instance_key = 25;
  // The occurrence's own identity — the series-local wall clock, never the
  // resolved instant (#996 R21). What an occurrence edit is keyed on.
  optional string original_start_local = 26;
  // This occurrence's wall clock happens twice that day (a DST fall-back).
  optional bool recurrence_overlap = 27;
  // `search` only: the index's highlight of the match, `⟦`/`⟧` around the
  // matched words.
  optional string snippet = 28;

  // --- Where it falls, in the request's `tz` (#1046). ---
  // Computed by the core, so a view draws strings. EMPTY, all three, only on a
  // row whose stored start does not parse — which no command writes.
  //
  // The start: `YYYY-MM-DDTHH:MM` on the request zone's wall clock — for a
  // `zoned` row its instant read there, for a `floating` row its own wall
  // clock (the same in every zone). For an ALL-DAY row, the civil date
  // `YYYY-MM-DD` and never a time.
  string local_start = 29;
  // The end, in the same spelling. EMPTY when the row states no `dtend`: an
  // instant with no length, drawn as its start alone. For an ALL-DAY row it
  // is the LAST DAY, INCLUSIVE — the vault stores a one-day event with
  // `dtend = dtstart`, as v0 did — never the day after.
  string local_end = 30;
  // Every civil day, `YYYY-MM-DD`, in order, the occurrence occupies in the
  // request zone: what a Day list groups it under. A timed run's end is
  // EXCLUSIVE — one ending exactly at local midnight does not occupy the next
  // day, and one with no length occupies its own; an all-day run's end is
  // inclusive. A day in the middle of a multi-day run is listed, so a
  // Friday-to-Sunday event is on Saturday too.
  repeated string local_days = 31;
  // `recurrence_semantics` is `all-day`: a day and not a time, so a surface
  // draws no clock time for it. The one test a view makes, answered here.
  bool all_day = 32;
  // The `place` entity's name of `location_place_id`, so a detail can say where.
  // Absent when the event names no place, or the place is gone.
  optional string location_name = 33;

  // --- `search` only: where a repeating hit opens (#1047). ---
  // A search hit is the SERIES, and its own start is the series' anchor —
  // perhaps years back. These name the occurrence a member means: the first
  // one still running at or after the vault clock, within a year, with the
  // series' exceptions applied (a skipped one is passed over, a moved one is
  // where it moved to); else the last one before it. `agenda_event` opens it
  // by `next_instance_key` (or `event_id` + `next_original_start_local`), and
  // an edit of "this one" is keyed on `next_original_start_local`. ALL THREE
  // EMPTY on a one-off, on every non-search row, and on a series with no
  // occurrence in that reach.
  string next_instance_key = 34;
  string next_original_start_local = 35;
  // That occurrence's start in the request's `tz`, spelled as `local_start`.
  string next_local_start = 36;
}

// One reminder: how long before the start it fires.
message AgendaReminder {
  int64 minutes_before = 1;
}

// One attachment on an event, joined to its bytes.
message AgendaAttachment {
  // `role` and `is_primary`: an attachment is an `attached` edge and keeps
  // neither. `attachment_id` is the attached document's or photo's id.
  reserved 3, 4;
  reserved "role", "is_primary";
  string attachment_id = 1;
  string content_id = 2;
  // The ATTACHMENT's own reading of the bytes (#996 R20(b)); bytes carry no
  // media type of their own.
  string media_type = 5;
  // Where v0's handler route served the bytes. A phone resolves bytes through
  // `ContentUrlRequest` by `content_id`, never through this.
  string content_uri = 6;
  int64 byte_size = 7;
}

// One guest, and their reply.
message AgendaAttendee {
  // `attendee_id` and `role`: a guest is an `attendee` edge to a person, which
  // has neither.
  reserved 1, 5;
  reserved "attendee_id", "role";
  string party_id = 2;
  // `Guest` when the party has no display name.
  string name = 3;
  // `needs-action`, `accepted`, `declined` or `tentative`.
  string partstat = 4;
  // This guest IS the vault's owner — the vault's `self_id`, never a
  // guess — so the RSVP controls are theirs.
  bool is_you = 6;
}

// A calendar, as the picker draws it.
message AgendaCalendar {
  // `owner_party_id`, `default_tz` and `visibility`: a calendar is a container
  // with a name and a color.
  reserved 2, 5, 6;
  reserved "owner_party_id", "default_tz", "visibility";
  string calendar_id = 1;
  optional string name = 3;
  optional string color = 4;
}

// One birthday inside the range.
message AgendaBirthday {
  string party_id = 1;
  string name = 2;
  int32 month = 3;
  int32 day = 4;
  AgendaBirthdayTier tier = 5;
}

// How close a birthday's person is. There is NO relationship-tier column: the
// tier is derived, and the derivation is named here rather than implied.
enum AgendaBirthdayTier {
  AGENDA_BIRTHDAY_TIER_UNSPECIFIED = 0;
  // The person is STARRED (the flags scheme's `starred` concept).
  AGENDA_BIRTHDAY_TIER_INNER = 1;
  // Everyone else — including every person in a vault with no flags scheme,
  // which is an honest "nobody is starred" and never a refusal.
  AGENDA_BIRTHDAY_TIER_OUTER = 2;
}

// One person the create-event picker can invite.
message AgendaParty {
  string party_id = 1;
  string name = 2;
  bool is_you = 3;
}

// ---------------------------------------------------------------------------
// The answers.
// ---------------------------------------------------------------------------

message AgendaUpcoming {
  // In start order, and EVERY ONE IN RANGE: a row is answered only if it is
  // still running at `from` — it ends after it — or starts at or after it. So
  // a multi-day event, or occurrence, that began before the range and is
  // still going is in it; one that was over before the range opened is not.
  // (A series is expanded from 31 days before `from` to find the running
  // ones; v0 answered the rest of that month too, and the port does not —
  // #1046, `tests/parity.rs`'s `ENDED_BEFORE_FROM_PER_CASE`.)
  repeated AgendaEvent events = 1;
  // Every calendar the member has, whether or not an event in range is on it.
  repeated AgendaCalendar calendars = 2;
  // TODAY, `YYYY-MM-DD`: the vault clock's instant read in the request's `tz`.
  // A screen marks today and places the now line from this and `now_local`,
  // never from a device clock read in `commonMain`.
  string today = 3;
  // NOW, `YYYY-MM-DDTHH:MM`, on the request zone's wall clock — where the now
  // line is drawn against the rows' `local_start`/`local_end`.
  string now_local = 4;
}

message AgendaDayContext {
  // By month, then day, then name.
  repeated AgendaBirthday birthdays = 1;
  // The per-day list of open tasks due, which only the retired due shelf read:
  // a dated task is a row in its day, read from `tasks.board` (R-1128-2), so
  // the grid's decorations read no task (#1128).
  reserved 2;
  reserved "due";
  // No holiday source exists in the vault: EMPTY BY CONSTRUCTION, and the field
  // holds the shape open rather than a shell inventing one.
  repeated string holidays = 3;
  // TODAY and NOW in the request's `tz`, as `AgendaUpcoming` carries them, so a
  // grid decorated from this answer alone still knows which day is today.
  string today = 4;
  string now_local = 5;
}

message AgendaParties {
  // The owner first and flagged, then by name. People only: an invitation is a
  // commitment asked of a person, so agents, orgs and groups are left out.
  repeated AgendaParty parties = 1;
  // The owner's own party id. Absent on a vault that names no owner.
  optional string me = 2;
}

message AgendaEventDetail {
  // TODAY and NOW in the request's `tz`, as `AgendaUpcoming` carries them.
  string today = 1;
  string now_local = 2;
  // ABSENT WHEN NOTHING LIVE ANSWERS: no such id, a trashed event, a key that
  // is not an occurrence of the series, or a SKIPPED occurrence. A state the
  // detail draws, not an error. A cancelled event is answered.
  optional AgendaEvent event = 3;
  // THE EVENT'S CALENDAR ROW — its name and stored color, from which the
  // shared calendar hue is derived — so the detail reads no `upcoming` to
  // name it. ABSENT when there is no event, the event names no calendar, or
  // the calendar is gone.
  optional AgendaCalendar calendar = 4;
}

message AgendaSearch {
  // In the index's RANK ORDER, best match first. A hit is the series and never
  // an occurrence: its `instance_key` is its `event_id`.
  repeated AgendaEvent events = 1;
  // THE WORDS THE ROWS ANSWER. Set only when the term as typed found fewer than
  // three rows and a correction of its words added some: the typed words with each
  // mistyped one replaced by a word the vault's own index holds. The rows
  // above are the exact rows first and then the ones the corrected words
  // found, none twice. EMPTY when nothing was added. A shell says
  // "Including results for <corrected>".
  string corrected = 2;
  // THE TASKS THE TERM FINDS, in the index's rank order (#1128: Tasks are Agenda's). `agenda.search`
  // answers events and tasks in one message; unset when the term found no task.
  optional AgendaTaskSearch tasks = 3;
}

// ===========================================================================
// THE TASKS ARE AGENDA'S (#1128): the board (a bounded window of open work plus
// the logbook, families nested and the promotion rule applied), one task, the
// projects, search, catch-up and the trash. `crates/apps/agenda` runs them
// (`task/queries.rs`) and these are its answers, typed; a shell nests no family,
// collapses no missed period and groups no place, because each of those in
// Kotlin or Swift is a second copy of a rule v0 already drifted on.
//
// A `due_at` is EITHER a civil date (the same day in every zone) or an instant.
// Civil time is answered in the device's zone, under the zone rule at the top of
// this file: every task carries its due's local day and time, whether it is
// overdue or lands today, and when its reminder fires; every answer carries
// `today` and `now_local`.
//
// NO SHARING. v1 has no sharing (#1029's scope amendment): no assignee from
// another vault and no share scope is answered, because none exists.
// ===========================================================================

// ---------------------------------------------------------------------------
// The requests.
// ---------------------------------------------------------------------------

// Which place a board answer's `groups` are for. The rows are the same board
// read whichever is asked; the place decides only how they are grouped.
enum AgendaTaskView {
  // No groups: the answer carries the counts and the chrome only.
  AGENDA_TASK_VIEW_UNSPECIFIED = 0;
  // Overdue (its own group, first), then due today — the device's today.
  AGENDA_TASK_VIEW_TODAY = 1;
  // One group per civil day after today, nearest first.
  AGENDA_TASK_VIEW_UPCOMING = 2;
  // Open work filed in no project.
  AGENDA_TASK_VIEW_INBOX = 3;
  // Undated open work: unfiled first, then one group per project by name.
  AGENDA_TASK_VIEW_ANYTIME = 4;
  // Dated, then undated — two groups and no third.
  AGENDA_TASK_VIEW_ALL = 5;
  // Two outcomes: done, then won't do; newest-closed first.
  AGENDA_TASK_VIEW_LOGBOOK = 6;
  // Open work carrying a reminder lead time and a due to count back from.
  AGENDA_TASK_VIEW_REMINDERS = 7;
  // One project (`AgendaTaskBoardRequest.project_id`): its unfiled-in-a-section
  // work, then EVERY section in its order, an empty one included.
  AGENDA_TASK_VIEW_PROJECT = 8;
}

// `tasks.board`: the open window, the logbook, and the project chrome.
message AgendaTaskBoardRequest {
  // The zone (the file header's rule).
  string tz = 1;
  // The open window's size. ZERO IS THE MANIFEST'S DEFAULT (500); any other
  // value is clamped to the manifest's declared 20…500 — the app's only bound.
  uint32 limit = 2;
  // Which place to group for.
  AgendaTaskView view = 3;
  // `AGENDA_TASK_VIEW_PROJECT` only: the project.
  string project_id = 4;
}

// `tasks.task`: one task, whether or not any board window holds it.
message AgendaTaskRequest {
  string task_id = 1;
  string tz = 2;
}

// `tasks.projects`: the live projects and their sections, with open counts.
message AgendaTaskProjectsRequest {
  string tz = 1;
}

// `tasks.search`: tasks matching a term, in the index's rank order.
message AgendaTaskSearchRequest {
  string term = 1;
  // REQUIRED: zero is refused, `ERROR_CODE_INVALID_REQUEST`. Clamped to 100.
  uint32 limit = 2;
  string tz = 3;
}

// `tasks.catch-up`: the overdue piles, and the absence to name.
message AgendaTaskCatchUpRequest {
  string tz = 1;
}

// `tasks.trash`: the trashed tasks, most recently trashed first.
message AgendaTaskTrashRequest {
  // The zone the rows' days are read in: the stated IANA name, else the vault's;
  // a vault that names none and a request that states none answer EMPTY days,
  // never UTC ones.
  string tz = 1;
}

// ---------------------------------------------------------------------------
// The rows.
// ---------------------------------------------------------------------------

// One task, decorated, with its civil readings in the request zone.
message AgendaTask {
  string task_id = 1;
  optional string parent_task_id = 2;
  optional string project_id = 3;
  optional string section_id = 4;
  // `open`, `done` or `cancelled`.
  string status = 5;
  string title = 6;
  optional string description = 7;
  // Todoist's scale: 0 is unset, 1..9 with HIGHER MORE URGENT — not RFC
  // 5545's 1-is-highest. Ruled by D-1020-S5 (`docs/decisions.md`: the board
  // sorts "priority desc"); `task.add` and `task.edit` store it as sent.
  int64 priority = 8;
  // As stored: a civil date or an instant.
  optional string due_at = 9;
  optional string completed_at = 10;
  optional int64 effort_min = 11;
  // The reminder's lead time, minutes before the due moment.
  optional int64 remind_before_min = 12;
  // `scheduled` or `completion` — what the next period counts from.
  optional string recurrence_anchor = 13;
  // The zone the RECURRENCE expands in, not the display zone.
  optional string tz = 14;
  optional string series_id = 15;
  int64 sort_order = 16;
  optional string created_at = 17;
  optional string updated_at = 18;

  // --- the recurrence, as facts (#834), plus the rule for the picker ------
  // The task repeats.
  bool repeats = 19;
  // The one summariser's sentence ("Daily", "Every 2 weeks on Monday"), built
  // in Rust. Absent on a one-off.
  optional string recurrence_summary = 20;
  // Unactioned periods, collapsed into a count: a repeating task never stacks.
  uint32 missed = 21;
  // The next open period, as the engine spells it; absent on a one-off.
  optional string next_due = 22;

  // --- the civil readings, in the request zone -----------------------------
  // Of the EFFECTIVE due (`next_due`, else `due_at`). `YYYY-MM-DD`; empty when
  // undated.
  string due_day = 23;
  // `YYYY-MM-DDTHH:MM`, or `YYYY-MM-DD` for a date-only due; empty when
  // undated.
  string due_local = 24;
  // `HH:MM`; empty for a date-only due.
  string due_time = 25;
  // Civil days from today to the due day; absent when undated.
  optional sint32 days_from_today = 26;
  // The due day is before today.
  bool overdue = 27;
  // The due day is today or before — what Today draws.
  bool lands_today = 28;
  // When the reminder fires, `YYYY-MM-DDTHH:MM`; empty with no lead time, and
  // for a date-only due, which has no moment to count back from.
  string remind_at_local = 29;
  // The local day `completed_at` falls on; empty when there is none.
  string completed_day = 30;
  // Civil days since `created_at` — the "sitting since" signal.
  optional sint32 age_days = 31;

  // --- the decorations -----------------------------------------------------
  repeated AgendaTaskTag tags = 32;
  repeated AgendaTaskAttachment attachments = 33;
  repeated AgendaTaskReference references = 34;
  // A root's family, in the open board's order. On the open board: every
  // child. In the logbook: only the closed ones, so no row is drawn twice.
  repeated AgendaTask children = 35;
  // How many of `children` are closed.
  uint32 done_children = 36;
  // `tasks.search` only: the index's excerpt, hits wrapped in ⟦ ⟧.
  optional string snippet = 37;
  // The stored RFC 5545 rule, verbatim; absent on a one-off. For the editor's
  // repeat picker ONLY — to pre-select a preset and send the rule back
  // through `task.edit`. A shell never expands, summarises or dates
  // from it: `recurrence_summary`, `next_due` and `missed` are those answers
  // (#834's rule, which this field does not relax).
  optional string rrule = 38;
  // `created_at`'s civil day (`YYYY-MM-DD`) in the request zone — what
  // "sitting since" names. EMPTY when there is no `created_at`.
  string created_local_day = 39;
}

message AgendaTaskTag {
  // `tag_id`: a tag is a `tagged` edge to a concept and has no id beside it.
  reserved 1;
  reserved "tag_id";
  string concept_id = 2;
  // The concept's label, or `?` when the concept row is gone.
  string label = 3;
}

message AgendaTaskAttachment {
  // `role` and `is_primary`: an attachment is an `attached` edge and keeps
  // neither. `attachment_id` is the attached document's or photo's id.
  reserved 3, 4;
  reserved "role", "is_primary";
  string attachment_id = 1;
  string content_id = 2;
  string media_type = 5;
  string content_uri = 6;
  int64 byte_size = 7;
}

// An `@`-mention, resolved through a live link and its anchor. The entity
// card is not resolved here; a shell draws the target by type and id.
message AgendaTaskReference {
  // `link_id`: a reference is an `about` edge and has no id of its own.
  reserved 1;
  reserved "link_id";
  string to_type = 2;
  string to_id = 3;
}

message AgendaTaskProject {
  string project_id = 1;
  string name = 2;
  optional string area = 3;
  optional string color = 4;
  int64 sort_order = 5;
  // Open ROOTS filed here, in the board window read.
  uint32 open_count = 6;
}

message AgendaTaskSection {
  string section_id = 1;
  string project_id = 2;
  string name = 3;
  int64 sort_order = 4;
  uint32 open_count = 5;
}

// A tag chip for the rail: every concept any fetched task is tagged with.
message AgendaTaskTagChip {
  string concept_id = 1;
  string label = 2;
}

enum AgendaTaskGroupKind {
  AGENDA_TASK_GROUP_KIND_UNSPECIFIED = 0;
  AGENDA_TASK_GROUP_KIND_OVERDUE = 1;
  AGENDA_TASK_GROUP_KIND_TODAY = 2;
  // One civil day of Upcoming; `AgendaTaskGroup.day` names it.
  AGENDA_TASK_GROUP_KIND_DAY = 3;
  AGENDA_TASK_GROUP_KIND_INBOX = 4;
  // One project in Anytime; `AgendaTaskGroup.project_id` names it.
  AGENDA_TASK_GROUP_KIND_PROJECT = 5;
  AGENDA_TASK_GROUP_KIND_DATED = 6;
  AGENDA_TASK_GROUP_KIND_UNDATED = 7;
  AGENDA_TASK_GROUP_KIND_DONE = 8;
  AGENDA_TASK_GROUP_KIND_WONT_DO = 9;
  AGENDA_TASK_GROUP_KIND_REMINDERS = 10;
  // One section of a project; `AgendaTaskGroup.section_id` names it.
  AGENDA_TASK_GROUP_KIND_SECTION = 11;
  // A project's work in no section.
  AGENDA_TASK_GROUP_KIND_UNSECTIONED = 12;
}

// One group on a place. The shell owns the words: `kind` is the fact, and
// `day`, `project_id` and `section_id` are what a header names.
message AgendaTaskGroup {
  AgendaTaskGroupKind kind = 1;
  // Stable across answers, for a list's item keys.
  string key = 2;
  string day = 3;
  optional string project_id = 4;
  optional string section_id = 5;
  // ROOTS, each with its family in `children`.
  repeated AgendaTask tasks = 6;
}

// The numbers a band, a tile or a notice says — over the open ROOTS the window
// fetched. Overdue, today, upcoming and anytime partition them.
message AgendaTaskCounts {
  uint32 overdue = 1;
  uint32 today = 2;
  uint32 upcoming = 3;
  uint32 anytime = 4;
  uint32 inbox = 5;
  uint32 reminders = 6;
  // Every open task and every closed one FETCHED, children included — what
  // was read, not what the table holds.
  uint32 open = 7;
  uint32 closed = 8;
}

// ---------------------------------------------------------------------------
// The answers.
// ---------------------------------------------------------------------------

message AgendaTaskBoard {
  // The device's today, `YYYY-MM-DD`, and its wall clock, `YYYY-MM-DDTHH:MM`.
  string today = 1;
  string now_local = 2;
  // The place asked for, echoed.
  AgendaTaskView view = 3;
  repeated AgendaTaskGroup groups = 4;
  AgendaTaskCounts counts = 5;
  repeated AgendaTaskProject projects = 6;
  repeated AgendaTaskSection sections = 7;
  repeated AgendaTaskTagChip tags = 8;
  // THE OPEN PAGE'S OWN CURSOR: the window filled and more open work exists.
  bool truncated = 9;
  // The window actually read, after the clamp.
  uint32 window = 10;
}

message AgendaTaskDetail {
  string today = 1;
  string now_local = 2;
  // ABSENT WHEN NO LIVE TASK HAS THE ID — never created, purged, or in the
  // trash. A state the detail screen draws, not an error.
  optional AgendaTask task = 3;
  // The parent, when the task is a subtask and the parent is live.
  optional AgendaTask parent = 4;
  // The task's project and section, when it is filed in a live one.
  optional AgendaTaskProject project = 5;
  optional AgendaTaskSection section = 6;
}

message AgendaTaskProjects {
  repeated AgendaTaskProject projects = 1;
  repeated AgendaTaskSection sections = 2;
  // Open roots filed in no project.
  uint32 inbox_count = 3;
}

message AgendaTaskSearch {
  string today = 1;
  string now_local = 2;
  // In the index's rank order, best first.
  repeated AgendaTask tasks = 3;
  // THE WORDS THE ROWS ANSWER. Set only when the term as typed found fewer than
  // three rows and a correction of its words added some: the typed words with each
  // mistyped one replaced by a word the vault's own index holds. The rows
  // above are the exact rows first and then the ones the corrected words
  // found, none twice. EMPTY when nothing was added. A shell says
  // "Including results for <corrected>".
  string corrected = 4;
  // THE CONTAINERS THE TERM NAMES (#1097, R-1097-19..21): the projects whose own name
  // matched, in the index's rank order, at most eight. Empty when none did. A
  // correction counts them: the term is corrected only when the rows and these
  // are both empty.
  repeated ContainerHit containers = 5;
}

message AgendaTaskCatchUp {
  string today = 1;
  string now_local = 2;
  // One-off work whose due day has passed.
  repeated AgendaTask dated = 3;
  // Repeating work that is BEHIND: a missed period, or due before today.
  repeated AgendaTask repeating = 4;
  // Undated work that has sat 90 days or more.
  repeated AgendaTask sitting = 5;
  // Civil days since the oldest overdue due day; zero is not away.
  uint32 away_days = 6;
  uint32 overdue = 7;
  // Away a week or more with something overdue: the one moment the screen
  // names the time away.
  bool absent = 8;
}

// One trashed task: a subtask trashed with its parent is a row of its own.
message AgendaTaskTrashRow {
  string task_id = 1;
  string title = 2;
  // When it was trashed, when the sweep erases it, and the two civil days
  // (`YYYY-MM-DD`) in the request's zone. EMPTY when the instant is absent or no
  // zone resolved.
  string deleted_at = 3;
  optional string purge_at = 4;
  string deleted_local_day = 5;
  string purge_local_day = 6;
}

message AgendaTaskTrash {
  // Most recently trashed first.
  repeated AgendaTaskTrashRow tasks = 1;
  // The shelf is longer than its 500-row window.
  bool truncated = 2;
}
