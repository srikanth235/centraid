// PHOTOS' OWN SEARCH AND ITS DUPLICATES, ASKED OF THE CORE (#1097, R-1097-25..27,
// #1135).
//
// Photos' search used to be Kotlin legs of `LIKE`. Its TEXT leg and its ALBUM leg
// are the full-text door's: the photograph (`photo`: its caption, its place's name
// and locality, the text recognised in the picture) and the album container
// (`album`). The STRUCTURED legs (the places, the labels) stay with the shell,
// which reads them through the page door and folds them with this answer.
//
// Duplicates are a projection of the perceptual hashes (a `phash` derivative of
// each blob), clustered by the core when asked: nothing is stored, so a trashed
// photograph or a new hash is in the next answer.
//
// They ride `app_query.proto` at numbers 90 and 91, Photos' own: 80 is Home's,
// and the apps' blocks are below it.
//
// **NO `tz`.** A photograph search states no civil time (the grid is in capture
// order and reads its days elsewhere), so the arm names no zone.

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/container.proto";

// `photos.search`: the photographs and the albums one term names.
message PhotosSearchRequest {
  // The words. Blank answers nothing, never every photograph.
  string term = 1;
  // REQUIRED: zero is refused, `ERROR_CODE_INVALID_REQUEST`. The best this many
  // photographs by rank; clamped to 500.
  uint32 limit = 2;
  // MAY THE CORE CORRECT THE TERM? The shell sets this only when its OWN legs
  // (places, labels) found nothing for the term as typed, because the core
  // cannot see them: the correction runs only when EVERY leg is empty. With it
  // set and the core's legs empty too, the core replaces each mistyped word by
  // a word the vault's own vocabularies hold (`core.content_item` and the
  // album container) and runs its legs again at the corrected words;
  // `PhotosSearch.corrected` says what it searched. Without it the term is
  // searched as typed and never corrected.
  bool correct = 3;
}

message PhotosSearch {
  // THE PHOTOGRAPHS, as photograph ids (the field keeps its first name), in the
  // index's rank order (best first): the live, unarchived photographs whose
  // caption, place or recognised text holds the words. A trashed or archived photograph is never here, because Photos'
  // own shelf does not show one (Home's search keeps the archived: it opens a
  // photograph and this draws a grid). Order is the rank; a grid draws them in
  // capture order and uses this for WHICH, not for where.
  repeated string asset_ids = 1;
  // THE ALBUMS whose own name the words hold, in rank order, at most eight:
  // albums. `ContainerHit.id` is the album's id.
  repeated ContainerHit albums = 2;
  // THE WORDS SEARCHED when the term was corrected (#1097, R4, R8): the typed
  // words with each mistyped one replaced by a word the vault holds. EMPTY for an
  // exact answer. Set even when the core's own legs above found nothing at the
  // corrected words, because the shell's legs may have: the SHELL keeps it only
  // if the whole answer, its legs and these, is not empty.
  string corrected = 3;
}

// `photos.duplicates`: the near-duplicate clusters of the live library.
message PhotosDuplicatesRequest {}

// One cluster: photographs whose perceptual hashes lie within a few bits of one
// another (the vault's one clustering, `crates/media`).
message PhotosDuplicateCluster {
  // The cluster's id: its lowest photograph id. Stable for the same members.
  string key = 1;
  // The members, live photographs only, in id order; at least two.
  repeated string photo_ids = 2;
}

message PhotosDuplicates {
  // Biggest cluster first, ties by key.
  repeated PhotosDuplicateCluster clusters = 1;
}

// `photos.library`: a bounded recent window of live photographs, the albums, the places and the
// trash.
message PhotosLibraryRequest {
  // The window, clamped to 20..2000; zero is the default window.
  uint32 limit = 1;
  // A keyset cursor: only photographs taken strictly earlier. Empty is the newest.
  string before = 2;
}

message PhotosLibrary {
  // The window, newest first.
  repeated PhotosGridPhoto photos = 1;
  repeated PhotosAlbum albums = 2;
  // Every known place.
  repeated PhotosPlace places = 3;
  // Trashed photographs (newest 200), each with its days until purge.
  repeated PhotosGridPhoto trash = 4;
  // Older photographs exist beyond the window.
  bool truncated = 5;
  // The window actually served, after the clamp.
  uint32 window = 6;
  // The oldest `taken_at` this page reached: pass it back as `before`. Empty when none.
  string tail = 7;
}

message PhotosGridPhoto {
  string photo_id = 1;
  // The bytes' hash.
  string content_id = 2;
  optional string media_type = 3;
  // `photo`, `video` or `scan`.
  optional string form = 4;
  // The caption; empty when there is none.
  string title = 5;
  // `taken_at`, else when the photograph was made.
  optional string taken_at = 6;
  optional sint64 offset_min = 7;
  optional string burst = 8;
  optional string place_id = 9;
  optional sint64 width = 10;
  optional sint64 height = 11;
  optional double duration_s = 12;
  optional string edited_from = 13;
  optional string created_at = 14;
  optional string updated_at = 15;
  optional string deleted_at = 16;
  optional string purge_at = 17;
  bool favorite = 18;
  optional sint64 byte_size = 19;
  repeated string album_ids = 20;
  repeated string album_titles = 21;
  optional PhotosPlace place = 22;
  repeated PhotosTag tags = 23;
  // Trash only: days until the grace window closes; absent when the row carries no `purge_at`.
  optional sint64 purge_in_days = 24;
}

message PhotosTag {
  string tag_id = 1;
  string label = 2;
}

message PhotosAlbum {
  string album_id = 1;
  optional string title = 2;
  // The cover's bytes: the chosen cover when still a live member, else the first live photograph.
  optional string cover_content_id = 3;
  uint32 photo_count = 4;
}

message PhotosPlace {
  string place_id = 1;
  string name = 2;
  // Absent, never 0,0.
  optional double lat = 3;
  optional double lng = 4;
  optional string gazetteer = 5;
  optional string time_zone = 6;
}
