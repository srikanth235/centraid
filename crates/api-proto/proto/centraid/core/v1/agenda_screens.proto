// AGENDA'S SCREENS (#1135): events and to-dos in one app. Every message here is
// finished state a view draws or an event a view sends; Rust (`crates/screens`,
// module `agenda`) makes every decision, string, count and route. Arms in
// `screens.proto`: 100-199.
//
// Screens: `agenda.home` (Day, Schedule, Waiting and To-do, with Search as a
// mode and More as a sheet), `agenda.event`, `agenda.editor` (Event | Task),
// `agenda.todo_list`, `agenda.project`, `agenda.task`, `agenda.catch_up`, and
// the kit's `agenda.trash`.

syntax = "proto3";

package centraid.core.v1;

import "centraid/core/v1/kit_screens.proto";
import "centraid/core/v1/route.proto";

message AgendaHomeState {
  // WHICH LIST, as a parameter (law 2). Search is a mode over it and More is a
  // sheet, so neither is a value here.
  AgendaDestination destination = 2;
  // THE DAY THE SURFACE IS ANCHORED ON, civil `YYYY-MM-DD`, and EMPTY until
  // the first answer says which day today is — never a device-clock guess.
  string anchor_day = 3;
  // SEARCH IS THE BAR UNDER THE TITLE (R-CHROME-2): closed, a field-shaped
  // bar whose tap sends `SearchOpened`; open, the field. Never a band tab.
  bool search_open = 4;
  // What the member typed. Closing search CLEARS it.
  string search_term = 5;
  // Calendars switched off, FOR THE SESSION (not persisted).
  repeated string hidden_calendar_ids = 6;
  oneof content {
    Loading loading = 7;
    Failure failure = 8;
    // The vault would not let Agenda read. A state and not a failure: no band,
    // no toolbar, the kit's gate.
    Denied denied = 9;
    AgendaHomeData data = 10;
  }
  Sheet sheet = 11;
  // THE BAND, computed: Day, Schedule, Waiting, To-do, then More — places only
  // (R-CHROME-5, R-1128-1). The destination's tab stays lit while search is open,
  // because search is a mode over it. EMPTY while denied: the gate has no
  // band.
  repeated AgendaBandTab band = 12;
  // The day bar. On the state and not on `data`, so stepping a day keeps the
  // bar standing (and its buttons pressable) while the new day reads. Not
  // shown on To-do, which has no window.
  AgendaToolbar toolbar = 13;
  // The screen's fixed words, so a view carries no copy of its own.
  AgendaChrome chrome = 14;
  // 15 and 16 were the write overlay (`pending_event_ids`,
  // `cancel_asked_event_ids`): a write is answered at once, so a row is never
  // drawn pending.
  reserved 15, 16;
  reserved "pending_event_ids", "cancel_asked_event_ids";
  // 17 was `due_open_days`, the days whose due shelf was open. A task due on a
  // day is a row on that day now (`AgendaRowItem.task`, R-1128-2).
  reserved 17;
  reserved "due_open_days";
  // THE MORE SHEET, as rows, in order (R-1046-5, R-CHROME-4, R-1128-6): each
  // calendar as a show/hide toggle under the Calendars heading, then the
  // Tasks places (Anytime, Logbook, Reminders, Trash) under a Tasks heading,
  // then "What Agenda may read". Computed, so both platforms draw the same
  // list; no calendar rows until an answer has named the calendars.
  repeated AgendaMoreRow more_rows = 18;
  // THE WORDS THE HITS ANSWER when the core corrected a typo in `search_term`
  // (#1097); EMPTY for an exact answer. Agenda's search is a mode of this
  // screen and not a `SearchField`, so the correction sits beside the term.
  // A new term, closing search, and a refusal clear it.
  string search_corrected = 19;
  // THE ASK ROW OF AGENDA'S SEARCH (#1097, R-1097-28, #1135), the twin of
  // `SearchField.ask_row` on Agenda's flat fields: set by the hits for the current
  // term, matched or not, cleared by a new term, closing search and a refusal.
  reserved 20;
  reserved "search_ask";
  SearchAsk search_ask_row = 29;
  // THE TASK WRITE'S STATUS LINE (#1128): "Task done" with Undo, a filing's
  // "Filed in …", or the vault's own refusal. Empty when nothing was written.
  StatusLine status = 21;
  // To-do's quick-add bar (R-CHROME-1: the Plus on To-do opens it). `shown`
  // governs whether the To-do Plus is drawn; the bar itself waits for `drawn`.
  TodoQuickAdd quick_add = 22;
  // 23 was `filing_task_id`: nothing read it (#1152).
  reserved 23;
  reserved "filing_task_id";
  // SHEET_FILE: where the task being filed can go.
  repeated TodoChoice file_choices = 24;
  // 25 was `new_project_name` and 26 `new_project_can_submit`: the unified
  // style sheet (`style`) replaced the new-project sheet.
  reserved 25, 26;
  reserved "new_project_name", "new_project_can_submit";
  // THE HEADER PLUS (R-CHROME-1), per place: its accessibility label — "Add
  // task" on To-do, "Add" elsewhere (the sheet adds an event or a task) — and
  // what a tap does. On To-do it opens the quick-add bar (`QuickAddOpened`), so
  // `add_opens_quick_add` is true; elsewhere it pushes `new_event`, the add
  // sheet (R-1128-1).
  string add_label = 27;
  bool add_opens_quick_add = 28;
  // THE ADD SHEET on the anchor day (the core's today while no anchor is
  // known): the page the Plus pushes where `add_opens_quick_add` is false, and
  // the empty state's `empty_action` too. Absent while denied.
  Route new_event = 30;
  // THE CALENDAR'S VIEW MENU (#1173): the views of the Calendar tab, in order,
  // each naming the destination `DestinationChanged` carries. Empty off the
  // Calendar tab (Reminders and Invites have none).
  repeated AgendaCalendarView calendar_views = 31;
  // The menu key's accessibility label, "View".
  string calendar_view_label = 32;
  // THE STYLE SHEET (#1173 wave 2), set while `sheet` is SHEET_NEW_PROJECT,
  // SHEET_NEW_CALENDAR or SHEET_EDIT_CALENDAR: name, colour and icon of the
  // list or calendar being made or edited.
  AgendaStyleSheet style = 33;
  // THE IMPORT REMINDERS SHEET (iOS only: Android has no Reminders store), set
  // while `sheet` is SHEET_IMPORT_REMINDERS: the option "Include completed
  // reminders" and the one verb. The More row that opens it (`import-reminders`)
  // is drawn only where the platform has a reminders source.
  AgendaImportRemindersSheet import_reminders = 34;
  // THE CALENDAR'S HEADER (#1173), on Day and Week: the back-to-month chip, the
  // layout key, the all-day lane and the Today key's visibility. Not `shown`
  // on every other place, which keeps its own title and day bar.
  AgendaCalendarHeader calendar_header = 35;
  // THE REMINDERS "FILTER AND SORT" MENU (#1173, Main.dc.html): Show (flagged only,
  // completed) and Sort. Present on the Reminders place only; absent on the Calendar,
  // the gate and while a search answers. A pick comes back as `FilterMenuPicked`.
  optional FilterMenu filter_menu = 36;

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    // Calendars to show or hide, the Tasks places, and the row to the facts
    // sheet.
    SHEET_MORE = 2;
    // "What Agenda may read" — `AgendaChrome.reads_facts`.
    SHEET_READS = 3;
    // The filing sheet: Inbox, projects and their sections.
    SHEET_FILE = 4;
    // The new-list sheet: name, colour and icon (`style`).
    SHEET_NEW_PROJECT = 5;
    // The new-calendar sheet (`style`), opened from More's "New calendar".
    SHEET_NEW_CALENDAR = 6;
    // Rename or restyle one calendar (`style`), opened from its More row.
    SHEET_EDIT_CALENDAR = 7;
    // The reminders import's option sheet (`import_reminders`), opened from
    // More's "Import reminders".
    SHEET_IMPORT_REMINDERS = 8;
  }
  // Which app this home is (round 10 of #1173): `calendar` or `reminders`. The shell wears that
  // app's accent and names it on the band; it decides nothing else from it.
  string app_key = 40;
}

// The Import reminders option sheet: one switch and one verb. Its words are
// `ImportsMadeState`'s ("Include completed reminders", "Import reminders"); the
// verb is the ONE import path (`imports.made`'s `RemindersRequested`), so the
// outcome is said on the import status line like every import.
message AgendaImportRemindersSheet {
  string title = 1;
  string completed_label = 2;
  // "Include completed reminders" is on; off until the member turns it on.
  bool completed_on = 3;
  string import_label = 4;
}

// One entry of the Calendar's view menu: Day, Week, Month, List or Year.
message AgendaCalendarView {
  // `day`, `week`, `month`, `list`, `year`.
  string key = 1;
  string label = 2;
  string icon_key = 3;
  AgendaDestination destination = 4;
  bool current = 5;
}

// THE SHARED HEADER (#1173, `design/mockups/Calendar.dc.html`, and Reminders'
// `Main.dc.html`): over the hour grid of Day and Week, in place of the app's title, the Day menu, the
// date line and the ‹ › stepper. The week strip it sits over is
// `AgendaHomeData.week_strip`; a swipe on the strip or the grid pages a week
// (`WeekPaged`) and a tap on a day is `DayPicked`.
message AgendaCalendarHeader {
  // False on every place but Day, Week and Reminders, while denied, and while a search
  // term is answering. A shell draws its own title and day bar then.
  bool shown = 1;
  // The chip's words, the anchor's month alone: "November". Empty until the
  // first answer names the anchor. A tap sends `MonthChipTapped`.
  string month_label = 2;
  // "Month view, November".
  string month_accessibility = 3;
  // 4 was never drawn: the strip's own `is_selected` says the day.
  reserved 4;
  reserved "selected_day";
  // The layout in use: Day or Week.
  AgendaDestination layout = 5;
  // The layout key's accessibility label, "View".
  string layout_label = 6;
  // The layout key's choices, Day and Week first (the toggle) and then Month,
  // List and Year. Each names the layout `LayoutToggled` carries.
  repeated AgendaCalendarView layouts = 7;
  // "all-day".
  string all_day_label = 8;
  // THE ALL-DAY LANE of Day: the anchor's all-day events, birthdays and
  // untimed tasks, drawn in one row under the strip. Empty on Week, whose
  // columns carry their own (`AgendaGridDay.all_day`), and on a day with none.
  repeated AgendaGridChip all_day = 9;
  // The floating Today key is drawn: the anchor is not today.
  bool today_shown = 10;
  string today_label = 11;
  // Catalogue icons for the chip's chevron and the layout key.
  string month_icon_key = 12;
  string layout_icon_key = 13;
  // THE PLACE'S OWN TITLE under the bar, for a place that has one (Reminders:
  // `Main.dc.html`). Empty on Day and Week, which draw none. When the header is
  // `shown` with no `month_label` and no `layouts`, the bar holds only the
  // app's verb: the same header, with nothing to go back to and no layout to pick.
  string title = 14;
}

message AgendaToolbar {
  // False while nothing is known to anchor it (the first read), while denied,
  // and while a search term is answering: search results are not a window.
  bool shown = 1;
  // Day: "Today" / "Tomorrow" / "Yesterday" / "Wednesday 11 March".
  // Schedule and Waiting: "From today" / "From Wednesday 11 March".
  string range_label = 2;
  // The app bar's subtitle: "March 2026".
  string month_label = 3;
  // Hides "Today".
  bool at_today = 4;
}

message AgendaChrome {
  string title = 1;
  string new_event = 2;
  string today = 3;
  // The ‹ and › buttons' accessibility labels.
  string previous_day = 4;
  string next_day = 5;
  string search_placeholder = 6;
  string search_label = 7;
  string search_close = 8;
  // The failure state's action; it sends `Refreshed`.
  string retry = 9;
  // The skeleton's accessibility label.
  string loading = 10;
  string more_title = 11;
  // 12 was `calendars_heading`, the More sheet's Calendars heading. The sheet
  // is rows on the state now, and the heading rides on its first calendar row
  // (`AgendaMoreRow.section`).
  reserved 12;
  reserved "calendars_heading";
  // "What Agenda may read" — `SHEET_READS`' title.
  string reads_title = 13;
  repeated AgendaFact reads_facts = 14;
  // The band's home capsule.
  string home = 15;
  // 16 was `shelf_label`, the due shelf toggle's accessibility label (R-1128-2).
  reserved 16;
  reserved "shelf_label";
  // THE TASK WORDS Day and To-do draw: the quick-add placeholder and verb, the
  // filing sheet's title, the new-project words, cancel, "Move to project" and
  // "Show more". Fields a task page alone draws are empty here.
  TodoChrome tasks = 17;
}

message AgendaFact {
  string label = 1;
  string detail = 2;
}

message AgendaBandTab {
  // `day`, `schedule`, `waiting`, `todo`, `more` — what `BandPicked` sends.
  string key = 1;
  string label = 2;
  // A `design/icons.toml` icon key.
  string icon_key = 3;
  // The 2px accent bar.
  bool current = 4;
}

message AgendaHomeData {
  // `YYYY-MM-DD` and `YYYY-MM-DDTHH:MM`, from the answer.
  string today = 1;
  // 2 was `now_local`: nothing read it (#1152).
  reserved 2;
  reserved "now_local";
  // In day order. Past days are not drawn except as search hits.
  repeated AgendaDaySection days = 3;
  // `AGENDA_EMPTY_NONE` whenever `days` has a section, and under a search
  // whenever `task_hits` or `containers` has one.
  AgendaEmpty empty = 4;
  // The empty state's words; empty strings draw nothing. `empty_action` sends
  // `NewEventRequested`.
  string empty_title = 5;
  string empty_body = 6;
  string empty_action = 7;
  // Every calendar the member has, for the More sheet.
  repeated AgendaCalendarChoice calendars = 8;
  // 9 was `waiting_count`: nothing read it (#1152).
  reserved 9;
  reserved "waiting_count";
  // 10 was `event_count`: nothing read it (#1152).
  reserved 10;
  reserved "event_count";
  string event_count_label = 11;
  // WHERE OPENING LANDS: this section, at its now line when it has one. Empty
  // `day` is the top.
  AgendaLanding landing = 12;
  // WHILE THE VAULT HOLDS NO EVENT IN THE WINDOW (marks — due tasks,
  // birthdays — aside), where the phone already holds the member's calendar: a
  // shell that can read it offers the import — as the empty state's action in
  // place of `empty_action` on day one, and as a quiet row above the list when
  // marks fill it. See `EmptyState.import_source`.
  ImportSource import_source = 13;
  // DAY ON TODAY ONLY (R-1128-3): the open work whose day has passed, above
  // the day, with the verb "Reschedule" (`verb_key` `catch_up`; it pushes
  // `catch_up`). Absent on every other anchor and place.
  optional TodoRowGroup overdue = 14;
  // The absence notice on Day on today: "You were away 16 days · 34 tasks came
  // due", with its verb, which pushes `catch_up`.
  optional TodoNotice notice = 15;
  // SEARCH (R-1128-4): the tasks the term found, one group drawn above the
  // event days. Empty without a term.
  repeated TodoRowGroup task_hits = 16;
  // To-do's content; set on `AGENDA_DESTINATION_TODO` only.
  AgendaTodo todo = 17;
  // THE CALENDAR'S GRIDS (#1173). The core lays them out and a shell only
  // draws them; each is set on its own view and absent elsewhere (and under a
  // search, which is a list of hits).
  // The week the anchor is in, over the Day grid and the Week grid.
  AgendaWeekStrip week_strip = 21;
  // Day (one column, the anchor) and Week (seven columns).
  AgendaTimeGrid time_grid = 22;
  AgendaMonthGrid month = 23;
  AgendaYearGrid year = 24;
  // SEARCH'S CONTAINERS (#1097 R-1097-19, #1128 Q-1128-1): the projects whose
  // own name the term matched (`search`'s `containers`), drawn by the one
  // container row each shell has, above `task_hits`. Empty without a term, and
  // held as `task_hits` are: the answer to the term on screen sets them,
  // closing search clears them. A tap pushes the container's `route`, the
  // project page To-do's project row opens.
  repeated SearchContainer containers = 18;
  // CATCH UP, the page the Overdue group's verb and the absence notice's verb
  // push.
  Route catch_up = 19;
  // The words on the empty state's Import ("Import calendar"), finished; empty
  // exactly when `import_source` is not CALENDAR.
  string import_label = 20;
}

// THE TO-DO PLACE (#1128, R-1128-1): the Inbox's tasks, then the projects by
// area — named areas A→Z, then "Projects" for those in none — in one list.
message AgendaTodo {
  // The Inbox: open work filed in no project. A group per head the core named.
  repeated TodoRowGroup groups = 1;
  // One group per area; a project row pushes its `route`.
  repeated TodoProjectGroup projects = 2;
  // Nothing open: day one's words, or "all done" with the phone's reminders
  // offered (`import_source`). `TodoEmptyActed` performs `action_label`.
  EmptyState empty = 3;
  // "7 tasks · 3 projects"; empty while the list is empty.
  string count_label = 4;
  // "500 tasks · more not shown"; empty when whole.
  string window_label = 5;
  // "Show more" is live: the window can widen (`NextPageRequested`).
  bool can_show_more = 6;
  // The verb that opens the new-project sheet, "New project" — drawn at the
  // foot of the list whatever it holds (the sheet is reachable always).
  string new_project_label = 7;
  // THE REMINDERS HOME (#1173): the smart-list cards (Today, Scheduled, All,
  // Flagged, Completed) with their counts, then "My Lists" over `projects`.
  repeated AgendaSmartList smart_lists = 8;
  string my_lists_title = 9;
  // "Add List": the home's quiet verb, which opens the new-project sheet.
  string add_list_label = 10;
}

// THE WEEK STRIP (#1173): the seven days of the anchor's week, from the
// region's first weekday, each with a dot per calendar it has events on. A tap
// sends `DayPicked` with the day's `opens`; a swipe sends `WeekPaged`.
message AgendaWeekStrip {
  repeated AgendaStripDay days = 1;
  // 2 was `step_days` (7): `WeekPaged` counts weeks.
  reserved 2;
  reserved "step_days";
  // The swipe's spoken names: "Previous week", "Next week".
  string previous_label = 3;
  string next_label = 4;
}

message AgendaStripDay {
  // `YYYY-MM-DD`.
  string day = 1;
  // "M".
  string weekday_initial = 2;
  string day_number = 3;
  bool is_today = 4;
  // The anchor: the filled circle.
  bool is_selected = 5;
  // Saturday and Sunday, drawn in the quiet text role.
  bool is_weekend = 6;
  // At most three list-palette hue keys, one per calendar with an event
  // that day, in the order they first start.
  repeated string dot_hue_keys = 7;
  // "Wednesday 4 November, 3 events".
  string accessibility_label = 8;
  // What a tap opens: the layout the strip is in, Day or Week — sent back in `DayPicked`.
  AgendaDestination opens = 9;
}

// THE HOUR GRID (#1173): the Day view's one column or the Week view's seven,
// with the all-day strip over them. Minutes count from the column day's local
// midnight, 0 to 1440; a shell maps them to its own hour height.
message AgendaTimeGrid {
  // 24 marks: minute 0 "00:00" … minute 1380 "23:00".
  repeated AgendaHourMark hours = 1;
  repeated AgendaGridDay days = 2;
  // Where the grid opens scrolled to: an hour before now on today, else an
  // hour before the first timed block, else 08:00.
  int32 scroll_to_minute = 3;
  // A drop or a long press lands on this grid (15): the core snaps, a shell
  // only reports the minute under the finger.
  int32 snap_minutes = 4;
  // "all-day".
  string all_day_label = 5;
  // The now line, when today is a column. Absent otherwise.
  AgendaGridNow now = 6;
  // What a screen reader says of an empty slot: "Hold to add an event".
  string slot_hint = 7;
  // A drag's spoken names: "Move", "Change end time".
  string move_label = 8;
  string resize_label = 9;
}

message AgendaHourMark {
  int32 minute = 1;
  // "09:00".
  string label = 2;
}

message AgendaGridNow {
  string day = 1;
  int32 minute = 2;
  // "13:36".
  string label = 3;
  // "Now, 13:36".
  string accessibility_label = 4;
}

message AgendaGridDay {
  string day = 1;
  // The Week view's column head: "Wed 4". Empty on Day, which has the strip.
  string heading = 2;
  bool is_today = 3;
  // All-day events, birthdays, and the open tasks due that day with no time.
  repeated AgendaGridChip all_day = 4;
  // The timed events and timed tasks, placed.
  repeated AgendaGridBlock blocks = 5;
  // "Wednesday 4 November".
  string accessibility_label = 6;
}

message AgendaGridChip {
  // Stable within the day: `event:<instance_key>`, `task:<id>`, `birthday:<name>`.
  string key = 1;
  string title = 2;
  string hue_key = 3;
  // A task's chip draws a check circle; its tap sends `TaskChecked`.
  bool is_task = 4;
  string task_id = 5;
  // An event's or a task's page; absent on a birthday.
  Route route = 6;
  string accessibility_label = 7;
  // A task's chip: the reminder is ticked off (the circle is filled), and `read_only` says the chip
  // is a later occurrence of a repeating reminder, which has no row of its own: its circle opens the
  // reminder (`route`) instead of ticking (round 12 of #1173).
  bool done = 8;
  bool read_only = 9;
}

// ONE TIMED BLOCK, placed: from `start_minute` to `end_minute` (at least 15
// minutes tall), in `column` of `columns` equal lanes. Blocks that overlap
// share a cluster and each takes the first lane free at its start; `columns`
// is the cluster's lane count, so a block's width is the column's over it.
message AgendaGridBlock {
  // `<day>|<instance_key>` or `<day>|task:<id>`.
  string key = 1;
  // An event's occurrence: what `EventMoved` and `EventResized` carry.
  // Empty on a task.
  string instance_key = 2;
  string title = 3;
  // "09:30 – 10:15", "Until 10:00", "From 22:00".
  string time_label = 4;
  // "Call" (the place), the task's list; empty for none.
  string meta = 5;
  // A list-palette token (`listBlue`) when the calendar's colour is one the
  // member chose, else a party hue role (`cTeal`).
  string hue_key = 6;
  int32 start_minute = 7;
  int32 end_minute = 8;
  int32 column = 9;
  int32 columns = 10;
  bool is_past = 11;
  // A timed task: drawn dashed with a check circle (`TaskChecked`).
  bool is_task = 12;
  string task_id = 13;
  // A drag moves it and a drag on its foot resizes it. False on a task, on
  // a run over midnight, and on an event with other guests.
  bool movable = 14;
  // "Team standup, 09:30 to 10:15, Call".
  string accessibility_label = 15;
  Route route = 16;
  // The second line, finished: an event's time and place on one line
  // ("09:30 – 10:15 · Call"); a task's list, which a shell draws after the
  // title when the block is one line tall.
  string detail = 17;
  // A task's block: ticked off, and read-only as on [`AgendaGridChip`].
  bool done = 18;
  bool read_only = 19;
}

// THE MONTH (#1173): whole weeks from the region's first weekday, so the
// month's first and last weeks carry the days of the months around it
// (`in_month` false). Two styles from the view menu: the grid shows titles in
// the cells; the list shows dots, and the selected day's rows under the grid.
message AgendaMonthGrid {
  // "November 2026".
  string title = 1;
  // Seven initials, from the first weekday.
  repeated string weekday_labels = 2;
  // 28, 35 or 42 cells, a week per seven.
  repeated AgendaMonthCell cells = 3;
  AgendaMonthStyle style = 4;
  // The style choices, Grid and List, for the view menu's second group.
  repeated AgendaMonthStyleChoice styles = 5;
  // LIST STYLE: the anchor day's rows, drawn under the grid as the list
  // draws a day; empty in the grid style.
  repeated AgendaDaySection selected = 6;
  // "Nothing on this day." when the list style's day has no rows.
  string selected_empty = 7;
  // The swipe's spoken names: "Previous month", "Next month".
  string previous_label = 8;
  string next_label = 9;
}

enum AgendaMonthStyle {
  AGENDA_MONTH_STYLE_UNSPECIFIED = 0;
  AGENDA_MONTH_STYLE_GRID = 1;
  AGENDA_MONTH_STYLE_LIST = 2;
}

message AgendaMonthStyleChoice {
  AgendaMonthStyle style = 1;
  // "Grid", "List".
  string label = 2;
  bool current = 3;
}

message AgendaMonthCell {
  string day = 1;
  string day_number = 2;
  // False for the leading and trailing days of the months around it.
  bool in_month = 3;
  bool is_today = 4;
  bool is_selected = 5;
  // GRID STYLE: the first three items' titles; `more_label` counts the rest.
  repeated AgendaMonthChip chips = 6;
  // "+2"; empty for none.
  string more_label = 7;
  // LIST STYLE: one dot per calendar, at most three.
  repeated string dot_hue_keys = 8;
  // What a tap opens: Day in the grid style, the Month itself (the day
  // selected) in the list style — sent back in `DayPicked`.
  AgendaDestination opens = 9;
  // "Wednesday 4 November, 3 events".
  string accessibility_label = 10;
}

message AgendaMonthChip {
  string title = 1;
  string hue_key = 2;
  bool is_task = 3;
}

// THE YEAR (#1173): twelve small months. A month's tap sends `DayPicked` with
// its `first_day` and `AGENDA_DESTINATION_MONTH`. No event marks: a year of
// occurrences is not read for twelve thumbnails.
message AgendaYearGrid {
  // "2026".
  string title = 1;
  repeated AgendaYearMonth months = 2;
  // "Previous year", "Next year".
  string previous_label = 3;
  string next_label = 4;
}

message AgendaYearMonth {
  // `YYYY-MM`.
  string month = 1;
  // "November".
  string label = 2;
  // Today is in it: the label takes the app's accent.
  bool is_current = 3;
  // Whole weeks from the first weekday; a day outside the month has an
  // empty `day_number` and draws nothing.
  repeated AgendaYearDay days = 4;
  // What a tap selects: today in the current month, else the 1st.
  string first_day = 5;
  // "November 2026".
  string accessibility_label = 6;
}

message AgendaYearDay {
  string day = 1;
  string day_number = 2;
  bool is_today = 3;
}

// One smart-list card on the Reminders home.
message AgendaSmartList {
  // `today`, `scheduled`, `all`, `flagged`, `completed`.
  string key = 1;
  string label = 2;
  // The Agenda catalogue's glyph key.
  string icon_key = 3;
  // The card's colour: an app/state/list key from `design/tokens.toml`
  // (`agenda`, `red`, `graphite`, ...). Never a hex.
  string color_key = 4;
  // The count as digits; empty when the card shows none (Completed).
  string count = 5;
  // What a screen reader says: "Today, 5".
  string accessibility_label = 6;
  // `agenda.todo_list` on the card's view.
  Route route = 7;
}

message AgendaLanding {
  string day = 1;
  bool now_line = 2;
}

message AgendaDaySection {
  string day = 1;
  string day_number = 2;
  string weekday_short = 3;
  // "Today" / "Wed 11 March".
  string heading = 4;
  bool is_today = 5;
  bool is_past = 6;
  // "April 2026" on the first section of a month the list had not shown yet.
  optional string month_heading = 7;
  // "Dana" / "3 birthdays" — day context, never an event row.
  optional string ribbon = 8;
  // 9 was `ribbon_names`: nothing read it (#1152).
  reserved 9;
  reserved "ribbon_names";
  // 10-13 were the due shelf (`due_count`, `due`, `due_label`, `due_open`):
  // an open task due on the day is a row now (`AgendaRowItem.task`, R-1128-2).
  reserved 10, 11, 12, 13;
  reserved "due_count", "due", "due_label", "due_open";
  // All-day rows first and the day's untimed tasks right after them, then the
  // timed rows and timed tasks by time, with the now line placed among them on
  // today.
  repeated AgendaRowItem items = 14;
}

message AgendaRowItem {
  oneof kind {
    AgendaEventRow event = 1;
    AgendaNowLine now_line = 2;
    // A TASK DUE ON THE DAY, finished (R-1128-2): the one row shape every to-do
    // list draws. Its box checks it off in place (`TaskChecked`), a tap pushes
    // its `route`.
    TodoRow task = 3;
  }
}

message AgendaNowLine {
  // "09:42".
  string label = 1;
  // "Now, 09:42".
  string accessibility_label = 2;
}

message AgendaEventRow {
  // 1 was `event_id`: nothing read it (#1152).
  reserved 1;
  reserved "event_id";
  string instance_key = 2;
  // 3 was `original_start_local`: nothing read it (#1152).
  reserved 3;
  reserved "original_start_local";
  // `day|instance_key`: a run over three days is three rows.
  string row_key = 4;
  // The summary, or "Untitled event".
  string title = 5;
  // "08:15 – 09:45" / "08:15" (no end) / "All day" / "Until 10:00" (runs in
  // from a day before) / "From 22:00" (runs past midnight) / "Continues" (a
  // day inside a longer run).
  string time_label = 6;
  // "repeats · 2 guests · call". Hidden on touch; spoken in
  // `accessibility_label`.
  string meta = 7;
  // The 2px rule's colour, from the calendar's: the THEME'S COLOUR ROLE
  // (`cTeal`), as People's hues are — every Agenda `*hue_key` is one (#1047).
  string calendar_hue_key = 8;
  AgendaRowStatus status = 9;
  // "needs a reply"; empty for none.
  string status_label = 10;
  // "Survey walk-through, 08:15 to 09:45, repeats, 2 guests, needs a reply".
  string accessibility_label = 11;
  // Ended before now: drawn dimmed.
  bool is_past = 12;
  // WHERE A TAP GOES: this occurrence's page, drawn under the section's day.
  Route route = 13;
}

enum AgendaRowStatus {
  // 3 and 4 were PENDING and CANCEL_ASKED, the held-write overlay: a write is
  // answered at once, so a row is never drawn waiting on one.
  reserved 3, 4;
  reserved "AGENDA_ROW_STATUS_PENDING", "AGENDA_ROW_STATUS_CANCEL_ASKED";
  AGENDA_ROW_STATUS_UNSPECIFIED = 0;
  AGENDA_ROW_STATUS_NONE = 1;
  // You are a guest and have not answered.
  AGENDA_ROW_STATUS_NEEDS_REPLY = 2;
}

message AgendaCalendarChoice {
  string calendar_id = 1;
  string name = 2;
  string hue_key = 3;
  bool hidden = 4;
  // "Shown" / "Hidden".
  string state_label = 5;
  // The calendar's colour on the one list palette (`blue`, `mustard` ...).
  string color_key = 6;
  // A `design/icons.toml` key the member chose; empty for none.
  string icon_key = 7;
}

// ONE ROW OF AGENDA'S MORE SHEET. A view draws `label` (with the `hue_key` dot
// and `meta` on a calendar), a heading above it when `section` is set, and
// sends `MoreRowPicked` with `key` on a tap; Rust decides what the key does
// (a calendar toggles, `reads` opens the facts sheet, a place closes the sheet)
// and a row with a `route` is then pushed by the shell. The sheet's order
// (R-1128-6): the calendars, then the Tasks places (Anytime, Logbook,
// Reminders, Trash) under a "Tasks" heading, then "What Agenda may read".
message AgendaMoreRow {
  // `calendar-<calendar_id>`, `new-calendar` (opens SHEET_NEW_CALENDAR), a Tasks
  // place (`anytime`, `logbook`, `reminders`, `trash`), `import-reminders`
  // (opens SHEET_IMPORT_REMINDERS; only where the platform has a reminders
  // source) or `reads`.
  string key = 1;
  string label = 2;
  // "Shown" / "Hidden" on a calendar row; empty on an action row.
  string meta = 3;
  // A calendar's colour role (`cTeal`); empty on an action row.
  string hue_key = 4;
  // A calendar row is a TOGGLE, and `on` is "shown". An action row is neither.
  bool toggle = 5;
  bool on = 6;
  // The heading drawn ABOVE this row ("Calendars"); empty for none.
  string section = 7;
  // What a screen reader says for the row: "Work, Hidden".
  string spoken = 8;
  // A `design/icons.toml` icon key on a Tasks place's row; empty on
  // a calendar row.
  string icon_key = 9;
  // WHERE A TAP GOES on a Tasks place's row: Anytime, Logbook and Reminders
  // (`agenda.todo_list`) and Trash (`agenda.trash`). Absent on a calendar and
  // on `reads`, which are the sheet's own.
  Route route = 10;
  // A calendar's colour on the one list palette (`blue` ...); empty elsewhere.
  // The dot is drawn in it; `hue_key` stays the events' own role.
  string color_key = 11;
  // A calendar row's edit control (rename, colour, icon): its accessibility
  // label ("Edit Work"). The control sends `CalendarEditRequested`. Empty
  // where the row has none. `icon_key` (9) is now also a calendar's own icon.
  string edit_label = 12;
}

enum AgendaEmpty {
  AGENDA_EMPTY_UNSPECIFIED = 0;
  AGENDA_EMPTY_NONE = 1;
  // Schedule's whole window holds nothing, with no search and no calendar
  // hidden: "Nothing in your calendar yet."
  AGENDA_EMPTY_DAY_ONE = 2;
  // "Nothing on this day." / "Nothing on these days."
  AGENDA_EMPTY_NOTHING_ON_DAY = 3;
  AGENDA_EMPTY_NOTHING_WAITING = 4;
  AGENDA_EMPTY_NO_MATCH = 5;
}

// What a view sends. A row that opens a page carries its own `Route` and the
// shell pushes it (`NavPush`): an event row, a task row, a project row or
// container, the Plus on the add sheet, the Overdue verb, the notice. The
// events below are the ones Rust must hear.
message AgendaHomeEvent {
  // 28 was `NewProjectNameChanged` and 29 `NewProjectSubmitted`: the style sheet's
  // `StyleNameChanged` and `StyleSubmitted` replaced them.
  reserved 28, 29;
  reserved "new_project_name", "new_project_submitted";
  oneof kind {
    // The pull, and the failure state's retry.
    Refreshed refreshed = 2;
    DestinationChanged destination = 3;
    DayStepped day_stepped = 4;
    TodayRequested today = 5;
    SearchOpened search_opened = 6;
    SearchTermChanged search_term = 7;
    SearchClosed search_closed = 8;
    CalendarToggled calendar_toggled = 9;
    BandPicked band = 10;
    SheetOpened sheet_opened = 11;
    SheetClosed sheet_closed = 12;
    // A More sheet row, by `AgendaMoreRow.key`. A place's row also carries a
    // `route`: send this first (the sheet closes), then push the route.
    MoreRowPicked more_row = 19;
    // TASKS (#1128). 13 was `DueShelfToggled`.
    TaskChecked task_checked = 20;
    StatusActed status_acted = 21;
    FileRequested file_requested = 22;
    FileChosen file_chosen = 23;
    QuickAddOpened quick_add_opened = 24;
    QuickAddChanged quick_add_changed = 25;
    QuickAddSubmitted quick_add_submitted = 26;
    QuickAddClosed quick_add_closed = 27;
    TodoEmptyActed todo_empty_acted = 30;
    NextPageRequested next_page = 32;
    // The empty state's Import (`EmptyState.import_source` = calendar): Rust asks
    // the shell to read the phone's calendars, imports them, and follows.
    ImportRequested import_requested = 37;
    // The swipe on a task row (#1173).
    TaskFlagged task_flagged = 38;
    // THE CALENDAR'S GRIDS (#1173).
    DayPicked day_picked = 39;
    SlotPressed slot_pressed = 40;
    EventMoved event_moved = 41;
    EventResized event_resized = 42;
    MonthStyleChosen month_style = 43;
    // ‹ and › and a swipe on Week, Month and Year: one week, month or year.
    PeriodStepped period_stepped = 44;
    // The swipe's Delete on a task row: to the trash, with Undo.
    TaskDeleted task_deleted = 45;
    // THE KEYBOARD TOOLBAR over To-do's quick add (#1173).
    QuickToolPicked quick_tool = 46;
    QuickDuePicked quick_due = 47;
    QuickTagAdded quick_tag = 48;
    // The date chip's ×: keep the typed words as the title (#1173).
    QuickAddChipDismissed quick_add_chip_dismissed = 49;
    // THE STYLE SHEET (#1173 wave 2), shared by the new list and the new and
    // edited calendar.
    StyleNameChanged style_name = 50;
    StyleColorPicked style_color = 51;
    StyleIconPicked style_icon = 52;
    StyleSubmitted style_submitted = 53;
    CalendarEditRequested calendar_edit = 54;
    // THE IMPORT REMINDERS SHEET (iOS): the switch and the verb. The verb asks
    // `imports.made` to read the phone's Reminders with the switch's option.
    ImportRemindersCompletedToggled import_reminders_completed = 55;
    ImportRemindersSubmitted import_reminders_submitted = 56;
    // THE CALENDAR'S HEADER (#1173): the month chip, a layout choice and a week
    // page.
    MonthChipTapped month_chip = 57;
    LayoutToggled layout_toggled = 58;
    WeekPaged week_paged = 59;
    // THE REMINDERS FILTER AND SORT MENU: a pick, and the clear row.
    FilterMenuPicked filter_menu_picked = 60;
    FilterMenuCleared filter_menu_cleared = 61;
  }

  // The "‹ November" chip: back to the month the anchor is in.
  message MonthChipTapped {}

  // A layout key choice (`AgendaCalendarHeader.layouts`), keeping the anchor.
  message LayoutToggled {
    AgendaDestination layout = 1;
  }

  // A swipe on the week strip or the Week grid: whole weeks, -1 the one before.
  message WeekPaged {
    int32 weeks = 1;
  }

  // The sheet's "Include completed reminders" switch was flipped.
  message ImportRemindersCompletedToggled {}

  // The sheet's "Import reminders".
  message ImportRemindersSubmitted {}

  message StyleNameChanged {
    string name = 1;
  }

  // `AgendaStyleSwatch.key`.
  message StyleColorPicked {
    string key = 1;
  }

  // `AgendaStyleIcon.key`; EMPTY clears the icon.
  message StyleIconPicked {
    string key = 1;
  }

  // The sheet's Create or Save.
  message StyleSubmitted {}

  // A calendar row's edit control: opens SHEET_EDIT_CALENDAR on it.
  message CalendarEditRequested {
    string calendar_id = 1;
  }

  // A strip day, a month cell or a year's month: the anchor moves to `day`
  // and the view to `destination` (the cell's `opens`).
  message DayPicked {
    string day = 1;
    AgendaDestination destination = 2;
  }

  // A long press on an empty slot: the minute under the finger on `day`. The
  // core snaps it and opens the add sheet there (`OpenRoute`).
  message SlotPressed {
    string day = 1;
    int32 minute = 2;
  }

  // A block dropped with its top at `minute` on `day`; it keeps its length.
  message EventMoved {
    string instance_key = 1;
    string day = 2;
    int32 minute = 3;
  }

  // A block's foot dropped at `end_minute` on its own day.
  message EventResized {
    string instance_key = 1;
    int32 end_minute = 2;
  }

  message MonthStyleChosen {
    AgendaMonthStyle style = 1;
  }

  message PeriodStepped {
    int32 by = 1;
  }

  message TaskDeleted {
    string task_id = 1;
  }

  message QuickToolPicked {
    // `TodoQuickTool.key`.
    string key = 1;
  }

  message QuickDuePicked {
    // `TodoChoice.key` of `TodoQuickAdd.due_choices`.
    string key = 1;
  }

  message QuickTagAdded {
    string text = 1;
  }
  // 13 was `due_toggled`; 17, 18 and 33-36 were the intents (`new_event`,
  // `event_picked`, `task_picked`, `project_picked`, `group_verb`,
  // `notice_acted`), which are routes now.
  reserved 13, 17, 18, 31, 33, 34, 35, 36;
  reserved "due_toggled", "new_event", "event_picked", "task_picked", "project_picked", "group_verb", "notice_acted";

  message Refreshed {}

  message ImportRequested {}

  message TaskFlagged {
    string task_id = 1;
    bool flagged = 2;
  }

  message DestinationChanged {
    AgendaDestination destination = 1;
  }

  // Days to move the anchor: -1 is ‹, 1 is ›. (`by` would be escaped by
  // Wire, a Kotlin keyword.)
  message DayStepped {
    int32 days = 1;
  }

  message TodayRequested {}

  // The search bar under the title was tapped: the field opens.
  message SearchOpened {}

  message SearchTermChanged {
    string term = 1;
  }

  message SearchClosed {}

  message CalendarToggled {
    string calendar_id = 1;
  }

  // A band tab, by `AgendaBandTab.key`.
  message BandPicked {
    string key = 1;
  }

  message MoreRowPicked {
    string key = 1;
  }

  message SheetOpened {
    AgendaHomeState.Sheet sheet = 1;
  }

  message SheetClosed {}

  // A task's box: open work completes, in place.
  message TaskChecked {
    string task_id = 1;
  }

  // The status line's Undo.
  message StatusActed {}

  // A long press on an open task: the filing sheet.
  message FileRequested {
    string task_id = 1;
  }

  // A `file_choices` key.
  message FileChosen {
    string key = 1;
  }

  // The Plus on To-do: the bar opens on the keyboard.
  message QuickAddOpened {}

  message QuickAddChanged {
    string title = 1;
  }

  // The bar's Add verb: files the typed title in the Inbox.
  message QuickAddSubmitted {}

  // The keyboard left the bar. It closes only when its field is empty, so
  // typed words are never thrown away.
  message QuickAddClosed {}

  // To-do's empty state action (`AgendaTodo.empty.action_label`).
  message TodoEmptyActed {}

  // "Show more" under a To-do window that is not everything open.
  message NextPageRequested {}
}

// Which occurrences a change or a cancellation reaches. `edit_occurrence`'s
// `scope` values, and SERIES is the whole event (`edit_event`, `cancel_event`).
enum AgendaScope {
  AGENDA_SCOPE_UNSPECIFIED = 0;
  AGENDA_SCOPE_OCCURRENCE = 1;
  AGENDA_SCOPE_FUTURE = 2;
  AGENDA_SCOPE_SERIES = 3;
}

// One row of a scope sheet. NONE IS PRE-CHOSEN: the three answers are equal, so
// nothing is filled until the member picks.
message AgendaScopeChoice {
  AgendaScope scope = 1;
  string label = 2;
  bool selected = 3;
  // False when this change cannot reach that far — a new repeat rule is the
  // whole series' alone; `note` says why.
  bool enabled = 4;
  string note = 5;
}

// "This event is no longer on your calendar": the answer has no such
// occurrence — cancelled, moved or deleted since it was picked.
message AgendaGone {
  string title = 1;
  string body = 2;
  string action_label = 3;
}

// A button on the detail. `key` is what `ActionPicked` carries.
message AgendaAction {
  string key = 1;
  string label = 2;
  bool enabled = 3;
  // Drawn in the `net` hue (the cancel).
  bool destructive = 4;
  string accessibility_label = 5;
  // WHERE THE BUTTON GOES, when it opens a page: `edit` is the editor on this
  // occurrence, pushed by the shell, and sends no event. Absent on `cancel`,
  // which is `ActionPicked`.
  optional Route route = 6;
}

// `agenda.event`. Its arguments are its `Route`; this is only what it shows.
message AgendaEventState {
  oneof content {
    Loading loading = 6;
    Failure failure = 7;
    Denied denied = 8;
    AgendaEventData data = 9;
    AgendaGone gone = 10;
  }
  Sheet sheet = 12;
  // The confirm step for cancelling an event that does not repeat. Absent
  // otherwise: a series' confirm is the scope sheet itself.
  optional Confirm confirm = 13;
  // The scope sheet's rows, while it is up.
  repeated AgendaScopeChoice cancel_scopes = 14;
  AgendaEventChrome chrome = 16;
  // THE SCREEN IS DONE — a cancellation committed. The shell pops.
  bool dismissed = 17;
  // The scope sheet's commit button is armed (a scope is picked).
  bool cancel_armed = 18;
  // What the last write came to when the vault refused it: the core's own
  // sentence. Absent otherwise; a commit shows in the data.
  optional StatusLine status = 19;
  // "Earlier versions   2 ›" at the foot of the page (#1185); absent when there are none.
  optional EarlierEntry earlier = 20;
  // Where it came from, under the Earlier versions entry (#1185). Absent for a typed item.
  optional OriginLine origin = 21;

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_CANCEL_SCOPE = 2;
  }
}

message AgendaEventChrome {
  string title = 1;
  // The back control names the page it returns to: "Agenda".
  string back = 2;
  string loading = 3;
  string retry = 4;
  string scope_title = 5;
  string scope_body = 6;
  string scope_commit = 7;
  string scope_keep = 8;
  string confirm_keep = 9;
}

message AgendaEventData {
  string title = 1;
  // "Wednesday 11 March", or "Wednesday 11 March – Friday 13 March".
  string date_label = 2;
  // "08:15 – 09:45" / "08:15" / "All day".
  string when_label = 3;
  string calendar_name = 4;
  string calendar_hue_key = 5;
  // Label and value rows, in the handoff's order: repeats, location (the
  // place's name), joining link, reminder, second reminder, availability (only
  // when free), time zone (only when it is not the phone's), travel time,
  // calendar. A row with nothing to say is absent.
  repeated AgendaFact facts = 6;
  string notes = 7;
  // "3 guests · 1 awaiting". Empty with no guests.
  string guest_heading = 9;
  repeated AgendaGuestRow guests = 10;
  // The member's own reply, when they are a guest.
  optional AgendaRsvp rsvp = 11;
  repeated AgendaAction actions = 12;
  bool is_past = 13;
  // "Survey walk-through, Wednesday 11 March, 08:15 to 09:45, repeats".
  string accessibility_label = 14;
  // The joining link itself, for the view to open.
  string call_uri = 15;
  // The button that opens `call_uri`: "Join call". Empty with no link.
  string call_label = 16;
  // WAVE 2 (#1173). The attachments section: photos and files on the event.
  AgendaAttachmentsSection attachments = 17;
  // "2 guests on your calendar". Empty when the phone's calendar names none.
  string followed_heading = 18;
  // The guests the phone's calendar states for an event the vault follows,
  // read-only.
  repeated AgendaFollowedGuestRow followed_guests = 19;
  // WHAT THE PHONE SAYS (#1183), only where the member's value differs from the phone's, each
  // under the field or list it belongs to. The title, under the title.
  optional PhoneSays title_phone_says = 20;
  // Under the date and time: the start and the end.
  repeated PhoneSays when_phone_says = 21;
  // Under the notes.
  optional PhoneSays notes_phone_says = 22;
  // Under the facts: the zone, the repeat, the joining link, availability and the alerts.
  repeated PhoneSays facts_phone_says = 23;
  // Under the guests: a guest whose reply the member changed ("Phone says ...") and one they
  // took off ("Phone still has ..."). A guest the member added has no line.
  repeated PhoneSays guests_phone_says = 24;
  // THE "…" MENU in the top bar (#1185): the verbs that do not fit the bar of three, in order
  // (Share). Same shape as `actions`; empty draws no key. `menu_label` names the key ("More").
  repeated AgendaAction menu = 25;
  string menu_label = 26;
}

// One guest the phone's calendar states: a name or an address, and the reply
// in words. Nothing on it is editable.
message AgendaFollowedGuestRow {
  // The name, else the address, else "Guest".
  string name = 1;
  // The address, when the name is the line above it; else empty.
  string detail = 2;
  string initial = 3;
  string reply_label = 4;
  string hue_key = 5;
  string accessibility_label = 6;
}

// THE ATTACHMENTS SECTION of an event or a task page (#1173): what is attached,
// a page at a time, and the controls that attach and detach. Shared by both
// pages so the two shells draw it once.
message AgendaAttachmentsSection {
  // "Attachments", or "Attachments · 3" once some are counted.
  string heading = 1;
  repeated AgendaAttachmentTile items = 2;
  // "Nothing attached yet." Empty while there are items or the read is out.
  string empty_label = 3;
  string add_photo_label = 4;
  string add_file_label = 5;
  // Another page of attachments exists.
  bool has_more = 6;
  string more_label = 7;
  // An add is under way (the picker is up or the file is being kept): the
  // controls are off and `busy_label` says what is happening. Empty otherwise.
  bool busy = 8;
  string busy_label = 9;
  // The confirm for removing one attachment, while it is asked. The photo or
  // file itself stays in Photos or Docs, and the words say so.
  optional Confirm remove_confirm = 10;
  // The sentence for an add the platform or the vault refused. Absent otherwise.
  optional StatusLine status = 11;
  // "Add photo" / "Add file" icon keys (`design/icons.toml`).
  string add_photo_icon_key = 12;
  string add_file_icon_key = 13;
}

// One attachment, as a tile or a row draws it.
message AgendaAttachmentTile {
  // The attached photo's or document's id: what remove names.
  string attachment_id = 1;
  string title = 2;
  // "PDF · 2.4 MB", "Photo · 1.2 MB".
  string meta = 3;
  // `photo` or `document`.
  string kind = 4;
  // The file that draws a thumbnail, when this phone holds one. Empty: draw
  // the kind's icon tile (`icon_key`).
  string thumbnail_path = 5;
  string icon_key = 6;
  // The kind badge on a document's tile: "PDF", "Text". Empty for a photo.
  string badge = 7;
  // WHERE A TAP GOES: the photo's viewer or the document's page.
  Route route = 8;
  string accessibility_label = 9;
  // "Remove", and what a screen reader says of it.
  string remove_label = 10;
  string remove_accessibility_label = 11;
}

// What either page's attachments section sends back.
message AgendaAttachmentEvent {
  oneof kind {
    // Asks the shell for a photo (`PickFile` with `KIND_PHOTO`), then attaches it.
    AddPhoto add_photo = 1;
    // Asks the shell for a file (`PickFile` with `KIND_UPLOAD`), then attaches it.
    AddFile add_file = 2;
    // Opens the remove confirm for one attachment.
    RemoveAsked remove_asked = 3;
    RemoveConfirmed remove_confirmed = 4;
    RemoveDismissed remove_dismissed = 5;
    // The next page.
    ShowMore show_more = 6;
    // The status sentence is put away.
    StatusDismissed status_dismissed = 7;
  }

  message AddPhoto {}

  message AddFile {}

  message RemoveAsked {
    string attachment_id = 1;
  }

  message RemoveConfirmed {}

  message RemoveDismissed {}

  message ShowMore {}

  message StatusDismissed {}
}

message AgendaGuestRow {
  string party_id = 1;
  string name = 2;
  string initial = 3;
  string reply_label = 4;
  string hue_key = 5;
  // 6 was `is_you`: nothing read it (#1152).
  reserved 6;
  reserved "is_you";
  string accessibility_label = 7;
}

message AgendaRsvp {
  string question = 1;
  repeated AgendaRsvpChoice choices = 2;
  // "Your answer is for every occurrence." on a series.
  string note = 3;
}

message AgendaRsvpChoice {
  // `accepted`, `tentative` or `declined` — what `RsvpPicked` carries.
  string partstat = 1;
  string label = 2;
  // The answer on record.
  bool selected = 3;
  bool enabled = 4;
}

message AgendaEventEvent {
  oneof kind {
    // Read again (the failure's retry).
    Refreshed refreshed = 2;
    RsvpPicked rsvp = 6;
    // `AgendaAction.key`. `cancel` opens the confirm or the scope sheet and `trash` moves the whole
    // event to the trash at once (#1185). `edit` carries a route and is the shell's push.
    ActionPicked action = 7;
    ScopePicked scope = 8;
    SheetClosed sheet_closed = 9;
    // The confirm, or the scope sheet's commit.
    Confirmed confirmed = 10;
    ConfirmDismissed confirm_dismissed = 11;
    // The attachments section's controls (#1173).
    AgendaAttachmentEvent attachment = 20;
    // "Undo" on the status line after Move to trash or its Undo (#1185).
    StatusActed status_acted = 21;
  }

  message Refreshed {}

  message StatusActed {}

  message RsvpPicked {
    string partstat = 1;
  }

  message ActionPicked {
    string key = 1;
  }

  message ScopePicked {
    AgendaScope scope = 1;
  }

  message SheetClosed {}

  message Confirmed {}

  message ConfirmDismissed {}
}

// `agenda.editor`. Its arguments are its `Route`; this is only what it shows.
message AgendaEditorState {
  Mode mode = 2;
  oneof content {
    Loading loading = 7;
    Failure failure = 8;
    Denied denied = 9;
    AgendaEditorData data = 10;
    AgendaGone gone = 11;
  }
  Sheet sheet = 13;
  // The discard or skip question, while it is asked.
  optional Confirm confirm = 14;
  // 15 was `asking`: nothing read it (#1152).
  reserved 15;
  reserved "asking";
  AgendaEditorChrome chrome = 16;
  // THE EDITOR IS DONE — saved, skipped, or left with nothing to lose. The
  // shell pops.
  bool dismissed = 17;
  // WHAT THIS SITTING ADDS (#1128): an event, or a task. CREATE opens on the
  // kind the route names, else the kind the member last added on this device;
  // the switch at its top moves it. An EDIT is always an event.
  AgendaEditorKind kind = 18;
  // What the last Save came to when the vault refused it: the core's own
  // sentence, over the draft that stays. Absent otherwise.
  optional StatusLine status = 19;

  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_CREATE = 1;
    MODE_EDIT = 2;
  }

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_CALENDAR = 2;
    SHEET_GUESTS = 3;
    SHEET_REPEAT = 4;
    SHEET_REMINDER = 5;
    // Saving a change to one occurrence of a series.
    SHEET_SCOPE = 6;
    // A task's list (#1173).
    SHEET_LIST = 7;
    // THE CUSTOM REPEAT SHEET (#1173 wave 2): frequency, every N, weekdays,
    // the monthly mode and the end, over a live sentence.
    SHEET_CUSTOM_REPEAT = 8;
    // The event's place, chosen from the vault's places.
    SHEET_LOCATION = 9;
    // The second alert; drawn only once the first is set.
    SHEET_SECOND_REMINDER = 10;
    // Busy or free.
    SHEET_AVAILABILITY = 11;
    // The event's time zone, from a curated searchable list.
    SHEET_ZONE = 12;
    // Travel time before the event.
    SHEET_TRAVEL = 13;
  }

  enum Asking {
    ASKING_UNSPECIFIED = 0;
    ASKING_NONE = 1;
    ASKING_DISCARD = 2;
    ASKING_SKIP = 3;
  }
}

