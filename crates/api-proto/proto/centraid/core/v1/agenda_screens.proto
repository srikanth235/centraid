    string key = 1;
  }

  // Minutes as text: `0` is none.
  message TravelPicked {
    string key = 1;
  }

  message UrlChanged {
    string text = 1;
  }

  // `daily`, `weekly`, `monthly` or `yearly`.
  message CustomFreqPicked {
    string key = 1;
  }

  message CustomIntervalChanged {
    int32 interval = 1;
  }

  // `MO`..`SU`.
  message CustomWeekdayToggled {
    string key = 1;
  }

  // `date` or `nth`.
  message CustomMonthModePicked {
    string key = 1;
  }

  // `1`..`31`, or `-1` for the last day.
  message CustomMonthDayToggled {
    string key = 1;
  }

  // `1`..`5`, or `-1` for the last.
  message CustomOrdinalPicked {
    string key = 1;
  }

  // `MO`..`SU`.
  message CustomNthWeekdayPicked {
    string key = 1;
  }

  // `never`, `on` or `after`.
  message CustomEndPicked {
    string key = 1;
  }

  message CustomUntilChanged {
    string day = 1;
  }

  message CustomCountChanged {
    int32 count = 1;
  }

  // Done: the working rule goes to the draft when it is whole.
  message CustomApplied {}

  // "Replace this rule": a rule the sheet cannot show becomes an editable one.
  message CustomReplaceTapped {}

  message ListPicked {
    string key = 1;
  }

  message PriorityPicked {
    string key = 1;
  }

  message TagAdded {
    string text = 1;
  }

  message TagRemoved {
    string text = 1;
  }

  message MoreDetailsToggled {}

  // The Event | Task switch (#1128). Ignored on an EDIT.
  message KindPicked {
    AgendaEditorKind kind = 1;
  }

  message Refreshed {}

  message TitleChanged {
    string text = 1;
  }

  message NotesChanged {
    string text = 1;
  }

  message AllDayToggled {
    bool on = 1;
  }

  // What the start picker chose: `YYYY-MM-DD` and `HH:MM` (ignored all-day).
  message StartChanged {
    string day = 1;
    string time = 2;
  }

  message EndChanged {
    string day = 1;
    string time = 2;
  }

  message CalendarPicked {
    string calendar_id = 1;
  }

  message GuestToggled {
    string party_id = 1;
  }

  message RepeatPicked {
    string key = 1;
  }

  message ReminderPicked {
    string key = 1;
  }

  message LinkChanged {
    string text = 1;
  }

  message SheetOpened {
    AgendaEditorState.Sheet sheet = 1;
  }

  message SheetClosed {}

  message SaveTapped {}

  message ScopePicked {
    AgendaScope scope = 1;
  }

  message SkipTapped {}

  message LeaveRequested {}

  message Confirmed {}

  message ConfirmDismissed {}
}

// A task's box.
enum TodoCheck {
  TODO_CHECK_UNSPECIFIED = 0;
  TODO_CHECK_OPEN = 1;
  TODO_CHECK_DONE = 2;
  // Released: drawn `–`, in the Logbook only.
  TODO_CHECK_WONT_DO = 3;
  TODO_CHECK_IN_PROCESS = 4;
}

// ONE TASK AS A ROW, finished. A root carries its family in `children`.
message TodoRow {
  string task_id = 1;
  string title = 2;
  // "2 days ago", "Today", "09:00", "Tomorrow", "Fri 14 March"; empty undated.
  string due_label = 3;
  // `due_label` in the attention tone. Never red, never a count.
  bool overdue = 4;
  // One clamped line: "Home · Daily · missed 2 · next is Fri 14 March ·
  // reminder Tomorrow 08:30 · ~25 min · #errand · 2 of 5 · sitting since March".
  string meta = 5;
  // "!!!", "!!", "!", or empty: no room is reserved for a priority.
  string priority_label = 6;
  // The project's hue key for the 6px dot; empty when unfiled.
  string project_hue_key = 7;
  TodoCheck check = 8;
  // What the box does: "Mark Buy milk done" / "Reopen Buy milk".
  string check_label = 9;
  string accessibility_label = 10;
  bool subtask = 12;
  repeated TodoRow children = 13;
  // A long press offers "Move to project" (open roots only).
  bool can_file = 14;
  // WHERE A TAP GOES: this task's page, as the route the shell pushes.
  Route route = 16;
  // The task carries the Flag (#1173): the row draws the flag glyph, and its
  // swipe verb is `unflag_verb` instead of `flag_verb`.
  bool flagged = 17;
  // The list's colour key (`blue`, `raspberry`, ... the `[list]` names in
  // `design/tokens.toml`) for the check circle and the dot; empty when the
  // task is in no list.
  string list_color_key = 18;
  // The row is Calendar's reminder, shown on its day (round 10): its box does not check it off,
  // a tap on the box or the row pushes `route` (Reminders' page for it).
  bool read_only = 19;
}

// A group of rows under one head.
message TodoRowGroup {
  // Stable across answers, for list item keys.
  string key = 1;
  // "Overdue", "Today", "Tomorrow", "Wed 11 March", a project's name, "Done".
  string title = 2;
  // The count, as digits.
  string meta = 3;
  // "April 2026" on the first group of a month the list had not shown yet.
  optional string month_heading = 4;
  // At most one quiet verb: "Catch up" on Overdue, "Add task" on a section.
  // Empty for none; `GroupVerb` sends `verb_key` back.
  string verb_label = 5;
  string verb_key = 6;
  // 7 was `section_id`: nothing read it (#1152).
  reserved 7;
  reserved "section_id";
  repeated TodoRow rows = 8;
}

message TodoFact {
  string label = 1;
  string detail = 2;
}

// One row of a choice sheet: a filing target, a More row, a field choice.
message TodoChoice {
  // What the choice event sends back.
  string key = 1;
  string label = 2;
  string meta = 3;
  bool selected = 4;
  bool enabled = 5;
  // A section under its project.
  bool indented = 6;
  string icon_key = 7;
}

// Every fixed word a Tasks screen draws, so no view carries copy.
message TodoChrome {
  string title = 1;
  string retry = 2;
  // The skeleton's accessibility label.
  string loading = 3;
  string search_placeholder = 4;
  string search_label = 5;
  string search_close = 6;
  string more_title = 7;
  string reads_title = 8;
  repeated TodoFact reads_facts = 9;
  string quick_add_placeholder = 10;
  string quick_add_verb = 11;
  string file_title = 12;
  // 13 to 15 were `new_project_title`, `new_project_placeholder` and
  // `new_project_verb`: the style sheet carries its own words.
  reserved 13, 14, 15;
  reserved "new_project_title", "new_project_placeholder", "new_project_verb";
  string add_section_title = 16;
  string add_section_placeholder = 17;
  string add_section_verb = 18;
  string cancel = 19;
  // The band's home capsule.
  string home = 20;
  string show_more = 21;
  // A pushed page's back control: the app it was pushed from, "Agenda".
  string back = 22;
  // The verbs beside the detail's subtask and tag entries.
  string add_subtask_verb = 23;
  string add_tag_verb = 24;
  // A row's filing verb (`TodoRow.can_file`), "Move to project": a
  // long press on the row offers it.
  string file_verb = 25;
  // THE ROW'S SWIPE (#1173): Details, Flag, Delete. The same verbs sit on the
  // long press as a context menu.
  string details_verb = 26;
  string flag_verb = 27;
  string unflag_verb = 28;
  string delete_verb = 29;
  // The inline add row's placeholder on a list page, "New Reminder".
  string new_reminder = 30;
  // Completed work on a list: "Show", "Hide" and "Clear".
  string show_completed_verb = 31;
  string hide_completed_verb = 32;
  string clear_completed_verb = 33;
  // The non-drag way to reorder (a screen reader's action, a long-press item).
  string move_up_verb = 34;
  string move_down_verb = 35;
}

// A list's completed work (#1173): a one-line summary with Show/Hide and Clear.
// The rows are present only while shown.
message TodoCompleted {
  // "2 completed"; the summary is drawn only when `count` > 0.
  uint32 count = 1;
  string count_label = 2;
  bool shown = 3;
  repeated TodoRow rows = 4;
}

// A notice over a list: one sentence and at most one verb.
message TodoNotice {
  string sentence = 1;
  string verb_label = 2;
  // What `NoticeActed` means: `catch_up`.
  string verb_key = 3;
}

// The quick-add bar: a bare title, and where it lands.
message TodoQuickAdd {
  // What the member typed. Cleared when an add is submitted.
  string title = 1;
  // The Add verb is live: a title that is not blank.
  bool can_submit = 2;
  // Where the task lands, as the field's placeholder: "Add to Today" /
  // "Add to Inbox" / "Add to Garden · Beds".
  string lands_label = 3;
  // False where nothing can be added (denied, loading the first page). On
  // To-do it governs the header's Plus; the bar itself waits for `drawn`.
  bool shown = 4;
  // The field takes the keyboard when drawn: the Plus opened it, or it was
  // opened with words already in it (Notes' "Send to Tasks").
  bool focused = 5;
  // The header's Plus (R-CHROME-1), drawn while the bar is `shown`: what a
  // screen reader says for it, "Add task". A tap opens the bar on the
  // keyboard (`QuickAddOpened`). Empty on a pushed page.
  string add_label = 6;
  // The bar is drawn. On Agenda's To-do only after the Plus (or Notes' "Send
  // to Agenda") opened it, until the keyboard leaves an empty field
  // (`QuickAddClosed`); a pushed page, which has no Plus, keeps it open.
  bool drawn = 7;
  // THE KEYBOARD TOOLBAR (#1173), drawn over the keyboard while the field
  // has it: Date, Tag and Flag. Each stages what the next add carries; Return
  // adds it, clears the field and keeps the keyboard for the next one.
  repeated TodoQuickTool tools = 8;
  // What the next add carries, under the field: "Tomorrow · #errand ·
  // Flagged"; empty when nothing is staged.
  string staged_label = 9;
  // The tool that is open: `date` draws `due_choices`, `tag` a tag field;
  // empty for none.
  string open_tool = 10;
  // Today, Tomorrow, This weekend, Next week, No date.
  repeated TodoChoice due_choices = 11;
  // The tag field's placeholder, "Add a tag".
  string tag_placeholder = 12;
  // THE DATE CHIP (#1173): what the typed words will save as, shown before the
  // member taps Add. Absent when no phrase was read, or the member dismissed it
  // for these words.
  QuickAddChip chip = 13;
}

// One key of the quick add's keyboard toolbar.
message TodoQuickTool {
  // `date`, `tag`, `flag`.
  string key = 1;
  // The spoken name: "Date", "Tag", "Flag".
  string label = 2;
  string icon_key = 3;
  // Something is staged (a due, a tag, the flag): drawn filled.
  bool on = 4;
}

// What a quick add will save, read from the typed words: the day (and time) and
// the repeat as a pill under the field, and the title that is left.
message QuickAddChip {
  // "Tomorrow, 09:00" / "Every Monday, 09:00".
  string label = 1;
  // The title that will be saved, "Call mom".
  string title = 2;
  // The spoken label of the ×: "Keep as text".
  string dismiss_label = 3;
  // The whole chip for a screen reader: "Due Tomorrow, 09:00. Saves as Call mom."
  string spoken = 4;
  // The phrase repeats.
  bool repeats = 5;
  // The line under the chip: "Saves as “Call mom”, due Tomorrow, 09:00".
  string saves_as = 6;
}

// The chip's ×, for either quick-add bar: the words stay the title, undated,
// until the member types a different phrase.
message QuickAddChipDismissed {}

// THE STYLE SHEET (#1173 wave 2): one sheet for making or editing a list or a
// calendar. The core holds the draft; a shell draws the name field, the colour
// swatches and the icon grid, and sends the member's picks. Colours are the
// `[list]` palette KEYS (a shell looks up the colour), icons are
// `design/icons.toml` KEYS.
message AgendaStyleSheet {
  // "New list", "Edit list", "New calendar", "Edit calendar".
  string title = 1;
  // What the name field holds.
  string name = 2;
  string name_placeholder = 3;
  // Create or Save is armed: the name is not empty and, when editing, something changed.
  bool can_submit = 4;
  // "Create" or "Save".
  string submit_label = 5;
  string color_label = 6;
  // The eight palette colours, in the palette's order, one selected.
  repeated AgendaStyleSwatch colors = 7;
  string icon_label = 8;
  // The curated icons, in order; none is selected when the list wears none.
  repeated AgendaStyleIcon icons = 9;
  // "No icon": the row that clears the icon; `no_icon_selected` while none is chosen.
  string no_icon_label = 10;
  bool no_icon_selected = 11;
  // The preview: the chosen colour key and icon key (empty for none).
  string color_key = 12;
  string icon_key = 13;
  // The sheet's close verb, "Cancel".
  string cancel_label = 14;
}

message AgendaStyleSwatch {
  // `blue`, `mustard` ... — the `[list]` names.
  string key = 1;
  // The spoken name, "Blue".
  string label = 2;
  bool selected = 3;
}

message AgendaStyleIcon {
  // A `design/icons.toml` key.
  string key = 1;
  // The spoken name, "Calendar".
  string label = 2;
  bool selected = 3;
}

// One area's projects on To-do (`AgendaTodo.projects`).
message TodoProjectGroup {
  string key = 1;
  // An area's name, or "Projects" for those in none.
  string title = 2;
  repeated TodoProjectRow rows = 3;
}

// One project on To-do: the kit's row, and the page a tap pushes.
message TodoProjectRow {
  ListRow row = 1;
  // `agenda.project`, named so its head has words before the read lands.
  Route route = 2;
  // The list's colour key (the `[list]` names): the big count and the dot.
  string list_color_key = 3;
  // The open count as digits.
  string count = 4;
  // A `design/icons.toml` key the member chose; empty for none.
  string icon_key = 5;
}

// `agenda.todo_list`: Anytime, All, Logbook or Reminders. The route names the
// view (`TodoListRoute.view`).
message TodoListState {
  TodoView view = 2;
  // "Anytime", "All", "Logbook", "Reminders".
  string title = 3;
  oneof content {
    Loading loading = 4;
    Failure failure = 5;
    Denied denied = 6;
    TodoListData data = 7;
  }
  TodoChrome chrome = 8;
  StatusLine status = 9;
  // THE SMART LIST'S COLOUR (#1173): a token name (`listBlue`) the page's large title is drawn
  // in, the same colour as the list's card on the Reminders home; empty for a view with none.
  string color_key = 10;
  // THE HEADER PLUS: its accessibility label ("Add task") and the add sheet it pushes, on
  // the core's today. Empty while the page has no data to add against.
  string add_label = 11;
  optional Route add_route = 12;
}

message TodoListData {
  string today = 1;
  repeated TodoRowGroup groups = 2;
  // Present only when no group has a row: what this view says when empty.
  optional EmptyState empty = 3;
  string count_label = 4;
  // "100 tasks · more not shown" when the window is not everything.
  string window_label = 5;
  bool can_show_more = 6;
  // Today's date line: "Wednesday 4 November · 5 to do · 1 done"; empty on
  // the other views.
  string subtitle = 7;
}

message TodoListEvent {
  oneof kind {
    // The failure's "Try again".
    Refreshed refreshed = 2;
    RowChecked row_checked = 3;
    StatusActed status_acted = 4;
    NextPageRequested next_page = 10;
    // THE SWIPE (#1173): Flag/Unflag and Delete (to the trash, with Undo).
    RowFlagged row_flagged = 11;
    RowDeleted row_deleted = 12;
    // A group's quiet verb (#1173): "Catch up" on Overdue opens the Catch up page.
    GroupVerb group_verb = 13;
  }

  // A group's `verb_key`, sent back as the project page sends it.
  message GroupVerb {
    string key = 1;
  }

  // The row's flag is set (`flagged` true) or cleared.
  message RowFlagged {
    string task_id = 1;
    bool flagged = 2;
  }

  message RowDeleted {
    string task_id = 1;
  }

  message Refreshed {}

  // Open views: complete. The Logbook: reopen.
  message RowChecked {
    string task_id = 1;
  }

  // The status line's verb: Undo.
  message StatusActed {}

  // "Show more": the window widens by a page.
  message NextPageRequested {}
}

// `agenda.project`: one project, its sections and a quick add into them.
message TodoProjectState {
  // 2 was `project_id`: nothing read it (#1152).
  reserved 2;
  reserved "project_id";
  // The name, riding along from the route until the answer names it.
  string title = 3;
  oneof content {
    Loading loading = 4;
    Failure failure = 5;
    Denied denied = 6;
    TodoProjectData data = 7;
  }
  TodoChrome chrome = 8;
  StatusLine status = 9;
  TodoQuickAdd quick_add = 10;
  Sheet sheet = 11;
  // The words typed in the Add section sheet.
  string new_section_name = 12;
  bool new_section_can_submit = 13;
  // 14 was `target_section_id`: nothing read it (#1152).
  reserved 14;
  reserved "target_section_id";
  // The words typed in the Rename sheet, from the project's own name.
  string rename_name = 15;
  bool rename_can_submit = 16;
  // THE STYLE SHEET (#1173 wave 2), set while `sheet` is SHEET_STYLE.
  AgendaStyleSheet style = 17;

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_ADD_SECTION = 2;
    SHEET_RENAME = 3;
    // Name, colour and icon of this list.
    SHEET_STYLE = 4;
  }
}

message TodoProjectData {
  string today = 1;
  // Unsectioned first (when it has rows), then EVERY section in its order,
  // an empty one included — each with the "Add task" verb.
  repeated TodoRowGroup groups = 2;
  // Present when the project has no row and no section, or is gone.
  optional EmptyState empty = 3;
  string count_label = 4;
  // "Add section".
  string add_section_label = 5;
  // False when the answer names no live project by this id.
  bool found = 6;
  // The Rename sheet's words: the header verb, the sheet title, the field
  // placeholder and the submit verb.
  string rename_label = 7;
  string rename_title = 8;
  string rename_placeholder = 9;
  string rename_verb = 10;
  // The list's colour key (the `[list]` names): the title is drawn in it.
  string list_color_key = 11;
  // Completed work in this list; `count` 0 draws nothing.
  TodoCompleted completed = 12;
  // The list's own icon, drawn beside the title; empty for none.
  string icon_key = 13;
  // The header verb that opens the style sheet: "Edit list".
  string style_label = 14;
}

message TodoProjectEvent {
  oneof kind {
    Refreshed refreshed = 2;
    RowChecked row_checked = 3;
    StatusActed status_acted = 4;
    QuickAddChanged quick_add_changed = 5;
    QuickAddSubmitted quick_add_submitted = 6;
    GroupVerb group_verb = 7;
    AddSectionRequested add_section = 8;
    SectionNameChanged section_name = 9;
    SectionSubmitted section_submitted = 10;
    SheetClosed sheet_closed = 11;
    RenameRequested rename = 12;
    RenameNameChanged rename_name = 13;
    RenameSubmitted rename_submitted = 14;
    // #1173: the swipe, drag to reorder, and the completed summary.
    RowFlagged row_flagged = 15;
    RowDeleted row_deleted = 16;
    RowMoved row_moved = 17;
    CompletedToggled completed_toggled = 18;
    CompletedCleared completed_cleared = 19;
    // THE KEYBOARD TOOLBAR (#1173), as on Agenda's home.
    QuickToolPicked quick_tool = 20;
    QuickDuePicked quick_due = 21;
    QuickTagAdded quick_tag = 22;
    // The date chip's ×: keep the typed words as the title (#1173).
    QuickAddChipDismissed quick_add_chip_dismissed = 23;
    // THE STYLE SHEET (#1173 wave 2): "Edit list".
    StyleRequested style_requested = 24;
    StyleNameChanged style_name = 25;
    StyleColorPicked style_color = 26;
    StyleIconPicked style_icon = 27;
    StyleSubmitted style_submitted = 28;
  }

  message StyleRequested {}

  message StyleNameChanged {
    string name = 1;
  }

  // `AgendaStyleSwatch.key`.
  message StyleColorPicked {
    string key = 1;
  }

  // `AgendaStyleIcon.key`; EMPTY clears the icon.
  message StyleIconPicked {
    string key = 1;
  }

  // Save.
  message StyleSubmitted {}

  message QuickToolPicked {
    string key = 1;
  }

  message QuickDuePicked {
    string key = 1;
  }

  message QuickTagAdded {
    string text = 1;
  }

  message RowFlagged {
    string task_id = 1;
    bool flagged = 2;
  }

  message RowDeleted {
    string task_id = 1;
  }

  // A row was dropped before `before_id` (empty: at the end of its group).
  // Rust finds the position between the neighbours.
  message RowMoved {
    string task_id = 1;
    string before_id = 2;
  }

  // Show or hide the completed rows.
  message CompletedToggled {}

  // Move the list's completed work to the trash.
  message CompletedCleared {}

  message Refreshed {}

  message RowChecked {
    string task_id = 1;
  }

  message StatusActed {}

  message QuickAddChanged {
    string title = 1;
  }

  message QuickAddSubmitted {}

  // A group's `verb_key`: `add:<section_id>` points the quick add at it.
  message GroupVerb {
    string key = 1;
  }

  message AddSectionRequested {}

  message SectionNameChanged {
    string name = 1;
  }

  message SectionSubmitted {}

  // Closes whichever sheet is up.
  message SheetClosed {}

  message RenameRequested {}

  message RenameNameChanged {
    string name = 1;
  }

  message RenameSubmitted {}
}

// The words the member types. Autosaved (`Autosave`); every other field is a
// write of its own.
message TodoDraft {
  string title = 1;
  string notes = 2;
}

// `agenda.task`: one task, an editor that saves as the member types.
message TodoDetailState {
  string task_id = 2;
  oneof content {
    Loading loading = 3;
    Failure failure = 4;
    Denied denied = 5;
    TodoDetailData data = 6;
    // NO LIVE TASK HAS THE ID — never made, deleted, or in the trash. A
    // state the screen draws ("This task is gone."), not a failed read.
    EmptyState gone = 17;
  }
  Autosave autosave = 7;
  // The confirm on screen, and what it asks about.
  optional Confirm confirm = 11;
  // 12 was `asking`: nothing read it (#1152).
  reserved 12;
  reserved "asking";
  // The field whose choice sheet is up; empty for none.
  string open_field = 13;
  TodoChrome chrome = 14;
  StatusLine status = 15;
  // THE TASK LEFT (deleted): the shell pops.
  bool finished = 16;
  // "Earlier versions   2 ›" at the foot of the page (#1185); absent when there are none.
  optional EarlierEntry earlier = 18;
  // Where it came from, under the Earlier versions entry (#1185). Absent for a typed item.
  optional OriginLine origin = 19;
  // What the phone's Reminders say that differs from this task, each with one tap to take it
  // (#1185); empty when the task is not followed or agrees.
  repeated PhoneSays phone_says = 20;

  enum Asking {
    ASKING_UNSPECIFIED = 0;
    ASKING_NONE = 1;
    ASKING_DELETE = 2;
    ASKING_RELEASE = 3;
  }
}

message TodoDetailData {
  TodoDraft draft = 1;
  TodoCheck check = 2;
  string check_label = 3;
  // "Done", "Won't do", "Started", or empty for open work.
  string status_label = 4;
  // When, Time, Reminder, Repeats, Anchor, Priority, Effort, Project, Tags.
  repeated TodoField fields = 5;
  // "Subtasks · 2 of 5" / "Subtasks".
  string subtasks_label = 6;
  repeated TodoRow subtasks = 7;
  // A top-level task takes subtasks; a subtask does not (one level).
  bool can_add_subtask = 8;
  string subtask_note = 9;
  // The parent, when this is a subtask: its title. The page a tap opens is
  // `parent_route`; 10 was `parent_task_id`, a copy of the id inside it (#1152).
  reserved 10;
  reserved "parent_task_id";
  string parent_title = 11;
  string title_placeholder = 12;
  string notes_placeholder = 13;
  string add_subtask_placeholder = 14;
  string delete_label = 15;
  string release_label = 16;
  // False once released or done: releasing is for open work.
  bool can_release = 17;
  string today = 18;
  // WHERE THE PARENT LINK GOES, as the route the shell pushes; absent on a
  // top-level task.
  optional Route parent_route = 19;
  // WAVE 2 (#1173). The task's address, with the control that opens it. Absent
  // when the task has none.
  optional TodoLink link = 20;
  // The attachments section: photos and files on the task.
  AgendaAttachmentsSection attachments = 21;
  // The Custom repeat sheet, while it is open: the editor's own sheet, over
  // this task's stored rule. Its events go back as `TodoDetailEvent.custom_repeat`.
  optional AgendaCustomRepeatSheet custom_repeat = 22;
  // "Share": the button that hands the task to the OS as a calendar file (#1185).
  string share_label = 23;
}

// A task's address and the one control that opens it in the browser.
message TodoLink {
  // "Link".
  string label = 1;
  // The address as stored, drawn as it is.
  string url = 2;
  // "Open link".
  string open_label = 3;
  string accessibility_label = 4;
}

message TodoField {
  // `when`, `time`, `reminder`, `repeats`, `anchor`, `priority`, `effort`,
  // `project`, `tags` — what `FieldChoice` sends back.
  string key = 1;
  string label = 2;
  // "Tomorrow", "09:00", "Every 2 weeks on Monday", "Never", "—".
  string value = 3;
  // One `--annot` note, or empty.
  string note = 4;
  // Chips, cards or sheet rows, in order.
  repeated TodoChoice choices = 5;
  // The view offers the platform's date (`DatePicked`) or time
  // (`TimePicked`) picker beside the choices.
  bool pick_date = 6;
  bool pick_time = 7;
  // 8 was `raw`: nothing read it (#1152).
  reserved 8;
  reserved "raw";
  // The field takes an edit now (a reminder needs a due, for one).
  bool enabled = 9;
  // Tags: the field offers a text entry (`TagAdded`).
  bool add_text = 10;
  string add_placeholder = 11;
  // Choices open in a sheet (`FieldOpened`) rather than inline.
  bool sheet = 12;
  // What the platform's pickers open on: the civil day (`YYYY-MM-DD`) and
  // wall-clock time (`HH:MM`) the task is due, else today and empty. The
  // machine's values, so a view never reads a clock.
  string day = 13;
  string time = 14;
  // The words on the picker row: "Pick a date" / "Pick a time".
  string pick_label = 15;
  // THE GROUPED CARDS (#1173): the heading of the card this field opens
  // ("Date & time", "Organisation"); empty for a field that continues the
  // card above it.
  string group = 16;
  // A switch row (Flag): `on` is its state, and a tap sends `FieldChoice`
  // with `on` or `off`.
  bool toggle = 17;
  bool on = 18;
}

message TodoDetailEvent {
  oneof kind {
    // The failure's "Try again".
    Refreshed refreshed = 2;
    TitleChanged title = 3;
    NotesChanged notes = 4;
    FieldChoice field_choice = 5;
    DatePicked date_picked = 6;
    TimePicked time_picked = 7;
    FieldOpened field_opened = 8;
    FieldClosed field_closed = 9;
    TagAdded tag_added = 10;
    CheckTapped check = 11;
    SubtaskChecked subtask_checked = 12;
    SubtaskAdded subtask_added = 13;
    DeleteRequested delete = 14;
    ReleaseRequested release = 15;
    Confirmed confirmed = 16;
    Dismissed dismissed = 17;
    StatusActed status_acted = 24;
    // WAVE 2 (#1173): the link's open control, and the attachments section.
    OpenLinkTapped open_link = 30;
    AgendaAttachmentEvent attachment = 31;
    // The Custom repeat sheet's controls: the editor's `custom_*` events, same meaning.
    AgendaEditorEvent custom_repeat = 32;
    // The Share button (#1185): Rust asks the owner check, then hands the calendar file to the OS.
    ShareRequested share_requested = 33;
  }

  message Refreshed {}

  message ShareRequested {}

  // Asks the shell to open the task's address (an `OpenUrl` effect).
  message OpenLinkTapped {}

  message TitleChanged {
    string title = 1;
  }

  message NotesChanged {
    string notes = 1;
  }

  // A `TodoChoice.key` of the field `field`.
  message FieldChoice {
    string field = 1;
    string key = 2;
  }

  // `YYYY-MM-DD` from the platform's picker. Closes the open field.
  message DatePicked {
    string day = 1;
  }

  // `HH:MM` from the platform's picker. Closes the open field.
  message TimePicked {
    string time = 1;
  }

  message FieldOpened {
    string field = 1;
  }

  message FieldClosed {}

  message TagAdded {
    string label = 1;
  }

  message CheckTapped {}

  message SubtaskChecked {
    string task_id = 1;
  }

  message SubtaskAdded {
    string title = 1;
  }

  message DeleteRequested {}

  message ReleaseRequested {}

  message Confirmed {}

  message Dismissed {}

  // The status line's verb: Undo.
  message StatusActed {}
}

// `agenda.catch_up`: what came due, what repeats and is behind, what has sat.
message TodoCatchUpState {
  oneof content {
    Loading loading = 2;
    Failure failure = 3;
    Denied denied = 4;
    TodoCatchUpData data = 5;
  }
  TodoChrome chrome = 6;
  StatusLine status = 7;
  optional Confirm confirm = 8;
  // 9 was `asking_pile`: nothing read it (#1152).
  reserved 9;
  reserved "asking_pile";
}

message TodoCatchUpData {
  string today = 1;
  // "16 days away · 34 tasks came due" when the core names an absence; empty
  // otherwise.
  string head = 2;
  // Dated, repeating, sitting — an empty pile is not drawn.
  repeated TodoPile piles = 3;
  // Present only when no pile has a row.
  optional EmptyState empty = 4;
}

message TodoPile {
  // `dated`, `repeating`, `sitting` — what `CompleteAllTapped` sends.
  string key = 1;
  string title = 2;
  string meta = 3;
  // "Complete all".
  string verb_label = 4;
  repeated TodoRow rows = 6;
}

message TodoCatchUpEvent {
  oneof kind {
    Refreshed refreshed = 2;
    CompleteAllTapped complete_all = 3;
    Confirmed confirmed = 4;
    Dismissed dismissed = 5;
    RowChecked row_checked = 6;
    StatusActed status_acted = 7;
  }

  message Refreshed {}

  message CompleteAllTapped {
    string pile = 1;
  }

  message Confirmed {}

  message Dismissed {}

  message RowChecked {
