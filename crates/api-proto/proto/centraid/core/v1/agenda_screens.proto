}

// THE MEMBER'S VALUES, as the pickers bind them. Days are civil `YYYY-MM-DD`,
// times `HH:MM` on the device's wall clock; the shell never reads a zone.
message AgendaDraft {
  string title = 1;
  string notes = 2;
  bool all_day = 3;
  string start_day = 4;
  string start_time = 5;
  // An ALL-DAY end is the last day, inclusive (`agenda.proto`'s `local_end`).
  string end_day = 6;
  string end_time = 7;
  string calendar_id = 8;
  repeated string guest_ids = 9;
  // `AgendaChoice.key` of the repeat list.
  string repeat_key = 10;
  // `AgendaChoice.key` of the reminder list.
  string reminder_key = 11;
  string link = 12;
  // A TASK's list (#1173): `AgendaChoice.key` of `lists` — a project id, or
  // `inbox`.
  string list_key = 13;
  // A task's priority, 0 (none) to 3.
  int32 priority = 14;
  // A task's tags, as typed, in order.
  repeated string tags = 15;
  // WAVE 2 (#1173).
  // The event's place: a `place` entity id, empty for none.
  string place_id = 16;
  // `AgendaChoice.key` of the second alert list; `none` until the first is set.
  string second_reminder_key = 17;
  // Availability: false is busy (the vault's default), true is free.
  bool free = 18;
  // The IANA zone a timed event's wall clock is in. Empty for a floating
  // event; an all-day event has none.
  string zone = 19;
  // Travel time before the event, in minutes; 0 is none.
  int32 travel_min = 20;
  // A task's address, as typed.
  string url = 21;
  // The rule the `custom` repeat key writes (an RRULE the member never reads).
  string repeat_rule = 22;
}

message AgendaChoice {
  string key = 1;
  string label = 2;
  bool selected = 3;
  string hue_key = 4;
  string accessibility_label = 5;
}

message AgendaEditorData {
  AgendaDraft draft = 1;
  // "New event" / "New task" / "Edit event".
  string heading = 2;
  // "Wednesday 11 March · 08:15" / "Wednesday 11 March": the row, spoken.
  string start_label = 3;
  string end_label = 4;
  string calendar_label = 5;
  string calendar_hue_key = 6;
  repeated AgendaChoice calendars = 7;
  // "Priya Raman, Tom Whitcombe" / "Nobody else".
  string guests_label = 8;
  repeated AgendaChoice guests = 9;
  string repeat_label = 10;
  repeated AgendaChoice repeats = 11;
  // "A repeat rule belongs to the whole series." on a series occurrence.
  string repeat_note = 13;
  string reminder_label = 14;
  repeated AgendaChoice reminders = 15;
  // The save scope sheet's rows (EDIT of a series occurrence).
  repeated AgendaScopeChoice scopes = 16;
  bool dirty = 17;
  bool can_save = 18;
  // Why Save is not armed: "Add a title to save." / "An event must end after
  // it starts." Empty when it is, or when nothing changed.
  string blocked_reason = 19;
  // "Skip this occurrence", on a series occurrence.
  bool show_skip = 20;
  string skip_label = 21;
  string foot_note = 22;
  // The scope sheet's Save is armed (a scope is picked).
  bool scope_armed = 23;
  // The day and the time apart, for a row that draws two pickers:
  // "Wed 11 Mar" (the short form, so the row is one line, as the board writes it) and
  // "08:15" ("8:15 AM" on a 12-hour phone). `start_label` keeps the long, spoken form. The times
  // are empty all-day.
  string start_day_label = 24;
  string start_time_label = 25;
  string end_day_label = 26;
  string end_time_label = 27;
  // THE EVENT | TASK SWITCH (#1128), in order: empty on an EDIT, which has
  // none. The one selected is what this sitting adds.
  repeated AgendaKindChoice kinds = 28;
  // False while a TASK is being added: a task has a title and a due day (and
  // a time, unless "All day" is on) — no end, calendar, guests, repeat,
  // reminder, link or notes. The pickers for those are not drawn.
  bool show_event_fields = 29;
  // The key of the start row: "Starts" for an event, "Due" for a task.
  string start_field_label = 30;
  // THE NEW TASK SHEET (#1173, decided): title and due first, then Notes,
  // List, and a "More details" row that opens priority, repeat and tags. True
  // while a task is being added.
  bool show_task_fields = 31;
  // The list the task lands in, its dot, and the choices (Inbox, then the
  // projects A→Z).
  string list_label = 32;
  string list_hue_key = 33;
  repeated AgendaChoice lists = 34;
  // The More details row is open: priority, repeat and tags are drawn.
  bool more_details_open = 35;
  // The closed row's summary: "Priority, repeat, tags" while nothing is set,
  // else what is ("!! · Every week · #errand").
  string more_details_summary = 36;
  // None, !, !!, !!!.
  repeated AgendaChoice priorities = 37;
  string priority_label = 38;
  // WAVE 2 (#1173). Event fields; empty on a task.
  // The place row: its name, or "None".
  string location_label = 39;
  // The vault's places that match `place_query`, the chosen one marked.
  repeated AgendaChoice places = 40;
  // What the place search holds.
  string place_query = 41;
  // A place is chosen: the sheet draws its clear row.
  bool show_clear_location = 42;
  // The first and second alert. The second is drawn only once the first is set.
  bool show_second_reminder = 43;
  string second_reminder_label = 44;
  repeated AgendaChoice second_reminders = 45;
  string availability_label = 46;
  // Busy, Free.
  repeated AgendaChoice availabilities = 47;
  // The zone row is drawn: a timed event only (an all-day event has none).
  bool show_zone = 48;
  string zone_label = 49;
  // The zones that match `zone_query`, the chosen one marked.
  repeated AgendaChoice zones = 50;
  string zone_query = 51;
  string travel_label = 52;
  // None, 5 minutes … 2 hours.
  repeated AgendaChoice travels = 53;
  // The Custom repeat sheet, while it is open.
  optional AgendaCustomRepeatSheet custom_repeat = 54;
  // A TASK's address row is drawn.
  bool show_url = 55;
  // What Save will write for the address ("https://example.com"), empty when
  // none or when it is refused.
  string url_saved_as = 56;
  // Under the first alert: says no alert will sound when the event is all-day (an alert needs a
  // time). Empty when the event is timed.
  string reminder_note = 57;
}

// THE CUSTOM REPEAT SHEET. Every choice list marks what is picked; the shell
// draws the controls the `show_*` flags name and decides nothing. Each change
// re-derives `summary`.
message AgendaCustomRepeatSheet {
  string title = 1;
  // An existing rule this sheet cannot represent: `summary` says it, nothing is
  // editable, and `replace_label` starts a fresh rule over it.
  bool read_only = 2;
  string replace_label = 3;
  // "Every 2 weeks on Monday and Friday, until 31 December 2026".
  string summary = 4;
  // A sentence when the rule is not whole ("Pick at least one day."); empty
  // when it is.
  string error = 5;
  // Done is armed.
  bool can_apply = 6;
  string done_label = 7;
  // daily, weekly, monthly, yearly.
  repeated AgendaChoice frequencies = 8;
  string frequency_label = 9;
  // "Every" / "week" / "weeks": the stepper's words and its value.
  string interval_label = 10;
  int32 interval = 11;
  string unit_label = 12;
  // Weekly: MO..SU, any number picked.
  bool show_weekdays = 13;
  string weekdays_label = 14;
  repeated AgendaChoice weekdays = 15;
  // Monthly: "On day(s) of the month" or "On the".
  bool show_month_modes = 16;
  repeated AgendaChoice month_modes = 17;
  // Monthly by date: 1..31 and "Last day" (key `-1`), any number picked.
  bool show_month_days = 18;
  string month_days_label = 19;
  repeated AgendaChoice month_days = 20;
  // Monthly "On the": first..fifth, last, then a weekday.
  bool show_nth = 21;
  repeated AgendaChoice ordinals = 22;
  repeated AgendaChoice nth_weekdays = 23;
  // Never, On a date, After N times.
  string ends_label = 24;
  repeated AgendaChoice end_modes = 25;
  bool show_until = 26;
  // `YYYY-MM-DD`, and the day spoken.
  string until_day = 27;
  string until_day_label = 28;
  bool show_count = 29;
  int32 count = 30;
  // "times" after the count stepper.
  string count_label = 31;
}

// One side of the Event | Task switch (#1128).
message AgendaKindChoice {
  AgendaEditorKind kind = 1;
  string label = 2;
  bool selected = 3;
  string accessibility_label = 4;
}

message AgendaEditorEvent {
  oneof kind {
    // Read again (the failure's retry).
    Refreshed refreshed = 2;
    TitleChanged title = 6;
    NotesChanged notes = 7;
    AllDayToggled all_day = 8;
    StartChanged start = 9;
    EndChanged end = 10;
    CalendarPicked calendar = 11;
    GuestToggled guest = 12;
    RepeatPicked repeat = 13;
    ReminderPicked reminder = 14;
    LinkChanged link = 15;
    SheetOpened sheet_opened = 16;
    SheetClosed sheet_closed = 17;
    // Save, for an event or a task alike.
    SaveTapped save = 18;
    ScopePicked scope = 19;
    SkipTapped skip = 20;
    // Back or close. With changes it asks; without, it is done.
    LeaveRequested leave = 21;
    Confirmed confirmed = 22;
    ConfirmDismissed confirm_dismissed = 23;
    KindPicked kind_picked = 25;
    // THE NEW TASK SHEET (#1173).
    ListPicked list = 26;
    PriorityPicked priority = 27;
    TagAdded tag_added = 28;
    TagRemoved tag_removed = 29;
    MoreDetailsToggled more_details = 30;
    // WAVE 2 (#1173): the event's place, second alert, availability, zone,
    // travel and a task's address.
    PlaceSearched place_search = 31;
    PlacePicked place = 32;
    PlaceCleared place_cleared = 33;
    SecondReminderPicked second_reminder = 34;
    AvailabilityPicked availability = 35;
    ZoneSearched zone_search = 36;
    ZonePicked zone = 37;
    TravelPicked travel = 38;
    UrlChanged url = 39;
    // THE CUSTOM REPEAT SHEET. Picking the `custom` repeat opens it; each of
    // these changes its working rule and Applied writes it to the draft.
    CustomFreqPicked custom_freq = 40;
    CustomIntervalChanged custom_interval = 41;
    CustomWeekdayToggled custom_weekday = 42;
    CustomMonthModePicked custom_month_mode = 43;
    CustomMonthDayToggled custom_month_day = 44;
    CustomOrdinalPicked custom_ordinal = 45;
    CustomNthWeekdayPicked custom_nth_weekday = 46;
    CustomEndPicked custom_end = 47;
    CustomUntilChanged custom_until = 48;
    CustomCountChanged custom_count = 49;
    CustomApplied custom_applied = 50;
    CustomReplaceTapped custom_replace = 51;
  }

  // The place search field changed: the list narrows.
  message PlaceSearched {
    string text = 1;
  }

  // `AgendaChoice.key` of `places` (a place id).
  message PlacePicked {
    string key = 1;
  }

  message PlaceCleared {}

  message SecondReminderPicked {
    string key = 1;
  }

  // `busy` or `free`.
  message AvailabilityPicked {
    string key = 1;
  }

  message ZoneSearched {
    string text = 1;
  }

  // `AgendaChoice.key` of `zones`: an IANA zone id, or `floating`.
