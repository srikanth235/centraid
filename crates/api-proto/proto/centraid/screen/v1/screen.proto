// ---------------------------------------------------------------------------
// --- People ---
// ---------------------------------------------------------------------------
//
// People on the phone (#1029 app port): `people.home` (People and Touch, with
// search as a field and More as a sheet), `people.person` (one sheet, its
// write sheets and confirms), `people.editor` (the profile, autosaved) and
// `people.trash` (the kit's `TrashListState`, with People's spec). Reads are
// `app_query.proto`'s five People arms; writes are `people.*` commands and
// `core.merge_party`.
//
// VIEWS DECIDE NOTHING. Every label, sentence, chip, hue key, accessibility
// label and enabled flag below is computed by the People machines in
// `dev.centraid.shared.apps.people`. The core's typed answers never cross:
// `screen.proto` cannot import `centraid.core.v1` (the Agenda section's
// header), so each screen's reads object folds them into the `*Data`
// messages here, and the machine decorates what depends on local state (the
// selected chip, a star in flight, a sheet's fields).
//
// NO SHARING PLANE (#1029 amendment): no Linked chips, no Vaults rail, no
// share or revoke. A party with no People profile (a face-review party) is
// not in any list here — the core's ruling in `app_query/people.rs`.

// The roster's chip, as a parameter the read carries.
enum PeopleChipKey {
  PEOPLE_CHIP_KEY_UNSPECIFIED = 0;
  PEOPLE_CHIP_KEY_ALL = 1;
  PEOPLE_CHIP_KEY_STARRED = 2;
  PEOPLE_CHIP_KEY_DUE = 3;
}

// The roster's order.
enum PeopleOrder {
  PEOPLE_ORDER_UNSPECIFIED = 0;
  // Newest-added first.
  PEOPLE_ORDER_RECENT = 1;
  PEOPLE_ORDER_NAME = 2;
}

// What a tap on a channel asks the SHELL to do. Calling, mailing and opening
// a map are platform acts; the machine only names the intent and the value.
enum PeopleChannelIntent {
  PEOPLE_CHANNEL_INTENT_UNSPECIFIED = 0;
  PEOPLE_CHANNEL_INTENT_CALL = 1;
  PEOPLE_CHANNEL_INTENT_MAIL = 2;
  PEOPLE_CHANNEL_INTENT_MAP = 3;
  // A handle or an unknown kind: copy the value.
  PEOPLE_CHANNEL_INTENT_COPY = 4;
}

// One tab of People's band: `people`, `touch`, `more`.
message PeopleBandTab {
  string key = 1;
  string label = 2;
  // A `design/native-catalog.json` icon key.
  string icon_key = 3;
  bool current = 4;
}

// An avatar, finished: initials and a party-hue key, never a stored colour.
message PeopleAvatar {
  string initials = 1;
  string hue_key = 2;
}

// ONE PERSON AS A LIST DRAWS THEM: the roster and search.
message PeopleRow {
  string party_id = 1;
  string name = 2;
  PeopleAvatar avatar = 3;
  // The role line; empty draws nothing.
  string role = 4;
  // "Last touch 12 days ago" / "No touch logged yet".
  string meta = 5;
  // "Overdue" (net) and the next reminder within a month ("Birthday · in 3
  // days"). In draw order.
  repeated StatusChip chips = 6;
  // The due marker.
  bool due = 7;
  // WHAT TO DRAW: the vault's star, or the one a write in flight asks for.
  bool starred = 8;
  bool star_pending = 9;
  // The star control's accessibility label: "Star Dana" / "Remove star from
  // Dana".
  string star_label = 10;
  string accessibility_label = 11;
  // The vault's own star, which `starred` overlays. The machine's; a view
  // never reads it.
  bool vault_starred = 12;
}

// One filter chip, with its count over the whole window.
message PeopleChip {
  PeopleChipKey key = 1;
  string label = 2;
  uint32 count = 3;
  bool selected = 4;
  string accessibility_label = 5;
}

message PeopleRosterData {
  repeated PeopleChip chips = 1;
  repeated PeopleRow rows = 2;
  // Set exactly when `rows` is empty: day one (with "Add person"), or the
  // chip's own sentence.
  optional EmptyState empty = 3;
  // "12 people · 3 to reconnect · 2 starred" ("shown" when truncated).
  string status_line = 4;
  bool truncated = 5;
}

// A count tile on Touch. `tappable` false draws a figure, not a control.
message PeopleTile {
  string key = 1;
  string label = 2;
  uint32 count = 3;
  // The `net` tone: a consequence, not an alert.
  bool net = 4;
  bool tappable = 5;
  string accessibility_label = 6;
}

// A Reconnect card: who is overdue, and by how much.
message PeopleCardRow {
  string party_id = 1;
  string name = 2;
  PeopleAvatar avatar = 3;
  string role = 4;
  // "3 days over".
  string detail = 5;
  // "Log a touch": sends `LogTouchRequested`.
  string action_label = 6;
  string accessibility_label = 7;
}

message PeopleUpcomingRow {
  string party_id = 1;
  string date_id = 2;
  string name = 3;
  PeopleAvatar avatar = 4;
  // "Birthday".
  string label = 5;
  // "Today" / "Tomorrow" / "In 12 days".
  string when_label = 6;
  // "14 August".
  string day_label = 7;
  string accessibility_label = 8;
}

message PeopleRecentRow {
  string interaction_id = 1;
  string party_id = 2;
  string name = 3;
  PeopleAvatar avatar = 4;
  // "Met up".
  string kind_label = 5;
  string text = 6;
  // "Today" / "Yesterday" / "Wed 11 March".
  string when_label = 7;
  string accessibility_label = 8;
}

message PeopleTouchData {
  repeated PeopleTile tiles = 1;
  SectionHead reconnect_head = 2;
  repeated PeopleCardRow reconnect = 3;
  // One sentence when the rail is empty; empty draws nothing.
  string reconnect_empty = 4;
  SectionHead upcoming_head = 5;
  repeated PeopleUpcomingRow upcoming = 6;
  string upcoming_empty = 7;
  SectionHead recent_head = 8;
  repeated PeopleRecentRow recent = 9;
  string recent_empty = 10;
  // "12 people · 3 overdue".
  string status_line = 11;
  // DAY ONE: nobody in People at all. Drawn instead of the rails.
  optional EmptyState empty = 12;
}

message PeopleHomeData {
  // `YYYY-MM-DD`, the core's.
  string today = 1;
  oneof surface {
    PeopleRosterData roster = 2;
    PeopleTouchData touch = 3;
  }
}

// Search's rows, while a term is answering. Names only (the core's search).
message PeopleSearchData {
  // The term these rows answer.
  string term = 1;
  repeated PeopleRow rows = 2;
  optional EmptyState empty = 3;
}

// A choice on More's sort section.
message PeopleOrderChoice {
  PeopleOrder order = 1;
  string label = 2;
  bool selected = 3;
}

message PeopleHomeChrome {
  string title = 1;
  string add_person = 2;
  string search_label = 3;
  string search_placeholder = 4;
  string search_close = 5;
  string retry = 6;
  string loading = 7;
  string more_title = 8;
  string sort_heading = 9;
  // More's row to the trash.
  string trash_label = 10;
  string home = 11;
}

// One star write in flight on the home screen.
message PeopleStarPending {
  string party_id = 1;
  bool starred = 2;
  string invoke_key = 3;
}

message PeopleHomeState {
  SeatState seat = 1;
  // WHICH LIST (law 2). Search is a field over it and More a sheet.
  Destination destination = 2;
  // The roster's chip and order: request parameters, so a change re-reads.
  PeopleChipKey chip = 3;
  PeopleOrder order = 4;
  SearchField search = 5;
  oneof content {
    Loading loading = 6;
    ReadFailure failure = 7;
    Denied denied = 8;
    PeopleHomeData data = 9;
  }
  Sheet sheet = 10;
  // EMPTY while denied: the gate has no band.
  repeated PeopleBandTab band = 11;
  PeopleHomeChrome chrome = 12;
  WriteState write = 13;
  repeated PeopleStarPending star_pending = 14;
  // Set while a search term is answered; drawn instead of the surface.
  optional PeopleSearchData search_data = 15;
  // ONE READ IN FLIGHT: an answer does not say which request it answers, so a
  // read asked while one is out is queued and the older answer is dropped.
  bool reading = 16;
  bool read_queued = 17;
  // The status line: the last write's outcome or refusal, one sentence.
  string status = 18;
  repeated PeopleOrderChoice order_choices = 19;

  enum Destination {
    DESTINATION_UNSPECIFIED = 0;
    DESTINATION_PEOPLE = 1;
    DESTINATION_TOUCH = 2;
  }

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    // Sort, and the row to the trash.
    SHEET_MORE = 2;
  }
}

message PeopleHomeEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    BandPicked band = 3;
    ChipPicked chip = 4;
    OrderPicked order = 5;
    SearchOpened search_opened = 6;
    SearchTermChanged search_term = 7;
    SearchClosed search_closed = 8;
    SheetOpened sheet_opened = 9;
    SheetClosed sheet_closed = 10;
    StarToggled star = 11;
    TilePicked tile = 12;
    DataArrived data = 13;
    ReadRefused refused = 14;
    Denied denied = 15;
    RowsChanged rows_changed = 16;
    SeatChanged seat_changed = 17;
    WriteSettled write_settled = 18;
    // INTENTS. The machine changes nothing on them; the shell routes them.
    PersonPicked person = 19;
    AddPersonRequested add_person = 20;
    TrashRequested trash = 21;
    LogTouchRequested log_touch = 22;
  }

  message Opened {
    PeopleHomeState.Destination destination = 1;
  }

  message Refreshed {}

  // A band tab by `PeopleBandTab.key`; `more` opens the sheet.
  message BandPicked {
    string key = 1;
  }

  message ChipPicked {
    PeopleChipKey chip = 1;
  }

  message OrderPicked {
    PeopleOrder order = 1;
  }

  message SearchOpened {}

  message SearchTermChanged {
    string term = 1;
  }

  message SearchClosed {}

  message SheetOpened {
    PeopleHomeState.Sheet sheet = 1;
  }

  message SheetClosed {}

  message StarToggled {
    string party_id = 1;
  }

  // A Touch tile by `PeopleTile.key`: lands on People under its chip.
  message TilePicked {
    string key = 1;
  }

  // One read's answer, folded. `data` is absent when the read was a search.
  message DataArrived {
    optional PeopleHomeData data = 1;
    optional PeopleSearchData search = 2;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    string table = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message PersonPicked {
    string party_id = 1;
    string name = 2;
  }

  message AddPersonRequested {}

  message TrashRequested {}

  message LogTouchRequested {
    string party_id = 1;
    string name = 2;
  }
}

// --- people.person -----------------------------------------------------------

// A label and a value on the sheet: "Nickname", "How you met".
message PeopleFact {
  string label = 1;
  string value = 2;
}

message PeopleChannelRow {
  string channel_id = 1;
  // "Phone".
  string kind_label = 2;
  string value = 3;
  // The member's own label ("work"), or empty.
  string label = 4;
  // "preferred", or empty.
  string preferred_label = 5;
  // "Also on Sam's card", or empty.
  string duplicate_note = 6;
  PeopleChannelIntent intent = 7;
  // "Call" / "Email" / "Open map" / "Copy".
  string action_label = 8;
  // The remove control's accessibility label: "Remove this phone".
  string remove_label = 9;
  string accessibility_label = 10;
}

message PeopleDateRow {
  string date_id = 1;
  string label = 2;
  // "14 August".
  string day_label = 3;
  // "Today" / "Tomorrow" / "In 12 days"; empty when the date does not parse.
  string when_label = 4;
  bool reminder_on = 5;
  // "Reminder on" / "Reminder off".
  string reminder_label = 6;
  // The toggle's accessibility label.
  string toggle_label = 7;
  string accessibility_label = 8;
}

message PeopleNoteRow {
  string annotation_id = 1;
  string text = 2;
  string when_label = 3;
}

message PeopleTouchRow {
  string interaction_id = 1;
  string kind_label = 2;
  string text = 3;
  string when_label = 4;
  string accessibility_label = 5;
}

message PeoplePersonData {
  string party_id = 1;
  string name = 2;
  PeopleAvatar avatar = 3;
  string role = 4;
  // "Every 14 days · last touch 3 days ago" / "No cadence · no touch logged yet".
  string cadence_line = 5;
  optional StatusChip due_chip = 6;
  bool starred = 7;
  bool star_pending = 8;
  // "Star" / "Remove star": the control's label.
  string star_label = 9;
  // Nickname and how you met, only those that are set.
  repeated PeopleFact facts = 10;
  SectionHead channels_head = 11;
  repeated PeopleChannelRow channels = 12;
  string channels_empty = 13;
  SectionHead dates_head = 14;
  repeated PeopleDateRow dates = 15;
  string dates_empty = 16;
  SectionHead notes_head = 17;
  repeated PeopleNoteRow notes = 18;
  string notes_empty = 19;
  SectionHead touches_head = 20;
  repeated PeopleTouchRow touches = 21;
  // One sentence: nothing logged, or the log could not be read (the activity
  // plane refused, and the rest of the sheet stands). Empty draws nothing.
  string touches_empty = 22;
  string today = 23;
  // The vault's star, which `starred` overlays. The machine's.
  bool vault_starred = 24;
}

// A pick among fixed choices: a touch kind, a channel kind.
message PeopleKindChoice {
  string key = 1;
  string label = 2;
  bool selected = 3;
}

// What every write sheet on the person carries: its words and its state.
message PeopleSheetFrame {
  string title = 1;
  string submit_label = 2;
  bool submit_enabled = 3;
  string cancel_label = 4;
  // The write's refusal, over the fields that are kept.
  optional ReadFailure failure = 5;
  bool sending = 6;
}

message PeopleLogTouchSheet {
  PeopleSheetFrame frame = 1;
  repeated PeopleKindChoice kinds = 2;
  string note = 3;
  string note_label = 4;
  string note_placeholder = 5;
  // "Logging stamps last contacted."
  string hint = 6;
}

message PeopleNoteSheet {
  PeopleSheetFrame frame = 1;
  string text = 2;
  string placeholder = 3;
}

message PeopleDateSheet {
  PeopleSheetFrame frame = 1;
  string label = 2;
  string label_field = 3;
  // What was typed, `MM-DD` when valid.
  string month_day = 4;
  string month_day_field = 5;
  string month_day_placeholder = 6;
  // The sentence under a month-day that is not a real day; empty when fine.
  string month_day_invalid = 7;
  bool reminder_on = 8;
  string reminder_label = 9;
}

message PeopleChannelSheet {
  PeopleSheetFrame frame = 1;
  repeated PeopleKindChoice kinds = 2;
  string value = 3;
  string value_field = 4;
  string label = 5;
  string label_field = 6;
  bool preferred = 7;
  string preferred_label = 8;
}

message PeopleMergeChoice {
  string party_id = 1;
  string name = 2;
  PeopleAvatar avatar = 3;
  string role = 4;
}

// "Merge in": pick who folds INTO this person. A choices sheet (#1015 D4).
message PeopleMergeSheet {
  string title = 1;
  // "Merging cannot be undone."
  string body = 2;
  string cancel_label = 3;
  oneof content {
    Loading loading = 4;
    ReadFailure failure = 5;
    PeopleMergeChoices choices = 6;
  }
}

message PeopleMergeChoices {
  repeated PeopleMergeChoice choices = 1;
  optional EmptyState empty = 2;
}

message PeoplePersonSheet {
  oneof kind {
    PeopleLogTouchSheet log_touch = 1;
    PeopleNoteSheet note = 2;
    PeopleDateSheet date = 3;
    PeopleChannelSheet channel = 4;
    PeopleMergeSheet merge = 5;
  }
}

message PeoplePersonChrome {
  string edit = 1;
  string log_touch = 2;
  string add_note = 3;
  string add_date = 4;
  string add_channel = 5;
  string merge = 6;
  string move_to_trash = 7;
  string retry = 8;
  string loading = 9;
  string back = 10;
}

message PeoplePersonState {
  SeatState seat = 1;
  string party_id = 2;
  // The name the route carried, for the app bar before the read lands.
  string name_hint = 3;
  oneof content {
    Loading loading = 4;
    ReadFailure failure = 5;
    Denied denied = 6;
    PeoplePersonData data = 7;
    // No live person has this id: trashed, merged away, or never here.
    EmptyState gone = 8;
  }
  WriteState write = 9;
  // The write sheet or choices sheet on screen; absent is none.
  optional PeoplePersonSheet sheet = 10;
  optional Confirm confirm = 11;
  oneof asking {
    bool trash = 12;
    string remove_channel_id = 13;
    string merge_party_id = 14;
  }
  PeoplePersonChrome chrome = 15;
  // The last write's outcome or refusal, one sentence.
  string status = 16;
  // THE SHELL POPS THIS SCREEN: the person was moved to the trash here.
  bool done = 17;
  // The write in flight, for the outcome it settles into.
  PendingWrite pending = 18;
  // The merge sheet's roster read is wanted.
  bool merge_reading = 19;
  // The name of the person the merge confirm is asking about.
  string merge_party_name = 20;

  message PendingWrite {
    Kind kind = 1;
    // The name or label the outcome sentence names.
    string subject = 2;
    // A reminder write: whether it turns the reminder on.
    bool turns_on = 3;

    enum Kind {
      KIND_UNSPECIFIED = 0;
      KIND_NONE = 1;
      KIND_STAR = 2;
      KIND_UNSTAR = 3;
      KIND_LOG_TOUCH = 4;
      KIND_NOTE = 5;
      KIND_DATE = 6;
      KIND_REMINDER = 7;
      KIND_CHANNEL_SAVE = 8;
      KIND_CHANNEL_REMOVE = 9;
      KIND_MERGE = 10;
      KIND_TRASH = 11;
    }
  }
}

message PeoplePersonEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    DataArrived data = 3;
    ReadRefused refused = 4;
    Denied denied = 5;
    RowsChanged rows_changed = 6;
    SeatChanged seat_changed = 7;
    WriteSettled write_settled = 8;
    StarToggled star = 9;
    SheetOpened sheet_opened = 10;
    SheetClosed sheet_closed = 11;
    // Sheet fields.
    KindPicked kind_picked = 12;
    TextChanged text = 13;
    SecondTextChanged second_text = 14;
    FlagToggled flag = 15;
    SheetSubmitted submitted = 16;
    ReminderToggled reminder = 17;
    RemoveChannelTapped remove_channel = 18;
    MergePicked merge_picked = 19;
    TrashTapped trash_tapped = 20;
    Confirmed confirmed = 21;
    Dismissed dismissed = 22;
    // INTENTS the shell routes.
    EditRequested edit = 23;
    ChannelTapped channel = 24;
  }

  // `log_touch` opens the Log a touch sheet at once (Touch's card action).
  message Opened {
    string party_id = 1;
    string name = 2;
    bool log_touch = 3;
  }

  message Refreshed {}

  // One read's answers, folded. `person` answers `people.person`; `absent`
  // says the person is gone; `merge` answers the merge sheet's roster.
  message DataArrived {
    optional PeoplePersonData person = 1;
    bool absent = 2;
    optional PeopleMergeChoices merge = 3;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    string table = 1;
    repeated string keys = 2;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message StarToggled {}

  message SheetOpened {
    Which which = 1;

    enum Which {
      WHICH_UNSPECIFIED = 0;
      WHICH_LOG_TOUCH = 1;
      WHICH_NOTE = 2;
      WHICH_DATE = 3;
      WHICH_CHANNEL = 4;
      WHICH_MERGE = 5;
    }
  }

  message SheetClosed {}

  message KindPicked {
    string key = 1;
  }

  // The sheet's first text: the touch note, the note, the date's label, the
  // channel's value.
  message TextChanged {
    string text = 1;
  }

  // The sheet's second text: the date's `MM-DD`, the channel's label.
  message SecondTextChanged {
    string text = 1;
  }

  // The sheet's switch: the date's reminder, the channel's preferred.
  message FlagToggled {}

  message SheetSubmitted {}

  message ReminderToggled {
    string date_id = 1;
  }

  message RemoveChannelTapped {
    string channel_id = 1;
  }

  message MergePicked {
    string party_id = 1;
  }

  message TrashTapped {}

  message Confirmed {}

  message Dismissed {}

  message EditRequested {}

  message ChannelTapped {
    string channel_id = 1;
  }
}

// --- people.editor -----------------------------------------------------------

// The profile as the editor holds it.
message PeopleProfileDraft {
  string display_name = 1;
  string role = 2;
  string nickname = 3;
  string met = 4;
  // A `PartyHueWheel` key; empty is the id's own hue.
  string hue_key = 5;
  // 0 is no cadence.
  int64 cadence_days = 6;
}

message PeopleHueChoice {
  string hue_key = 1;
  bool selected = 2;
  string accessibility_label = 3;
}

message PeopleCadenceChoice {
  int64 days = 1;
  // "Never" / "7 days".
  string label = 2;
  bool selected = 3;
}

message PeopleEditorChrome {
  // "New person" / "Edit person".
  string title = 1;
  string name_field = 2;
  string role_field = 3;
  string role_placeholder = 4;
  string nickname_field = 5;
  string met_field = 6;
  string colour_field = 7;
  string cadence_field = 8;
  // "Cancel" before the first keystroke of a new person, else "Done".
  string close_label = 9;
  string retry = 10;
  string loading = 11;
}

message PeopleEditorState {
  SeatState seat = 1;
  // Empty until a new person is minted (the bridge mints it on open).
  string party_id = 2;
  // A NEW person: the first save is `people.add_person`, every later one
  // `people.edit_person`. `created` flips when the add commits.
  bool is_new = 3;
  bool created = 4;
  oneof content {
    Loading loading = 5;
    ReadFailure failure = 6;
    Denied denied = 7;
    PeopleProfileDraft draft = 8;
    // The person is not there to edit.
    EmptyState gone = 9;
  }
  Autosave autosave = 10;
  // The draft as the vault last had it, and the one the save in flight carries.
  optional PeopleProfileDraft baseline = 11;
  optional PeopleProfileDraft sending = 12;
  PeopleEditorChrome chrome = 13;
  repeated PeopleHueChoice hues = 14;
  repeated PeopleCadenceChoice cadences = 15;
  // "Saving…" / "Saved" / the refusal's sentence; empty when clean.
  string save_label = 16;
  // False before the first keystroke of a new person: close then discards.
  bool touched = 17;
  // The cadence, which is its own command and saves on the tap.
  WriteState write = 18;
}

message PeopleEditorEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    DataArrived data = 3;
    ReadRefused refused = 4;
    Denied denied = 5;
    RowsChanged rows_changed = 6;
    SeatChanged seat_changed = 7;
    WriteSettled write_settled = 8;
    NameChanged name = 9;
    RoleChanged role = 10;
    NicknameChanged nickname = 11;
    MetChanged met = 12;
    HuePicked hue = 13;
    CadencePicked cadence = 14;
    Tick tick = 15;
    Left left = 16;
  }

  // An existing person, or a new one under `minted_party_id`.
  message Opened {
    string party_id = 1;
    string minted_party_id = 2;
  }

  message Refreshed {}

  message DataArrived {
    optional PeopleProfileDraft draft = 1;
    bool absent = 2;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    string table = 1;
    repeated string keys = 2;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message NameChanged {
    string text = 1;
  }

  message RoleChanged {
    string text = 1;
  }

  message NicknameChanged {
    string text = 1;
  }

  message MetChanged {
    string text = 1;
  }

  message HuePicked {
    string hue_key = 1;
  }

  message CadencePicked {
    int64 days = 1;
  }

  message Tick {
    string token = 1;
  }

  // Close = done: save now.
  message Left {}
}

// ---------------------------------------------------------------------------
// --- Tasks ---
// ---------------------------------------------------------------------------
//
// Tasks on the phone (#1029 app port): the home place (Today, Upcoming, Inbox,
// Projects; More is a sheet and search a field), one list parameterised by
// view (Anytime, All, Logbook, Reminders), one project, the task detail, Catch
// up, and the kit's trash (`TrashListState`, `app_id = "tasks"`). Every screen
// reads through the core's `tasks.*` app queries (`core/v1/tasks.proto`).
//
// VIEWS DECIDE NOTHING. Every label, sentence, accessibility label, empty
// choice, tone flag and enabled flag below is computed in `apps/tasks`. The
// core's typed answers never cross — they stay on the Kotlin side beside
// these messages (`TasksHome`, `TasksList`, …), for `AgendaHomeState`'s
// reason: this file cannot import `centraid.core.v1`.

// A task's box.
enum TasksCheck {
  TASKS_CHECK_UNSPECIFIED = 0;
  TASKS_CHECK_OPEN = 1;
  TASKS_CHECK_DONE = 2;
  // Released: drawn `–`, in the Logbook only.
  TASKS_CHECK_WONT_DO = 3;
  TASKS_CHECK_IN_PROCESS = 4;
}

// ONE TASK AS A ROW, finished. A root carries its family in `children`.
message TasksRow {
  string task_id = 1;
  string title = 2;
  // "2 days ago", "Today", "09:00", "Tomorrow", "Fri 14 March"; empty undated.
  string due_label = 3;
  // `due_label` in the attention tone. Never red, never a count.
  bool overdue = 4;
  // One clamped line: "Home · Daily · missed 2 · next is Fri 14 March ·
  // reminder Tomorrow 08:30 · ~25 min · #errand · 2 of 5 · sitting since March".
  string meta = 5;
  // "Now", "Next", "Soon", or empty: no room is reserved for a priority.
  string priority_label = 6;
  // The project's hue key for the 6px dot; empty when unfiled.
  string project_hue_key = 7;
  TasksCheck check = 8;
  // What the box does: "Mark Buy milk done" / "Reopen Buy milk".
  string check_label = 9;
  string accessibility_label = 10;
  // A write this phone holds and the vault has not answered: the 2px rule.
  bool pending = 11;
  bool subtask = 12;
  repeated TasksRow children = 13;
  // The row offers "File" (open roots only).
  bool can_file = 14;
  // The box is live. False on a pending add.
  bool can_check = 15;
}

// A group of rows under one head.
message TasksRowGroup {
  // Stable across answers, for list item keys.
  string key = 1;
  // "Overdue", "Today", "Tomorrow", "Wed 11 March", a project's name, "Done".
  string title = 2;
  // The count, as digits.
  string meta = 3;
  // "April 2026" on the first group of a month the list had not shown yet.
  optional string month_heading = 4;
  // At most one quiet verb: "Catch up" on Overdue, "Add task" on a section.
  // Empty for none; `GroupVerb` sends `verb_key` back.
  string verb_label = 5;
  string verb_key = 6;
  // A project's section this group is (the project screen), else absent.
  optional string section_id = 7;
  repeated TasksRow rows = 8;
}

message TasksFact {
  string label = 1;
  string detail = 2;
}

message TasksBandTab {
  // `today`, `upcoming`, `inbox`, `projects`, `more` — what `BandPicked` sends.
  string key = 1;
  string label = 2;
  // A `design/native-catalog.json` icon key.
  string icon_key = 3;
  bool current = 4;
}

// One row of a choice sheet: a filing target, a More row, a field choice.
message TasksChoice {
  // What the choice event sends back.
  string key = 1;
  string label = 2;
  string meta = 3;
  bool selected = 4;
  bool enabled = 5;
  // A section under its project.
  bool indented = 6;
  string icon_key = 7;
}

// Every fixed word a Tasks screen draws, so no view carries copy.
message TasksChrome {
  string title = 1;
  string retry = 2;
  // The skeleton's accessibility label.
  string loading = 3;
  string search_placeholder = 4;
  string search_label = 5;
  string search_close = 6;
  string more_title = 7;
  string reads_title = 8;
  repeated TasksFact reads_facts = 9;
  string quick_add_placeholder = 10;
  string quick_add_verb = 11;
  string file_title = 12;
  string new_project_title = 13;
  string new_project_placeholder = 14;
  string new_project_verb = 15;
  string add_section_title = 16;
  string add_section_placeholder = 17;
  string add_section_verb = 18;
  string cancel = 19;
  // The band's home capsule.
  string home = 20;
  string show_more = 21;
  // A pushed page's back control: the app it was pushed from, "Tasks".
  string back = 22;
  // The verbs beside the detail's subtask and tag entries.
  string add_subtask_verb = 23;
  string add_tag_verb = 24;
  // A row's visible filing verb (`TasksRow.can_file`), "File".
  string file_verb = 25;
}

// A notice over a list: one sentence and at most one verb.
message TasksNotice {
  string sentence = 1;
  string verb_label = 2;
  // What `NoticeActed` means: `catch_up`.
  string verb_key = 3;
}

// The quick-add bar: a bare title, and where it lands.
message TasksQuickAdd {
  // What the member typed. Cleared when an add is submitted.
  string title = 1;
  // The Add verb is live: a title that is not blank.
  bool can_submit = 2;
  // "Lands in Today" / "Lands in Inbox" / "Lands in Garden · Beds".
  string lands_label = 3;
  // False where nothing can be added (denied, loading the first page).
  bool shown = 4;
  // The field takes the keyboard when drawn: the bar was opened with words
  // already in it (Notes' "Send to Tasks").
  bool focused = 5;
}

// ---------------------------------------------------------------------------
// tasks.home — Today · Upcoming · Inbox · Projects, More a sheet
// ---------------------------------------------------------------------------

message TasksHomeState {
  SeatState seat = 1;
  // Law 2: a parameter. More is a sheet and search a field, so neither is here.
  Destination destination = 2;
  SearchField search = 3;
  oneof content {
    Loading loading = 4;
    ReadFailure failure = 5;
    // The vault would not let Tasks read: no band, no quick add.
    Denied denied = 6;
    TasksHomeData data = 7;
  }
  Sheet sheet = 8;
  // The band in order, computed. Empty while denied.
  repeated TasksBandTab band = 9;
  TasksChrome chrome = 10;
  StatusLine status = 11;
  TasksQuickAdd quick_add = 12;
  // SHEET_FILE: the task being filed, and where it can go.
  string filing_task_id = 13;
  repeated TasksChoice file_choices = 14;
  // SHEET_MORE's rows: Anytime, All, Logbook, Reminders, Catch up, Search,
  // Trash, What Tasks may read. `MoreRowPicked` sends the key.
  repeated TasksChoice more_rows = 15;
  // SHEET_NEW_PROJECT's name field.
  string new_project_name = 16;
  bool new_project_can_submit = 17;

  enum Destination {
    DESTINATION_UNSPECIFIED = 0;
    DESTINATION_TODAY = 1;
    DESTINATION_UPCOMING = 2;
    DESTINATION_INBOX = 3;
    DESTINATION_PROJECTS = 4;
  }

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_MORE = 2;
    // "What Tasks may read" — `TasksChrome.reads_facts`.
    SHEET_READS = 3;
    SHEET_FILE = 4;
    SHEET_NEW_PROJECT = 5;
  }
}

message TasksHomeData {
  // `YYYY-MM-DD`, the core's.
  string today = 1;
  // Today, Upcoming, Inbox, and search hits (one group).
  repeated TasksRowGroup groups = 2;
  // Projects: one group per area, rows as the kit's `ListRow`.
  repeated TasksProjectGroup projects = 3;
  // The empty sentence when nothing is drawn; an empty headline draws none.
  // `EmptyActed` performs `empty.action_label`.
  EmptyState empty = 4;
  // The absence notice on Today: "You were away 16 days · 34 tasks came due".
  optional TasksNotice notice = 5;
  // "7 tasks", "3 projects", "4 hits".
  string count_label = 6;
  // "500 tasks · this is a window, not everything open"; empty when whole.
  string window_label = 7;
  // The rows are search hits.
  bool searching = 8;  // "Show more" is live: the window can widen (`NextPageRequested`).
  bool can_show_more = 9;
}

message TasksProjectGroup {
  string key = 1;
  // An area's name, or "Projects" for those in none.
  string title = 2;
  repeated ListRow rows = 3;
}

message TasksHomeEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    BandPicked band = 3;
    SheetOpened sheet_opened = 4;
    SheetClosed sheet_closed = 5;
    MoreRowPicked more_row = 6;
    SearchOpened search_opened = 7;
    SearchTermChanged search_term = 8;
    SearchClosed search_closed = 9;
    RowChecked row_checked = 10;
    FileRequested file_requested = 11;
    FileChosen file_chosen = 12;
    StatusActed status_acted = 13;
    QuickAddChanged quick_add_changed = 14;
    QuickAddSubmitted quick_add_submitted = 15;
    NewProjectNameChanged new_project_name = 16;
    NewProjectSubmitted new_project_submitted = 17;
    EmptyActed empty_acted = 18;
    ReadRefused refused = 19;
    RowsChanged rows_changed = 20;
    SeatChanged seat_changed = 21;
    WriteSettled write_settled = 22;
    // INTENTS: nothing changes here; the shell routes them.
    RowPicked row_picked = 23;
    ProjectPicked project_picked = 24;
    GroupVerb group_verb = 25;
    NoticeActed notice_acted = 26;
    NextPageRequested next_page = 27;
  }

  // Lands on `destination` (Today when unspecified), search closed.
  // `quick_add_title` opens the quick add with those words in it, focused
  // (Notes' "Send to Tasks"); empty is an empty bar.
  message Opened {
    TasksHomeState.Destination destination = 1;
    string quick_add_title = 2;
  }

  message Refreshed {}

  // A band tab, by `TasksBandTab.key`.
  message BandPicked {
    string key = 1;
  }

  message SheetOpened {
    TasksHomeState.Sheet sheet = 1;
  }

  message SheetClosed {}

  // A More row, by `TasksChoice.key`. `anytime`, `all`, `logbook`,
  // `reminders`, `catch_up` and `trash` are intents the shell routes; `search`
  // opens the field and `reads` the facts sheet.
  message MoreRowPicked {
    string key = 1;
  }

  message SearchOpened {}

  message SearchTermChanged {
    string term = 1;
  }

  message SearchClosed {}

  message RowChecked {
    string task_id = 1;
  }

  message FileRequested {
    string task_id = 1;
  }

  // A `file_choices` key.
  message FileChosen {
    string key = 1;
  }

  message StatusActed {}

  message QuickAddChanged {
    string title = 1;
  }

  message QuickAddSubmitted {}

  message NewProjectNameChanged {
    string name = 1;
  }

  message NewProjectSubmitted {}

  message EmptyActed {}

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    string table = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message RowPicked {
    string task_id = 1;
  }

  message ProjectPicked {
    string project_id = 1;
  }

  message GroupVerb {
    string key = 1;
  }

  message NoticeActed {}

  // "Show more" under a window that is not everything open.
