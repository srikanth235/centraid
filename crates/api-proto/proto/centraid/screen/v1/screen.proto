  }

  message TrashRequested {
    string note_id = 1;
  }

  message Confirmed {}

  message Dismissed {}

  message DataArrived {
    NotesLibraryData data = 1;
    repeated NotesChoice notebooks = 2;
  }

  message SearchArrived {
