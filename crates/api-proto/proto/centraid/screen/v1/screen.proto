// Screen states and events — SHELL-INTERNAL, free to change every release
// (#1020, D-1020-C4, D-1020-E3; the issue's *One protobuf schema workspace*).
//
// This package's compatibility promise is deliberately weaker than
// `centraid.core.v1`'s: `buf breaking` checks it against the PR base only, not
// against released tags, because the only consumers are the KMP shared module,
// SwiftUI and Compose — all shipped in one artifact with the core that produces
// these messages. `centraid.core.v1` is the gateway's promise to seats that
// update on their own schedule; this is not.
//
// Wave 2 landed the envelope alone as a placeholder. Wave 3 lane E filled it
// with the three screens — **Tally list, Photos grid, Notes editor** — and
// `SeatState`. Everything is in ONE FILE (D-1020-E3a): `crates/api-proto`'s
// `build.rs` carries a NAMED list of every `.proto` and `tests/tree.rs` asserts
// the list and the directory agree, and both belong to lane C. One file keeps
// this change inside the screen package's own ownership boundary, which for a
// shell-internal package costs nothing.
//
// Open question 10 decides after wave 3 whether screen contracts stay protobuf
// or become Kotlin sealed classes plus SKIE, on the exit criterion written into
// the issue (lines per screen, fixture disagreements, p95 state delivery). If
// that decision goes to SKIE, THIS FILE is what goes away; nothing in
// `centraid.core.v1` moves. The line counts criterion (a) needs are in the
// receipt, measured against hand-written Kotlin data classes for the same
// three screens.
//
// ## Four laws every message here keeps
//
// 1. **A failed read is not an empty list.** Three states, never two:
//    `loading`, a `ReadFailure`, or data. Kotlin's nullable and Rust's `Result`
//    each collapse two of them, so the oneof spells all three out. v0 pins the
//    same law from three directions — `tally-store.test.ts`, the
//    `deniedPayload` contract, and "a refused read and a seat with no copy yet
//    are different screens".
// 2. **A band destination is a parameter, not a screen.** `PhotosGridState`
//    carries a destination; there is no second message per destination. And
//    `more` is a sheet, never a destination.
// 3. **A discriminated union, not a bag of optionals.** A photo state view is a
//    oneof, not `{mode, party_id?, person_name?}` (`navigation.ts:43-46`).
// 4. **An OS permission is a state, not a route.** "No `PhotoPermission` route
//    (#712): OS grant is a timeline STATE" (`navigation.ts:41-42`).

syntax = "proto3";

package centraid.screen.v1;

// One screen's finished state, ready to render. The UI thread only ever
// receives a finished state message (#1020 Execution model).
message ScreenState {
  // Which screen. `tally.list`, `photos.grid`, `notes.editor`.
  string screen_id = 1;
  // The state, encoded by the message this package defines for `screen_id`.
  // Still `bytes` rather than a oneof: the shell transports a screen state
  // without knowing which screen it is (one `SharedFlow`, one renderer entry
  // point), and a oneof here would have to be edited by every screen lane.
  bytes state = 2;
  // Monotonic per screen instance, so a renderer can drop a state it has
  // already surpassed rather than re-rendering out of order.
  uint64 revision = 3;
}

// One event the view forwards. Swift and Compose own nothing; they render and
// forward (#1020 Execution model).
message ScreenEvent {
  string screen_id = 1;
  bytes event = 2;
}

// ---------------------------------------------------------------------------
// The read law
// ---------------------------------------------------------------------------

// WHY A READ PRODUCED NO ROWS, when it produced no rows for a reason.
//
// Absent from every screen's `data` case: data is data. This exists only for
// the middle state, and `kind` is what keeps "refused" and "no copy yet" apart
// — two different screens in v0's own words, and the distinction a nullable
// would erase.
enum ReadFailureKind {
  READ_FAILURE_KIND_UNSPECIFIED = 0;
  // The access plane said no. Its sentence, never its predicate.
  READ_FAILURE_KIND_REFUSED = 1;
  // This seat has no copy of these rows yet. A first sync, not a refusal — and
  // the screen that says so is not the screen that says "you cannot see this".
  READ_FAILURE_KIND_NO_COPY_YET = 2;
  // The core answered, and could not reach what it needed: a gateway a thin
  // seat cannot dial.
  READ_FAILURE_KIND_UNAVAILABLE = 3;
  // The device is out of disk and the feed is PARKED: the cursor and the rows
  // stay, the retry cadence stops, and freeing space resumes from the durable
  // cursor (`docs/mobile-offline.md:238`). Centraid never evicts canonical rows
  // or queued writes to manufacture space, so this is a state and not a
  // cleanup.
  READ_FAILURE_KIND_LOW_DISK_PARKED = 4;
  // The core was restarted deliberately after a panic poisoned its handle
  // (`crates/core-ffi/CONTRACT.md` clause 9).
  READ_FAILURE_KIND_CORE_RESTARTED = 5;
}

message ReadFailure {
  ReadFailureKind kind = 1;
  // AN OWNER-FACING SENTENCE. The author's words for a failed precondition,
  // the access plane's sentence for a denial. The raw predicate reaches the
  // audit trail and never a member.
  string sentence = 2;
  // Set when there is something a member can do: free space, reach the
  // gateway, wait for a first sync. Empty when there is not.
  string remedy = 3;
}

// The loading state. A message rather than a bare `bool`, so the oneof can hold
// it as a present value and a decode of an unset oneof stays distinguishable
// from "loading" — the same reason `centraid.core.v1.NullValue` is a message.
message Loading {
  // True on the FIRST load of this screen, false on a refresh over rows the
  // screen is already showing. A spinner over an empty frame and a spinner over
  // last night's rows are different screens.
  bool first_load = 1;
}

// ---------------------------------------------------------------------------
// The seat's four sentences
// ---------------------------------------------------------------------------

// What this seat can say about itself, as the desktop seat says it —
// coordinated with lane F as `centraid.screen.v1.SeatState`, one message and
// two shells (`contracts/screens/README.md`). Four facts and no fifth, because
// each answers a different question a member actually asks.
message SeatState {
  Availability availability = 1;
  Durability durability = 2;
  PendingWork pending = 3;
  Connectivity connectivity = 4;

  // "Can I use Centraid right now?"
  enum Availability {
    AVAILABILITY_UNSPECIFIED = 0;
    AVAILABILITY_READY = 1;
    // A mount is resolving. **Never a placeholder gateway id**: a mount waits
    // for a real endpoint rather than naming a file after a stand-in, because
    // the literal `"manual"` once named a file whose path moved the moment a
    // real endpoint arrived, orphaning every write queued under it
    // (`docs/mobile-offline.md:249`, census §E seam 2).
    AVAILABILITY_WAITING_FOR_MOUNT = 2;
    // The app is locked. Decrypted material is cleared and the replica is
    // unmounted; a state, not a modal over a live screen.
    AVAILABILITY_LOCKED = 3;
    // The core was poisoned and is being restarted.
    AVAILABILITY_RESTARTING = 4;
  }

  // "Is my work safe?"
  enum Durability {
    DURABILITY_UNSPECIFIED = 0;
    // Written to the gateway's authority.
    DURABILITY_AUTHORITATIVE = 1;
    // Written to this device's outbox and not yet to the gateway.
    DURABILITY_LOCAL_ONLY = 2;
    // Out of disk. The feed is parked and nothing is being written.
    DURABILITY_PARKED_LOW_DISK = 3;
  }

  // "Is anything still on its way?"
  message PendingWork {
    uint32 queued_writes = 1;
    uint32 queued_uploads = 2;
    // The oldest queued item's age in seconds, so a screen can say "since
    // yesterday" rather than a count nobody can weigh.
    uint64 oldest_queued_seconds = 3;
  }

  // "Why is it not moving?" — and the answer the platform gave, not one this
  // shell assumed from a radio.
  enum Connectivity {
    CONNECTIVITY_UNSPECIFIED = 0;
    CONNECTIVITY_ONLINE_UNMETERED = 1;
    CONNECTIVITY_ONLINE_METERED = 2;
    CONNECTIVITY_OFFLINE = 3;
    // The platform refused to say — Background App Refresh is off, or the
    // permission was never granted. Registration is observable rather than
    // assumed (`docs/mobile-offline.md:214`).
    CONNECTIVITY_UNKNOWN_PLATFORM_REFUSED = 4;
  }
}

// A money amount, as the vault holds it: minor units and a currency
// (`tally_expense.amount_minor` + `currency`).
//
// **NEVER A FLOAT AND NEVER A PRE-FORMATTED STRING.** v0's formatter divides
// minor units by 100 unconditionally and calls
// `new Intl.NumberFormat(undefined, …)` — the HOST's locale — so the same vault
// renders differently on two devices (`packages/design/src/format.ts:38`,
// `:49`; census §E8). A Kotlin or Swift port needs the minor-unit exponent for
// the currency and an explicit locale FROM THE VAULT, which is why both travel
// with the amount.
message Money {
  int64 minor = 1;
  // ISO 4217, three characters.
  string currency = 2;
  // The currency's minor-unit exponent: 2 for USD, 0 for JPY, 3 for BHD. From
  // the kit's table through the core, never guessed and never assumed to be 2.
  uint32 exponent = 3;
  // The locale the vault says to render in — BCP 47. Never the device's.
  string locale = 4;
}

// ---------------------------------------------------------------------------
// Tally list
// ---------------------------------------------------------------------------

message TallyListState {
  SeatState seat = 1;
  // WHICH BAND, as a parameter (law 2).
  Destination destination = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    TallyListData data = 5;
  }
  // The pending-write overlay: expense ids this device has written and the
  // gateway has not confirmed. On the STATE and not on the rows, because an
  // overlay over a row the screen has not loaded yet still has to be shown once
  // it arrives.
  repeated string pending_expense_ids = 6;
  // The one verb a seat WITHHOLDS rather than queueing offline:
  // `materialize-recurring-expense`, whose occurrence id is minted by the
  // canonical engine (`docs/mobile-offline.md:257`). True when the screen
  // should say so rather than offering it.
  bool recurring_materialisation_withheld = 7;
  // A FIRST PAGE IS IN FLIGHT OVER ROWS THE SCREEN KEEPS SHOWING. Set by every
  // path that asks for the first page while rows are on screen — a refresh, a
  // change event — and cleared by the answer, which then REPLACES the rows
  // instead of appending to them. Without it the answer to a re-read was merged
  // as if it were page two: a new expense landed at the bottom, an edited one
  // kept its old amount, and a deleted one never left.
  bool first_page_pending = 8;

  enum Destination {
    DESTINATION_UNSPECIFIED = 0;
    DESTINATION_ACTIVITY = 1;
    DESTINATION_BALANCES = 2;
    DESTINATION_GROUPS = 3;
  }
}

message TallyListData {
  repeated TallyRow rows = 1;
  // ABSENT when the rows ended. Never a `truncated` flag and never a cursor
  // that points past the end — the keyset rule `centraid.core.v1.Page` states.
  optional string next_cursor = 2;
  // The balance across the destination, when the destination has one.
  optional Money net_balance = 3;
}

message TallyRow {
  string expense_id = 1;
  string description = 2;
  Money amount = 3;
  // Names ride along the row so an app bar and a list line need not wait a
  // second read (`navigation.ts:63-69`).
  string group_name = 4;
  string payer_name = 5;
  // RFC 3339, in the VAULT's zone and never the host's (R-1020-33).
  string occurred_at = 6;
  bool settled = 7;
}

message TallyListEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    NextPageRequested next_page = 3;
    DestinationChanged destination = 4;
    DataArrived data = 5;
    ReadRefused refused = 6;
    RowsChanged rows_changed = 7;
    SeatChanged seat_changed = 8;
  }

  message Opened {}

  message Refreshed {}

  message NextPageRequested {
    string after_cursor = 1;
  }

  message DestinationChanged {
    TallyListState.Destination destination = 1;
  }

  message DataArrived {
    TallyListData data = 1;
    // THE CURSOR THIS PAGE ANSWERED, echoed by the runtime from the request:
    // empty for a first page, the `after_cursor` for a later one. It is what
    // tells a first page (REPLACE) from a later one (APPEND) — a state flag
    // alone cannot, because a page-two answer landing after a re-read has
    // started would be taken for the re-read's answer and replace the list.
    // Absent only from a sender that predates the echo.
    optional string answered_cursor = 2;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  // A change event touched rows this screen is showing.
  message RowsChanged {
    repeated string expense_ids = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }
}

// ---------------------------------------------------------------------------
// Photos grid
// ---------------------------------------------------------------------------

// THE OS GRANT, AS A STATE (law 4). No route, no modal-as-a-screen: the grid
// renders a different thing under each of these, and every one of them is a
// place a member can be.
enum MediaPermission {
  MEDIA_PERMISSION_UNSPECIFIED = 0;
  // Not asked yet. Distinct from denied: one has a button, the other has a
  // trip to Settings.
  MEDIA_PERMISSION_NOT_ASKED = 1;
  MEDIA_PERMISSION_GRANTED = 2;
  // iOS's limited selection. The grid shows what was selected and says so — it
  // is not an empty library and it is not a denial.
  MEDIA_PERMISSION_LIMITED = 3;
  MEDIA_PERMISSION_DENIED = 4;
  // A device policy refuses, and no button in this app can change it.
  MEDIA_PERMISSION_RESTRICTED = 5;
}

message PhotosGridState {
  SeatState seat = 1;
  Destination destination = 2;
  MediaPermission permission = 3;
  oneof content {
    Loading loading = 4;
    ReadFailure failure = 5;
    PhotosGridData data = 6;
  }
  // The camera-roll backup's own state. On the grid because that is where a
  // member sees it, and a message because "backing up" is several facts.
  BackupState backup = 7;
  // WHICH SHEET IS OPEN, if one is. `more` is a sheet and never a destination,
  // so it cannot be a `Destination` value.
  Sheet sheet = 8;

  // THE LIBRARY'S OWN VIEW OF ITSELF (#1029, photos port — v0's
  // `PhotosHome.tsx`). The zoom, the filter and the tile size are the MEMBER'S
  // choices about how to look at one library, so they live on the state and
  // survive every recomposition; only `rung` outlives the process, because it
  // is the only one v0 persisted (`photos-rung-store.ts`).
  Grain grain = 9;
  Filter filter = 10;
  // 0-3, XS to L (`photos-rungs.ts`). The machine seeds M.
  uint32 rung = 11;
  // WHERE THE MEMBER IS, as a capture-local `YYYY-MM-DD`, so a grain switch
  // lands on the same stretch of time rather than at the top. Empty is "the
  // top", which is also the honest answer for the undated tail.
  string place_day = 12;

  // THE SELECTION. A mode and a set, not a set alone: a member who pressed
  // Select and has picked nothing yet is selecting, and the band has already
  // given way to the selection bar.
  bool selecting = 13;
  repeated string selected = 14;

  // "Add to album" — the shared sheet's contract (`AlbumChoice.kt`).
  bool album_choice_open = 15;
  repeated AlbumChoiceEntry album_choices = 16;

  // A WRITE THE VAULT REFUSED, in its own slot and never the `content` oneof's
  // `failure`: a refused favourite must not replace the library with an error.
  ReadFailure write_failure = 17;
  // WHAT "SEND A COPY" OVER THE SELECTION CAME TO — the shelf's
  // `export_notice`, for the same batch hand-off (`ShelfCopies.kt`). One
  // clause reported back by the shell (`ExportSettled`) and cleared by the
  // next verb. Not `write_failure`: nothing was written to the vault.
  string export_notice = 23;

  // THE ONE READ IN FLIGHT, AND THE ONE WAITING BEHIND IT. `DataArrived` does
  // not say which request it answers, so the machine keeps at most one page
  // read outstanding and knows the answer by elimination — a refresh that
  // raced a next page would otherwise splice page three onto a fresh page one.
  ReadMode reading = 18;
  // The read in flight is the UNDATED walk's (see `PhotosGridData.undated_walk`).
  bool reading_undated = 19;
  ReadMode queued = 20;
  // A REFRESH READS BESIDE THE LIBRARY, NOT INSTEAD OF IT. A write re-reads
  // every page the member had scrolled through into this buffer and swaps it
  // in whole, so a favourite neither blanks the grid nor throws the scroll.
  PhotosGridData restage = 21;
  uint32 restage_target = 22;

  // THE MORE SHEET'S "FREE UP SPACE" ROW (#1029, the photos port — v0's
  // "Free up vault"). Unset until the sheet first opens and the core counts;
  // the row then says it is counting, never a zero. Numbered clear of the
  // library's own run of fields so the two never collide mid-edit.
  FreeUpSpace free_up = 40;

  enum Destination {
    DESTINATION_UNSPECIFIED = 0;
    DESTINATION_LIBRARY = 1;
    DESTINATION_COLLECTIONS = 2;
    DESTINATION_SEARCH = 3;
  }

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_MORE = 2;
    SHEET_BACKUP_DETAIL = 3;
    // "Move these to the trash?" over the selection. A confirm is a sheet (D4).
    SHEET_CONFIRM_TRASH = 4;
  }

  // v0's three zooms, widest first (`timeline-grains.ts`). A VIEW, NOT A
  // FILTER: Years and Months summarise the same cells All draws.
  enum Grain {
    GRAIN_UNSPECIFIED = 0;
    GRAIN_YEARS = 1;
    GRAIN_MONTHS = 2;
    GRAIN_ALL = 3;
  }

  // v0's two honest per-asset predicates (`photos-library-menu.ts`). Videos
  // has its own door on Collections and is deliberately not here.
  enum Filter {
    FILTER_UNSPECIFIED = 0;
    FILTER_ALL = 1;
    FILTER_FAVORITES = 2;
  }

  enum ReadMode {
    // Nothing in flight.
    READ_MODE_NONE = 0;
    // The library from its first page, drawn over skeletons.
    READ_MODE_FIRST = 1;
    // The next page, appended.
    READ_MODE_MORE = 2;
    // The pages already read, re-read into `restage`.
    READ_MODE_REFRESH = 3;
  }
}

message PhotosGridData {
  repeated PhotoCell cells = 1;
  optional string next_cursor = 2;
  // TWO DIFFERENT EMPTY-CELL SENTENCES (`docs/mobile-offline.md:224`): no
  // thumbnail pack at all, versus these particular thumbnails not being in one.
  // A single "no image" would make a member who has no pack and a member whose
  // pack has evicted these look at the same screen.
  bool thumbnail_pack_absent = 3;
  // THE DATED WALK HAS ENDED (#1029, photos port). An undated photograph has
  // no place in a capture-time keyset — `(NULL, id) < (?, ?)` is never true —
  // so the library is TWO walks: every dated row newest first, then the
  // undated tail by id. Set, `next_cursor` is the undated walk's.
  bool undated_walk = 4;
  // Both walks have ended: every photograph in the library is in `cells`.
  bool complete = 5;
}

message PhotoCell {
  string asset_id = 1;
  // The thumbnail's local path, when the pack has it. Absent is a real answer,
  // and `thumbnail_pack_absent` says which kind of absent.
  optional string thumbnail_path = 2;
  // RFC 3339 plus the capture-local UTC offset in minutes, both, because a
  // photo's day is its capture day and not the reader's
  // (`media_asset.captured_at` and its offset column).
  string captured_at = 3;
  int32 captured_utc_offset_minutes = 4;
  Kind kind = 5;
  bool favorite = 6;
  // A Live Photo's still and its paired movie share one capture group; the
  // grid shows one cell.
  optional string capture_group_id = 7;
  // WHAT THIS DEVICE HAS OF THIS PHOTOGRAPH (#1025 S5, D-1025-S7-62).
  //
  // A CLOSED ENUM and not three booleans. The five states are mutually
  // exclusive by construction and a cell that could be two of them at once is
  // a cell drawing two affordances; the derivation is one function
  // (`PhotosReads.heldOf`) over the page read's held columns and the member's
  // rule, and it is the only thing allowed to produce this value.
  Held held = 8;
  // HOW FAR A `HELD_FETCHING` CELL HAS GOT, 0-100, and 0 when nobody can say.
  //
  // Zero is an honest "not known" rather than "nothing has crossed": the byte
  // plane reports per-blob completion and not per-blob progress in this build,
  // so a spinner with no percentage is what a member gets, and a fabricated
  // number would be worse than none. Meaningless on any other state.
  uint32 fetch_percent = 9;
  // THE BYTES A DOWNLOAD ARROW WOULD ASK FOR: the ORIGINAL's content hash,
  // lowercase hex, empty when this replica has no row naming one.
  //
  // It is on the cell because the tap has to name a blob and the cell is what
  // the member taps. Not a path and not a URI: `seat.bytes.fetch` takes a
  // hash, and a shell that had to compose `blob:blake3-<hex>` would be a shell
  // spelling a scheme that is the core's.
  string original_hash = 10;
  // THE PHOTOGRAPH'S OWN PIXEL BOX, from `media_asset.width`/`height`, 0 when
  // the vault does not know it (#1029, photos port). A justified row packs from
  // the REAL aspect ratio before a byte arrives (v0's `justify.ts`), so a
  // tile's shape never reflows when its thumbnail lands; unknown is square.
  uint32 width = 11;
  uint32 height = 12;
  // A video's length in whole seconds, 0 when unknown or not a video — the
  // tile's kind line (`tile-overlays.ts`).
  uint32 duration_seconds = 13;
  // THE CAPTURE-LOCAL DAY, `YYYY-MM-DD`, empty when the photograph carries no
  // capture time. Derived once from `captured_at` and its offset
  // (`PhotosReads`) so both shells group a day identically and neither parses
  // an instant: re-parsing files a 20:00-local photograph under the wrong day.
  string day = 14;
  // A LIVE PHOTO: its paired movie shares this still's capture group and is
  // folded into this one cell rather than drawn beside it.
  bool live = 15;

  // The five states a cell can be in, and no sixth.
  enum Held {
    HELD_UNSPECIFIED = 0;
    // The original is on this device. Everything a member can do with the
    // photograph, they can do offline.
    HELD_ORIGINAL = 1;
    // A thumbnail (or a preview) is here and the original is not, and nothing
    // is holding the original back but a window that has not come round yet.
    HELD_THUMBNAIL_ONLY = 2;
    // The member tapped it and the bytes are moving.
    HELD_FETCHING = 3;
    // The member's own transfer rule is why the original is not here. The
    // distinction that matters: this is a DECISION and not a failure, and it
    // is the state that carries the download arrow.
    HELD_WITHHELD_BY_RULE = 4;
    // Nothing of this photograph has reached this device — not even a
    // thumbnail. A freshly paired phone mid-first-copy is every cell in this
    // state, and it is not an error.
    HELD_ABSENT = 5;
  }

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_PHOTO = 1;
    KIND_VIDEO = 2;
    KIND_AUDIO = 3;
    KIND_SCAN = 4;
  }
}

// A photo state view: a DISCRIMINATED UNION and not a bag of optionals
// (law 3, `navigation.ts:43-46`).
message PhotoStateView {
  oneof view {
    Mode mode = 1;
    Person person = 2;
  }

  message Mode {
    Kind kind = 1;

    enum Kind {
      KIND_UNSPECIFIED = 0;
      KIND_FAVORITES = 1;
      KIND_ARCHIVE = 2;
      KIND_TRASH = 3;
      KIND_VIDEOS = 4;
    }
  }

  message Person {
    string party_id = 1;
    // The name rides along, so the app bar need not wait a replica round trip.
    string person_name = 2;
  }
}

// The camera-roll backup, as a state.
message BackupState {
  Phase phase = 1;
  uint32 assets_remaining = 2;
  uint32 assets_transferred_this_session = 3;
  uint64 bytes_transferred_this_session = 4;
  // WHICH TRANSPORT carried them. The iOS background-transfer experiment
  // (`mobile/maestro/ios-transfer-experiment.md`) decides which of these the
  // product ships, and until it has run this field is what a diagnostics screen
  // reports rather than a claim in a document.
  Transport transport = 5;
  // Why it is not running, when it is not. Never inferred from a radio: the
  // pass asks the platform for the real answer.
  string paused_reason = 6;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_IDLE = 1;
    PHASE_ENUMERATING = 2;
    PHASE_TRANSFERRING = 3;
    // Wi-Fi and charger rules are queried BEFORE EACH background item, not
    // once per pass (`NATIVE_V0.md:11-19`).
    PHASE_WAITING_FOR_POWER = 4;
    PHASE_WAITING_FOR_UNMETERED = 5;
    PHASE_PARKED_LOW_DISK = 6;
    PHASE_DONE = 7;
  }

  enum Transport {
    TRANSPORT_UNSPECIFIED = 0;
    TRANSPORT_IROH_BLOBS = 1;
    // The HTTPS blob door, behind the `blob-door` feature — the one exception
    // to `no-listening-socket`.
    TRANSPORT_HTTPS_BLOB_DOOR = 2;
  }
}

message PhotosGridEvent {
  oneof kind {
    Opened opened = 1;
    DestinationChanged destination = 2;
    NextPageRequested next_page = 3;
    DataArrived data = 4;
    ReadRefused refused = 5;
    PermissionChanged permission = 6;
    PermissionRequested permission_requested = 7;
    StateViewOpened state_view = 8;
    SheetChanged sheet = 9;
    BackupChanged backup = 10;
    SeatChanged seat_changed = 11;
    RowsChanged rows_changed = 12;
    OriginalRequested fetch_original = 14;
    FetchSettled fetch_settled = 15;
    // THE LIBRARY'S OWN CONTROLS (#1029, photos port).
    GrainChanged grain = 16;
    PeriodOpened period = 17;
    RungChanged rung = 18;
    FilterChanged filter = 19;
    SelectionModeChanged selection_mode = 20;
    SelectionToggled selection_toggled = 21;
    SelectionSet selection_set = 22;
    FavoriteSelected favorite_selected = 23;
    TrashConfirmed trash_confirmed = 24;
    AlbumChoiceOpened album_choice_opened = 25;
    AlbumChoiceDismissed album_choice_dismissed = 26;
    AlbumChosen album_chosen = 27;
    AlbumChoicesArrived album_choices = 28;
    AlbumChoiceCreated album_created = 29;
    WriteSettled write_settled = 30;
    ExportSettled export_settled = 31;
    // The originals census answered for the More sheet (`KeepOriginals`).
    FreeUpCounted free_up_counted = 40;
  }

  message FreeUpCounted {
    FreeUpSpace free_up = 1;
  }

  // What the shell's "Send a copy" came to, in the one clause
  // `export_notice` shows.
  message ExportSettled {
    string sentence = 1;
  }

  // THE ZOOM MOVED. `at_day` is where the member was standing when they moved
  // it, so the new grain lands on the same stretch of time (v0's
  // `anchorForGrain`); empty is "at the top".
  message GrainChanged {
    PhotosGridState.Grain grain = 1;
    string at_day = 2;
  }

  // A YEAR OR A MONTH CARD WAS TAPPED: one grain narrower, at that period's
  // first day. A period is not a photograph, so a card never selects.
  message PeriodOpened {
    string anchor_day = 1;
  }

  // The tile size, 0-3 — the menu, a pinch, or the stored rung at launch.
  message RungChanged {
    uint32 rung = 1;
  }

  message FilterChanged {
    PhotosGridState.Filter filter = 1;
  }

  // Select pressed (true) or Cancel (false). Leaving the mode empties the set.
  message SelectionModeChanged {
    bool selecting = 1;
  }

  // One tile tapped while selecting.
  message SelectionToggled {
    string asset_id = 1;
  }

  // A SET AT ONCE: a drag across tiles, or a day's "Select" — `selected` says
  // whether they join the selection or leave it.
  message SelectionSet {
    repeated string asset_ids = 1;
    bool selected = 2;
  }

  // One value for the whole selection, never a per-item toggle
  // (`photos-selection-writes.ts`' `batchFavorite`).
  message FavoriteSelected {
    bool favorite = 1;
  }

  // The member answered the trash confirm with yes.
  message TrashConfirmed {}

  // One write's outcome. `asset_id` is recovered from the key this screen
  // minted, so a refusal names the photograph it was about.
  message WriteSettled {
    bool committed = 1;
    string sentence = 2;
    string asset_id = 3;
  }

  // 13 WAS `BytesArrived`, DELETED BY D-1025-S7-20. A landed byte is a row:
  // the page read resolves what this device holds, and the core names
  // the ASSET rows a window's files belong to — so a blob arriving is an
  // ordinary `RowsChanged` over `media_asset` and this grid has one fewer event
  // to reduce. The event only ever existed because the ids the core had were
  // content ids, which matched nothing this screen was showing.
  //
  // Reserved at the MESSAGE and not in the `oneof`: a oneof's numbers are the
  // message's, and proto3 has no `reserved` inside one.
  reserved 13;

  message Opened {}

  // THE MEMBER TAPPED THE DOWNLOAD ARROW ON ONE CELL (#1025 S5,
  // D-1025-S7-63).
  //
  // Both ids, because they answer two different questions: the hash is what
  // addresses the bytes and the asset id is what the grid keys the cell by, so
  // the reducer can put that one cell into `HELD_FETCHING` without waiting for
  // the round trip. Deriving one from the other would mean a second read.
  message OriginalRequested {
    string asset_id = 1;
    string content_hash = 2;
  }

  // The fetch came back. `fetched` true means the bytes landed — and the row
  // change that lands WITH them is what actually redraws the cell, so this
  // event exists for the OTHER outcomes: a gateway that was not reached, and a
  // refusal by code. A cell stuck spinning because nobody said "it did not
  // happen" is the state this deletes.
  message FetchSettled {
    string asset_id = 1;
    bool fetched = 2;
    // A member-facing sentence from the core's own table, empty when there is
    // nothing worth saying. Never a detail, never a path, never a hash.
    string sentence = 3;
  }

  // A change event named assets this grid may be showing (#1025 S5). It carries
  // IDS and never values: the core's change stream never carries values, which
  // is what makes its coalescing lossless, and a grid re-reads rather than
  // patching a cell whose position in the sort may have moved.
  message RowsChanged {
    repeated string asset_ids = 1;
    // WHICH TABLE MOVED (#1029, photos port). The library reads a star
    // (`core_tag`) under its Favorites filter and the album list
    // (`core_collection*`) while its sheet is open, and neither is a fact about
    // `media_asset` — so the reducer, which knows the filter, decides.
    string table = 2;
  }

  message DestinationChanged {
    PhotosGridState.Destination destination = 1;
  }

  message NextPageRequested {
    string after_cursor = 1;
  }

  message DataArrived {
    PhotosGridData data = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message PermissionChanged {
    MediaPermission permission = 1;
  }

  message PermissionRequested {}

  message StateViewOpened {
    PhotoStateView view = 1;
  }

  message SheetChanged {
    PhotosGridState.Sheet sheet = 1;
  }

  message BackupChanged {
    BackupState backup = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }
}

// ---------------------------------------------------------------------------
// Notes editor
// ---------------------------------------------------------------------------

message NotesEditorState {
  SeatState seat = 1;
  string note_id = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    NoteDraft draft = 5;
  }
  // THE SAVE, AS THE FIXTURE TESTS STILL READ IT. A projection of `autosave`
  // the machine writes and never reads; no view draws it (both editors draw
  // `autosave`). It goes with the fixtures' last reader
  // (`ScreenFixtureTests.swift`, `editor_contract.rs`).
  SaveState save = 6;
  // THE SAVE'S OWN STATE (#1015 D3, autosave). Separate from `content`,
  // because a save that failed over words the member can still see is not a
  // failed READ and must not replace the editor with an error.
  Autosave autosave = 7;
  // The draft as the vault last had it — what "only changed fields" is
  // measured against.
  NoteDraft baseline = 8;
  // The draft the save in flight carries; it becomes `baseline` on commit.
  NoteDraft sending = 9;
  // A NEW NOTE: the id was minted on the phone and nothing is in the vault
  // yet. The first save is `knowledge.create_note` under that id; every later
  // one is `edit_note`. Cleared when the create commits.
  bool is_new = 10;
  // False while the body is not on this device: the title and the pin still
  // save, and the body is read-only with `body_notice` over it.
  bool body_editable = 11;
  string body_notice = 12;
  // THE POWERBOX IS OPEN: the shell presents `notes.link_targets` over the
  // editor and forwards its pick as `LinkPicked`.
  bool link_sheet_open = 13;
  // Where a pick lands in `draft.body` (a UTF-16 offset), and whether it
  // replaces the `[[` typed there.
  uint32 link_anchor = 14;
  bool link_replaces = 15;
  NotesEditorChrome chrome = 16;

  enum SaveState {
    SAVE_STATE_UNSPECIFIED = 0;
    SAVE_STATE_CLEAN = 1;
    SAVE_STATE_DIRTY = 2;
    SAVE_STATE_SAVING = 3;
    // QUEUED left with the outbox: the phone is the vault, and a save
    // commits or it does not.
    reserved 4;
    reserved "SAVE_STATE_QUEUED";
    SAVE_STATE_REFUSED = 5;
  }
}

// The editor's fixed words, and the two that follow its state.
message NotesEditorChrome {
  // "Cancel" before the first keystroke, "Done" after (#1015 D3).
  string close = 1;
  string title_placeholder = 2;
  string body_placeholder = 3;
  // "Pin" / "Unpin".
  string pin_label = 4;
  string history_label = 5;
  string send_to_tasks_label = 6;
  string link_label = 7;
  // "Saving…", "Saved", or the refusal's sentence; empty when clean.
  string status = 8;
  // False on a new note: there is no history until it exists.
  bool history_enabled = 9;
  // The page's title: "New note" before the note exists, "Note" after.
  string title = 10;
  // The editor's menu control, spoken: "Note actions".
  string menu_label = 11;
}

message NoteDraft {
  string title = 1;
  string body = 2;
  Format format = 3;
  bool pinned = 4;
  // The revision this draft was read from, so a save can be concurrency-checked
  // rather than last-write-wins.
  string base_revision_id = 5;
  // Set when the save was refused; the sentence a member reads.
  optional ReadFailure save_failure = 6;
  // THE BODY HAS NOT ARRIVED, which is not the same as an empty note (#1025
  // S5). A note's body is not a column: it lives in the content item
  // `body_content_id` points at and is read through the byte door, and a seat
  // whose reads cannot reach that door yet answers a draft with no body in it.
  //
  // An editor that could not tell those apart would let a member save an empty
  // body over a real one — `knowledge.save_note` takes the whole draft, so a
  // blank field is an instruction to blank the note. The flag exists so the
  // save can be REFUSED rather than made destructive, and it is on the draft
  // rather than on the state because it is a fact about the row that arrived.
  bool body_unavailable = 7;

  enum Format {
    FORMAT_UNSPECIFIED = 0;
    FORMAT_MARKDOWN = 1;
    FORMAT_HTML = 2;
    FORMAT_PLAIN = 3;
  }
}

message NotesEditorEvent {
  oneof kind {
    Opened opened = 1;
    DataArrived data = 2;
    ReadRefused refused = 3;
    TitleEdited title = 4;
    BodyEdited body = 5;
    PinToggled pin = 6;
    // SAVE NOW: the flush the native Save button still sends until K5 removes
    // it. With autosave it only saves sooner than the debounce would.
    SaveRequested save = 7;
    SeatChanged seat_changed = 9;
    RowsChanged rows_changed = 10;
    // The editor is closing: close = done, so unsaved words are saved now.
    Left left = 11;
    // The debounce came due. `token` names the edit it was scheduled for.
    Ticked tick = 12;
    WriteSettled write_settled = 13;
    // Open the powerbox at `caret` (the link button). Typing `[[` opens it
    // too, with no event of its own.
    LinkRequested link_requested = 14;
    LinkPicked link_picked = 15;
    LinkDismissed link_dismissed = 16;
    // INTENTS. The machine changes nothing on them; the shell routes them.
    SendToTasks send_to_tasks = 17;
    HistoryRequested history = 18;
  }

  reserved 8;
  reserved "save_settled";

  message Opened {
    string note_id = 1;
    // The id was minted on the phone for a note not yet written
    // (`NotesRouting.target`): no read, an empty draft, create on first save.
    bool is_new = 2;
  }

  message LinkRequested {
    uint32 caret = 1;
  }

  // The powerbox's pick: `[[title]]` lands at `link_anchor`.
  message LinkPicked {
    NotesLinkTargetRow target = 1;
  }

  message LinkDismissed {}

  // The selected text (or the whole note) as a task's title.
  message SendToTasks {
    string text = 1;
  }

  message HistoryRequested {}

  // A change event named notes (#1025 S5). Whether this editor re-reads is the
  // REDUCER's decision and not the sender's: a member with an unsaved draft
  // must not have it replaced by a copy that arrived from the gateway, so the
  // event is delivered and the machine ignores it while the draft is dirty.
  message RowsChanged {
    repeated string note_ids = 1;
  }

  message DataArrived {
    NoteDraft draft = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message TitleEdited {
    string title = 1;
  }

  message BodyEdited {
    string body = 1;
  }

  message PinToggled {}

  message SaveRequested {}

  message Left {}

  message Ticked {
    string token = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }
}

// ---------------------------------------------------------------------------
// Home — the graded springboard
// ---------------------------------------------------------------------------

// HOW MUCH THIS APP HAS TO SAY, and how sure we are (#1020, wave A).
//
// FOUR states, not three, and the fourth is the point. v0's own words:
// "empty != not-loaded". A tile that read nothing because this seat has no
// copy yet is `UNKNOWN`, and only a tile whose read LANDED and returned
// nothing is `EMPTY`. Collapsing them is how a springboard tells a member
// their vault is empty when the truth is that it has not looked.
enum TileStatus {
  TILE_STATUS_UNSPECIFIED = 0;
  TILE_STATUS_LOADING = 1;
  // No replica, no grant, or a read that failed. We do not KNOW.
  TILE_STATUS_UNKNOWN = 2;
  // A landed read returned nothing. The only state that may say "empty".
  TILE_STATUS_EMPTY = 3;
  TILE_STATUS_CONTENT = 4;
}

// `SMALL` 1x1, `MEDIUM` 2x1, `LARGE` 2x2 — which FLATTENS to 2x1 on the phone's
// two-column grid. The class follows the app's BODY and never its importance: a
// mosaic needs area, prose needs measure, a figure needs neither.
enum TileSize {
  TILE_SIZE_UNSPECIFIED = 0;
  TILE_SIZE_SMALL = 1;
  TILE_SIZE_MEDIUM = 2;
  TILE_SIZE_LARGE = 3;
}

// A count a read ACTUALLY RETURNED.
//
// A message rather than a `uint32`, so its absence is a value: absent is the
// withheld glyph and never a fabricated `0`. Locker withholds its count by
// design, and a `0` there would be a lie about how many secrets a member has.
message TileCount {
  uint32 value = 1;
  // The read hit its ceiling, so the true number is at least `value` — which is
  // why the status line says "at least" when anything is capped.
  bool capped = 2;
}

// What one app's tile renders. A discriminated union and not a bag of
// optionals: the eight bodies share no field, and a reader of `photos` must not
// be able to ask for `figure`.
message TileBody {
  oneof kind {
    Photos photos = 1;
    Docs docs = 2;
    Agenda agenda = 3;
    People people = 4;
    Tasks tasks = 5;
    Tally tally = 6;
    Locker locker = 7;
    Notes notes = 8;
  }

  message Photos {
    repeated Cell cells = 1;
    // The thumbnail pack is on this device. False means the mosaic's cells draw
    // as placeholders for a reason the member can act on.
    bool offline_pack = 2;

    message Cell {
      string asset_id = 1;
      // Absent when the asset exists and its bytes are not addressable yet. It
      // is STILL A CELL: dropping the row reflows ten photos as one blank under
      // a "10".
      optional string thumbnail_path = 2;
    }
  }

  message Docs {
    repeated Row rows = 1;

    message Row {
      string document_id = 1;
      string name = 2;
      // Already formatted by the core, which knows the vault's locale. Never
      // formatted in a view from a byte count.
      string size = 3;
    }
  }

  // THE NEXT OCCURRENCE, AS `agenda.upcoming` ANSWERED IT (#1046): a series
  // is one thing here, headed by its next occurrence. Every field is a
  // finished string — the core placed the occurrence in the DEVICE's zone
  // (`agenda.proto`'s zone rule) and `HomeAgendaTile` composed the words — so
  // a view draws them and parses nothing.
  message Agenda {
    string title = 1;
    // `08:15` today; `Wed 11 · 08:15` on another day; `Today · all day` or
    // `Wed 11 · all day` for a day and not a time.
    string at = 2;
    // What follows it: `then <title>`, `then nothing until the 14th`, or
    // `nothing after it`. Never empty on a tile with a body.
    string after = 3;
  }

  message People {
    repeated Face faces = 1;
    // How many more than the faces shown.
    uint32 more = 2;

    message Face {
      // `party_id`, NEVER the display name: the avatar hue is derived from this
      // so that a rename does not repaint a face the member recognises.
      string party_id = 1;
      string initials = 2;
      // THE RESOLVED HUE KEY, and not a colour: one of `packages/design`'s
      // eight party hues — `rose`, `amber`, `ochre`, `forest`, `teal`, `slate`,
      // `indigo`, `violet` — never a hex and never a CSS `var()`. The producer
      // runs the ONE port of `identity.ts` over `party_id` and whatever the
      // vault stored, so a renderer looks up an emitted colour role and never
      // turns the wheel itself; two renderers that each derived a hue would
      // agree by luck. ABSENT means the wheel could NOT name one — a stored
      // literal it does not recognise — and a renderer draws its neutral disc
      // rather than substituting a hue nobody chose.
      optional string color = 3;
    }
  }

  message Tasks {
    repeated Row rows = 1;

    message Row {
      string task_id = 1;
      string title = 2;
      bool done = 3;
    }
  }

  message Tally {
    Money figure = 1;
    string caption = 2;
    // The rolling comparison, when there is one. Absent renders nothing rather
    // than a zero delta.
    optional string after = 3;
  }

  // Locker's body is a STATE and not a query result, which is why it always has
  // something true to say and is never an invitation to fill it.
  message Locker {
    bool locked = 1;
  }

  message Notes {
    string note_id = 1;
    string title = 2;
    string excerpt = 3;
  }
}

message HomeTile {
  string app_id = 1;
  TileStatus status = 2;
  // ABSENT is the withheld glyph. See `TileCount`.
  TileCount count = 3;
  // The count's own words, from the app's copy leaf.
  string count_label = 4;
  TileSize size = 5;
  // `MEDIUM`, and `LARGE` flattened: full width on the two-column phone grid.
  bool wide = 6;
  // What to DO, never what is missing. Rendered only in the one case grading
  // leaves: a tile that earned the grid while loading and settled with nothing.
  string empty_copy = 7;
  TileBody body = 8;
  // This tile earned a place in the grid. `CONTENT` and `LOADING` earn it —
  // a read in flight holds its slot at full geometry, because demoting and
  // re-promoting a beat later is a relayout the member watches. Locker always
  // earns it. `EMPTY` and `UNKNOWN` do not, and fall to first moves.
  bool earns_grid = 9;
}

// Which of the three Homes this is.
enum Springboard {
  SPRINGBOARD_UNSPECIFIED = 0;
  SPRINGBOARD_LOADING = 1;
  // Every readable tile SETTLED and returned nothing. A claim about the vault,
  // which an unsettled read has not earned.
  SPRINGBOARD_FIRST_RUN = 2;
  SPRINGBOARD_CONTENT = 3;
}

// An app that failed `earns_grid`, offered as something to do.
message FirstMove {
  // An app id, or `connectors` — the one move that is not an app.
  string id = 1;
  // Verb first, and it must land somewhere that can TAKE content.
  string label = 2;
  string hint = 3;
  string icon_key = 4;
  // Absent on the non-app move.
  optional string color = 5;
}

// The one number describing the whole vault, assembled from numbers each true.
message ThingCount {
  // Sums ONLY counts a read returned. A withheld count is omitted, never
  // treated as zero.
  uint32 total = 1;
  // Something contributed its ceiling, so the honest phrasing is "at least".
  bool capped = 2;
  // Every tile has settled. False means the total is still moving.
  bool settled = 3;
}

// Home's health ribbon: the vault at a glance, and whether the gateway holding
// it is answering.
//
// The ONLY feedback channel on this screen — no spinner, no toast, no badge, no
// red dot. `QUIET` is deliberately ignorable; the other two earn one rule and
// one action, never a filled warning plate.
message HomeStatus {
  Tone tone = 1;
  // The ambient sentence about the route.
  string copy = 2;
  // What a member can do, when there is something. Empty when there is not.
  string action = 3;
  Destination destination = 4;

  enum Tone {
    TONE_UNSPECIFIED = 0;
    TONE_QUIET = 1;
    TONE_ATTENTION = 2;
    TONE_URGENT = 3;
  }

  enum Destination {
    DESTINATION_UNSPECIFIED = 0;
    // Not a button. A quiet signal with nowhere to go is still a true sentence.
    DESTINATION_NONE = 1;
    DESTINATION_PHONE = 2;
    DESTINATION_NOTIFICATIONS = 3;
    DESTINATION_BACKUP = 4;
  }
}

message HomeState {
  SeatState seat = 1;
  oneof content {
    Loading loading = 2;
    ReadFailure failure = 3;
    HomeData data = 4;
  }
  // The all-apps listing is a SHEET and never a destination — the same law the
  // Photos grid's `more` follows.
  bool all_apps_sheet_open = 5;
  // The vault lockup, true on every route — see `VaultLockup`.
  VaultLockup vault = 6;
  // EVERY VAULT THIS DEVICE HOLDS, the active one included.
  //
  // A switcher that listed only the OTHERS would be a control that never shows
  // a member where they already are, and the sheet's tick — "this is the one
  // you are reading" — is the fact the member came to check. The order is the
  // shell's listing order and is not re-sorted here: a roster that reordered
  // itself as vaults were added would move the row under a thumb.
  repeated VaultLockup vaults = 7;
  // The vault switcher is a SHEET, exactly as the all-apps listing is: it is
  // not a second Home, it gets no route, and it survives no navigation.
  bool vault_sheet_open = 8;
}

message HomeData {
  // The whole springboard's verdict, decided by the machine so that two shells
  // cannot disagree about which Home this is.
  Springboard springboard = 1;
  // In `SPRINGBOARD_ORDER`, which is the hand-off's tile list and NOT the
  // catalogue's order. Freshness decides what is IN a tile; it must never
  // decide where the tile sits.
  repeated HomeTile tiles = 2;
  // At most three. A nudge as tall as its grid is no nudge.
  repeated FirstMove first_moves = 3;
  ThingCount things = 4;
  HomeStatus status = 5;
  // EVERY tile is `UNKNOWN` — no replica, no grant, or every read failed. The
  // whole springboard's verdict and not one app's, because demoting one
  // unreadable tile beside readable neighbours is right and demoting them ALL
  // leaves a launcher with no tiles. The grid is shown anyway, precisely so the
  // screen does not claim the vault is empty.
  bool every_tile_unreadable = 6;
  // THE PACKED GRID, DECIDED HERE SO THE TWO SHELLS CANNOT PACK IT DIFFERENTLY.
  //
  // Mixed sizes leave a HOLE whenever a 1x1 is followed by a full-width tile,
  // and the fix is to pull the next small forward past the wides between them —
  // never to resize, drop or demote a tile to make a row come out even. That is
  // an ORDERING decision over `wide`, which is to say a decision, which is to
  // say the machine's.
  //
  // The first build of wave A left it to the renderers and they disagreed
  // immediately: Compose's `LazyVerticalGrid` honours a span and SwiftUI's
  // `LazyVGrid` silently ignores `.gridCellColumns`, so one shell drew Photos
  // full width and the other drew it at a half. A row here carries APP IDS and
  // not tiles, so the tile itself is still stated exactly once.
  repeated TileRow grid_rows = 7;
}

// One drawn row of the springboard: the app ids in it, left to right.
message TileRow {
  repeated string app_ids = 1;
}

// THE TWO FACTS TRUE ON EVERY ROUTE: which vault, and how it stands with the
// gateway behind it.
//
// No greeting. The springboard was the only route in v0 that drew them, and
// inside an app the member lost both — which vault they were reading, and
// whether it was reaching its gateway — so the lockup became chrome an app can
// mount. It hangs off the STATE rather than off `HomeData` for the same reason
// the sheet flag does: it is true while Home is loading and true while Home has
// failed, and a lockup that vanished when a read failed would take the vault's
// name away at the moment a member most needs to know which vault they are
// looking at.
//
// **THE SECOND FACT IS THE VAULT'S, NEVER A GATEWAY'S NAME (#1025).** This
// carried `gateway_name` for two waves and nothing on any layer ever wrote it:
// `grep -rn gateway_name crates` answered nothing, so both shells drew "not
// connected to a gateway" over a device that had paired, synced and was holding
// its rows. It was not a missing assignment. Nothing in the pairing exchange
// names a gateway — `PairOk` answers a vault id, a vault name and an address —
// and #1025 settled why: a device pairs with a VAULT, one connection and one
// replica per vault, and a gateway is not a noun the device has. Two vaults
// behind one gateway is a coincidence a device never acts on and must never
// surface. So the field was a name that could not exist, and [State] is the
// fact that can: how THIS vault stands on this device.
//
// **AND THE SECOND FACT IS A STATE, NOT AN ACT (#1025 S7-9).** The enum that
// replaced `gateway_name` was `Link`, and it in turn had a hole: it modelled
// PAIRING as one of a vault's states. A device that holds a vault has already
// paired — that is what holding one means — so `LINK_UNPAIRED` described the
// DEVICE (zero vaults held, show the pair flow) and could never be true of a
// row in the switcher. [State] is the three things that can be true of a
// holding, and every one of them is derived rather than stored.
message VaultLockup {
  // THE VAULT'S OWN ID, which is what a switch names — never a path.
  //
  // Where a vault's bytes sit is the shell's business: one shell keeps them in
  // an iOS container it is handed at launch and the other in an Android files
  // dir, and a screen state that carried either would be a screen state with a
  // filesystem in it. The shell resolves an id to a location; the machine only
  // ever says WHICH vault.
  //
  // Empty on a lockup the shell has not yet identified — a vault whose file
  // would not open, say — and such a vault cannot be switched to, which is
  // correct: the switch would fail at the same door the identification did.
  string vault_id = 5;
  // Empty is a REAL STATE, not a missing value: a member with no vault yet gets
  // "No vault yet" rather than a blank lockup.
  string vault_name = 1;
  // The vault's own identity hue as `#rrggbb`, or empty for plain ink. The
  // shells wash it behind the mark exactly as an app chip is washed.
  string color = 3;
  // How this vault stands on this device. Said IN PLACE, under the vault's
  // name, never as a banner: none of these is an incident.
  State state = 7;
  // ORIGINALS THIS DEVICE'S OWN TRANSFER RULE IS HOLDING BACK (#1025 S4,
  // D-1025-S7-61).
  //
  // The last pass's `withheld`, carried onto the lockup so the header can say
  // it in place. **A grid of thumbnails with no full-size files is a DECISION
  // and not a failure**, and a line that does not say so is how a working byte
  // plane looks broken: the member set the rule, and the number is the only
  // thing on the screen that connects the two.
  //
  // A MODIFIER on the state line and not a fourth `State`. The vault is online
  // or offline independently of it — a device can be perfectly current and
  // still be waiting for Wi-Fi to bring the photographs.
  uint32 originals_withheld = 8;

  // WHAT THIS PHONE IS STILL HOLDING FOR A VAULT THAT MOVED (#1029 F1, W5).
  //
  // "N changes since <date>", or empty for a vault that has not moved. It is a
  // SENTENCE and not a count, because the number alone is ambiguous in the one
  // direction that matters: a member reading "12" has no way to tell twelve
  // changes kept from twelve changes lost, and nothing was lost — `Shelf.freeze`
  // deletes nothing and the phone keeps every row it had.
  //
  // **THE SLOT IS HERE SO THERE IS ONE PLACE.** `HomeBridge.frozenLine` was a
  // door beside the roster, with a comment saying the line "has no slot on
  // `VaultLockup` to ride in" — which made the switcher's row and the header's
  // second line two renderings of one fact taken from two sources, exactly the
  // shape `gateway_name` died of. The line rides the lockup with the state it
  // belongs to.
  string frozen_line = 9;

  // `gateway_name`, which no layer could ever write; `offline`, which only
  // meant something beside it; and `link`, whose enum made pairing a STATE of
  // a vault. See the message header and [State].
  reserved 2, 4, 6;
  reserved "gateway_name", "offline", "link";

  // HOW THIS VAULT STANDS ON THIS DEVICE — AND ON A PHONE THAT IS THE VAULT
  // THERE ARE TWO CASES (#1025 S7-9 superseding D-1025-S7-8's `Link`; trimmed
  // by #1029 W5, hand-off 3).
  //
  // **Pairing is an ACTION, not a state.** `Link` had five cases and two of
  // them were not states of a vault at all. `LINK_UNPAIRED` was a state of the
  // DEVICE — a device holding zero vaults shows the pair flow, and a vault
  // that is held was by definition admitted — so a vault could never truthfully
  // be "unpaired" and the case only ever fired as a guess.
  //
  // **AND THEN THE GATEWAY WENT.** `STATE_SYNCING` and `STATE_OFFLINE` were
  // both facts about a PASS: one said a copy was still coming, the other that
  // the last pass had not reached the gateway. #1029 §1 deletes the sync plane,
  // the replica plane and the pass — the phone IS the vault — so neither could
  // be reached by any layer, and `Shelf.Holding.state` said so in a comment
  // while returning the one honest value. An enum whose values are unreachable
  // is an enum that invites a shell to render a guess; both are RESERVED, by
  // number and by name, so a `buf breaking` WIRE_JSON promise holds and no
  // later value comes back wearing either spelling.
  //
  // "Behind N" is a MODIFIER and not a case, and so is `originals_withheld`.
  enum State {
    // The proto zero, and NEVER EMITTED. Every holding has one of the two
    // below the moment the shelf knows about it, and a shell that receives
    // this is looking at a lockup nobody filled in — it draws no line rather
    // than a claim.
    STATE_UNSPECIFIED = 0;
    // THE VAULT IS HERE AND IT IS WHOLE. A file on this device whose core
    // opened — which includes a RESTING holding, whose handle was closed to
    // give the OS its memory back and whose vault did not change.
    //
    // A PAST-TENSE FACT, and the wording must stay past tense: nothing here
    // probes anything, so a header that said "connected" would promise a live
    // link this state has not checked.
    STATE_ONLINE = 2;
    // THIS VAULT MOVED TO ANOTHER PHONE, AND THIS ONE IS COOPERATING
    // (#1029 F1, W5). Writes refuse, reads do not, the unacked spool is shown
    // in `frozen_line` and KEPT.
    //
    // A STATE and not an incident, drawn in place under the vault's name like
    // the others. Both phones hold the same seed, so no lease can DECIDE who
    // owns a vault; this phone stopped writing because that is the cooperative
    // thing to do. There is no way out of it on this enum, because taking a
    // vault back is a deliberate act on the phone taking it.
    STATE_FROZEN = 4;

    // `STATE_SYNCING` (1) and `STATE_OFFLINE` (3) were facts about a PASS, and
    // #1029 §1 deletes the pass. See the enum header.
    reserved 1, 3;
    reserved "STATE_SYNCING", "STATE_OFFLINE";
  }
}

message HomeEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    TileArrived tile = 3;
    TileRefused tile_refused = 4;
    StatusChanged status = 5;
    AllAppsSheetToggled all_apps = 6;
    SeatChanged seat_changed = 7;
    MovePicked move_picked = 8;
    VaultChanged vault_changed = 9;
    VaultSwitchRequested vault_switch = 10;
    VaultPicked vault_picked = 12;
    RosterChanged roster_changed = 13;
  }

  // `VaultsListed`, the one-shot survey. See `RosterChanged`.
  reserved 11;
  reserved "vaults_listed";

  // THE SHELF PUBLISHED ITS HOLDINGS (#1025 S7-9).
  //
  // Sent whenever MEMBERSHIP changes (a vault admitted, a vault forgotten) or
  // any holding's `State` moves — which makes the switcher's rows and the
  // header's second line two renderings of ONE stream rather than two things
  // updated by two mechanisms that can disagree. That disagreement is what
  // `VaultsListed` was: a one-shot survey taken at launch and never taken
  // again, so a vault admitted afterwards was invisible until relaunch and a
  // vault that went offline kept whatever the survey guessed.
  //
  // The ACTIVE vault is in here too, exactly as it is in `HomeState.vaults`,
  // and its row carries the same `State` the header draws. The header still
  // gets `VaultChanged` separately, because a switch is a different event from
  // a roster moving under it.
  message RosterChanged {
    repeated VaultLockup vaults = 1;
  }

  // The active vault, or the gateway behind it, changed. A vault switch
  // re-points the whole app, so Home reloads: the tiles it is holding belong to
  // the vault the member just left.
  message VaultChanged {
    VaultLockup vault = 1;
  }

  // The member pressed the lockup. THE MARK IS THE SWITCH — there is no
  // separate control beside it, because a lockup that is not pressable and a
  // chevron that is are two affordances for one act.
  message VaultSwitchRequested {}

  // The member chose one from the sheet. The SHEET closes here and the vault
  // changes later — re-pointing is I/O, and `VaultChanged` is what says it
  // landed. A reducer that swapped the lockup on the tap would name a vault
  // that was not open yet.
  message VaultPicked {
    string vault_id = 1;
  }

  message Opened {}

  message Refreshed {}

  // ONE APP'S tile landed. Home fans out one read per app and they arrive
  // independently, so a tile is an event and not a field of one big answer: a
  // Home that waited for the slowest app would be a Home nobody sees.
  message TileArrived {
    string app_id = 1;
    TileStatus status = 2;
    TileCount count = 3;
    string count_label = 4;
    TileBody body = 5;
  }

  // One app's read failed. `UNKNOWN`, never `EMPTY`.
  message TileRefused {
    string app_id = 1;
    ReadFailure failure = 2;
  }

  message StatusChanged {
    HomeStatus status = 1;
  }

  message AllAppsSheetToggled {
    bool open = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message MovePicked {
    string move_id = 1;
  }
}

// ---------------------------------------------------------------------------
// Photos: the rest of the miniapp
// ---------------------------------------------------------------------------
//
// v0 shipped FOURTEEN photos routes (`navigation.ts`, `PhotosStackParamList`).
// This package declares TEN screens for them, and the seven that collapsed did
// so under law 2 — *a band destination is a parameter, not a screen* — read one
// step further than wave 3 read it.
//
// `PhotoStateView`, `AlbumDetail`, `PlaceDetail` and a memory's members are
// **the library under a predicate**. Each one is a page of `media_asset` in
// `captured_at DESC` order with a different `WHERE`, drawing the same
// `PhotoCell` with the same held states and the same download arrow. v0 wrote
// four screens for them and they drifted: `AlbumDetail.tsx` grew a selection
// mode the state views never got, `PlaceDetail.tsx` its own empty sentence, and
// `PhotoStateView`'s trash a countdown none of the others could show. One
// message with a `Shelf` oneof is the same doctrine `TallyListState` already
// keeps for its three destinations, and it is why there is no `AlbumState`.
//
// What did NOT collapse, and why each is its own message:
//
// - **`PhotoLightboxState`** — one asset, not a page. Its content is a detail
//   and not a cell, it owns chrome visibility, and its events are verbs.
// - **`PhotosCollectionsState`** — a list of SHELVES, not of assets.
// - **`PhotosSearchState`** — a query and its hits; the resting state is a
//   third thing that is neither.
// - **`PlacesState`** — places and their counts. Cards and the map are one
//   screen with a `Presentation` parameter, because v0's `PlacesView` and
//   `PlacesMap` read the same rows and differed only in how they drew them.
// - **`PhotosPeopleState`** — confirmed identities.
// - **`FaceReviewState`** — a QUEUE worked one item at a time, whose state is
//   a cursor and a verdict rather than a page.
// - **`DuplicatesState`** / **`DuplicateReviewState`** — a shelf of clusters,
//   and one cluster with a keep decision. Two, for the reason v0 gave: listing
//   clusters and choosing within one are different jobs with different writes.
// - **`PhotosMemoriesState`** — computed memories; their MEMBERS are a shelf.
// - **`PhotoPickerState`** — a grid with a picked set and a destination album.
//   Not a shelf: the picked set is the screen's own state (§10) and a shelf
//   that could be picked from would carry it on every other surface too.

// WHICH LIBRARY THIS IS. The predicate, as a parameter (law 2).
//
// A oneof and not `{mode, album_id?, place_id?, party_id?}` (law 3): the four
// are mutually exclusive by construction, and a bag of optionals is a shape a
// reducer has to defend rather than match on.
message PhotoShelf {
  oneof of {
    // Favorites, archive, trash, videos, or one person's photographs.
    PhotoStateView state_view = 1;
    Album album = 2;
    Place place = 3;
    Memory memory = 4;
  }

  // NAMES RIDE ALONG (law 2's sibling, `navigation.ts:63-69`): every one of
  // these carries the title its app bar shows, so a head never waits for the
  // page read and never paints under the previous shelf.
  message Album {
    string collection_id = 1;
    string name = 2;
  }

  message Place {
    string place_id = 1;
    string place_name = 2;
    // THE PHOTOGRAPHS WITH NO PLACE AT ALL (v0's "No location yet" card), and
    // then `place_id` is empty. A flag and not an empty id standing for it:
    // an empty id is also what a place row with a missing key would send, and
    // the two must not open the same shelf.
    bool unplaced = 3;
  }

  message Memory {
    string memory_id = 1;
    string title = 2;
  }
}

message PhotoShelfState {
  SeatState seat = 1;
  PhotoShelf shelf = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    PhotosGridData data = 5;
  }
  // WHAT THE MEMBER HAS PICKED, when this shelf is in selection mode.
  //
  // On the state and not on the cells, for `TallyListState.pending_expense_ids`'
  // reason: a selection over a cell the page has not loaded yet still has to
  // survive until it arrives.
  repeated string selected_asset_ids = 6;
  bool selecting = 7;
  // TRASH SAYS HOW LONG IT KEEPS THINGS, AND ONLY TRASH CAN.
  //
  // **THE WINDOW, NOT A COUNTDOWN**, and the difference is a clock. This was
  // `purge_in_days` — days until the oldest row is purged — and nothing can
  // produce that number here: `PhotoCell` carries no `purge_at`, so the row's
  // own deadline never reaches the state, and `commonMain` has no clock BY
  // DESIGN (`sync/Instants.kt`), so a reducer could not subtract one from
  // today even if it did. A per-row countdown needs both, and would be a new
  // field on `DataArrived` plus a clock on the read path.
  //
  // The window needs neither and is what v0's trash meta line actually said:
  // "purged 30 days after deletion". The constant is `PURGE_AFTER_DAYS` in
  // `crates/vault/src/commands/media.rs` — NOT `retentionWindows` in
  // `contracts/schema/v0-registries.json`, which holds only `audit` and
  // `ledger`.
  //
  // 0 on every other shelf.
  uint32 purge_window_days = 8;
  // A WRITE WAS REFUSED, AND THE SENTENCE A MEMBER READS.
  //
  // **Its own slot, never the `content` oneof's `failure`.** That slot is the
  // READ's — it is one of the three states a read can be in — and putting a
  // denied write there would replace the rows on screen with an error, so a
  // member whose rename was refused would lose the list they were renaming
  // from. `NoteDraft.save_failure` is the same field for the same reason.
  //
  // Without it a refusal is SILENT: every screen here has a `WriteSettled`
  // event carrying a sentence and, for one draft, nowhere to put it.
  optional ReadFailure write_failure = 9;
  // "ADD TO ALBUM" — the shared sheet's list and whether it is up. See
  // `AlbumChoiceEntry`.
  repeated AlbumChoiceEntry album_choices = 10;
  bool album_choice_open = 11;
  // THE ALBUM THIS SHELF WAS SHOWING IS GONE — its delete committed. The view
  // leaves; a shelf left standing over an album that no longer exists would
  // offer Add and Rename against a row the vault refuses on `album_exists`.
  bool album_gone = 12;
  // WHAT A COPY THE SHELL MADE CAME TO — "Sent", "Saved to this device's
  // photos", "2 originals are not on this device". One clause, reported back by
  // the shell after a platform hand-off (`ExportSettled`), and cleared by the
  // next verb. Not `write_failure`: nothing was written to the vault.
  string export_notice = 13;
  // "KEEP ORIGINALS ON THIS PHONE" — an album shelf's own row (#1029, the
  // photos port; v0's `album-keep-originals.ts`). `offered` is false on every
  // shelf but an album, where the row is not drawn at all.
  KeepOriginalsRow keep_originals = 14;
}

// WHAT FREEING SPACE ON THIS PHONE CAN DO, AS THE MORE SHEET SAYS IT
// (`originals.proto`). Sentences and not numbers, derived once in
// `KeepOriginals` so the two shells cannot word one fact two ways.
message FreeUpSpace {
  // False until a census answered. `meta` then says the phone is counting.
  bool counted = 1;
  // The row's line: how many originals this phone holds, and their size.
  string meta = 2;
  // Why nothing can be freed, and how much of it the member keeps here.
  // Empty when there is nothing on this phone to speak of.
  //
  // THE ROW IS A STATEMENT AND NEVER A BUTTON, and there is no "releasable"
  // flag to make it one: no build can prove the gateway holds an original
  // until originals are backed up (R-1029-PH-1), and a flag that is always
  // false is a control nobody can test the true half of.
  string reason = 3;
}

// ONE ALBUM'S PLACE ON THIS PHONE'S KEEP LIST (`originals.proto`).
message KeepOriginalsRow {
  bool offered = 1;
  // False until the keep list has answered for THIS album. The switch is
  // disabled and `meta` says it is checking: a claim about what freeing space
  // would take is not one to guess at (v0's `pinsReady`).
  bool ready = 2;
  bool keep = 3;
  // A change is on its way to the core. The switch shows the member's answer
  // and holds still until the list confirms it.
  bool saving = 4;
  // The line under the switch, derived once in `KeepOriginals`.
  string meta = 5;
}

message PhotoShelfEvent {
  oneof kind {
    Opened opened = 1;
    NextPageRequested next_page = 2;
    DataArrived data = 3;
    ReadRefused refused = 4;
    RowsChanged rows_changed = 5;
    SeatChanged seat_changed = 6;
    SelectionToggled selection = 7;
    SelectionModeChanged selection_mode = 8;
    // The verbs a shelf has over its selection. Each is a WRITE and each is
    // named, rather than one `ActionInvoked {string verb}`: a string verb is a
    // command name a view composes, and a view that can compose one can
    // compose one the vault does not register.
    RestoreRequested restore = 9;
    DeleteRequested delete = 10;
    ArchiveToggled archive = 11;
    WriteSettled write_settled = 12;
    AlbumChoiceOpened album_choice_opened = 13;
    AlbumChoiceDismissed album_choice_dismissed = 14;
    AlbumChosen album_chosen = 15;
    AlbumChoicesArrived album_choices = 16;
    AlbumChoiceCreated album_choice_created = 17;
    FavoriteToggled favorite = 18;
    // The album's own verbs — only on an album shelf.
    AlbumRenamed album_renamed = 19;
    AlbumDeleteRequested album_delete = 20;
    CoverChosen cover = 21;
    RemoveFromAlbumRequested remove_from_album = 22;
    // The trash's own verb, and the list it needs.
    EmptyTrashRequested empty_trash = 23;
    TrashListed trash_listed = 24;
    ExportSettled export_settled = 25;
    // The member flipped "Keep originals on this phone".
    KeepOriginalsToggled keep_originals_toggled = 26;
    // What the keep list says about this album now — after a read or a change.
    KeepOriginalsSettled keep_originals_settled = 27;
  }

  message KeepOriginalsToggled {
    bool keep = 1;
  }

  // `refusal` non-empty is a list the core would not read or write; the row
  // then says so and the switch stays disabled rather than guessing.
  // `album_id` names the album the answer is about, so an answer that lands
  // after the member moved to another album settles nothing there.
  message KeepOriginalsSettled {
    bool keep = 1;
    string refusal = 2;
    string album_id = 3;
  }

  // Star, or unstar, every picked photograph. `media.set_favorite` per asset.
  message FavoriteToggled {
    bool favorite = 1;
  }

  // An empty name is not a write: `media.rename_album`'s `title` is
  // `minLength: 1`, and the reducer drops it rather than spend a round trip on
  // a refusal it can predict.
  message AlbumRenamed {
    string title = 1;
  }

  // Asked AFTER the screen's own confirm. `media.delete_album` removes the
  // grouping and never a photograph.
  message AlbumDeleteRequested {}

  // "Make key photo": this photograph becomes the album's cover. The asset is
  // named rather than read off the selection, so the one surface that asked
  // says which.
  message CoverChosen {
    string asset_id = 1;
  }

  // Take the picked photographs out of this album. The photographs stay in
  // the library; only the reference goes.
  message RemoveFromAlbumRequested {}

  // Asked AFTER the screen's own confirm. Purges EVERY trashed photograph, not
  // the page on screen — so the reducer asks for the list first.
  message EmptyTrashRequested {}

  // Every trashed asset id, walked to the end. One `media.purge_asset` each.
  message TrashListed {
    repeated string asset_ids = 1;
  }

  // What the shell's copy — "Send a copy", "Download original" — came to, in
  // the one clause `export_notice` shows.
  message ExportSettled {
    string sentence = 1;
  }

  message Opened {
    PhotoShelf shelf = 1;
  }

  message NextPageRequested {
    string after_cursor = 1;
  }

  message DataArrived {
    PhotosGridData data = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    repeated string asset_ids = 1;
    // ONLY THE ALBUM LIST MOVED (`core_collection`) — nothing on this shelf's
    // page did. It re-reads the "Add to album" list while that sheet is up and
    // moves nothing else.
    bool albums_only = 2;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message SelectionToggled {
    string asset_id = 1;
  }

  message SelectionModeChanged {
    bool selecting = 1;
  }

  // Out of trash, or out of the archive. One event: both are the same write
  // with a different column, and the SHELF already says which.
  message RestoreRequested {}

  // Into the trash from a live shelf; OUT OF THE VAULT from the trash itself.
  // `permanent` is not inferred from the shelf here even though it could be:
  // the screen that asked has to have said so, because the two are one tap
  // apart and only one of them is reversible.
  message DeleteRequested {
    bool permanent = 1;
  }

  message ArchiveToggled {
    bool archived = 1;
  }

  // WHICH ROW SETTLED, AND WHETHER IT COMMITTED.
  //
  // **`asset_id` is not optional decoration: without it a partial refusal
  // reads as a whole success.** A selection of twelve submits twelve writes,
  // and a screen told only "something committed" has to guess — so it marks
  // all twelve done, and the two the vault refused a precondition on quietly
  // stay where they were. Empty means the settle is about the batch and not
  // about one row.
  message WriteSettled {
    bool committed = 1;
    string sentence = 2;
    string asset_id = 3;
    // WHICH COMMAND SETTLED, as the vault registers it. The album's own verbs
    // are about no row: a committed rename retitles the shelf and a committed
    // delete closes it, and neither can be told from an add by `asset_id`.
    string command = 4;
    // The name a committed `media.rename_album` gave the album.
    string album_title = 5;
  }
}

// ---------------------------------------------------------------------------
// The album choice sheet — "Add to album", wherever it is offered
// ---------------------------------------------------------------------------

// ONE ALBUM A PICK CAN GO INTO.
//
// DEFINED ONCE AND CARRIED BY EVERY SCREEN THAT OFFERS "ADD TO ALBUM" — the
// lightbox, the library grid, a shelf — as `repeated AlbumChoiceEntry
// album_choices` beside a `bool album_choice_open` on that screen's state. v0
// asked "which album?" from four surfaces through four hand-rolled alerts and
// one of them sliced its list to six (`PhotosChoiceSheet.tsx`); one message is
// one list, and `AlbumChoice.kt` is the one read that fills it.
message AlbumChoiceEntry {
  string album_id = 1;
  string title = 2;
  // Photographs in it, counted from one page of entries — see `count_capped`.
  int64 count = 3;
  // THE COVER AS AN ASSET, empty when the album has none or this device cannot
  // resolve it. `core_collection.cover_content_id` names a CONTENT item, and
  // the asset behind it is a second read.
  string cover_asset_id = 4;
  // The cover's thumbnail, absent when this device holds no image for it. Never
  // a placeholder path — the sheet draws the empty cover itself.
  optional string cover_thumbnail_path = 5;
  // THE COUNT IS A FLOOR, NOT A TOTAL, when the entry page filled —
  // `ShelfRow.item_count_capped`'s rule and reason.
  bool count_capped = 6;
}

// The member asked to put the pick into an album: the sheet opens and the
// album list is read.
message AlbumChoiceOpened {}

// The sheet went away without a choice.
message AlbumChoiceDismissed {}

// The album the pick goes into. One `media.add_to_album` per picked asset.
message AlbumChosen {
  string album_id = 1;
}

// THE LIST, READ. Its own arm rather than a field on the screen's page: the
// albums are a second read the sheet asks for when it opens, and a screen's
// `DataArrived` is its own page and nothing else.
message AlbumChoicesArrived {
  repeated AlbumChoiceEntry choices = 1;
}

// "NEW ALBUM…" FROM THE SHEET. The vault mints the id and a screen's settle
// never carries the command's output, so the pick cannot follow the create in
// one step: the create commits, the list re-reads, the new album is in it, and
// the member's next tap puts the pick there (`AlbumChoice.kt`).
message AlbumChoiceCreated {
  string title = 1;
}

// ---------------------------------------------------------------------------
// The lightbox
// ---------------------------------------------------------------------------

// ONE PHOTOGRAPH, AS MUCH AS THIS DEVICE KNOWS OF IT.
//
// Not a `PhotoCell` with extra fields: a cell is what a grid draws 120 of and
// every field on it costs a page read; this is what one tap is worth. The two
// share `held` and `original_hash` deliberately — the download arrow is the
// same affordance in both places and a second derivation of it would be a
// second answer.
message PhotoDetail {
  string asset_id = 1;
  optional string thumbnail_path = 2;
  // The ORIGINAL's local path, when this device holds it. The lightbox is the
  // one surface that draws full-size bytes, and absent here is what makes the
  // thumbnail the fallback rather than an error.
  optional string original_path = 3;
  string title = 4;
  string captured_at = 5;
  int32 captured_utc_offset_minutes = 6;
  PhotoCell.Kind kind = 7;
  PhotoCell.Held held = 8;
  string original_hash = 9;
  bool favorite = 10;
  bool archived = 11;
  bool trashed = 12;
  // Pixels, and 0 when the row does not say. Never computed from a decoded
  // image: the vault's columns are the answer and a decode is a different
  // number on a device that only has a thumbnail.
  uint32 width = 13;
  uint32 height = 14;
  // Seconds, 0 for a still.
  uint32 duration_seconds = 15;
  uint64 byte_size = 16;
  // WHERE, as the vault names it — never a coordinate formatted into a
  // sentence. Empty when the asset has no place.
  string place_name = 17;
  string place_id = 18;
  // WHO IS IN IT: confirmed face regions only. A proposal belongs to face
  // review and naming it here would make a guess look like a fact.
  repeated PhotoPerson people = 19;
  // What the enrichment plane has said about this photograph, as labels. The
  // member's own tags and a model's proposals are the SAME table with
  // different confidence, so the row says which.
  repeated PhotoLabel labels = 20;
  string camera = 21;
  // HOW FAR A `HELD_FETCHING` ORIGINAL HAS GOT, 0-100, and 0 when nobody can
  // say — the same field `PhotoCell` carries, and for a stronger reason.
  //
  // It was absent here for one draft, which put a percentage on the 120-cell
  // grid and nothing on the ONE surface a member actually watches a download
  // on. A member who taps an arrow in the grid glances; a member in the
  // lightbox is waiting for that photograph, and it is the place where the
  // absence of a number is felt.
  uint32 fetch_percent = 22;
  // WHICH PARTS OF THIS PHOTOGRAPH COULD NOT BE READ.
  //
  // A lightbox is SEVEN reads — the asset, then place, faces, people, tags,
  // concepts and content — and only the first can honestly fail the screen. A
  // refused tag read must not replace the photograph with a sentence. But the
  // opposite is just as wrong and was the state for one draft: a satellite
  // that refused simply produced nothing, so **"nobody is in this photograph"
  // and "the face read was refused" drew the same empty panel.** That is the
  // two-empty-cell-sentences defect one level up, and the fix is the same one
  // — say which absence this is.
  //
  // Empty is the ordinary case: everything that was asked, answered.
  repeated Part unread_parts = 23;
  // THE ORIGINAL'S CONTENT ITEM, off the content leg — the id the byte door
  // (`ContentUrlRequest`) is asked by. The page door answers for hashes and
  // never for paths, so this is what `original_path` is located from.
  string content_id = 24;
  // WHETHER THE STAGE MAY DRAW `original_path`, as the byte door answered it
  // (`ContentUrl.embeddable`). A security answer and not a hint: a path the
  // member may still SEND is not always one this screen may render.
  bool original_embeddable = 25;
  // What the original's owner reads its bytes as (`ContentUrl.media_type`).
  // A blob in the store has no extension, so a player that has to be told
  // what a file is, and a copy that has to be named, both read it here.
  string original_media_type = 26;
  // THE PLACE'S COORDINATE, for "Copy exact location" and nothing else. Never
  // printed: a coordinate leaves the screen only because the member asked for
  // it, onto their own clipboard (`docs/photos/places.md`, layer 2).
  double place_latitude = 27;
  double place_longitude = 28;
  // Both or neither — a row with half a pin has no coordinate to copy.
  bool place_has_coordinate = 29;
  // A LIVE PHOTO'S MOVIE: the video asset that shares this still's capture
  // group. Empty on everything that is not one half of a Live Photo pair.
  string live_asset_id = 30;
  string live_content_id = 31;
  // The movie's local path, once the byte door has located it.
  optional string live_path = 32;

  // The satellite reads, named, so an absence can say which kind it is.
  enum Part {
    PART_UNSPECIFIED = 0;
    PART_PLACE = 1;
    PART_PEOPLE = 2;
    PART_LABELS = 3;
    // The content row: byte size, and the original's hash.
    PART_CONTENT = 4;
  }
}

message PhotoPerson {
  string party_id = 1;
  string display_name = 2;
}

message PhotoLabel {
  string concept_id = 1;
  string label = 2;
  // True when a member put it there; false when a derivation proposed it.
  bool confirmed = 3;
  // THE EDGE, so removing a label removes THIS one: `core.untag_item` takes a
  // tag id and never a word, because two schemes can spell one word.
  string tag_id = 4;
}

// A PLACE THE MEMBER CAN MOVE A PHOTOGRAPH TO ("Adjust location"). The name
// is the readable one or empty — never a coordinate dressed as a name.
message PhotoPlaceChoice {
  string place_id = 1;
  string name = 2;
}

message PhotoLightboxState {
  SeatState seat = 1;
  // The asset this lightbox opened on. Present before the read lands, so the
  // chrome has something to key by.
  string asset_id = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    PhotoDetail detail = 5;
  }
  // CHROME IS A STATE, NOT AN ANIMATION. A tap hides the bars; a member who
  // has hidden them and rotates the phone must not get them back.
  bool chrome_visible = 6;
  Sheet sheet = 7;
  // The filmstrip's neighbours, so a swipe has somewhere to go without a read
  // per swipe. Ordered as the shelf that opened this lightbox ordered them.
  repeated string neighbour_asset_ids = 8;
  // A WRITE WAS REFUSED, AND THE SENTENCE A MEMBER READS.
  //
  // **Its own slot, never the `content` oneof's `failure`.** That slot is the
  // READ's — it is one of the three states a read can be in — and putting a
  // denied write there would replace the rows on screen with an error, so a
  // member whose rename was refused would lose the list they were renaming
  // from. `NoteDraft.save_failure` is the same field for the same reason.
  //
  // Without it a refusal is SILENT: every screen here has a `WriteSettled`
  // event carrying a sentence and, for one draft, nowhere to put it.
  optional ReadFailure write_failure = 9;
  // THE ALBUM THIS LIGHTBOX WAS OPENED FROM, empty everywhere else. "Make key
  // photo" is offered only here: a cover is chosen from an album's members,
  // and the album a member walked in from is the one they mean.
  string album_id = 10;
  // A SLIDESHOW IS A MODE OF THIS SCREEN, not a screen of its own (v0's
  // `SLIDESHOW`): no filmstrip, no info, and one way out — Leave.
  bool slideshow = 11;
  // WHAT THE LAST HAND-OFF DID, on the stage's one status line: "Sent with no
  // location.", "Saved to Photos." Stated every time, because silence reads
  // as safety. A hand-off that did NOT happen lands on `write_failure`.
  string notice = 12;
  // "Add to album" — the shared sheet's contract (`AlbumChoice.kt`).
  repeated AlbumChoiceEntry album_choices = 13;
  bool album_choice_open = 14;
  // "Adjust location": the places this vault knows, read when the picker opens.
  repeated PhotoPlaceChoice place_choices = 15;
  // THE FILMSTRIP'S FRAMES, read in a window around the photograph on screen.
  // Cells and not ids, because a strip of ids is a strip of blanks; ordered by
  // `neighbour_asset_ids`, never by this read.
  repeated PhotoCell film = 16;

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    // Everything the vault knows: the facts panel.
    SHEET_INFO = 2;
    // WHAT LEAVES THE VAULT, AND IN WHAT FORM. A share is a decision about
    // bytes, so it is a sheet with a choice and never a direct hand-off.
    SHEET_SHARE = 3;
    SHEET_MORE = 4;
    // "Adjust location": the place picker.
    SHEET_PLACE = 5;
  }
}

message PhotoLightboxEvent {
  oneof kind {
    Opened opened = 1;
    DataArrived data = 2;
    ReadRefused refused = 3;
    RowsChanged rows_changed = 4;
    SeatChanged seat_changed = 5;
    ChromeToggled chrome = 6;
    SheetChanged sheet = 7;
    Moved moved = 8;
    FavoriteToggled favorite = 9;
    ArchiveToggled archive = 10;
    DeleteRequested delete = 11;
    OriginalRequested fetch_original = 12;
    FetchSettled fetch_settled = 13;
    WriteSettled write_settled = 14;
    OriginalLocated located = 15;
    SlideshowChanged slideshow = 16;
    SlideshowAdvanced slideshow_advanced = 17;
    CaptionChanged caption = 18;
    TagAdded tag_added = 19;
    TagRemoved tag_removed = 20;
    PlaceChosen place_chosen = 21;
    PlaceChoicesArrived place_choices = 22;
    KeyPhotoRequested key_photo = 23;
    HandOffSettled hand_off_settled = 24;
    FilmArrived film = 25;
    LiveArrived live = 26;
    AlbumChoiceOpened album_choice_opened = 27;
    AlbumChoiceDismissed album_choice_dismissed = 28;
    AlbumChosen album_chosen = 29;
    AlbumChoicesArrived album_choices = 30;
    AlbumChoiceCreated album_choice_created = 31;
  }

  message Opened {
    string asset_id = 1;
    repeated string neighbour_asset_ids = 2;
    // The album the member walked in from, empty from anywhere else. See
    // `PhotoLightboxState.album_id`.
    string album_id = 3;
  }

  // ONE LEG OF THE LIGHTBOX'S READ LANDED.
  //
  // **`amendment` is explicit and is not inferred from an empty `asset_id`.**
  // It was, for one draft: "a detail with no id is a satellite". That works
  // only while no satellite can carry an id, and it fails silently the moment
  // one does — which is exactly what a placement or face leg would want to
  // carry. A reducer that cannot tell a merge from a replace paints one
  // photograph's people onto another, and both shapes typecheck.
  //
  // False replaces the detail; true merges the fields this leg set into the
  // detail already on screen, and is dropped when there is none.
  message DataArrived {
    PhotoDetail detail = 1;
    bool amendment = 2;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    repeated string asset_ids = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message ChromeToggled {
    bool visible = 1;
  }

  message SheetChanged {
    PhotoLightboxState.Sheet sheet = 1;
  }

  // A swipe landed on a neighbour. The id and not a delta: the shell knows
  // which cell it swiped to, and an index into a list the reducer also holds
  // is two places one fact can be wrong.
  message Moved {
    string asset_id = 1;
  }

  message FavoriteToggled {
    bool favorite = 1;
  }

  message ArchiveToggled {
    bool archived = 1;
  }

  message DeleteRequested {
    bool permanent = 1;
  }

  message OriginalRequested {
    string asset_id = 1;
    string content_hash = 2;
  }

  message FetchSettled {
    string asset_id = 1;
    bool fetched = 2;
    string sentence = 3;
  }

  message WriteSettled {
    bool committed = 1;
    string sentence = 2;
  }

  // THE BYTE DOOR ANSWERED FOR THIS PHOTOGRAPH'S FILES (`ContentUrlRequest`).
  //
  // The page door hands out hashes and never paths, so `PhotoDetail.
  // original_path` is located by a second door the bridge asks, keyed by the
  // asset it asked about — an answer for a photograph the member has swiped
  // past lands on nothing. An absent path is a real answer: this device does
  // not hold those bytes.
  message OriginalLocated {
    string asset_id = 1;
    optional string original_path = 2;
    bool embeddable = 3;
    string media_type = 4;
    optional string live_path = 5;
  }

  // Start or leave the slideshow.
  message SlideshowChanged {
    bool playing = 1;
  }

  // THE SLIDESHOW'S CLOCK TICKED. The shell owns the clock — a reducer has
  // none — and the reducer owns WHERE the next photograph is, wrapping at the
  // end of the shelf as v0's did.
  message SlideshowAdvanced {}

  // The caption the member typed, committed. Empty clears it.
  message CaptionChanged {
    string caption = 1;
  }

  // A free-form label, added (`core.tag_item`).
  message TagAdded {
    string label = 1;
  }

  // One label, removed by its edge (`core.untag_item`).
  message TagRemoved {
    string tag_id = 1;
  }

  // "Adjust location": a place picked, or EMPTY to clear the photograph's
  // place back to unknown (`media.set_asset_place` with no `place_id`).
  message PlaceChosen {
    string place_id = 1;
  }

  // The picker's list, read.
  message PlaceChoicesArrived {
    repeated PhotoPlaceChoice places = 1;
  }

  // "Make key photo": this photograph becomes the cover of the album the
  // lightbox was opened from.
  message KeyPhotoRequested {}

  // A HAND-OFF TO THE OS — a copy sent, an original saved — and what it did.
  // `done` puts the sentence on the status line; a refusal lands on
  // `write_failure`, because a copy that did not leave is a thing the member
  // asked for that did not happen.
  message HandOffSettled {
    bool done = 1;
    string sentence = 2;
  }

  // THE FILMSTRIP'S FRAMES for a window of neighbours, read.
  message FilmArrived {
    repeated PhotoCell frames = 1;
  }

  // THIS STILL'S LIVE PHOTO MOVIE, or the empty answer that it has none.
  message LiveArrived {
    string asset_id = 1;
    string live_asset_id = 2;
    string live_content_id = 3;
  }
}

// ---------------------------------------------------------------------------
// Collections — the band's second destination
// ---------------------------------------------------------------------------

// A SHELF, AS A ROW IN A LIST OF THEM.
//
// The standing shelves (Favorites, Archive, Trash, Videos) and a member's own
// albums are ONE row type with one `PhotoShelf` in it, because the Collections
// screen draws them in one list and a tap on either lands on `photos.shelf`.
// v0 drew two component families here and had to keep their covers, counts and
// empty states in step by hand.
//
// The DOORS that are not shelves — People, Places, Memories, Duplicates — are
// [CollectionsDoor] below, because their tap lands somewhere else.
message ShelfRow {
  PhotoShelf shelf = 1;
  string title = 2;
  // How many assets are on it. A read that counts, and 0 is a real count: a
  // shelf with no photographs says "Empty" and is still a door.
  uint32 item_count = 3;
  // THE COUNT IS A FLOOR, NOT A TOTAL. The read door has no `COUNT(*)`, so
  // every count in this section is counted from the rows one page returned —
  // and a page that filled has more behind it. `HomeState.ThingCount` carries
  // this as `capped` for the same reason and with the same consequence: the
  // honest phrasing is "at least", and a screen that printed a bare number
  // over a full page would be stating a total nobody counted.
  bool item_count_capped = 6;
  // The cover's thumbnail path, absent when this device has no image for it.
  // Never a placeholder path — the view draws the empty cover itself.
  optional string cover_thumbnail_path = 4;
  // A standing shelf cannot be renamed or deleted; an album can. The row says
  // so rather than the view deriving it from the oneof, so a fifth standing
  // shelf does not need every menu edited.
  bool member_owned = 5;
}

// A door on Collections that is NOT a shelf of assets.
message CollectionsDoor {
  Kind kind = 1;
  // The count its own screen would show, 0 when nothing is known yet. On the
  // door because a member deciding whether to open it is deciding on the
  // number, and a door that says nothing is a door nobody opens.
  uint32 count = 2;
  // Set when the door has something waiting: proposed faces to name, duplicate
  // clusters to resolve. It is what draws the badge.
  uint32 needs_attention = 3;
  // THE COUNT IS A FLOOR, NOT A TOTAL. The read door has no `COUNT(*)`, so
  // every count in this section is counted from the rows one page returned —
  // and a page that filled has more behind it. `HomeState.ThingCount` carries
  // this as `capped` for the same reason and with the same consequence: the
  // honest phrasing is "at least", and a screen that printed a bare number
  // over a full page would be stating a total nobody counted.
  bool count_capped = 4;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_PEOPLE = 1;
    KIND_PLACES = 2;
    KIND_MEMORIES = 3;
    KIND_DUPLICATES = 4;
  }
}

message PhotosCollectionsState {
  SeatState seat = 1;
  oneof content {
    Loading loading = 2;
    ReadFailure failure = 3;
    PhotosCollectionsData data = 4;
  }
  Sheet sheet = 5;
  // A WRITE WAS REFUSED, AND THE SENTENCE A MEMBER READS.
  //
  // **Its own slot, never the `content` oneof's `failure`.** That slot is the
  // READ's — it is one of the three states a read can be in — and putting a
  // denied write there would replace the rows on screen with an error, so a
  // member whose rename was refused would lose the list they were renaming
  // from. `NoteDraft.save_failure` is the same field for the same reason.
  //
  // Without it a refusal is SILENT: every screen here has a `WriteSettled`
  // event carrying a sentence and, for one draft, nowhere to put it.
  optional ReadFailure write_failure = 6;

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    // Naming a new album. A sheet and not a route: it is one field and a
    // verb, and a push for it would put a keyboard behind a back chevron.
    SHEET_NEW_ALBUM = 2;
  }
}

message PhotosCollectionsData {
  repeated ShelfRow shelves = 1;
  repeated CollectionsDoor doors = 2;
  optional string next_cursor = 3;
}

message PhotosCollectionsEvent {
  oneof kind {
    Opened opened = 1;
    NextPageRequested next_page = 2;
    DataArrived data = 3;
    ReadRefused refused = 4;
    RowsChanged rows_changed = 5;
    SeatChanged seat_changed = 6;
    SheetChanged sheet = 7;
    AlbumCreated album_created = 8;
    AlbumDeleted album_deleted = 9;
    WriteSettled write_settled = 10;
  }

  message Opened {}

  message NextPageRequested {
    string after_cursor = 1;
  }

  message DataArrived {
    PhotosCollectionsData data = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    repeated string collection_ids = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message SheetChanged {
    PhotosCollectionsState.Sheet sheet = 1;
  }

  message AlbumCreated {
    string name = 1;
  }

  message AlbumDeleted {
    string collection_id = 1;
  }

  message WriteSettled {
    bool committed = 1;
    string sentence = 2;
  }
}

// ---------------------------------------------------------------------------
// Search — the band's third destination
// ---------------------------------------------------------------------------

// THREE SCREENS BEHIND ONE DESTINATION, and the oneof is which one is showing.
//
// v0 had `PhotosSearchRestingState`, `PhotosSearchEmptyState` and the hits in
// three components with three empty sentences between them. They are three
// states of one search and not three places, and the difference that matters is
// the one a bag of optionals erases: a member who has typed nothing and a
// member whose query matched nothing must not read the same words.
message PhotosSearchState {
  SeatState seat = 1;
  // What the member has typed. The screen's own, never the vault's.
  string query = 2;
  oneof content {
    // Nothing typed yet: what there is to search FOR.
    SearchResting resting = 3;
    Loading loading = 4;
    ReadFailure failure = 5;
    SearchHits hits = 6;
  }
}

// The vocabulary a member can search by, when they have not searched yet.
message SearchResting {
  // Concepts the enrichment plane has actually attached to this vault's
  // photographs — never a fixed list of words the product hopes are there.
  repeated PhotoLabel suggested_labels = 1;
  // People a member has CONFIRMED on a face. A proposal is not a person yet.
  repeated PhotoPerson people = 2;
  // Places with photographs behind them, as the shelf each one opens — so a
  // tap on "Lisbon" lands on Lisbon's photographs and costs no second lookup.
  // Only places whose name is a name: a coordinate-shaped label reads as an
  // answer and is left out rather than printed.
  repeated PhotoShelf.Place places = 4;

  // 3 WAS `repeated string places`: a word with no id behind it, which a view
  // could print and could not open.
  reserved 3;
}

message SearchHits {
  repeated PhotoCell cells = 1;
  optional string next_cursor = 2;
  bool thumbnail_pack_absent = 3;
  // WHY THESE MATCHED — the same query can hit a label, a person or a place,
  // and a member looking at a grid with no explanation cannot tell which.
  repeated SearchMatch matches = 5;
  // THE PEOPLE, PLACES AND ALBUMS THE QUERY NAMED, above the photographs
  // (v0's `search-hits.ts`): each one tap from the shelf that owns it. At most
  // three of each kind, narrowest kind first — person, place, album.
  repeated SearchTopHit top_hits = 6;
  // WHICH QUERY THESE HITS ANSWER. A member types faster than a vault reads,
  // so a page can land after the field has moved on; a reducer that took it
  // would draw the last query's photographs under this query's words.
  string query = 7;

  // 4 WAS `repeated string matched_on`, AND IT WAS THE ONE PLACE IN THIS
  // SECTION THAT CARRIED A KIND AS PROSE. Every shell composing its own
  // "Person: Ada" / "In Lisbon" is two shells wording one fact two ways, which
  // is precisely how v0's empty states drifted apart. The kind is an enum and
  // the name is a string, so the sentence is the view's and the DISTINCTION is
  // the contract's.
  reserved 4;
}

// ONE REASON A HIT IS A HIT.
message SearchMatch {
  Kind kind = 1;
  // What was matched, in the vault's own words: the concept's label, the
  // party's display name, the place's name. Never the member's query echoed
  // back — the point is to show what it landed on.
  string value = 2;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_LABEL = 1;
    KIND_PERSON = 2;
    KIND_PLACE = 3;
    // The member's own words on the asset: its title.
    KIND_TITLE = 4;
    // An album the member named.
    KIND_ALBUM = 5;
  }
}

// ONE PERSON, PLACE OR ALBUM THE QUERY NAMED — a door, not a photograph.
message SearchTopHit {
  // Person, place or album. Never a title or a label: a caption belongs to
  // one photograph and a label has no shelf of its own, so both are reasons
  // under the grid (`SearchMatch`) and not rows above it.
  SearchMatch.Kind kind = 1;
  // The vault's own words: the party's name, the place's name, the album's.
  string label = 2;
  // How many photographs it holds, counted off one page — so a FLOOR when
  // `photo_count_capped` says the page filled, and "at least" is the phrase.
  uint32 photo_count = 3;
  bool photo_count_capped = 4;
  // Where a tap lands, built once by the read so both shells open the same
  // shelf with the same name in its head.
  PhotoShelf shelf = 5;
}

message PhotosSearchEvent {
  oneof kind {
    Opened opened = 1;
    QueryChanged query = 2;
    NextPageRequested next_page = 3;
    DataArrived data = 4;
    RestingArrived resting = 5;
    ReadRefused refused = 6;
    SeatChanged seat_changed = 7;
    RowsChanged rows_changed = 8;
  }

  message Opened {}

  message QueryChanged {
    string query = 1;
  }

  message NextPageRequested {
    string after_cursor = 1;
  }

  message DataArrived {
    SearchHits hits = 1;
  }

  message RestingArrived {
    SearchResting resting = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message RowsChanged {
    repeated string asset_ids = 1;
  }
}

// ---------------------------------------------------------------------------
// Places
// ---------------------------------------------------------------------------

message PlaceRow {
  string place_id = 1;
  string name = 2;
  uint32 asset_count = 3;
  optional string cover_thumbnail_path = 4;
  // The pin. Both present or both absent — a place row with one coordinate is
  // a row the map cannot draw, and `has_coordinate` is what says which,
  // because 0,0 is a real point in the Gulf of Guinea and not a null.
  double latitude = 5;
  double longitude = 6;
  bool has_coordinate = 7;
  // The vault's own name for the place's zone, so a member reading "3pm" reads
  // the hour the photograph was taken at.
  string time_zone = 8;
  // THE COUNT IS A FLOOR, NOT A TOTAL, and here it cannot be anything else:
  // `media_asset.captured_at` is nullable, so the pass that counts a place's
  // assets takes ONE page and never continues (`KitError::NullableSortKey`).
  // Past that page the honest phrasing is "at least".
  bool asset_count_capped = 9;
}

// CARDS OR A MAP IS A PARAMETER, NOT A SCREEN.
//
// v0's `PlacesView` and `PlacesMap` read the same rows and differed in the
// draw. Two screens meant two reads, two empty states and two ways to be out
// of date, and the member's own words for the choice are "show me this as a
// map" — which is a control on one screen.
message PlacesState {
  SeatState seat = 1;
  Presentation presentation = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    PlacesData data = 5;
  }
  // A WRITE WAS REFUSED, AND THE SENTENCE A MEMBER READS.
  //
  // **Its own slot, never the `content` oneof's `failure`.** That slot is the
  // READ's — it is one of the three states a read can be in — and putting a
  // denied write there would replace the rows on screen with an error, so a
  // member whose rename was refused would lose the list they were renaming
  // from. `NoteDraft.save_failure` is the same field for the same reason.
  //
  // Without it a refusal is SILENT: every screen here has a `WriteSettled`
  // event carrying a sentence and, for one draft, nowhere to put it.
  optional ReadFailure write_failure = 6;

  enum Presentation {
    PRESENTATION_UNSPECIFIED = 0;
    PRESENTATION_CARDS = 1;
    PRESENTATION_MAP = 2;
  }
}

message PlacesData {
  repeated PlaceRow places = 1;
  optional string next_cursor = 2;
  // HOW MANY PHOTOGRAPHS HAVE NO PLACE AT ALL. A real answer and a door: it is
  // the number a member needs to judge whether the map is the library or a
  // corner of it, and v0 never showed it.
  uint32 unplaced_count = 3;
  // Same floor, same cause, and it matters more here: `unplaced_count` is what
  // tells a member whether the map is their library or a corner of it, and a
  // number that quietly stopped at one page would answer that question wrong.
  bool unplaced_count_capped = 4;
}

message PlacesEvent {
  oneof kind {
    Opened opened = 1;
    PresentationChanged presentation = 2;
    NextPageRequested next_page = 3;
    DataArrived data = 4;
    ReadRefused refused = 5;
    RowsChanged rows_changed = 6;
    SeatChanged seat_changed = 7;
    PlaceRenamed renamed = 8;
    WriteSettled write_settled = 9;
  }

  message Opened {}

  message PresentationChanged {
    PlacesState.Presentation presentation = 1;
  }

  message NextPageRequested {
    string after_cursor = 1;
  }

  message DataArrived {
    PlacesData data = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    repeated string place_ids = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message PlaceRenamed {
    string place_id = 1;
    string name = 2;
  }

  message WriteSettled {
    bool committed = 1;
    string sentence = 2;
  }
}

// ---------------------------------------------------------------------------
// People, and the faces that are not people yet
// ---------------------------------------------------------------------------

message PersonRow {
  string party_id = 1;
  string display_name = 2;
  // Confirmed regions only. A proposal is not a photograph of someone until a
  // member has said so.
  uint32 photo_count = 3;
  optional string cover_thumbnail_path = 4;
  // THE ASSET THE COVER COMES FROM, SO A SECOND READ HAS A KEY.
  //
  // Without it the cover cannot be filled at all: a cover is `media_asset`'s
  // thumbnail, the door has no join, and a row with no asset id gives a
  // second leg nothing to ask about. Same shape as
  // `DuplicateCluster.member_asset_ids` and for the same reason.
  string cover_asset_id = 6;
  // THE COUNT IS A FLOOR, NOT A TOTAL. The read door has no `COUNT(*)`, so
  // every count in this section is counted from the rows one page returned —
  // and a page that filled has more behind it. `HomeState.ThingCount` carries
  // this as `capped` for the same reason and with the same consequence: the
  // honest phrasing is "at least", and a screen that printed a bare number
  // over a full page would be stating a total nobody counted.
  bool photo_count_capped = 5;
}

message PhotosPeopleState {
  SeatState seat = 1;
  oneof content {
    Loading loading = 2;
    ReadFailure failure = 3;
    PhotosPeopleData data = 4;
  }
  // A WRITE WAS REFUSED, AND THE SENTENCE A MEMBER READS.
  //
  // **Its own slot, never the `content` oneof's `failure`.** That slot is the
  // READ's — it is one of the three states a read can be in — and putting a
  // denied write there would replace the rows on screen with an error, so a
  // member whose rename was refused would lose the list they were renaming
  // from. `NoteDraft.save_failure` is the same field for the same reason.
  //
  // Without it a refusal is SILENT: every screen here has a `WriteSettled`
  // event carrying a sentence and, for one draft, nowhere to put it.
  optional ReadFailure write_failure = 5;
}

message PhotosPeopleData {
  repeated PersonRow people = 1;
  optional string next_cursor = 2;
  // FACES WAITING TO BE NAMED. The door to review, with its count on it — and
  // the reason this screen and review are not the same screen: one is a list of
  // answers, the other is a queue of questions.
  uint32 proposed_face_count = 3;
  // WHY THE LIST IS EMPTY, WHEN IT IS. An empty People screen has three
  // different causes and v0 drew one sentence for all of them
  // (`PeopleEmptyState.tsx`): recognition is off, it is on and has found
  // nothing yet, or it has found faces and none are named.
  EmptyReason empty_reason = 4;

  enum EmptyReason {
    EMPTY_REASON_UNSPECIFIED = 0;
    // Not empty.
    EMPTY_REASON_NONE = 1;
    // The member turned recognition off, or never turned it on. A setting,
    // and the screen says where it is.
    EMPTY_REASON_RECOGNITION_OFF = 2;
    // On, and nothing has been looked at yet.
    EMPTY_REASON_NOT_RUN_YET = 3;
    // Faces found, none confirmed. The door to review is the answer.
    EMPTY_REASON_NONE_NAMED = 4;
  }
}

message PhotosPeopleEvent {
  oneof kind {
    Opened opened = 1;
    NextPageRequested next_page = 2;
    DataArrived data = 3;
    ReadRefused refused = 4;
    RowsChanged rows_changed = 5;
    SeatChanged seat_changed = 6;
    PersonRenamed renamed = 7;
    WriteSettled write_settled = 8;
  }

  message Opened {}

  message NextPageRequested {
    string after_cursor = 1;
  }

  message DataArrived {
    PhotosPeopleData data = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    repeated string party_ids = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message PersonRenamed {
    string party_id = 1;
    string display_name = 2;
  }

  message WriteSettled {
    bool committed = 1;
    string sentence = 2;
  }
}

// ONE FACE, AS A QUESTION.
message FaceCandidate {
  string region_id = 1;
  string asset_id = 2;
  // The crop the member looks at. The ASSET's thumbnail plus the box, because
  // there is no per-face derivative in the vault and inventing one would be a
  // second copy of every photograph.
  optional string thumbnail_path = 3;
  // The box within the asset, in FRACTIONS of the image's width and height, so
  // a view can draw it over whatever size it rendered at. Pixels would be
  // wrong the moment the thumbnail is not the original's size — which it never
  // is.
  double box_x = 4;
  double box_y = 5;
  double box_width = 6;
  double box_height = 7;
  // Who the derivation thinks it is, empty when it has no guess at all. A
  // proposal, never drawn as a fact.
  string proposed_party_id = 8;
  string proposed_name = 9;
  // 0…1 as the row holds it. Shown as words and not a percentage: "probably"
  // is what a member can act on.
  double confidence = 10;
}

// A QUEUE, WORKED ONE AT A TIME — not a page of rows with checkboxes.
//
// The shape follows the job: a member answers "is this Ada?" and the next
// question arrives. `cursor` is which question, and it is on the state because
// a member who leaves and comes back should not be asked the first one again.
message FaceReviewState {
  SeatState seat = 1;
  oneof content {
    Loading loading = 2;
    ReadFailure failure = 3;
    FaceReviewData data = 4;
  }
  // Which candidate is showing, an index into `data.candidates`. Past the end
  // means the queue is worked through, which is a real screen and not an
  // empty one.
  //
  // **AN INDEX INTO A PAGED LIST BINDS THE REDUCER: `DataArrived` APPENDS AND
  // NEVER REPLACES.** `FaceReviewData` carries a `next_cursor`, so the list
  // grows — and a second page that replaced the first would leave this cursor
  // pointing at a different question than the one the member left on. Nothing
  // mechanical can catch that, because both shapes typecheck and both render;
  // it is stated here because this is the field it would corrupt.
  uint32 cursor = 5;
  // The name picker is open over the current candidate.
  bool naming = 6;
  // Whether the recognition plane is on at all. A queue cannot fill while it
  // is off, and the screen says so rather than showing an empty queue.
  bool recognition_enabled = 7;
  // A WRITE WAS REFUSED, AND THE SENTENCE A MEMBER READS.
  //
  // **Its own slot, never the `content` oneof's `failure`.** That slot is the
  // READ's — it is one of the three states a read can be in — and putting a
  // denied write there would replace the rows on screen with an error, so a
  // member whose rename was refused would lose the list they were renaming
  // from. `NoteDraft.save_failure` is the same field for the same reason.
  //
  // Without it a refusal is SILENT: every screen here has a `WriteSettled`
  // event carrying a sentence and, for one draft, nowhere to put it.
  optional ReadFailure write_failure = 8;
}

message FaceReviewData {
  repeated FaceCandidate candidates = 1;
  optional string next_cursor = 2;
  // Every party a face could be named as, so the picker needs no second read
  // while a member is mid-answer.
  repeated PhotoPerson known_people = 3;
}

message FaceReviewEvent {
  oneof kind {
    Opened opened = 1;
    NextPageRequested next_page = 2;
    DataArrived data = 3;
    ReadRefused refused = 4;
    RowsChanged rows_changed = 5;
    SeatChanged seat_changed = 6;
    // The three answers, and they are three because they are three different
    // writes: this IS someone, this is NOT the proposal, and this face is
    // kept and deliberately left unnamed (`dismissed`).
    Confirmed confirmed = 7;
    Rejected rejected = 8;
    // DECIDE LATER — and it WRITES NOTHING (v0's `triageSkip`). The question
    // goes to the back of the queue and stays a proposal; a skip that saved a
    // dismissal would retire a face the member only postponed.
    Skipped skipped = 9;
    NamingChanged naming = 10;
    WriteSettled write_settled = 11;
    ThumbnailsArrived thumbnails = 12;
    RecognitionChanged recognition = 13;
    Dismissed dismissed = 14;
    PersonCreated person_created = 15;
  }

  // KEEP THE FACE, AND LEAVE IT UNNAMED: `media.answer_face_proposal` with
  // `dismiss`. Reviewed, so the enricher does not propose it again.
  message Dismissed {
    string region_id = 1;
  }

  // THE PERSON A FACE WAS BEING NAMED AS NOW EXISTS, and this is their id.
  //
  // `core.add_party` mints the id and answers it in `CommandOutcome.output`;
  // the bridge reads it there and hands it back here, so the confirm that
  // needs it follows in the same breath and "New person" is one step.
  message PersonCreated {
    string region_id = 1;
    string party_id = 2;
  }

  message Opened {}

  message NextPageRequested {
    string after_cursor = 1;
  }

  message DataArrived {
    FaceReviewData data = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    repeated string region_ids = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  // `party_id` empty with a `new_name` means a person this vault has no row
  // for yet — which is most of them on a first run, and the case v0's
  // `FaceNamePicker` handled by creating the party first and losing the answer
  // when the create failed.
  message Confirmed {
    string region_id = 1;
    string party_id = 2;
    string new_name = 3;
  }

  message Rejected {
    string region_id = 1;
  }

  message Skipped {
    string region_id = 1;
  }

  // THE THUMBNAIL LEG LANDED.
  //
  // **Without it face review draws a box over a sentence, not a photograph.**
  // `with_held_thumbnail` is a correlated subquery on the FROM table's
  // `content_id` and is REFUSED AT PREPARE when the table has none — and
  // `media_face_region` has none, so asking for it fails the whole read rather
  // than answering nulls. `FaceCandidate.asset_id` is already on the wire, so
  // a second leg over `media_asset` keyed on the page's asset ids is what
  // fills this, and it arrives here rather than as a second `DataArrived`: a
  // reducer handed two `DataArrived`s cannot tell an amendment from a replace,
  // which is the same arm `DuplicateReviewEvent.PlacementArrived` exists for.
  message ThumbnailsArrived {
    // Asset id to thumbnail path. An asset missing from the map is an
    // unanswered question and not "no thumbnail".
    map<string, string> path_by_asset_id = 1;
  }

  // WHETHER RECOGNITION IS ON AT ALL.
  //
  // The tier lives in `enrich_policy` and every read on this screen answers
  // with a `FaceReviewData`, which carries candidates and a roster and has
  // nowhere to put a boolean — so `FaceReviewState.recognition_enabled` had no
  // writer and the screen could not tell an empty queue from a switch that is
  // off. Those are different screens with different next moves, the same way
  // `PhotosPeopleData.EmptyReason` keeps three of them apart.
  message RecognitionChanged {
    bool enabled = 1;
  }

  message NamingChanged {
    bool naming = 1;
  }

  // WHICH ANSWER SETTLED.
  //
  // **Two commands can be in flight at once here** — creating a party, and
  // answering the proposal against it — and a settle that does not say which
  // one it is forces the reducer to guess. Guessing wrong on this screen
  // advances the cursor past a question whose answer was dropped, and the
  // member is never asked again.
  message WriteSettled {
    bool committed = 1;
    string sentence = 2;
    string region_id = 3;
  }
}

// ---------------------------------------------------------------------------
// Duplicates
// ---------------------------------------------------------------------------

message DuplicateCluster {
  string cluster_id = 1;
  uint32 member_count = 2;
  // What resolving this cluster would give back. The number that makes the
  // work worth doing, and the reason the shelf is ordered by it.
  uint64 reclaimable_bytes = 3;
  // AND THE SAME NUMBER AS A PHRASE, WHICH IS WHAT A MEMBER READS.
  //
  // A byte count is the VAULT's to spell, for the reason `with_document_size`
  // gives — a launcher row and a drive row once disagreed about the same file
  // — and there is no shared formatter on either shell, so two shells left to
  // format this would be two spellings of one fact. Empty while
  // `reclaimable_bytes` is unknown, which is not the same as "0 bytes".
  string reclaimable_phrase = 6;
  optional string cover_thumbnail_path = 4;
  // THE MEMBERS' OWN IDS, SO A SECOND READ HAS SOMETHING TO KEY ON.
  //
  // **Without this the shelf cannot state bytes or draw a cover at all.**
  // `cluster_id` lives only on `media_asset_phash`, which has no `content_id`;
  // `byte_size` lives on `core_content_item`; the door has no join and no
  // expression in a `select`, and `with_held_thumbnail` is a correlated
  // subquery resolved at PREPARE — so asking for it over a table with no
  // content column fails the WHOLE read rather than answering nulls
  // (`crates/vault/src/page.rs`). A second leg over `media_asset` is the only
  // way, and a leg needs a key: this is it, exactly as `PhotoDetail`'s
  // `original_hash` is what its content leg keys on.
  repeated string member_asset_ids = 7;
  // AND THEIR CONTENT IDS, BECAUSE THE BYTES ARE ANOTHER HOP AGAIN.
  //
  // The chain is `cluster_id → asset_id → content_id → byte_size`, over three
  // tables, with no join anywhere on this door. `member_asset_ids` bought the
  // second link; this is the third. Without it a leg over `core_content_item`
  // comes back `(content_id, byte_size)` and **nothing on the wire says which
  // asset — let alone which cluster — each row belongs to**, so a correct set
  // of sizes still cannot be attributed to a card. And `reclaimable_bytes` is
  // a per-cluster aggregate (the sum less the largest), not a per-row value,
  // so there is no per-row phrase that could stand in for it either.
  //
  // Parallel to `member_asset_ids` and in the same order, so the two index
  // together.
  repeated string member_content_ids = 8;
  // THE COUNT IS A FLOOR, NOT A TOTAL. The read door has no `COUNT(*)`, so
  // every count in this section is counted from the rows one page returned —
  // and a page that filled has more behind it. `HomeState.ThingCount` carries
  // this as `capped` for the same reason and with the same consequence: the
  // honest phrasing is "at least", and a screen that printed a bare number
  // over a full page would be stating a total nobody counted.
  bool member_count_capped = 5;
}

message DuplicatesState {
  SeatState seat = 1;
  oneof content {
    Loading loading = 2;
    ReadFailure failure = 3;
    DuplicatesData data = 4;
  }
}

message DuplicatesData {
  repeated DuplicateCluster clusters = 1;
  optional string next_cursor = 2;
  uint64 total_reclaimable_bytes = 3;
  // The same, as the phrase a member reads. See `DuplicateCluster`.
  string total_reclaimable_phrase = 6;
  // THE COUNT IS A FLOOR, NOT A TOTAL. The read door has no `COUNT(*)`, so
  // every count in this section is counted from the rows one page returned —
  // and a page that filled has more behind it. `HomeState.ThingCount` carries
  // this as `capped` for the same reason and with the same consequence: the
  // honest phrasing is "at least", and a screen that printed a bare number
  // over a full page would be stating a total nobody counted.
  bool total_capped = 5;
  // Perceptual hashes are computed by a pass, and a library it has not walked
  // yet has no clusters for a reason that is not "there are no duplicates".
  //
  // **IT IS FALSE ON EVERY READ THIS BUILD CAN MAKE, and the field stays.**
  // Nothing in the schema records the pass's progress: `media_asset_phash`
  // rows appear when a device supplied a phash, `cluster_id` is rewritten
  // wholesale by a rebuild, and there is no watermark, cursor or sweep-state
  // row anywhere — so the only way to answer would be a second read plus a
  // `COUNT(*)` the door does not have. The conservative branch is therefore
  // the only one a member sees, which is the correct outcome: "Centraid has
  // not finished looking" is true, and "your library is clean" would be a
  // claim nobody checked. The field is what a sweep-state row would fill, and
  // deleting it would delete the distinction along with the gap.
  bool scan_complete = 4;
}

message DuplicatesEvent {
  oneof kind {
    Opened opened = 1;
    NextPageRequested next_page = 2;
    DataArrived data = 3;
    ReadRefused refused = 4;
    RowsChanged rows_changed = 5;
    SeatChanged seat_changed = 6;
  }

  message Opened {}

  message NextPageRequested {
    string after_cursor = 1;
  }

  message DataArrived {
    DuplicatesData data = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  // THE CHANGE STREAM SAYS `(table, primary keys)`, AND THIS TABLE'S KEY IS
  // `asset_id`.
  //
  // It was `cluster_ids`, which no producer could fill: the core has no idea
  // that `media_asset_phash.cluster_id` is the thing this screen groups by,
  // and a shell putting asset ids in a field named `cluster_ids` would be a
  // shell lying in a field name. A cluster is not addressable by the stream at
  // all — a rebuild rewrites every row's `cluster_id` — so the honest event
  // names the assets that moved and the shelf re-reads.
  message RowsChanged {
    repeated string asset_ids = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }
}

// ONE MEMBER OF A CLUSTER, WITH WHAT DISTINGUISHES IT FROM ITS SIBLINGS.
//
// A duplicate decision is made on the differences, so the row carries exactly
// the four a member compares: how big, how many pixels, when, and whether this
// one is already somewhere they put it.
message DuplicateMember {
  string asset_id = 1;
  optional string thumbnail_path = 2;
  uint64 byte_size = 3;
  // The same, as the phrase a member reads. A size is the VAULT's to spell;
  // see `DuplicateCluster.reclaimable_phrase`.
  string byte_phrase = 9;
  // THE CONTENT ROW THIS COPY POINTS AT, so a leg can fetch its size and say
  // which member it belongs to. Without it the size leg's rows are orphans.
  //
  // It is also what makes the contract's OWN suggestion rule reachable: "the
  // largest by bytes". With no sizes the screen can only rank by pixels, and
  // `suggestion_reason` has to say so — which is honest, but it is not the
  // rule this message specifies.
  string content_id = 10;
  uint32 width = 4;
  uint32 height = 5;
  string captured_at = 6;
  // In an album, favorited, or otherwise placed by hand. Deleting one of these
  // is not the same act as deleting a stray copy, and the screen says so.
  //
  // **FALSE IS NOT A SAFE DEFAULT ON A SCREEN THAT DELETES PHOTOGRAPHS**, so
  // it is not allowed to stand in for "nobody checked". The answer needs a
  // second leg over `core_collection_entry`, which is why
  // [DuplicateReviewEvent.PlacementArrived] exists as its own event arm rather
  // than a second `DataArrived`: a screen could not otherwise tell an
  // amendment from a replace. Until that leg has landed, `placements_checked`
  // on the data is false and the view says so out loud instead of drawing
  // every copy as a stray.
  bool member_placed = 7;
  PhotoCell.Held held = 8;
}

message DuplicateReviewState {
  SeatState seat = 1;
  string cluster_id = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    DuplicateReviewData data = 5;
  }
  // WHICH ONE SURVIVES. Empty until a member has chosen — never
  // pre-selected by the screen, because a default here is the product
  // choosing which of a member's photographs to delete.
  string keep_asset_id = 6;
  // A WRITE WAS REFUSED, AND THE SENTENCE A MEMBER READS.
  //
  // **Its own slot, never the `content` oneof's `failure`.** That slot is the
  // READ's — it is one of the three states a read can be in — and putting a
  // denied write there would replace the rows on screen with an error, so a
  // member whose rename was refused would lose the list they were renaming
  // from. `NoteDraft.save_failure` is the same field for the same reason.
  //
  // Without it a refusal is SILENT: every screen here has a `WriteSettled`
  // event carrying a sentence and, for one draft, nowhere to put it.
  optional ReadFailure write_failure = 7;
}

// THE ONE UNPAGED LIST IN THIS SECTION, and deliberately.
//
// Every other data message here carries a `next_cursor`. A cluster is a handful
// of copies of ONE photograph — `crates/media`'s phash clustering produces
// nothing else — so a cursor would be a field no cluster ever sets and every
// reducer has to handle. If a cluster ever grows past a page, this grows a
// cursor and not a truncation.
message DuplicateReviewData {
  repeated DuplicateMember members = 1;
  // The recommendation, as a recommendation: the largest by bytes, and the
  // reason stated. It is NOT written into `keep_asset_id` — a suggestion a
  // member has not accepted must not be able to delete anything.
  string suggested_keep_asset_id = 2;
  string suggestion_reason = 3;
  // HAS ANYTHING ACTUALLY ASKED WHERE THESE COPIES ARE PLACED?
  //
  // False means `member_placed` on every member is an unanswered question and
  // not a "no". The view must say so above the delete control: a member about
  // to sweep a cluster is entitled to know whether "this one is in an album"
  // was checked or merely unpopulated.
  bool placements_checked = 4;
}

message DuplicateReviewEvent {
  oneof kind {
    Opened opened = 1;
    DataArrived data = 2;
    ReadRefused refused = 3;
    RowsChanged rows_changed = 4;
    SeatChanged seat_changed = 5;
    KeepPicked keep = 6;
    ResolveRequested resolve = 7;
    WriteSettled write_settled = 8;
    PlacementArrived placements = 9;
  }

  message Opened {
    string cluster_id = 1;
  }

  message DataArrived {
    DuplicateReviewData data = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    repeated string asset_ids = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message KeepPicked {
    string asset_id = 1;
  }

  // THE SECOND LEG LANDED: which of these copies a member has put somewhere.
  //
  // Its OWN arm and not a second `DataArrived`, because a reducer handed two
  // `DataArrived`s cannot tell an amendment from a replace — and the
  // discriminator the lightbox uses ("a detail with no `asset_id` is an
  // amendment") cannot work here, since the asset ids are exactly what this
  // leg carries. An arm makes the amendment a different sentence rather than
  // the same one twice.
  //
  // Absent ids are absent answers: a member id missing from this list stays
  // unanswered rather than becoming a "no".
  message PlacementArrived {
    repeated string placed_asset_ids = 1;
  }

  // Trash every member but the kept one. `permanent` is false and stays false:
  // a duplicate sweep sends copies to the trash, where the member can change
  // their mind, and a bulk act that could not be undone is not one this screen
  // offers.
  message ResolveRequested {}

  message WriteSettled {
    bool committed = 1;
    string sentence = 2;
  }
}

// ---------------------------------------------------------------------------
// Memories
// ---------------------------------------------------------------------------

message MemoryRow {
  string memory_id = 1;
  Kind kind = 2;
  // What the pass called it, empty when it had nothing to call it. The view
  // composes a title from the day and the place in that case, rather than
  // storing one the vault never wrote.
  string title_hint = 3;
  // THE VAULT'S OWN KEY FOR THIS MEMORY'S DAY, PASSED THROUGH AND NEVER
  // PARSED.
  //
  // It said `YYYY-MM-DD`, and that is not what the column holds: the shape
  // differs by kind, and an on-this-day row keys by MONTH AND DAY — it is the
  // same date in other years, so a year in the key would defeat it. The
  // deterministic ids are built from it (`otd:<day_key>`,
  // `docs/photos/derived-ledger.md`), which is why it travels at all.
  //
  // **A view takes its dates from `started_at` and `ended_at`, not from
  // here.** Those are unambiguous instants; this is a key whose format is the
  // projection's business.
  string day_key = 4;
  string place_name = 5;
  uint32 member_count = 6;
  optional string cover_thumbnail_path = 7;
  string started_at = 8;
  string ended_at = 9;
  // A TRIP'S ROUTE: the places its photographs were taken at, in the order
  // they were taken, a repeat of the stop before collapsed. Only stops with a
  // coordinate — a place with no pin cannot be sketched. Empty on every other
  // kind, and on a trip whose photographs carry no place.
  //
  // Drawn as a private sketch from the member's own coordinates and never over
  // a basemap: a tile is a request that tells a server where the member has
  // been (`docs/photos/places.md`).
  repeated MemoryStop route = 10;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    // This day, in other years.
    KIND_ON_THIS_DAY = 1;
    // A run of days away from home.
    KIND_TRIP = 2;
    // Photographs that look like each other.
    KIND_SIMILAR = 3;
  }
}

// ONE STOP ON A TRIP'S ROUTE.
message MemoryStop {
  string place_id = 1;
  double latitude = 2;
  double longitude = 3;
}

message PhotosMemoriesState {
  SeatState seat = 1;
  oneof content {
    Loading loading = 2;
    ReadFailure failure = 3;
    PhotosMemoriesData data = 4;
  }
}

message PhotosMemoriesData {
  repeated MemoryRow memories = 1;
  optional string next_cursor = 2;
  // Memories are COMPUTED, by a pass that may not have run. An empty list with
  // this false is "not yet"; with it true it is "there are none".
  bool computed = 3;
}

message PhotosMemoriesEvent {
  oneof kind {
    Opened opened = 1;
    NextPageRequested next_page = 2;
    DataArrived data = 3;
    ReadRefused refused = 4;
    RowsChanged rows_changed = 5;
    SeatChanged seat_changed = 6;
  }

  message Opened {}

  message NextPageRequested {
    string after_cursor = 1;
  }

  message DataArrived {
    PhotosMemoriesData data = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    repeated string memory_ids = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }
}

// ---------------------------------------------------------------------------
// The picker
// ---------------------------------------------------------------------------

// ADDING PHOTOGRAPHS TO AN ALBUM.
//
// Not `PhotoShelfState` with `selecting = true`: the picked set is the
// picker's own and the album is a route param, never shared state (§10). A
// shelf that could be picked from would carry an album id on every surface
// that shows one.
message PhotoPickerState {
  SeatState seat = 1;
  // Where the picked assets are going. Named, so the head says "Add to
  // Portugal" before any read has landed.
  string collection_id = 2;
  string collection_name = 3;
  oneof content {
    Loading loading = 4;
    ReadFailure failure = 5;
    PhotosGridData data = 6;
  }
  repeated string picked_asset_ids = 7;
  // Assets the album ALREADY holds, so the grid can draw them as taken rather
  // than letting a member add one twice and discover it afterwards.
  repeated string already_in_album_asset_ids = 8;
  // A WRITE WAS REFUSED, AND THE SENTENCE A MEMBER READS.
  //
  // **Its own slot, never the `content` oneof's `failure`.** That slot is the
  // READ's — it is one of the three states a read can be in — and putting a
  // denied write there would replace the rows on screen with an error, so a
  // member whose rename was refused would lose the list they were renaming
  // from. `NoteDraft.save_failure` is the same field for the same reason.
  //
  // Without it a refusal is SILENT: every screen here has a `WriteSettled`
  // event carrying a sentence and, for one draft, nowhere to put it.
  optional ReadFailure write_failure = 9;
}

message PhotoPickerEvent {
  oneof kind {
    Opened opened = 1;
    NextPageRequested next_page = 2;
    DataArrived data = 3;
    ReadRefused refused = 4;
    SeatChanged seat_changed = 5;
    PickToggled pick = 6;
    ConfirmRequested confirm = 7;
    WriteSettled write_settled = 8;
    RowsChanged rows_changed = 9;
    MembersArrived members = 10;
  }

  message Opened {
    string collection_id = 1;
    string collection_name = 2;
    repeated string already_in_album_asset_ids = 3;
  }

  // WHAT THE ALBUM ALREADY HOLDS, READ BY THE PICKER ITSELF.
  //
  // The caller that pushed this screen held one page of the album at most, so
  // `Opened.already_in_album_asset_ids` was a floor at best and empty in
  // practice. This is the album's `core_collection_entry` rows, walked, and the
  // reducer UNIONS it into the taken set — a commit that landed while the read
  // was in flight is not undone by a list that predates it.
  message MembersArrived {
    string collection_id = 1;
    repeated string asset_ids = 2;
  }

  message NextPageRequested {
    string after_cursor = 1;
  }

  message DataArrived {
    PhotosGridData data = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message PickToggled {
    string asset_id = 1;
  }

  message ConfirmRequested {}

  // WHICH PICK SETTLED. See `PhotoShelfEvent.WriteSettled`: a confirm submits
  // one `media.add_to_album` per picked asset, and a screen that moved the
  // WHOLE picked set to taken on the first commit would tell a member their
  // photographs are in an album when some of the adds were refused.
  message WriteSettled {
    bool committed = 1;
    string sentence = 2;
    string asset_id = 3;
  }

  message RowsChanged {
    repeated string asset_ids = 1;
  }
}

// ---------------------------------------------------------------------------
// Photos: the editor — crop, rotate, straighten, flip (#1029, photos port)
// ---------------------------------------------------------------------------

// THE PHOTOGRAPH THE EDITOR WORKS ON, as much of it as an edit needs.
//
// Not a `PhotoDetail`: the editor needs the ORIGINAL's path, which the
// lightbox's page read cannot answer for (`PhotoLightboxReads`' own doc), and
// none of the seven satellites the lightbox reads. The path here comes from the
// BYTE door (`ContentUrlRequest`), which is the one place it lives.
message PhotoEditSource {
  string asset_id = 1;
  // What the stage draws while nothing is saved. The original when this phone
  // holds it, the thumbnail when it does not — and absent is a real answer.
  optional string thumbnail_path = 2;
  // THE BYTES A SAVE RENDERS FROM, and never the thumbnail: a save rendered
  // from the display copy would silently write a smaller photograph than the
  // one the member edited. Absent means Save is refused, with a sentence.
  optional string original_path = 3;
  string title = 4;
  string captured_at = 5;
  PhotoCell.Kind kind = 6;
  PhotoCell.Held held = 7;
  // The byte door's own words when it could not answer with a path.
  string original_absent_reason = 8;
  // THE ORIGINAL'S CAPTURE-LOCAL OFFSET, carried onto the new photograph with
  // `captured_at`: an edit keeps the original's date, as Apple Photos does.
  // Absent when the row records none, and then none is written.
  optional int32 captured_utc_offset_minutes = 9;
  // The original's place, set on the new photograph after it lands. Empty
  // when the original has none.
  string place_id = 10;
}

// WHAT THE MEMBER HAS DONE, AS DATA. Nothing is written until Save.
//
// The crop is in FRACTIONS of the ROTATED frame, so it survives a resize and
// means the same thing on the stage and in the saved pixels (v0's
// `photo-edit-model.ts`). The render order is fixed and both shells keep it:
// flip, then rotate, then crop.
message PhotoEditPlan {
  // Quarter turns clockwise, 0-3.
  uint32 quarters = 1;
  // Degrees of levelling, 0 to -15. The phone levels anticlockwise only.
  int32 straighten = 2;
  Flip flip = 3;
  Ratio ratio = 4;
  PhotoEditCrop crop = 5;

  // UNSPECIFIED IS "NO FLIP" — v0's `undefined`, the third state a boolean
  // cannot hold, and the one an untouched editor is in. A three-way cycle and
  // not two toggles: one flip per render.
  enum Flip {
    FLIP_UNSPECIFIED = 0;
    FLIP_HORIZONTAL = 1;
    FLIP_VERTICAL = 2;
  }

  // v0's three ratios. UNSPECIFIED reads as ORIGINAL.
  enum Ratio {
    RATIO_UNSPECIFIED = 0;
    RATIO_ORIGINAL = 1;
    RATIO_SQUARE = 2;
    RATIO_THREE_TWO = 3;
  }
}

// Fractions of the rotated frame, each in [0, 1].
message PhotoEditCrop {
  double x = 1;
  double y = 2;
  double w = 3;
  double h = 4;
}

message PhotoEditorState {
  SeatState seat = 1;
  string asset_id = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    PhotoEditSource source = 5;
  }
  PhotoEditPlan plan = 6;
  Phase phase = 7;
  // THE ONE LINE, and it says "nothing written yet" until something is.
  // Reduced here so both shells print the same sentence.
  string status_line = 8;
  string straighten_label = 9;
  string flip_label = 10;
  // Whether anything differs from the untouched photograph: Reset's gate and
  // the discard question's.
  bool edited = 11;
  // WHY SAVE CANNOT FIRE, stated on screen. Empty when it can. A refused
  // commit is outlined and says why — never a hidden control.
  string save_refusal = 12;
  // A save that did not land. Its own slot, never the read's `failure`: a
  // refused save must not take the photograph off the stage.
  optional ReadFailure save_failure = 13;
  // "Discard this edit?" is up.
  bool discard_open = 14;
  // The new photograph, once the save committed. The shell opens it.
  string saved_asset_id = 15;
  // WHICH SAVE IS IN FLIGHT. A settle for any other key is a stale answer.
  string save_key = 16;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_EDITING = 1;
    // The shell is rendering and ingesting. Every control but none is inert.
    PHASE_SAVING = 2;
    // The new photograph is in the vault; the shell leaves for it.
    PHASE_SAVED = 3;
    // The member left without saving; the shell pops.
    PHASE_CLOSED = 4;
  }
}

message PhotoEditorEvent {
  oneof kind {
    Opened opened = 1;
    DataArrived data = 2;
    ReadRefused refused = 3;
    SeatChanged seat_changed = 4;
    RotateRequested rotate = 5;
    StraightenStepped straighten = 6;
    FlipCycled flip = 7;
    RatioChosen ratio = 8;
    CropMoved crop_moved = 9;
    CropScaled crop_scaled = 10;
    ResetRequested reset = 11;
    CancelRequested cancel = 12;
    DiscardAnswered discard = 13;
    SaveRequested save = 14;
    SaveSettled save_settled = 15;
  }

  message Opened {
    string asset_id = 1;
  }

  message DataArrived {
    PhotoEditSource source = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message RotateRequested {}

  message StraightenStepped {}

  message FlipCycled {}

  message RatioChosen {
    PhotoEditPlan.Ratio ratio = 1;
    // The rotated frame's width over its height, as the stage measured it: a
    // centred ratio crop is a fraction of THAT, and the reducer has no image.
    double frame_ratio = 2;
  }

  // A DRAG, in fractions of the frame. Continuous; each one is a delta.
  message CropMoved {
    double dx = 1;
    double dy = 2;
  }

  // A PINCH, once, with its total factor (v0 rescaled per gesture and not per
  // frame, because rescaling per frame drifts).
  message CropScaled {
    double factor = 1;
  }

  message ResetRequested {}

  message CancelRequested {}

  message DiscardAnswered {
    bool discard = 1;
  }

  message SaveRequested {}

  message SaveSettled {
    string save_key = 1;
    bool committed = 2;
    string asset_id = 3;
    string sentence = 4;
  }
}

// ---------------------------------------------------------------------------
// Agenda home (#1046)
// ---------------------------------------------------------------------------
//
// Day, Schedule and Waiting over the core's `agenda.upcoming` and
// `agenda.day-context`, and `agenda.search` while a term is typed. Everything a
// view draws is COMPUTED BY `AgendaHomeMachine`: every label, sentence,
// accessibility label, empty choice, hue key, status chip and "shown" flag. A
// view lays these out and forwards `AgendaHomeEvent`s; it formats no date,
// counts nothing and chooses no copy.
//
// THE RAW ANSWERS NEVER CROSS. The machine folds `centraid.core.v1`'s typed
// answers (`AgendaUpcoming`, `AgendaDayContext`, `AgendaSearch`) and keeps them
// on a Kotlin-side state beside this message, so a local change — a calendar
// hidden, search closed, Schedule to Waiting — re-folds without a re-read.
// They are not an arm of `AgendaHomeEvent` because this file cannot import
// `centraid.core.v1`: `crates/api-proto` includes the two packages as sibling
// modules, and prost's `super::super::core` path out of `screen_v1` does not
// resolve (`AgendaHomeMachine`'s header).

message AgendaHomeState {
  SeatState seat = 1;
  // WHICH LIST, as a parameter (law 2). Search is a mode over it and More is a
  // sheet, so neither is a value here.
  Destination destination = 2;
  // THE DAY THE SURFACE IS ANCHORED ON, civil `YYYY-MM-DD`, and EMPTY until
  // the first answer says which day today is — never a device-clock guess.
  string anchor_day = 3;
  bool search_open = 4;
  // What the member typed. Closing search CLEARS it (a v0 defect not carried).
  string search_term = 5;
  // Calendars switched off, FOR THE SESSION (v0's behaviour; not persisted).
  repeated string hidden_calendar_ids = 6;
  oneof content {
    Loading loading = 7;
    ReadFailure failure = 8;
    // The vault would not let Agenda read. A state and not a failure: no band,
    // no toolbar, the kit's gate.
    Denied denied = 9;
    AgendaHomeData data = 10;
  }
  Sheet sheet = 11;
  // THE BAND, five tabs in order, computed. EMPTY while denied: the gate has
  // no band.
  repeated AgendaBandTab band = 12;
  // The day bar. On the state and not on `data`, so stepping a day keeps the
  // bar standing (and its buttons pressable) while the new day reads.
  AgendaToolbar toolbar = 13;
  // The screen's fixed words, so a view carries no copy of its own.
  AgendaChrome chrome = 14;
  // THE WRITE OVERLAY — events whose write (an RSVP, an edit, a cancel) is
  // in flight, from the session's `AgendaMarks`, which the event detail and
  // the editor feed. `event_id`s, because a write targets the series.
  repeated string pending_event_ids = 15;
  repeated string cancel_asked_event_ids = 16;
  // Days whose due shelf is open, `YYYY-MM-DD`.
  repeated string due_open_days = 17;

  enum Destination {
    DESTINATION_UNSPECIFIED = 0;
    DESTINATION_DAY = 1;
    DESTINATION_SCHEDULE = 2;
    DESTINATION_WAITING = 3;
  }

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    // Calendars to show or hide, and the row to the facts sheet.
    SHEET_MORE = 2;
    // "What Agenda may read" — `AgendaChrome.reads_facts`.
    SHEET_READS = 3;
  }
}

message AgendaToolbar {
  // False while nothing is known to anchor it (the first read), while denied,
  // and while a search term is answering: search results are not a window.
  bool shown = 1;
  // Day: "Today" / "Tomorrow" / "Yesterday" / "Wednesday 11 March".
  // Schedule and Waiting: "From today" / "From Wednesday 11 March".
  string range_label = 2;
  // The app bar's subtitle: "March 2026".
  string month_label = 3;
  // Hides "Today".
  bool at_today = 4;
}

message AgendaChrome {
  string title = 1;
  string new_event = 2;
  string today = 3;
  // The ‹ and › buttons' accessibility labels.
  string previous_day = 4;
  string next_day = 5;
  string search_placeholder = 6;
  string search_label = 7;
  string search_close = 8;
  // The failure state's action; it sends `Refreshed`.
  string retry = 9;
  // The skeleton's accessibility label.
  string loading = 10;
  string more_title = 11;
  string calendars_heading = 12;
  // The More sheet's row to `SHEET_READS`, and that sheet's title.
  string reads_title = 13;
  repeated AgendaFact reads_facts = 14;
  // The band's home capsule.
  string home = 15;
  // The due shelf toggle's accessibility label; its visible word is a count.
  string shelf_label = 16;
}

message AgendaFact {
  string label = 1;
  string detail = 2;
}

message AgendaBandTab {
  // `day`, `schedule`, `waiting`, `search`, `more` — what `BandPicked` sends.
  string key = 1;
  string label = 2;
  // A `design/native-catalog.json` icon key.
  string icon_key = 3;
  // The 2px accent bar.
  bool current = 4;
}

message AgendaHomeData {
  // `YYYY-MM-DD` and `YYYY-MM-DDTHH:MM`, from the answer.
  string today = 1;
  string now_local = 2;
  // In day order. Past days are not drawn except as search hits.
  repeated AgendaDaySection days = 3;
  // `AGENDA_EMPTY_NONE` whenever `days` has a section.
  AgendaEmpty empty = 4;
  // The empty state's words; empty strings draw nothing. `empty_action` sends
  // `NewEventRequested`.
  string empty_title = 5;
  string empty_body = 6;
  string empty_action = 7;
  // Every calendar the member has, for the More sheet.
  repeated AgendaCalendarChoice calendars = 8;
  // Occurrences in the window waiting on your reply.
  uint32 waiting_count = 9;
  // Events drawn, and the app bar's words for it: "3 events".
  uint32 event_count = 10;
  string event_count_label = 11;
  // WHERE OPENING LANDS: this section, at its now line when it has one. Empty
  // `day` is the top.
  AgendaLanding landing = 12;
}

message AgendaLanding {
  string day = 1;
  bool now_line = 2;
}

message AgendaDaySection {
  string day = 1;
  string day_number = 2;
  string weekday_short = 3;
  // "Today" / "Wed 11 March".
  string heading = 4;
  bool is_today = 5;
  bool is_past = 6;
  // "April 2026" on the first section of a month the list had not shown yet.
  optional string month_heading = 7;
  // "Dana" / "3 birthdays" — day context, never an event row.
  optional string ribbon = 8;
  repeated string ribbon_names = 9;
  // The due shelf: every open task due, which can be more than `due` lists.
  uint32 due_count = 10;
  repeated AgendaDueTask due = 11;
  // "3 due", or "Hide" while `due_open`. Empty when nothing is due.
  string due_label = 12;
  bool due_open = 13;
  // All-day rows first, then by start, with the now line placed among them on
  // today.
  repeated AgendaRowItem items = 14;
}

message AgendaDueTask {
  string task_id = 1;
  string title = 2;
}

message AgendaRowItem {
  oneof kind {
    AgendaEventRow event = 1;
    AgendaNowLine now_line = 2;
  }
}

message AgendaNowLine {
  // "09:42".
  string label = 1;
  // "Now, 09:42".
  string accessibility_label = 2;
}

message AgendaEventRow {
  string event_id = 1;
  string instance_key = 2;
  optional string original_start_local = 3;
  // `day|instance_key`: a run over three days is three rows.
  string row_key = 4;
  // The summary, or "Untitled event".
  string title = 5;
  // "08:15 – 09:45" / "08:15" (no end) / "All day" / "Until 10:00" (runs in
  // from a day before) / "From 22:00" (runs past midnight) / "Continues" (a
  // day inside a longer run).
  string time_label = 6;
  // "repeats · 2 guests · call". Hidden on touch; spoken in
  // `accessibility_label`.
  string meta = 7;
  // A party-hue key for the 2px rule, from the calendar's colour.
  string calendar_hue_key = 8;
  AgendaRowStatus status = 9;
  // "needs a reply" / "pending" / "cancellation asked"; empty for none.
  string status_label = 10;
  // "Survey walk-through, 08:15 to 09:45, repeats, 2 guests, needs a reply".
  string accessibility_label = 11;
  // Ended before now: drawn dimmed.
  bool is_past = 12;
}

enum AgendaRowStatus {
  AGENDA_ROW_STATUS_UNSPECIFIED = 0;
  AGENDA_ROW_STATUS_NONE = 1;
  // You are a guest and have not answered.
  AGENDA_ROW_STATUS_NEEDS_REPLY = 2;
  // A write this device holds (`AgendaHomeState.pending_event_ids`).
  AGENDA_ROW_STATUS_PENDING = 3;
  // A cancellation asked and not settled; drawn in the `net` tone.
  AGENDA_ROW_STATUS_CANCEL_ASKED = 4;
}

message AgendaCalendarChoice {
  string calendar_id = 1;
  string name = 2;
  string hue_key = 3;
  bool hidden = 4;
  // "Shown" / "Hidden".
  string state_label = 5;
}

enum AgendaEmpty {
  AGENDA_EMPTY_UNSPECIFIED = 0;
  AGENDA_EMPTY_NONE = 1;
  // Schedule's whole window holds nothing, with no search and no calendar
  // hidden: "Nothing in your calendar yet."
  AGENDA_EMPTY_DAY_ONE = 2;
  // "Nothing on this day." / "Nothing on these days."
  AGENDA_EMPTY_NOTHING_ON_DAY = 3;
  AGENDA_EMPTY_NOTHING_WAITING = 4;
  AGENDA_EMPTY_NO_MATCH = 5;
}

// What a view forwards. The answers arrive on the Kotlin side
// (`AgendaInput`), not here — see this section's header.
message AgendaHomeEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    DestinationChanged destination = 3;
    DayStepped day_stepped = 4;
    TodayRequested today = 5;
    SearchOpened search_opened = 6;
    SearchTermChanged search_term = 7;
    SearchClosed search_closed = 8;
    CalendarToggled calendar_toggled = 9;
    BandPicked band = 10;
    SheetOpened sheet_opened = 11;
    SheetClosed sheet_closed = 12;
    DueShelfToggled due_toggled = 13;
    ReadRefused refused = 14;
    RowsChanged rows_changed = 15;
    SeatChanged seat_changed = 16;
    // INTENTS. The machine changes nothing on them; the shell routes them —
    // `NewEventRequested` to `agenda.editor` on the anchor day, `EventPicked`
    // to `agenda.event`.
    NewEventRequested new_event = 17;
    EventPicked event_picked = 18;
  }

  // The screen is on screen. Lands on `destination` (Day when unspecified) at
  // today, with search closed.
  message Opened {
    AgendaHomeState.Destination destination = 1;
  }

  message Refreshed {}

  message DestinationChanged {
    AgendaHomeState.Destination destination = 1;
  }

  // Days to move the anchor: -1 is ‹, 1 is ›. (`by` would be escaped by
  // Wire, a Kotlin keyword.)
  message DayStepped {
    int32 days = 1;
  }

  message TodayRequested {}

  message SearchOpened {}

  message SearchTermChanged {
    string term = 1;
  }

  message SearchClosed {}

  message CalendarToggled {
    string calendar_id = 1;
  }

  // A band tab, by `AgendaBandTab.key`.
  message BandPicked {
    string key = 1;
  }

  message SheetOpened {
    AgendaHomeState.Sheet sheet = 1;
  }

  message SheetClosed {}

  message DueShelfToggled {
    string day = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  // A change event touched a table the screen reads.
  message RowsChanged {
    string table = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message NewEventRequested {}

  message EventPicked {
    string event_id = 1;
    string instance_key = 2;
    optional string original_start_local = 3;
    // The section's day the row was drawn under — the detail's read window.
    string day = 4;
  }
}

// ---------------------------------------------------------------------------
// Agenda event and editor (#1046 waves 4 and 5)
// ---------------------------------------------------------------------------
//
// ONE EVENT, AND THE PLACE ITS WORDS ARE CHANGED. `agenda.event` draws an
// occurrence — when, calendar, repeats, joining link, reminder, notes, guests
// and their replies — with the member's RSVP, Edit, and Cancel (a scope sheet on
// a series). `agenda.editor` makes an event and edits one, or one occurrence of
// one, with an EXPLICIT SAVE: a wrong date written by an autosave is worse than
// a lost draft, so this editor is the one deliberate exception to #1015 D3's
// autosave, and leaving it with changes asks first.
//
// The detail reads its occurrence by id (`agenda.event`), and `agenda.upcoming`
// for today only, for the calendars' names and hues. The editor reads
// `agenda.upcoming` over a padded window around the occurrence's day
// (`AgendaHomeMachine`'s pad, for its reason) and `agenda.parties`. A timed
// save sends the member's wall clock with the device's zone (`tz`), and the
// core resolves the instant; an all-day save sends its civil days. Both fold in the machine from the RAW answers, which stay Kotlin-side as
// the home's do (this file cannot import `centraid.core.v1`). Every label,
// choice, flag and sentence is computed; a view binds its date and time
// pickers to the civil strings on `AgendaDraft` and forwards what was picked.
//
// A WRITE THE SCREEN NO LONGER SHOWS is held by the session's `AgendaMarks`: the
// home draws "pending" and "cancellation asked" from it, and a write refused
// after its screen was left comes back as `AgendaParkedCard` when the event is
// opened again.

// Which occurrences a change or a cancellation reaches. `edit_event_occurrence`'s
// `scope` values, and SERIES is the whole event (`edit_event`, `cancel_event`).
enum AgendaScope {
  AGENDA_SCOPE_UNSPECIFIED = 0;
  AGENDA_SCOPE_OCCURRENCE = 1;
  AGENDA_SCOPE_FUTURE = 2;
  AGENDA_SCOPE_SERIES = 3;
}

// One row of a scope sheet. NONE IS PRE-CHOSEN: the three answers are equal, so
// nothing is filled until the member picks.
message AgendaScopeChoice {
  AgendaScope scope = 1;
  string label = 2;
  bool selected = 3;
  // False when this change cannot reach that far — a new repeat rule is the
  // whole series' alone; `note` says why.
  bool enabled = 4;
  string note = 5;
}

// "This event is no longer on your calendar": the answer has no such
// occurrence — cancelled, moved or deleted since it was picked.
message AgendaGone {
  string title = 1;
  string body = 2;
  string action_label = 3;
}

// A WRITE REFUSED AFTER ITS SCREEN WAS LEFT, shown when the event is opened
// again: what did not happen, the core's own sentence, and the two ways on.
message AgendaParkedCard {
  string title = 1;
  string body = 2;
  string retry_label = 3;
  string dismiss_label = 4;
}

// A button on the detail. `key` is what `ActionPicked` carries.
message AgendaAction {
  string key = 1;
  string label = 2;
  bool enabled = 3;
  // Drawn in the `net` hue (the cancel).
  bool destructive = 4;
  string accessibility_label = 5;
}

// ---- agenda.event ---------------------------------------------------------

message AgendaEventState {
  SeatState seat = 1;
  // WHICH OCCURRENCE — the route's parameters, from `EventPicked`.
  string event_id = 2;
  string instance_key = 3;
  optional string original_start_local = 4;
  // The civil day the row was drawn under: the read's window.
  string day = 5;
  oneof content {
    Loading loading = 6;
    ReadFailure failure = 7;
    Denied denied = 8;
    AgendaEventData data = 9;
    AgendaGone gone = 10;
  }
  // The RSVP or the cancellation in flight, and its refusal.
  WriteState write = 11;
  Sheet sheet = 12;
  // The confirm step for cancelling an event that does not repeat. Absent
  // otherwise: a series' confirm is the scope sheet itself.
  optional Confirm confirm = 13;
  // The scope sheet's rows, while it is up.
  repeated AgendaScopeChoice cancel_scopes = 14;
  optional AgendaParkedCard parked = 15;
  AgendaEventChrome chrome = 16;
  // THE SCREEN IS DONE — a cancellation committed. The shell pops.
  bool dismissed = 17;
  // The scope sheet's commit button is armed (a scope is picked).
  bool cancel_armed = 18;

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_CANCEL_SCOPE = 2;
  }
}

message AgendaEventChrome {
  string title = 1;
  // The back control names the page it returns to: "Agenda".
  string back = 2;
  string loading = 3;
  string retry = 4;
  string scope_title = 5;
  string scope_body = 6;
  string scope_commit = 7;
  string scope_keep = 8;
  string confirm_keep = 9;
}

message AgendaEventData {
  string title = 1;
  // "Wednesday 11 March", or "Wednesday 11 March – Friday 13 March".
  string date_label = 2;
  // "08:15 – 09:45" / "08:15" / "All day".
  string when_label = 3;
  string calendar_name = 4;
  string calendar_hue_key = 5;
  // Label and value rows, in the handoff's order: repeats, where (the place's
  // name), joining link, reminder, calendar. A row with nothing to say is
  // absent.
  repeated AgendaFact facts = 6;
  string notes = 7;
  optional StatusChip chip = 8;
  // "3 guests · 1 awaiting". Empty with no guests.
  string guest_heading = 9;
  repeated AgendaGuestRow guests = 10;
  // The member's own reply, when they are a guest.
  optional AgendaRsvp rsvp = 11;
  repeated AgendaAction actions = 12;
  bool is_past = 13;
  // "Survey walk-through, Wednesday 11 March, 08:15 to 09:45, repeats".
  string accessibility_label = 14;
  // The joining link itself, for the view to open.
  string call_uri = 15;
  // The button that opens `call_uri`: "Join call". Empty with no link.
  string call_label = 16;
}

message AgendaGuestRow {
  string party_id = 1;
  string name = 2;
  string initial = 3;
  string reply_label = 4;
  string hue_key = 5;
  bool is_you = 6;
  string accessibility_label = 7;
}

message AgendaRsvp {
  string question = 1;
  repeated AgendaRsvpChoice choices = 2;
  // "Your answer is for every occurrence." on a series.
  string note = 3;
}

message AgendaRsvpChoice {
  // `accepted`, `tentative` or `declined` — what `RsvpPicked` carries.
  string partstat = 1;
  string label = 2;
  // The answer on record, or the one just sent (optimistic).
  bool selected = 3;
  bool enabled = 4;
}

message AgendaEventEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    ReadRefused refused = 3;
    RowsChanged rows_changed = 4;
    SeatChanged seat_changed = 5;
    RsvpPicked rsvp = 6;
    // `AgendaAction.key`: `edit` is an intent the shell routes to the
    // editor; `cancel` opens the confirm or the scope sheet.
    ActionPicked action = 7;
    ScopePicked scope = 8;
    SheetClosed sheet_closed = 9;
    // The confirm, or the scope sheet's commit.
    Confirmed confirmed = 10;
    ConfirmDismissed confirm_dismissed = 11;
    WriteSettled write_settled = 12;
    ParkedRetried parked_retried = 13;
    ParkedDismissed parked_dismissed = 14;
  }

  message Opened {
    string event_id = 1;
    string instance_key = 2;
    optional string original_start_local = 3;
    string day = 4;
  }

  message Refreshed {}

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    string table = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message RsvpPicked {
    string partstat = 1;
  }

  message ActionPicked {
    string key = 1;
  }

  message ScopePicked {
    AgendaScope scope = 1;
  }

  message SheetClosed {}

  message Confirmed {}

  message ConfirmDismissed {}

  message ParkedRetried {}

  message ParkedDismissed {}
}

// ---- agenda.editor --------------------------------------------------------

message AgendaEditorState {
  SeatState seat = 1;
  Mode mode = 2;
  // EDIT's occurrence; empty on CREATE.
  string event_id = 3;
  string instance_key = 4;
  optional string original_start_local = 5;
  // CREATE's day, or the occurrence's.
  string day = 6;
  oneof content {
    Loading loading = 7;
    ReadFailure failure = 8;
    Denied denied = 9;
    AgendaEditorData data = 10;
    AgendaGone gone = 11;
  }
  WriteState write = 12;
  Sheet sheet = 13;
  // The discard or skip question, while it is asked.
  optional Confirm confirm = 14;
  Asking asking = 15;
  AgendaEditorChrome chrome = 16;
  // THE EDITOR IS DONE — saved, skipped, or left with nothing to lose. The
  // shell pops.
  bool dismissed = 17;

  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_CREATE = 1;
    MODE_EDIT = 2;
  }

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_CALENDAR = 2;
    SHEET_GUESTS = 3;
    SHEET_REPEAT = 4;
    SHEET_REMINDER = 5;
    // Saving a change to one occurrence of a series.
    SHEET_SCOPE = 6;
  }

  enum Asking {
    ASKING_UNSPECIFIED = 0;
    ASKING_NONE = 1;
    ASKING_DISCARD = 2;
    ASKING_SKIP = 3;
  }
}

message AgendaEditorChrome {
  string title_placeholder = 1;
  string notes_placeholder = 2;
  string link_placeholder = 3;
  string field_title = 4;
  string field_all_day = 5;
  string field_starts = 6;
  string field_ends = 7;
  string field_calendar = 8;
  string field_guests = 9;
  string field_repeat = 10;
  string field_reminder = 11;
  string field_link = 12;
  string field_notes = 13;
  string save = 14;
  string close = 15;
  string done = 16;
  string keep_editing = 17;
  string loading = 18;
  string retry = 19;
  string scope_title = 20;
  string scope_question = 21;
  // The words on the rows that open the platform's pickers.
  string pick_date = 22;
  string pick_time = 23;
}

// THE MEMBER'S VALUES, as the pickers bind them. Days are civil `YYYY-MM-DD`,
// times `HH:MM` on the device's wall clock; the machine never reads a zone.
message AgendaDraft {
  string title = 1;
  string notes = 2;
  bool all_day = 3;
  string start_day = 4;
  string start_time = 5;
  // An ALL-DAY end is the last day, inclusive (`agenda.proto`'s `local_end`).
  string end_day = 6;
  string end_time = 7;
  string calendar_id = 8;
  repeated string guest_ids = 9;
  // `AgendaChoice.key` of the repeat list.
  string repeat_key = 10;
  // `AgendaChoice.key` of the reminder list.
  string reminder_key = 11;
  string link = 12;
}

message AgendaChoice {
  string key = 1;
  string label = 2;
  bool selected = 3;
  string hue_key = 4;
  string accessibility_label = 5;
}

message AgendaEditorData {
  AgendaDraft draft = 1;
  // "New event" / "Edit event" / "Edit this occurrence".
  string heading = 2;
  // "Wednesday 11 March · 08:15" / "Wednesday 11 March": the row, spoken.
  string start_label = 3;
  string end_label = 4;
  string calendar_label = 5;
  string calendar_hue_key = 6;
  repeated AgendaChoice calendars = 7;
  // "Priya Raman, Tom Whitcombe" / "Nobody else".
  string guests_label = 8;
  repeated AgendaChoice guests = 9;
  string repeat_label = 10;
  repeated AgendaChoice repeats = 11;
  // False on an occurrence: a rule is the whole series'.
  bool repeat_enabled = 12;
  string repeat_note = 13;
  string reminder_label = 14;
  repeated AgendaChoice reminders = 15;
  // The save scope sheet's rows (EDIT of a series occurrence).
  repeated AgendaScopeChoice scopes = 16;
  bool dirty = 17;
  bool can_save = 18;
  // Why Save is not armed: "Add a title to save." / "An event must end after
  // it starts." Empty when it is, or when nothing changed.
  string blocked_reason = 19;
  // "Skip this occurrence", on a series occurrence.
  bool show_skip = 20;
  string skip_label = 21;
  string foot_note = 22;
  // The scope sheet's Save is armed (a scope is picked).
  bool scope_armed = 23;
  // The day and the time apart, for a row that draws two pickers:
  // "Wednesday 11 March" and "08:15". The times are empty all-day.
  string start_day_label = 24;
  string start_time_label = 25;
  string end_day_label = 26;
  string end_time_label = 27;
}

message AgendaEditorEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    ReadRefused refused = 3;
    RowsChanged rows_changed = 4;
    SeatChanged seat_changed = 5;
    TitleChanged title = 6;
    NotesChanged notes = 7;
    AllDayToggled all_day = 8;
    StartChanged start = 9;
    EndChanged end = 10;
    CalendarPicked calendar = 11;
    GuestToggled guest = 12;
    RepeatPicked repeat = 13;
    ReminderPicked reminder = 14;
    LinkChanged link = 15;
    SheetOpened sheet_opened = 16;
    SheetClosed sheet_closed = 17;
    SaveTapped save = 18;
    ScopePicked scope = 19;
    SkipTapped skip = 20;
    // Back or close. With changes it asks; without, it is done.
    LeaveRequested leave = 21;
    Confirmed confirmed = 22;
    ConfirmDismissed confirm_dismissed = 23;
    WriteSettled write_settled = 24;
  }

  // CREATE carries a day (the home's anchor) and no event; EDIT the
  // occurrence `AgendaEventState` holds.
  message Opened {
    AgendaEditorState.Mode mode = 1;
    string event_id = 2;
    string instance_key = 3;
    optional string original_start_local = 4;
    string day = 5;
  }

  message Refreshed {}

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    string table = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message TitleChanged {
    string text = 1;
  }

  message NotesChanged {
    string text = 1;
  }

  message AllDayToggled {
    bool on = 1;
  }

  // What the start picker chose: `YYYY-MM-DD` and `HH:MM` (ignored all-day).
  message StartChanged {
    string day = 1;
    string time = 2;
  }

  message EndChanged {
    string day = 1;
    string time = 2;
  }

  message CalendarPicked {
    string calendar_id = 1;
  }

  message GuestToggled {
    string party_id = 1;
  }

  message RepeatPicked {
    string key = 1;
  }

  message ReminderPicked {
    string key = 1;
  }

  message LinkChanged {
    string text = 1;
  }

  message SheetOpened {
    AgendaEditorState.Sheet sheet = 1;
  }

  message SheetClosed {}

  message SaveTapped {}

  message ScopePicked {
    AgendaScope scope = 1;
  }

  message SkipTapped {}

  message LeaveRequested {}

  message Confirmed {}

  message ConfirmDismissed {}
}

// ---------------------------------------------------------------------------
// --- Kit ---
// ---------------------------------------------------------------------------
//
// THE SHARED VALUE TYPES EVERY APP SCREEN IS BUILT FROM (the five-app port's
// kit, K1). Owned by the kit lane alone: an app lane appends its own section
// and never edits this one. Each is a small value type with finished strings,
// so the four laws above stay readable in each screen's OWN state message —
// the kit shares the parts and never the whole (`ScreenState.state` stays
// `bytes` for the reason it gives).
//
// `dev.centraid.shared.kit` in `mobile/shared` owns the transitions over these;
// SwiftUI and Compose draw them with one primitive each.

// THE VAULT WOULD NOT LET THIS APP READ — a state, not an error (law 1's
// fourth shape where a screen has one). Finished strings; `receipt` names what
// was asked and refused, so a member can find the grant.
message Denied {
  string title = 1;
  string body = 2;
  string receipt = 3;
}

// A list with nothing in it, said once: one sentence and at most one action
// (DESIGN.md's copy table). `action_label` empty means no action; the action
// itself is the screen's own event.
message EmptyState {
  string headline = 1;
  string body = 2;
  string action_label = 3;
}

// Search opens a field on the current surface; it is never a destination.
// `answered_term` is the term the rows on screen answer, so an answer for a
// term the member has since changed is recognisably stale. Closing clears both.
message SearchField {
  bool open = 1;
  string term = 2;
  string answered_term = 3;
}

// ONE WRITE IN FLIGHT ON A DETAIL SCREEN. A refused write keeps the content;
// the sentence lands here, never in `content`.
message WriteState {
  Phase phase = 1;
  optional ReadFailure failure = 2;
  // The key the in-flight (or last) write was submitted under. A settle with
  // another key is someone else's answer and is ignored.
  string invoke_key = 3;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_IDLE = 1;
    PHASE_IN_FLIGHT = 2;
    PHASE_COMMITTED = 3;
    PHASE_REFUSED = 4;
  }
}

// What a write's answer says, as every kit screen's settle event carries it.
message WriteSettled {
  string invoke_key = 1;
  bool committed = 2;
  // The core's sentence when it gave one; absent when it said nothing.
  optional ReadFailure failure = 3;
}

// AN EDITOR THAT SAVES AS THE MEMBER WRITES (#1015 D3: close = done).
//
// `edit_seq` counts edits; `saved_seq` is the last edit the vault committed;
// `saving_seq` is the edit in flight. Unsaved words exist exactly when
// `edit_seq > saved_seq`, and a change arriving from the vault while they do
// sets `remote_changed` instead of replacing them. There is no vault-side
// revision check: the last save on this phone wins.
message Autosave {
  Phase phase = 1;
  uint64 edit_seq = 2;
  uint64 saved_seq = 3;
  string base_revision_id = 4;
  optional ReadFailure failure = 5;
  bool remote_changed = 6;
  uint64 saving_seq = 7;
  // The key the save in flight was submitted under, one per `edit_seq`.
  string invoke_key = 8;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_CLEAN = 1;
    PHASE_DIRTY = 2;
    PHASE_SAVING = 3;
    PHASE_SAVED = 4;
    PHASE_REFUSED = 5;
    // Kept for the stale-base compare a later slice adds; nothing reaches it.
    PHASE_CONFLICT = 6;
  }
}

// A decision the member confirms. Full sentences, because only a destructive
// confirm earns them (DESIGN.md); `destructive` draws the outlined `net` action.
message Confirm {
  string title = 1;
  string body = 2;
  string confirm_label = 3;
  bool destructive = 4;
}

// A row's status as a finished label and a tone. `seam` is "not yet", `net`
// is owe/leaves (DESIGN.md).
message StatusChip {
  string label = 1;
  Tone tone = 2;

  enum Tone {
    TONE_UNSPECIFIED = 0;
    TONE_NEUTRAL = 1;
    TONE_SEAM = 2;
    TONE_NET = 3;
    TONE_WARNING = 4;
  }
}

// The simple list row: search hits, notebooks, projects, settings-like rows.
// A row whose fields carry meaning (`TallyRow`, `AgendaEventRow`) stays the
// app's own and maps onto the same native primitive in the view.
message ListRow {
  string id = 1;
  string title = 2;
  string meta = 3;
  string trailing = 4;
  // In draw order; a row draws every one (People's "Overdue" and "Birthday ·
  // in 3 days" side by side). Empty draws none.
  repeated StatusChip chips = 5;
  string hue_key = 6;
  string accessibility_label = 7;
  bool dimmed = 8;
  bool pending = 9;
  // How `trailing` is inked: NEUTRAL is ink, NET is owe/leaves (DESIGN.md).
  // UNSPECIFIED is ink too, so a row with a plain count sets nothing.
  StatusChip.Tone trailing_tone = 10;
}

// THE ONE STATUS LINE (DESIGN.md: no toast). One clause, at most one verb.
// A screen carries it where it says what a write did — "Task done" with
// Undo — and `action_label` empty is a line with no verb. What the verb does
// is the screen's own event (`StatusActed`).
message StatusLine {
  string sentence = 1;
  // "Undo", or empty.
  string action_label = 2;
  // The vault refused a write: the sentence is the core's.
  bool refused = 3;
}

// A section head: a title, an optional count and a text verb.
message SectionHead {
  string title = 1;
  optional uint32 count = 2;
  string verb_label = 3;
}

message TrashRow {
  string id = 1;
  string title = 2;
  string meta = 3;
  // Empty when the app has no destroy path: then there is no "Delete forever".
  string purge_label = 4;
  string icon_key = 5;
  // "Restore": every app can restore what it trashed.
  string restore_label = 6;
}

// ONE TRASH SCREEN FOR EVERY APP (law 2: the app is a parameter). #1015 D1:
// Empty trash everywhere an app can destroy; an app that cannot (Docs today)
// offers restore only, and says nothing it cannot do.
message TrashListState {
  SeatState seat = 1;
  string app_id = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    Denied denied = 5;
    TrashListData data = 6;
  }
  // A first page is in flight over rows the screen keeps showing.
  bool first_page_pending = 7;
  WriteState write = 8;
  // The confirm on screen, and what it is asking about.
  optional Confirm confirm = 9;
  oneof asking {
    string purge_id = 10;
    bool empty_all = 11;
  }
  uint32 purge_window_days = 12;
  // "Trash", and the back control's words: the app the trash belongs to
  // ("Notes"), because the page was pushed from it.
  string title = 13;
  string back_label = 14;
}

message TrashListData {
  repeated TrashRow rows = 1;
  optional string next_cursor = 2;
  EmptyState empty = 3;
  // Empty when the app cannot empty its trash.
  string empty_label = 4;
}

message TrashListEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    NextPageRequested next_page = 3;
    DataArrived data = 4;
    ReadRefused refused = 5;
    Denied denied = 6;
    RowsChanged rows_changed = 7;
    SeatChanged seat_changed = 8;
    RestoreTapped restore = 9;
    PurgeTapped purge = 10;
    EmptyTapped empty = 11;
    Confirmed confirmed = 12;
    Dismissed dismissed = 13;
    WriteSettled write_settled = 14;
  }

  message Opened {}

  message Refreshed {}

  message NextPageRequested {}

  message DataArrived {
    TrashListData data = 1;
    // The cursor this page answered: empty for a first page. See
    // `TallyListEvent.DataArrived.answered_cursor`.
    optional string answered_cursor = 2;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    repeated string ids = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message RestoreTapped {
    string id = 1;
  }

  message PurgeTapped {
    string id = 1;
  }

  message EmptyTapped {}

  message Confirmed {}

  message Dismissed {}
}

// ---------------------------------------------------------------------------
// --- Notes ---
// ---------------------------------------------------------------------------
//
// The Notes app beyond the editor (#1029 app port): the library, the
// notebooks, the journal, one note's versions, the powerbox and the trash
// (`TrashListState` with Notes' spec). Every screen reads through the core's
// Notes arm (`app_query.proto` 40-47); the answers are folded in Kotlin
// (`NotesAppReads`) into the finished rows below, so a view formats no date,
// counts nothing and chooses no copy.
//
// THE BAND IS NOTES · NOTEBOOKS · JOURNAL, and More is a sheet. Each band
// place is its own screen id (`notes.library`, `notes.notebooks`,
// `notes.journal`); a tap on another tab is an intent the shell answers by
// swapping the destination IN PLACE (`NavStack.withNotesPlace`), so back does
// not walk the tabs a member happened to tap.

// One band tab. `key` is what `BandPicked` sends: `notes`, `notebooks`,
// `journal`, `more`.
message NotesBandTab {
  string key = 1;
  string label = 2;
  // A `design/native-catalog.json` icon key.
  string icon_key = 3;
  bool current = 4;
}

// A run of a search snippet; `highlighted` runs are the index's matches. A
// view concatenates the runs and emphasises the highlighted ones.
message NotesTextRun {
  string text = 1;
  bool highlighted = 2;
}

// One note on a shelf. A PREVIEW, never a body (#404).
message NotesNoteRow {
  string note_id = 1;
  // The title, or the preview's first line when the note has none.
  string title = 2;
  string snippet = 3;
  // Search hits only: the snippet with its matches marked.
  repeated NotesTextRun snippet_runs = 4;
  // "Edited 3 March · Recipes".
  string meta = 5;
  bool pinned = 6;
  // "2 of 5 done", empty when the note has no checklist.
  string check_label = 7;
  string accessibility_label = 8;
  // The notebook it is filed in, empty when unfiled — so the file-into sheet
  // can mark the current choice.
  string notebook_id = 9;
}

message NotesLibrarySection {
  SectionHead head = 1;
  repeated NotesNoteRow rows = 2;
}

message NotesTagChip {
  string concept_id = 1;
  string label = 2;
  bool selected = 3;
}

// One option in a choices sheet (file into notebook, sort).
message NotesChoice {
  string id = 1;
  string label = 2;
  string detail = 3;
  bool selected = 4;
  // A sort choice's sort, what `SortPicked` sends back; UNSPECIFIED on a
  // notebook choice.
  NotesLibrarySort sort = 5;
}

// The actions a row's menu offers, as finished labels.
message NotesRowMenu {
  string note_id = 1;
  string title = 2;
  string pin_label = 3;
  string file_label = 4;
  string trash_label = 5;
}

enum NotesLibrarySort {
  NOTES_LIBRARY_SORT_UNSPECIFIED = 0;
  NOTES_LIBRARY_SORT_UPDATED = 1;
  NOTES_LIBRARY_SORT_CREATED = 2;
  NOTES_LIBRARY_SORT_TITLE = 3;
}

message NotesLibraryChrome {
  string title = 1;
  string new_note = 2;
  string search_placeholder = 3;
  string search_label = 4;
  string search_close = 5;
  string retry = 6;
  string loading = 7;
  string more_title = 8;
  // The More sheet's rows.
  string trash_label = 9;
  string sort_label = 10;
  string pinned_only_label = 11;
  string file_title = 12;
  string sort_title = 13;
  string home = 14;
  // The row menu's accessibility label.
  string row_menu_label = 15;
  // The verb beside `filter_label` ("Clear"). Not `clear_…`: SwiftProtobuf
  // suffixes a field that begins with `clear` (it would shadow a generated
  // `clear…()`), and a view should not have to spell `clearFilter_p`.
  string filter_clear_label = 16;
}

message NotesLibraryData {
  // PINNED FIRST: a "Pinned" section, then the rest.
  repeated NotesLibrarySection sections = 1;
  // The chips the window saw.
  repeated NotesTagChip tags = 2;
  // Set when `sections` is empty; its action sends `NewNoteRequested`.
  EmptyState empty = 3;
  // The recent window filled: `window_end_verb` sends `WindowWidened`.
  bool truncated = 4;
  string window_end_label = 5;
  string window_end_verb = 6;
  // "12 notes".
  string count_label = 7;
}

// Search results over the library, while a term is typed. Kept apart from
// `content` so closing search puts the library back without a read.
message NotesSearchResults {
  string term = 1;
  repeated NotesNoteRow rows = 2;
  // Set when `rows` is empty: no term yet, or no match.
  EmptyState empty = 3;
  bool loading = 4;
}

message NotesLibraryState {
  SeatState seat = 1;
  oneof content {
    Loading loading = 2;
    ReadFailure failure = 3;
    Denied denied = 4;
    NotesLibraryData data = 5;
  }
  SearchField search = 6;
  NotesSearchResults results = 7;
  // THE READ'S PARAMETERS, as the core's `NotesLibraryRequest` takes them.
  NotesLibrarySort sort = 8;
  bool pinned_only = 9;
  bool unfiled_only = 10;
  string notebook_id = 11;
  repeated string tag_concept_ids = 12;
  // 0 is the core's default window; `WindowWidened` grows it.
  uint32 window = 13;
  // The heading: "Notes", a notebook's name, or "Unfiled".
  string heading = 14;
  // "Pinned only · Recipes", empty with no filter; `ClearFilter` clears it.
  string filter_label = 15;
  Sheet sheet = 16;
  // The row a menu or the file-into sheet is about.
  NotesRowMenu menu = 17;
  // The file-into or sort sheet's options.
  repeated NotesChoice choices = 18;
  optional Confirm confirm = 19;
  string confirm_note_id = 20;
  WriteState write = 21;
  repeated NotesBandTab band = 22;
  NotesLibraryChrome chrome = 23;
  // A first read is in flight over rows the screen keeps showing.
  bool first_page_pending = 24;
  // The notebooks the file-into sheet offers, as last read.
  repeated NotesChoice notebooks = 25;
  // The library's parameters moved, or its rows did, while search was
  // answering: closing search reads the library again.
  bool library_stale = 26;

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_MORE = 2;
    SHEET_ROW_MENU = 3;
    SHEET_FILE_INTO = 4;
    SHEET_SORT = 5;
  }
}

message NotesLibraryEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    BandPicked band = 3;
    SearchOpened search_opened = 4;
    SearchTermChanged search_term = 5;
    SearchClosed search_closed = 6;
    SortPicked sort = 7;
    PinnedOnlyToggled pinned_only = 8;
    TagToggled tag = 9;
    WindowWidened window_widened = 10;
    // Clear every filter (`filter_label`'s verb).
    FilterCleared filter_cleared = 11;
    SheetOpened sheet_opened = 12;
    SheetClosed sheet_closed = 13;
    RowMenuOpened row_menu = 14;
    PinToggled pin = 15;
    FileRequested file = 16;
    NotebookChosen notebook_chosen = 17;
    TrashRequested trash = 18;
    Confirmed confirmed = 19;
    Dismissed dismissed = 20;
    WriteSettled write_settled = 21;
    DataArrived data = 22;
    SearchArrived search_arrived = 23;
    ReadRefused refused = 24;
    Denied denied = 25;
    RowsChanged rows_changed = 26;
    SeatChanged seat_changed = 27;
    // INTENTS. The machine changes nothing on them; the shell routes them.
    NewNoteRequested new_note = 28;
    NotePicked note_picked = 29;
    TrashOpened trash_opened = 30;
  }

  // Opened on the whole library, one notebook, or the unfiled notes.
  message Opened {
    string notebook_id = 1;
    string notebook_name = 2;
    bool unfiled_only = 3;
  }

  message Refreshed {}

