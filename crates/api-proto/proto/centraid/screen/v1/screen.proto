// --- tally.spending ---------------------------------------------------------

message TallySpendingState {
  SeatState seat = 1;
  // `YYYY-MM`; EMPTY until the first answer names this month.
  string month = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    Denied denied = 5;
    TallySpendingData data = 6;
  }
  // "March 2026" — on the state, so stepping keeps the bar up.
  string month_label = 7;
  // False on the month today falls in: there is no spending in the future.
  bool next_enabled = 8;
  bool previous_enabled = 9;
  TallySpendingChrome chrome = 10;
}

message TallySpendingChrome {
  string title = 1;
  string previous = 2;
  string next = 3;
  string retry = 4;
  string loading = 5;
}

message TallySpendingData {
  // One per currency the month spent in, never summed across.
  repeated TallyCurrencySpend currencies = 1;
  optional EmptyState empty = 2;
  string note = 3;
}

message TallyCurrencySpend {
  string currency = 1;
  Money total = 2;
  repeated TallyCategoryRow categories = 3;
  // What you paid, what the splits make yours, and the difference.
  repeated TallySpendFact facts = 4;
}

message TallySpendFact {
  string label = 1;
  Money amount = 2;
  string note = 3;
}

message TallyCategoryRow {
  string category = 1;
  string label = 2;
  string icon_key = 3;
  Money total = 4;
  // Of the currency's total, in thousandths: a bar a view draws.
  uint32 share_permille = 5;
}

message TallySpendingEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    MonthStepped month_stepped = 3;
  }

  message Opened {}

  message Refreshed {}

  // -1 is ‹, 1 is ›.
  message MonthStepped {
    int32 months = 1;
  }
}

