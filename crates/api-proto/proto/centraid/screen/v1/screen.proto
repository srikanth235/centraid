// ---------------------------------------------------------------------------
// --- Docs ---
// ---------------------------------------------------------------------------
//
// The drive (All · Folders · Starred, Recently changed from More), a document,
// its text editor and its trash, over the core's `docs.drive`, `docs.search`,
// `docs.document` and `docs.activity` (`centraid/core/v1/docs.proto`). Every
// word, flag, icon key and empty-state choice a view draws is computed in
// `dev.centraid.shared.apps.docs`; a view lays these out and forwards events.
//
// THE CORE'S ANSWERS ARE FOLDED BEFORE THEY CROSS. This file cannot import
// `centraid.core.v1` (see Agenda's header), so `DocsReads` folds each answer
// into the messages below (`DocsFold`) and the machine decorates what depends
// on the screen's own state — the band, the pills, the empty choice. Nothing
// here re-folds locally without a read: a shelf, a filter and the sort are
// part of the core's REQUEST, so changing one reads again.
//
// THE BAND IS THE HANDOFF'S, MINUS WHAT HAS NO PLANE: All · Folders · Starred
// · More. v0's Shared shelf left with the sharing plane (#1029); the handoff's
// "Coming due" has no data plane in this build and is not offered. Search is a
// field on the current surface (`SearchField`), never a destination; Recently
// changed is a shelf chosen from the More sheet; Trash is its own screen,
// `TrashListState` with `app_id = "docs"`.
//
// NO DESTROY PATH. Trashing stamps a thirty-day grace window; "Empty trash"
// ends every window at once. Nothing in this build removes a trashed document,
// so no string here says "delete forever" — `docs.proto`'s header.

message DocsDriveState {
  SeatState seat = 1;
  // WHICH SHELF, as a parameter (law 2). More is a sheet and search a field,
  // so neither is a value here.
  Destination destination = 2;
  // FOLDERS only: the folder open, EMPTY for the drive's top level. Its name
  // rides along so the head has words before the read lands.
  string folder_id = 3;
  string folder_name = 4;
  // The filters and the order, as the member chose them. Carried across
  // shelves; "Clear filters" resets the three filters and keeps the order.
  DocsQuery query = 5;
  Layout layout = 6;
  SearchField search = 7;
  oneof content {
    Loading loading = 8;
    ReadFailure failure = 9;
    // The vault would not let Docs read: no band, the gate's words.
    Denied denied = 10;
    DocsDriveData data = 11;
  }
  // ONE READ IN FLIGHT: an answer does not say which request it answers, so
  // a read asked while another is out is queued and the older answer dropped.
  bool reading = 12;
  bool read_queued = 13;
  // True while a re-read runs over rows the screen keeps drawing.
  bool refreshing = 14;
  // The folder tree, the labels and the counts, from the last drive answer.
  // Kept apart from `data` so a search answer (which has none) keeps them.
  DocsRail rail = 15;
  // The one sheet up, if any (law 3: a oneof, never a bag of optionals).
  DocsSheet sheet = 16;
  // One write in flight; a refused one keeps the rows and says so here.
  WriteState write = 17;
  // Trash's confirm, and the document it asks about.
  optional Confirm confirm = 18;
  string confirm_document_id = 19;
  // An inline rename, autosaving (#1015 D3). Unset when none is open.
  optional DocsRename rename = 20;
  // THE BAND, computed. EMPTY while denied.
  repeated DocsBandTab band = 21;
  // The filter and sort pills over the list, computed. EMPTY in search, on
  // Recently changed (a window, not a filter) and while denied.
  repeated DocsPill pills = 22;
  // Whether any filter is set, and so whether "Clear filters" shows.
  bool filters_active = 23;
  DocsDriveChrome chrome = 24;
  // OS grants, as STATE (law 4): what the Add sheet's rows can promise.
  DocsCapture capture = 25;
  // The app bar's subtitle: "24 documents", "Starred · 3".
  string head_meta = 26;

  enum Destination {
    DESTINATION_UNSPECIFIED = 0;
    DESTINATION_ALL = 1;
    DESTINATION_FOLDERS = 2;
    DESTINATION_STARRED = 3;
    // Chosen from the More sheet; not a band tab.
    DESTINATION_RECENT = 4;
  }

  enum Layout {
    LAYOUT_UNSPECIFIED = 0;
    LAYOUT_LIST = 1;
    LAYOUT_GRID = 2;
  }
}

// The core's filter and sort values, mirrored (this file cannot import them).
message DocsQuery {
  TypeFilter type = 1;
  Modified modified = 2;
  // One label, matched exactly; EMPTY is none.
  string label = 3;
  Sort sort = 4;
  // FALSE is descending: newest changed, Z→A, largest first.
  bool ascending = 5;

  enum TypeFilter {
    TYPE_FILTER_UNSPECIFIED = 0;
    TYPE_FILTER_PDF = 1;
    TYPE_FILTER_IMAGE = 2;
    TYPE_FILTER_WORD = 3;
    TYPE_FILTER_SPREADSHEET = 4;
    TYPE_FILTER_MARKDOWN = 5;
    TYPE_FILTER_TEXT = 6;
    TYPE_FILTER_AUDIO = 7;
    TYPE_FILTER_VIDEO = 8;
  }

  enum Modified {
    MODIFIED_UNSPECIFIED = 0;
    MODIFIED_TODAY = 1;
    MODIFIED_LAST_7_DAYS = 2;
    MODIFIED_LAST_30_DAYS = 3;
    MODIFIED_THIS_YEAR = 4;
  }

  enum Sort {
    SORT_UNSPECIFIED = 0;
    SORT_CHANGED = 1;
    SORT_NAME = 2;
    SORT_KIND = 3;
    SORT_SIZE = 4;
  }
}

message DocsDriveChrome {
  string title = 1;
  string home = 2;
  string search_label = 3;
  string search_placeholder = 4;
  string search_close = 5;
  // The failure state's action; it sends `Refreshed`.
  string retry = 6;
  // The skeleton's accessibility label.
  string loading = 7;
  // The Add button (sends `SheetOpened{SHEET_KIND_ADD}`).
  string add = 8;
  // The grid/list toggle: its label names what a tap switches TO.
  string layout_toggle = 9;
  string layout_icon_key = 10;
  // "Clear filters". Not `clear_…`: SwiftProtobuf suffixes a field that
  // begins with `clear`.
  string filters_clear_label = 11;
  // The row's overflow button's accessibility label.
  string row_menu = 12;
  // "Starred" / "Not starred", for a view that draws the star glyph.
  string starred = 13;
  // The inline rename's words.
  string rename_placeholder = 14;
  string rename_done = 15;
}

message DocsBandTab {
  // `all`, `folders`, `starred`, `more` — what `BandPicked` sends.
  string key = 1;
  string label = 2;
  // A `design/native-catalog.json` icon key.
  string icon_key = 3;
  bool current = 4;
}

// A pill over the list. `key` is what `SheetOpened` asks for; `label` is the
// choice when one is set ("PDF") and the filter's name when none is ("Type").
message DocsPill {
  DocsSheet.Kind key = 1;
  string label = 2;
  bool active = 3;
  string accessibility_label = 4;
}

// OS grants the Add sheet's rows depend on.
message DocsCapture {
  Permission camera = 1;
  Permission files = 2;

  enum Permission {
    PERMISSION_UNSPECIFIED = 0;
    // Never asked: the row is offered and the shell asks the OS on tap.
    PERMISSION_NOT_ASKED = 1;
    PERMISSION_GRANTED = 2;
    // Refused by the member: the row says where to turn it on.
    PERMISSION_DENIED = 3;
    // Refused by policy (parental controls, MDM): the row says so and is off.
    PERMISSION_RESTRICTED = 4;
    // This device has no camera, or no file picker: the row is hidden.
    PERMISSION_UNAVAILABLE = 5;
  }
}

message DocsRail {
  // Sorted by name; `parent_id` → `folder_id` nests them.
  repeated DocsFolderNode folders = 1;
  // Every label on a live document in the window, sorted.
  repeated string labels = 2;
  uint32 all_count = 3;
  uint32 unfiled_count = 4;
  uint32 starred_count = 5;
  uint32 trash_count = 6;
  // Older documents exist beyond the drive's window of `window`.
  bool truncated = 7;
  uint32 window = 8;
  // `YYYY-MM-DD`, from the answer.
  string today = 9;
}

message DocsFolderNode {
  string folder_id = 1;
  string name = 2;
  // EMPTY at the top level.
  string parent_id = 3;
  uint32 document_count = 4;
  // "3 documents" / "Empty".
  string count_label = 5;
  string accessibility_label = 6;
}

message DocsCrumb {
  // EMPTY is the drive's top level.
  string folder_id = 1;
  string name = 2;
}

message DocsDriveData {
  Mode mode = 1;
  // The shelf's rows (or the hits), in the core's order.
  repeated DocsRowView rows = 2;
  // FOLDERS only: the open folder's child folders, and the path to it.
  repeated DocsFolderNode folders = 3;
  repeated DocsCrumb crumbs = 4;
  // Set exactly when there is nothing to draw: no rows and no folders.
  optional EmptyState empty = 5;
  // What the empty state's action sends; NONE when it has none.
  EmptyAction empty_action = 6;
  // "Showing the newest 200. Search reaches the rest." EMPTY when whole.
  string truncated_note = 7;
  // Recently changed's one-line rule. EMPTY elsewhere.
  string shelf_note = 8;

  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_SHELF = 1;
    MODE_SEARCH = 2;
  }

  enum EmptyAction {
    EMPTY_ACTION_UNSPECIFIED = 0;
    EMPTY_ACTION_NONE = 1;
    // Opens the Add sheet.
    EMPTY_ACTION_ADD = 2;
    // Sends `FiltersCleared`.
    EMPTY_ACTION_CLEAR_FILTERS = 3;
    // Opens the new-folder sheet.
    EMPTY_ACTION_NEW_FOLDER = 4;
  }
}

// ONE DOCUMENT, as every list and the document's head draw it.
message DocsRowView {
  string document_id = 1;
  // The head's bytes: what a thumbnail or the stage asks `ContentUrlRequest`
  // for.
  string content_id = 2;
  // The title, or "Untitled".
  string title = 3;
  // A `design/native-catalog.json` icon key for the kind.
  string kind_icon_key = 4;
  // "PDF", "Image", …
  string kind_label = 5;
  // "PDF · 2.4 MB · Changed today". Trash: "Deleted 3 March".
  string meta = 6;
  DocsSurfaceKind surface = 7;
  bool starred = 8;
  bool trashed = 9;
  // EMPTY at the top level.
  string folder_id = 10;
  repeated DocsLabelChip labels = 11;
  // Search only: the match, cut into runs the view marks.
  repeated DocsSnippetRun snippet = 12;
  // "Lease 2026, PDF, 2.4 MB, changed today, starred".
  string accessibility_label = 13;
}

enum DocsSurfaceKind {
  DOCS_SURFACE_KIND_UNSPECIFIED = 0;
  // Text: the reader, over the body, and editable.
  DOCS_SURFACE_KIND_READING = 1;
  // An image, audio, video or PDF: the media stage.
  DOCS_SURFACE_KIND_STAGE = 2;
  // Anything the phone cannot render: the facts.
  DOCS_SURFACE_KIND_FACTS = 3;
}

message DocsLabelChip {
  // The edge `core.untag_item` removes.
  string tag_id = 1;
  string label = 2;
}

message DocsSnippetRun {
  string text = 1;
  bool match = 2;
}

// An action on a menu or a sheet row. `key` is what the picked event sends.
message DocsAction {
  string key = 1;
  string label = 2;
  string icon_key = 3;
  // Drawn in the `net` tone.
  bool destructive = 4;
  bool enabled = 5;
  // One line under the label; EMPTY for none.
  string detail = 6;
}

// A choice on a choices sheet (#1015 D4: choices sheet, content pushes).
message DocsChoice {
  string key = 1;
  string label = 2;
  string detail = 3;
  bool selected = 4;
}

// THE ONE SHEET UP. `kind` says which; the arm holds what it draws.
message DocsSheet {
  Kind kind = 1;
  string title = 2;
  oneof body {
    // More, Add and a row's menu: a list of actions.
    DocsActionList actions = 3;
    // A filter, the sort, or where to move a document.
    DocsChoiceList choices = 4;
    DocsLabelsSheet labels = 5;
    DocsNewFolderSheet new_folder = 6;
  }
  // The document a row menu, a move or labels sheet is about.
  string document_id = 7;
  string close_label = 8;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_NONE = 1;
    KIND_MORE = 2;
    KIND_ADD = 3;
    KIND_TYPE = 4;
    KIND_MODIFIED = 5;
    KIND_LABEL = 6;
    KIND_SORT = 7;
    KIND_ROW_MENU = 8;
    KIND_MOVE = 9;
    KIND_LABELS = 10;
    KIND_NEW_FOLDER = 11;
  }
}

message DocsActionList {
  repeated DocsAction actions = 1;
  // One line under the list; EMPTY for none.
  string footer = 2;
}

message DocsChoiceList {
  repeated DocsChoice choices = 1;
}

message DocsLabelsSheet {
  // On the document now; each removable.
  repeated DocsLabelChip current = 1;
  // Labels elsewhere in the drive, not on this document.
  repeated string available = 2;
  // The new label being typed, and whether "Add" can be pressed.
  string draft = 3;
  bool can_add = 4;
  string add_label = 5;
  string placeholder = 6;
  string remove_label = 7;
}

message DocsNewFolderSheet {
  string name = 1;
  string placeholder = 2;
  string create_label = 3;
  bool can_create = 4;
  // "In Taxes" / "At the top level".
  string where_label = 5;
}

// AN INLINE RENAME, autosaving: `AutosaveLaw` over the title alone.
message DocsRename {
  string document_id = 1;
  string title = 2;
  Autosave autosave = 3;
  // The title as the vault last had it, and the one the save in flight
  // carries (`AutosaveLens.baseline` / `sending`).
  optional string baseline = 4;
  optional string sending = 5;
  // "Saved" / "Saving" / the refusal's sentence. EMPTY while clean.
  string status_label = 6;
  // The field is closed (close = done) and its last save is finishing: the
  // row draws `title` until the vault's own answer replaces it.
  bool closed = 7;
}

message DocsDriveEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    BandPicked band = 3;
    DataArrived data = 4;
    ReadRefused refused = 5;
    Denied denied = 6;
    RowsChanged rows_changed = 7;
    SeatChanged seat_changed = 8;
    SearchOpened search_opened = 9;
    SearchTermChanged search_term = 10;
    SearchClosed search_closed = 11;
    LayoutToggled layout_toggled = 12;
    SheetOpened sheet_opened = 13;
    SheetClosed sheet_closed = 14;
    ChoicePicked choice = 15;
    FiltersCleared filters_cleared = 16;
    RowMenuOpened row_menu = 17;
    ActionPicked action = 18;
    RenameEdited rename_edited = 19;
    RenameClosed rename_closed = 20;
    Ticked tick = 21;
    Left left = 22;
    LabelAdded label_added = 23;
    LabelRemoved label_removed = 24;
    LabelDraftEdited label_draft = 25;
    FolderNameEdited folder_name = 26;
    FolderCreated folder_created = 27;
    Confirmed confirmed = 28;
    Dismissed dismissed = 29;
    WriteSettled write_settled = 30;
    PermissionChanged permission = 31;
    // INTENTS. The machine changes nothing on them; the shell routes them
    // (push a folder, a document or the trash; start a capture).
    FolderPicked folder_picked = 32;
    DocumentPicked document_picked = 33;
    AddRequested add_requested = 34;
    TrashOpened trash_opened = 35;
  }

  // Lands on `destination` (All when unspecified); FOLDERS opens `folder_id`.
  message Opened {
    DocsDriveState.Destination destination = 1;
    string folder_id = 2;
    string folder_name = 3;
  }

  message Refreshed {}

  // By `DocsBandTab.key`. `more` opens the More sheet.
  message BandPicked {
    string key = 1;
  }

  // One read's answer, folded (`DocsFold`). `rail` is set on a drive
  // answer and unset on a search answer.
  message DataArrived {
    DocsDriveData data = 1;
    optional DocsRail rail = 2;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    string table = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message SearchOpened {}

  message SearchTermChanged {
    string term = 1;
  }

  message SearchClosed {}

  message LayoutToggled {}

  message SheetOpened {
    DocsSheet.Kind kind = 1;
  }

  message SheetClosed {}

  // A `DocsChoice.key` on the open choices sheet.
  message ChoicePicked {
    string key = 1;
  }

  message FiltersCleared {}

  message RowMenuOpened {
    string document_id = 1;
  }

  // A `DocsAction.key` on the open sheet (More, Add or a row menu).
  message ActionPicked {
    string key = 1;
  }

  message RenameEdited {
    string title = 1;
  }

  // Done, or the field lost focus: save now (close = done).
  message RenameClosed {}

  message Ticked {
    string token = 1;
  }

  message Left {}

  message LabelAdded {
    string label = 1;
  }

  message LabelRemoved {
    string tag_id = 1;
  }

  message LabelDraftEdited {
    string text = 1;
  }

  message FolderNameEdited {
    string name = 1;
  }

  message FolderCreated {}

  message Confirmed {}

  message Dismissed {}

  message PermissionChanged {
    Surface surface = 1;
    DocsCapture.Permission permission = 2;

    enum Surface {
      SURFACE_UNSPECIFIED = 0;
      SURFACE_CAMERA = 1;
      SURFACE_FILES = 2;
    }
  }

  message FolderPicked {
    string folder_id = 1;
    string name = 2;
  }

  message DocumentPicked {
    string document_id = 1;
    string title = 2;
    DocsSurfaceKind surface = 3;
  }

  // Capture is the shell's: the file picker, the scanner, a blank text
  // document. `folder_id` is where it lands (EMPTY: the top level).
  message AddRequested {
    Kind kind = 1;
    string folder_id = 2;

    enum Kind {
      KIND_UNSPECIFIED = 0;
      KIND_UPLOAD = 1;
      KIND_SCAN = 2;
      KIND_TEXT = 3;
    }
  }

  message TrashOpened {}
}

// ---------------------------------------------------------------------------
// Docs: one document
// ---------------------------------------------------------------------------

message DocsDocumentState {
  SeatState seat = 1;
  string document_id = 2;
  // Rides along, so the head has words before the read.
  string title_hint = 3;
  oneof content {
    Loading loading = 4;
    ReadFailure failure = 5;
    Denied denied = 6;
    DocsDocumentData data = 7;
  }
  bool reading = 8;
  bool read_queued = 9;
  bool refreshing = 10;
  WriteState write = 11;
  optional Confirm confirm = 12;
  optional DocsRename rename = 13;
  DocsSheet sheet = 14;
  DocsDocumentChrome chrome = 15;
}

message DocsDocumentChrome {
  string back = 1;
  string retry = 2;
  string loading = 3;
  string more = 4;
  string versions_heading = 5;
  string activity_heading = 6;
  string facts_heading = 7;
  string rename_placeholder = 8;
  string rename_done = 9;
}

message DocsDocumentData {
  // The document, as its head draws it. Unset when it is gone.
  optional DocsRowView row = 1;
  // WHICH SURFACE, and what it draws (law 3).
  oneof surface {
    DocsReader reading = 2;
    DocsStage stage = 3;
    // Docs cannot render this kind: the facts below are the answer.
    DocsFactsOnly facts_only = 4;
    // No such document: deleted elsewhere, or a stale link.
    EmptyState gone = 5;
  }
  repeated DocsFact facts = 6;
  // The folder path, top level first, for the breadcrumb.
  repeated DocsCrumb path = 7;
  repeated DocsVersionRow versions = 8;
  repeated DocsActivityRow activity = 9;
  // "Nothing recorded yet." when `activity` is empty; EMPTY otherwise.
  string activity_empty = 10;
  // The head's actions, in order: edit, star, rename, move, labels, then
  // trash — or restore, on a trashed document.
  repeated DocsAction actions = 11;
  // A trashed document's line: "In trash · restorable until 3 April" or
  // "In trash · can no longer be restored". EMPTY on a live one.
  string trashed_note = 12;
  // The drive's folders and labels, for the move and labels sheets.
  repeated DocsFolderNode folders = 13;
  repeated string labels = 14;
}

message DocsReader {
  // The decoded text. Meaningful only when `has_text`.
  string body = 1;
  // FALSE is "this vault holds no text for these bytes", said by
  // `no_text`; TRUE with an empty body is an empty document.
  bool has_text = 2;
  string no_text = 3;
  Format format = 4;
  // Opens `docs.editor` (sends `EditRequested`). FALSE on a trashed document
  // or one with no text.
  bool editable = 5;
  string edit_label = 6;
  // "This document is empty." for an empty body; EMPTY otherwise.
  string empty_body = 7;

  enum Format {
    FORMAT_UNSPECIFIED = 0;
    FORMAT_PLAIN = 1;
    FORMAT_MARKDOWN = 2;
  }
}

message DocsStage {
  // What the stage asks `ContentUrlRequest` for.
  string content_id = 1;
  Media media = 2;
  string media_type = 3;
  // Whether the bytes are on this device; when not, `absent_reason` says why
  // in the member's words and the stage draws that instead.
  bool held = 4;
  string absent_reason = 5;
  string accessibility_label = 6;

  enum Media {
    MEDIA_UNSPECIFIED = 0;
    MEDIA_IMAGE = 1;
    MEDIA_PDF = 2;
    MEDIA_AUDIO = 3;
    MEDIA_VIDEO = 4;
  }
}

message DocsFactsOnly {
  string sentence = 1;
}

// One line of the facts: "Kind" · "PDF".
message DocsFact {
  string label = 1;
  string detail = 2;
}

message DocsVersionRow {
  string content_id = 1;
  // "Version 3".
  string label = 2;
  // "Current · 2.4 MB · 3 March 09:12".
  string meta = 3;
  bool current = 4;
  // "Restore" on an earlier version of a live document; EMPTY otherwise.
  string restore_label = 5;
}

message DocsActivityRow {
  // "Edited", "Renamed", …
  string label = 1;
  // "You · 3 March 09:12".
  string meta = 2;
}

message DocsDocumentEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    DataArrived data = 3;
    ReadRefused refused = 4;
    Denied denied = 5;
    RowsChanged rows_changed = 6;
    SeatChanged seat_changed = 7;
    ActionPicked action = 8;
    RenameEdited rename_edited = 9;
    RenameClosed rename_closed = 10;
    Ticked tick = 11;
    Left left = 12;
    SheetClosed sheet_closed = 13;
    ChoicePicked choice = 14;
    LabelAdded label_added = 15;
    LabelRemoved label_removed = 16;
    LabelDraftEdited label_draft = 17;
    VersionRestoreTapped version_restore = 18;
    Confirmed confirmed = 19;
    Dismissed dismissed = 20;
    WriteSettled write_settled = 21;
    // INTENTS, routed by the shell: the editor, and a crumb's folder.
    EditRequested edit_requested = 22;
    FolderPicked folder_picked = 23;
    // The head's More: the verbs sheet (`DocsSheet.KIND_MORE`, every
    // `DocsDocumentData.actions` row). A verb picked from it is
    // `ActionPicked`, and closes it.
    MoreOpened more_opened = 24;
  }

  message MoreOpened {}

  message Opened {
    string document_id = 1;
    string title = 2;
  }

  message Refreshed {}

  message DataArrived {
    DocsDocumentData data = 1;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    string table = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  // A `DocsAction.key` from the head or the verbs sheet (`more` is
  // `MoreOpened`).
  message ActionPicked {
    string key = 1;
  }

  message RenameEdited {
    string title = 1;
  }

  message RenameClosed {}

  message Ticked {
    string token = 1;
  }

  message Left {}

  message SheetClosed {}

  message ChoicePicked {
    string key = 1;
  }

  message LabelAdded {
    string label = 1;
  }

  message LabelRemoved {
    string tag_id = 1;
  }

  message LabelDraftEdited {
    string text = 1;
  }

  message VersionRestoreTapped {
    string content_id = 1;
  }

  message Confirmed {}

  message Dismissed {}

  message EditRequested {
    string document_id = 1;
    string title = 2;
  }

  message FolderPicked {
    string folder_id = 1;
    string name = 2;
  }
}

// ---------------------------------------------------------------------------
// Docs: the text editor (#1015 D3: autosave everywhere, close = done)
// ---------------------------------------------------------------------------
//
// `AutosaveLaw` over a text document's title and body. Each save is one
// `core.edit_document`, which mints a new version; `version_label` follows the
// vault after each save commits. The band is hidden (#1015 D5).

message DocsEditorState {
  SeatState seat = 1;
  string document_id = 2;
  string title_hint = 3;
  oneof content {
    Loading loading = 4;
    ReadFailure failure = 5;
    DocsEditorDraft draft = 6;
  }
  Autosave autosave = 7;
  optional DocsEditorDraft baseline = 8;
  optional DocsEditorDraft sending = 9;
  // "Version 4" — the vault's, re-read after a save commits.
  string version_label = 10;
  // "Saved" / "Saving" / "Edited" / the refusal's sentence; EMPTY while
  // clean.
  string status_label = 11;
  // "The document changed elsewhere; it reloads once your words are saved."
  // EMPTY unless `autosave.remote_changed`.
  string remote_note = 12;
  DocsReader.Format format = 13;
  DocsEditorChrome chrome = 14;
}

message DocsEditorDraft {
  string title = 1;
  string body = 2;
}

message DocsEditorChrome {
  // Close = done: the one way out, and it saves.
  string done = 1;
  string title_placeholder = 2;
  string body_placeholder = 3;
  string loading = 4;
  string retry = 5;
}

message DocsEditorEvent {
  oneof kind {
    Opened opened = 1;
    DataArrived data = 2;
    ReadRefused refused = 3;
    RowsChanged rows_changed = 4;
    SeatChanged seat_changed = 5;
    TitleEdited title = 6;
    BodyEdited body = 7;
    Ticked tick = 8;
    Left left = 9;
    WriteSettled write_settled = 10;
    Refreshed refreshed = 11;
  }

  message Opened {
    string document_id = 1;
    string title = 2;
  }

  // The document's text as the vault holds it, or `refusal` when it has
  // none this editor can take (a binary document, a trashed one, gone).
  message DataArrived {
    DocsEditorDraft draft = 1;
    string revision = 2;
    string version_label = 3;
    DocsReader.Format format = 4;
    optional ReadFailure refusal = 5;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    string table = 1;
    repeated string ids = 2;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message TitleEdited {
    string title = 1;
  }

  message BodyEdited {
    string body = 1;
  }

  message Ticked {
    string token = 1;
  }

  message Left {}

  message Refreshed {}
}

// ---------------------------------------------------------------------------
// --- Tally ---
// ---------------------------------------------------------------------------
//
// Tally's screens over the core's `tally.*` app queries (`tally.proto`,
// #1046). Every figure the core states is a `TallyMoney`, and it crosses here
// as a `Money` UNCHANGED — minor units, currency and exponent. Nothing in this
// section sums across currencies, and the machines add no two amounts they did
// not have to: a figure the core folded is passed through.
//
// VIEWS DECIDE NOTHING. Every label, sentence, tone, hue, empty state, enabled
// flag and accessibility label is computed by the `apps/tally` machines. Money
// is the one thing a view renders itself (`Money.render` / `formatMoney`), so
// an accessibility label that speaks a figure is the machine's WORDS and the
// view appends the rendered figure after them.
//
// THE RAW ANSWERS NEVER CROSS: Agenda's rule (its section's header) — the
// machines keep `centraid.core.v1`'s typed answers on a Kotlin-side state and
// fold them into these messages. For the same reason an answer, a refusal, a
// denial, a change event, a seat change and a write's settle reach a machine
// as Kotlin-side input (`TallyInput`), never as an arm of these events: a
// view forwards only what a member did.
//
// No sharing plane (#1029 amendment): no Waiting, no queued or parked notices,
// no Share group. The legacy `tally.list` messages above stay until the native
// views move to `tally.home`.

// POSITIVE IS OWED TO YOU; the tone is how a figure is inked (DESIGN.md: ink
// for owed to you, `net` for you owe, `ink2` for level — never a green).
enum TallyTone {
  TALLY_TONE_UNSPECIFIED = 0;
  TALLY_TONE_OWED = 1;
  TALLY_TONE_OWE = 2;
  TALLY_TONE_LEVEL = 3;
  // A figure that is not a position: an expense's whole amount.
  TALLY_TONE_PLAIN = 4;
}

// One figure: the ABSOLUTE amount, how to ink it, and the words beside it
// ("owes you", "you owe", "you lent", "level").
message TallyFigure {
  Money amount = 1;
  TallyTone tone = 2;
  string label = 3;
}

// A person as a chip: initials in the party hue.
message TallyPersonChip {
  string party_id = 1;
  string name = 2;
  string initials = 3;
  // `#rrggbb`, the party hue the core stated.
  string hue = 4;
  bool is_me = 5;
}

// A hero: one line per figure the core stated, a label, and the sentence that
// says where it came from.
message TallyHero {
  // Several lines when the figure is in several currencies and no rate makes
  // it one — each its own currency, never a sum.
  repeated TallyFigure lines = 1;
  // "owed to you, on balance" / "you owe, on balance" / "nothing outstanding,
  // with anyone" — the line under the display figure.
  string label = 2;
  string sub = 3;
  TallyTone tone = 4;
}

// ONE ROW SHAPE FOR EVERY LEDGER LIST: Activity, a group's ledger, a friend's,
// search hits.
message TallyLedgerRow {
  // Unique within its list: `e:<expense_id>` or `s:<settlement_id>`.
  string row_key = 1;
  // EMPTY for a settlement, which does not open.
  string expense_id = 2;
  string title = 3;
  // "Dana paid · Lisbon · Wed 11 March".
  string meta = 4;
  // The expense's whole amount.
  Money amount = 5;
  // Your part: "you lent", "you borrowed", "not involved".
  TallyFigure yours = 6;
  TallyPersonChip payer = 7;
  // A `design/native-catalog.json` icon key: the category's (`Receipt` for
  // food, `Home` for rent, …) or `Coin` for a settlement.
  string icon_key = 8;
  // The words; the view appends the rendered `amount`.
  string accessibility_label = 9;
  bool settlement = 10;
}

message TallyDaySection {
  string day = 1;
  // "Today" / "Yesterday" / "Wed 11 March".
  string heading = 2;
  repeated TallyLedgerRow rows = 3;
}

message TallyBandTab {
  // `balances`, `activity`, `groups`, `more` — what `BandPicked` sends.
  string key = 1;
  string label = 2;
  string icon_key = 3;
  bool current = 4;
}

message TallyFact {
  string label = 1;
  string detail = 2;
}

// A choice from a set, drawn as a chip.
message TallyChoice {
  string key = 1;
  string label = 2;
  bool selected = 3;
  bool enabled = 4;
  // Party hue or group colour; empty for none.
  string hue = 5;
  // A split-method choice's method, what `MethodPicked` sends back; UNSPECIFIED
  // on every other choice.
  TallySplitMethod method = 6;
}

// A proposed or recordable payment.
message TallyTransferRow {
  // `from|to|group|currency`.
  string key = 1;
  TallyPersonChip from = 2;
  TallyPersonChip to = 3;
  Money amount = 4;
  // "Dana pays Sam".
  string line = 5;
  // "Lisbon" / "Outside any group".
  string meta = 6;
  string group_id = 7;
  string accessibility_label = 8;
  // You are one of the two.
  bool yours = 9;
}

// --- tally.home: Balances · Activity · Groups, More as a sheet --------------

message TallyHomeState {
  SeatState seat = 1;
  // WHICH TAB, as a parameter (law 2). One read serves all three.
  Destination destination = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    Denied denied = 5;
    TallyHomeData data = 6;
  }
  Sheet sheet = 7;
  // Four tabs in order; EMPTY while denied.
  repeated TallyBandTab band = 8;
  TallyHomeChrome chrome = 9;
  // Activity rows drawn so far — the window end ("60 of 194"). Show more adds
  // a page; it reads nothing.
  uint32 activity_shown = 10;

  enum Destination {
    DESTINATION_UNSPECIFIED = 0;
    DESTINATION_BALANCES = 1;
    DESTINATION_ACTIVITY = 2;
    DESTINATION_GROUPS = 3;
  }

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_MORE = 2;
    // "What Tally reads" — `TallyHomeChrome.reads_facts`.
    SHEET_READS = 3;
  }
}

message TallyHomeChrome {
  string title = 1;
  // The app bar's primary verb on every tab.
  string add_expense = 2;
  string settle_up = 3;
  string retry = 4;
  string loading = 5;
  string more_title = 6;
  // The More sheet's rows, in order; `key` is what `MorePicked` sends.
  repeated TallyMoreRow more_rows = 7;
  string reads_title = 8;
  repeated TallyFact reads_facts = 9;
  string home = 10;
  string show_more = 11;
}

message TallyMoreRow {
  // `settle`, `recurring`, `spending`, `search`, `export`, `trash`, `reads`.
  string key = 1;
  string label = 2;
  string meta = 3;
  string icon_key = 4;
}

message TallyHomeData {
  // `YYYY-MM-DD`, the core's.
  string today = 1;
  // Nothing has ever been recorded: every tab draws `day_one`.
  bool day_one = 2;
  EmptyState day_one_empty = 3;
  // "Every figure is derived at read time · …", or the window sentence when
  // the ledger is longer than the core folded.
  string status_line = 4;

  // BALANCES.
  TallyHero hero = 5;
  repeated TallyFriendRow friends = 6;
  string friends_heading = 7;
  // Every friend level: stated, not celebrated. Absent otherwise.
  optional EmptyState all_settled = 8;

  // GROUPS: live, then archived under their own heading.
  repeated TallyGroupRow groups = 9;
  string groups_heading = 10;
  repeated TallyGroupRow archived_groups = 11;
  string archived_heading = 12;
  optional EmptyState groups_empty = 13;

  // ACTIVITY: day sections over the first `activity_shown` rows.
  repeated TallyDaySection activity = 14;
  // "60 of 194"; empty when everything is drawn.
  string activity_window = 15;
  // False when every row is drawn.
  bool more_activity = 16;
  optional EmptyState activity_empty = 17;
}

message TallyFriendRow {
  TallyPersonChip person = 1;
  // One per currency the position is not level in; empty when level.
  repeated TallyFigure balances = 2;
  // "level" when `balances` is empty.
  string meta = 3;
  string accessibility_label = 4;
}

message TallyGroupRow {
  string group_id = 1;
  string name = 2;
  // A catalog icon key: `Users`, unless the group's own icon IS one.
  string icon_key = 3;
  string hue = 4;
  // "4 members" / "archived · out of the lists, everything kept".
  string meta = 5;
  // Your net in the group's one money.
  TallyFigure your_net = 6;
  string accessibility_label = 7;
  // The glyph the member gave the group ("🏔️"), drawn in place of
  // `icon_key` when not empty.
  string glyph = 8;
}

message TallyHomeEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    BandPicked band = 3;
    DestinationChanged destination = 4;
    SheetOpened sheet_opened = 5;
    SheetClosed sheet_closed = 6;
    ShowMore show_more = 7;
    // INTENTS: the machine changes nothing (except `reads`, a sheet); the
    // shell routes them.
    AddExpense add_expense = 8;
    FriendPicked friend = 9;
    GroupPicked group = 10;
    ExpensePicked expense = 11;
    MorePicked more = 12;
    SettleUp settle_up = 13;
  }

  // Lands on `destination` (Balances when unspecified).
  message Opened {
    TallyHomeState.Destination destination = 1;
  }

  message Refreshed {}

  message BandPicked {
    string key = 1;
  }

  message DestinationChanged {
    TallyHomeState.Destination destination = 1;
  }

  message SheetOpened {
    TallyHomeState.Sheet sheet = 1;
  }

  message SheetClosed {}

  message ShowMore {}

  message AddExpense {}

  message FriendPicked {
    string party_id = 1;
  }

  message GroupPicked {
    string group_id = 1;
  }

  message ExpensePicked {
    string expense_id = 1;
  }

  message MorePicked {
    string key = 1;
  }

  message SettleUp {}
}

// --- tally.group ------------------------------------------------------------

message TallyGroupState {
  SeatState seat = 1;
  string group_id = 2;
  // The name rides along the route, so the app bar has words before a read.
  string title = 3;
  oneof content {
    Loading loading = 4;
    ReadFailure failure = 5;
    Denied denied = 6;
    TallyGroupData data = 7;
  }
  // The simplification toggle's write.
  WriteState write = 8;
  TallyDetailChrome chrome = 9;
}

// The words every Tally detail screen carries.
message TallyDetailChrome {
  string retry = 1;
  string loading = 2;
  string add_expense = 3;
  string settle_up = 4;
  // The back control names the page it returns to: "Tally".
  string back = 5;
  // The memo sheet (`tally.expense`): its field and its close.
  string memo_placeholder = 6;
  string memo_done = 7;
}

message TallyGroupData {
  // The group does not exist (a stale link): this, and nothing else.
  optional EmptyState gone = 1;
  string name = 2;
  string icon_key = 3;
  string hue = 4;
  // `TallyGroupRow.glyph`.
  string glyph = 15;
  // "archived · out of the lists, everything kept"; empty when live.
  string archived_meta = 5;
  TallyHero hero = 6;
  string members_heading = 7;
  repeated TallyMemberRow members = 8;
  string ledger_heading = 9;
  repeated TallyLedgerRow ledger = 10;
  optional EmptyState ledger_empty = 11;
  string settlements_heading = 12;
  repeated TallyLedgerRow settlements = 13;
  TallySimplify simplify = 14;
}

message TallyMemberRow {
  TallyPersonChip person = 1;
  TallyFigure net = 2;
  // "departed · kept on the ledger …" for someone who left; else empty.
  string meta = 3;
  bool departed = 4;
  string accessibility_label = 5;
}

message TallySimplify {
  string heading = 1;
  bool opted_in = 2;
  // "Off for this group · …" / "On for this group · …" / "Nothing to rewire".
  string state_line = 3;
  // "Turn it on" / "Turn it off".
  string toggle_label = 4;
  // False while the toggle's write is in flight.
  bool toggle_enabled = 5;
  // "5 debts become 3 payments"; empty when not opted in.
  string summary = 6;
  string explanation = 7;
  repeated TallyTransferRow transfers = 8;
}

message TallyGroupEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    SimplifyToggled simplify_toggled = 3;
    // INTENTS, routed by the shell.
    AddExpense add_expense = 4;
    SettleUp settle_up = 5;
    ExpensePicked expense = 6;
    MemberPicked member = 7;
  }

  message Opened {
    string group_id = 1;
    string title = 2;
  }

  message Refreshed {}

  message SimplifyToggled {}

  message AddExpense {}

  message SettleUp {}

  message ExpensePicked {
    string expense_id = 1;
  }

  message MemberPicked {
    string party_id = 1;
  }
}

