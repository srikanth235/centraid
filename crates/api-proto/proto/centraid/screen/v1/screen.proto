// Screen states and events — SHELL-INTERNAL, free to change every release
// (#1020, D-1020-C4, D-1020-E3; the issue's *One protobuf schema workspace*).
//
// This package's compatibility promise is deliberately weaker than
// `centraid.core.v1`'s: `buf breaking` checks it against the PR base only, not
// against released tags, because the only consumers are the KMP shared module,
// SwiftUI and Compose — all shipped in one artifact with the core that produces
// these messages. `centraid.core.v1` is the gateway's promise to seats that
// update on their own schedule; this is not.
//
// Wave 2 landed the envelope alone as a placeholder. Wave 3 lane E filled it
// with the first screens — **Photos grid, Notes editor** and a paged list since
// deleted (#1099) — and
// `SeatState`. Everything is in ONE FILE (D-1020-E3a): `crates/api-proto`'s
// `build.rs` carries a NAMED list of every `.proto` and `tests/tree.rs` asserts
// the list and the directory agree, and both belong to lane C. One file keeps
// this change inside the screen package's own ownership boundary, which for a
// shell-internal package costs nothing.
//
// Open question 10 decides after wave 3 whether screen contracts stay protobuf
// or become Kotlin sealed classes plus SKIE, on the exit criterion written into
// the issue (lines per screen, fixture disagreements, p95 state delivery). If
// that decision goes to SKIE, THIS FILE is what goes away; nothing in
// `centraid.core.v1` moves. The line counts criterion (a) needs are in the
// receipt, measured against hand-written Kotlin data classes for the same
// three screens.
//
// ## Four laws every message here keeps
//
// 1. **A failed read is not an empty list.** Three states, never two:
//    `loading`, a `ReadFailure`, or data. Kotlin's nullable and Rust's `Result`
//    each collapse two of them, so the oneof spells all three out. v0 pinned the
//    same law from three directions — its ledger store test, the
//    `deniedPayload` contract, and "a refused read and a seat with no copy yet
//    are different screens".
// 2. **A band destination is a parameter, not a screen.** `PhotosGridState`
//    carries a destination; there is no second message per destination. And
//    `more` is a sheet, never a destination.
// 3. **A discriminated union, not a bag of optionals.** A photo state view is a
//    oneof, not `{mode, party_id?, person_name?}` (`navigation.ts:43-46`).
// 4. **An OS permission is a state, not a route.** "No `PhotoPermission` route
//    (#712): OS grant is a timeline STATE" (`navigation.ts:41-42`).

syntax = "proto3";

package centraid.screen.v1;

// One screen's finished state, ready to render. The UI thread only ever
// receives a finished state message (#1020 Execution model).
message ScreenState {
  // Which screen. `photos.grid`, `notes.editor`.
  string screen_id = 1;
  // The state, encoded by the message this package defines for `screen_id`.
  // Still `bytes` rather than a oneof: the shell transports a screen state
  // without knowing which screen it is (one `SharedFlow`, one renderer entry
  // point), and a oneof here would have to be edited by every screen lane.
  bytes state = 2;
  // Monotonic per screen instance, so a renderer can drop a state it has
  // already surpassed rather than re-rendering out of order.
  uint64 revision = 3;
}

// One event the view forwards. Swift and Compose own nothing; they render and
// forward (#1020 Execution model).
message ScreenEvent {
  string screen_id = 1;
  bytes event = 2;
}

// ---------------------------------------------------------------------------
// The read law
// ---------------------------------------------------------------------------

// WHY A READ PRODUCED NO ROWS, when it produced no rows for a reason.
//
// Absent from every screen's `data` case: data is data. This exists only for
// the middle state, and `kind` is what keeps "refused" and "no copy yet" apart
// — two different screens in v0's own words, and the distinction a nullable
// would erase.
enum ReadFailureKind {
  READ_FAILURE_KIND_UNSPECIFIED = 0;
  // The access plane said no. Its sentence, never its predicate.
  READ_FAILURE_KIND_REFUSED = 1;
  // This seat has no copy of these rows yet. A first sync, not a refusal — and
  // the screen that says so is not the screen that says "you cannot see this".
  READ_FAILURE_KIND_NO_COPY_YET = 2;
  // The core answered, and could not reach what it needed: a gateway a thin
  // seat cannot dial.
  READ_FAILURE_KIND_UNAVAILABLE = 3;
  // The device is out of disk and the feed is PARKED: the cursor and the rows
  // stay, the retry cadence stops, and freeing space resumes from the durable
  // cursor (`docs/mobile-offline.md:238`). Centraid never evicts canonical rows
  // or queued writes to manufacture space, so this is a state and not a
  // cleanup.
  READ_FAILURE_KIND_LOW_DISK_PARKED = 4;
  // The core was restarted deliberately after a panic poisoned its handle
  // (`crates/core-ffi/CONTRACT.md` clause 9).
  READ_FAILURE_KIND_CORE_RESTARTED = 5;
}

message ReadFailure {
  ReadFailureKind kind = 1;
  // AN OWNER-FACING SENTENCE. The author's words for a failed precondition,
  // the access plane's sentence for a denial. The raw predicate reaches the
  // audit trail and never a member.
  string sentence = 2;
  // Set when there is something a member can do: free space, reach the
  // gateway, wait for a first sync. Empty when there is not.
  string remedy = 3;
}

// The loading state. A message rather than a bare `bool`, so the oneof can hold
// it as a present value and a decode of an unset oneof stays distinguishable
// from "loading" — the same reason `centraid.core.v1.NullValue` is a message.
message Loading {
  // True on the FIRST load of this screen, false on a refresh over rows the
  // screen is already showing. A spinner over an empty frame and a spinner over
  // last night's rows are different screens.
  bool first_load = 1;
}

// ---------------------------------------------------------------------------
// The seat's four sentences
// ---------------------------------------------------------------------------

// What this seat can say about itself, as the desktop seat says it —
// coordinated with lane F as `centraid.screen.v1.SeatState`, one message and
// two shells (`contracts/screens/README.md`). Four facts and no fifth, because
// each answers a different question a member actually asks.
message SeatState {
  Availability availability = 1;
  Durability durability = 2;
  PendingWork pending = 3;
  Connectivity connectivity = 4;

  // "Can I use Centraid right now?"
  enum Availability {
    AVAILABILITY_UNSPECIFIED = 0;
    AVAILABILITY_READY = 1;
    // A mount is resolving. **Never a placeholder gateway id**: a mount waits
    // for a real endpoint rather than naming a file after a stand-in, because
    // the literal `"manual"` once named a file whose path moved the moment a
    // real endpoint arrived, orphaning every write queued under it
    // (`docs/mobile-offline.md:249`, census §E seam 2).
    AVAILABILITY_WAITING_FOR_MOUNT = 2;
    // The app is locked. Decrypted material is cleared and the replica is
    // unmounted; a state, not a modal over a live screen.
    AVAILABILITY_LOCKED = 3;
    // The core was poisoned and is being restarted.
    AVAILABILITY_RESTARTING = 4;
  }

  // "Is my work safe?"
  enum Durability {
    DURABILITY_UNSPECIFIED = 0;
    // Written to the gateway's authority.
    DURABILITY_AUTHORITATIVE = 1;
    // Written to this device's outbox and not yet to the gateway.
    DURABILITY_LOCAL_ONLY = 2;
    // Out of disk. The feed is parked and nothing is being written.
    DURABILITY_PARKED_LOW_DISK = 3;
  }

  // "Is anything still on its way?"
  message PendingWork {
    uint32 queued_writes = 1;
    uint32 queued_uploads = 2;
    // The oldest queued item's age in seconds, so a screen can say "since
    // yesterday" rather than a count nobody can weigh.
    uint64 oldest_queued_seconds = 3;
  }

  // "Why is it not moving?" — and the answer the platform gave, not one this
  // shell assumed from a radio.
  enum Connectivity {
    CONNECTIVITY_UNSPECIFIED = 0;
    CONNECTIVITY_ONLINE_UNMETERED = 1;
    CONNECTIVITY_ONLINE_METERED = 2;
    CONNECTIVITY_OFFLINE = 3;
    // The platform refused to say — Background App Refresh is off, or the
    // permission was never granted. Registration is observable rather than
    // assumed (`docs/mobile-offline.md:214`).
    CONNECTIVITY_UNKNOWN_PLATFORM_REFUSED = 4;
  }
}

// A money amount, as the vault holds it: minor units and a currency
// (`core_transaction.amount_minor` + `currency`).
//
// **NEVER A FLOAT AND NEVER A PRE-FORMATTED STRING.** v0's formatter divides
// minor units by 100 unconditionally and calls
// `new Intl.NumberFormat(undefined, …)` — the HOST's locale — so the same vault
// renders differently on two devices (`packages/design/src/format.ts:38`,
// `:49`; census §E8). A Kotlin or Swift port needs the minor-unit exponent for
// the currency and an explicit locale FROM THE VAULT, which is why both travel
// with the amount.
message Money {
  int64 minor = 1;
  // ISO 4217, three characters.
  string currency = 2;
  // The currency's minor-unit exponent: 2 for USD, 0 for JPY, 3 for BHD. From
  // the kit's table through the core, never guessed and never assumed to be 2.
  uint32 exponent = 3;
  // The locale the vault says to render in — BCP 47. Never the device's.
  string locale = 4;
}

// ---------------------------------------------------------------------------
// Photos grid
// ---------------------------------------------------------------------------

// THE OS GRANT, AS A STATE (law 4). No route, no modal-as-a-screen: the grid
// renders a different thing under each of these, and every one of them is a
// place a member can be.
enum MediaPermission {
  MEDIA_PERMISSION_UNSPECIFIED = 0;
  // Not asked yet. Distinct from denied: one has a button, the other has a
  // trip to Settings.
  MEDIA_PERMISSION_NOT_ASKED = 1;
  MEDIA_PERMISSION_GRANTED = 2;
  // iOS's limited selection. The grid shows what was selected and says so — it
  // is not an empty library and it is not a denial.
  MEDIA_PERMISSION_LIMITED = 3;
  MEDIA_PERMISSION_DENIED = 4;
  // A device policy refuses, and no button in this app can change it.
  MEDIA_PERMISSION_RESTRICTED = 5;
}

// The camera-roll backup, as a state.
message BackupState {
  Phase phase = 1;
  uint32 assets_remaining = 2;
  uint32 assets_transferred_this_session = 3;
  uint64 bytes_transferred_this_session = 4;
  // 5 was `transport`: which of the iroh blob transfer and the HTTPS blob door
  // carried the bytes. Both left with #1080, whose backup has one protocol, and
  // nothing set it.
  reserved 5;
  reserved "transport";
  // Why it is not running, when it is not. Never inferred from a radio: the
  // pass asks the platform for the real answer.
  string paused_reason = 6;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_IDLE = 1;
    PHASE_ENUMERATING = 2;
    PHASE_TRANSFERRING = 3;
    // Wi-Fi and charger rules are queried BEFORE EACH background item, not
    // once per pass (`NATIVE_V0.md:11-19`).
    PHASE_WAITING_FOR_POWER = 4;
    PHASE_WAITING_FOR_UNMETERED = 5;
    PHASE_PARKED_LOW_DISK = 6;
    PHASE_DONE = 7;
  }
}

// ---------------------------------------------------------------------------
// Home — the graded springboard
// ---------------------------------------------------------------------------

// HOW MUCH THIS APP HAS TO SAY, and how sure we are (#1020, wave A).
//
// FOUR states, not three, and the fourth is the point. v0's own words:
// "empty != not-loaded". A tile that read nothing because this seat has no
// copy yet is `UNKNOWN`, and only a tile whose read LANDED and returned
// nothing is `EMPTY`. Collapsing them is how a springboard tells a member
// their vault is empty when the truth is that it has not looked.
enum TileStatus {
  TILE_STATUS_UNSPECIFIED = 0;
  TILE_STATUS_LOADING = 1;
  // No replica, no grant, or a read that failed. We do not KNOW.
  TILE_STATUS_UNKNOWN = 2;
  // A landed read returned nothing. The only state that may say "empty".
  TILE_STATUS_EMPTY = 3;
  TILE_STATUS_CONTENT = 4;
}

// `SMALL` 1x1, `MEDIUM` 2x1, `LARGE` 2x2 — which FLATTENS to 2x1 on the phone's
// two-column grid. The class follows the app's BODY and never its importance: a
// mosaic needs area, prose needs measure, a figure needs neither.
enum TileSize {
  TILE_SIZE_UNSPECIFIED = 0;
  TILE_SIZE_SMALL = 1;
  TILE_SIZE_MEDIUM = 2;
  TILE_SIZE_LARGE = 3;
}

// A count a read ACTUALLY RETURNED.
//
// A message rather than a `uint32`, so its absence is a value: absent is the
// withheld glyph and never a fabricated `0`. Locker withholds its count by
// design, and a `0` there would be a lie about how many secrets a member has.
message TileCount {
  uint32 value = 1;
  // The read hit its ceiling, so the true number is at least `value`, and the
  // honest phrasing is "at least".
  bool capped = 2;
}

// What one app's tile renders. A discriminated union and not a bag of
// optionals: the bodies share no field, and a reader of `photos` must not
// be able to ask for `figure`.
message TileBody {
  // 6 was `tally`, the Tally tile's body; the app was deleted from v0 (#1099), so
  // the number and the name are never reused.
  reserved 6;
  reserved "tally";
  // 5 was `tasks`, the Tasks tile's body; Tasks folded into Agenda (#1128,
  // R-1128-7, R-1128-8), whose tile carries the due tasks, so the number and the
  // name are never reused.
  reserved 5;
  reserved "tasks";
  oneof kind {
    Photos photos = 1;
    Docs docs = 2;
    Agenda agenda = 3;
    People people = 4;
    Locker locker = 7;
    Notes notes = 8;
    // Money's body: what this month's spending came to, per currency (#1099).
    Spent money = 9;
    // Health's body: today's steps and last night's sleep (#1129).
    HealthTile health = 10;
  }

  message Photos {
    repeated Cell cells = 1;
    // The thumbnail pack is on this device. False means the mosaic's cells draw
    // as placeholders for a reason the member can act on.
    bool offline_pack = 2;

    message Cell {
      string asset_id = 1;
      // Absent when the asset exists and its bytes are not addressable yet. It
      // is STILL A CELL: dropping the row reflows ten photos as one blank under
      // a "10".
      optional string thumbnail_path = 2;
    }
  }

  message Docs {
    repeated Row rows = 1;

    message Row {
      string document_id = 1;
      string name = 2;
      // Already formatted by the core, which knows the vault's locale. Never
      // formatted in a view from a byte count.
      string size = 3;
    }
  }

  // THE NEXT OCCURRENCE, AS `agenda.upcoming` ANSWERED IT (#1046): a series
  // is one thing here, headed by its next occurrence. Every field is a
  // finished string — the core placed the occurrence in the DEVICE's zone
  // (`agenda.proto`'s zone rule) and `HomeAgendaTile` composed the words — so
  // a view draws them and parses nothing.
  message Agenda {
    string title = 1;
    // `08:15` today; `Wed 11 · 08:15` on another day; `Today · all day` or
    // `Wed 11 · all day` for a day and not a time.
    string at = 2;
    // What follows it: `then <title>`, `then nothing until the 14th`, or
    // `nothing after it`. Empty only when no event is coming up (`title` then
    // says so and `at` is empty too), the tile showing tasks alone (#1128).
    string after = 3;
    // TODAY'S DUE TASKS (#1128, R-1128-8): the open tasks due today or already
    // overdue, from `tasks.board` TODAY. Zero draws no line. Absent tasks (the
    // read did not land) are zero: a tile never claims a count it did not read.
    uint32 due_count = 4;
    // `3 due`: the count in words, composed in Kotlin. Empty when `due_count` is 0.
    string due_label = 5;
    // The first due task's title, overdue before today; empty when `due_count` is 0.
    string due_title = 6;
  }

  message People {
    repeated Face faces = 1;
    // How many more than the faces shown.
    uint32 more = 2;
    // `more` in words: "+3 more in your directory", or "That's everyone in
    // your directory" when every face is shown. A view draws it as it is.
    string more_label = 3;

    message Face {
      // `party_id`, NEVER the display name: the avatar hue is derived from this
      // so that a rename does not repaint a face the member recognises.
      string party_id = 1;
      string initials = 2;
      // THE RESOLVED HUE KEY, and not a colour: one of `packages/design`'s
      // eight party hues — `rose`, `amber`, `ochre`, `forest`, `teal`, `slate`,
      // `indigo`, `violet` — never a hex and never a CSS `var()`. The producer
      // runs the ONE port of `identity.ts` over `party_id` and whatever the
      // vault stored, so a renderer looks up an emitted colour role and never
      // turns the wheel itself; two renderers that each derived a hue would
      // agree by luck. ABSENT means the wheel could NOT name one — a stored
      // literal it does not recognise — and a renderer draws its neutral disc
      // rather than substituting a hue nobody chose.
      optional string color = 3;
    }
  }

  // Locker's body is a STATE and not a query result, which is why it always has
  // something true to say and is never an invitation to fill it.
  message Locker {
    bool locked = 1;
    // "Locked" / "Open" — the state, as a label and not a control (#1047).
    string state_label = 2;
    // What opening does, or that it relocks; never a title from inside.
    string line = 3;
  }

  // THE SHELF: the notebooks that hold notes, and the newest note at the foot.
  // A vault with no filed notes has no shelf, and draws its newest notes in
  // `recent` instead. The tile is half width, so there is no prose here: 3 was
  // `excerpt`, which the read never filled and the measure has no room for.
  message Notes {
    reserved 3;
    reserved "excerpt";
    // The newest note, its title alone at the foot under the shelf.
    string note_id = 1;
    string title = 2;
    // Up to three notebooks holding notes, in the member's own order.
    repeated Notebook notebooks = 5;
    // Only when `notebooks` is empty: the newest notes, up to three.
    repeated Recent recent = 6;

    message Notebook {
      string notebook_id = 1;
      string name = 2;
      uint32 note_count = 3;
    }

    message Recent {
      string note_id = 1;
      string title = 2;
    }
  }

  // THIS MONTH'S SPENDING, one figure per currency and nothing summed across
  // them (#1099, R-1099-13). The amounts are the core's, unchanged; the caption
  // is the machine's ("spent in October"). Named for what it holds because a
  // nested `Money` would shadow the kit's `Money` inside this message.
  message Spent {
    repeated centraid.screen.v1.Money amounts = 1;
    string caption = 2;
  }

  // TODAY'S STEPS AND LAST NIGHT'S SLEEP, as `health.today` answered them
  // (#1129). Finished words: the figure is the core's, formatted by
  // `HomeHealthTile` ("8,412"); an absent figure is an EMPTY string, never
  // "0", because a day with no row is not a day of no steps.
  message HealthTile {
    // "8,412"; EMPTY when the store gave no steps today.
    string figure = 1;
    // "steps today".
    string caption = 2;
    // "Slept 7 h 12 m"; EMPTY when there is no sleep for last night.
    string line = 3;
  }
}

message HomeTile {
  string app_id = 1;
  TileStatus status = 2;
  // ABSENT is the withheld glyph. See `TileCount`.
  TileCount count = 3;
  // The count's own words, from the app's copy leaf.
  string count_label = 4;
  TileSize size = 5;
  // `MEDIUM`, and `LARGE` flattened: full width on the two-column phone grid.
  bool wide = 6;
  // What to DO, never what is missing: the line an app with nothing in it
  // draws in its tile.
  string empty_copy = 7;
  TileBody body = 8;
  // 9 was `earns_grid`: whether the tile earned a place on the grid. Every app
  // has a tile now, empty or not (R-ONBOARD-11), so nothing is graded out.
  reserved 9;
  reserved "earns_grid";
  // WHAT A SCREEN READER SAYS FOR THE TILE: "Open People, 5 people" — the
  // app's name and the count's words, the withheld glyph never spoken.
  // `open_label` alone ("Open People") is the All apps row's.
  string accessibility_label = 10;
  string open_label = 11;
}

// Which of the three Homes this is.
enum Springboard {
  SPRINGBOARD_UNSPECIFIED = 0;
  SPRINGBOARD_LOADING = 1;
  // Every readable tile SETTLED and returned nothing. A claim about the vault,
  // which an unsettled read has not earned.
  SPRINGBOARD_FIRST_RUN = 2;
  SPRINGBOARD_CONTENT = 3;
}

// Home's health ribbon: the vault at a glance, and whether the gateway holding
// it is answering.
//
// The ONLY feedback channel on this screen — no spinner, no toast, no badge, no
// red dot. `QUIET` is deliberately ignorable; the other two earn one rule and
// one action, never a filled warning plate.
message HomeStatus {
  Tone tone = 1;
  // The ambient sentence about the route.
  string copy = 2;
  // What a member can do, when there is something. Empty when there is not.
  string action = 3;
  Destination destination = 4;

  enum Tone {
    TONE_UNSPECIFIED = 0;
    TONE_QUIET = 1;
    TONE_ATTENTION = 2;
    TONE_URGENT = 3;
  }

  enum Destination {
    DESTINATION_UNSPECIFIED = 0;
    // Not a button. A quiet signal with nowhere to go is still a true sentence.
    DESTINATION_NONE = 1;
    DESTINATION_PHONE = 2;
    DESTINATION_NOTIFICATIONS = 3;
    DESTINATION_BACKUP = 4;
  }
}

message HomeState {
  SeatState seat = 1;
  oneof content {
    Loading loading = 2;
    ReadFailure failure = 3;
    HomeData data = 4;
  }
  // 5 was `all_apps_sheet_open`, the All apps sheet. It is gone
  // (R-ONBOARD-11): every app is a tile on Home.
  reserved 5;
  reserved "all_apps_sheet_open";
  // The vault lockup, true on every route — see `VaultLockup`.
  VaultLockup vault = 6;
  // EVERY VAULT THIS DEVICE HOLDS, the active one included.
  //
  // A switcher that listed only the OTHERS would be a control that never shows
  // a member where they already are, and the sheet's tick — "this is the one
  // you are reading" — is the fact the member came to check. The order is the
  // shell's listing order and is not re-sorted here: a roster that reordered
  // itself as vaults were added would move the row under a thumb.
  repeated VaultLockup vaults = 7;
  // The vault switcher is a SHEET, exactly as the all-apps listing is: it is
  // not a second Home, it gets no route, and it survives no navigation.
  bool vault_sheet_open = 8;
  // THE BACKUP LINE (#1080, seam contract A11): the foreground vault's, as
  // `BackupLines` finished it from the core's `backup_status`. The shell told
  // Home it (`BackupLineChanged`), so a reload carries it.
  BackupLine backup_line = 9;
  // `founded_today`, which only settled the sample line's claim on the notice
  // slot; retired with the sample vault (docs/decisions.md, "Onboarding without
  // sample data").
  reserved 10;
  reserved "founded_today";
}

message HomeData {
  // The whole springboard's verdict, decided by the machine so that two shells
  // cannot disagree about which Home this is.
  Springboard springboard = 1;
  // In `SPRINGBOARD_ORDER`, which is the hand-off's tile list and NOT the
  // catalogue's order. Freshness decides what is IN a tile; it must never
  // decide where the tile sits.
  repeated HomeTile tiles = 2;
  // `first_moves`, Home's "Fill this out" nudges: retired, because an empty
  // app is a tile of its own and offers its own import or add, and the
  // camera roll comes in on its own (docs/decisions.md, R-ONBOARD-8).
  reserved 3;
  reserved "first_moves";
  // 4 was `things`, Home's "11 things" foot. It is gone (R-ONBOARD-11): it
  // summed the counts every tile already shows.
  reserved 4;
  reserved "things";
  HomeStatus status = 5;
  // EVERY tile is `UNKNOWN` — no replica, no grant, or every read failed. The
  // whole springboard's verdict and not one app's, because demoting one
  // unreadable tile beside readable neighbours is right and demoting them ALL
  // leaves a launcher with no tiles. The grid is shown anyway, precisely so the
  // screen does not claim the vault is empty.
  bool every_tile_unreadable = 6;
  // THE PACKED GRID, DECIDED HERE SO THE TWO SHELLS CANNOT PACK IT DIFFERENTLY.
  //
  // Mixed sizes leave a HOLE whenever a 1x1 is followed by a full-width tile,
  // and the fix is to pull the next small forward past the wides between them —
  // never to resize, drop or demote a tile to make a row come out even. That is
  // an ORDERING decision over `wide`, which is to say a decision, which is to
  // say the machine's.
  //
  // The first build of wave A left it to the renderers and they disagreed
  // immediately: Compose's `LazyVerticalGrid` honours a span and SwiftUI's
  // `LazyVGrid` silently ignores `.gridCellColumns`, so one shell drew Photos
  // full width and the other drew it at a half. A row here carries APP IDS and
  // not tiles, so the tile itself is still stated exactly once.
  repeated TileRow grid_rows = 7;
  // `sample_notice`, the sample line's claim on the notice slot; retired with
  // the sample vault (docs/decisions.md, "Onboarding without sample data"), so
  // the slot is the backup line's alone.
  reserved 9;
  reserved "sample_notice";
  // 10 was `idle_app_ids`, the apps the grid did not draw. Every app has a
  // tile (R-ONBOARD-11), so there are none.
  reserved 10;
  reserved "idle_app_ids";
}

// One drawn row of the springboard: the app ids in it, left to right.
message TileRow {
  repeated string app_ids = 1;
}

// THE TWO FACTS TRUE ON EVERY ROUTE: which vault, and how it stands with the
// gateway behind it.
//
// No greeting. The springboard was the only route in v0 that drew them, and
// inside an app the member lost both — which vault they were reading, and
// whether it was reaching its gateway — so the lockup became chrome an app can
// mount. It hangs off the STATE rather than off `HomeData` for the same reason
// the sheet flag does: it is true while Home is loading and true while Home has
// failed, and a lockup that vanished when a read failed would take the vault's
// name away at the moment a member most needs to know which vault they are
// looking at.
//
// **THE SECOND FACT IS THE VAULT'S, NEVER A GATEWAY'S NAME (#1025).** This
// carried `gateway_name` for two waves and nothing on any layer ever wrote it:
// `grep -rn gateway_name crates` answered nothing, so both shells drew "not
// connected to a gateway" over a device that had paired, synced and was holding
// its rows. It was not a missing assignment. Nothing in the pairing exchange
// names a gateway — `PairOk` answers a vault id, a vault name and an address —
// and #1025 settled why: a device pairs with a VAULT, one connection and one
// replica per vault, and a gateway is not a noun the device has. Two vaults
// behind one gateway is a coincidence a device never acts on and must never
// surface. So the field was a name that could not exist, and [State] is the
// fact that can: how THIS vault stands on this device.
//
// **AND THE SECOND FACT IS A STATE, NOT AN ACT (#1025 S7-9).** The enum that
// replaced `gateway_name` was `Link`, and it in turn had a hole: it modelled
// PAIRING as one of a vault's states. A device that holds a vault has already
// paired — that is what holding one means — so `LINK_UNPAIRED` described the
// DEVICE (zero vaults held, show the pair flow) and could never be true of a
// row in the switcher. [State] is the three things that can be true of a
// holding, and every one of them is derived rather than stored.
message VaultLockup {
  // THE VAULT'S OWN ID, which is what a switch names — never a path.
  //
  // Where a vault's bytes sit is the shell's business: one shell keeps them in
  // an iOS container it is handed at launch and the other in an Android files
  // dir, and a screen state that carried either would be a screen state with a
  // filesystem in it. The shell resolves an id to a location; the machine only
  // ever says WHICH vault.
  //
  // Empty on a lockup the shell has not yet identified — a vault whose file
  // would not open, say — and such a vault cannot be switched to, which is
  // correct: the switch would fail at the same door the identification did.
  string vault_id = 5;
  // Empty is a REAL STATE, not a missing value: a member with no vault yet gets
  // "No vault yet" rather than a blank lockup.
  string vault_name = 1;
  // The vault's own identity hue as `#rrggbb`, or empty for plain ink. The
  // shells wash it behind the mark exactly as an app chip is washed.
  string color = 3;
  // How this vault stands on this device. Said IN PLACE, under the vault's
  // name, never as a banner: none of these is an incident.
  State state = 7;
  // ORIGINALS THIS DEVICE'S OWN TRANSFER RULE IS HOLDING BACK (#1025 S4,
  // D-1025-S7-61).
  //
  // The last pass's `withheld`, carried onto the lockup so the header can say
  // it in place. **A grid of thumbnails with no full-size files is a DECISION
  // and not a failure**, and a line that does not say so is how a working byte
  // plane looks broken: the member set the rule, and the number is the only
  // thing on the screen that connects the two.
  //
  // A MODIFIER on the state line and not a fourth `State`. The vault is online
  // or offline independently of it — a device can be perfectly current and
  // still be waiting for Wi-Fi to bring the photographs.
  uint32 originals_withheld = 8;

  // WHAT THIS PHONE IS STILL HOLDING FOR A VAULT THAT MOVED (#1029 F1, W5).
  //
  // "N changes since <date>", or empty for a vault that has not moved. It is a
  // SENTENCE and not a count, because the number alone is ambiguous in the one
  // direction that matters: a member reading "12" has no way to tell twelve
  // changes kept from twelve changes lost, and nothing was lost — `Shelf.freeze`
  // deletes nothing and the phone keeps every row it had.
  //
  // **THE SLOT IS HERE SO THERE IS ONE PLACE.** `HomeBridge.frozenLine` was a
  // door beside the roster, with a comment saying the line "has no slot on
  // `VaultLockup` to ride in" — which made the switcher's row and the header's
  // second line two renderings of one fact taken from two sources, exactly the
  // shape `gateway_name` died of. The line rides the lockup with the state it
  // belongs to.
  string frozen_line = 9;

  // `sample`, the separate sample vault's mark, and `founded_at`, which only
  // settled the sample line's claim on Home's notice slot; both retired with
  // the sample vault (docs/decisions.md, "Onboarding without sample data").
  // `example`, which marked the "See an example" preview's lockup, retired
  // with the preview (R-ONBOARD-12).
  reserved 10, 11, 12;
  reserved "sample", "founded_at", "example";

  // `gateway_name`, which no layer could ever write; `offline`, which only
  // meant something beside it; and `link`, whose enum made pairing a STATE of
  // a vault. See the message header and [State].
  reserved 2, 4, 6;
  reserved "gateway_name", "offline", "link";

  // HOW THIS VAULT STANDS ON THIS DEVICE — AND ON A PHONE THAT IS THE VAULT
  // THERE ARE TWO CASES (#1025 S7-9 superseding D-1025-S7-8's `Link`; trimmed
  // by #1029 W5, hand-off 3).
  //
  // **Pairing is an ACTION, not a state.** `Link` had five cases and two of
  // them were not states of a vault at all. `LINK_UNPAIRED` was a state of the
  // DEVICE — a device holding zero vaults shows the pair flow, and a vault
  // that is held was by definition admitted — so a vault could never truthfully
  // be "unpaired" and the case only ever fired as a guess.
  //
  // **AND THEN THE GATEWAY WENT.** `STATE_SYNCING` and `STATE_OFFLINE` were
  // both facts about a PASS: one said a copy was still coming, the other that
  // the last pass had not reached the gateway. #1029 §1 deletes the sync plane,
  // the replica plane and the pass — the phone IS the vault — so neither could
  // be reached by any layer, and `Shelf.Holding.state` said so in a comment
  // while returning the one honest value. An enum whose values are unreachable
  // is an enum that invites a shell to render a guess; both are RESERVED, by
  // number and by name, so a `buf breaking` WIRE_JSON promise holds and no
  // later value comes back wearing either spelling.
  //
  // "Behind N" is a MODIFIER and not a case, and so is `originals_withheld`.
  enum State {
    // The proto zero, and NEVER EMITTED. Every holding has one of the two
    // below the moment the shelf knows about it, and a shell that receives
    // this is looking at a lockup nobody filled in — it draws no line rather
    // than a claim.
    STATE_UNSPECIFIED = 0;
    // THE VAULT IS HERE AND IT IS WHOLE. A file on this device whose core
    // opened — which includes a RESTING holding, whose handle was closed to
    // give the OS its memory back and whose vault did not change.
    //
    // A PAST-TENSE FACT, and the wording must stay past tense: nothing here
    // probes anything, so a header that said "connected" would promise a live
    // link this state has not checked.
    STATE_ONLINE = 2;
    // THIS VAULT MOVED TO ANOTHER PHONE, AND THIS ONE IS COOPERATING
    // (#1029 F1, W5). Writes refuse, reads do not, the unacked spool is shown
    // in `frozen_line` and KEPT.
    //
    // A STATE and not an incident, drawn in place under the vault's name like
    // the others. Both phones hold the same seed, so no lease can DECIDE who
    // owns a vault; this phone stopped writing because that is the cooperative
    // thing to do. There is no way out of it on this enum, because taking a
    // vault back is a deliberate act on the phone taking it.
    STATE_FROZEN = 4;

    // `STATE_SYNCING` (1) and `STATE_OFFLINE` (3) were facts about a PASS, and
    // #1029 §1 deletes the pass. See the enum header.
    reserved 1, 3;
    reserved "STATE_SYNCING", "STATE_OFFLINE";
  }
}

message HomeEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    TileArrived tile = 3;
    TileRefused tile_refused = 4;
    StatusChanged status = 5;
    SeatChanged seat_changed = 7;
    MovePicked move_picked = 8;
    VaultChanged vault_changed = 9;
    VaultSwitchRequested vault_switch = 10;
    VaultPicked vault_picked = 12;
    RosterChanged roster_changed = 13;
    BackupLineChanged backup_line = 14;
  }

  // The foreground vault's backup line moved: a pass ended, the foreground
  // switched, or the vault froze. See `HomeState.backup_line`.
  message BackupLineChanged {
    BackupLine line = 1;
  }

  // 6 was `all_apps`, the All apps sheet's toggle; gone with the sheet.
  reserved 6;
  reserved "all_apps";

  // `FoundingDayKnown`, which told Home whether the vault in front was founded
  // today for the sample line; retired with the sample vault.
  reserved 15;
  reserved "founding_day";

  // `VaultsListed`, the one-shot survey. See `RosterChanged`.
  reserved 11;
  reserved "vaults_listed";

  // THE SHELF PUBLISHED ITS HOLDINGS (#1025 S7-9).
  //
  // Sent whenever MEMBERSHIP changes (a vault admitted, a vault forgotten) or
  // any holding's `State` moves — which makes the switcher's rows and the
  // header's second line two renderings of ONE stream rather than two things
  // updated by two mechanisms that can disagree. That disagreement is what
  // `VaultsListed` was: a one-shot survey taken at launch and never taken
  // again, so a vault admitted afterwards was invisible until relaunch and a
  // vault that went offline kept whatever the survey guessed.
  //
  // The ACTIVE vault is in here too, exactly as it is in `HomeState.vaults`,
  // and its row carries the same `State` the header draws. The header still
  // gets `VaultChanged` separately, because a switch is a different event from
  // a roster moving under it.
  message RosterChanged {
    repeated VaultLockup vaults = 1;
  }

  // The active vault, or the gateway behind it, changed. A vault switch
  // re-points the whole app, so Home reloads: the tiles it is holding belong to
  // the vault the member just left.
  message VaultChanged {
    VaultLockup vault = 1;
  }

  // The member pressed the lockup. THE MARK IS THE SWITCH — there is no
  // separate control beside it, because a lockup that is not pressable and a
  // chevron that is are two affordances for one act.
  message VaultSwitchRequested {}

  // The member chose one from the sheet. The SHEET closes here and the vault
  // changes later — re-pointing is I/O, and `VaultChanged` is what says it
  // landed. A reducer that swapped the lockup on the tap would name a vault
  // that was not open yet.
  message VaultPicked {
    string vault_id = 1;
  }

  message Opened {}

  message Refreshed {}

  // ONE APP'S tile landed. Home fans out one read per app and they arrive
  // independently, so a tile is an event and not a field of one big answer: a
  // Home that waited for the slowest app would be a Home nobody sees.
  message TileArrived {
    string app_id = 1;
    TileStatus status = 2;
    TileCount count = 3;
    string count_label = 4;
    TileBody body = 5;
  }

  // One app's read failed. `UNKNOWN`, never `EMPTY`.
  message TileRefused {
    string app_id = 1;
    ReadFailure failure = 2;
  }

  message StatusChanged {
    HomeStatus status = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message MovePicked {
    string move_id = 1;
  }
}

// ---------------------------------------------------------------------------
// Home's search (R-CHROME-6)
// ---------------------------------------------------------------------------
//
// `home.search`: the full screen Home's search bar pushes. One field over
// every app, Locker included (`vault_search`, the powerbox's loader asked from
// Home), the answer GROUPED BY THE APP each row opens in, the groups in
// Home's tile order. A tap opens the row in its own app, through the router a
// chat card already uses (`target`); Cancel pops back to Home and clears.
//
// VIEWS DECIDE NOTHING (R-1047-K1): every word, the group order, the counts,
// the kind column and where a row opens arrive here finished.

message HomeSearchChrome {
  // The field's placeholder, which the bar on Home reads too.
  string placeholder = 1;
  // The quiet scope beside the field: "All apps".
  string scope_label = 2;
  // The text button that pops back to Home.
  string cancel = 3;
  // The field's close key, spoken.
  string close_label = 4;
  string loading = 5;
  string retry = 6;
  // The page's name, which a page pushed from it says on its back control.
  string title = 7;
}

// THE FIELD IS EMPTY: what search reaches, and this session's searches.
message HomeSearchResting {
  // One line: what a search reaches.
  string note = 1;
  // "Recent", over `suggestions`; empty when there are none.
  string suggestions_label = 2;
  // THIS SESSION'S searches, newest first, a handful at most. Never
  // persisted and never read from the vault: a suggestion the member did not
  // type is the vault talking about itself.
  repeated string suggestions = 3;
}

message HomeSearchRow {
  // The index's entity (`knowledge.note`) and the row's own id.
  string entity = 1;
  string id = 2;
  string app_id = 3;
  // What the row IS, in the soft fixed column: "Note", "Event".
  string kind_label = 4;
  string title = 5;
  // "Note, Cabin packing".
  string accessibility_label = 6;
  // WHERE A TAP GOES: the reference a chat card carries (`ChatCard`), so the
  // shell's one router for a row reference opens it — never a second router.
  ChatCard target = 7;
}

// One app's rows, headed by its hue dot, its name and its count.
message HomeSearchGroup {
  // The app's id: the hue a shell draws the dot in, as a Home tile's.
  string app_id = 1;
  // The app's name, as the catalogue spells it.
  string label = 2;
  // Rows and containers together.
  uint32 count = 3;
  // "Notes, 2 results".
  string accessibility_label = 4;
  repeated HomeSearchRow rows = 5;
  // THE APP'S CONTAINERS whose name matched (#1097), drawn before its rows.
  repeated SearchContainer containers = 6;
}

message HomeSearchData {
  // In Home's tile order (`SpringboardPolicy.SPRINGBOARD_ORDER`).
  repeated HomeSearchGroup groups = 1;
  // Set when nothing matched the term: the one sentence. The way on is the Ask
  // row, `HomeSearchState.field.ask_row`, drawn under the groups or this sentence.
  EmptyState empty = 2;
  reserved 3;
  reserved "ask_question";
}

message HomeSearchState {
  SeatState seat = 1;
  // The kit's field. `answered_term` is the term the rows on screen answer.
  SearchField field = 2;
  HomeSearchChrome chrome = 3;
  oneof content {
    HomeSearchResting resting = 4;
    Loading loading = 5;
    ReadFailure failure = 6;
    Denied denied = 7;
    HomeSearchData data = 8;
  }
  // This session's searches, newest first — kept across Cancel, drawn only
  // by `resting`.
  repeated string recent = 9;
  // THE SHELL HAS A CHAT TAB (#1097, R-1097-24), as `Opened.chat_tab` said when
  // the search opened. Only then does an answer draw the `chat` group (the
  // member's conversations); without a Chat tab a chat hit would open nothing.
  bool chat_tab = 10;
}

message HomeSearchEvent {
  oneof kind {
    Opened opened = 1;
    TermChanged term = 2;
    SuggestionPicked suggestion = 3;
    // INTENT: the shell opens `row.target` in its app; the machine records the
    // term as a recent search.
    RowPicked row = 4;
    // The keyboard's search key: the term is recorded as a recent search.
    Submitted submitted = 5;
    // Pops back to Home; the field clears (a closed search keeps no term).
    Cancelled cancelled = 6;
    DataArrived data = 7;
    ReadRefused refused = 8;
    Denied denied = 9;
    SeatChanged seat_changed = 10;
    Refreshed refreshed = 11;
    // Another vault came to the front: its recent searches and results go
    // with the vault they were typed in.
    VaultChanged vault_changed = 12;
    // INTENT: the Ask row. The shell switches to the Chat tab and sends
    // `field.ask_row`; the machine records the term as a recent search.
    Asked asked = 13;
    // INTENT: the shell opens `container.target` in its app (#1097); the
    // machine records the term as a recent search, as it does for a row.
    ContainerPicked container = 14;
  }

  message Opened {
    // This shell has a Chat tab (iOS today; Android has none). Sent by the shell
    // beside the search it opens, never guessed by a view.
    bool chat_tab = 1;
  }
  message VaultChanged {}
  message Asked {}

  message TermChanged {
    string term = 1;
  }

  message SuggestionPicked {
    string term = 1;
  }

  message RowPicked {
    HomeSearchRow row = 1;
  }

  message Submitted {}

  message Cancelled {}

  // The answer, and the term it answers: an answer for a term the member has
  // since changed is dropped (latest wins).
  message DataArrived {
    HomeSearchData data = 1;
    string term = 2;
    // The answer's `corrected` (EMPTY for an exact answer).
    string corrected = 3;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message Refreshed {}

  message ContainerPicked {
    SearchContainer container = 1;
  }
}

// ---------------------------------------------------------------------------
// Photos: the rest of the miniapp
// ---------------------------------------------------------------------------
//
// v0 shipped FOURTEEN photos routes (`navigation.ts`, `PhotosStackParamList`).
// This package declares NINE screens for them, and the seven that collapsed did
// so under law 2 — *a band destination is a parameter, not a screen* — read one
// step further than wave 3 read it.
//
// `PhotoStateView`, `AlbumDetail` and `PlaceDetail` are
// **the library under a predicate**. Each one is a page of `photo` in
// `taken_at DESC` order with a different `WHERE`, drawing the same
// `PhotoCell` with the same held states and the same download arrow. v0 wrote
// four screens for them (a memory's members were the fourth) and they drifted: `AlbumDetail.tsx` grew a selection
// mode the state views never got, `PlaceDetail.tsx` its own empty sentence, and
// `PhotoStateView`'s trash a countdown none of the others could show. One
// message with a `Shelf` oneof is the same doctrine a destination parameter
// keeps for a band's places, and it is why there is no `AlbumState`.
//
// What did NOT collapse, and why each is its own message:
//
// - **`PhotoLightboxState`** — one asset, not a page. Its content is a detail
//   and not a cell, it owns chrome visibility, and its events are verbs.
// - **`PhotosCollectionsState`** — a list of SHELVES, not of assets.
// - **`PhotosSearchState`** — a query and its hits; the resting state is a
//   third thing that is neither.
// - **`PlacesState`** — places and their counts. Cards and the map are one
//   screen with a `Presentation` parameter, because v0's `PlacesView` and
//   `PlacesMap` read the same rows and differed only in how they drew them.
// - **`DuplicatesState`** / **`DuplicateReviewState`** — a shelf of clusters,
//   and one cluster with a keep decision. Two, for the reason v0 gave: listing
//   clusters and choosing within one are different jobs with different writes.
// - **`PhotoPickerState`** — a grid with a picked set and a destination album.
//   Not a shelf: the picked set is the screen's own state (§10) and a shelf
//   that could be picked from would carry it on every other surface too.

// ---------------------------------------------------------------------------
// The album choice sheet — "Add to album", wherever it is offered
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// The lightbox
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Collections — the band's second destination
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Search — the band's third destination
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Places
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Duplicates
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// The picker
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Photos: the editor — crop, rotate, straighten, flip (#1029, photos port)
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// --- Kit ---
// ---------------------------------------------------------------------------
//
// THE SHARED VALUE TYPES EVERY APP SCREEN IS BUILT FROM (the five-app port's
// kit, K1). Owned by the kit lane alone: an app lane appends its own section
// and never edits this one. Each is a small value type with finished strings,
// so the four laws above stay readable in each screen's OWN state message —
// the kit shares the parts and never the whole (`ScreenState.state` stays
// `bytes` for the reason it gives).
//
// `dev.centraid.shared.kit` in `mobile/shared` owns the transitions over these;
// SwiftUI and Compose draw them with one primitive each.

// THE VAULT WOULD NOT LET THIS APP READ — a state, not an error (law 1's
// fourth shape where a screen has one). Finished strings; `receipt` names what
// was asked and refused, so a member can find the grant.
message Denied {
  string title = 1;
  string body = 2;
  string receipt = 3;
}

// A list with nothing in it, said once: one sentence and at most one action
// (DESIGN.md's copy table). `action_label` empty means no action; the action
// itself is the screen's own event.
message EmptyState {
  string headline = 1;
  string body = 2;
  string action_label = 3;
  // `offers_example`, which put "See an example" under an app's day-one
  // empty state, retired with the preview (R-ONBOARD-12).
  reserved 4;
  reserved "offers_example";
  // WHERE THE PHONE ALREADY HOLDS THIS APP'S DATA, on an app's day-one empty
  // state only. A shell that can read that source draws its import as the
  // empty state's action in place of `action_label` — asked here, at the point
  // of use, never as an up-front permission wall — and a shell that cannot
  // draws `action_label` as before. The app's own add stays in its header.
  ImportSource import_source = 5;
}

// A SOURCE ON THE PHONE ITSELF that an app's day-one empty state can import
// from in one tap (docs/decisions.md, "Onboarding without sample data"). The
// OS asks its own permission when the member taps it, never before.
enum ImportSource {
  IMPORT_SOURCE_UNSPECIFIED = 0;
  // The phone's contacts, into People: a person per contact, with its phone
  // numbers, email addresses and birthday.
  IMPORT_SOURCE_CONTACTS = 1;
  // The phone's calendars the member writes to, into Agenda: each event from
  // a week back to two months on, timed or all-day, free or busy as the
  // calendar holds it. Subscribed and birthday calendars are not read.
  IMPORT_SOURCE_CALENDAR = 2;
  // The phone's open reminders, into Tasks: a task per reminder, with its due
  // day and notes. iOS has a system source; Android has none, so its shell
  // draws the app's own action.
  IMPORT_SOURCE_REMINDERS = 3;
}

// Search opens a field on the current surface; it is never a destination.
// `answered_term` is the term the rows on screen answer, so an answer for a
// term the member has since changed is recognisably stale. Closing clears both.
// `corrected` is the words the rows answer when the core corrected a typo in
// `term` (#1097); EMPTY for an exact answer. The shell draws it as "Showing
// results for <corrected>" under the field; a new term, a close, or an answer
// that is not the current one clears it.
//
// `containers` are the notebooks, projects and Docs folders whose
// NAME the answer found (#1097, R-1097-19), drawn above the result rows by the
// one container row each shell has. They are set under `corrected`'s rule: by an
// answer that is still the current one for a term that is not blank, and
// cleared by a new term and a close; a stale answer never sets them.
//
// `ask_row` is THE ASK ROW AT THE FOOT OF THE ANSWER (#1097, R-1097-28, #1135):
// set by an answer that is still the current one for a term that is not blank,
// whether or not anything matched, and ONLY for an app that offers Ask (the
// chat drawer's search and Locker's do not). Absent means no Ask: a new term, a
// close, a denial and a stale answer clear it. Locker never sets it (R-1097-29):
// its search term can be a secret, and Ask would write it into a chat thread
// and the chat index. The shell draws the row only where it has a Chat tab
// (R-1097-30) and hands the whole `SearchAsk` to its router, never a string the
// view built.
message SearchField {
  reserved 6;
  reserved "ask";
  bool open = 1;
  string term = 2;
  string answered_term = 3;
  string corrected = 4;
  repeated SearchContainer containers = 5;
  SearchAsk ask_row = 7;
}

// THE ONE ASK A SEARCH OFFERS (#1135), finished by `SearchLaw` so every app reads
// it the same way: `label` is the row's words ("Ask about “x”"), `question` is
// what the chat is sent ("Find x"), and `scope` is the chat scope to open it in,
// the id of the app the member searched from (`agenda`, `notes`, ...), or EMPTY
// for Home's, which asks the assistant across every app.
message SearchAsk {
  string label = 1;
  string question = 2;
  string scope = 3;
}

// A CONTAINER AS A SEARCH RESULT (#1097, R-1097-19..21): one notebook, album,
// project or Docs folder, finished by `SearchContainers` so Home's
// search and the three owning apps' own searches draw the same row and open it
// through the one router a row reference has.
message SearchContainer {
  // The index's entity kind (`notebook`, `album`, `project`, `folder`) and the
  // row's own id.
  string entity = 1;
  string id = 2;
  // The app it opens in: `notes`, `photos`, `tasks`, `docs`.
  string app_id = 3;
  // What it IS, in a word: "Notebook", "Album", "Project", "Group", "Folder".
  string kind_label = 4;
  string title = 5;
  // The kit's glyph for that kind (`Book`, `Image`, `List`, `Users`, `Folder`).
  string icon_key = 6;
  // "Notebook, Cabin".
  string accessibility_label = 7;
  // WHERE A TAP GOES: the reference a chat card carries (`ChatCard`), so the
  // shell's one row router opens it.
  ChatCard target = 8;
}

// ONE WRITE IN FLIGHT ON A DETAIL SCREEN. A refused write keeps the content;
// the sentence lands here, never in `content`.
message WriteState {
  Phase phase = 1;
  optional ReadFailure failure = 2;
  // The key the in-flight (or last) write was submitted under. A settle with
  // another key is someone else's answer and is ignored.
  string invoke_key = 3;
  // THE SENTENCE A REFUSED WRITE LEFT BEHIND, and empty in every other phase —
  // also when the core refused and said nothing. "Is this write refused, and
  // what do I say" was decided at twenty-three call sites in two shells, each
  // reading `phase` and `failure`; it is the write law's to say, once, when it
  // settles. A shell draws it where the member is looking and decides nothing.
  string refusal = 4;
  // THE WRITE WAS REFUSED, said once by the write law with every phase. A
  // refusal the core gave no sentence for still is one, so `refusal` cannot
  // say it alone; a shell reads this, never `phase`.
  bool refused = 5;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_IDLE = 1;
    PHASE_IN_FLIGHT = 2;
    PHASE_COMMITTED = 3;
    PHASE_REFUSED = 4;
  }
}

// What a write's answer says, as every kit screen's settle event carries it.
message WriteSettled {
  string invoke_key = 1;
  bool committed = 2;
  // The core's sentence when it gave one; absent when it said nothing.
  optional ReadFailure failure = 3;
}

// AN EDITOR THAT SAVES AS THE MEMBER WRITES (#1015 D3: close = done).
//
// `edit_seq` counts edits; `saved_seq` is the last edit the vault committed;
// `saving_seq` is the edit in flight. Unsaved words exist exactly when
// `edit_seq > saved_seq`, and a change arriving from the vault while they do
// sets `remote_changed` instead of replacing them. There is no vault-side
// revision check: the last save on this phone wins.
message Autosave {
  Phase phase = 1;
  uint64 edit_seq = 2;
  uint64 saved_seq = 3;
  string base_revision_id = 4;
  optional ReadFailure failure = 5;
  bool remote_changed = 6;
  uint64 saving_seq = 7;
  // The key the save in flight was submitted under, one per `edit_seq`.
  string invoke_key = 8;
  // THE STATUS LINE'S WORDS (#1047): "Saved", "Edited", "Saving…", the
  // refusal's own sentence or "Not saved", "Changed on another device" — set
  // by the kit's law with every phase, so no shell spells them. Empty before
  // the law has written a phase.
  string label = 9;
  // THE SAVE WAS REFUSED, set by the kit's law with every phase and `label`:
  // the line inks `net` and an editor stops concealing on it. A shell reads
  // this, never `phase`.
  bool refused = 10;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_CLEAN = 1;
    PHASE_DIRTY = 2;
    PHASE_SAVING = 3;
    PHASE_SAVED = 4;
    PHASE_REFUSED = 5;
    // Kept for the stale-base compare a later slice adds; nothing reaches it.
    PHASE_CONFLICT = 6;
  }
}

// A decision the member confirms. Full sentences, because only a destructive
// confirm earns them (DESIGN.md); `destructive` draws the outlined `net` action.
message Confirm {
  string title = 1;
  string body = 2;
  string confirm_label = 3;
  bool destructive = 4;
}

// A row's status as a finished label and a tone. `seam` is "not yet", `net`
// is owe/leaves (DESIGN.md).
message StatusChip {
  string label = 1;
  Tone tone = 2;

  enum Tone {
    TONE_UNSPECIFIED = 0;
    TONE_NEUTRAL = 1;
    TONE_SEAM = 2;
    TONE_NET = 3;
    TONE_WARNING = 4;
  }
}

// The simple list row: search hits, notebooks, projects, settings-like rows.
// A row whose fields carry meaning (`AgendaEventRow`) stays the
// app's own and maps onto the same native primitive in the view.
message ListRow {
  string id = 1;
  string title = 2;
  string meta = 3;
  string trailing = 4;
  // In draw order; a row draws every one (People's "Overdue" and "Birthday ·
  // in 3 days" side by side). Empty draws none.
  repeated StatusChip chips = 5;
  string hue_key = 6;
  string accessibility_label = 7;
  bool dimmed = 8;
  bool pending = 9;
  // How `trailing` is inked: NEUTRAL is ink, NET is owe/leaves (DESIGN.md).
  // UNSPECIFIED is ink too, so a row with a plain count sets nothing.
  StatusChip.Tone trailing_tone = 10;
}

// THE ONE STATUS LINE (DESIGN.md: no toast). One clause, at most one verb.
// A screen carries it where it says what a write did — "Task done" with
// Undo — and `action_label` empty is a line with no verb. What the verb does
// is the screen's own event (`StatusActed`).
message StatusLine {
  string sentence = 1;
  // "Undo", or empty.
  string action_label = 2;
  // The vault refused a write: the sentence is the core's.
  bool refused = 3;
}

// A section head: a title, an optional count and a text verb.
message SectionHead {
  string title = 1;
  optional uint32 count = 2;
  string verb_label = 3;
}

message TrashRow {
  string id = 1;
  string title = 2;
  string meta = 3;
  // Empty when the app has no destroy path: then there is no "Delete forever".
  string purge_label = 4;
  string icon_key = 5;
  // "Restore": every app can restore what it trashed.
  string restore_label = 6;
}

// ONE TRASH SCREEN FOR EVERY APP (law 2: the app is a parameter). #1015 D1:
// Empty trash everywhere an app can destroy; an app that cannot (Docs today)
// offers restore only, and says nothing it cannot do.
message TrashListState {
  SeatState seat = 1;
  string app_id = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    Denied denied = 5;
    TrashListData data = 6;
  }
  // A first page is in flight over rows the screen keeps showing.
  bool first_page_pending = 7;
  WriteState write = 8;
  // The confirm on screen, and what it is asking about.
  optional Confirm confirm = 9;
  oneof asking {
    string purge_id = 10;
    bool empty_all = 11;
  }
  uint32 purge_window_days = 12;
  // "Trash", and the back control's words: the app the trash belongs to
  // ("Notes"), because the page was pushed from it.
  string title = 13;
  string back_label = 14;
}

message TrashListData {
  repeated TrashRow rows = 1;
  optional string next_cursor = 2;
  EmptyState empty = 3;
  // Empty when the app cannot empty its trash.
  string empty_label = 4;
}

message TrashListEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    NextPageRequested next_page = 3;
    DataArrived data = 4;
    ReadRefused refused = 5;
    Denied denied = 6;
    RowsChanged rows_changed = 7;
    SeatChanged seat_changed = 8;
    RestoreTapped restore = 9;
    PurgeTapped purge = 10;
    EmptyTapped empty = 11;
    Confirmed confirmed = 12;
    Dismissed dismissed = 13;
    WriteSettled write_settled = 14;
  }

  message Opened {}

  message Refreshed {}

  message NextPageRequested {}

  message DataArrived {
    TrashListData data = 1;
    // The cursor this page answered: empty for a first page. See
    // `PhotosGridEvent.DataArrived.answered_cursor`.
    optional string answered_cursor = 2;
  }

  message ReadRefused {
    ReadFailure failure = 1;
  }

  message RowsChanged {
    repeated string ids = 1;
  }

  message SeatChanged {
    SeatState seat = 1;
  }

  message RestoreTapped {
    string id = 1;
  }

  message PurgeTapped {
    string id = 1;
  }

  message EmptyTapped {}

  message Confirmed {}

  message Dismissed {}
}

// ---------------------------------------------------------------------------
// --- The 24 words ---
// ---------------------------------------------------------------------------
//
// Two screens over one set of words (#1047 E1): MAKING A VAULT, which mints
// them, shows them once and checks three, and ENTERING THEM, which restores
// this member's vaults onto a fresh phone or gives this phone's vaults their
// key back (Locker's "needs your 24 words" wall). The words are minted,
// judged and turned into a seed by the core (`phone.proto`'s
// `PhraseRequest`); the shared machines own every phase and every word a
// member reads, and a view draws and forwards.
//
// THREE PLATFORM DUTIES ARE THE VIEW'S, because only a view can do them:
//
// 1. While `secure` is set the screen is shielded from capture — Android
//    `WindowManager.LayoutParams.FLAG_SECURE` on the window (screenshots,
//    screen recording and the recents thumbnail), iOS the secure-field
//    screenshot shield plus a cover drawn when the scene resigns active (the
//    app-switcher snapshot).
// 2. A word is never put on the clipboard: no copy control, no long-press
//    copy on a shown word, and no paste target that reads the clipboard.
// 3. Every word-entry field turns off autocorrect, autocapitalisation,
//    suggestions and keyboard learning — iOS `.autocorrectionDisabled()`,
//    `.textInputAutocapitalization(.never)`, `.keyboardType(.asciiCapable)`
//    and no `textContentType`; Android `KeyboardOptions(autoCorrectEnabled =
//    false, capitalization = None, keyboardType = Password or Ascii)` with
//    `imeOptions` `IME_FLAG_NO_PERSONALIZED_LEARNING` — so the words do not
//    end up in a keyboard's dictionary.

// --- words.make: make a vault, and its words ---------------------------------

message VaultWordsState {
  Phase phase = 1;
  // SHIELD THE SCREEN (duty 1). Set while the words are on it or being typed.
  bool secure = 2;
  string title = 3;
  string body = 4;
  // SHOW: the 24 words, in order. Empty in every other phase — the words
  // reach a state only while they are being shown.
  repeated WordCell words = 5;
  reserved 6; // `asks`: the three-word check is gone.
  // The one control the phase offers; empty when there is none to draw.
  string primary_label = 7;
  bool primary_enabled = 8;
  // The quieter control (Cancel, "Show the words again"); empty for none.
  string secondary_label = 9;
  // A wrong word, or why nothing was made.
  string notice = 10;
  // Where this phone keeps the key (synchronised or this phone only), in the
  // platform's own sentence. SHOW only.
  string custody = 11;
  // RESTORE_FIRST: the intent's label ("Restore my vaults"); the shell opens
  // words.enter with `restore_purpose` when `RestoreTapped` is sent.
  string restore_label = 12;
  string accessibility_label = 13;
  // RESTORE_FIRST: which words.enter to open. PURPOSE_RESTORE_HELD — this
  // phone holds a seed (that is what RESTORE_FIRST means), and it restores
  // with no words typed (#1047, Q-1047-18).
  WordsEntryState.Purpose restore_purpose = 14;
  // SHOW: the label of "Save a copy". The shell performs it — it hands the
  // 24 words, as one line of text, to the platform's share sheet — and sends
  // nothing back, so the machine never learns whether a copy was made. Empty
  // in every other phase.
  string save_label = 15;
  // 16 and 17 were `sync_label` and `sync_on`, the checkbox that kept the key
  // in the platform's synced store. It is gone (R-ONBOARD-10): the key goes to
  // the synced store without asking, the words are shown only where it will
  // not, and keeping it off the keychain is the Backup tab's.
  reserved 16, 17;
  reserved "sync_label", "sync_on";
  // CHOOSE: the checkbox that keeps this vault on its own 24 words
  // (R-1047-E18), sending `OwnToggled`; `own_on` is whether it is ticked.
  // Empty hides it.
  string own_label = 18;
  bool own_on = 19;
  // CHOOSE: the vault's name, as typed (`NameTyped`). A vault on its own words
  // needs one — it is how a restore lists it. Empty label hides the field.
  string name_label = 20;
  string name = 21;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    // Reading what this phone already holds.
    PHASE_CHECKING = 1;
    // The words are shown, once.
    PHASE_SHOW = 2;
    // 3 was PHASE_CONFIRM, the three-word check. It is gone: "I have saved them"
    // keeps the seed.
    reserved 3;
    reserved "PHASE_CONFIRM";
    // The key is being kept and the vault founded.
    PHASE_MAKING = 4;
    PHASE_MADE = 5;
    // `notice` says why; `primary_label` offers another try.
    PHASE_FAILED = 6;
    // This phone holds a key from another phone and no record of which
    // vaults it made: restore them first (R-1047-E2).
    PHASE_RESTORE_FIRST = 7;
    // The flow is over; the shell closes the sheet.
    PHASE_CLOSED = 8;
    // 9 was PHASE_FRAMING, the "have paper ready" screen before the words. It is
    // gone: the words show straight away and say what they are for.
    reserved 9;
    reserved "PHASE_FRAMING";
    // A phone whose words already root its vaults makes the next one here:
    // a name, and whether it is kept on its own words (R-1047-E18).
    PHASE_CHOOSE = 10;
  }
}

message WordCell {
  // 1-based.
  uint32 position = 1;
  string word = 2;
  // "Word 3, abandon".
  string accessibility_label = 3;
}

message VaultWordsEvent {
  oneof kind {
    Opened opened = 1;
    // The phase's primary control, whatever it is labelled.
    Primary primary = 2;
    Secondary secondary = 3;
    // The sheet was swiped away. Drops the words; keeps nothing.
    Dismissed dismissed = 5;
    // INTENT: the shell opens words.enter for PURPOSE_RESTORE.
    RestoreTapped restore = 6;
    // The own-words checkbox was tapped. CHOOSE only.
    OwnToggled own = 8;
    // The name field changed. CHOOSE only.
    NameTyped name = 9;
  }

  // 4 was `typed`, a word typed into the three-word check, which is gone.
  reserved 4;
  // 7 was `sync`, the sync checkbox, which is gone (R-ONBOARD-10).
  reserved 7;
  reserved "sync";

  message Opened {}

  message Primary {}

  message Secondary {}

  message Dismissed {}

  message RestoreTapped {}

  message OwnToggled {
    bool on = 1;
  }

  message NameTyped {
    string text = 1;
  }
}

// --- words.enter: type the words back ---------------------------------------

message WordsEntryState {
  Phase phase = 1;
  Purpose purpose = 2;
  // SHIELD THE SCREEN (duty 1). Set while any word is on it.
  bool secure = 3;
  string title = 4;
  string body = 5;
  // Always 24 cells, in order.
  repeated WordEntry cells = 6;
  // The pairing code of the gateway to restore from, and what it is for: the
  // text its `centraid-gateway pair` printed (`RestoreRequest.payload`, #1080
  // A1). Drawn wherever the primary restores — every purpose but
  // PURPOSE_REKEY, and a re-key that offers the restore — and
  // `primary_enabled` waits for it, because the core refuses a restore that
  // names no gateway (#1080 A23).
  string endpoint_label = 7;
  string endpoint = 8;
  // The phrase's verdict or the refusal, as a sentence; empty for none.
  string notice = 9;
  string primary_label = 10;
  bool primary_enabled = 11;
  string secondary_label = 12;
  // WORKING: what is happening.
  string progress = 13;
  // DONE after a restore: one line per vault, each with its safety number.
  repeated RestoredVaultLine restored = 14;
  string accessibility_label = 15;
  // PURPOSE_REKEY: which door opened the grid, so `body` explains the words
  // in that door's terms (#1047 F5). Kept through DONE.
  Origin origin = 16;
  // DONE after a restore: one sentence per vault the restore checked and
  // could not claim (`RestoreResponse.unclaimed`, #1047 R-1047-R5) — it
  // stayed with the other phone, lease and all. Numbered with `restored` in
  // one sequence by derivation index, so "Vault 2" names one vault on both
  // lists. Empty is the ordinary answer.
  repeated string stayed = 17;
  // DONE with any `stayed`: the control that asks the laptop again for those
  // vaults alone (`RestoreRequest.indices`, R-1047-R6), sending `Retry`.
  // Empty hides it. The vaults already here are never laid down again.
  string retry_label = 18;
  // ENTERING a held-seed restore: the control that sends `UseWords` and
  // draws the grid instead, for a member whose keychain key is not the one
  // their backup was sealed with. Empty hides it.
  string words_label = 19;
  // ENTERING a held-seed restore: each vault on its own words the keychain
  // also carried, by name (R-1047-E18), under `held_keys_label`. Empty hides
  // both.
  repeated string held_keys = 20;
  string held_keys_label = 21;
  // THE PAIRING CODE IS SCANNED AS WELL AS PASTED, as pair.laptop's is: drawn
  // beside `endpoint_label` and empty with it. With a camera (`Opened.camera`)
  // the control opens the camera, whose screen offers `photo_label` for a
  // screenshot of the square; without one it opens the photo picker
  // (`scan_camera` false). What it reads comes back as `Scanned` and fills
  // `endpoint`; a photo with no square comes back as `PhotoUnread`.
  string scan_label = 22;
  bool scan_camera = 23;
  string photo_label = 24;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_ENTERING = 1;
    PHASE_WORKING = 2;
    PHASE_DONE = 3;
    // The flow is over; the shell closes the screen.
    PHASE_CLOSED = 4;
  }

  enum Purpose {
    PURPOSE_UNSPECIFIED = 0;
    // A fresh install: bring every vault back from the laptop.
    PURPOSE_RESTORE = 1;
    // This phone's own vaults: hand the words back so they open keyed again
    // (Locker's wall). Needs no laptop.
    PURPOSE_REKEY = 2;
    // Bring every vault back with the seed this phone ALREADY holds — the one
    // the synchronised keychain carried here, with no words (#1047,
    // Q-1047-18). `cells` is empty and `secure` is false: nothing secret is
    // on the screen, only the gateway's pairing code.
    PURPOSE_RESTORE_HELD = 3;
  }

  // Where a re-key came from. A restore has one door and ignores it.
  enum Origin {
    // Read as ORIGIN_LOCKER: Locker's wall was the first re-key door.
    ORIGIN_UNSPECIFIED = 0;
    // Locker's "needs your 24 words" wall.
    ORIGIN_LOCKER = 1;
    // pair.laptop's NEEDS_WORDS, whose `WordsTapped` opens the re-key.
    ORIGIN_PAIRING = 2;
  }
}

message WordEntry {
  uint32 position = 1;
  // "Word 5".
  string prompt = 2;
  string typed = 3;
  Mark mark = 4;
  // List words beginning with what is typed, when it is not yet one. A tap
  // sends `SuggestionPicked`.
  repeated string suggestions = 5;
  string accessibility_label = 6;

  enum Mark {
    MARK_UNSPECIFIED = 0;
    MARK_EMPTY = 1;
    // A list word.
    MARK_KNOWN = 2;
    // Not a list word (yet).
    MARK_UNKNOWN = 3;
  }
}

message RestoredVaultLine {
  // "Restored 1 vault, 1,204 rows." for this vault, by index.
  string line = 1;
  // The safety number to compare with the laptop's, grouped; empty when the
  // phone could not compute one — never shown as "it matched".
  string safety_number = 2;
  string safety_label = 3;
}

message WordsEntryEvent {
  oneof kind {
    Opened opened = 1;
    WordTyped typed = 2;
    SuggestionPicked picked = 3;
    EndpointTyped endpoint = 4;
    Primary primary = 5;
    Secondary secondary = 6;
    // `retry_label`'s control: restore the vaults that stayed, on their own.
    Retry retry = 7;
    // `words_label`'s control: leave the held seed and type the 24 words.
    UseWords use_words = 8;
    // `scan_label`'s answer: the square's text, read by the camera or out
    // of a photo. It fills `endpoint` as if it had been pasted.
    Scanned scanned = 9;
    // A photo chosen to scan held no square.
    PhotoUnread unread = 10;
  }

  message Opened {
    WordsEntryState.Purpose purpose = 1;
    WordsEntryState.Origin origin = 2;
    // Whether the shell can scan with a camera; `scan_camera` follows it.
    bool camera = 3;
  }

  message Scanned {
    string payload = 1;
  }

  message PhotoUnread {}

  message Retry {}

  message UseWords {}

  message WordTyped {
    uint32 position = 1;
    string text = 2;
  }

  message SuggestionPicked {
    uint32 position = 1;
    string word = 2;
  }

  message EndpointTyped {
    string text = 1;
  }

  message Primary {}

  message Secondary {}
}

// --- words.show: settings shows the words again (#1047, Q-1047-19) ---------
//
// The words are kept in this phone's device-only store beside the seed, so a
// member can read them again from settings. The screen asks the phone's own
// owner check first — Face ID, Touch ID, a fingerprint, or the passcode — and
// that check is the VIEW's (iOS `LAContext` `.deviceOwnerAuthentication`,
// Android `BiometricPrompt` with `DEVICE_CREDENTIAL`), the same posture as
// Locker's unlock (Q-1047-12). The words reach a state only in PHASE_SHOW, and
// the three platform duties above apply while `secure` is set.

message WordsShowState {
  Phase phase = 1;
  bool secure = 2;
  string title = 3;
  string body = 4;
  // SHOW: the 24 words, in order. Empty in every other phase.
  repeated WordCell words = 5;
  string primary_label = 6;
  string secondary_label = 7;
  string notice = 8;
  string accessibility_label = 9;
  // ASK: the reason the owner check shows ("Show your 24 words").
  string verify_reason = 10;
  // SHOW: "Save to a password manager", performed by the shell exactly as
  // `VaultWordsState.save_label` is (the platform's share sheet, the words as
  // one line). Empty in every other phase.
  string save_label = 11;
  // ASK, just opened: the shell runs the owner check NOW, with
  // `verify_reason`, and presents nothing until it answers — the Backup tab's
  // "Show recovery key" was already the ask, so there is no screen before
  // the check. Every label is empty while this is set. False after a failed
  // check, when ASK is drawn with its notice and a primary to try again.
  bool check_now = 12;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    // The owner check, which the view runs and answers with `Verified` or
    // `VerifyFailed`: at once while `check_now`, else from ASK's primary.
    PHASE_ASK = 1;
    // The words are being read from the store.
    PHASE_LOADING = 2;
    PHASE_SHOW = 3;
    // This phone holds no words to show: its key came through the
    // synchronised keychain, or it has none. `body` says which.
    PHASE_NONE_HERE = 4;
    // The flow is over; the shell closes the screen.
    PHASE_CLOSED = 5;
  }
}

message WordsShowEvent {
  oneof kind {
    Opened opened = 1;
    // PHASE_ASK's primary is an INTENT: the view runs the owner check and
    // sends one of the two answers below. Every other phase's primary closes.
    Primary primary = 2;
    Secondary secondary = 3;
    Verified verified = 4;
    VerifyFailed verify_failed = 5;
    // Swiped away, or the app left the foreground: the words are dropped.
    Dismissed dismissed = 6;
  }

  message Opened {}

  message Primary {}

  message Secondary {}

  message Verified {}

  // `cancelled`: the member dismissed the check themself, which closes the
  // flow. Any other failure (no passcode set, too many tries) keeps ASK up
  // and says why.
  message VerifyFailed {
    bool cancelled = 1;
  }

  message Dismissed {}
}

// ---------------------------------------------------------------------------
// --- Pair with the laptop (#1047) ---
// ---------------------------------------------------------------------------
//
// `pair.laptop`. The gateway's owner runs `centraid-gateway pair` and it
// prints a square and the same text beneath it: the pairing code
// (`{v: 2, gw, addrs, pin, secret, exp_ms}`, #1080). The phone scans or
// pastes it; the core dials one of its addresses pinning the certificate the
// code names, pairs with its one-use secret, keeps the gateway as a backup
// destination and hands back the pairing's safety number
// (`PairResponse.safety_number`: 60 digits in 12 groups of 5 over the vault's
// identity key and the gateway certificate's fingerprint, #1080 A7 and A17),
// which the member compares with the number `centraid-gateway serve` prints
// when the pairing lands (W15-D5). That comparison is the whole security
// property of the flow and it is the member's to make.
//
// The code is not a secret the way the words are — its secret is spent on
// first use and expires — so pasting is allowed and the screen is not shielded.

message PairLaptopState {
  Phase phase = 1;
  string title = 2;
  string body = 3;
  // WAITING: what is in the paste field.
  string payload = 4;
  string payload_label = 5;
  // WAITING: "Scan the square", on every phone. `scan_camera` says what it
  // opens: the camera, or — on a phone with none — the photo picker.
  string scan_label = 6;
  // 7 was `fingerprint`, the laptop's hex endpoint id in groups of eight:
  // a hex id is not what a member compares (W15-D5; R-1047-E12's grouped
  // endpoint superseded 2026-09-29). `safety_number` is.
  reserved 7;
  reserved "fingerprint";
  string notice = 8;
  string primary_label = 9;
  bool primary_enabled = 10;
  string secondary_label = 11;
  // PAIRING: what is happening.
  string progress = 12;
  string accessibility_label = 13;
  // PAIRED: the safety number to compare with the laptop's terminal, in its
  // 12 groups of 5, drawn in a monospaced face and never shortened. A pairing
  // with no number is refused, never shown as this empty.
  string safety_number = 14;
  // NEEDS_WORDS on a vault that opened without its words: "Enter your 24
  // words" — the intent `WordsTapped`, which the shell routes to words.enter
  // for PURPOSE_REKEY (Locker's wall's door). Empty otherwise.
  string words_label = 15;
  // WAITING, on a phone with a camera: "Choose a photo", drawn on the
  // camera screen for a screenshot of the square — the intent `PhotoTapped`.
  // Empty without a camera, where Scan opens the photo picker itself. What
  // the shell reads from a photo comes back as `Scanned`; a photo with no
  // square in it as `PhotoUnread`.
  string photo_label = 16;
  // WAITING: true when Scan opens the camera, false when this phone has none
  // and Scan opens the photo picker.
  bool scan_camera = 17;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_WAITING = 1;
    PHASE_PAIRING = 2;
    PHASE_PAIRED = 3;
    // `notice` says why; primary tries again with the same text.
    PHASE_FAILED = 4;
    // This vault opens without its words, so it has no identity to pair
    // with: `body` sends the member to the words first.
    PHASE_NEEDS_WORDS = 5;
    PHASE_CLOSED = 6;
  }
}

message PairLaptopEvent {
  oneof kind {
    Opened opened = 1;
    PayloadTyped typed = 2;
    // INTENT: the shell opens its camera, or its photo picker when
    // `scan_camera` is false; what it reads comes back as `Scanned`.
    ScanTapped scan = 3;
    Scanned scanned = 4;
    Primary primary = 5;
    Secondary secondary = 6;
    Dismissed dismissed = 7;
    // INTENT: the shell opens words.enter for PURPOSE_REKEY. The machine
    // closes the pairing screen; pairing is opened again after the words.
    WordsTapped words = 8;
    // INTENT, from the camera screen: the shell opens its photo picker and
    // reads the square out of the photo chosen; a code comes back as
    // `Scanned`, none as `PhotoUnread`.
    PhotoTapped photo = 9;
    PhotoUnread unread = 10;
  }

  // `camera`: whether this phone has a camera the shell can scan with — a
  // platform fact only the shell can read. Without one, Scan reads a photo
  // (`scan_camera` false).
  message Opened {
    bool camera = 1;
  }

  message PayloadTyped {
    string text = 1;
  }

  message ScanTapped {}

  // A code the camera read. Pairs at once: a scan is a deliberate act.
  message Scanned {
    string payload = 1;
  }

  message Primary {}

  message Secondary {}

  message Dismissed {}

  message WordsTapped {}

  message PhotoTapped {}

  // The photo chosen held no square the shell could read. A member who
  // backed out of the picker sends nothing.
  message PhotoUnread {}
}

// ---------------------------------------------------------------------------
// --- Backup ---
// ---------------------------------------------------------------------------

// THE BACKUP LINE (#1080; moved to Rust, #1135).
//
// `BackupLine` is what Home draws (`HomeState.backup_line`). Every count and time
// on it is the core's `backup_status`, and a thing is "backed up" only once a
// gateway acknowledged it and the phone recorded that (#1080 ruling 7): the line
// never says more than the ledger holds. The Backup screen itself is Rust's
// (`backup.home`, `backup_screens.proto`), and the same line, in the same words,
// is made there (`crates/screens/src/backup/line.rs`).

// One reason items wait, with how many.
message BackupWaitingRow {
  Reason reason = 1;
  uint64 count = 2;
  // "12 waiting for Wi-Fi".
  string sentence = 3;

  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_WIFI = 1;
    REASON_CHARGER = 2;
    REASON_GATEWAY = 3;
    // iCloud-only originals, fetched only under the rule and inside a window.
    REASON_ICLOUD = 4;
    // The core is waiting for the shell to stream an item's bytes.
    REASON_BYTES = 5;
    REASON_WINDOW = 6;
    // An original the MANUAL rule holds until the member taps "Back up now"
    // (#1080 A24).
    REASON_ASK = 7;
    // The machine that answered at a gateway's address is not the gateway
    // this phone pinned (#1080).
    REASON_UNTRUSTED = 8;
    // The gateway answered and refused a write for its own reason, a full
    // disk or a quota (#1080, the sweep's F1).
    REASON_REFUSED = 9;
    // The gateway no longer knows this phone's token: pair it again (#1080,
    // the sweep's F2).
    REASON_PAIR_AGAIN = 10;
  }
}

message BackupLine {
  // When a gateway last acknowledged this vault's records (the snapshot's
  // head), on the GATEWAY's clock. Zero: never.
  int64 records_as_of_ms = 1;
  // Photos, videos, documents and their derivatives a gateway acknowledged,
  // and how many the vault knows.
  uint64 confirmed = 2;
  uint64 total = 3;
  repeated BackupWaitingRow waiting = 4;
  // The vault moved to another phone; this one is read-only.
  bool frozen = 5;
  // No gateway is paired: the line offers pairing instead of a status.
  bool unpaired = 6;
  // The line, finished: "Backed up 2 minutes ago". Empty draws no line.
  string sentence = 7;
  // Its second clause, or empty: "1,203 of 1,240 photos and files".
  string detail = 8;
  Tone tone = 9;
  string accessibility_label = 10;
  // THE LINE IN A FEW WORDS, for the vault lockup's second line, where Home
  // draws it (R-ONBOARD-11): "Backed up 2 minutes ago", "Not backed up".
  // `sentence` is the Backup screen's.
  string status = 11;
  // EVERY GATEWAY THIS PHONE IS PAIRED WITH REFUSED ITS TOKEN (#1080, the
  // sweep's F2): `sentence` and `status` say to pair again, and the Backup
  // screen's add control is the way. A view may offer it beside the line.
  bool pair_again = 12;

  enum Tone {
    TONE_UNSPECIFIED = 0;
    // Backed up, or catching up on its own.
    TONE_QUIET = 1;
    // Something waits on the member: a gateway, a setting.
    TONE_ATTENTION = 2;
    // Moved to another phone, or nothing is backed up at all.
    TONE_URGENT = 3;
  }
}

// ---------------------------------------------------------------------------
// --- Chat: the on-device assistant ---
// ---------------------------------------------------------------------------
//
// `chat`. A tab on the bottom bar (Home · Chat · Backup), not an app: it has no
// tile and no route of its own, and a chat opened from an app is the same
// screen with `scope_app` set. The model runs ON THIS PHONE over the core's
// `Request::Assist` (`assist.proto`). It reads; and a write it proposes is a
// CONFIRM CARD on its answer (`ChatPending`) that runs only on the member's tap.
//
// THE ANSWER IS CARDS. A reply is one short line of model text and the rows it
// found — a task, a photograph, a ledger line, a person — each a reference
// (`ChatCard`) that the app's own tile draws and taps through to. The model
// routes and phrases; the apps draw the data. A shell that has no tile for an
// entity yet draws the card's own title, subtitle and meta.
//
// THE TRANSCRIPT IS THE VAULT'S (R-CHAT-1). Each completed turn is saved by the
// core through the `chat.*` commands; this state is rebuilt from the core's
// events while a turn runs and from `chat.thread` when a stored chat is opened.
// Past chats are listed in a DRAWER (`threads`), newest first, and the header
// reads: the drawer, the chat's title with the vault beside it, and a menu.
//
// THE MODEL FILE IS A STEP, NOT A SCREEN. Until a model is on the phone the
// state is `PHASE_NEEDS_MODEL` and `model_step` carries the one sentence, the
// size and the action; the shell owns the download (the only thing Centraid
// ever fetches) and reports its progress as events.

message ChatState {
  Phase phase = 1;
  // THE HEADER'S CENTRE: the open chat's title, or "New chat" while there is
  // none yet; and the line under it, "<vault name> · on this phone".
  string title = 2;
  string subtitle = 3;
  // The app the chat was opened from, or empty. Not drawn: the shell opens the
  // next chat from the same place.
  string scope_app = 4;
  // The thread, oldest first. Empty while a fresh chat shows `empty_line` and
  // `suggestions`.
  repeated ChatMessage messages = 5;
  // One sentence, present only while the thread is empty and the model ready.
  string empty_line = 6;
  // Up to three questions this vault can answer, present only while the thread
  // is empty. A tap is a `sent` event carrying the text.
  repeated string suggestions = 7;
  // A turn is running. The composer offers Stop instead of Send.
  bool streaming = 8;
  // "Looking in Notes" while a read runs, empty otherwise.
  string activity = 9;
  // One line about the last failure, empty when there is none. A failed model
  // download and a failed turn both land here.
  string error = 10;
  // The download, load and unavailable steps. Present in every phase but
  // `PHASE_READY`.
  ChatModelStep model_step = 11;
  // Labels, so the view owns no word.
  string composer_placeholder = 12;
  string send_label = 13;
  string stop_label = 14;
  string new_chat_label = 15;
  string retry_label = 16;
  string copy_label = 17;
  // The last turn is over and can be asked again: Retry is drawn on it.
  bool can_retry = 18;
  // The thread has something in it: New chat is drawn.
  bool can_new_chat = 19;
  // ATTACHMENTS (v1: at most one photo and one text document per message).
  //
  // What waits in the composer, oldest first. Empty once the turn is sent.
  repeated ChatAttachment pending = 20;
  // The attach control is drawn: a turn is not running and there is room for
  // another attachment.
  bool can_attach = 21;
  // The labels of the attach control and its three sources, so the view owns no
  // word: "Attach", "Photo from vault", "Photo library", "Document", "Remove".
  string attach_label = 22;
  string attach_vault_photo_label = 23;
  string attach_library_photo_label = 24;
  string attach_document_label = 25;
  string remove_attachment_label = 26;
  // The photo reader's own step, drawn above the composer while a photo waits
  // for the vision projector: the offer to fetch it, its progress, or its load.
  // Absent otherwise. The thread stays; this is not the model's phase.
  ChatModelStep vision_step = 27;
  // The photo reader's step is the offer (not yet downloading): the composer
  // cannot send until it is fetched or the photo is removed.
  bool vision_blocked = 28;

  // THE DRAWER AND THE HEADER'S MENU (R-CHAT-2).
  //
  // The drawer is open: the past chats slide in from the left over the thread.
  bool drawer_open = 29;
  // Past chats, newest activity first. Present whatever the model's phase: a
  // member can read and delete chats before a model is on the phone.
  repeated ChatThreadItem threads = 30;
  // One line, present only when `threads` is empty: "No chats yet."
  string threads_empty_line = 31;
  // The stored chat this thread is saved in, or empty for a chat that has not
  // finished a turn. Not drawn: a shell names it to rename and delete.
  string thread_id = 32;
  // The header menu offers Rename and Delete: there is a stored chat to act on.
  bool can_manage_thread = 33;
  // Labels, so the view owns no word.
  string drawer_label = 34;
  string menu_label = 35;
  string rename_label = 36;
  string delete_label = 37;
  string delete_all_label = 38;
  string cancel_label = 39;
  string save_label = 40;
  string rename_title = 41;
  string delete_title = 42;
  string delete_body = 43;
  string delete_all_title = 44;
  string delete_all_body = 45;
  // "This item is gone." for a card whose row was deleted since the answer.
  string card_gone_line = 46;
  // The marker the drawer puts on the open chat, for a screen reader.
  string current_label = 47;

  // THE DRAWER'S SEARCH (#1097, R-1097-24): the kit's field, the same message
  // every app's search carries. `open` shows the field in place of the opener;
  // `term` is what the member typed; `answered_term` is the term `threads`
  // answers; `corrected` is the words the core searched instead when it
  // corrected a typo (the field draws "Including results for ..."). While a term
  // is answered, `threads` are the chats it FOUND, best match first, and
  // `threads_empty_line` says nothing matched.
  SearchField drawer_search = 48;
  // The field's placeholder and the opener's words: "Search chats".
  string drawer_search_placeholder = 49;
  // "Delete all chats" is offered: the drawer shows the plain list and it holds
  // chats. Never over search results, where it would read as deleting the
  // chats shown and not every chat in the vault.
  bool can_delete_all = 50;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    // Asking the core whether a model is there. Draws nothing but the header.
    PHASE_CHECKING = 1;
    // No model on this phone: the download step.
    PHASE_NEEDS_MODEL = 2;
    // The shell is fetching it; `model_step` carries the progress.
    PHASE_DOWNLOADING = 3;
    // The model is being read into memory.
    PHASE_LOADING = 4;
    // The thread.
    PHASE_READY = 5;
    // This build cannot run a model, or the core would not answer. A state to
    // draw, not a download problem.
    PHASE_UNAVAILABLE = 6;
  }
}

// ONE PAST CHAT, as the drawer lists it.
message ChatThreadItem {
  string thread_id = 1;
  string title = 2;
  // "5 min ago", "Yesterday": when the chat last moved.
  string ago = 3;
  // The chat that is open now.
  bool current = 4;
  // "<title>, <ago>", with the open one marked.
  string accessibility_label = 5;
}

message ChatModelStep {
  // NEEDS_MODEL: "530 MB download", and empty when the size is not known.
  string size_line = 1;
  // NEEDS_MODEL: "This is the only time Centraid fetches anything."
  string note_line = 2;
  // NEEDS_MODEL: "Download model". Empty in every other phase.
  string action_label = 3;
  // DOWNLOADING: whether `progress` means anything yet.
  bool progress_known = 4;
  // DOWNLOADING: 0.0 to 1.0.
  float progress = 5;
  // DOWNLOADING, LOADING and UNAVAILABLE: the one clause the step says.
  string status_line = 6;
}

message ChatMessage {
  // Monotonic within a chat. The view's diffing key and the argument of `copy`.
  uint64 id = 1;
  Role role = 2;
  // The user's words, or the model's one line. While `streaming` it is the
  // text so far.
  string text = 3;
  // The rows the answer found, to draw as the apps' own tiles. Empty on a
  // user message.
  repeated ChatCard cards = 4;
  // The assistant's line is still being written (or its read is running).
  bool streaming = 5;
  // The turn was stopped, or failed after showing something.
  bool stopped = 6;
  // "You said: …", "Centraid said: …".
  string accessibility_label = 7;
  // What the member attached to this question: a marker and a thumbnail, never
  // bytes. Present on a user message only.
  repeated ChatAttachment attachments = 8;
  // One line beside an answer: "Read the first part of the document." Empty
  // when there is none.
  string note = 9;
  // The write this answer proposes, drawn as a confirm card under the line.
  // Absent on an answer that proposes nothing and on a user message. The view
  // draws it only once the answer has stopped streaming.
  ChatPending pending = 10;

  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_USER = 1;
    ROLE_ASSISTANT = 2;
  }
}

// A WRITE THE MODEL PROPOSED, as the confirm card under its answer (#1088,
// R-1088-2). On the phone every write the model makes waits here; only the
// member's tap on Confirm makes it, and nothing the model wrote reaches the
// vault before that. The lines are the core's (`AssistPendingStep.summary`),
// composed from the rows the write changes and not from the model's text.
//
// The card settles once. WAITING offers Confirm and Cancel; a tap moves it to
// WORKING while the core runs the steps, and then to APPLIED, STALE or
// NOT_DONE with `settled_line` saying how it ended. There is no toast and no
// Undo: an applied card says "Done." and stays where it was.
message ChatPending {
  // What a confirm or a cancel names; empty only on an INERT card drawn from a
  // stored `proposed` answer, which no session holds and nothing can name.
  string pending_id = 1;
  State state = 2;
  // One line for each row the write changes, in order.
  repeated ChatPendingStep steps = 3;
  // "and 3 more" when the write changes more rows than `steps` lists, else empty.
  string more_line = 4;
  // "Confirm" and "Cancel". Drawn while WAITING (enabled) and WORKING (not).
  string confirm_label = 5;
  string cancel_label = 6;
  // The card asks twice: Confirm is drawn as the outlined destructive control
  // (DESIGN.md), never filled.
  bool destructive = 7;
  // How the card ended, one clause: "Done.", "Not done.", "That changed since.
  // Ask again." Empty while WAITING or WORKING.
  string settled_line = 8;
  // "Proposed change, removes something: Delete task "Old"."
  string accessibility_label = 9;

  enum State {
    STATE_UNSPECIFIED = 0;
    // Confirm and Cancel are offered.
    STATE_WAITING = 1;
    // Confirm was tapped and the core is running the steps.
    STATE_WORKING = 2;
    // The steps ran. `settled_line` is the core's sentence.
    STATE_APPLIED = 3;
    // Cancelled, or the vault refused a step, or the card was gone when tapped.
    STATE_NOT_DONE = 4;
    // A row the write addresses changed while the card waited: nothing ran.
    STATE_STALE = 5;
    // A newer message superseded the card before it was answered, or the thread
    // was reopened and no session holds the write (R-1088-10): no buttons.
    STATE_INERT = 6;
  }
}

message ChatPendingStep {
  // The whole line, as the core composed it.
  string summary = 1;
  // This line deletes or removes, cancels, or settles money.
  bool destructive = 2;
}

// ONE ATTACHMENT, as the composer and the transcript draw it.
message ChatAttachment {
  // Minted by the machine, monotonic within a chat; what a remove names.
  uint64 id = 1;
  Kind kind = 2;
  // The photograph's title or the document's name, or empty. Drawn on the chip.
  string label = 3;
  // A file the shell draws as the chip's thumbnail (a photo only), or empty.
  string thumbnail_path = 4;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_PHOTO = 1;
    KIND_DOCUMENT = 2;
  }
}

// A REFERENCE TO ONE REAL ROW (`AssistCard`, as the shell holds it).
message ChatCard {
  // The app id a shell routes by.
  string app = 1;
  // What the row is, in the app's vocabulary: `task`, `event`, `person`…
  string entity = 2;
  string id = 3;
  // A second key the app's route takes beside `id`. Empty when there is none.
  string qualifier = 4;
  string title = 5;
  string subtitle = 6;
  string meta = 7;
}

message ChatEvent {
  oneof kind {
    Opened opened = 1;
    Sent sent = 2;
    Stopped stopped = 3;
    Regenerated regenerated = 4;
    NewChat new_chat = 5;
    Copied copied = 6;
    DownloadTapped download = 7;
    DownloadProgress download_progress = 8;
    DownloadFinished download_finished = 9;
    Attached attached = 10;
    AttachmentRemoved attachment_removed = 11;
    // 12 was `VisionLoaded`, which nothing sent: the projector's file arriving
    // is `DownloadFinished` with `vision` set.
    DrawerToggled drawer = 13;
    ThreadOpened thread_opened = 14;
    ThreadRenamed thread_renamed = 15;
    ThreadDeleted thread_deleted = 16;
    AllThreadsDeleted all_threads_deleted = 17;
    PendingConfirmed pending_confirmed = 18;
    PendingCancelled pending_cancelled = 19;
    DrawerSearchOpened drawer_search_opened = 20;
    DrawerSearchTerm drawer_search_term = 21;
    DrawerSearchClosed drawer_search_closed = 22;
  }
  reserved 12;

  // The tab appeared. `app` scopes the chat to the app it was opened from;
  // empty is every app. Opening again with the same scope changes nothing, so
  // the thread survives switching tabs.
  message Opened {
    string app = 1;
    // How big the model download is, in bytes, as the shell knows it (it owns
    // the transfer). Zero is unknown, and the size line is then absent.
    uint64 model_bytes = 2;
    // The foreground vault's name, for the header's second line. Empty is
    // "no name", and the line then says only where the chat runs.
    string vault_name = 3;
    // The member CHOSE this scope from the composer's menu, so a different one
    // starts a new chat. False is the tab merely appearing: a chat with
    // something in it, or a stored thread with a scope of its own, is left
    // alone whatever `app` says.
    bool scope_chosen = 4;
  }

  // The composer's send, or a tapped suggestion.
  message Sent {
    string text = 1;
  }

  // INTENT: stop the running turn.
  message Stopped {}

  // INTENT: ask the last question again, replacing the last answer.
  message Regenerated {}

  // INTENT: clear the thread. A running turn is stopped first.
  message NewChat {}

  // INTENT: put a message's text on the clipboard (the shell's platform act).
  message Copied {
    uint64 message_id = 1;
  }

  // The download step's action. `vision` says which step: the photo reader's
  // (the vision projector) and not the model's.
  message DownloadTapped {
    bool vision = 1;
  }

  // What the shell's download reported. `total_bytes` is zero when unknown.
  // `vision`: it is the projector's transfer.
  message DownloadProgress {
    uint64 done_bytes = 1;
    uint64 total_bytes = 2;
    bool vision = 3;
  }

  // The download ended; `ok` is false when it stopped short.
  message DownloadFinished {
    bool ok = 1;
    bool vision = 2;
  }

  // The member chose something to attach. The shell resolves its own picker and
  // hands over what the core needs: a vault asset id, a vault document id, or
  // the bytes of a camera-roll image. `thumbnail_path` is a file the shell
  // already drew a thumbnail to (a photo only); `label` names it on the chip.
  message Attached {
    oneof source {
      VaultPhoto vault_photo = 1;
      LibraryPhoto library_photo = 2;
      VaultDocument vault_document = 3;
    }
    string label = 4;
    string thumbnail_path = 5;
  }

  message VaultPhoto {
    string asset_id = 1;
  }

  // JPEG or PNG bytes. HEIC is converted by the shell before it sends.
  message LibraryPhoto {
    bytes content = 1;
    string mime = 2;
  }

  message VaultDocument {
    string doc_id = 1;
  }

  // INTENT: take a waiting attachment out of the composer.
  message AttachmentRemoved {
    uint64 id = 1;
  }

  // The shell's picker was dismissed or its pick could not be read: nothing
  // changes. (No message: the shell simply sends nothing.)

  // INTENT: the drawer's menu control, or its scrim, or the Chat tab pressed
  // while the chat is showing.
  message DrawerToggled {
    // The drawer should be showing (true) or shut (false).
    bool opened = 1;
  }

  // INTENT: open a past chat from the drawer. The one that is open already only
  // closes the drawer; a running turn is stopped first.
  message ThreadOpened {
    string thread_id = 1;
    // THE TITLE THE SHELL ALREADY HAS (#1097): a thread opened from search is
    // not necessarily in the drawer's list (which is the newest hundred), so the
    // header would be empty until the thread is read. Empty when the shell has
    // none; the list's row, when it has one, wins.
    string title = 2;
  }

  // INTENT: rename a chat. A blank title changes nothing.
  message ThreadRenamed {
    string thread_id = 1;
    string title = 2;
  }

  // INTENT: delete one chat, after the shell's own confirmation. The open chat
  // goes back to a new one.
  message ThreadDeleted {
    string thread_id = 1;
  }

  // INTENT: delete every chat in this vault, after the shell's confirmation.
  message AllThreadsDeleted {}

  // INTENT: Confirm on the confirm card `pending_id` names. The card is the
  // confirmation: the shell asks nothing more.
  message PendingConfirmed {
    string pending_id = 1;
  }

  // INTENT: Cancel on the confirm card `pending_id` names. Nothing is written.
  message PendingCancelled {
    string pending_id = 1;
  }

  // INTENT: the drawer's search opener was tapped (#1097).
  message DrawerSearchOpened {}

  // The drawer's field changed. A blank term shows the plain list.
  message DrawerSearchTerm {
    string term = 1;
  }

  // INTENT: the drawer's field was closed; the term and its answer go with it.
  message DrawerSearchClosed {}
}
