// --- tally.expense ----------------------------------------------------------

message TallyExpenseState {
  SeatState seat = 1;
  string expense_id = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    Denied denied = 5;
    TallyExpenseData data = 6;
  }
  // Trash, restore, undo and the memo: one write at a time.
  WriteState write = 7;
  // Trashing asks first; nothing else here does.
  optional Confirm confirm = 8;
  TallyDetailChrome chrome = 9;
  // THE MEMO SHEET IS UP, holding what is typed; absent when it is not.
  // Closing it is done (#1015 D3): changed words are written then.
  optional string memo_draft = 10;
}

message TallyExpenseData {
  // No expense by this id, live or trashed.
  optional EmptyState gone = 1;
  string title = 2;
  Money amount = 3;
  TallyFigure yours = 4;
  string icon_key = 5;
  // Key and value rows: Paid by, Date, Group, Category, Divided, Currency.
  repeated TallyField fields = 6;
  string payers_heading = 7;
  repeated TallyShareRow payers = 8;
  string splits_heading = 9;
  repeated TallyShareRow splits = 10;
  // By line: the typed lines, each with its own allocations.
  string lines_heading = 11;
  repeated TallyLineRow lines = 12;
  // The owner's running memo (`tally.set_expense_memo`): the heading only when
  // there is one, and the verb that opens the sheet ("Add memo" / "Edit
  // memo"; empty on a trashed expense or while a write is out).
  string memo_heading = 13;
  string memo = 14;
  string memo_label = 22;
  string revisions_heading = 15;
  repeated TallyRevisionRow revisions = 16;
  // In the trash: "In the trash · purges Wed 11 March".
  bool trashed = 17;
  string trash_line = 18;
  // Empty when the verb is not offered (edit and trash on a trashed expense;
  // restore on a live one).
  string edit_label = 19;
  string trash_label = 20;
  string restore_label = 21;
}

message TallyField {
  string key = 1;
  string value = 2;
  // A rule or provenance note under the value; empty for none.
  string note = 3;
}

message TallyShareRow {
  TallyPersonChip person = 1;
  Money amount = 2;
  string accessibility_label = 3;
}

message TallyLineRow {
  string line_item_id = 1;
  string title = 2;
  Money amount = 3;
  // "Dana · Sam".
  string meta = 4;
}

message TallyRevisionRow {
  string revision_id = 1;
  // "Edited" / "Trashed" / "Restored".
  string title = 2;
  // "10:42 · was “Dinner”" — the time is the core's local reading.
  string meta = 3;
  // What the amount was before, when the snapshot carries it.
  optional Money before_amount = 4;
  // "Undo" while the vault's window is open; empty otherwise.
  string undo_label = 5;
  // "already undone" once undone; empty otherwise.
  string state_label = 6;
}

message TallyExpenseEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    TrashTapped trash = 3;
    RestoreTapped restore = 4;
    UndoTapped undo = 5;
    Confirmed confirmed = 6;
    Dismissed dismissed = 7;
    // INTENT: the shell opens `tally.editor` on this expense.
    EditTapped edit = 8;
    MemoOpened memo_opened = 9;
    MemoChanged memo_changed = 10;
    // The sheet closed: done, and the words written if they changed.
    MemoClosed memo_closed = 11;
  }

  message Opened {
    string expense_id = 1;
  }

  message Refreshed {}

  message TrashTapped {}

  message RestoreTapped {}

  message UndoTapped {
    string revision_id = 1;
  }

  message Confirmed {}

  message Dismissed {}

  message EditTapped {}

  message MemoOpened {}

  message MemoChanged {
    string text = 1;
  }

  message MemoClosed {}
}

// --- tally.editor: add or edit an expense -----------------------------------
//
// EXPLICIT SAVE, NOT AUTOSAVE: a money form half-typed is not an expense, and
// a split that does not reconcile cannot be stored. Save is one write
// (`WriteLaw`); leaving with unsaved changes asks first.

enum TallySplitMethod {
  TALLY_SPLIT_METHOD_UNSPECIFIED = 0;
  TALLY_SPLIT_METHOD_EQUALLY = 1;
  TALLY_SPLIT_METHOD_EXACT = 2;
  TALLY_SPLIT_METHOD_PERCENTAGES = 3;
  TALLY_SPLIT_METHOD_SHARES = 4;
  TALLY_SPLIT_METHOD_ADJUSTED = 5;
  TALLY_SPLIT_METHOD_BY_LINE = 6;
}

message TallyEditorState {
  SeatState seat = 1;
  Mode mode = 2;
  // Edit only.
  string expense_id = 3;
  oneof content {
    Loading loading = 4;
    ReadFailure failure = 5;
    Denied denied = 6;
    TallyEditorData data = 7;
  }
  // WHAT THE MEMBER HAS TYPED AND CHOSEN. The machine's truth; `data` is what
  // it makes of it.
  TallyExpenseForm form = 8;
  WriteState write = 9;
  // Leaving with unsaved changes asks first.
  optional Confirm confirm = 10;
  // True once the save committed or the member discarded: the shell closes.
  bool done = 11;
  // The form differs from what it opened with.
  bool dirty = 12;
  TallyEditorChrome chrome = 13;
  // Minted by the bridge at open: keys a save so a double tap is one expense
  // and a second, identical expense in another sitting is not deduplicated.
  string draft_token = 14;
  // The form as it opened — what `dirty` compares against. Absent until the
  // first answer seeds the form.
  optional TallyExpenseForm baseline = 15;
  // THE CHOICE SHEET UP, if any (#1015 D4: choices sheet). A pick closes it.
  Sheet sheet = 16;

  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_ADD = 1;
    MODE_EDIT = 2;
  }

  enum Sheet {
    SHEET_UNSPECIFIED = 0;
    SHEET_NONE = 1;
    SHEET_PAYER = 2;
    SHEET_GROUP = 3;
    SHEET_CATEGORY = 4;
    SHEET_DATE = 5;
    SHEET_CURRENCY = 6;
    SHEET_METHOD = 7;
  }
}

message TallyEditorChrome {
  string title = 1;
  string save = 2;
  string cancel = 3;
  string retry = 4;
  string loading = 5;
  string description_key = 6;
  string description_placeholder = 7;
  string amount_key = 8;
  string payer_key = 9;
  string group_key = 10;
  string category_key = 11;
  string date_key = 12;
  string currency_key = 13;
  string method_key = 14;
  string add_line = 15;
  string remove_line = 16;
  string line_placeholder = 17;
}

message TallyExpenseForm {
  string description = 1;
  // As typed: "42.50". Parsed with the currency's exponent.
  string amount_text = 2;
  string currency = 3;
  string payer_id = 4;
  // EMPTY is "No group".
  string group_id = 5;
  string category = 6;
  // `YYYY-MM-DD`.
  string spent_on = 7;
  TallySplitMethod method = 8;
  // One per participant, in roster order.
  repeated TallySplitEntry entries = 9;
  // By line only.
  repeated TallyLineEntry lines = 10;
}

message TallySplitEntry {
  TallyPersonChip person = 1;
  // Equally, by line: whether they share. Other methods: a blank entry is 0.
  bool included = 2;
  // As typed: an amount, a percentage, a weight or an adjustment.
  string text = 3;
  // "%" / "shares" / "±" / the currency code; empty for equally.
  string unit_label = 4;
  // THE SHARE THIS ENTRY RESOLVES TO, computed by the machine; absent while
  // the division does not reconcile.
  optional Money share = 5;
  // This entry's own problem ("not a number"); empty when none.
  string issue = 6;
}

message TallyLineEntry {
  // Stable within the form: `l1`, `l2`, …
  string line_key = 1;
  string description = 2;
  string amount_text = 3;
  // Who shares this line, equally.
  repeated string party_ids = 4;
  string issue = 5;
}

message TallyEditorData {
  repeated TallyChoice payers = 1;
  repeated TallyChoice groups = 2;
  repeated TallyChoice categories = 3;
  repeated TallyChoice dates = 4;
  // The group's (or the vault's) money, then any with a remembered rate.
  repeated TallyChoice currencies = 5;
  repeated TallyChoice methods = 6;
  // Per method, what the reconcile line says — "the odd penny goes to the
  // payer", "they total 100 · it will not commit at 99", or what is missing.
  // Said HERE only: `issues` does not repeat it.
  string reconcile_line = 7;
  // True when the reconcile line is a problem.
  bool reconcile_problem = 8;
  // The whole, in the settlement money, once the amount parses.
  optional Money total = 9;
  // "At 1 GBP = 1.17 EUR, from the rate this vault was given on 3 March".
  string rate_line = 10;
  // Every problem that stops a save other than the division's, which is
  // `reconcile_line`; empty when nothing else stops it.
  repeated string issues = 11;
  bool can_save = 12;
  // The currency chips are hidden: an edit of a converted expense keeps the
  // rate it was entered with.
  bool currency_locked = 13;
  // WHAT IS LEFT TO DIVIDE, when the division does not reach the total —
  // absolute, beside `remaining_label` ("left to divide" / "over the total").
  optional Money remaining = 14;
  string remaining_label = 15;
}

message TallyEditorEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    DescriptionChanged description = 3;
    AmountChanged amount = 4;
    PayerPicked payer = 5;
    GroupPicked group = 6;
    CategoryPicked category = 7;
    DatePicked date = 8;
    CurrencyPicked currency = 9;
    MethodPicked method = 10;
    EntryToggled entry_toggled = 11;
    EntryChanged entry_changed = 12;
    LineAdded line_added = 13;
    LineRemoved line_removed = 14;
    LineChanged line_changed = 15;
    LinePartyToggled line_party = 16;
    SaveTapped save = 17;
    CloseTapped close = 18;
    Confirmed confirmed = 19;
    Dismissed dismissed = 20;
    SheetOpened sheet_opened = 21;
    SheetClosed sheet_closed = 22;
  }

  message SheetOpened {
    TallyEditorState.Sheet sheet = 1;
  }

  message SheetClosed {}

  // ADD: `group_id` / `party_id` preset where it was opened from. EDIT:
  // `expense_id`. `draft_token` is the bridge's.
  message Opened {
    TallyEditorState.Mode mode = 1;
    string expense_id = 2;
    string group_id = 3;
    string party_id = 4;
    string draft_token = 5;
  }

  message Refreshed {}

  message DescriptionChanged {
    string text = 1;
  }

  message AmountChanged {
    string text = 1;
  }

  message PayerPicked {
    string party_id = 1;
  }

  // Empty `group_id` is "No group".
  message GroupPicked {
    string group_id = 1;
  }

  message CategoryPicked {
    string category = 1;
  }

  message DatePicked {
    string day = 1;
  }

  message CurrencyPicked {
    string currency = 1;
  }

  message MethodPicked {
    TallySplitMethod method = 1;
  }

  message EntryToggled {
    string party_id = 1;
  }

  message EntryChanged {
    string party_id = 1;
    string text = 2;
  }

  message LineAdded {}

  message LineRemoved {
    string line_key = 1;
  }

  message LineChanged {
    string line_key = 1;
    string description = 2;
    string amount_text = 3;
  }

  message LinePartyToggled {
    string line_key = 1;
    string party_id = 2;
  }

  message SaveTapped {}

  message CloseTapped {}

  message Confirmed {}

  message Dismissed {}
}

// --- tally.settle_up --------------------------------------------------------

message TallySettleUpState {
  SeatState seat = 1;
  // EMPTY is every group plus the group-less positions.
  string group_id = 2;
  oneof content {
    Loading loading = 3;
    ReadFailure failure = 4;
    Denied denied = 5;
    TallySettleUpData data = 6;
  }
  // The payment being recorded, once a suggestion is picked.
  optional TallyPaymentDraft draft = 7;
  WriteState write = 8;
  TallyDetailChrome chrome = 9;
  string draft_token = 10;
  string title = 11;
  string lede = 12;
}

message TallySettleUpData {
  repeated TallyTransferRow suggestions = 1;
  optional EmptyState empty = 2;
}

message TallyPaymentDraft {
  TallyTransferRow transfer = 1;
  // Prefilled with the suggestion; a smaller amount is a partial payment.
  string amount_text = 2;
  string amount_key = 3;
  // "Record it".
  string record_label = 4;
  bool can_record = 5;
  string issue = 6;
  // Where the payment lands: the finance ledger when you are a party.
  string foot = 7;
  string cancel_label = 8;
}

message TallySettleUpEvent {
  oneof kind {
    Opened opened = 1;
    Refreshed refreshed = 2;
    SuggestionPicked picked = 3;
    AmountChanged amount = 4;
    RecordTapped record = 5;
    DraftDismissed dismissed = 6;
  }

  message Opened {
    string group_id = 1;
    string draft_token = 2;
  }

  message Refreshed {}

  message SuggestionPicked {
    string key = 1;
  }

  message AmountChanged {
    string text = 1;
  }

  message RecordTapped {}

  message DraftDismissed {}
}

