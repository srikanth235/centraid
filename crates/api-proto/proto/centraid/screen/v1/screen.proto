    string key = 1;
  }

  message SearchOpened {}

  message SearchTermChanged {
    string term = 1;
  }

  message SearchClosed {}

  message SortPicked {
    NotesLibrarySort sort = 1;
  }

  message PinnedOnlyToggled {}

  message TagToggled {
    string concept_id = 1;
  }

  message WindowWidened {}

  message FilterCleared {}

  message SheetOpened {
    NotesLibraryState.Sheet sheet = 1;
  }

  message SheetClosed {}

  message RowMenuOpened {
    string note_id = 1;
  }

  message PinToggled {
    string note_id = 1;
  }

  message FileRequested {
