[package]
name = "centraid-candidates"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
centraid-evalsuite = { path = "../evalsuite" }
centraid-evalworld = { path = "../evalworld" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The ranker (`src/rank.rs`): its phrase table and date words are regular
# expressions; its query weights are insertion-ordered (float sums follow the
# query's word order).
indexmap = "2"
regex = "1"

[build-dependencies]
# `build.rs` derives the ranker's ontology tables (`onto.json`).
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
