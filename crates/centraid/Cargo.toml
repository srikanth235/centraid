[package]
name = "centraid"
description = "The operator's binary: `gateway install` and `doctor` (#1020, #1029)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "centraid"
path = "src/main.rs"

[dependencies]
centraid-api-proto = { path = "../api-proto" }
centraid-core = { path = "../core" }
# `seed-demo-vault` turns the demo's 24 words into the seed its core opens
# with, so Locker's demo items are sealed under the `K` those words derive
# (D-6). The words are a published test vector, never a member's.
centraid-identity = { path = "../identity" }
centraid-blobs = { path = "../blobs" }
centraid-vault = { path = "../vault" }
clap.workspace = true
serde_json.workspace = true
# The runtime `main` and `seed-demo-vault` build to drive the core's async
# byte plane. This binary opens no socket.
tokio = { workspace = true }
tracing-subscriber.workspace = true

[dev-dependencies]
# `tests/derive_sweep.rs` builds a `data:` URI.
base64.workspace = true
# THE RESTORE DRILL'S CRATES (#1029 W5). `tests/restore_drill.rs` drives the
# real keys (`centraid-identity`, above), the real vault and the real gateway
# rules together — which is the only way "lose the phone, type 24 words, get
# every vault back" is one claim rather than three. Dev-only: the binary itself
# is not a gateway and does not derive an account key.
centraid-gateway-core = { path = "../gateway-core" }
# THE ARM THAT CROSSES A SOCKET (#1029 W5B-4). The drill's wire half brings up
# a real `gateway-server` on `127.0.0.1:0` and talks to it through the phone's
# own client — so the signature, the four headers, the JSON and the
# `VAULT_MOVED` refusal are exercised end to end rather than described. Both are
# dev-only: this binary is not a gateway and does not sign a gateway request.
centraid-gateway-server = { path = "../gateway-server" }
centraid-gateway-client = { path = "../gateway-client" }
centraid-ontology = { path = "../ontology" }
hex.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tempfile.workspace = true
