[package]
name = "centraid"
description = "The operator's binary: `doctor` (#1020, #1029, #1080)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "centraid"
path = "src/main.rs"

[dependencies]
centraid-api-proto = { path = "../api-proto" }
centraid-core = { path = "../core" }
# `seed-demo-vault` turns the demo's 24 words into the seed its core opens
# with, so Locker's demo items are sealed under the `K` those words derive
# (D-6). The words are a published test vector, never a member's.
centraid-identity = { path = "../identity" }
centraid-blobs = { path = "../blobs" }
centraid-vault = { path = "../vault" }
clap.workspace = true
serde_json.workspace = true
# The runtime `main` and `seed-demo-vault` build to drive the core's async
# byte plane. This binary opens no socket.
tokio = { workspace = true }
tracing-subscriber.workspace = true

[dev-dependencies]
# `tests/derive_sweep.rs` builds a `data:` URI.
base64.workspace = true
# THE RESTORE DRILL ACROSS THE REAL GATEWAY (#1080). `tests/restore_drill.rs`
# drives the phone's core against `centraid_gateway::server::harness` — the
# gateway a member runs, TLS and SQLite and object files, on `127.0.0.1:0` —
# so the claim "lose the phone, type 24 words, get the vault back, and the old
# phone freezes" is proved over a socket. Dev-only: this binary is not a
# gateway. `image` writes the real JPEG the core derives its tiers from;
# `blake3` checks a restored original against its hash.
blake3.workspace = true
centraid-gateway = { path = "../gateway" }
image.workspace = true
centraid-ontology = { path = "../ontology" }
hex.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tempfile.workspace = true
