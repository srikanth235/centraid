[package]
name = "centraid-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_core"
path = "src/lib.rs"

[features]
default = []
# THE FAULT-INJECTION DOOR (#1020 wave 3, lane E finding 4). Makes a `Command`
# named `debug.panic` panic inside `Handle::call`, so a shell can prove its own
# clause-9 poison handling against the REAL library rather than a fake ABI.
# Never on in a release profile, and it exports nothing: `abi-five-symbols`
# still counts five.
debug-fault = []

[dependencies]
centraid-api-proto = { path = "../api-proto" }
# LOCKER'S PHONE LOADERS (#1047 L1): `app_query::locker` asks
# `centraid_apps_locker::phone` for the list, the item and the counts.
centraid-apps-locker = { path = "../apps/locker" }
# A LOCKER ONE-TIME CODE (#1047, Q-1047-16): RFC 6238 is HMAC-SHA-1, fixed by
# the specification every authenticator shares. Used by `locker::phone` alone,
# over a seed opened under `K` after the code's receipt lands; see the
# workspace manifest's note beside `sha1`.
hmac.workspace = true
sha1.workspace = true
# THE APP QUERIES THE PHONE ASKS FOR BY NAME (#1046). Agenda's `upcoming` joins
# six-plus tables and expands every series through the one recurrence engine,
# so it runs HERE, over the page door, and a shell draws its typed answer —
# rather than a second engine in each shell (D-1020-S1). `app_query` is the one
# module that reaches it.
centraid-apps-agenda = { path = "../apps/agenda" }
# Tasks' board, one task, projects, search and catch-up (#1046): the families,
# the recurrence collapse and every civil reading run here, over the page door.
centraid-apps-tasks = { path = "../apps/tasks" }
# Docs' drive, search, document and activity (#1046), the same way.
centraid-apps-docs = { path = "../apps/docs" }
# People's five phone queries (#1046) — the roster, Touch, the sheet, search and
# the trash shelf — answered the way Agenda's are, through `app_query`.
centraid-apps-people = { path = "../apps/people" }
# Notes' folds, for the `notes_*` app-query arms (#1046).
centraid-apps-notes = { path = "../apps/notes" }
# Tally's ten phone queries (#1046) — the ledger folded once through its one
# balance engine, every figure with its currency's exponent — the same way.
centraid-apps-tally = { path = "../apps/tally" }
# The door an app crate reads through (`PageDoor`), and the rows it answers.
centraid-apps-kit = { path = "../apps/kit" }
# THE ON-DEVICE CHAT PLANE: the native tool runtime, its turn loop, the attached
# and free replies and the `Model` trait an engine implements. It holds no
# vault; this crate gives it one through `assist::door::CoreDoor`.
centraid-assist = { path = "../assist" }
# THE FTS DOOR, for the app queries' search. It owns every `MATCH` in the workspace and
# takes a connection; the core hands it `Vault::read`'s, and writes no SQL.
centraid-search = { path = "../search" }
# THE ONE CONTENT STORE (#1025 S3, D-1025-S3-1). A core opens the vault, so a
# core is what attaches the byte door; `centraid_blobs::ContentBytes` is the
# door and this is the crate that has both halves in scope.
centraid-blobs = { path = "../blobs" }
# THE 24 WORDS AND THE KEYS (#1029 W15). A restore parses the phrase here and
# refuses a bad checksum before anything is derived from it; the vault's
# identity key signs a claim, and its root key is what every part is sealed
# and named under.
centraid-identity = { path = "../identity" }
# THE PHONE'S HALF OF THE GATEWAY PROTOCOL v2 (#1080): the pinned HTTPS client
# and the rules' own vocabulary — the pairing payload's parser, the claim's
# preimage, the refusal codes — so a phone and a gateway cannot disagree about
# either. The client feature alone: a phone links no listener, no SQLite of the
# gateway's and no certificate minting.
centraid-gateway = { path = "../gateway", default-features = false, features = [
  "client",
] }
# THE SEALED FORMAT (#1080, `centraid-sealed/2`): a part is sealed straight
# into the spool, and a fetched one opened and checked against its hash.
centraid-media = { path = "../media" }
# A library item is hashed as it streams through the stage door; BLAKE3 is the
# one hash (D-1025-S4-1).
blake3.workspace = true
# A vault id is hex in the ledger and on the wire.
hex.workspace = true
# The spool's budget is a tenth of the free space on its volume (`statvfs`).
rustix.workspace = true
# THE RUNTIME THE GATEWAY CLIENT RUNS ON, OWNED BY THE CORE (#1029 W15,
# #1080). The client is asynchronous and a phone has nobody else to own a
# runtime for it; `Handle::runtime_handle` builds one multi-threaded runtime
# and every flow `block_on`s it from the shell's own thread. This crate opens
# no socket of its own and listens on none.
tokio.workspace = true
# DECODING AND SCALING AN ATTACHED PHOTOGRAPH (`assist::attach`): the chat's
# model reads 448 pixels on the long edge, so the core decodes what the vault
# or the shell hands it and scales it before the engine ever sees it. The same
# pure-Rust decoder the derivatives are made with; no new codec.
image.workspace = true
# THE STORED THUMBNAIL of a camera-roll image rides the `chat.save_turn` command
# as a `data:` URI (`assist::store`).
base64.workspace = true
centraid-ontology = { path = "../ontology" }
centraid-protocol = { path = "../protocol" }
centraid-vault = { path = "../vault" }
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
# A REAL GATEWAY ON A REAL SOCKET for the phone's flows (#1080): the gateway
# crate's own test harness, the whole server, spawned on 127.0.0.1:0.
centraid-gateway = { path = "../gateway" }
# THE HARNESS'S DOOR for the chat's native runtime (#1088): the read-equality
# test opens a copy of the sample vault through it and asks the core's door the
# same questions.
centraid-nativetools = { path = "../nativetools" }
tempfile.workspace = true

[[test]]
name = "call_budget"
path = "tests/call_budget.rs"
