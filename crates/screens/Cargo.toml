[package]
name = "centraid-screens"
description = "The screen runtime: every decision a person sees is made here, in Rust (#1135)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_screens"
path = "src/lib.rs"

[dependencies]
centraid-api-proto = { path = "../api-proto" }
centraid-core = { path = "../core" }
prost.workspace = true
serde_json.workspace = true
# THE ONE PARTY HUE WHEEL: a project and a calendar are drawn in the hue their id lands on.
centraid-design = { path = "../design" }
# Locker's one-time-code seed rule is the app crate's (`totp::seed_of`): the
# editor says why a seed is refused with the core's own sentence, not a copy.
centraid-apps-locker = { path = "../apps/locker" }
# The generator draws from the operating system's CSPRNG.
rand.workspace = true
# The headless driver founds and seeds a scratch vault (`testing`).
centraid-ontology = { path = "../ontology" }
