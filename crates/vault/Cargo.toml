[package]
name = "centraid-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_vault"
path = "src/lib.rs"

[[bin]]
name = "export-ladder-ddl"
path = "src/bin/export-ladder-ddl.rs"

[features]
# Bugs planted on purpose, each behind a switch, so the simulation (`tests/backup_sim.rs`) can
# prove it would catch them (#1209, spec §8). Never enabled in a product build: the dev-dependency
# on this crate below turns it on for tests alone.
plant-bugs = []

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
blake3.workspace = true
centraid-gateway = { path = "../gateway", default-features = false }
centraid-media = { path = "../media" }
centraid-ontology = { path = "../ontology" }
ed25519-dalek.workspace = true
flate2.workspace = true
hex.workspace = true
jiff.workspace = true
jsonschema.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
# Turns on `plant-bugs` for this crate's own tests and for nothing else.
centraid-vault = { path = ".", features = ["plant-bugs"] }
# The derivative tests BUILD their fixtures (#1025 S3): a 4000x3000 JPEG with
# an EXIF orientation tag is not a file to check in, and the assertions read
# the produced thumbnail back as pixels rather than as a byte count.
image.workspace = true
# THE BYTE PLANE'S STORE, in the fixtures that need a content store (#1025 S3).
# A dev-dependency cycle — `centraid-blobs` depends on this crate for the door
# it implements — which cargo allows and which is the honest direction: the
# door belongs beside the store, and these tests want the real one.
centraid-blobs = { path = "../blobs" }
base64.workspace = true
proptest.workspace = true
tempfile.workspace = true
# `tests/page_source.rs` cross-checks `sqlite_dbpage` against SQLite's
# online-backup API under concurrent commits; production snapshots never use it.
rusqlite = { workspace = true, features = ["backup"] }
hex.workspace = true
centraid-ontology = { path = "../ontology" }
