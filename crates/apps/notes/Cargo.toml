[package]
name = "centraid-apps-notes"
description = "Notes as a projection of the vault: six queries, fifteen actions, and the powerbox over crates/search (#1020)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_apps_notes"
path = "src/lib.rs"

[dependencies]
centraid-apps-kit = { path = "../kit" }
# The FTS door. An app holds no `MATCH` (the kit's grammar has no production for
# one); the powerbox and `search` ask this crate (D-1020-N1).
centraid-search = { path = "../../search" }
# THE ONE ZONE ENGINE, for the Journal's local days (#1046). `time` is
# SQL-free and pure; this crate reaches `FireZone` and the instant parser and
# nothing else, as `crates/apps/agenda` does.
centraid-vault = { path = "../../vault" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
centraid-api-proto = { path = "../../api-proto" }
centraid-media = { path = "../../media" }
prost.workspace = true
rusqlite.workspace = true
