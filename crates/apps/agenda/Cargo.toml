[package]
name = "centraid-apps-agenda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_apps_agenda"
path = "src/lib.rs"

[dependencies]
centraid-apps-kit = { path = "../kit" }
# THE ONE RECURRENCE ENGINE (#1020, D-1020-S1, D-1020-S9). `centraid_vault::time`
# is SQL-free and pure; this crate reaches it for `expand`, `apply_exceptions`
# and the occurrence key, and for nothing else. A second expander in an app
# crate is the drift ONT-25 already is.
centraid-vault = { path = "../../vault" }
# The FTS door. An app holds no `MATCH` (the kit's grammar has no production for
# one), so `search`'s hits are asked of this crate and folded here (D-1020-N1),
# exactly as Notes asks for its own.
centraid-search = { path = "../../search" }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
rusqlite.workspace = true
