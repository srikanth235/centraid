[package]
name = "centraid-apps-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_apps_tasks"
path = "src/lib.rs"

[dependencies]
centraid-apps-kit = { path = "../kit" }
# THE ONE RECURRENCE ENGINE (#1020, D-1020-S1, D-1020-S9). `centraid_vault::time`
