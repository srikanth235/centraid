[package]
name = "centraid-apps-money"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_apps_money"
path = "src/lib.rs"

[features]
# The REAL command door links the vault's `execute`; the module is behind the
# feature as Tally's is, so what a surface compiles is the same. The vault
# itself is a plain dependency here (as Agenda's is): recurring detection
# projects through `centraid_vault::time`, the one recurrence engine, and a
# second expander in an app crate is the drift ONT-25 already is.
vault-door = []

[dependencies]
# ONE HASH (#1025 S4): the import's dedupe key is BLAKE3, like every other
# hash this repo defines itself. See `import::keys`.
blake3.workspace = true
centraid-apps-kit = { path = "../kit" }
centraid-vault = { path = "../../vault" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
centraid-ontology = { path = "../../ontology" }
rusqlite.workspace = true
