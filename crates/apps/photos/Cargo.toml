[package]
name = "centraid-apps-photos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_apps_photos"
path = "src/lib.rs"

[dependencies]
centraid-apps-kit = { path = "../kit" }
# The FTS door. An app holds no `MATCH`, so a search asks this crate for its hits
# and reads them back through the page door (D-1020-N1, #1097).
centraid-search = { path = "../../search" }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
centraid-media = { path = "../../media" }
centraid-vault = { path = "../../vault" }
centraid-ontology = { path = "../../ontology" }
rusqlite.workspace = true
