[package]
name = "centraid-apps-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_apps_kit"
path = "src/lib.rs"

[dependencies]
# ONE HASH (#1025 S4, D-1025-S4-1). The kit used to carry a hand-rolled SHA-256
# so it could depend on no hashing crate; a second implementation of the vault's
# dedupe key is worse than a dependency.
blake3.workspace = true
centraid-ontology = { path = "../../ontology" }
# THE SHARED RULES (#1135): the trash window is the vault's `TRASH_DAYS` and civil
# time is the vault's one reader, so `rules` re-states neither.
centraid-vault = { path = "../../vault" }
hex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
