[package]
name = "centraid-blobs"
description = "The byte plane: BLAKE3-addressed blobs, verified per chunk group, moved over a gated iroh lane and resumable at any interruption (#1020)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_blobs"
path = "src/lib.rs"

[dependencies]
centraid-protocol = { path = "../protocol" }
blake3.workspace = true
bytes.workspace = true
hex.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
centraid-net = { path = "../net" }
tempfile.workspace = true
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time",
  "io-util",
] }
