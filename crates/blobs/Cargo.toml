[package]
name = "centraid-blobs"
description = "The content store: a member's bytes on this device, one file per BLAKE3 hash, behind the vault's byte door (#1080)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_blobs"
path = "src/lib.rs"

[dependencies]
# THE VAULT'S BYTE DOOR, implemented here (`door.rs`), and the backup ledger
# whose `local_bytes` the door reads. The direction is blobs -> vault and
# never the reverse: `crates/vault` is host-agnostic (#1025 S3).
centraid-vault = { path = "../vault" }
blake3.workspace = true
hex.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
