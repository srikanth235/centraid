[package]
name = "centraid-protocol"
description = "The wire protocol: framing, request-id multiplexing, the handshake and the version window. No iroh type appears here (#1020)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_protocol"
path = "src/lib.rs"

[dependencies]
centraid-api-proto = { path = "../api-proto" }
prost.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
base64.workspace = true
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "macros", "time"] }
