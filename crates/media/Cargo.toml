[package]
name = "centraid-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# ONE DECLARATION OF THE 16 MiB CAP (F6, #1029 W17-5). It is a PROTOCOL number
# — the gateway refuses an object above it — so it is declared with the rules
# and imported here rather than restated. The dependency is light and one-way:
# `gateway-core` is a pure state machine over api-proto, blake3, ed25519-dalek,
# hex, serde and thiserror, and it does not know this crate exists.
centraid-gateway-core = { path = "../gateway-core" }
aes-gcm.workspace = true
anyhow.workspace = true
base64.workspace = true
# `centraid-object/1`'s AEAD (#1029 §4). `flate2` left with `cbsf.rs`: deflate
# was a CBSF frame algorithm and nothing else in this crate ever wrote one.
chacha20poly1305.workspace = true
hex.workspace = true
# The one image codec (#1025 S3, D-1025-S7-50); see the workspace manifest for
# why the feature set is this small and why derivatives are JPEG.
image.workspace = true
# Nonces and content keys come from `rand::rngs::OsRng` and from nowhere else
# (#1029 §4, B9).
rand.workspace = true
# ECMAScript number spelling: the canonicalizer must agree with
# `JSON.stringify`, not with serde_json's integer spelling (#1020, D-1020-R1).
ryu-js.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
blake3.workspace = true
thiserror.workspace = true
zstd.workspace = true

[dev-dependencies]
serde_json.workspace = true
