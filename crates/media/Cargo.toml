[package]
name = "centraid-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
# `centraid-sealed/2`'s AEAD (#1080).
chacha20poly1305.workspace = true
hex.workspace = true
# The one image codec (#1025 S3, D-1025-S7-50); see the workspace manifest for
# why the feature set is this small and why derivatives are JPEG.
image.workspace = true
# Nonces come from `rand::rngs::OsRng` and from nowhere else (#1080).
rand.workspace = true
# ECMAScript number spelling: the canonicalizer must agree with
# `JSON.stringify`, not with serde_json's integer spelling (#1020, D-1020-R1).
ryu-js.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
blake3.workspace = true
thiserror.workspace = true
zstd.workspace = true

[dev-dependencies]
base64.workspace = true
serde_json.workspace = true
# `sealed::FileSealer` writes each part to a temp path the caller supplies, so
# its tests need a directory of their own (#1080).
tempfile.workspace = true
