[package]
name = "centraid-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "centraid_identity"
path = "src/lib.rs"

[dependencies]
base64.workspace = true
bip39.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
hmac.workspace = true
# `getrandom` is named HERE rather than in the workspace table: it is what draws
# the ephemeral encapsulation key inside `hpke`, once per seal, and this is the
# one crate that seals. It was a `mint` feature while the hosted adapter had to
# link this crate on `wasm32` without an RNG backend; that adapter is struck
# from v0 (#1029, scope amendment 2026-09-21), so the feature is gone and the
# dependency is plain.
hpke = { workspace = true, features = ["getrandom"] }
pkarr.workspace = true
rand.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
url.workspace = true
x25519-dalek.workspace = true

[dev-dependencies]
iroh-dns-server.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
