[package]
name = "xtask"
description = "The v1 tree's only cross-cutting entrypoint: `cargo xtask gate` (#1020)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

# Deliberately small. The gate runner is on the edit-run loop, so every
# dependency here is charged to `local`'s two-minute budget: clap for the CLI,
# serde_json for the ledgers, and nothing else. The structural rules are
# hand-rolled scanners rather than `regex` or `tree-sitter` for the same reason
# (see src/rules.rs — tree-sitter arrives when a rule needs a parse tree).
[dependencies]
anyhow = { workspace = true }
# `photos-sample` regenerates the fixtures that name the Photos roll by its one
# hash (#1025 S4), so this tool computes the same digest the vault does.
base64 = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
# THE ONLY sha2 LEFT UNDER `crates/` (#1025 S4, D-1025-S4-5). `artifact-key`
# feeds GitHub Actions' cache key and `ci.rs` reads Subresource Integrity
# attributes; both are somebody else's protocol, and neither names anything
# inside a vault. Since #1025 S4 this is the only crate in the graph that pulls
# sha2 at all — `crates/vault` no longer does — so it is now an extra compile
# for the gate tool, and that is the correct place to pay it.
sha2 = { workspace = true }

[dev-dependencies]
# The artifact-key rules are asserted over throwaway trees, so the tests are
# about the rule and not about whatever this repository happens to contain.
tempfile = { workspace = true }
