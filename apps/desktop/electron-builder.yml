appId: dev.centraid.desktop
productName: Centraid
copyright: Copyright © Centraid

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  # Tray assets are resolved from dist/main.js via ../icon.png.
  - icon.png
  - iconTemplate.png
  - iconTemplate@2x.png
  - "!dist/**/*.map"

extraMetadata:
  main: dist/main.js

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # CI supplies signing secrets; null keeps local builds unsigned.
  identity: null

win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

linux:
  target:
    - AppImage
  category: Office
  # Keep the filename stable so self-update overwrites in place.
  artifactName: Centraid-${arch}.${ext}

publish:
  provider: github
  releaseType: release
  owner: srikanth235
  repo: centraid
