<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Centraid documentation</title>
  <desc id="desc">The phone holds the Centraid vault. Nine apps use its records. Backup devices store sealed copies.</desc>
  <rect width="1200" height="630" fill="{{page}}" />
  <rect x="64" y="64" width="1072" height="502" rx="12" fill="{{card}}" stroke="{{border}}" stroke-width="1" />
  {{mark}}
  <text x="204" y="146" fill="{{meta}}" font-family="{{font}}, Helvetica Neue, system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="1.5">CENTRAID DOCS</text>
  <text x="104" y="312" fill="{{meta}}" font-family="{{font}}, Helvetica Neue, system-ui, sans-serif" font-size="76" font-weight="600" letter-spacing="-1.5">Your phone.</text>
  <text x="104" y="400" fill="{{ink}}" font-family="{{font}}, Helvetica Neue, system-ui, sans-serif" font-size="76" font-weight="600" letter-spacing="-1.5">Your vault.</text>
  <text x="104" y="478" fill="{{body}}" font-family="{{font}}, Helvetica Neue, system-ui, sans-serif" font-size="30">Nine apps share records on one phone.</text>
  <text x="104" y="520" fill="{{body}}" font-family="{{font}}, Helvetica Neue, system-ui, sans-serif" font-size="30">Backup devices store sealed copies.</text>
</svg>
