<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Centraid documentation</title>
  <desc id="desc">A social preview card for Centraid docs.</desc>
  <!-- Drawn in the product's light theme, values taken from packages/design:
       #FDFDFC page, #F5F4F2 raised paper, #E5E4E1 the explicit boundary,
       #141414 / #5A5A58 the first two ink rungs, and #EFEEEB the hairline.
       A social renderer has no webfont, so the family names the product face
       first and falls back to whatever the rasterizer actually has; the ramp
       here is the product's — one face, two weights, no italic and no
       serif. -->
  <rect width="1200" height="630" fill="#FDFDFC" />
  <rect x="64" y="64" width="1072" height="502" rx="12" fill="#F5F4F2" stroke="#E5E4E1" stroke-width="1" />
  <!-- The product mark, at the icon chip's own 26% radius. -->
  <g transform="translate(104 104) scale(0.16)">
    <rect width="512" height="512" rx="112" fill="#111317" />
    <path d="M351 159a136 136 0 1 0 0 194" fill="none" stroke="#f4f1e9" stroke-width="54" stroke-linecap="round" />
    <circle cx="349" cy="256" r="28" fill="#3EC8B4" />
  </g>
  <text x="204" y="146" fill="#5A5A58" font-family="Instrument Sans, Helvetica Neue, system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="1.5">CENTRAID DOCS</text>
  <text x="104" y="312" fill="#5A5A58" font-family="Instrument Sans, Helvetica Neue, system-ui, sans-serif" font-size="76" font-weight="600" letter-spacing="-1.5">Your data. Your apps.</text>
  <text x="104" y="400" fill="#141414" font-family="Instrument Sans, Helvetica Neue, system-ui, sans-serif" font-size="76" font-weight="600" letter-spacing="-1.5">Your devices.</text>
  <text x="104" y="474" fill="#5A5A58" font-family="Instrument Sans, Helvetica Neue, system-ui, sans-serif" font-size="30">Local-first personal software with one private vault,</text>
  <text x="104" y="516" fill="#5A5A58" font-family="Instrument Sans, Helvetica Neue, system-ui, sans-serif" font-size="30">first-party apps, and peer-to-peer devices.</text>
  <path d="M914 130h154M914 170h116M914 210h154M914 250h94" stroke="#E5E4E1" stroke-width="6" stroke-linecap="round" />
</svg>
