<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Centraid documentation</title>
  <desc id="desc">The phone holds the Centraid vault. Nine apps use its records. Backup devices store sealed copies.</desc>
  <rect width="1200" height="630" fill="#F4F2EE" />
  <rect x="64" y="64" width="1072" height="502" rx="12" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1" />
    <g transform="translate(104 104) scale(1.053) translate(-22 -22)">
  <path d="M71.6 51.936 L85.744 37.791 A34 34 0 0 1 85.744 82.209 L71.6 68.064 Z" fill="#F48E04"/>
  <path d="M68.064 71.6 L82.209 85.744 A34 34 0 0 1 37.791 85.744 L51.936 71.6 Z" fill="#5698F8"/>
  <path d="M48.4 68.064 L34.256 82.209 A34 34 0 0 1 34.256 37.791 L48.4 51.936 Z" fill="#F83F6E"/>
  <path d="M51.936 48.4 L37.791 34.256 A34 34 0 0 1 82.209 34.256 L68.064 48.4 Z" fill="#00AA98"/>
  </g>
  <text x="204" y="146" fill="#6F6B64" font-family="Instrument Sans, Helvetica Neue, system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="1.5">CENTRAID DOCS</text>
  <text x="104" y="312" fill="#6F6B64" font-family="Instrument Sans, Helvetica Neue, system-ui, sans-serif" font-size="76" font-weight="600" letter-spacing="-1.5">Your phone.</text>
  <text x="104" y="400" fill="#1C1B19" font-family="Instrument Sans, Helvetica Neue, system-ui, sans-serif" font-size="76" font-weight="600" letter-spacing="-1.5">Your vault.</text>
  <text x="104" y="478" fill="#4A4741" font-family="Instrument Sans, Helvetica Neue, system-ui, sans-serif" font-size="30">Nine apps share records on one phone.</text>
  <text x="104" y="520" fill="#4A4741" font-family="Instrument Sans, Helvetica Neue, system-ui, sans-serif" font-size="30">Backup devices store sealed copies.</text>
</svg>
